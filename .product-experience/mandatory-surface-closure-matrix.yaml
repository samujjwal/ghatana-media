  - type: SDK
    id: media.sdk.logical
    purpose: proposed consumer binding for admitted operations
    authority: .product-experience/pdp-0-product-truth/applications-channels.yaml
    status: proposed-public-binding-unresolved
  - type: EVENT_STREAM
    id: media.events.logical
    purpose: lifecycle and finality observations
    authority: .product-experience/pdp-0-product-truth/state-models.yaml
    status: proposed-runtime-binding-unresolved
