  comments:
  - PDP-0 references, capability bounds, and proposal-action reachability require source-grounded reconciliation before semantic acceptance. The malformed capabilities.yaml families sequence and requirements.yaml indentation are repaired and parse locally with PyYAML; portable Node parser-backed CI coverage remains blocked because pnpm cannot resolve private @ghatana/tokens from the configured unauthenticated registry. The 445-bound, 385-reference, and 123-action gaps remain open.
  - PDP-1 observed interfaces are projections, not canonical meaning. PXD-007 approves nine PDP1 logical-operation proposals with the required 22-field shape and source inventory only. Their 146 UI actions partition into 11 single proposed links, one ambiguous link, and 134 unresolved. PDP3-002 found 27 HTTP operation IDs match OpenAPI and runtime-route inventories, while all 15 API/action mappings remain unresolved and no per-operation contracts exist. All 43 gRPC registry entries match active proto declarations; PDP1 proposes family links for 24 and leaves 19 unresolved, while all PDP3 experience bindings remain pending. The stale “26 active” count label was corrected to the 43-RPC source census with a focused regression; this does not resolve wire authority or semantic mappings. CLI remains 11 fixture commands versus 12 broader proposals (including unbound `media.cli.job.retry`). The 27-entry SDK registry remains unbound, with apparent parser false positives unresolved. Four Agent Tool handlers and 15 event names still lack complete canonical bindings. Do not infer semantic, wire, or runtime parity from inventory matches.
  - PDP-2 Shared binding remains blocked: the UI declares tokens/theme/design-system 0.1.2 without lockfile resolution or consumer verification, public registry lookups returned 404, and Explorer consumes none of the listed Shared packages. Keep the 0.1.0-SNAPSHOT observation until authorized package publication and verification; do not guess or copy.
  - PXD-013 approves PDP2-001 source inventory only: all ten plan-named Shared package paths and their inspected 0.1.0-SNAPSHOT manifests are tied to clean revision 495663b2d6b61c270367048cec54db8a06f22d69, separately from Media's declared 0.1.2 dependencies. No compatible publication or consumer binding is established; retain the blocker and do not substitute the sibling snapshot.
  - PXD-014 approves PDP2-002 pattern coverage and reference structure only: all thirteen required categories are catalogued, four standalone proposals are linked through templates, and three relevant screen contracts now resolve their GUI template and pattern refs. Canonical state/action/operation meaning, Shared package binding, screen behavior, accessibility, responsive/localization review, and visual evidence remain pending; no artifact-delete operation is claimed.
  - PXD-015 approves all fourteen PDP2-004 API convention files as proposals and confirms OpenAPI is only a projection of approved rules/bindings. API semantics, operation-specific wire bindings, API/identity/platform owner decisions, and runtime verification remain pending.
  - PXD-016 approves PDP2-005 CLI/SDK/Event/Agent Tool convention structure only. The four Agent Tool records include all required fields but are not admitted; runtime events remain separate from local client notifications; production interfaces, owner bindings, SDK status mapping, transport/finality, and delivery guarantees remain unresolved.
  - PXD-017 approves PDP3-001's media.screen-contract.v2 shape across all 47 canonical screens. Three template IDs match the PDP-2 catalog and the rest remain null; component/pattern refs remain proposals, the Web surface is a candidate, and layouts/tokens/domain/operation/state/entry/exit, fixtures, design centralization, behavior, accessibility, and verification remain open.
  - PXD-018 approves PDP3-002's exact 27 HTTP/43 gRPC inventories and 70 protocol records only. All HTTP semantic bindings and 19 gRPC logical-operation bindings remain unresolved; OpenAPI/protobuf have not been selected as canonical wire authorities. Four unquoted JSON Pointer request-schema values were quoted after review so YAML preserves them as scalars.
  - PXD-019 approves PDP3-003's target direction only: PDP-1 logical operation → PDP-3 protocol → wire projections → one thin/generated SDK. Current clients and nonconforming HTTP routes are tagged LEGACY_COMPATIBILITY; there is no accepted parity, generator, or migration, and active protobufs remain observed protocols.
  - PXD-020 approves PDP3-004 registry structure only: 11 fixture CLI commands, 27 SDK source entries, nine runtime event types separate from 15 local notifications, four non-admitted Agent Tool handlers, and 25 service implementation observations. No production interface or delivery guarantee is admitted.
  - PXD-021 approves only a source-grounded candidate channel-to-surface crosswalk for reference normalization. It does not admit any channel or infer deployment/runtime support; media.channel.api remains an abstract layer with no direct surface.
  - PXD-022 approves PDP3-005's structure only: 30 journey contracts and 130 structured ordered steps, with J-29/J-30 source step IDs preserved and 148 candidate surface refs normalized. Seven PDP-1 operation refs remain proposals; at least 123 operation bindings plus object/state/authority/decision/transition/handoff/requirements and step-specific outcomes remain unresolved; all verification is not-run.
  - PXD-005 approves PDP1-001 source-reconciliation/proposal structure only: 37 domain-object, 13 value-object, and 11 relationship records; seven observed-only candidate crosswalks; per-relationship source/proposal bases and non-storage caveats; explicit proposed/unaccepted sample-position context; and exact PDP-0 fragments. The five composite fragments were corrected, and the documented PyYAML check plus local authority/local checks pass. Domain meanings, identities, values, cardinalities, and projections remain unaccepted.
  - PDP3-001 now has a v2 structural regression over all 47 canonical screen proposals plus the separate job-family specialization. Three template IDs resolve to catalog entries, 44 remain null, and canonical layout IDs are absent. Screen refs, component/pattern refs, the candidate Web surface, and action consequence records remain proposals; token/domain/operation/state/entry/exit bindings, design centralization, fixtures, behavior, accessibility, responsive review, and verification remain open.
  - PDP3-004 inventories 11 fixture commands, 12 broader CLI proposals, 27 SDK method entries (with apparent false positives), 15 event names, four handlers, and 25 service implementation entries. Production CLI wiring, event semantics/delivery, per-tool authority/input/result/finality contracts, and product-to-product consumer contracts remain open.
  - PDP3-005 now has 30 contract files and 130 structured steps with the full required field shape; the focused regression passes and J-29/J-30 each retain four ordered step IDs. The per-step structure does not complete semantics: 123 canonical operation refs are null, object/state/authority/decision/transition/handoff/requirements remain largely unbound, candidate success/failure/recovery/context are not consistently allocated to steps, degraded behavior/postconditions are incomplete, and no step has verification evidence.
  - PXD-006 authorizes a structural migration of phase acceptance inputs: canonical PDP-0..PDP-3 only, an explicit pending PDP-1 aggregate gate, prior P1/P2 IDs preserved as legacy crosswalks after remapping to PDP-2/PDP-3, and Explorer moved to projection acceptance outside the phase list. No acceptance state changes are authorized.
  - PXD-007 approves PDP1-002's nine-operation proposal schema and source-denominator inventory only. All projection semantics and owner bindings remain pending; local duplicate-key-safe parsing and text regression do not constitute portable parser CI or phase acceptance.
  - PXD-008 approves PDP1-003 source-exact extraction structure only: 11 machine IDs/dimensions, 75 state spellings, and 49 ordered transition relations. Rights/consent remains empty where the PDP-0 source is empty; all semantic conflicts and lossy projection mappings remain unresolved. Duplicate-key-safe local reconciliation is not phase acceptance or runtime parity.
  - Owner review found active legacy phase-meaning metadata remaining after ledger normalization, including PDP-3 journey/action/view references and Explorer projection metadata. F15 tracks the source-aware label/field migration; stable work-item and ART-* identifiers remain preserved, acceptance states stay pending, and the browser sweep must be rerun after the normalization settles.
  - PXD-009 approves the active phase-label/metadata normalization only. The local browser rerun now passes after manifest generation and a fresh Vite build; this does not replace human visual/accessibility review or Tools-native evidence.
  - PXD-010 approves PDP1-004 source-inventory structure; PXD-012 approves per-event source-observation/evidence/provenance candidate links for seven runtime publisher call sites/nine concrete event types, distinct from 15 local client notifications. Actual event records, receipts/finality, canonical taxonomy, producer authority, object/version meaning, ordering, replay/deduplication, compatibility, privacy, and recovery remain unresolved; the F16 source-inventory subfinding is addressed, while the broader architecture/event-contract gap remains.
  - PXD-011 approves PDP1-005 registry structure only. Job version/fencing, checksums, sourceArtifactIds, purge mechanisms, and restart handling remain observations rather than proof of durable attempts, immutable bytes/version identity, complete ancestry, all-store erasure, or provider outcome reconciliation; privacy, offline/replay, retention, and cross-product owner decisions remain pending.
  - Independent Luna security/privacy/operability review confirms that consent checks, sanitizer allowlists, purge interfaces, lifecycle HTTP publication, logs, and cancellation states are implementation observations only. Production identity and consent-revocation coverage, provider-purpose disclosure bounds, storage/provider-wide erasure, durable event delivery and telemetry, and restart/reconciliation safety need owner bindings and runtime evidence; retain the existing gap-found/blocked classifications.
  - Independent specialist source review is complete; P0-010, specialist owner disposition/runtime evidence, Tools currentness/receipts, and external owner acceptance remain pending.
