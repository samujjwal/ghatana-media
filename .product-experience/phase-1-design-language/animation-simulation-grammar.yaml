schemaVersion: media.animation-simulation-grammar.v1
productId: media
authority: Media presentation grammar for animation and simulation; Phase 0 owns domain/time/fidelity meaning
status: authored-proposal; graphics-simulation-and-domain-owner-review-pending
sourceRefs:
  - .product-experience/phase-0-product-truth/time-units-fidelity.yaml
  - .product-experience/phase-0-product-truth/quality-policy.yaml
rules:
  - Keep animation/story time, media presentation time, simulation time, and wall-clock deadlines visibly distinct.
  - Identify the active clock and units beside the timeline or instrument that uses it.
  - Label the source, model, solver, and conversion loss before presenting a simulation result.
  - Scrubbing or pausing a presentation never silently advances or changes the simulation model.
  - A plausible render does not imply validated domain behavior.
sharedPatterns:
  timeline: selectable-track-list-plus-precise-time-control-with-numeric-alternative-to-dragging
  keyframes: announce-selected-object-property-time-and-value
  simulationInstrument: show-unit-method-applicability-uncertainty-and-fidelity-class
  unsupportedConversion: preserve-source-model-and-report-the-lost-or-unmapped-feature
