schemaVersion: media.product-experience-authority-map.v1
productId: media
mode: authored-concept-ownership-map
status: migration-boundary-accepted; full-PDP-0-and-later-PDP-acceptance-pending
artifactPathBase: .product-experience/
externalOwnerPathBase: owner-repository-root-relative
sourceOwnership:
  semanticAuthorityRepository: ghatana-media
  semanticAuthorityPath: .product-experience/
  scope: all-authored-Media-PDP-0-through-PDP-3-product-meaning-and-acceptance-inputs
  codeRepository: ghatana/services/media
  codeRepositoryRole: implementation-and-runtime-contract-source-only
  competingProductDefinitionAuthority: prohibited
  migrationStatus: authority-is-declared-here; implementation-source-migration-is-separate-and-does-not-create-a-second-semantic-owner
  authorityTransferRule: moving-runtime-code-does-not-transfer-product-meaning; transfer-requires-a-versioned-owner-approved-decision-and-atomic-source-manifest-update
canonicalPdpPhases:
- id: PDP-0
  path: .product-experience/pdp-0-product-truth/
  semanticOwner: media-product
- id: PDP-1
  path: .product-experience/pdp-1-domain-data/
  semanticOwner: media-product
- id: PDP-2
  path: .product-experience/pdp-2-design-interface-system/
  semanticOwner: media-product; Shared owns generic primitives and tokens
- id: PDP-3
  path: .product-experience/pdp-3-product-experience/
  semanticOwner: media-product
- id: EXPLORER
  path: .product-experience/explorer/
  semanticOwner: media-product; projection owner does not own PDP meaning
  outsidePdpPhases: true
sourceRefs:
- master-plan:section-5.1
- master-plan:section-5.2
- product-truth:P0-001-boundary-slice
- decision:MDI-001
authorityRules:
- id: AUTH-RULE-ONE-OWNER
  rule: Each semantic concept has one editable owner; consumer records and projections do not become parallel authorities.
- id: AUTH-RULE-PHASE-BOUNDARY
  rule: A later phase may project accepted upstream meaning but may not silently introduce or change it.
- id: AUTH-RULE-STATUS-SEPARATION
  rule: Authored meaning does not imply implementation, license admission, qualification, runtime availability,
    or release readiness.
- id: AUTH-RULE-EXTERNAL-OWNER
  rule: External owner contracts remain canonical; Media records public references, adapters, compatibility needs,
    and unresolved bindings.
- id: AUTH-RULE-ACCEPTANCE
  rule: Only the P0-001 boundary slice is currently accepted; all other PDP-0 records are proposals pending owner
    review and P0-010.
- id: AUTH-RULE-REUSABLE-PRODUCT-MECHANICS
  rule: ghatana-tools owns reusable Product Definition, Experience, and generic Explorer mechanics; Media owns its
    product-specific declarations, facts, state, actions, effects, and fixtures. Media is a consumer and does not
    create a parallel generic host, schema, validator, or lifecycle engine.
- id: AUTH-RULE-CLOSURE-AND-EVIDENCE
  rule: ghatana-lifecycle owns cross-repository closure, evidence admission, semantic currentness, receipts, and
    convergence outputs. Tools may supply reusable product/experience mechanics and inputs; Media-authored audits
    are applicability/input records and cannot assign CLOSED, CURRENT, READY, receipt, or distance results.
phaseAuthorities:
