  actionDefinitionSemantics:
    actionRef: media.action.attach-source-asset
    reviewDecisionRef: .product-experience/decision-log.md#PXD-052
    runtimeAdmission: NOT_ADMITTED
    effectKind: state-change
    reversibility:
      kind: NOT_REVERSIBLE
      scope: The action records a reference in a new project revision; it does not alter the immutable artifact. No undo operation is defined.
    operationBinding: canonical-operation-unbound
    publicEffect:
      id: media.effect.attach-source-version
      name: Attach source version
      kind: state-change
      description: Create a new project revision that references the exact immutable artifact version without changing its bytes.
      reversible: false
    publicFinality:
      id: media.finality.attach-source-version
      actionRef: media.action.attach-source-asset
      description: Confirm only when the new project revision records the exact artifact-version reference.
      confirmationRequired: true
      undoable: false
