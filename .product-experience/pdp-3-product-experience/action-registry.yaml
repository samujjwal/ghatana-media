  preconditions: [current-principal-and-workspace, exact-source-selected, current-upload-and-import-authority, rights-consent-retention-and-format-admission]
  confirmation: show-the-source-name-and-owner-admitted-transfer-limits-before-beginning
  effect: establish-one-stable-upload-identity-and-accept-only-owner-acknowledged-bounded-parts
  reversible: not-after-accepted-parts-without-an-explicit-owner-policy-and-recorded-disposition
  finality: upload-receipt-is-not-artifact-availability; verification-must-record-size-digest-format-and-policy-disposition
  failure: preserve-the-stable-upload-identity; inspect-an-unknown-result-before-starting-another-upload
  actionDefinitionSemantics:
    actionRef: media.action.begin-artifact-upload
    sourceDecisionRef: .product-experience/decision-log.md#PXD-049
    reviewDecisionRef: .product-experience/decision-log.md#PXD-052
    runtimeAdmission: NOT_ADMITTED
    effectKind: state-change
    reversibility:
      kind: CONDITIONAL
      scope: Before any accepted part, an unstarted session may be abandoned under applicable policy; after acknowledged parts, disposition depends on retention and owner policy.
    publicBooleanDisposition: PUBLIC_BOOLEAN_NOT_REPRESENTABLE
    finalityScope: A begin receipt establishes an upload identity only; it proves neither accepted bytes nor artifact availability.
    guards: [current-principal-and-workspace, upload-and-import-authority, applicable-rights-consent-retention-and-format-policy, stable-request-identity]
- id: media.action.resume-artifact-upload
  label: Resume this upload
  actorRefs: [media.creator, media.editor]
  capabilityRefs: [media.artifact.upload.resume]
  preconditions: [existing-stable-upload-identity, current-tenant-and-owning-principal-scope, matching-source-metadata-and-immutable-request-binding, current-authority-and-retention-policy, observed-state-permits-continuation]
  effect: inspect-the-same-upload-first; recheck-current-authority-source-and-state; require-explicit-user-confirmation; append-only-remaining-contiguous-parts; complete-only-the-same-unexpired-complete-session
  reversible: not-after-accepted-parts-without-an-explicit-owner-policy-and-recorded-disposition
  finality: inspection-is-read-only; append-remains-RECEIVING; completion-enters-VERIFYING-only-after-exact-size-and-full-digest-checks; no-AVAILABLE-rights-or-attachment-claim
  failure: unknown-inspection-does-not-authorize-mutation; inspect-after-unknown-before-any-command; never-append-in-FINALIZING-COMPLETED-ABORTED-EXPIRED; preserve-same-identity
  compoundWorkflow:
    status: SOURCE_DEFINED_OWNER_ACCEPTED
    decisionRef: .product-experience/decision-log.md#PXD-049
    sourceRef: .product-experience/pdp-1-domain-data/action-contracts.yaml#operationSliceBindings
    orderedOperationRefs: [media.operation-slice.inspect-upload, media.operation-slice.append-upload-chunk, media.operation-slice.complete-upload]
    guards: [inspect-same-upload, recheck-authority-source-and-state, require-explicit-user-confirmation, append-only-remaining-contiguous-parts, inspect-after-unknown-never-auto-replay, never-append-finalizing-or-terminal-state]
    runtimeAdmission: NOT_ADMITTED
  componentRefs:
  - media.component.activity-recovery-feed
  - media.component.artifact-transfer-status
  - media.component.cli-output
  componentBindingState: component-use-proposed; interaction-and-owner-binding-pending
  actionDefinitionSemantics:
    actionRef: media.action.resume-artifact-upload
    sourceDecisionRef: .product-experience/decision-log.md#PXD-049
    reviewDecisionRef: .product-experience/decision-log.md#PXD-052
    runtimeAdmission: NOT_ADMITTED
    effectKind: state-change
    reversibility:
      kind: CONDITIONAL
      scope: Inspection is read-only; acknowledged appended parts persist subject to owner retention and disposition policy.
    publicBooleanDisposition: PUBLIC_BOOLEAN_NOT_REPRESENTABLE
    finalityScope: Append preserves RECEIVING; complete may enter VERIFYING only after exact size and full digest checks; only current authoritative verification evidence may establish AVAILABLE.
    orderedOperationRefs: [media.operation-slice.inspect-upload, media.operation-slice.append-upload-chunk, media.operation-slice.complete-upload]
    guards: [inspect-same-upload, recheck-authority-source-and-state, explicit-confirmation-before-append-or-complete, append-only-remaining-contiguous-parts, inspect-after-unknown-never-auto-replay, never-append-finalizing-or-terminal-state]
