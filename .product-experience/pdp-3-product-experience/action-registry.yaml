      sourceContractRef: .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts.records/media.operation.capability.media-stream-session-reconnect
    effect: Request a fenced reconnect for the same existing tenant-scoped live session only after exact session identity, current consent and purpose, lease and fence, prior-frame receipts, recovery budget, and next safe frame sequence are verified. This requests a transport and lease handshake; it does not assert that the session was restored or that a frame was sent.
    finality: Only a current authoritative session-owner receipt bound to the exact session and request may report reconnect state; dispatch or transport acknowledgement is not success. A missing or ambiguous receipt remains UNKNOWN_OUTCOME, and reconnect does not imply any frame was sent.
