  schemaId: media.view-observation-schema.owner-profile-state.v1
- id: media.view-observation-schema.owner-provenance-state.v1
  factKind: OWNER_PROVENANCE_STATE
  description: Exact-version lineage observation with explicit completeness and access scope.
  runtimeAdmission: NOT_ADMITTED
  schemaDisposition: RAW_SOURCE_FACT_SCHEMA_NOT_YET_AUTHORED; labels remain UNKNOWN
  schemaId: media.view-observation-schema.owner-provenance-state.v1
- id: media.view-observation-schema.local-draft.v1
  factKind: LOCAL_DRAFT
  description: Closed local editor snapshot compared structurally with the exact base snapshot; does not imply persistence.
  closedSchema:
    $id: https://media.gatana/schemas/local-draft-v1
    type: object
    additionalProperties: false
    required: [viewRef, sessionId, draftId, draftRevision, baseVersionRef, draftValue, baseValue, observedAt]
    properties:
      viewRef: {type: string, minLength: 1}
      sessionId: {type: string, minLength: 1}
      draftId: {type: string, minLength: 1}
      draftRevision: {type: integer, minimum: 1}
      baseVersionRef: {type: string, minLength: 1}
      draftValue: {$ref: '#/$defs/jsonValue'}
      baseValue: {$ref: '#/$defs/jsonValue'}
      observedAt: {type: string, format: date-time}
    $defs:
      jsonValue:
        anyOf:
        - {type: 'null'}
        - {type: string}
        - {type: boolean}
        - {type: number}
        - {type: array, items: {$ref: '#/$defs/jsonValue'}}
        - {type: object, additionalProperties: {$ref: '#/$defs/jsonValue'}}
  trustedContextSchema:
    type: object
    additionalProperties: false
    required: [viewRef, sessionId, draftId, baseVersionRef, now, maxAgeMs]
    properties:
      viewRef: {type: string, minLength: 1}
      sessionId: {type: string, minLength: 1}
      draftId: {type: string, minLength: 1}
      baseVersionRef: {type: string, minLength: 1}
      now: {type: string, format: date-time}
      maxAgeMs: {type: integer, minimum: 0}
  semanticBoundary:
    equality: Structural equality after canonical JSON object-key ordering; array order is significant.
    nonClaim: A clean local draft is not proof that a save occurred; persisted state requires an exact owner receipt/read.
  evaluator: scripts/lib/media-view-observation-definition.mjs#evaluateLocalDraftSnapshot
  runtimeAdmission: NOT_ADMITTED
  schemaId: media.view-observation-schema.local-draft.v1
- id: media.view-observation-schema.local-draft-clean.v1
  factKind: LOCAL_DRAFT_CLEAN
  description: Closed local editor snapshot equal to the exact base snapshot; does not imply that a save occurred.
  closedSchema:
    $id: https://media.gatana/schemas/local-draft-clean-v1
    type: object
    additionalProperties: false
    required: [viewRef, sessionId, draftId, draftRevision, baseVersionRef, draftValue, baseValue, observedAt]
    properties:
      viewRef: {type: string, minLength: 1}
      sessionId: {type: string, minLength: 1}
      draftId: {type: string, minLength: 1}
      draftRevision: {type: integer, minimum: 1}
      baseVersionRef: {type: string, minLength: 1}
      draftValue: {$ref: '#/$defs/jsonValue'}
      baseValue: {$ref: '#/$defs/jsonValue'}
      observedAt: {type: string, format: date-time}
    $defs:
      jsonValue:
        anyOf:
        - {type: 'null'}
        - {type: string}
        - {type: boolean}
        - {type: number}
        - {type: array, items: {$ref: '#/$defs/jsonValue'}}
        - {type: object, additionalProperties: {$ref: '#/$defs/jsonValue'}}
  trustedContextSchema:
    type: object
    additionalProperties: false
    required: [viewRef, sessionId, draftId, baseVersionRef, now, maxAgeMs]
    properties:
      viewRef: {type: string, minLength: 1}
      sessionId: {type: string, minLength: 1}
      draftId: {type: string, minLength: 1}
      baseVersionRef: {type: string, minLength: 1}
      now: {type: string, format: date-time}
      maxAgeMs: {type: integer, minimum: 0}
  semanticBoundary:
    equality: Structural equality after canonical JSON object-key ordering; array order is significant.
    nonClaim: A clean local draft is not proof that a save occurred; persisted state requires an exact owner receipt/read.
  evaluator: scripts/lib/media-view-observation-definition.mjs#evaluateLocalDraftSnapshot
  runtimeAdmission: NOT_ADMITTED
  schemaId: media.view-observation-schema.local-draft-clean.v1
schemaBoundary: No display-label enumerations are normative input facts. Only closedSchema records are executable; other family
  rows are pending and must evaluate UNKNOWN until a source-backed raw schema and predicate are authored.
