schemaVersion: media.pdp-3.search-inspection-observations.v1
productId: media
status: observation-only; canonical-search-inspection-definitions-in-search-inspection-contracts.yaml; runtime-not-admitted
authorityBoundary: This file records observed screen and protocol facts only. It does not define or own search or inspection identities, domain semantics, query semantics, runtime authorization, execution, or acceptance.
canonicalDefinitionSource: .product-experience/pdp-3-product-experience/search-inspection-contracts.yaml
searchObservations:
  status: source-observations-only; not-search-execution-contract
  projects:
    canonicalSearchRef: media.search.authorized-projects
    sourceRefs: [.product-experience/pdp-3-product-experience/screen-contracts/find-projects.yaml]
    observedStates: [loading, projects-available, no-matching-projects, workspace-empty, stale-results, access-denied, offline]
    requestFilters: not-declared
    permissionSafeCount: not-declared
    sorting: not-declared
    pagination: not-declared
    exactResultAndError: not-declared
    staleOrUnknown: stale-results-state-declared; unknown-search-outcome-not-declared
  artifacts:
    canonicalSearchRef: media.search.authorized-artifacts
    sourceRefs: [.product-experience/pdp-3-product-experience/screen-contracts/browse-media.yaml]
    observedStates: [loading, artifacts-available, workspace-empty, no-results, stale-results, identity-required, access-denied, offline]
    requestFilters: not-declared
    permissionSafeCount: not-declared
    sorting: not-declared
    pagination: not-declared
    exactResultAndError: not-declared
    staleOrUnknown: stale-results-state-declared; unknown-search-outcome-not-declared
  jobs:
    canonicalSearchRef: media.search.authorized-jobs
    sourceRefs:
      - .product-experience/pdp-3-product-experience/api/operations/listMediaJobs.yaml
      - contracts/openapi/media.yaml
    observedRequest: tenant-header-and-limit-query; limit-minimum-1-maximum-1000-default-100
    observedResponse: required-jobs-array-of-ProcessingJob; no-count-field-declared
    observedAccessMetadata: requires-authentication-and-tenant; required-access-operator
    requestFilters: no-filter-parameters-declared
    permissionSafeCount: no-count-field-declared; authorized-count-semantics-unresolved
    sorting: not-declared
    pagination: limit-only; continuation-token-offset-and-page-metadata-not-declared
    exactResultAndError: 200-jobs-array-observed; canonical-error-mapping-not-declared
    staleOrUnknown: outcome-unknown-is-a-job-status-not-a-search-result; freshness-semantics-unresolved
  unresolvedSemantics:
    ownerDecision: PXD-027 selects the search definition semantics in the canonical source; query filters, counts, sort, continuation, error shape and freshness remain unresolved where no source contract exists.
    fields: [request-filter-schema, permission-safe-count-rules, sort-keys-and-order, pagination-continuation, exact-search-error-shape, search-freshness-and-unknown-outcome]
inspectionObservations:
  status: source-index-and-evidence-availability-observations-only; canonical-inspection-definitions-in-search-inspection-contracts.yaml
  specification:
    canonicalInspectionRef: media.inspection.specification
    sourceRefs: [.product-experience/source-manifest.yaml, .product-experience/pdp-3-product-experience/COMPLETE-PRODUCT-EXPERIENCE.md]
    observation: Indexed records describe proposals and their declared source locations; indexing alone does not show semantic acceptance or currentness.
  authority:
    canonicalInspectionRef: media.inspection.authority
    sourceRefs: [.product-experience/authority-map.yaml, .product-experience/source-manifest.yaml]
    observation: Declared ownership and authority references do not establish current lifecycle admission.
  evidence:
    canonicalInspectionRef: media.inspection.evidence
    sourceRefs: [.product-experience/explorer/verification-matrix.yaml, .product-experience/acceptance.yaml]
    observation: Evidence availability and acceptance records do not imply a receipt or pass.
  trace:
    canonicalInspectionRef: media.inspection.trace
    sourceRefs: [.product-experience/source-manifest.yaml, .product-experience/traceability.yaml]
    observation: Listed identifiers and authored relations do not imply missing dependency closure.
  syntheticSimulation:
    canonicalInspectionRef: media.inspection.synthetic-simulation
    sourceRefs: [.product-experience/pdp-3-product-experience/scenario-fixture-registry.yaml, .product-experience/pdp-3-product-experience/simulation-semantics.yaml]
    observation: Deterministic fixtures are synthetic examples and do not establish production runtime behavior or qualification.
execution:
  status: NOT_ADMITTED
  reason: The canonical ExperienceSpecification definitions declare types and inspection kinds; this observation artifact provides neither search execution nor inspection rendering or authorization enforcement.
independentAcceptance:
  status: PENDING
  reason: PXD-027 selects bounded owner semantics only; independent PDP-3 acceptance and applicable runtime qualification remain open.
