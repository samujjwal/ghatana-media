contractObservationPolicy:
  authority: Java handler source is authoritative only for behavior directly visible in each adapter.
  schemaVersion: NOT_DECLARED_BY_HANDLER
  inputSchema: Media adapters enforce closed top-level key sets and local field validation, but these Java checks are not a published JSON Schema and do not establish a canonical public schema.
  delegateInputForwarding: If configured, every handler delegates the original envelope and ToolContract through AgentToolInput.dispatch; it does not construct a filtered or normalized request. The returned result is checked for invocationId equality.
  outputSchema: Delegate results are passed through; no successful output schema is validated by these handlers.
  asynchronousFailure: The adapter preserves delegate rejection and synchronous throw, and rejects null promise or mismatched invocationId results. The DefaultToolExecutor boundary maps effectful post-dispatch ambiguity to non-final OUTCOME_UNKNOWN and read-only rejection to FAILED; direct handler use preserves the rejection channel.
  localFailedResultArguments: ToolExecutionResult.failed receives invocationId for both its first and third arguments, the observed end Instant, and Duration.between(start, end).
  localFailedResultMapping: "Sibling Tools source observation only (runtime/java/tool-contracts/.../ToolExecutionResult.java): the failed(String, String, String, Instant, Duration) factory maps these non-code messages to status FAILED and failure kind INTERNAL/stage EXECUTION; its code normalizer falls back to TOOL_EXECUTION_FAILED for messages that are not a valid code. Installed package resolution and owner acceptance are not established by this Media observation."
  preTryNullArguments: Objects.requireNonNull(envelope/contract) executes before the try block in each handler, so a null argument throws directly. Envelope/contract tool ID, version and action-class mismatch is now rejected inside the validation boundary.
  runtimeAndAvailability: UNRESOLVED; factory registration does not prove a configured delegate, runtime availability, or production readiness.
  operationBinding: UNRESOLVED; tool identifiers are observed handler IDs and are not mapped to PDP-1 operations here.
  executionAdmitted: false
