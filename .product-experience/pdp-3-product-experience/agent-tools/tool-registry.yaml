contractObservationPolicy:
  authority: Java handler source is authoritative only for behavior directly visible in each adapter.
  schemaVersion: NOT_DECLARED_BY_HANDLER
  inputSchema: Media adapters enforce closed top-level key sets and local field validation, but these Java checks are not a published JSON Schema and do not establish a canonical public schema.
  delegateInputForwarding: None of the four current handlers dispatches. Each validates the envelope, returns typed NOT_ADMITTED for valid-shaped input, and ignores any compatibility-constructor delegate. AgentToolInput.dispatch is an unbound utility and has no current handler call site.
  outputSchema: AgentToolInput.dispatch validates a successful delegate output against the supplied ToolContract outputSchema (Draft 2020-12, strict keywords, remote resources disabled, bounded serialized characters/depth/nodes). No current handler dispatches or accepts a success result, and an empty schema remains unresolved; this utility does not bind the four YAML descriptors as public result schemas or prove output meaning, provenance, or finality.
  asynchronousFailure: 'AgentToolInput.dispatch preserves delegate rejection and synchronous throw, and rejects null promises, mismatched invocationId results, and malformed successful payloads on its promise error channel. This is utility behavior only: the four handlers do not dispatch. The DefaultToolExecutor maps effectful post-dispatch ambiguity to non-final OUTCOME_UNKNOWN; direct utility use preserves its rejection channel.'
  localFailedResultArguments: ToolExecutionResult.failed receives invocationId for both its first and third arguments, the observed end Instant, and Duration.between(start, end).
  localFailedResultMapping: "Sibling Tools source observation only (runtime/java/tool-contracts/.../ToolExecutionResult.java): the failed(String, String, String, Instant, Duration) factory maps these non-code messages to status FAILED and failure kind INTERNAL/stage EXECUTION; its code normalizer falls back to TOOL_EXECUTION_FAILED for messages that are not a valid code. Installed package resolution and owner acceptance are not established by this Media observation."
  preTryNullArguments: Objects.requireNonNull(envelope/contract) executes before the try block in each handler, so a null argument throws directly. Envelope/contract tool ID, version and action-class mismatch is now rejected inside the validation boundary.
  runtimeAndAvailability: NOT_ADMITTED; factory registration and compatibility constructors do not establish an active delegate, runtime availability, or production readiness.
  operationBinding: Media operation candidates must remain distinct from handler/runtime parity; exact operation IDs below are definition-only candidates, not proof of handler/API equivalence or Shared runtime binding.
  executionAdmitted: false
