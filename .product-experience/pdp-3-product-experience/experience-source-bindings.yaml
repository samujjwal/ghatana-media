recoveryCrossReferences:
  - recoveryRef: media.recovery.language-uncertain
    scenarioRefs: [media.scenario.language-uncertain]
    actionRefs: [media.action.correct-caption]
    rationale: Recovery permits manual correction or retaining a draft; the linked fixture has uncertain transcript language and the action edits caption text without asserting recognition certainty.
  - recoveryRef: media.recovery.alignment-incomplete
    scenarioRefs: [media.scenario.alignment-required]
    actionRefs: [media.action.align-caption-timing]
    rationale: Recovery permits explicit time-range entry or retaining a draft; the linked fixture has a missing segment end time.
  - recoveryRef: media.recovery.consent-revoked
    scenarioRefs: [media.scenario.consent-revoked]
    actionRefs: [media.action.request-transcription]
    rationale: The linked fixture denies processing after consent revocation; the exact action is the guarded processing request whose effect must remain blocked.
  - recoveryRef: media.recovery.outcome-unknown
    scenarioRefs: [media.scenario.job-outcome-unknown]
    actionRefs: [media.action.view-job-status, media.action.check-job-outcome]
    rationale: The recovery path names observing or checking the existing job; both actions are read-only and the fixture preserves OUTCOME_UNKNOWN.
  - recoveryRef: media.recovery.version-conflict
    scenarioRefs: [media.scenario.caption-conflict]
    actionRefs: [media.action.resolve-caption-conflict]
    rationale: The recovery path preserves both versions and requires an explicit resolution; the linked fixture has concurrent caption versions and a conflicted draft.
j01StepBindings:
  status: SOURCE_DEFINED_OWNER_ACCEPTED
  journeyRef: J-01
  sourceDecisionRef: .product-experience/decision-log.md#PXD-054
  reviewDecisionRef: .product-experience/decision-log.md#PXD-055
  runtimeAdmission: NOT_ADMITTED
  steps:
    - stepId: J01-1
      screenRef: media.view.authenticate-and-select-context
      actorRefs: [media.creator, media.editor, media.administrator]
      operationRef: null
      externalHandoffRef: media.handoff.identity
      domainObjectRefs: []
      authority: Shared admitted identity contract establishes trusted principal and authorized workspace; Media does not authenticate or infer authority from actor labels.
      transitionDisposition: NOT_APPLICABLE_WITH_REASON
      transitionReason: External identity/context handoff; no Media domain state changes.
    - stepId: J01-2
      screenRef: media.view.resume-work
      actorRefs: [media.creator, media.editor]
      operationRef: media.operation-slice.list-projects
      domainObjectRefs: [media.domain.project]
      stateRefs: [media-project/ACTIVE, media-project/ARCHIVED]
      authority: Current trusted tenant/principal plus currently authorized selected workspace; project policy filters every returned summary.
      transitionDisposition: NOT_APPLICABLE_WITH_REASON
      transitionReason: Time-scoped authorized collection query; empty results are not global absence.
    - stepId: J01-3
      screenRef: media.view.find-projects
      actorRefs: [media.creator, media.editor, media.administrator]
      actionRef: media.action.create-project
      operationRef: media.operation-slice.create-project
      domainObjectRefs: [media.domain.project, media.domain.project-revision]
      stateRefs: [media-project/ACTIVE, media-project-version/COMMITTED]
      authority: Trusted tenant/principal, selected authorized workspace, and current project-create policy at effect boundary; actor labels do not grant permission.
      transitionDisposition: NOT_APPLICABLE_WITH_REASON
      transitionReason: Atomic initial aggregate creation establishes ACTIVE project and empty immutable COMMITTED revision; no transition edge is inferred.
      unknownRecoveryOperationRef: media.operation-slice.inspect-project
      unknownRecoverySelector: creationRequestId bound to the same tenant/principal/workspace/title; absence or unavailable observation is not proof of no effect.
    - stepId: J01-4
      screenRef: media.view.work-in-project
      actorRefs: [media.creator, media.editor, media.reviewer]
      operationRef: media.operation-slice.inspect-project
      domainObjectRefs: [media.domain.project, media.domain.project-revision]
      stateRefs: [media-project/ACTIVE, media-project/ARCHIVED, media-project-version/COMMITTED]
      authority: Current authorization for the exact project in the selected tenant/workspace; reads expose project/revision metadata only.
      transitionDisposition: NOT_APPLICABLE_WITH_REASON
      transitionReason: Exact project head observation is read-only; it grants no artifact rights or availability.
  screenApplicability:
    required: [media.view.authenticate-and-select-context, media.view.resume-work, media.view.find-projects, media.view.work-in-project]
    optionalPostJourneyContinuation: media.view.create-media
    optionalContinuationBoundary: Project creation is the J-01 terminal outcome; intent selection or processing submission belongs to its own journey and operation.
j02RecoveryApplicability:
  status: SOURCE_DEFINED_OWNER_ACCEPTED
  journeyRef: J-02
  sourceDecisionRef: .product-experience/decision-log.md#PXD-049
  runtimeAdmission: NOT_ADMITTED
  cases:
    - trigger: upload-outcome-unknown
      scenarioRef: media.scenario.upload-outcome-unknown
      resourceRef: media.domain.upload-session
      actionRef: media.action.resume-artifact-upload
      orderedOperationRefs: [media.operation-slice.inspect-upload, media.operation-slice.append-upload-chunk, media.operation-slice.complete-upload]
      recovery: Inspect and reconcile the same stable upload identity, then recheck current authority, source binding, and observed state. Require explicit confirmation before any append or completion; inspect after uncertainty and never blindly replay.
      automaticRecovery: false
      userActionRequired: true
      distinctFromRecoveryRef: media.recovery.outcome-unknown
    - trigger: upload-interrupted
      scenarioRef: media.scenario.upload-interrupted
      resourceRef: media.domain.upload-session
      actionRef: media.action.resume-artifact-upload
      orderedOperationRefs: [media.operation-slice.inspect-upload, media.operation-slice.append-upload-chunk, media.operation-slice.complete-upload]
      recovery: Offer continuation only after inspecting the same session and confirming RECEIVING state, matching immutable request/source binding, current authority, and remaining contiguous parts.
      automaticRecovery: false
      userActionRequired: true
    - trigger: upload-permission-revoked
      scenarioRef: media.scenario.upload-permission-revoked
      resourceRef: media.domain.upload-session
      actionRef: media.action.resume-artifact-upload
      orderedOperationRefs: [media.operation-slice.inspect-upload]
      recovery: Do not append or complete until the authoritative rights/workspace source records restored applicable permission; reconcile partial-data disposition under policy.
      automaticRecovery: false
      userActionRequired: true
j03CaptionDraftBindings:
  status: SOURCE_DEFINED_OWNER_ACCEPTED
  journeyRef: J-03
  sourceDecisionRef: .product-experience/decision-log.md#PXD-066
  grammarDecisionRef: .product-experience/decision-log.md#PXD-067
  reviewDecisionRef: .product-experience/decision-log.md#PXD-068
  capabilityScopeDecisionRef: .product-experience/decision-log.md#PXD-069
  runtimeAdmission: NOT_ADMITTED
  operationSource: .product-experience/pdp-1-domain-data/operations.yaml#/individualOperationContracts/records
  steps:
