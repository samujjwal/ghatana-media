stepBindingRule: The ordered view path is sourced from PDP-0 and each legacy view maps to one registered intent-based
  screen. Null actionRef and empty stateRefs are deliberate open bindings, not no-op actions or completed transitions.
terminalSuccess: Each item reports its terminal/partial/unknown outcome and output refs using the same semantics
  as other channels.
criticalNonhappyPaths:
- id: phase0-critical-exception
  condition: SIGINT, duplicate key, same key with changed content, per-item partial failure, malformed JSON, or
    uncertain effect.
  responseIntent: Follow the PDP-0 recovery intent; exact per-condition state, copy, and action bindings remain
    pending.
recovery: Stop watching separately from cancellation; reconcile accepted work and continue only unambiguous eligible
  items.
contextPreserved:
- Preserve batch/group ID, per-item semantic key, plan fingerprint, output refs, and exit/result disposition.
