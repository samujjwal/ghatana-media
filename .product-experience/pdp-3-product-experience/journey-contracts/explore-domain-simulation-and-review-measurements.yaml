stepBindingRule: The ordered view path is sourced from PDP-0 and each legacy view maps to one registered intent-based
  screen. Null actionRef and empty stateRefs are deliberate open bindings, not no-op actions or completed transitions.
terminalSuccess: Measurements/passes and any animation/render remain traceable to domain model and declared fidelity.
criticalNonhappyPaths:
- id: phase0-critical-exception
  condition: Invalid units, outside-validity input, unstable solver, missing domain owner approval, or visual output
    mistaken for validated science.
  responseIntent: Follow the PDP-0 recovery intent; exact per-condition state, copy, and action bindings remain
    pending.
recovery: Reject or abstain from quantitative claim; preserve inputs and report required expert/domain-owner review.
contextPreserved:
- Preserve model reference, parameters, solver/version, t_sim, checkpoints, observables, and scene binding.
