  status: UNKNOWN_NOT_ADMITTED
  missingOwnerDefinition: >-
    P1 inspect-simulation-result is an exact-target scoped read whose immediate
    envelope is requestId, exactTargetRef, ownerReceipt, and observedAt; this
    J-14 binding does not join that envelope to a typed simulation-pass result,
    exact run parameters, or a completed render/measurement result.
    inspect-quality-evidence returns typed quality evidence for an exact
    subject version but is not a simulation terminal or render-completion
    receipt. The submit-render operation is durable admission only. Bind a
    typed same-subject terminal observation and exact constraints/units/fidelity
    semantics only when an owner-defined operation/result and purpose binding
    establish them; otherwise retain UNKNOWN for missing, partial, stale,
    denied, and unavailable results.
