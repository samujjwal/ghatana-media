stepBindingRule: The ordered view path is sourced from PDP-0 and each legacy view maps to one registered intent-based
  screen. Null actionRef and empty stateRefs are deliberate open bindings, not no-op actions or completed transitions.
terminalSuccess: A reviewable audio artifact records selected voice/version, format/rate, provenance, and approval
  status where required.
criticalNonhappyPaths:
- id: phase0-critical-exception
  condition: Unsupported voice/language, pronunciation mismatch, consent denial, provider outage, or sample-format
    incompatibility.
  responseIntent: Follow the PDP-0 recovery intent; exact per-condition state, copy, and action bindings remain
    pending.
recovery: Keep text and plan, offer only an admitted permitted voice or non-speech route, and require explicit choice
  for material changes.
