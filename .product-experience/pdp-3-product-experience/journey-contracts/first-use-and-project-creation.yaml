  recovery:
    status: source-defined; runtime-admission-pending
    scope: same-identity-and-current-authority
    sourceRef: media.operation-slice.inspect-project
    proposal: Re-observe the same projectId under current tenant/principal/workspace
      authorization. For uncertain create, inspect only the same creationRequestId;
      do not infer or retry from scoped absence.
  postconditions:
  - The operation reads project and revision metadata only.
  - The exact head revision identity is preserved; digest is not substituted for revisionId.
  - No artifact bytes, current rights, or processing availability is exposed or implied.
