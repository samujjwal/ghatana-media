schemaVersion: media.journey-contract.v1
productId: media
journeyId: J-01
title: First use, authentication, context, and project creation
status: proposal; upstream-acceptance-and-role-review-pending
scope: resolve-identity-and-authorized-workspace-through-external-Shared-contract;
  observe-only-authorized-projects; create-one-empty-versioned-project; inspect-exact-project-head;
  processing-intent-selection-remains-outside-J-01
outcomes: [media.goal.finished-asset, media.goal.resolve-safely, media.goal.preserve-source]
actors: [media.creator, media.administrator, media.editor, media.operator]
intent: media.intent.restore-project
channels: [media.channel.web]
preconditions:
- Resolve an authenticated principal and authorized tenant/workspace through the admitted
  Shared identity contract before showing protected project data.
- Project creation requires current project-scoped authority; actor and responsibility-role
  labels do not grant permission.
- No source media, provider, model, engine, or processing request is required to create
  an empty project.
