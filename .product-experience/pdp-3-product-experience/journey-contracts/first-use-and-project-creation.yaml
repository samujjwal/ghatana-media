      plus its immutable revision snapshot identity, as observed at an explicit time.
  failure:
    status: source-defined; runtime-admission-pending
    scope: step-specific-fail-closed
    sourceRef: media.operation-slice.inspect-project
    proposal: A scoped NOT_FOUND means absent or inaccessible within this caller scope
      only. Denied, unavailable, stale, or unknown observations never prove global
      absence, prior non-creation, artifact rights, or content availability.
  degradedBehavior: Preserve last observation as stale/unknown; keep protected data
