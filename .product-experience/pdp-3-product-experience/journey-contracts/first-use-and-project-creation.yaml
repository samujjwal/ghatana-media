    status: source-defined; runtime-admission-pending
    scope: atomic-project-and-initial-revision-commit
    sourceRef: media.operation-slice.create-project
    proposal: After an authoritative durable commit receipt, return the same opaque
      projectId and initial revisionId for one ACTIVE project with an empty immutable
      COMMITTED revision and matching headRevisionId.
  failure:
    status: source-defined; runtime-admission-pending
    scope: step-specific-fail-closed
    sourceRef: media.operation-slice.create-project
    proposal: Reject missing trusted identity, unauthorized workspace/policy, blank
      title, or mismatched idempotency replay without mutation. After dispatch ambiguity
      preserve UNKNOWN_OUTCOME and the same requestId; never infer no effect from
      absence/unavailability or blindly resubmit.
  degradedBehavior: Preserve last observation as stale/unknown; keep protected data
    hidden when identity or authorization cannot be confirmed.
  recovery:
    status: source-defined; runtime-admission-pending
    scope: same-identity-and-current-authority
    sourceRef: media.operation-slice.create-project
    proposal: Reconcile with inspect-project using the same creationRequestId, tenant,
      principal, and workspace. Resubmit only after an authoritative safe disposition;
      never create a second request identity to bypass unknown.
  postconditions:
  - Project, initial revision, and head reference commit atomically.
  - The initial revision has no media assets, scenes, timelines, or settings.
  - No provider, model, engine, processing job, source media, artifact rights, or
    artifact availability is implied.
