    accessibility for each proposed channel.
  - Author deterministic fixtures with owner-approved expected results for
    success, critical exceptions, recovery, and preserved context.
  - Complete capability bounds, wire/API/CLI contracts where applicable, and
    required named-owner and independent review before PDP-3 acceptance.
