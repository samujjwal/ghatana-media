stepBindingRule: The ordered view path is sourced from PDP-0 and each legacy view maps to one registered intent-based
  screen. Null actionRef and empty stateRefs are deliberate open bindings, not no-op actions or completed transitions.
terminalSuccess: User receives an admitted equivalent fallback with material differences disclosed or a clear blocked
  result.
criticalNonhappyPaths:
- id: phase0-critical-exception
  condition: Provider/license/capacity outage, no eligible alternative, or fallback would reduce fidelity/privacy/rights
    guarantees.
  responseIntent: Follow the PDP-0 recovery intent; exact per-condition state, copy, and action bindings remain
    pending.
recovery: Preserve completed work, mark unknown outcome, reconcile before retry, and never silently downgrade or
  fabricate success.
contextPreserved:
- Preserve original plan, capability/reason status, fallback decision, budget, and completed outputs.
