  version is AVAILABLE only when verification authority records current positive
  evidence for tenant/artifact/version/size/full digest, applicable format and
  security/parser checks, intended-use rights and consent where required, and
  policy/retention disposition under T02. Missing, stale, or ambiguous evidence
  remains QUARANTINED pending reconciliation; in-progress remains VERIFYING;
  authoritative denial is REJECTED; EXPIRED requires authoritative retention
  expiry. Upload completion, job completion, or metadata inspection alone is
  insufficient.
