schemaVersion: media.journey-contract.v1
productId: media
journeyId: J-02
title: Upload or import, inspect, and verify a usable artifact
status: proposal; upload-policy-and-public-contract-review-pending
definitionReview:
  status: SOURCE_DEFINED_OWNER_ACCEPTED
  decisionRef: .product-experience/decision-log.md#PXD-049
  boundary: PDP-3 definition accepted; phase acceptance and runtime admission remain separate and pending
  runtimeAdmission: NOT_ADMITTED
scope: accept-one-authorized-source-as-an-immutable-artifact-version;
  upload-receipt-and-VERIFYING-are-not-usable-artifact-finality;
  processing-and-external-delivery-are-outside-this-journey
outcomes:
  [
    media.goal.understand-media,
    media.goal.preserve-source,
    media.goal.resolve-safely
  ]
actors: [ media.creator, media.editor ]
intent: media.intent.understand
channels: [ media.channel.web, media.channel.http-api, media.channel.sdk ]
preconditions:
  - Resolve the current principal, workspace, and any selected project before
    exposing or mutating protected artifact data.
  - Recheck upload/import authority, source purpose, rights, consent, retention,
    and applicable policy at admission and commit boundaries.
  - Accept only an owner-admitted source path, media type, and bounded transfer
    contract; browser filename and extension checks are advisory only.
  - Keep artifact bytes and immutable artifact identity separate from a
    project-specific MediaAsset attachment.
steps:
