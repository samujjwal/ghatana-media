    screenContractRef: screen-contracts/browse-media.yaml
    result: show-only-currently-authorized-artifact-versions-and-an-admitted-import-entry-point
    surfaceRefs:
      - media.surface.web
    objectRefs:
      - media.domain.artifact
      - media.domain.artifact-version
    stateRefs:
      - media-upload-and-artifact/AVAILABLE
    canonicalOperationRef: null
    authorityRef: .product-experience/pdp-0-product-truth/policy-authority-model.yaml#productPolicy.enforcementPoints.artifact-fetch-and-cache-reuse
    decisionRef: .product-experience/decision-log.md#PXD-040
    transitionRef: null
    handoffRef: null
    success:
      status: source-defined; runtime-admission-pending
      scope: authorized-observation-only
      sourceRef: media.operation-slice.inspect-artifact
      proposal: Show only artifact versions currently authorized for this principal
        and tenant; preserve exact immutable version and separately recorded
        integrity/policy dispositions.
    failure:
      status: source-defined; runtime-admission-pending
      scope: scoped-read
      sourceRef: media.operation-slice.inspect-artifact
      proposal: Denied, inaccessible, stale, offline, or unknown observations remain
        distinct; never infer global absence, failure, or availability. Preserve
        exact scoped identity and do not mutate after an unknown result.
    degradedBehavior: null
    recovery:
      status: source-defined; runtime-admission-pending
      scope: same-identity-read-only
      sourceRef: media.operation-slice.inspect-artifact
      proposal: Re-read only the same scoped artifact identity after authority is
        rechecked; no mutation follows unknown/unavailable observation.
    postconditions:
      - No bytes are exposed by browse.
      - No upload or artifact lifecycle state changes.
    requirementRefs: []
    verification:
      status: not-run
      requiredChecks:
        - duplicate-key-safe YAML parse
        - focused PDP3-005 ten-contract structural/reference check
      actualEvidence: []
    contextPreservation:
      status: candidate-proposal
      scope: journey-level-not-allocated-to-this-step
      sourceRef: journey.contextPreserved
      proposal:
        - selected-workspace
        - selected-project-target-when-present
        - source-name
        - stable-upload-identity
        - acknowledged-transfer-progress
        - integrity-disposition
        - next-inspection-action
    bindingStatus:
