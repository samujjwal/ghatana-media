stepBindingRule: The ordered view path is sourced from PDP-0 and each legacy view maps to one registered intent-based
  screen. Null actionRef and empty stateRefs are deliberate open bindings, not no-op actions or completed transitions.
terminalSuccess: Refinement preserves accepted domain measurements or reports the exact failed validation and fidelity
  consequence.
criticalNonhappyPaths:
- id: phase0-critical-exception
  condition: A visually plausible result violates model truth, validation abstains, or generation changes a protected
    property.
  responseIntent: Follow the PDP-0 recovery intent; exact per-condition state, copy, and action bindings remain
    pending.
recovery: Reject the changed candidate, retain prior validated pass, and require domain-owner disposition for semantic
  change.
contextPreserved:
- Preserve model/scene versions, protected properties, validation results, and candidate lineage.
