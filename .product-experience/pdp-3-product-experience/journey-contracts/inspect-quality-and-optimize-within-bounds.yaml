terminalOutcomeBinding:
  status: P3_LOCAL_USER_CHOICE_BOUND; RUNTIME_NOT_ADMITTED
  sourceCompletionRef: .product-experience/pdp-0-product-truth/journey-catalog.yaml#journeys/@id=J-19/completion
  sourceChoiceSemanticsRef: .product-experience/pdp-3-product-experience/action-registry.yaml#actions/@id=media.action.select-exact-candidates/actionDefinitionSemantics/typedDefinition
  exactComparisonResultRef: .product-experience/pdp-1-domain-data/operations.yaml#ownerTypedObservationContracts/records/@id=media.observation-contract.candidate-metric-pair.v1/resultSchema
  terminalStepRef: .product-experience/pdp-3-product-experience/journey-contracts/inspect-quality-and-optimize-within-bounds.yaml#/steps/2
  terminalActionBindingRef: .product-experience/pdp-3-product-experience/journey-purpose-bindings.yaml#records/@id=media.pdp3.step-purpose-binding.j19-step-03.v1/relatedActionBindings/@id=media.pdp3.action-binding.j19-successor-choice.v1
  actionRef: media.action.select-exact-candidates
  actionSemantics:
    effect: Change only the current local draft or selection; committed source and versioned objects remain unchanged.
    finality: local-draft-only; not-a-committed-result
    operationRefs: []
    runtimeAdmission: NOT_ADMITTED
  exactChoice:
    field: userChoice
    allowedValues: [SELECT_SUCCESSOR, DECLINE_SUCCESSOR]
    source: Explicit user input on the comparison screen; never derive it from metrics, rankings, render state, or inferred preference.
  exactResult:
    fields: [userChoice, originalArtifactVersionRef, candidateArtifactVersionRef, metricRefs, metricResults]
    selectSuccessor: Record the exact candidateArtifactVersionRef selected by the user and retain the exact paired metric rows and source-reported disclosures.
    declineSuccessor: Record DECLINE_SUCCESSOR with selectedArtifactVersionRef null, retain the exact originalArtifactVersionRef, and retain the declined candidate identity and paired metric rows.
  disclosure:
    preserveFields: [status, currentness, rawValue, applicability, disposition, method, methodVersion, unit, uncertainty, calibration, evidenceRefs]
    estimatedOrReconstructed: Disclose only when identified by the source observation; otherwise disclose provenance as UNKNOWN.
  eligibility:
    require: The paired result names two distinct immutable versions and the requested metric rows; each required metric side is OBSERVED and CURRENT and comparability is SAME_DECLARED_SCOPE.
    otherwise: Keep completion UNKNOWN/incomplete, preserve NOT_COMPARABLE and UNKNOWN, and follow the PDP-0 critical path; do not record a terminal choice.
  boundary: The choice records user selection or decline only and is J19 completion. It does not commit a version, mutate a source, submit a render, approve, publish, deliver, or assert render completion. The optional M-RENDER next action remains separate and cannot change or defer this choice result.
