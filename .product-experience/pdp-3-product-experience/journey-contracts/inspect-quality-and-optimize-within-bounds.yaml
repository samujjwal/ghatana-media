stepBindingRule: >-
  The ordered P0 views map in order: quality review, plan review, exact comparison, then optional render preparation. The exact local selection or decline on the comparison view is the J19 completion result; the subsequent M-RENDER action is optional and non-completing.
terminalSuccess: User selects or declines a measurable successor candidate with
  estimated/reconstructed properties disclosed.
criticalNonhappyPaths:
  - id: phase0-critical-exception
    condition: Metric abstention, no improvement, incorrect metric domain, exhausted
      budget, or attempted fidelity downgrade.
    responseIntent: Follow the PDP-0 recovery intent; exact per-condition state,
      copy, and action bindings remain pending.
recovery: Stop at declared bound, preserve best valid candidate and source, and
  expose next permitted action.
contextPreserved:
  - Retain metric version/scope, candidate fingerprint, budget consumed, and
    previous accepted quality.
channelEquivalents:
  - web
accessibilityIntentRef: media.a11y.baseline
requiredScenarioBehaviors:
  status: scenario-fixtures-and-owner-approved-expected-results-pending
  successIntent: User selects or declines a measurable successor candidate with
    estimated/reconstructed properties disclosed.
  criticalNonhappyIntent: Metric abstention, no improvement, incorrect metric
    domain, exhausted budget, or attempted fidelity downgrade.
scenarioRefs: []
unresolvedProductDecisions:
  - Bind each view transition to an owner-approved action, state, and finality
    contract; no action identifier or state transition is inferred by this
    proposal.
  - Define equivalent behavior, authority, transport, recovery, and
    accessibility for each proposed channel.
  - Author deterministic fixtures with owner-approved expected results for
    success, critical exceptions, recovery, and preserved context.
  - Complete capability bounds, wire/API/CLI contracts where applicable, and
    required named-owner and independent review before PDP-3 acceptance.
