  missingOwnerDefinition: >-
    P1 defines the consent-revocation command and owner wire contract, the
    media-artifact-delete capability command with a typed lifecycle result, and
    the erasure inventory/tombstone classifier. J-26 now binds consent
    revocation to its consent-remediation purpose as a request whose authority
    receipt is required for confirmation. No exact J-26 user action-purpose join
    exists for the artifact-delete capability, and no current owner/provider
    evidence supplies an all-copy erasure receipt. Preserve the source-defined
    result distinctions; do not claim consent revocation, physical deletion, or
    ERASURE_CONFIRMED from a read receipt, request receipt, purge count, or
    transport acknowledgement.
