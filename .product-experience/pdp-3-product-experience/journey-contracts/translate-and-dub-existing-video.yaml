unresolvedProductDecisions:
  - Bind the exact PDP-1 results across the existing-video, target-locale,
    translated-segment/draft, immutable-version, approval, and delivery stages
    before claiming the intended terminal outcome. The currently source-defined
    review/compare operations return the scoped-query envelope only, and the
    caption-draft operation returns a session-local snapshot; neither result
    establishes immutable registration, approval, or destination acknowledgement.
    Keep the web and gRPC transport bindings UNBOUND and runtime NOT_ADMITTED.
  - Bind each view transition to an owner-approved action, state, and finality
    contract; no action identifier or state transition is inferred by this
    proposal.
  - Define equivalent behavior, authority, transport, recovery, and
    accessibility for each proposed channel.
  - Author deterministic fixtures with owner-approved expected results for
    success, critical exceptions, recovery, and preserved context.
  - Complete capability bounds, wire/API/CLI contracts where applicable, and
    required named-owner and independent review before PDP-3 acceptance.
conditionalHandoffRefs:
  - ai-inference-execution
  - action-plane-publication
handoffCondition: AI Inference applies only to a bound translation/dubbing
  operation; Action Plane only for external publication.
