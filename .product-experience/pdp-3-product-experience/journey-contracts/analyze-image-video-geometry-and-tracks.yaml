stepBindingRule: The ordered view path is sourced from PDP-0 and each legacy view maps to one registered intent-based
  screen. Null actionRef and empty stateRefs are deliberate open bindings, not no-op actions or completed transitions.
terminalSuccess: Observations retain source artifact, timestamp/frame/region, model provenance, and confidence/uncertainty.
criticalNonhappyPaths:
- id: phase0-critical-exception
  condition: Uncertain detections, unsupported dimensions, VFR sampling loss, model unavailable, or no valid geometry.
  responseIntent: Follow the PDP-0 recovery intent; exact per-condition state, copy, and action bindings remain
    pending.
recovery: Mark observations unavailable or partial; preserve source; allow bounded manual inspection where admitted.
contextPreserved:
- Keep frame/time mapping, selected track/region, and observation provenance.
