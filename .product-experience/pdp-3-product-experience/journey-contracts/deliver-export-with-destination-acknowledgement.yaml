unresolvedProductDecisions:
  - Bind each view transition to an owner-approved action, state, and finality
    contract; no action identifier or state transition is inferred by this
    proposal.
  - Define equivalent behavior, authority, transport, recovery, and
    accessibility for each proposed channel.
  - Author deterministic fixtures with owner-approved expected results for
    success, critical exceptions, recovery, and preserved context.
  - Complete capability bounds, wire/API/CLI contracts where applicable, and
    required named-owner and independent review before PDP-3 acceptance.
conditionalHandoffRefs:
  - action-plane-publication
handoffCondition: Use Action Plane only for privileged external publication;
