stepBindingRule: The ordered view path is sourced from PDP-0 and each legacy view maps to one registered intent-based
  screen. Null actionRef and empty stateRefs are deliberate open bindings, not no-op actions or completed transitions.
terminalSuccess: Render/export binds animation to a declared rig/scene version and reports conversion loss.
criticalNonhappyPaths:
- id: phase0-critical-exception
  condition: Skeleton mapping failure, coordinate mismatch, rights failure, or unsupported scene feature.
  responseIntent: Follow the PDP-0 recovery intent; exact per-condition state, copy, and action bindings remain
    pending.
recovery: Preserve source rig/scene and reject or isolate unsupported mappings; do not silently retarget.
contextPreserved:
- Keep rig, scene version, coordinate conventions, control edits, and export disposition.
