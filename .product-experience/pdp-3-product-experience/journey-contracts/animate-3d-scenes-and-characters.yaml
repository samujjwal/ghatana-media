  id: MDC30-C-13-render-completion-and-conversion-observation
  status: UNKNOWN_NOT_ADMITTED
  missingOwnerDefinition: >-
    P1 submit-render binds only requestId, logicalJobId, sourceSnapshotDigest,
    renderProfileRef, and durableAdmissionReceipt; it establishes job admission,
    not terminal rendering. The exact-version output-preview/version-lineage
    observation identifies an observed immutable output but does not join a
    terminal render result to this journey or provide a typed format/geometry
    conversion-loss report. Keep the existing submission and preview bindings;
    do not infer render completion, export success, or conversion fidelity.
