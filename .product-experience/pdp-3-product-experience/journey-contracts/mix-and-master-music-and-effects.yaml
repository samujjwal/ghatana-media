stepBindingRule: The ordered view path is sourced from PDP-0 and each legacy view maps to one registered intent-based
  screen. Null actionRef and empty stateRefs are deliberate open bindings, not no-op actions or completed transitions.
terminalSuccess: Mix/master output records profile, loudness/peak measurements where applicable, and source lineage.
criticalNonhappyPaths:
- id: phase0-critical-exception
  condition: Rights issue, clipping, separation leakage, missing channel layout, or unavailable mastering profile.
  responseIntent: Follow the PDP-0 recovery intent; exact per-condition state, copy, and action bindings remain
    pending.
recovery: Keep original stems/source and disclose unavailable/inapplicable measurements; do not silently deliver
  a degraded master.
contextPreserved:
- Preserve stems, gain/automation, sample clock, mix decisions, profile, and output version.
