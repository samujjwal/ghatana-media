        noOtherNulls: reject-null-required-fields-and-unlisted-nullable-values;
          no-defaulting-or-ignored-payload-fields
      requestFingerprint:
        version: media.transcription-submission-fingerprint.v1
        digestField: requestFingerprint; lowercase-64-hex-SHA256
        algorithm: SHA-256
        encoding: compact UTF-8 JSON array with no whitespace, exact ordered fields,
          JSON string escaping, and explicit null/value presence; languageIntent
          uses fixed ordered tuples [EXPLICIT, exact-languageTag] or
          [AUTO_REQUESTED], never unordered object serialization
        binds:
          - tenantId
          - principalId
          - delegationRef
          - operationId
          - requestId
          - sourceArtifactId
          - sourceArtifactVersionId
          - authoritativeSourceContentDigest
          - languageIntent
          - profileId
          - profileVersion
          - profileConfigurationDigest
          - purpose
          - consentRef
          - rightsEvidenceRef
          - retentionPolicyRef
          - processingLocation
        replay: retain the complete validated canonical submit snapshot and fingerprint
          before first dispatch; exact same key and fingerprint only after fresh
          current effect policy; mismatch is IDEMPOTENCY_CONFLICT and does not
          erase or prove absence of prior receipt
        reconcileFingerprint: caller supplies nonnull lowercase-64-hex digest; host
          recomputes it from retained original snapshot in the same trusted
          scope; never trust a digest received from a lost response
        languageIntentEncoding: fixed ordered tuples [EXPLICIT, exact-languageTag] or
          [AUTO_REQUESTED]; no unordered-object serialization
      acknowledgedFields:
        - outcome
        - requestId
        - requestFingerprint
        - submissionReceiptId
        - jobId
        - acceptedAt
        - replayDisposition
      unknownFields:
        - outcome
        - requestId
        - requestFingerprint
        - observedAt
        - uncertaintyReason
      asynchronousBoundary: REQUEST_ACKNOWLEDGED establishes logical request/job
        identity and receipt only; it asserts no job state, provider execution,
        recognition completion, transcript, quality, caption approval, or
        publication
      reconciliation: RECONCILE uses same requestId and full fingerprint in same
        trusted scope under separately rechecked current scoped receipt-read
        authority; it may reconcile after processing authority revocation but
        does not authorize processing/replay. Return original receipt only when
        exact retained snapshot proves it, otherwise UNKNOWN_OUTCOME;
        absence/expiry/unavailability never proves no effect
      retries: no blind replay, no new key to escape uncertainty/conflict, and no
        automatic new logical request; worker attempts belong to separate
        existing job lifecycle
      definitivePreDispatchCodes:
        - INVALID_REQUEST
        - SOURCE_NOT_FOUND_OR_NOT_VISIBLE
        - SOURCE_UNAVAILABLE
        - RIGHTS_NOT_VERIFIED
        - CONSENT_NOT_CURRENT
        - PURPOSE_NOT_PERMITTED
        - RETENTION_NOT_PERMITTED
        - PROCESSING_LOCATION_NOT_PERMITTED
        - PROFILE_NOT_QUALIFIED
        - LANGUAGE_NOT_SUPPORTED
        - AUTHORIZATION_DENIED
        - IDEMPOTENCY_CONFLICT
