      objectRefs: exact-source-artifact-version-and-typed-parent; draft-is-session-local-not-canonical-object
      stateRefs: no-canonical-domain-state-machine-or-transition-applies
      canonicalOperationRef: existing-caption-draft-write-bound-to-text-correction-branch
      authorityRef: trusted-host-principal-and-current-scoped-source-read-and-derived-edit-policy; deployed-enforcement-unqualified
      decisionRef: PXD-068 owner definition; independent review pending
      transitionRef: explicitly not applicable; session-local draft snapshot only
      handoffRef: exact source-only J03-4 transcript read to host-prepared session-local revision-zero draft; no new operation or durable persistence boundary claimed
      success: exact same source/parent and one session-local text-only draft revision
      failure: prior snapshot preserved atomically; stale and policy conditions distinct
      degradedBehavior: unavailable timing and supplied uncertainty are preserved without inference
      recovery: inspect same draft then explicit user-directed edit or rebase under fresh authority
      postconditions: no source mutation, canonical registration, approval, or publication
      requirementRefs: existing artifact derivation requirement linked; satisfaction not claimed
      verification: definition source checks separate; runtime verification not run
      contextPreservation: exact draft revision, source version, typed parent, segment, and supplied fields
