    capabilityRefs: [media.artifact.output.register]
    result: distinct-immutable-caption-version-and-durable-registration-receipt-or-explicit-failure
    surfaceRefs: [media.surface.web]
    objectRefs: [media.domain.caption-version, media.domain.artifact-version, media.domain.transcription]
    stateRefs: []
