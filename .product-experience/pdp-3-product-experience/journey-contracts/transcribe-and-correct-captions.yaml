    actorRefs: [media.creator, media.editor]
    actorBindingReason: Actor labels identify journey participants only; trusted tenant and principal come from the host, while current source, parent, rights, consent, and retention decisions are evaluated at registration.
    requiredOperationRefs: [media.operation.caption-version-write]
    intent: Register one new immutable caption version against the exact source artifact version and typed parent; registration does not approve, publish, deliver, or grant rights.
    contextPreservation: [tenant, principal, project, sourceArtifactId, sourceArtifactVersionId, parentVersionKind, parentVersionId, sourceClockId, ticksPerSecond, sourceDurationTicks, languageDisposition, captionSegments, purpose, requestId]
    transitionDisposition:
      status: NOT_APPLICABLE_WITH_REASON
      transitionRef: null
      decisionRef: .product-experience/decision-log.md#PXD-060
      reason: Append-only caption-version registration creates an immutable record and receipt; PDP-1 defines no domain-state transition.
    success:
      status: SOURCE_DEFINED; runtime-admission-pending
      scope: exact-request-receipt
      sourceRef: media.operation.caption-version-write
      proposal: Only an authoritative durable registration receipt identifies the new captionVersionId, exact source artifact version, and typed parent. Registration is not review approval or publication.
    failure:
      status: SOURCE_DEFINED; runtime-admission-pending
      scope: fail-closed-registration
      sourceRef: media.operation.caption-version-write
      proposal: Reject invalid or empty segments, invalid source-clock ranges, inaccessible source or parent, stale parent, denied current authority, and same-key/different-payload requests without mutating existing versions. If commit status is ambiguous, preserve UNKNOWN_OUTCOME and the original requestId and fingerprint.
    degradedBehavior: Preserve UNKNOWN_OUTCOME if commit cannot be proven either way; do not infer failure or absence.
    recovery:
      status: SOURCE_DEFINED; runtime-admission-pending
      scope: same-request-reconciliation
