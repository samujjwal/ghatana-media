    stepId: J03-5
    actorRefs: [media.creator, media.editor]
    action: media.action.correct-caption
    actionBindingStatus: SOURCE_DEFINED_OWNER_ACCEPTED; runtime-admission-pending
    capabilityRefs: [media.artifact.derive]
    result: one-session-local-draft-revision-with-the-same-exact-source-and-typed-parent
    surfaceRefs: [media.surface.web]
    objectRefs: [media.domain.artifact-version, media.domain.transcript-version, media.domain.caption-version]
    stateRefs: []
    canonicalOperationRef: media.operation.caption-draft-write
    authorityRef: current-trusted-tenant-principal-and-source-read-plus-derived-content-edit-policy
    sourceDecisionRef: .product-experience/decision-log.md#PXD-066
    grammarDecisionRef: .product-experience/decision-log.md#PXD-067
    decisionRef: .product-experience/decision-log.md#PXD-068
    transitionRef: null
    handoffRef:
      kind: HOST_LOCAL_VALUE_PREPARATION
      fromStepId: J03-4
      fromOperationRef: media.operation.transcript-version-read
      toStepId: J03-5
      sourceSelector: exact-transcriptVersionId-only; retain-linked-sourceArtifactId-and-sourceArtifactVersionId-from-that-read-result
      parentBinding: parentVersionKind-TRANSCRIPT_VERSION-and-parentVersionId-equal-to-exact-transcriptVersionId
      authority: recheck-current-trusted-tenant-principal-activeSessionId-source-read-and-derived-edit-policy-before-preparation
      preparedValue: host-bound-opaque-draftId-at-revision-zero; session-local-value-not-a-canonical-object
      initialization: copy-only-faithful-ordered-parent-segments-with-stable-nonempty-unique-IDs-exact-text-origin-and-explicit-availability; block-DRAFT_INITIALIZATION_BLOCKED-unless-user-explicitly-authors-stable-IDs-and-text-under-the-same-policy; never-auto-segment-join-text-generate-IDs-or-infer-identity
      timing: preserve-exact-per-segment-tagged-union-and-original-provider-values; aggregate-MIXED-when-tags-or-clock-tuples-differ; never-promote
      runtimeAdmission: NOT_ADMITTED
      noNewOperationOrPersistedObject: true
    requiredOperationRefs: [media.operation.caption-draft-write]
    intent: Apply an explicit text-only correction to one existing segment of a session-local draft while preserving its exact immutable source version and typed transcript-or-caption parent.
    contextPreservation: [tenantId, principalId, draftId, expectedDraftRevision, sourceArtifactId, sourceArtifactVersionId, parentVersionKind, parentVersionId, segmentId, originalText, timingAvailability, languageDisposition, uncertaintyObservations, evidenceRefs]
    transitionDisposition:
      status: NOT_APPLICABLE_WITH_REASON
      transitionRef: null
      reason: A text correction atomically advances only a session-local draft snapshot; it does not change a canonical domain object's state or register a caption version.
    draftEditSemantics:
      editKind: TEXT_CORRECTION
      requestFields: [draftId, expectedDraftRevision, sourceArtifactId, sourceArtifactVersionId, parentVersionKind, parentVersionId, editKind, segmentId, edit.text]
      trustedHostFields: [tenantId, principalId]
      allowedEditFields: [text]
      preservedFields: [segmentId, segmentOrder, timingAvailability, languageDisposition, languageTag, uncertaintyObservations, evidenceRefs]
      timingUnavailableAllowed: true
      sourceAndParent: exact immutable source artifact version and exact typed transcript-or-caption parent are fixed for the draft revision
      authority: current scoped source-read and derived-content-edit policy must allow the exact source and parent; actor labels confer no authority
      draftInitialization: J03-4 must return the exact transcriptVersionId and linked sourceArtifactId/sourceArtifactVersionId under current scoped read authority; host rechecks current derived-edit policy, binds the transcript as parentVersionKind TRANSCRIPT_VERSION with parentVersionId equal to transcriptVersionId, and creates an opaque session-bound draftId at revision zero. Copy only faithful ordered parent segments with stable nonempty unique segment IDs, exact text/origin, and explicit availability. If segments or IDs are absent or not faithful, block initialization with DRAFT_INITIALIZATION_BLOCKED unless the user explicitly authors segments with stable IDs under the same policy; never auto-segment, join text, or infer identities.
      optimisticConcurrency: expectedDraftRevision must equal the current session-local revision; stale revision is rejected without partial edit
      revisionScope: complete updated draft snapshot is session-local; no durable storage is claimed
      resultShape:
        requiredFields: [draftId, draftRevision, sourceArtifactId, sourceArtifactVersionId, parentVersionKind, parentVersionId, editKind, segments, timingAvailability, observedAt]
        segmentRequiredFields: [segmentId, text, origin, timing]
        segmentOptionalFields: [languageDisposition, languageTag, uncertaintyObservations, evidenceRefs]
        timingTagUnion:
          SOURCE_TICKS: exact startTick/endTick with authoritative sourceClockId/ticksPerSecond/sourceDurationTicks for this source version
          PROVIDER_TIME_UNQUALIFIED: preserve provider values and original unit; never interpret as source ticks
          NOT_SUPPLIED: explicit absence; never infer or fill
        timingAvailabilityAggregateValues: [NOT_SUPPLIED, PROVIDER_TIME_UNQUALIFIED, SOURCE_CLOCK_BOUND, MIXED]
        aggregateRules: [NOT_SUPPLIED only when every segment is NOT_SUPPLIED, PROVIDER_TIME_UNQUALIFIED only when every segment has that tag, SOURCE_CLOCK_BOUND only when every segment is SOURCE_TICKS and shares one exact qualified source/version/clock/rate/duration tuple, MIXED for differing tags or tuples without promotion]
        emptySegments: block-initialization
        registrationReadiness: aggregate is descriptive only; registration revalidates every explicit range and current source-parent-clock policy; any NOT_SUPPLIED or PROVIDER_TIME_UNQUALIFIED segment, or a MIXED aggregate, blocks registration
    success:
      status: SOURCE_DEFINED; runtime-admission-pending
      scope: session-local-text-correction
      sourceRef: media.operation.caption-draft-write
      proposal: Return the same draft/source/typed-parent identities and one new draftRevision with only the target segment text changed and marked user-edited; preserve explicitly unavailable or unqualified timing and all other supplied fields.
    failure:
      status: SOURCE_DEFINED; runtime-admission-pending
      scope: exact-draft-and-parent
      sourceRef: media.operation.caption-draft-write
      proposal: Keep the prior snapshot unchanged on policy denial, missing segment, stale source/parent, or revision conflict; retain ACCESS_DENIED, DRAFT_NOT_FOUND_IN_CALLER_SCOPE, SOURCE_IDENTITY_MISMATCH, PARENT_VERSION_STALE, DRAFT_REVISION_CONFLICT, and UNAVAILABLE as distinct outcomes.
    degradedBehavior: Missing or unqualified timing remains explicitly unavailable; never infer language, speaker, confidence, timing, source clock, or scientific correctness.
    recovery:
      status: SOURCE_DEFINED; runtime-admission-pending
      scope: same-session-local-draft
      sourceRef: media.operation.caption-draft-write
      proposal: After uncertain observation, inspect the same active-session draft and revision before a user explicitly submits another edit; stale parent requires host-prepared revision zero under fresh current policy with a new draftId and exact new typed parent; preserve the old stale draft until explicit discard, never reparent or reuse its revision, and never silently overwrite.
    postconditions: [immutable-source-unchanged, immutable-parent-unchanged, prior-draft-snapshot-retained, one-session-local-revision-advanced-only-on-valid-edit, no-registration-or-approval-or-publication]
    requirementRefs: [MEDIA-REQ-CAP-ARTIFACT]
    verification:
      status: not-run
      requiredChecks: [duplicate-key-safe-YAML-parse, exact-text-only-edit-branch, stale-parent-and-revision-conflict-negative-cases]
      actualEvidence: []
    definitionVerification:
      status: source-contract-checked
      evidence: [tests/media-caption-draft-experience-definitions.test.mjs, scripts/check-product-experience-local.mjs]
      runtimeAdmission: NOT_ADMITTED
      runtimeVerification: not-run
    bindingStatus:
