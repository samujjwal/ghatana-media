    actorBindingReason: Existing J-03 participants may request review, but actor labels do not grant access; trusted tenant/principal and current scoped read policy govern the exact transcript and linked source.
    requiredOperationRefs: [media.operation.transcript-version-read]
    intent: Inspect one exact immutable canonical transcript version and its source link, preserving supplied text, timing, language, uncertainty, and evidence availability without correcting or approving it.
    contextPreservation: [trustedTenant, trustedPrincipal, transcriptVersionId, sourceArtifactId, sourceArtifactVersionId, sourceClockAvailability, sourceClockMappingEvidenceRef, timingAvailability, languageAvailability, uncertaintyAvailability, evidenceAvailability, observedAt]
    transitionDisposition:
      status: NOT_APPLICABLE_WITH_REASON
      transitionRef: null
      decisionRef: .product-experience/decision-log.md#PXD-064
      reason: Exact transcript-version inspection is a scoped read-only observation; it does not mutate transcript or source state, correct captions, register a caption version, approve, or publish.
    success:
      status: SOURCE_DEFINED; runtime-admission-pending
      scope: exact-transcript-version-observation
      sourceRef: media.operation.transcript-version-read
      proposal: Return the same opaque transcriptVersionId with its exact sourceArtifactId and sourceArtifactVersionId, per-field availability, supplied observations, and observation time. Missing timing does not block inspection; source-clock fields appear only when authoritatively bound to this source version.
    failure:
      status: SOURCE_DEFINED; runtime-admission-pending
      scope: trusted-caller-scope
      sourceRef: media.operation.transcript-version-read
      proposal: Reject malformed selectors as INVALID_REQUEST; report ACCESS_DENIED distinctly; use TRANSCRIPT_VERSION_NOT_FOUND_IN_CALLER_SCOPE for absent or inaccessible versions without a global-absence claim; report SOURCE_IDENTITY_MISMATCH only for a contradictory authoritative source link; keep reader/transport inability as UNAVAILABLE.
    degradedBehavior: Preserve explicit per-field availability. Provider timing remains in its supplied units and unqualified unless an authoritative source-clock mapping exists; never infer text, segments, language, confidence, speaker, clock, or timing from absent values.
    recovery:
      status: SOURCE_DEFINED; runtime-admission-pending
      scope: exact-read-reobservation
      sourceRef: media.operation.transcript-version-read
      proposal: After timeout or unavailable observation, reread the same transcriptVersionId only under fresh current authority. Unavailability does not prove absence; never substitute a job ID, legacy transcription UUID, transcriptArtifactId, or latest-version selector.
    postconditions: [exact-transcript-and-source-identities-retained, per-field-availability-preserved, supplied-uncertainty-not-normalized, no-mutation-or-caption-registration-or-approval-or-publication]
    requirementRefs: [MEDIA-REQ-CAP-ARTIFACT]
    verification:
      status: not-run
      requiredChecks: [duplicate-key-safe-YAML-parse, exact-transcript-read-definition-bindings, scoped-identity-and-no-approval-negative-cases]
      actualEvidence: []
