      stateRefs: read-only; no-domain-state-machine-or-transition-applies
      canonicalOperationRef: existing-exact-transcript-version-read-query-bound
      authorityRef: current-trusted-tenant-principal-and-scoped-read-policy-defined; deployed-enforcement-unqualified
