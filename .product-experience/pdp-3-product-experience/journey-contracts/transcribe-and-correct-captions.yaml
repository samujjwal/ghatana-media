terminalSuccess: A reviewable caption version is linked to the exact source and
  carries timing, language, provenance, and the recorded authority/finality
  disposition.
criticalNonhappyPaths:
  - id: language-uncertain
    response: keep-result-review-required; permit correction only under current
      policy; do not claim confidence.
  - id: timing-missing
    response: identify missing alignment and permit explicit correction; do not
      infer exact timing.
  - id: consent-revoked
    response: block new processing and reconcile in-flight work under the owning
      lifecycle; retain necessary evidence.
  - id: provider-outcome-unknown
    response: retain the same job identity; disable resubmission; check the outcome
      or route to operator review.
  - id: source-version-changed
    response: preserve draft and mark its parent stale; require explicit rebase or
      restart.
recovery: Every recovery preserves the source and completed output; retry
  requires a classified safe state and a fresh policy check.
