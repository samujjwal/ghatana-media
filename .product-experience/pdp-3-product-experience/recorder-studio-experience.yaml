          fixtureActorRef: "media.editor"
          syntheticProjectAuthority: "MEDIA_PROJECT_FIXTURE_ONLY_NO_CANONICAL_RUNTIME_WRITER"
          setup: "Synthetic fixture bundle with one valid hotspot and an injected choice referring to nonexistent branch target"
          action: "Submit an unknown hotspot target and attempt branch activation by click and keyboard"
          expected: "Typed DENIED or UNSUPPORTED result with source version and safe known-branch choices, preserving active playback and focus"
          rejection: "No arbitrary script, network request, dynamic product command or analytics success event may be produced"
          expectedFinality: "DENIAL_NO_EFFECT"
          status: "AUTHORED_NOT_EXECUTED_OR_QUALIFIED"
        - id: "offline-branch-fallback"
          classification: "SYNTHETIC_PDP3_DEFINITION_ONLY"
          acceptanceCaseRefs: ["MEDIA-REC-P0-AC-051", "MEDIA-REC-P0-AC-050"]
          fixtureActorRef: "media.editor"
          syntheticProjectAuthority: "MEDIA_PROJECT_FIXTURE_ONLY_NO_CANONICAL_RUNTIME_WRITER"
          setup: "Synthetic fixture interactive bundle with approved embedded primary scene, declared offline branch and one intentionally absent optional asset"
          action: "Disconnect all network in the host simulation, select available and missing branches, inspect the declared local fallback"
          expected: "Local assets and accessible branch paths remain usable; missing assets are explicitly UNSUPPORTED and only admitted linear fallback plays"
          rejection: "No hidden network call, privileged endpoint replay, synthetic frames or silently substituted media source"
          expectedFinality: "LOCAL_OFFLINE_VIEWER_ONLY"
          status: "AUTHORED_NOT_EXECUTED_OR_QUALIFIED"
        - id: "untrusted-html-rejected"
          classification: "SYNTHETIC_PDP3_DEFINITION_ONLY"
          acceptanceCaseRefs: ["MEDIA-REC-P0-AC-052", "MEDIA-REC-P0-AC-061"]
          fixtureActorRef: "media.editor"
          syntheticProjectAuthority: "MEDIA_PROJECT_FIXTURE_ONLY_NO_CANONICAL_RUNTIME_WRITER"
          setup: "Synthetic malicious bundle containing a script element, javascript URL, cross-origin resource and mixed-tenant asset identifier"
          action: "Attempt to package or preview the hostile DOM/resource payload through the declared sanitizer/CSP policy"
          expected: "Typed DENIED with sanitizer reason, safe source revision, no inline executable content, allowedlist-only origins and quarantined rejected input"
          rejection: "No script execution, SSRF, credential exposure, cross-tenant lookup, unapproved egress or generated untrusted HTML injection"
          expectedFinality: "QUARANTINED_NO_PACKAGE_OR_PUBLICATION"
          status: "AUTHORED_NOT_EXECUTED_OR_QUALIFIED"
