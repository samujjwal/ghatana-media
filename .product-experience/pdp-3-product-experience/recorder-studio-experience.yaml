          observation: "Offline-only branch coverage, unavailable assets and truthful local fallback"
          denial: "Reject hidden network-dependent branch or privileged endpoint use while offline"
          recovery: "Remove unsupported dependency or explicitly disclose unsupported branch without fabrication"
