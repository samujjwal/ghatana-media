          observation: "Versioned CSP sanitizer content-integrity origin egress and rights decision"
          denial: "Reject script injection, unbounded URL/SSRF, executable media payload, mixed tenant asset or embedded credential"
          recovery: "Keep rejected input quarantined and edit a newly authorized source version only"
