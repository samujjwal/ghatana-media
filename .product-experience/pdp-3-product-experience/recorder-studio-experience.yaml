          fixtureActorRef: "media.privacy-rights-reviewer"
          syntheticProjectAuthority: "MEDIA_PROJECT_FIXTURE_ONLY_NO_CANONICAL_RUNTIME_WRITER"
          setup: "Synthetic viewer telemetry policy with audience analytics consent absent and preexisting permitted local branch graph"
          action: "Play and navigate the branch with telemetry requested but without current audience consent"
          expected: "Playback and local accessible navigation proceed without any identity-bearing event export, with a visible policy denial of analytics"
          rejection: "No personal identifier or product outcome inference; analytics event count remains zero and no rights bypass is recorded"
          expectedFinality: "LOCAL_VIEWER_ALLOWED_ANALYTICS_DENIED"
          status: "AUTHORED_NOT_EXECUTED_OR_QUALIFIED"
        - id: "revision-conflict-preserves-human-lock"
          classification: "SYNTHETIC_PDP3_DEFINITION_ONLY"
          acceptanceCaseRefs: ["MEDIA-REC-P0-AC-050", "MEDIA-REC-P0-AC-042", "MEDIA-REC-P0-AC-029"]
          fixtureActorRef: "media.editor"
          syntheticProjectAuthority: "MEDIA_PROJECT_FIXTURE_ONLY_NO_CANONICAL_RUNTIME_WRITER"
          setup: "Synthetic immutable MediaProject R2 with a LOCKED human hotspot anchor and concurrently updated authoritative project revision R3"
          action: "Submit an edit against stale expected revision R2 while an automation proposal targets the locked hotspot"
          expected: "Typed CONFLICT with both source revision identities, an editable non-authoritative draft and explicit semantic rebase/review action"
          rejection: "No overwrite of R3, no silent lock loss, no fabricated branch finality and no retry of the same unknown state with a new request identity"
          expectedFinality: "CONFLICT_UNCOMMITTED_NO_VIEWER_PUBLICATION"
          status: "AUTHORED_NOT_EXECUTED_OR_QUALIFIED"
      acceptanceStatus: "SOURCE_DEFINITION_ONLY_TESTS_AND_INDEPENDENT_REVIEW_NOT_RUN"

