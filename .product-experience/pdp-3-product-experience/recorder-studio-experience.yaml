  surfaceIds: ["media.surface.recorder-orchestrator", "media.surface.capture-adapters"]
  views: ["configuration-schema-and-effective-policy", "source-qualification-and-timebase", "plan-and-product-postcondition", "bounded-run-and-lease-state", "typed-owner-observation-and-finality", "scene-and-media-quality-result", "redacted-trace-and-safe-recovery"]
  formats: ["YAML", "JSON", "CLI-human", "CLI-json", "CLI-jsonl", "SDK/API-typed-request-response", "event-observation"]
  denialStates: ["DENIED", "UNAVAILABLE", "CONFLICT", "OUTCOME_UNKNOWN", "PARTIAL", "ABSTAINED"]
  rule: "Presentation is of actual machine observations, not an invented product screen or live effect."
explorerProjection:
  status: "SPECIFICATION_ONLY_NOT_VERIFIED"
  lenses: ["Studio-GUI", "Recorder-CLI-API", "Capture-Source-Adapter", "Embedded-Interactive-Player"]
  dataInputs: ["exact-PDP0-acceptance", "PDP1-canonical-read-model", "PDP2-design-grammar", "PDP3-source-scene-steps", "synthetic-policy-tagged-fixtures"]
  requiredInteractions: ["step-through-positive-and-denial-beats", "inspect-source-time-and-revision", "simulate-UNKNOWN-without-claiming-remote-finality", "inspect-keyboard-and-text-edit-parity", "compare-authored-versus-observed-result", "inspect-redacted-trace", "view-current-owner-qualification"]
  nonClaims: ["no-live-capture", "no-native-Studio-implementation", "no-real-product-readback", "no-independent-review", "no-admitted-screen-registry", "no-PDP3-DEV_COMPLETE"]
independentAcceptanceConditions: ["One current source-bound PDP-3 journey/screen/CLI/API/embedded contract per affected logical consumer with step-level exact operation and denial/recovery owner bindings.", "Bind all 13 scoped Studio workspace intents to real P3 screen contracts and admitted P2 templates, recipes, shared semantic components; update 47-screen denominator only when exact new canonical screens exist.", "Prove all 52 manual operations through canonical revision, keyboard/text/headless and denial-reconciliation contract projections.", "Feed exact P0 source identity and P1/P2/P3 semantic digests into source manifest, generator and Explorer with negative regression and currentness.", "Execute real native YAML, structural, semantic, projection and phase acceptance checks on checkout; record run identity and reviewer dispositions before successor DEV_COMPLETE."]
