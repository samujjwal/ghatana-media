  projectedStates: ["LOADING", "READY", "OFFLINE", "UNSUPPORTED_FEATURE", "POLICY_DENIED", "UNAVAILABLE", "FINISHED"]
  hostActionStatus: "NO_DELEGATED_PRODUCT_MUTATION_OR_UNAPPROVED_NETWORK_EGRESS"
