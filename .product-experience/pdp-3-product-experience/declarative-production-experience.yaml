schemaVersion: media.declarative-production.pdp3-successor.v1
productId: media
sourcePhase: PDP-3
status: SOURCE_AUTHORED_PENDING_NATIVE_VALIDATION_EXPLORER_AND_CURRENTNESS
sourceP0: .product-experience/pdp-0-product-truth/requirements.yaml#declarativeProductionProfile
sourceP1: .product-experience/pdp-1-domain-data/declarative-production-contracts.yaml#caseOperationBindings
sourceP2: .product-experience/pdp-2-design-interface-system/animation-simulation-grammar.yaml#declarativeProductionInterface
canonicalJourneyRegistry: .product-experience/pdp-3-product-experience/journey-registry.yaml
canonicalScreenRegistry: .product-experience/pdp-3-product-experience/screen-registry.yaml
recorderExperienceReuse: .product-experience/pdp-3-product-experience/recorder-studio-experience.yaml
sourceOnly: No PDP-3 journey, screen, registered operation, provider, actual scientific solver, course or runtime route is created by this overlay.
denominators: {existingRecorderPdp0Cases: 84, declarativeCases: 61, scopedTotal: 145, distinctNewOperations: 0, distinctNewScreens: 0, addedPhysicalPackages: 0}
originKinds: [REAL_CAPTURE, DECLARATIVE_ANIMATION, MODEL_SIMULATION, GENERATIVE_MEDIA, PDP_SYNTHETIC_FIXTURE]
experienceEntryKinds:
  realCapture: [source-actor-and-tenant-permission, source-readiness-and-lease, observed-product-postcondition, verified-AV-timeline, scene-quality-and-rights]
  declarativeAnimation: [typed-scene-and-assets, time-and-keyframe-setup, semantic-and-a11y-preview, manual-or-auto-adjustment, qualified-render-and-export]
  modelSimulation: [versioned-domain-model-and-units, solver-and-fidelity-admission, immutable-initial-and-boundary-state, predict-manipulate-measure-explain, checkpoint-and-metrics, model-oracle-review]
  generatedMedia: [versioned-generation-model, consent-and-license, source-class-marked-output, review-and-regeneration]
  syntheticFixture: [visible-fixture-label, exact-fake-source-identity, no-production-proof, deny-product-or-scientific-finality-claims]
semanticProjectBehavior:
  commonProject: one-MediaProject-revision-for-voice-capture-animation-simulation-render-captions-and-editorial-changes
  scenes: meaningful source-anchor-to-derived-output lineage and half-open rational time intervals
  finality: local preview, owner-confirmed model result, external product business finality and publish acknowledgment remain distinct
  humanEdits: all 52 Studio kinds remain reversible with CAS, lock/conflict handling and no silent AI override
  failure: "[DENIED, CONFLICT, OUTCOME_UNKNOWN, UNAVAILABLE, PARTIAL, REVIEW_REQUIRED] preserve authoritative source and typed reason"
channelApplicability:
  media.surface.recorder-orchestrator: source-only-headless-config-and-CLI-API-with-machine-parity
  media.surface.capture-adapters: source-only-device-API-service-contract-probe-no-synthetic-product-interface
  media.surface.production-studio: source-only-Web-GUI-with-exact-existing-scene-animation-simulation-screens
  media.surface.interactive-demo-player: source-only-embedded-sandboxed-and-accessible-scenes-with-local-choices
tutorPutorLearnerExperience:
  predict: collect local prediction text/value/unit; actual learner submission requires TutorPutor owner evidence
  manipulate: show typed parameter bounds and model-version changes; no arbitrary code execution
  measure: show exact solver observable, unit, uncertainty, time and validation tier in linked table/chart/scene
  explain: align static formula, reduced-motion/narration/caption explanation and source-state evidence
  alternative: unavailable solvers/graphics yield static accessible table/diagram with truthful provenance
  authority: All Model IR, pedagogy, scientific validity, learner state, content and release belong to TutorPutor
sourceBoundScenarios:
  - id: media.declarative.p3.scenario.newton-constant-force.v1
    journeyRef: J-14
    screenRef: media.view.explore-simulation
    sourceOracle: .product-experience/pdp-1-domain-data/declarative-production-contracts.yaml#scientificReferenceOracles
    given: versioned F2-eligible 1D constant-net-force model with mass 2 kg, force 6 N, zero initial velocity and time 2 seconds
    then: show a 3 m/s2, v 6 m/s and displacement 6 m from model data with independently checked tolerances; animation only depicts observed state
    denial: solver-missing-unit-invalid-or-scientific-qualification-not-established-displays-not-admitted
    evidence: ANALYTICAL_REFERENCE_ONLY
  - id: media.declarative.p3.scenario.story-pause-does-not-step-physics.v1
    journeyRef: J-14
    screenRef: media.view.explore-simulation
    given: valid simulation paused with animation presentation seek
    then: tSim and model state digest remain unchanged while tStory display advances
    denial: missing-timeline-alignment-never-guesses-model-time
    evidence: MODEL_PRESENTATION_CONTRACT_ONLY
  - id: media.declarative.p3.scenario.animation-2d-3d-semantic-preview.v1
    journeyRef: J-12
    screenRef: media.view.animate-media
    given: semantic keyframes, data-bound math and qualified art geometry
    then: 2D and 3D render plans share versioned scene nodes, editorial parameters and accessible textual equivalents
    denial: unsafe-formula-or-invalid-3d-coordinate-frame-prevents-unqualified-render
    evidence: SOURCE_REUSE_CONTRACT_ONLY
  - id: media.declarative.p3.scenario.experience-fixture-not-scientific-proof.v1
    journeyRef: J-15
    screenRef: media.view.explore-simulation
    given: a PDP Explorer synthetic fixture is viewed next to real scientific model output
    then: maintain visible simulated-fixture versus model-solver-run source labels
    denial: never-label-generated-or-fixture-picture-as-physical-or-product-evidence
    evidence: SOURCE_REUSE_CONTRACT_ONLY
  - id: media.declarative.p3.scenario.solver-divergence-and-unit-mismatch.v1
    journeyRef: J-14
    screenRef: media.view.explore-simulation
    given: invalid solver convergence or inconsistent dimension system
    then: preserve source conditions, decline quantitative pass, show bounded residual and recovery
    denial: no-silent-parameter-or-solver-substitution
    evidence: SOURCE_REUSE_CONTRACT_ONLY
  - id: media.declarative.p3.scenario.manual-locked-scene-selective-recapture.v1
    journeyRef: J-18
    screenRef: media.view.compose-media
    given: one recorded product scene changes after an editor locks camera framing and captions
    then: regenerate only affected descendants, preserve manual lock and rebase with explicit three-way conflict
    denial: conflict-with-human-edits-requires-review-not-overwrite
    evidence: SOURCE_REUSE_CONTRACT_ONLY
  - id: media.declarative.p3.scenario.api-only-demo-no-fake-gui.v1
    journeyRef: J-09
    screenRef: media.view.compose-media
    given: an API-only product journey has no browser or graphical UI
    then: present actual structured request/result and approved explanatory animation rather than fabricated screenshots
    denial: unknown-product-effect-remains-UNKNOWN-until-owner-readback
    evidence: SOURCE_REUSE_CONTRACT_ONLY
  - id: media.declarative.p3.scenario.tutorputor-predict-manipulate-measure-explain.v1
    journeyRef: J-14
    screenRef: media.view.explore-simulation
    given: a versioned TutorPutor Experience IR and Model IR with a public Scene IR map
    then: preserve learner prediction intent, bounded parameter changes, model measurements, narrated explanation and product-owned evidence boundary
    denial: no-learner-master-data-storage-or-mastered-status-in-Media
    evidence: PUBLIC_CONTRACT_CANDIDATE_NOT_TUTORPUTOR_ACCEPTED
