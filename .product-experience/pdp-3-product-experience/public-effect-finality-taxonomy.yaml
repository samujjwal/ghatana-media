    domainOperationDisposition: OWNER_DEFINED_EXACT_OPERATION_REFERENCE
    operationRefs:
      - media.operation.capability.media-stream-session-reconnect
    canonicalOperationFacts:
      - operationRef: media.operation.capability.media-stream-session-reconnect
        operationKind: COMMAND
        operationEffect:
          semanticOutcome: A caller can reconnect stream session with explicit preconditions, effect,
            provenance, and recovery semantics.
          sourceConstraints:
            - No product default/model/provider is inferred from names, package presence, tests, or
              source documentation.
            - Unsupported combinations remain explicit; no silent substitution.
            - Preserve source and report reconstruction or estimation distinctly from
              measured/ground-truth output.
          preserveSource: true
          noSilentFallback: true
          mutationBoundary: no effect until all admission guards pass; authoritative state receipt required
        scopeStatus: null
        sourceContractRef: null
    sourceEffect: Request a fenced reconnect for the same existing tenant-scoped live session only after
      exact session identity, current consent and purpose, lease and fence, prior-frame receipts,
      recovery budget, and next safe frame sequence are verified. This requests a transport and
      lease handshake; it does not assert that the session was restored or that a frame was sent.
    sourceFinality: Only a current authoritative session-owner receipt bound to the exact session and
      request may report reconnect state; dispatch or transport acknowledgement is not success. A
      missing or ambiguous receipt remains UNKNOWN_OUTCOME, and reconnect does not imply any frame
      was sent.
    reversibilityDisposition: UNKNOWN
    confirmationDisposition: REQUIRED
    publicEffectCandidate:
