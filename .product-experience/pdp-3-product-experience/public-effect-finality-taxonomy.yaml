schemaVersion: media.pdp3.public-effect-finality-taxonomy.v1
productId: media
authority: Media-owner-authored-definition-only; independent PDP-3 review pending; no generated
  public projection is accepted by this artifact.
scope: Per-action public taxonomy mapping candidates for the complete PDP-3 action inventory. Exact
  operation identities/kinds are source-bound; action semantics and review limits remain explicit.
toolsSchemaBoundary:
  package: "@ghatana/experience-specification"
  version: 0.1.0-SNAPSHOT
  sourceCommit: 6ed280283872df7889369b71abb3c9e62cb17f8d
  sourceSchemaRef: ghatana-tools/libs/product-development/experience-specification/schemas/experience-specification.v1.schema.json#/definitions
  installedSnapshotDisposition: Installed Media workspace package snapshot predates the enum
    extension; it is not used to validate these candidates.
  candidateValidation: Current Tools source schema only; this does not claim the package is published,
    released, or authoritative for a phase-accepted Media projection.
  effectDefinition:
    required:
      - id
      - name
      - kind
      - description
    kindEnum:
      - state-change
      - navigation
      - notification
      - external-call
      - data-write
      - other
    reversible: legacy optional boolean; when omitted reversibilityDisposition is required
    reversibilityDispositionEnum:
      - REVERSIBLE
      - NOT_REVERSIBLE
      - CONDITIONAL
      - UNKNOWN
  finalityDefinition:
    required:
      - id
      - actionRef
      - description
    confirmationRequired: legacy optional boolean; when omitted confirmationDisposition is required
    confirmationDispositionEnum:
      - REQUIRED
      - NOT_REQUIRED
      - UNRESOLVED
    undoable: legacy optional boolean; when omitted undoabilityDisposition is required
    undoabilityDispositionEnum:
      - REVERSIBLE
      - NOT_REVERSIBLE
      - CONDITIONAL
      - UNKNOWN
  compatibility: Existing boolean-only records remain valid; when both representations are present
    they must agree; conditional, unknown, and unresolved dispositions forbid their corresponding
    booleans.
  dependencyChange: Implemented locally in the Tools source contract and consumer validation. Tools
    owner review/publication and PDP acceptance remain separate.
projectionPolicy:
  status: OWNER_MAPPING_PENDING_REVIEW
  emitEffectWhen: exact per-action mapping has bounded Media owner review; emit the enum disposition
    directly, including CONDITIONAL and UNKNOWN
  emitFinalityWhen: exact per-action mapping has bounded Media owner review; emit
    confirmationDisposition and undoabilityDisposition directly, including UNRESOLVED, CONDITIONAL
    and UNKNOWN
  phaseAcceptance: Independent PDP-3 acceptance and Lifecycle currentness remain separate; a public
    candidate projection is not phase acceptance
  unknownOrConditional: never coerce to a legacy boolean; use the matching enum field, and retain an
    unresolved mapping when semantic role is not bounded
  domainOperationSuccess: never inferred from public taxonomy mapping
