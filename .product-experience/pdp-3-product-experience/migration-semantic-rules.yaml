    acceptanceEffect: none
  - id: media.pdp3.migration-rule.mpsem-0368-c003
    claimId: MPSEM-0368-C003
    sourceText: delivery to a central sink may be asynchronous through an admitted
      durable path.
    sourceTextSha256: f6910bbd0471ca6c97dfa44032550ae5092f004a98c70958e1bf0a8da022b513
    semanticRule: Delivery to a central sink may be asynchronous only through an
      admitted durable path, with request acceptance separate from sink
      acknowledgement.
    positiveCase: The operation records a durable delivery intent and later reports
      a separately observed sink acknowledgement.
    negativeCase: Treating queue acceptance or transient transport success as
      central-sink delivery.
    sourceOwnerPhase: PDP-3
    ownerDecisionStatus: OWNER_REVIEWED_SOURCE_DEFINITION; PXD-097; independent acceptance pending
