  - id: media.pdp3.migration-rule.mpsem-0441-c003
    claimId: MPSEM-0441-C003
    sourceText: Every surface answers context, goal, current state, next action and
      material blocker.
    sourceTextSha256: f39e7cbc1142b8fb0763d7cf7b6122c3505be373780ecb9275acc514d053c4dc
    semanticRule: Every product surface explains context, goal, current state, next
      action and material blocker using source-backed state; unsupported state
      remains UNKNOWN.
    positiveCase: A screen binds each displayed status and next action to its exact
