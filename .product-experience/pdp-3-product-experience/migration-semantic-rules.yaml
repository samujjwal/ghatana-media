  - id: media.pdp3.migration-rule.mpsem-0378-c003
    claimId: MPSEM-0378-C003
    sourceText: They do not rewrite old execution evidence.
    sourceTextSha256: 24e871c8798f8471a06c6cd3c33cb95fb92e1b82c244bbd26cb284fc8563bd9a
    semanticRule: New mappings and policy changes do not rewrite historical
      execution evidence; historical records retain the meaning/version under
      which they were produced.
    positiveCase: A new policy version applies prospectively while prior evidence
      remains bound to its original version.
    negativeCase: Reinterpreting old execution results as if the current policy had
      governed them.
    sourceOwnerPhase: PDP-3
    ownerDecisionStatus: OWNER_REVIEWED_SOURCE_DEFINITION; PXD-097; independent acceptance pending
    runtimeAdmission: NOT_ADMITTED
    acceptanceEffect: none
  - id: media.pdp3.migration-rule.mpsem-0379-c002
    claimId: MPSEM-0379-C002
    sourceText: Reuse is tenant/ownership compatible and rechecks current rights,
      consent, retention, license and policy even if bytes are identical.
    sourceTextSha256: c6fd02512ee7b2bbf28542a01c5fd18a37053aba43a1d3f6d9256b19cb518f7b
    semanticRule: Reuse requires tenant/ownership compatibility and fresh checks of
      rights, consent, retention, license and policy even when media bytes are
      identical.
    positiveCase: A reuse decision binds the exact tenant, owner, subject version
      and all current policy dimensions.
    negativeCase: Using byte equality as a substitute for authorization or
      cross-tenant isolation.
    sourceAuthorityRefs:
      - .product-experience/pdp-1-domain-data/privacy.yaml#ownerDefinedPdp10Boundary/tenantIsolation
      - .product-experience/pdp-0-product-truth/policy-authority-model.yaml#dataHandling.purposeBoundDataAccess
    sourceOwnerPhase: PDP-3
    ownerDecisionStatus: OWNER_REVIEWED_SOURCE_DEFINITION; PXD-097; independent acceptance pending
