  - id: media.pdp3.migration-rule.mpsem-0440-c005
    claimId: MPSEM-0440-C005
    sourceText: Profiles, provider diagnostics, rights detail, provenance and
      operations are contextual or role-scoped.
    sourceTextSha256: a41581aa84d165868c5f843113951528a45ac3f9411bf632a5a43bcfe4a279c5
    semanticRule: Profiles, provider diagnostics, rights detail, provenance and
      operational details are shown only in the relevant context and to an
