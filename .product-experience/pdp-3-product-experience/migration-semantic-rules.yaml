    acceptanceEffect: none
  - id: media.pdp3.migration-rule.mpsem-0380-c001
    claimId: MPSEM-0380-C001
    sourceText: Never share private embeddings, voice models, prompts, sensitive
      deduplication existence or generated candidates across tenants by default.
