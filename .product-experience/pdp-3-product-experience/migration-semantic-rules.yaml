    sourceOwnerPhase: PDP-3
    ownerDecisionStatus: OWNER_REVIEWED_SOURCE_DEFINITION; PXD-097; independent acceptance pending
    runtimeAdmission: NOT_ADMITTED
    acceptanceEffect: none
  - id: media.pdp3.migration-rule.mpsem-0297-c003
    claimId: MPSEM-0297-C003
    sourceText: Preserve existing response shapes for supported consumers until
      explicit version negotiation/migration.
    sourceTextSha256: a1ba0a6dcb28f895436e1c67061baeb89a08d5e2fd6a102f92f606f3f3124845
    semanticRule: Supported consumers retain their existing response shapes until
      explicit version negotiation or migration authorizes a shape change.
    positiveCase: A response-shape change is gated by a versioned compatibility map
      and consumer negotiation.
    negativeCase: Changing a supported response shape merely because a new
      implementation or schema exists.
    sourceOwnerPhase: PDP-3
    ownerDecisionStatus: OWNER_REVIEWED_SOURCE_DEFINITION; PXD-097; independent acceptance pending
    runtimeAdmission: NOT_ADMITTED
    acceptanceEffect: none
  - id: media.pdp3.migration-rule.mpsem-0299-c002
    claimId: MPSEM-0299-C002
    sourceText: Define fail-fast versus continue-on-item-failure explicitly
    sourceTextSha256: 1c35d78cb777158585ad990b07e2917b70ef571591b4e48d355e8fb854757ea8
    semanticRule: A batch contract explicitly selects fail-fast or
      continue-on-item-failure semantics and reports per-item results
      accordingly.
    positiveCase: The batch definition names its failure mode and returns each
      attempted item outcome under continue mode.
    negativeCase: Inferring batch failure behavior from worker ordering or hiding
      failed items behind one aggregate success.
    sourceOwnerPhase: PDP-3
    ownerDecisionStatus: OWNER_REVIEWED_SOURCE_DEFINITION; PXD-097; independent acceptance pending
    runtimeAdmission: NOT_ADMITTED
    acceptanceEffect: none
  - id: media.pdp3.migration-rule.mpsem-0305-c001
    claimId: MPSEM-0305-C001
    sourceText: Submit, status/list, progress stream or polling, cancel, explicit
      retry, reconcile, output lookup
    sourceTextSha256: 5f00817e2198746689e730b4724d499991010bbf70911ed6294c72a46acbcb5b
    semanticRule: Long-running work defines submit, status/list, progress
      observation, cancel request, explicit retry, reconciliation and output
      lookup as separate operations with separate finality.
    positiveCase: A client can distinguish submission receipt, status observation,
      cancellation request, retry request, reconciliation and registered output.
    negativeCase: Treating stop-watching as cancellation, retry as reconciliation,
      or accepted submission as completed output.
    sourceOwnerPhase: PDP-3
    ownerDecisionStatus: OWNER_REVIEWED_SOURCE_DEFINITION; PXD-097; independent acceptance pending
    runtimeAdmission: NOT_ADMITTED
    acceptanceEffect: none
  - id: media.pdp3.migration-rule.mpsem-0306-c001
    claimId: MPSEM-0306-C001
    sourceText: "| Project/scene/timeline"
    sourceTextSha256: 944740668fc3396fd63847e49ce7ef1355b7a4ec20b8ba2bcadaf9c62db4c632
    semanticRule: The project/scene/timeline context remains the explicit ownership
