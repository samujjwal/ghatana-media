  - id: media.pdp3.migration-rule.mpsem-0288-c001
    claimId: MPSEM-0288-C001
    sourceText: "`preserve`, `enhance`, `creative`"
    sourceTextSha256: c46d702ccc36ddf8d16c984ad549198ea750c7ce3a6a382384ca992440a9322e
    semanticRule: The values `preserve`, `enhance`, and `creative` are distinct
      requested processing intents and retain their separate policy
      implications.
    positiveCase: A request records one declared intent and selects only
      transformations allowed for that intent.
    negativeCase: Treating creative intent as permission to violate preservation
      constraints, or treating preserve as a generative repair request.
    sourceOwnerPhase: PDP-3
    ownerDecisionStatus: OWNER_REVIEWED_SOURCE_DEFINITION; PXD-097; independent acceptance pending
    runtimeAdmission: NOT_ADMITTED
    acceptanceEffect: none
  - id: media.pdp3.migration-rule.mpsem-0291-c007
    claimId: MPSEM-0291-C007
    sourceText: Record requested/effective profiles and reasons.
    sourceTextSha256: 11849a332438d41c508f8d618ddc7cd84efbf4d14771f28618710309794ed1da
    semanticRule: Fallback records requested and effective profiles and the reason
      for each difference, including the relevant quality, resource and
