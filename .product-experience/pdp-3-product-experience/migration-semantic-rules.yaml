  - id: media.pdp3.migration-rule.mpsem-0357-c001
    claimId: MPSEM-0357-C001
    sourceText: Enforce at upload/import admission
    sourceTextSha256: 193ca09069a7555991deb45b357b1a53f066280c6df37cd561ac8f28324a9d82
    semanticRule: Rights, consent, retention and format admission are enforced at
