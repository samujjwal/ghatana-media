  - id: media.pdp3.migration-rule.mpsem-0357-c003
    claimId: MPSEM-0357-C003
    sourceText: Check revocation/expiry at appropriate boundaries during
      long-running/streaming work.
    sourceTextSha256: fadf8c3e30dae30ec51ee70655cffceeb6cf1247169c2adf6c1a44ca7edcfa88
    semanticRule: Long-running and streaming work rechecks revocation and expiry at
      the relevant effect boundaries; a prior check does not authorize later
      work indefinitely.
    positiveCase: Each later governed effect uses current rights/consent/retention
      evidence for the exact subject and purpose.
    negativeCase: Continuing based solely on an earlier admission after expiry,
      revocation, or policy-version change.
    sourceAuthorityRefs:
      - .product-experience/pdp-1-domain-data/privacy.yaml#ownerDefinedPdp10Boundary/consentRevocation
      - .product-experience/pdp-1-domain-data/privacy.yaml#ownerDefinedPdp10Boundary/effectBoundary
    sourceOwnerPhase: PDP-3
    ownerDecisionStatus: OWNER_REVIEWED_SOURCE_DEFINITION; PXD-097; independent acceptance pending
    runtimeAdmission: NOT_ADMITTED
    acceptanceEffect: none
  - id: media.pdp3.migration-rule.mpsem-0367-c001
    claimId: MPSEM-0367-C001
    sourceText: A downloaded or published copy may be beyond Media’s control
    sourceTextSha256: a9d37cdfb4676b40cc41d30544487ae75918e785d639c0e591c1ac3fea302832
    semanticRule: A downloaded or published copy can be beyond Media control; Media
      reports its own copy and any external deletion only when
      deployment-specific evidence confirms it.
    positiveCase: The product distinguishes Media erasure from external-copy status
      and reports external status as UNKNOWN without proof.
    negativeCase: Claiming external copies were erased because Media deleted its own
      record or key.
    sourceAuthorityRefs:
      - .product-experience/pdp-1-domain-data/privacy.yaml#ownerDefinedPdp10Boundary/retentionAndErasure
    sourceOwnerPhase: PDP-3
    ownerDecisionStatus: OWNER_REVIEWED_SOURCE_DEFINITION; PXD-097; independent acceptance pending
