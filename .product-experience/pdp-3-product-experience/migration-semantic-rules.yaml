  - id: media.pdp3.migration-rule.mpsem-0280-c001
    claimId: MPSEM-0280-C001
    sourceText: Use deterministic measurements when sufficient.
    sourceTextSha256: ce0020382c01e2d1fab4f5efccd47d8ccadc53e77fedf4bd680821089633d2e7
    semanticRule: Use deterministic measurements when they are sufficient for the
      requested analysis or decision.
    positiveCase: A deterministic measurement is selected when its declared
      applicability covers the requested subject and metric.
    negativeCase: Dispatching a generative model when deterministic measurements
      already satisfy the stated need.
    sourceOwnerPhase: PDP-3
    ownerDecisionStatus: OWNER_REVIEWED_SOURCE_DEFINITION; PXD-097; independent acceptance pending
    runtimeAdmission: NOT_ADMITTED
    acceptanceEffect: none
  - id: media.pdp3.migration-rule.mpsem-0280-c003
    claimId: MPSEM-0280-C003
    sourceText: generative models may repair only within authorized
      preservation/cost bounds.
    sourceTextSha256: 9d2ace0c715ceb7be908a6eef617faca417491e4a597ce099842e1e9dbd9b37a
    semanticRule: Generative repair is permitted only within explicit authorized
      preservation and cost bounds; an LLM critique alone cannot approve
      technical or scientific correctness.
    positiveCase: Repair inputs bind preservation constraints and cost limits, and
      review uses independent measurement evidence.
    negativeCase: Allowing a generative change outside authorized bounds or
      approving it from critique text alone.
    sourceOwnerPhase: PDP-3
    ownerDecisionStatus: OWNER_REVIEWED_SOURCE_DEFINITION; PXD-097; independent acceptance pending
