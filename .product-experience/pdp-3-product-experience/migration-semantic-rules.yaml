    acceptanceEffect: none
  - id: media.pdp3.migration-rule.mpsem-0319-c001
    claimId: MPSEM-0319-C001
    sourceText: "`plan --request FILE`, `run --plan FILE`, `run --request FILE`"
    sourceTextSha256: 0c83f7332f634ae8ec2979819446f746eb0f18fcae554b35db6e13f7077c400b
    semanticRule: "The CLI distinguishes planning from execution: `plan --request
