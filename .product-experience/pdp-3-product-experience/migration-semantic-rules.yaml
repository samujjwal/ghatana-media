  - id: media.pdp3.migration-rule.mpsem-0335-c004
    claimId: MPSEM-0335-C004
    sourceText: Diagnostics use stderr and are redacted.
    sourceTextSha256: 34ec74e9966e94e6652c42410c5ce68a629eeec669147237d29ca8522ca2100b
    semanticRule: Diagnostics are written to stderr and redacted before emission.
    positiveCase: A diagnostic uses stderr and removes configured sensitive values
