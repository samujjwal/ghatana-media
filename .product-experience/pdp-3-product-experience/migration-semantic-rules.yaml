  - id: media.pdp3.migration-rule.mpsem-0178-c003
    claimId: MPSEM-0178-C003
    sourceText: Declared, qualified and currently available are different states
    sourceTextSha256: 40232d0391ac1a814441114ecc3e1e34fe860aba792d5720343b66a36b762683
    semanticRule: Declared, qualified and currently available are distinct states. A
      declaration does not prove qualification; qualification does not prove
      present availability.
    positiveCase: A result reports each dimension separately with evidence or UNKNOWN.
    negativeCase: Collapsing declaration, qualification and availability into a
      single eligible/supported label.
    sourceOwnerPhase: PDP-3
    ownerDecisionStatus: OWNER_REVIEWED_SOURCE_DEFINITION; PXD-097; independent acceptance pending
    runtimeAdmission: NOT_ADMITTED
    acceptanceEffect: none
  - id: media.pdp3.migration-rule.mpsem-0204-c003
    claimId: MPSEM-0204-C003
    sourceText: Preserve the source and compare the result.
    sourceTextSha256: c7980ccd670863d20d2a6350b9cf4b9233cc7310a55b30230702fe4bbf52d456
    semanticRule: Quality review preserves the exact source and compares the
      candidate/result against that source; preservation evidence and measured
