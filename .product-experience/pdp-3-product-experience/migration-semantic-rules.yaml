  - id: media.pdp3.migration-rule.mpsem-0003-c003
    claimId: MPSEM-0003-C003
    sourceText: Material in this plan that has not been extracted into those
      authorities remains a proposal, not a parallel semantic authority
    sourceTextSha256: 796bf4aa5433b26fa70138490bc218b8ddc1e5fc959683e0e9b35270a799ae1a
    semanticRule: Unextracted migration-plan material stays a proposal; only the
      applicable PDP authority and its explicitly accepted decisions define
      canonical product meaning. Execution-plan text cannot create a parallel
      semantic authority.
    positiveCase: An unextracted plan clause is explicitly marked proposal and
      resolves to no canonical product state until an applicable PDP decision
      accepts it.
    negativeCase: Promoting unextracted plan prose to an accepted operation/state meaning.
    sourceOwnerPhase: PDP-3
    ownerDecisionStatus: OWNER_REVIEWED_SOURCE_DEFINITION; PXD-097; independent acceptance pending
    runtimeAdmission: NOT_ADMITTED
    acceptanceEffect: none
  - id: media.pdp3.migration-rule.mpsem-0003-c005
    claimId: MPSEM-0003-C005
    sourceText: Task order, migration procedure, phase deliverables, verification
      strategy, and downstream handoff guidance remain useful execution
      references.
    sourceTextSha256: 3626cbe3fc07250639d09916c6600f78b9ab2a8d7b441227e04532e7bfc3342e
    semanticRule: Task order, migration procedure, phase deliverables, verification
      strategy and downstream handoff guidance remain execution references. They
      do not establish source correctness, task completion, phase acceptance or
      current Lifecycle receipt.
    positiveCase: A report may use the plan for sequencing while independently
      sourcing task and phase status.
    negativeCase: Treating an execution checklist entry as evidence that its product
      obligation or acceptance gate is complete.
