  - id: media.pdp3.migration-rule.mpsem-0316-c002
    claimId: MPSEM-0316-C002
    sourceText: Simple aliases compile into the same request/plan
    sourceTextSha256: f4ba4d3823b4ec8ce87253b1583acd5d6a8daa3bfdecb5e919ad3c5ed9296d1f
    semanticRule: Simple CLI aliases compile to the same canonical request/plan as
