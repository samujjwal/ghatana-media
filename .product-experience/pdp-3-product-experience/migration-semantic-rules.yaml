    positiveCase: A review record binds immutable source and result versions plus
      metric/evidence references.
    negativeCase: Replacing the source or treating a sharper-looking result as
      sufficient acceptance.
    sourceOwnerPhase: PDP-3
    ownerDecisionStatus: OWNER_REVIEWED_SOURCE_DEFINITION; PXD-097; independent acceptance pending
    runtimeAdmission: NOT_ADMITTED
    acceptanceEffect: none
  - id: media.pdp3.migration-rule.mpsem-0225-c002
