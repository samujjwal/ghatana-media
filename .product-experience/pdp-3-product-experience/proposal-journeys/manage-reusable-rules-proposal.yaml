accessibility:
  web: Interactive authoring, exact-version inspection, validation status, and reuse-plan review expose programmatic names, roles, descriptions, keyboard operation, visible focus, and announced status/errors. Status is not conveyed by color alone; error and unknown states retain focus and exact request/version context.
  headless: API, SDK, CLI, and product-integration proposals preserve the same typed request/result meanings and explicit outcome states. No endpoint, wire shape, package, command, or invocation is assigned by this journey; absent a separately authorized mapping, behavior remains UNBOUND and NOT_ADMITTED.
preconditions:
  - Caller supplies exact tenant, principal, actor, purpose, rights/consent context, request identity, and idempotency key for each proposed operation.
  - Caller identifies the rule-set scope, declared input and constraint provenance, and exact predecessor when compiling a successor.
  - Validation and reuse name one exact version, fingerprint, validation context, and target operation; target-operation authorization is distinct and separately evidenced.
  - Source operations are proposal-only and not admitted; this journey does not assert owner acceptance, authorization evidence, or runtime availability.
completion:
  meaning: The caller can distinguish an immutable candidate, exact-version inspection, a version-bound validation observation, and a non-executable candidate operation plan. No rule is approved, applied, or executed by this journey.
  sourceRefs:
    - .product-experience/pdp-0-product-truth/campaign-extensions.yaml#records/@id=AUD-SPEC-020/capabilityDefinition/outcome
    - .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/compileContract
