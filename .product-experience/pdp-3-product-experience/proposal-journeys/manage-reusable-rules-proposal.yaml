    - .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/validationContract
    - .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/reuseContract
  evidenceBoundary: Definition only; no owner receipt, runtime result, transport proof, approval, operation execution, or measured media result is asserted.
steps:
  - stepId: author-versioned-candidate
    operationRef: media.rules.compile-candidate.v1
    requestSchemaRef: .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/compileContract/requestSchema
    resultSchemaRef: .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/compileContract/resultSchema
    requestInputs: [requestContext, ruleSetRef, expectedVersionRef, declaredScope, declaredInputs, constraints, sourceRefs, rules]
    success:
      outcomes: [COMPILED]
      resultFields: [candidate, normalizedSemanticGraph, semanticFingerprint]
      invariant: Candidate is immutable, versioned, and does not approve or execute its rules; the exact predecessor is preserved and never silently rebased.
    nonSuccess:
      outcomes: [REJECTED, UNSUPPORTED, DENIED, CONFLICT, STALE, UNKNOWN, UNAVAILABLE]
      effects: NONE
      candidateReturned: false
  - stepId: inspect-exact-version
    operationRef: media.rules.inspect-candidate.v1
    requestSchemaRef: .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/inspectContract/requestSchema
    resultSchemaRef: .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/inspectContract/resultSchema
    requestInputs: [requestContext, ruleSetVersion]
    exactTarget: tenantRef + ruleSetId + versionId
    success:
      outcomes: [INSPECTED]
      resultFields: [candidate, sourceRefs]
      invariant: Inspection is read-only and returns only the requested exact version; it does not imply validation, approval, reuse, or execution.
    nonSuccess:
      outcomes: [DENIED, CONFLICT, STALE, UNKNOWN, UNAVAILABLE]
      fallbackToDifferentVersion: false
  - stepId: validate-exact-candidate
    operationRef: media.rules.validate-candidate.v1
    requestSchemaRef: .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/validationContract/requestSchema
    resultSchemaRef: .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/validationContract/resultSchema
    requestInputs: [requestContext, candidateVersionRef, ruleSetVersion, expectedFingerprint, validationContextRef]
    success:
      outcomes: [VALID]
      resultFields: [validationResultRef, candidateVersionRef, ruleSetVersion, fingerprint, validationContextRef, observedAt, sourceRefs, diagnostics]
      invariant: VALID applies only to the exact version, fingerprint, scope, and current validation context; it is observational and grants no approval or execution authority.
    nonSuccess:
      outcomes: [INVALID, UNSUPPORTED, UNAVAILABLE, DENIED, CONFLICT, STALE, UNKNOWN]
      effects: NONE
      authorizesReuse: false
  - stepId: request-candidate-only-reuse
    operationRef: media.rules.reuse-candidate.v1
    requestSchemaRef: .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/reuseContract/requestSchema
    resultSchemaRef: .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/reuseContract/resultSchema
    requestInputs: [requestContext, candidateVersionRef, ruleSetVersion, expectedFingerprint, targetOperationRef, targetOperationAuthorizationRef, validationResultRef, validationContextRef]
    success:
      outcome: REUSE_REQUESTED
      resultField: operationPlan
      planSchemaRef: .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/reuseContract/operationPlanSchema
      requiredPlanDisposition: CANDIDATE_OPERATION_PLAN_ONLY
      requiredExecutionAdmission: NOT_ADMITTED
      invariant: Plan binds the exact candidate, version, fingerprint, validation evidence, target operation, separate authorization reference, and provenance; it does not apply rules or invoke the target.
    nonSuccess:
      outcomes: [DENIED, CONFLICT, UNKNOWN, UNAVAILABLE, STALE, INVALID, UNSUPPORTED]
      operationPlanReturned: false
      effects: NONE
  - stepId: recover-without-replay-or-rebase
    sourceRefs:
      - .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/reuseContract/recovery
      - .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/failClosedCases
    cases:
      UNKNOWN: Reconcile the same tenant, principal, operation, request identity, idempotency key, and canonical payload fingerprint before any retry; UNKNOWN is not success or permission for a second write.
      STALE_or_CONFLICT: Inspect the exact requested/current identities and require a new explicit request; never select latest or silently rebase.
      INVALID_or_UNSUPPORTED: Preserve the prior version and diagnostics; correct inputs only through a separately explicit authoring request.
      DENIED_or_UNAVAILABLE: Preserve scope and evidence; report the exact non-success state with no partial effects and no implied fallback.
      MISMATCHED_VERSION_OR_FINGERPRINT: Stop reuse, retain the exact references, and inspect/revalidate the same candidate; do not substitute another version.
