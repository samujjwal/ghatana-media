productId: media
screenId: media.view.job-status
status: proposal; baseline-view-contract-authored; action-state-channel-bindings-and-owner-review-pending
channel: media.channel.web
actors:
- media.creator
- media.editor
- media.operator
intentRef: media.intent.resolve-job
purpose: view-one-existing-job-status-and-choose-a-safe-next-action
contextGoalNowNext:
  context: Stable job identity, exact source version when applicable, current authority, attempt state, and observed
    finality.
  goal: Reattach to existing long-running work and understand its current evidence.
  now: Show the job and source identities separately, preserve attempt state and finality, and expose only measured
    progress.
  next: Continue observing, request cancellation, or check the same job outcome when it is unknown.
anatomy:
- job-identity
- source-version-when-applicable
- job-state
- attempt-state-when-authorized
- measured-progress-when-reported
- finality
- safe-next-action
states:
- queued
- running
- cancellation-pending
- completed
- partially-succeeded
- failed
- retry-pending
- outcome-unknown
- reconciling
- cancelled
actions:
- media.action.view-job-status
- media.action.request-cancellation
- media.action.check-job-outcome
- media.action.retry-job
observation:
  detaching: stop-watching-only-changes-the-current-view; it-does-not-cancel-or-delete-the-job
  reattachment: use-the-same-stable-job-identity-and-read-current-owner-evidence
  progress: omit-when-not-measured; never-infer-progress-from-elapsed-time-or-state
  cancellation: report-a-request-as-pending-until-owner-confirmation-or-a-racing-result
  uncertainOutcome: view-status-or-check-the-existing-job-outcome; do-not-blindly-resubmit
  retry: offer only when the prior attempt is classified as retryable and current authority, policy, and budget checks pass; outcome-unknown must be checked before retry; this local fixture slice does not execute retry
responsive: identity-state-and-finality-precede-secondary-details; actions-wrap-without-horizontal-overflow
accessibility: announce-state-change-once; label-cancellation-pending; stop-watching-is-distinct-from-cancellation
copyRefs:
- media.copy.job.running
- media.copy.job.unknown
- media.copy.job.cancellation-pending
- media.copy.job.observation-stopped
fixtureRefs:
- media.scenario.job-running
- media.scenario.job-outcome-unknown
- media.scenario.job-retry-eligible
- media.scenario.job-retry-ineligible
componentRefs:
- media.component.job-status-card
- media.component.activity-recovery-feed
actionBindingState: bound-to-existing-PDP-3-actions
actionIntents:
- view status for one exact job
- request cancellation for the existing job when current authority allows
- check the outcome of the same job when finality is unknown
- retry the same logical job after a classified retryable attempt and current policy checks
