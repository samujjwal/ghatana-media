entry:
  - Host supplies authenticated tenant and principal context; never infer them
    from the job ID or request body.
  - The selected job identity is exact and tenant-scoped; a missing or foreign
    job is not global absence.
  - Read dimensions only from the typed
    `media.operation.job-status.read-dimensions.v1` contract with the exact
    expected read authority and read version; stale, foreign, malformed, or
    incomplete observations remain UNKNOWN.
  - Stage, quality-subject-version, and destination dimensions are selected
    explicitly by exact IDs; each selector list may be empty (meaning no rows
    were requested), and the view never expands to all stages, quality subjects,
    or destinations by default.
  - Show overall job, attempt/lease, cancellation, remote-outcome certainty,
    quality, and delivery as separate dimensions; no scalar status or receipt
    implies another dimension.
exit:
  - A dimension may be displayed as observed only when its exact typed source
    mapping and current read tuple validate; unmapped runtime spellings remain
    UNKNOWN.
  - Cancellation request is not cancellation finality, retry acceptance is not
    processing completion, and a completed job requires registered outputs under
    the exact result contract.
  - Preserve the exact job and prior-attempt identity across refresh, denial,
    interruption, and unknown outcomes; do not enable retry on unknown finality.
