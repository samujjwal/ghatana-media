exit:
  - "media.action.request-transcription:
    stable-submission-receipt-and-logical-job-identity-only;
    no-job-state-or-recognition-finality.
    show-classified-state-and-safe-next-action;
    never-submit-duplicate-on-unknown"
  - "media.action.view-job-status: read-only.
    keep-last-known-state-labelled-stale"
  - "media.action.request-cancellation:
    pending-until-authoritative-stop-or-racing-result-is-recorded.
    keep-job-visible-as-running-or-unknown"
  - "media.action.check-job-outcome:
    remains-unknown-until-evidence-classifies-outcome.
    preserve-unknown-state-and-disable-resubmission"
