intentRef: media.intent.understand
purpose: review recognized text against the exact source and inspect language, timing, and uncertainty
contextGoalNowNext:
  context: Exact canonical transcript version and linked source version, with only supplied observations and explicit availability. Selected playback time, requested language intent or job provenance are optional separately sourced UI context, never guaranteed query output.
  goal: Decide whether the transcript is sufficiently aligned and understandable for caption correction.
  now: Show available supplied text and observations, timing disposition, uncertainty and missing evidence; never synthesize omitted language, confidence, segments or source-clock metadata.
  next: Preserve exact version and unverified evidence while considering a separately authorized correction; read access alone grants no write authority or qualified caption-parent eligibility.
