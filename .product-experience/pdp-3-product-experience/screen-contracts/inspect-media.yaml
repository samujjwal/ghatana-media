    id=media.action.inspect-artifact/actionDefinitionSemantics/typedDefinition;
    runtime NOT_ADMITTED."
  - "media.action.attach-source-asset:
    create-a-versioned-project-reference-to-the-immutable-artifact-without-copy\
    ing-or-changing-source-bytes;
    finality=confirmed-only-after-the-new-project-revision-records-the-artifact\
    -reference; recovery=keep-both-artifact-and-project-versions-unchanged;
    reconcile-an-unknown-project-update-against-the-same-request-identity.
    Source:
