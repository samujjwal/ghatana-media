      - media.artifact.inspect
    requirementRefs:
      - MEDIA-REQ-CAP-ARTIFACT
    referenceBindingStatus: EXACT_ACTION_REGISTRY_TYPED_DEFINITION;
      PROPOSAL_AND_REVIEW_STATUS_PRESERVED
    operationRef: media.operation-slice.inspect-artifact-version
    effectRef: .product-experience/pdp-3-product-experience/action-registry.yaml#actions/@id=media.action.inspect-source/actionDefinitionSemantics/typedDefinition
    consequence: read-source-metadata-for-one-exact-artifact-version
    status: pending-owner-binding
    bindingStatus: source-definition-exact; screen-admission-pending; runtime-NOT_ADMITTED
    operationRefs:
      - media.operation-slice.inspect-artifact-version
    finality: read-only
    reversibilityDisposition: REVERSIBLE
    confirmationDisposition: NOT_REQUIRED
    guardRefs:
      - exact-artifact-and-immutable-version-identity
      - current-read-authority
    failureRecovery: explain-unavailable-metadata-without-rejecting-the-source-implicitly
    actorRefs:
      - media.creator
      - media.editor
    runtimeAdmission: NOT_ADMITTED
  - actionId: media.action.attach-source-asset
    capabilityRefs:
      - media.project.source-asset.attach
    requirementRefs:
      - MEDIA-REQ-CAP-PROJECT
    referenceBindingStatus: EXACT_ACTION_REGISTRY_TYPED_DEFINITION;
      PROPOSAL_AND_REVIEW_STATUS_PRESERVED
    operationRef: media.operation-slice.attach-source-asset
    effectRef: .product-experience/pdp-3-product-experience/action-registry.yaml#actions/@id=media.action.attach-source-asset/actionDefinitionSemantics/typedDefinition
    consequence: create-a-versioned-project-reference-to-the-immutable-artifact-without-copying-or-changing-source-bytes
    status: pending-owner-binding
    bindingStatus: source-definition-exact; screen-admission-pending; runtime-NOT_ADMITTED
    operationRefs:
      - media.operation-slice.attach-source-asset
    finality: confirmed-only-after-the-new-project-revision-records-the-artifact-reference
    reversibilityDisposition: NOT_REVERSIBLE
    confirmationDisposition: REQUIRED
    guardRefs:
      - artifact-version-is-AVAILABLE
      - exact-project-revision
      - current-project-write-authority
      - current-artifact-read-authority
    failureRecovery: keep-both-artifact-and-project-versions-unchanged;
      reconcile-an-unknown-project-update-against-the-same-request-identity
    actorRefs:
      - media.creator
      - media.editor
    runtimeAdmission: NOT_ADMITTED
