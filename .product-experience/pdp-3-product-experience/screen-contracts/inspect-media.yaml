    retention authority, or permission to process or deliver. Source:
    .product-experience/pdp-1-domain-data/operations.yaml#ownerDefinedOperationContracts/records/@id=media.operation-slice.inspect-artifact-version/resultSchema/semantics;
    runtime NOT_ADMITTED."
