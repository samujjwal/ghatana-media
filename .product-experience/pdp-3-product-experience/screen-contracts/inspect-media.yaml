entry:
  - "Before media.action.inspect-artifact, require exact guards
    [exact-artifact-or-upload-identity, current-read-authority]; absent, stale,
    or unknown evidence leaves the action unavailable. Source:
    .product-experience/pdp-3-product-experience/action-registry.yaml#actions/@\
    id=media.action.inspect-artifact/actionDefinitionSemantics/typedDefinition;
    runtime NOT_ADMITTED."
  - "Before media.action.attach-source-asset, require exact guards
    [artifact-version-is-AVAILABLE, exact-project-revision,
    current-project-write-authority, current-artifact-read-authority]; absent,
    stale, or unknown evidence leaves the action unavailable. Source:
    .product-experience/pdp-3-product-experience/action-registry.yaml#actions/@\
    id=media.action.attach-source-asset/actionDefinitionSemantics/typedDefiniti\
    on; runtime NOT_ADMITTED."
  - "Before media.action.inspect-source, require exact artifact and immutable
    artifact-version identity plus current read authority. Do not substitute a
    latest-version alias. Source:
    .product-experience/pdp-3-product-experience/action-registry.yaml#actions/@\
    id=media.action.inspect-source/actionDefinitionSemantics/typedDefinition;
    runtime NOT_ADMITTED."
exit:
  - "media.action.inspect-artifact:
    read-the-exact-artifact-version-integrity-metadata-and-separately-governed-\
    policy-dispositions; finality=read-only;
    inspection-does-not-promote-quarantine-or-attach-to-a-project;
    recovery=keep-the-identity-visible-only-as-permitted-and-distinguish-unavai\
    lable-metadata-from-a-negative-result. Source:
