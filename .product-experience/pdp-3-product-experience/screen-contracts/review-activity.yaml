contextGoalNowNext:
  context: Current authorized workspace and the jobs visible under its read authority.
  goal: Identify which recorded job needs status review, an outcome check, or a
    later follow-up.
  now: Group the available job summaries by recorded state and keep job identity,
    finality, and safe next action visible.
  next: Open one exact job; check only that same job when its recorded outcome is
    unknown.
