        evidenceOperationRefs:
          - media.operation-slice.list-projects
          - media.operation-slice.inspect-project
        evidencePredicate: A state label is shown only from the exact returned project row or exact inspected project
          snapshot; the view does not infer archive or restore.
        evidenceScopeRefs:
          - media.domain.project
      - sourceStateRef: media-project-version/COMMITTED
        canonicalStateRef: media-project-version/COMMITTED
        canonicalSourceRef: .product-experience/pdp-1-domain-data/states.yaml#stateMachines/@machineId=media-project-version/stateDefinitions/@id=COMMITTED
        bindingKind: EXACT_EXISTING_STATE_IDENTITY
        meaning: "`create-confirmed` is grounded only by the atomic durable create receipt that names the project and
          immutable initial revision; a list row alone may show that observed project/revision state but is
          not the create receipt."
        evidenceOperationRefs:
          - media.operation-slice.create-project
          - media.operation-slice.list-projects
          - media.operation-slice.inspect-project
        evidencePredicate: Show create confirmation only when the same create request returns its authoritative commit
          receipt with projectId and revisionId; for later list/inspect observations require exact projectId,
          headRevisionId, projectState, and observedAt.
        evidenceScopeRefs:
          - media.domain.project
          - media.domain.project-revision
    stateLabelDispositions:
      - label: loading
        kind: QUERY_PENDING_PRESENTATION
        evidenceOperationRefs:
          - media.operation-slice.list-projects
        meaning: The scoped list query is pending; no project existence or lifecycle state is asserted.
      - label: projects-available
        kind: QUERY_RESULT_OBSERVATION
        evidenceOperationRefs:
          - media.operation-slice.list-projects
        meaning: At least one authorized project row was returned for this selected workspace at the response
          observedAt; this is not a complete cross-workspace inventory.
      - label: no-matching-projects
        kind: QUERY_RESULT_OBSERVATION
        evidenceOperationRefs:
          - media.operation-slice.list-projects
        meaning: The current authorized query page contains no matching project; this does not establish global
          absence or absence outside the selected workspace/query scope.
      - label: workspace-empty
        kind: QUERY_RESULT_OBSERVATION
        evidenceOperationRefs:
          - media.operation-slice.list-projects
        meaning: No project row was visible in the authorized selected-workspace query at observedAt; this is not a
          claim about workspace membership or global project absence.
      - label: stale-results
        kind: STALE_QUERY_PRESENTATION
        evidenceOperationRefs:
          - media.operation-slice.list-projects
        meaning: The displayed page is retained as stale presentation data and must not be treated as a current
          authorization or project-state observation.
      - label: create-pending
        kind: COMMAND_PENDING_PRESENTATION
        evidenceOperationRefs:
          - media.operation-slice.create-project
        meaning: A create request has been submitted or is being observed; no project or initial revision exists for
          UI purposes until the exact durable receipt is available.
      - label: create-confirmed
        kind: COMMAND_RECEIPT_OBSERVATION
        evidenceOperationRefs:
          - media.operation-slice.create-project
        meaning: The same request returned an authoritative atomic commit receipt with the exact projectId and initial
          revisionId; transport acknowledgement alone is insufficient.
      - label: create-outcome-unknown
        kind: UNKNOWN_COMMAND_OUTCOME
        evidenceOperationRefs:
          - media.operation-slice.create-project
          - media.operation-slice.inspect-project
        meaning: No authoritative create receipt is available after possible dispatch; preserve the same requestId and
          reconcile before any resubmission, and do not assert project creation or absence.
      - label: access-denied
        kind: SCOPED_AUTHORITY_DENIAL
        evidenceOperationRefs:
          - media.operation-slice.list-projects
          - media.operation-slice.create-project
          - media.operation-slice.inspect-project
        meaning: A typed denial applies to the exact attempted selected-workspace operation; it does not prove no
          project exists or deny access to other scopes.
      - label: offline
        kind: LOCAL_CONNECTIVITY_PRESENTATION
        evidenceOperationRefs: []
        meaning: The client cannot currently observe the service; no command acceptance, rejection, or domain state is
          inferred.
    stateTransitions: NO_TRANSITION_AUTHORIZED_BY_VIEW; transitions require the exact action/operation and P1
