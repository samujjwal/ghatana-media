        canonicalSourceRef: .product-experience/pdp-1-domain-data/states.yaml#stateMachines/@machineId=media-project/stateDefinitions/@id=ACTIVE
        bindingKind: EXACT_EXISTING_STATE_IDENTITY
        meaning: "The `list-projects` query may report `projectState: ACTIVE` for a project row at its explicit
          `observedAt`; this is scoped to that authorized tenant, principal, and selected workspace."
        evidenceOperationRefs:
          - media.operation-slice.list-projects
          - media.operation-slice.inspect-project
        evidencePredicate: A state label is shown only from the exact returned project row or exact inspected project
          snapshot; empty or unavailable results do not establish a different project state.
        evidenceScopeRefs:
          - media.domain.project
      - sourceStateRef: media-project/ARCHIVED
        canonicalStateRef: media-project/ARCHIVED
        canonicalSourceRef: .product-experience/pdp-1-domain-data/states.yaml#stateMachines/@machineId=media-project/stateDefinitions/@id=ARCHIVED
        bindingKind: EXACT_EXISTING_STATE_IDENTITY
        meaning: "The `list-projects` query may report `projectState: ARCHIVED` for a project row at its explicit
