stateBindingRules:
  - A display state is an observation and cannot itself authorize a state transition.
  - Every direct state binding resolves to one exact PDP-1 state identity.
  - Rights and consent remain separate dimensions even when one UI label presents both.
  - Unmapped UI state labels are explicitly local presentation states, not silently promoted to canonical
    state.
  - A blank state projection is recorded as such and is not proof that an interaction or domain lifecycle is
    complete.
