schemaVersion: media.navigation-contracts.v1
productId: media
status: selected-lane-first-use-and-upload-proposals; P0-010-and-P1-006-pending
intentRef: media.intent.understand
additionalJourneyFlows:
  - journeyRef: J-02
    intentRef: media.intent.understand
    entryPoints:
      - from: media.view.browse-media
        label: Import an admitted source
        next: media.view.import-media
      - from: media.view.import-media
        label: Inspect an asynchronous verification job when an owner job identity is returned
        next: media.view.job-status
      - from: media.view.import-media
        label: Inspect the exact available or quarantined artifact version
        next: media.view.inspect-media
      - from: media.view.browse-media
        label: Inspect one authorized artifact version
        next: media.view.inspect-media
    rules:
      - Keep upload identity, selected project target, acknowledged transfer state, and source identity through navigation.
      - An unknown upload result returns to inspection of the same upload identity; it never enables duplicate transfer.
      - Enter the job view only with an owner-issued stable job identity; an upload identity alone is not a job.
      - Integrity, format, rights, retention, and project-attachment dispositions remain separately visible.
  - journeyRef: J-01
    intentRef: media.intent.restore-project
    entryPoints:
      - from: media.view.authenticate-and-select-context
        handoffRef: media.handoff.identity
        next: media.view.resume-work
      - from: media.view.resume-work
        label: Find or create a project
        next: media.view.find-projects
      - from: media.view.find-projects
        label: Create or open an authorized project
        next: media.view.work-in-project
      - from: media.view.work-in-project
        label: Choose a Media outcome
        next: media.view.create-media
    rules:
      - Preserve the requested destination and non-sensitive intent draft across the identity handoff.
      - Do not show protected project data before the current workspace decision is confirmed.
      - An uncertain project-create result returns to the same request for reconciliation; it does not enable blind duplicate creation.
  - journeyRef: J-20
    intentRef: media.intent.resolve-job
    entryPoints:
      - from: media.view.monitor-transcription
        label: Inspect the existing transcription job
        next: media.view.job-status
      - from: media.view.job-status
        label: Stop watching and return to transcript work
        next: media.view.monitor-transcription
    rules:
      - Preserve the same job identity when leaving and re-entering the status view.
      - Stop watching is view navigation only; it does not cancel work or change job state.
      - Keep cancellation pending until owner evidence confirms a stop or a racing result.
      - For unknown outcomes, check the existing job before any new submission.
entryPoints:
  - from: media.view.select-source
    label: Choose a recording to understand
    next: media.view.monitor-transcription
  - from: media.view.monitor-transcription
    label: Review transcript
    next: media.view.review-transcript
  - from: media.view.review-transcript
    label: Correct captions
    next: media.view.correct-captions
  - from: media.view.correct-captions
    label: Compare versions
    next: media.view.compare-caption-versions
rules:
  - Preserve project, exact source version, selected language intent, source time, job identity, and draft edits across navigation.
  - Keep recovery available from every job state; never route OUTCOME_UNKNOWN to a new submission.
  - Back navigation returns to the prior view and position without committing a draft or changing source media.
informationArchitecture:
  normativeRuleRecords:
    - id: media.navigation.default-global-and-utility-placement.v1
      authority: user-delegated-Media-experience-semantic-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
      scope: default-product-navigation-placement
      primaryNavigation:
        - media.navigation.destination.home
        - media.navigation.destination.projects
        - media.navigation.destination.assets
        - media.navigation.destination.activity
      utilityNavigation:
        - media.navigation.utility.settings
        - media.navigation.utility.account
        - media.navigation.utility.help
      rule: The default global primary navigation provides Home, Projects, Assets, and Activity as stable product destinations. Settings, Account, and Help are utility destinations, not project-work destinations. Responsive presentation may change arrangement but must preserve the destination identities and distinguish utility from work navigation.
      guardrails:
        - Navigation destinations do not imply access to protected project or asset records; each destination loads only after its own current authorization check.
        - Provider, model, codec, and runtime catalogs are not global navigation destinations in the ordinary product path.
        - Navigation changes route and view context only; it does not submit, cancel, retry, publish, or mutate a Media operation.
        - Host-provided identity and workspace selection remain separate from navigation and are not inferred from the chosen destination.
      guardrailIds:
        - media.navigation.guard.authorization-before-protected-load
        - media.navigation.guard.no-provider-global-destination
        - media.navigation.guard.navigation-does-not-dispatch
        - media.navigation.guard.identity-and-workspace-are-separate
      sourceRefs:
        - .product-experience/pdp-3-product-experience/navigation-contracts.yaml#entryPoints
        - .product-experience/pdp-3-product-experience/navigation-contracts.yaml#rules
        - .product-experience/pdp-0-product-truth/domain-model.yaml#productBoundary
      negativeCases:
        - Do not place provider or model selection in the default primary navigation.
        - Do not classify Settings, Account, or Help as project-work destinations.
        - Do not reveal projects or assets from navigation presence or route selection alone.
        - Do not treat navigation as authorization or as an operation dispatch.
      status: MEDIA_OWNER_DEFINITION_ONLY; independent-PDP3-review-open; runtime-NOT_ADMITTED
  ordinaryPathProviderSelection:
    id: media.navigation.ordinary-path-provider-boundary.v1
    authority: user-delegated-Media-experience-semantic-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
    rule: Ordinary product navigation starts from the user's intended media outcome and eligible Media operations or recipes; it does not expose a technical vendor, model, or provider catalog as the default task path.
    disclosure: Technical execution details may appear only when needed to explain an exact selected profile, data location, cost, or limitation; displaying those details does not authorize a provider or execution.
    sourceRefs:
      - .product-experience/pdp-0-product-truth/glossary.yaml#terms/@id=media.term.intent
      - .product-experience/pdp-0-product-truth/glossary.yaml#terms/@id=media.term.recipe
      - .product-experience/pdp-0-product-truth/reuse-decisions.yaml#mediaArchitectureRules.externalStackSelectionRule
    nonClaims:
      - no provider or model is selected, qualified, or admitted by this navigation rule
      - no runtime view has been verified by this definition
    status: MEDIA_OWNER_DEFINITION_ONLY; independent-PDP3-review-open; runtime-NOT_ADMITTED
