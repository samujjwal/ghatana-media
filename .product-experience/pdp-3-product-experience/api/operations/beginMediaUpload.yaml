  runtimeAdmission: NOT_ADMITTED
contractStatus: bounded-interface-definition; implementation-and-independent-qualification-open
nonClaims:
- production-host-or-identity-qualification
- artifact-availability-or-verification
- automatic-replay-or-durability-beyond-qualified-runtime-evidence
