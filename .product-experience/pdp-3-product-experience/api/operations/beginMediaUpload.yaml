schemaVersion: media.protocol-operation-contract.v1
operationId: media.http.beginMediaUpload
protocolIdentity:
  protocol: HTTP
  method: POST
  path: /api/v1/artifacts/uploads
  operationId: beginMediaUpload
sourceContract: contracts/openapi/media.yaml
sourceContractDisposition: implementation-or-projection-observation; not-declared-canonical-wire-authority
routeManifestObservation:
  source: config/route-manifest.json
  routeId: POST /api/v1/artifacts/uploads
  identityMatch: exact-method-path-operationId
parameters:
  refs:
  - '#/components/parameters/TenantHeader'
  - '#/components/parameters/PrincipalHeader'
  - '#/components/parameters/IdempotencyKeyHeader'
request:
  schemaRefs:
  - mediaType: application/json
    ref: '#/components/schemas/UploadRequest'
response:
  responseRefsByStatus:
    '400': '#/components/responses/Error'
    '403': '#/components/responses/Error'
  schemaRefsByStatus:
    '201':
    - '#/components/schemas/UploadSession'
    '400':
    - '#/components/schemas/ErrorEnvelope'
    '403':
    - '#/components/schemas/ErrorEnvelope'
pdp1SemanticBinding:
  logicalOperationRef: media.operation-slice.begin-upload
  bindingStatus: bounded-PDP1-definition-crosswalk-under-PXD-051; HTTP-source-shape-observed; runtime-admission-NOT_ADMITTED
  semanticAuthority: exact PDP-1 operation-slice; no route-name-only equivalence
  ownerDecisionRef: .product-experience/decision-log.md#PXD-051
  ownerReview: independent-phase-review-open
interfaceDefinition:
  actionRef: media.action.begin-artifact-upload
  actorAndAuthority: authenticated-OPERATOR-required; tenant-and-principal-must-come-from-trusted-host-context; body-and-headers-do-not-authenticate
  requestIdentity: Idempotency-Key-scoped-by-tenantId-and-principalId; bound-to-canonical-full-upload-request; changed-payload-under-key-is-400-without-mutation
  requestBodyFields: [tenantId, principalId, fileName, contentType, expectedSizeBytes, expectedSha256, classification, retention, metadata]
  result: HTTP-201-UploadSession-receipt; OPEN-session-and-product-RECEIVING-only; does-not-create-available-artifact
