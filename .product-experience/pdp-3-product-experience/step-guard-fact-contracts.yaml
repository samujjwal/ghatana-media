predicateDefinitions:
  - id: media.pdp3.guard-predicate.resolve-the-current-workspace-and-exact-target-before-access-or-change.v1
    guardRef: resolve-the-current-workspace-and-exact-target-before-access-or-change
    predicateKind: EXACT_SCOPED_TARGET
    requiredObservationProperties:
      - resolution
      - tenantScopeRef
      - principalRef
      - workspaceRef
      - targetRefs
      - objectVersionRefs
    truthDerivation:
      trueWhen: resolve only the host-authorized tenant/principal/workspace and exact
        requested target/version tuple
      falseWhen: a current same-scope query explicitly reports that exact target absent
      unknownWhen: missing, stale, malformed, mismatched, unsupported or
        non-authoritative fact
    sourceActionDefinitionRef: .product-experience/pdp-3-product-experience/action-registry.yaml#actions/@id=media.action.submit-validated-request
    sourceOperationContractRefs:
      - .product-experience/pdp-1-domain-data/operations.yaml#ownerDefinedOperationContracts/records/@id=media.operation.action.submit-validated-request
    sourceGuardRef: .product-experience/pdp-3-product-experience/action-registry.yaml#actions/@id=media.action.submit-validated-request/actionDefinitionSemantics/typedDefinition/applicabilityGuards
    runtimeAdmission: NOT_ADMITTED
    acceptanceEffect: none
    factSchema:
      type: object
      properties:
        resolution:
          type: string
          enum:
            - EXACT_TARGET_RESOLVED
            - EXACT_TARGET_ABSENT
        tenantScopeRef:
          type: string
        principalRef:
          type: string
        workspaceRef:
          type: string
        targetRefs:
          type: array
          items:
            type: string
