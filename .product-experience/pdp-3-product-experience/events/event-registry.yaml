populations:
  runtimeLifecyclePublisherTypes:
    count: 9
    sourceInventory: .product-experience/pdp-1-domain-data/events.yaml#/observedEnvelope/lifecyclePublisherInventory
    classification: observed server-side publisher implementation types; not an accepted canonical taxonomy
    observedTypes:
