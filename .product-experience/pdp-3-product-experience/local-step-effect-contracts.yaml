    inputContract:
      requiredKeys:
        - sessionRef
        - actorRef
        - tenantId
        - workspaceRef
        - projectRef
        - expectedDraftRevision
        - actionRef
        - draftSlotRef
        - mutationId
        - mutation
      mutationId: unique request identity within one local editor session; never an idempotency key for server work
      mutation:
        requiredKeys:
          - kind
          - value
        kind: PATCH_LOCAL_DRAFT_SLOT
        valueSchemaRefs:
