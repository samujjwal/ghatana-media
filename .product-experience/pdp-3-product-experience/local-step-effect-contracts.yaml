$id: media.local-step-effect-contracts.v1
$defs:
  SceneEntityDraftValue:
    type: object
    additionalProperties: false
    properties:
      sceneRef:
        type: string
        minLength: 1
        pattern: \S
      entityRef:
        $ref: media.component-value-types.v1#/$defs/OpaqueSceneEntityRef
      entityKind:
        type: string
        enum:
          - geometry
          - camera
          - light
          - character
          - material-binding
          - model-binding
      sourceVersionRef:
        anyOf:
          - $ref: media.component-value-types.v1#/$defs/ExactArtifactVersionRef
          - type: "null"
      materialRef:
        anyOf:
          - $ref: media.component-value-types.v1#/$defs/VersionedMaterialRef
          - type: "null"
      modelRef:
        anyOf:
          - $ref: media.component-value-types.v1#/$defs/ExactModelVersionRef
          - type: "null"
    required:
      - sceneRef
      - entityRef
      - entityKind
      - sourceVersionRef
      - materialRef
      - modelRef
    allOf:
      - if:
          properties:
            entityKind:
              const: material-binding
          required:
            - entityKind
        then:
          properties:
            materialRef:
              type: string
              minLength: 1
      - if:
          properties:
            entityKind:
              const: model-binding
          required:
            - entityKind
        then:
          properties:
            modelRef:
              type: object
  AdjustmentDraftValue:
    type: object
    additionalProperties: false
    properties:
      parameterRef:
        type: string
        minLength: 1
        pattern: \S
      targetVersionRef:
        $ref: media.component-value-types.v1#/$defs/ExactArtifactVersionRef
      value:
        type:
          - number
          - string
          - boolean
      unitRef:
        type: string
        minLength: 1
        pattern: \S
      boundsRef:
        type: string
        minLength: 1
        pattern: \S
      validationDisposition:
        type: string
        enum:
          - valid
          - needs-review
          - unknown
    required:
      - parameterRef
      - targetVersionRef
      - value
      - unitRef
      - boundsRef
      - validationDisposition
