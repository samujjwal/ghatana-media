      - action-and-slot-match-this-exact-source-step
      - patch-is-well-formed-for-the-declared-local-slot
    effect:
      scope: current local editor-session draft only
      mutation: replace only the declared local draft slot value
      revision: advance local draft revision exactly once under expectedDraftRevision compare-and-set
      committedMediaObjects: unchanged
      remoteDispatch: none
    finality: LOCAL_DRAFT_REVISION_ONLY; no project revision, artifact version, job, remote effect, or committed result is
      established
    reversibility: local session history may restore prior local revision; this does not reverse any remote or committed effect
    failureRecovery: on denial preserve current local revision; on stale or unknown session/read evidence hold without
      applying or replaying; refresh the same session/catalog and require a new explicit user action if the revision
      changed
    runtimeAdmission: NOT_ADMITTED
    localObjectRef: media.local-object.editor-session-draft
    localStateRef: media.local-state.editor-session-draft-revision
    localRevisionRule:
      identityRef: media.local-state.editor-session-draft-revision
      source: HOST_EDITOR_SESSION_CONTEXT
      precondition: request expectedDraftRevision exactly equals the trusted current session draftRevision
      eligibleEffect: advance the same local draft revision exactly once
      canonicalMediaRevision: false
    localAuthorityDisposition: HOST_SESSION_ACTOR_MATCH_ONLY; NOT_CANONICAL_DOMAIN_AUTHORITY
    canonicalIdentityDisposition: NO_PDP1_CANONICAL_PRODUCT_OBJECT_OR_TRANSITION
