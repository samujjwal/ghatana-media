statusVocabulary:
  observed-source-surface: A contract, client package, or archived implementation exists in the inspected source tree.
  proposed-not-admitted: Master plan proposes the channel/form factor; Phase 0 has not admitted it.
  compatibility-preservation-required: Existing identity/call surface must remain compatible during migration, without a new runtime-support claim.
  not-evaluated: No current build/deployment/license/qualification/runtime evidence is asserted here.
  accepted: Requires named owner review and admitted evidence; no channel/device/locale below currently has this status.

sourceEvidence:
  repository: samujjwal/ghatana
  revision: 245e966591913bc73f59fad9bf43651673b0280e
  observations:
    - path: services/media/contracts/openapi/media.yaml
      fact: An OpenAPI Media contract is present in the inventoried source.
      doesNotProve: A deployed or currently available HTTP API.
    - path: services/media/modules/speech/stt-service/src/main/proto/stt_service.proto
      fact: An STT gRPC contract is present in the inventoried source.
      doesNotProve: A deployed or qualified gRPC service.
    - path: services/media/modules/speech/tts-service/src/main/proto/tts_service.proto
      fact: A TTS gRPC contract is present in the inventoried source.
      doesNotProve: Voice/language or runtime availability.
    - path: services/media/libs/audio-video-client/package.json
      fact: A TypeScript client package source is present.
      doesNotProve: Published package availability or consumer parity.
    - path: archive/media-desktop-apps/desktop/README.md
      fact: Legacy desktop application material is retained in an archive.
      doesNotProve: An active or supported desktop application.
  currentBoundary: >-
    The archived desktop application and product-specific legacy experience are
    preservation material only unless separately qualified and admitted.

channels:
  - id: media.channel.web
    name: Web application
    definitionState: proposed
    implementationState: no-admitted-active-web-product-established-by-migration-inventory
    qualificationState: NOT_EVALUATED
    licenseAdmissionState: NOT_EVALUATED
    runtimeAvailability: UNKNOWN
    phase0Admission: pending
    evidence: Master-plan proposed view routes in section 20.2; active supported Web deployment is not evidenced by this artifact.
    intendedRole: Primary interactive product surface if selected and admitted.
    viewReferences: [M-HOME, M-PROJECTS, M-PROJECT, M-ASSETS, M-ASSET, M-UPLOAD, M-CREATE, M-PLAN, M-STORYBOARD, M-IMAGE, M-VIDEO, M-AUDIO, M-SPEECH, M-VOICE, M-CAPTIONS, M-DUB, M-ENHANCE, M-COMPARE, M-EDIT, M-MASK, M-ANIMATION, M-SCENE, M-SIMULATION, M-COMPOSER, M-COLOR, M-QUALITY, M-RENDER, M-ACTIVITY, M-JOB, M-OUTPUTS, M-OUTPUT, M-DELIVERY, M-REVIEW, M-RIGHTS, M-PROVENANCE, M-PROFILES, M-PROVIDERS, M-OPERATIONS, M-SETTINGS, M-AUTH, M-HELP]
    supportRule: Design for responsive, semantic, keyboard-operable processes; availability for any deployment/browser remains unverified.

  - id: media.channel.api
    name: Protocol-neutral API
    definitionState: proposed
    implementationState: no-admitted-protocol-neutral-API-surface-established
    qualificationState: NOT_EVALUATED
    licenseAdmissionState: NOT_EVALUATED
    runtimeAvailability: UNKNOWN
    phase0Admission: pending
    intendedRole: Logical API semantics shared by admitted concrete transports; this identity does not imply HTTP or gRPC availability for any operation.
    concreteTransportReferences: [media.channel.http-api, media.channel.grpc-api]
    supportRule: Resolve per-operation transport bindings and contracts before claiming endpoint support; protocol-neutral API references do not widen HTTP or gRPC admission.

  - id: media.channel.embedded
    name: Embedded Media experience
    definitionState: proposed
    implementationState: no-admitted-embedded-Media-surface-established
    qualificationState: NOT_EVALUATED
    licenseAdmissionState: NOT_EVALUATED
    runtimeAvailability: UNKNOWN
    phase0Admission: pending
    intendedRole: Media experience or capability presented inside an explicitly admitted host product context while Media retains its domain and state authority.
    supportRule: Host context, identity, rights, navigation, and handoff contracts are required; this channel is distinct from product-to-product API integration and does not imply an embedded runtime exists.

  - id: media.channel.http-api
    name: HTTP/OpenAPI
    definitionState: proposed
    implementationState: observed-source-contract
    qualificationState: NOT_EVALUATED
    licenseAdmissionState: NOT_EVALUATED
    runtimeAvailability: UNKNOWN
    phase0Admission: pending
    compatibilityStatus: compatibility-preservation-required
    evidence: services/media/contracts/openapi/media.yaml
    intendedRole: Public machine/product integration and supported read/write operations as admitted per operation.
    supportRule: Routes, operations, authentication, finality, idempotency, and availability require owner-reviewed public bindings; the OpenAPI file alone does not establish them.

  - id: media.channel.grpc-api
    name: gRPC service contracts
    definitionState: proposed
    implementationState: observed-source-contract
    qualificationState: NOT_EVALUATED
    licenseAdmissionState: NOT_EVALUATED
    runtimeAvailability: UNKNOWN
    phase0Admission: pending
    compatibilityStatus: compatibility-preservation-required
    evidence:
      - services/media/modules/speech/stt-service/src/main/proto/stt_service.proto
      - services/media/modules/speech/tts-service/src/main/proto/tts_service.proto
      - services/media/modules/vision/vision-service/src/main/proto/vision_service.proto
      - services/media/modules/intelligence/multimodal-service/src/main/proto/multimodal_service.proto
    supportRule: Each service and operation requires its own provider, auth, cancellation, finality, and runtime disposition.

  - id: media.channel.sdk
    name: Client libraries
    definitionState: proposed
    implementationState: observed-source-packages
    qualificationState: NOT_EVALUATED
    licenseAdmissionState: NOT_EVALUATED
    runtimeAvailability: UNKNOWN
    phase0Admission: pending
    compatibilityStatus: compatibility-preservation-required
    evidence:
      - services/media/libs/audio-video-client/package.json
      - services/media/libs/audio-video-types/package.json
      - services/media/libs/audio-video-ui/package.json
    supportRule: Source package presence is not publication or consumer-compatibility proof; publishable exports and supported client environments remain to be verified.

  - id: media.channel.cli
    name: Command-line batch interface
    definitionState: proposed
    implementationState: no-user-facing-Media-CLI-admission-established
    qualificationState: NOT_EVALUATED
    licenseAdmissionState: NOT_EVALUATED
    runtimeAvailability: UNKNOWN
    phase0Admission: pending
    evidence: Master-plan sections 17 and 20 propose safe bounded batch rendering through CLI; exact commands and installed behavior remain to be authored.
    intendedRole: Deterministic non-interactive plan/submit/watch/reconcile over the same Media semantic state/actions as Web and API.
    supportRule: Consequential operations require explicit authority; scripts/build entrypoints are not treated as a product CLI.

  - id: media.channel.product-integration
    name: Product-to-product integration
    definitionState: proposed
    implementationState: mixed-observed-references-and-proposed-edges
    qualificationState: NOT_EVALUATED
    licenseAdmissionState: NOT_EVALUATED
