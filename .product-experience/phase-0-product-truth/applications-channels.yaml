    supportRule: Archive retention preserves source history only; do not list as a supported current product channel.

capabilityChannelAliases:
  status: proposed-vocabulary-normalization; does-not-establish-per-operation-support
  mapping:
    web: media.channel.web
    cli: media.channel.cli
    api: media.channel.api
    embedded: media.channel.embedded
    http-api: media.channel.http-api
    grpc-api: media.channel.grpc-api
    sdk: media.channel.sdk
    product-integration: media.channel.product-integration
  rules:
    - Capability supportedChannels entries are proposal-time vocabulary and normalize only through this map.
    - The api alias is protocol-neutral; it never implies simultaneous HTTP/OpenAPI and gRPC support.
    - The embedded alias means a host-context Media experience; it is not a synonym for product-integration.
    - Channel identity, implementation, qualification, license admission, runtime availability, and owner acceptance remain separate.

channelInvariants:
  - Web, CLI, API, SDK, and product integrations project the same versioned product semantics, authorization, finality, and recovery rules.
  - A view detaching from a long-running request does not mean cancellation; cancellation must use the operation contract and report its certainty.
  - No channel silently weakens privacy, rights, fidelity, cost bounds, or publication review.
  - Unsupported channel/operation combinations remain visible as unsupported or not evaluated; never convert UNKNOWN to AVAILABLE.
  - Proposed Web routes in master-plan section 20.2 are product-view references and not server endpoint claims.

devicesAndResponsiveViewports:
  admissionStatus: no-physical-device-matrix-admitted
  implementationAndRuntimeSupport: NOT_EVALUATED
  designViewports:
    sourceDocument: docs/migration/expert-reviewed-master-plan.md
    sourceSection: '19.3 Canonical responsive and terminal variants'
    status: proposed-verification-fixtures-not-device-support-claims
    values:
      - { id: large-desktop, widthCssPx: 1536, heightCssPx: 960, workflowMode: pending-adaptive-contract }
      - { id: desktop, widthCssPx: 1280, heightCssPx: 800, workflowMode: pending-adaptive-contract }
      - { id: compact-desktop, widthCssPx: 1024, heightCssPx: 768, workflowMode: pending-adaptive-contract }
      - { id: tablet-portrait, widthCssPx: 768, heightCssPx: 1024, workflowMode: pending-adaptive-contract }
      - { id: mobile-large, widthCssPx: 390, heightCssPx: 844, workflowMode: pending-adaptive-contract }
      - { id: mobile-compact, widthCssPx: 320, heightCssPx: 640, workflowMode: pending-adaptive-contract }
    additionalFixtures:
      - 200-percent text zoom and relevant browser zoom/reflow
      - keyboard-only, screen reader, forced colors, and reduced-motion scenarios for supported Web processes
    rules:
      - Phase 1 must decide which workflows are fully editable, limited-edit, or review/monitoring on each admitted form factor.
      - Mobile layouts must retain recovery and critical information; responsive recomposition is not feature-admission evidence.
      - Native Android and iOS are not admitted by the archived Tauri configuration files.

localeAdmission:
  status: no-product-locale-set-admitted
  implementationAndRuntimeSupport: NOT_EVALUATED_BY_LOCALE
  dimensionsAreIndependent:
    - uiLocale
    - speechRecognitionLanguage
    - subtitleLanguage
    - synthesisVoiceLocale
    - metadataFormattingLocale
    - timeAndNumberFormattingLocale
  evidenceOnlyIdentifiers:
    - { tag: en, evidence: Media code/model/test fixtures contain English defaults or examples; product-wide UI admission is not established. }
    - { tag: fr-CA, evidence: A language-detection test uses a French-Canadian locale; no product locale admission follows. }
  proposedResilienceFixtures:
    - { tag: en, script: Latin, status: proposed-test-fixture-not-launch-claim }
    - { tag: hi-IN, script: Devanagari, status: proposed-test-fixture-not-launch-claim }
    - { tag: ar, script: Arabic/RTL, status: proposed-only-no-locale-support-claim }
    - { tag: qps-ploc, script: pseudo-localization, status: proposed-only-no-locale-support-claim }
  rules:
    - Unadmitted or unqualified language/voice choices appear as unavailable with a reason; never silently fall back to English.
    - Locale admission requires testing long labels, translated-caption wrapping, bidi/RTL, shaping, licensed font fallback, and formatting independently per capability.
    - Evidence in one STT/TTS model or one fixture does not imply UI, subtitle, voice, or mastering support.

applicationAndConsumerContext:
  ownerRegistry: handoff-contracts.yaml
  observedConsumerInventory: migration/consumer-inventory.yaml
  note: Consumer availability, contract acceptance, fulfillment, activation, and channel admission are distinct statuses.
