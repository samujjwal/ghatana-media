schemaVersion: media.phase-schema-bindings.v1
productId: media
authorityStatus: contract-mapping-authored; publication-and-owner-validation-pending
principle: >-
  Media authors product meaning. It consumes the Tools-owned public schemas,
  contracts, and validators where they exist; it does not copy generic schema
  implementations, invent a generic lifecycle or acceptance engine, or treat
  package presence as runtime capability. Media-owned detail records extend
  domain semantics outside the neutral package contracts.
toolsSnapshot:
  ownerRepository: samujjwal/ghatana-tools
  sourceRevision: 6f35f2aa4193479fe4cce3d7e9f913cf6e611308
  observation: local-owner-checkout; no public registry publication verified
bindings:
  phase0:
    authorityShape:
      package: '@ghatana/product-definition'
      packagePath: libs/product-development/product-definition
      observedVersion: 0.1.0-SNAPSHOT
      packageExports: ['.', './schema', './package.json']
      schemaPath: libs/product-development/product-definition/schemas/product-definition.v1.schema.json
      schemaVersion: ghatana.product-definition.v1
      schemaSha256: d3db40ac0f84ab62648ff6391c771719fbf84f46eea37375550c42e0c8fa2205
      validator: validateProductDefinition
      fieldsOwnedByNeutralShape: [purpose, scope, nonGoals, actors, responsibilities, userIntents, businessIntents, desiredOutcomes, capabilities, requirements, domainRules, policies, invariants, journeys, trustContexts, successMeasures, ownershipRules]
      productSpecificDetailRemainsMediaOwned: [capability-availability-dimensions, full-state-transitions, temporal-units, geometry-and-fidelity, privacy-enforcement-map, quality-profiles, media-fixtures, deployment-budgets]
      packageLimitations: [no-runtime-enforcement, no-publication-claim, external-owner-reference-values-resolved-by-consumer]
      ownerConsumerValidation: pending-public-artifact-and-isolated-consumer-run
    sourceMapping:
      targetAuthority: .product-experience/phase-0-product-truth/product-definition.yaml
      detailAuthorities: [constitution.yaml, actors-responsibilities.yaml, goals-jtbd.yaml, glossary.yaml, capabilities.yaml, requirements.yaml, domain-model.yaml, time-units-fidelity.yaml, state-models.yaml, policy-authority-model.yaml, dependency-contracts.yaml, nonfunctional-requirements.yaml, profile-semantics.yaml, quality-policy.yaml, content-intent.yaml, qualification-policy.yaml]
      projectionRule: product-definition.yaml-is-the-Tools-contract-projection-of-the-media-owned-details; no-duplicated-independent-editing
  phase1:
    authorityShape:
      package: '@ghatana/experience-language'
      packagePath: libs/product-development/experience-language
      observedVersion: 0.1.0-SNAPSHOT
      packageExports: ['.', './schema', './package.json']
      schemaPath: libs/product-development/experience-language/schemas/experience-language.v1.schema.json
      schemaVersion: ghatana.experience-language.v1
      schemaSha256: 19ec73af7941ea30e6e7c482956ebaa25f692726cf3367db0df6b71652ba5f31
      validator: validateExperienceLanguage
      ownerReferencesResolvedBy: [component-authority, recipe-authority, shared-token-authority, media-domain-state-authority]
      packageLimitations: [product-specific-domain-meaning-remains-Media-owned, schema-does-not-prove-accessibility-or-localization-conformance]
      ownerConsumerValidation: pending-public-artifact-and-isolated-consumer-run
    sourceMapping:
      targetAuthority: .product-experience/phase-1-design-language/media-experience-language.yaml
      mediaTokens: aliases-only-to-Shared-token-authority
  phase2:
    authorityShape:
      package: '@ghatana/experience-specification'
      packagePath: libs/product-development/experience-specification
      observedVersion: 0.1.0-SNAPSHOT
      packageExports: ['.', './schema', './package.json']
      schemaPath: libs/product-development/experience-specification/schemas/experience-specification.v1.schema.json
      schemaVersion: ghatana.experience-specification.v1
      schemaSha256: 42b8c067f968e9542a1a901d79ff8eef77753f6c851fdeba996102650f9ff31a
      validator: validateExperienceDefinition
      packageLimitations: [structural-and-reference-validation-only, no-state-machine-execution, no-product-simulation, external-owner-resolvers-required]
      ownerConsumerValidation: pending-public-artifact-and-isolated-consumer-run
    sourceMapping:
      targetAuthority: .product-experience/phase-2-complete-product-experience/experience-definition.yaml
      detailAuthorities: [screen-contracts, journey-contracts, action-registry.yaml, interaction-registry.yaml, state-transition-bindings.yaml, cli-command-registry.yaml, api-experience-mapping.yaml, scenario-fixture-registry.yaml, simulation-semantics.yaml, recovery-finality-contracts.yaml, handoff-bindings.yaml, responsive-variants.yaml]
      projectionRule: use-Tools-shape-for-views-actions-states-journeys-fixtures; do-not-claim-runtime-execution
  phase3:
    productPackage:
      package: '@ghatana/experience-package'
      packagePath: libs/product-development/experience-package
      observedVersion: 0.1.0-SNAPSHOT
      schemaPath: libs/product-development/experience-package/schemas/product-experience-manifest.v1.schema.json
      schemaVersion: ghatana.product-experience.v1
      schemaSha256: 49745b044d2a3166fd95b608561d6400bb4fd9d40c221ce0481980664c94bdf8
      purpose: Media-owned state-and-action package contract plus Tools package conformance helpers
      ownerConsumerValidation: pending-public-artifact-and-isolated-consumer-run
    explorerContracts:
      package: '@ghatana/experience-explorer-contracts'
      packagePath: libs/product-development/experience-explorer-contracts
      observedVersion: 0.1.0-SNAPSHOT
      ownerConsumerValidation: pending-public-artifact-and-isolated-consumer-run
    host:
      package: '@ghatana/product-dev-explorer'
      packagePath: tools/product-development/explorer
      observedVersion: 0.1.0-SNAPSHOT
      publicExports: ['.', './headless', './package.json']
      observationSource: CONSUMER_GUIDE.md-and-package.json
      packageLimitations: [headless-review-host-no-product-specific-visual-shell, no-owner-authored-scenario-manifest-declared, no-platform-support-claim-declared]
      ownerConsumerValidation: pending-public-artifact-and-built-browser-review
    sourceMapping:
      targetAuthority: .product-experience/phase-3-experience-explorer/media-experience-package
      productSemanticsAndState: Media-owned
      ExplorerHostAndGenericControls: Tools-owned
      productSpecificAdapter: Media-owned
  lifecycleAndValidation:
    productDefinitionValidation: public-validateProductDefinition-on-Tools-package-release
    experienceLanguageValidation: public-validateExperienceLanguage-on-Tools-package-release
    experienceSpecificationValidation: public-validateExperienceDefinition-on-Tools-package-release
    phaseAcceptance: owner-review-and-phase-specific-semantic-coverage-in-addition-to-structural-validation
    explorerAcceptance: built-browser-behavior-accessibility-currentness-and-human-review; a headless contract is not pixel-level evidence
    genericLocalValidator: prohibited
    mediaSemanticChecks: may-validate-Media-owned-reference-closure-and-boundary-invariants-without-copying-generic-schemas
gaps:
  - id: GAP-MEDIA-TOOLS-SCHEMA-BINDING
    status: open
    remaining: published-version-availability-isolated-consumer-validation-and-owner-accepted-phase-validator-bindings
    impact: blocks-full-GOV-003-and-Phase0-through-Phase3-certification
    evidence: local-Tools-source-checkout-shapes-and-exports-only
  - id: GAP-02
    status: open
    remaining: immutable-public-versions-and-artifact-only-consumption-for-Tools-packages
    impact: blocks-target-package-consumption-without-source-workspace-coupling
ownerReviewRequired: true
