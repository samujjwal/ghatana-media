schemaVersion: media.qualification-policy.v1
productId: media
authority: prospective-Phase-0 policy; does not itself qualify or activate any capability
status: P0-003-definition-in-progress
purpose: Keep definition, implementation, license admission, technical qualification, and current runtime availability
  independent for every capability leaf and selected execution profile.
productDefinitionContract:
  package: '@ghatana/product-definition@0.1.0-SNAPSHOT'
  ownerRepository: ghatana-tools
  schemaExport: '@ghatana/product-definition/schema'
  validator: validateProductDefinition
  localSourceStatus: observed-in-sibling-repository
  publishedArtifactAndMediaConsumerStatus: not-verified
  consumerGap: GAP-MEDIA-TOOLS-SCHEMA-BINDING
  bindingRule: Use the Tools public contract for generic core ProductDefinition objects. Do not copy its schema
    or validator into Media. A generated core projection is read-only; this policy and the Media capability records
    supply product-specific qualification semantics.
dimensions:
- id: definitionState
  values:
  - IN_SCOPE_DRAFT
  - DEFINED
  - ACCEPTED
  - DEFERRED_WITH_REASON
  default: IN_SCOPE_DRAFT
  meaning: Whether product semantics have been authored/accepted; has no implementation or runtime meaning.
- id: implementationState
  values:
  - UNKNOWN
  - NOT_IMPLEMENTED
  - IMPLEMENTATION_OBSERVED
  - IMPLEMENTED_AT_DECLARED_SCOPE
  - RETIRED
  default: UNKNOWN
  meaning: Whether an owner-observed implementation exists for the exact operation and scope. Source presence or
    a generic status does not cover every leaf.
- id: licenseAdmissionState
  values:
  - UNKNOWN
  - NOT_EVALUATED
  - ADMITTED_FOR_DECLARED_USE
  - RESTRICTED
  - DENIED
  default: UNKNOWN
  meaning: Rights to use, modify, distribute, execute and serve exact code, weights, codecs, datasets, fonts, assets,
    adapters, and transitive/native dependencies.
- id: qualificationState
  values:
  - NOT_EVALUATED
  - EVIDENCE_INCOMPLETE
  - QUALIFIED_FOR_DECLARED_PROFILE
  - REQUALIFICATION_REQUIRED
  - FAILED_FOR_DECLARED_PROFILE
  default: NOT_EVALUATED
  meaning: Measured safety, correctness, quality, resource, recovery, and compatibility evidence for a frozen operation/profile/input
    regime.
- id: runtimeAvailability
  values:
  - UNKNOWN
  - UNAVAILABLE
  - AVAILABLE_FOR_DECLARED_PROFILE
  - DEGRADED
  - BLOCKED
  default: UNKNOWN
  meaning: Current, scoped ability to execute under live policy, deployment, health, entitlement, and capacity.
governingMasterPlanSections:
- §2.3
- §6.1
- §9.2–9.6
- §11.1–11.6
- §18.2–18.3
- P0-003
decisionRules:
- Never infer one dimension from another. An implementation can be unlicensed, unqualified, unavailable, or blocked.
- UNKNOWN is not AVAILABLE; NOT_EVALUATED is not FAILED and is not evidence of success.
- Availability is profile-, tenant/policy-, deployment-, region-, language-, format-, rights-, and time-scoped.
  Record observation time, owner, fingerprints, and expiry/revalidation triggers.
- A capability is eligible for invocation only when the exact implementation binding is admitted by license and
  policy, qualification covers the requested dimensions, and live runtime checks report available. Missing evidence
  blocks or yields a policy-permitted explicit fallback.
- Qualification applies to a declared leaf and scope, not a family/package/provider label. A new model, engine,
  version, weight digest, codec, configuration, hardware class, language, quality dataset, or materially changed
  policy may invalidate evidence.
- Keep structural validity, perceptual quality, intent fidelity, scientific/domain constraints, rights/safety, and
  delivery compatibility as separate observations with method/version, applicability, uncertainty, and abstention.
- A predicted/estimated output is never represented as ground truth. Simulation rendering or a visually plausible
  scene does not prove validated simulation.
- Do not silently lower preservation, resolution, duration, frame rate, fidelity, language, cost, locality, or delivery
  requirements. Record requested/effective profile and explicit fallback authorization.
- For document intelligence, preserve the Shared frozen contract, operation-generation cancellation, dimensional
  qualification, non-activation state, and owner-bound runtime. Media scene-text leaves depend on the public DI
  API; generic OCR/document processing is not a Media implementation.
securityAndRightsBaseline:
- Treat uploaded/imported media, archives, project/scene files, codecs, fonts, SVG, shaders, scripts, models, and
  metadata as untrusted; validate detected formats and bound decompression, dimensions, frame/audio/sample counts,
  and parser complexity.
- Decode and execute engines in isolated workers with unprivileged identity, bounded resources, restricted network
  egress, approved read inputs, isolated scratch/output paths, and owned process trees.
- Disable imported-scene script execution by default. Model-generated animation/code must not run with ambient host
  or network authority; require reviewed structured compilation or separately sandboxed and permissioned execution.
- Enforce network-import destination/redirect/size/time limits and block private/link-local/metadata endpoints.
- Recheck consent/policy at upload, planning, dispatch, worker invocation, output registration, sharing/export/publication,
  and long-running stream boundaries.
- Persist required audit/effect intent before an external or consequential effect; if outcome persistence is ambiguous,
  report uncertainty and reconcile rather than replay blindly.
- Keep deletion, physical erasure, backups, caches, provider copies, legal holds, and external recall as distinct
  lifecycle evidence; never equate metadata hiding with physical erasure.
qualificationDimensions:
- public-contract-and-version
- operation/input-format/size/duration/range
- language/locale/region
- output-dimensions-and-ground-truth-versus-estimated
- quality/intent/preservation/scientific-fidelity
- identity/biometric/likeness applicability and permissions
- security/privacy/residency/egress/retention/cancellation/erasure
- license/distribution/patent/asset rights
- engine/model/weight/configuration/digest
- CPU/RAM/VRAM/storage/network/time/cost
- hardware/runtime/deployment/region/tenant
- failure/restart/recovery/reproducibility
- delivery codec/container/player/subtitle/color/accessibility
profileDimensions:
- quality-intent
- resource-profile
- execution-location
- preservation-policy
- delivery-profile
- reproducibility-class
sourceObservationHandling:
  canonicalRecord: capability-preservation-crosswalk.yaml
  rule: Keep the source wording, scope, path, evidence class, and limits. Source claims do not directly change the
    default states in capabilities.yaml; accept only through a current owner observation that matches the exact
    leaf/profile.
documentIntelligence:
  owner: Ghatana services/document-intelligence
  contractOwner: Ghatana Shared @ghatana/document-extraction
  MediaScope:
  - time ranges
  - scene/region semantics
  - temporal tracking
  - media edit/overlay intent
  MediaMustNotOwn:
  - generic OCR/parser implementation
  - PDF/Office/document workflow
  - document extraction schema or embeddings
  activationState: not-activated-by-migration; retain prior dimensional qualification and cancellation restrictions
  currentBlockers:
  - GAP-14
  - GAP-MEDIA-DI-PUBLIC-CLIENT
evidenceRecordMinimum:
- capabilityId
- implementation/provider and public-contract version
- artifact/model/engine/configuration digests
- owner and evidence class
- inputs and declared profile dimensions
- policy/license decision references and expiry
- qualification method, corpus/calibration limits, measurements, uncertainty and abstention
- runtime deployment/region/health observation time and expiry
- failures, unsupported cases, cancellation/recovery, and invalidation triggers
