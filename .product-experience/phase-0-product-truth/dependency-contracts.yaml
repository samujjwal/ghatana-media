schemaVersion: media.migration-boundary-dependencies.v1
productId: media
status: migration-boundary-accepted; capability-level-bindings-authored-as-proposals-pending-P0-010
rules:
  sourceCoupling: forbidden-across-repository-boundaries
  buildConsumption: immutable-published-artifacts-or-owner-approved-public-contracts
  networkConsumption: supported-owner-api-or-bounded-integration-provider
  reverseImplementationImport: forbidden
  generatedContracts: regenerate-from-single-registered-authored-owner
dependencies:
  - owner: ghatana-shared
    surfaces:
      - workflow command/state mechanics
      - claim-aware outbox publication
      - audit and observability interfaces
      - identity/authentication contracts
      - frozen document-extraction contracts
      - design-system primitives and localization
    boundary: public-published-contracts-only
  - owner: ghatana
    surfaces:
      - AI Inference API/client
      - Data Cloud governed metadata/read models and compatibility API
      - Event Plane and Action Plane APIs
      - generic runtime integration contracts
    boundary: public-artifacts-or-supported-network-contracts-only
  - owner: ghatana/services/document-intelligence
    surfaces:
      - reusable OCR/parser provider runtime
      - PDF, Office and image document parsing
      - generic schema-guided extraction and quality/provenance results
      - public document-intelligence API and client
    boundary: Media consumes the public API only for media-specific recognition intent
    dependencyDirection: document-intelligence-may-use-ai-inference; media-and-other-products-consume-document-intelligence
  - owner: ghatana-kernel
    surfaces:
      - product lifecycle and shell integration contracts
    boundary: only-explicitly-adopted-public-contracts
  - owner: ghatana-tools
    surfaces:
      - product-development lifecycle and experience-specification contracts
      - developer verification facade
    boundary: public-packages-and-commands-only
  - owner: ghatana-products
    surfaces:
      - canonical product portfolio and extraction registry
      - TutorPutor Media contract consumer
    boundary: registry-and-public-consumer-contracts-only
  - owner: ghatana-yappc
    surfaces: []
    boundary: no-current-direct-media-consumer-observed
    observationLimit: tracked-current-main-tree-only
