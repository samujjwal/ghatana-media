requirements:
- id: MEDIA-REQ-CAP-PROJECT
  statement: Every operation in media.project retains the intended semantic outcome in the full product definition and is
    invocable only through an explicit, authorized, compatible binding whose current implementation, license admission, qualification,
    and runtime availability are separately established.
  rationale: Master-plan §6 requires finite full-scope capability preservation and explicitly separates definition from implementation
    and admission; a catalog entry is not evidence of support.
  source:
    masterPlanSection: §6.2
    sourcePhrase: Create, inspect, update, search, organize, archive, version, duplicate/branch, collaborate/review and restore
      projects; source/derived assets, composition and project settings
  capabilityIds:
  - media.project.create
  - media.project.inspect
  - media.project.update
  - media.project.search
  - media.project.organize
  - media.project.archive
  - media.project.version
  - media.project.duplicate
  - media.project.branch
  - media.project.collaborate
  - media.project.review
  - media.project.restore
  - media.project.source-asset.attach
  - media.project.derived-asset.attach
  - media.project.composition.update
  - media.project.settings.update
  kind: functional
  priority: must
  traceToIntentIds:
  - media.intent.create
  - media.intent.edit
  - media.intent.restore-project
  intentTraceState: traced-to-proposed-canonical-P0-002-intents; human-review-pending
  actorRoles:
  - creator
  - editor
  - reviewer
  actorBindingState: resolved-to-P0-002-canonical-actors-and-responsibility-roles
  preconditions:
  - The caller identity, tenant/workspace context, and delegated authority are verified by the owning platform contracts.
  - Inputs, rights, consent, privacy, egress, retention, budget, and policy are admitted for this specific operation.
  - A capability binding and profile are declared; qualification and runtime availability are checked for the requested dimensions.
  expectedBehavior: The system performs only the requested Create, inspect, update, search, organize, archive, version, duplicate/branch,
    collaborate/review and restore projects; source/derived assets, composition and project settings operation using typed
    inputs and outputs; reports actual effective parameters and provenance; preserves source versions; and does not substitute
    an unsupported engine, model, format, language, or delivery profile silently.
  importantStates:
  - not-admitted
  - admitted
  - running-or-observing
  - completed
  - failed
  - cancel-requested-or-finality-unknown
  - blocked-by-policy-or-capability
  stateModelBindingState: bound-to-proposed-project-lifecycle-version-and-membership-models; P0-005 semantic-owner-review-pending
  consequences:
  - Any change to source bytes, version, rights, meaning, fidelity, destination, or externally visible effect is explicit
    and traceable.
  - A completed definition record never implies runtime readiness or qualification.
  failureDegradationRecovery:
  - Return typed validation, authority, rights/license, unsupported-capability, capacity, timeout, cancellation, provider-ambiguity,
    and internal-failure outcomes as applicable.
  - Expose safe remediation, retry/cancel/reconcile eligibility, and finality; do not silently downgrade preservation, quality,
    spatial/scientific fidelity, or delivery constraints.
  - Preserve accepted source and completed outputs; require policy-permitted explicit fallback or stop for review.
  nonfunctionalRequirements:
  - tenant isolation and least privilege
  - privacy/data minimization and governed egress
  - durable audit/effect intent for consequential effects
  - bounded time/memory/storage/compute/cost
  - accessible semantic representation and keyboard operation where interactive
  - localization and explicit unsupported language/format bounds
  - provenance, reproducibility class, and recovery truth
  acceptanceCases:
  - id: MEDIA-REQ-CAP-PROJECT-AC-01
    given: A declared leaf, authorized input, and a binding that satisfies the requested profile and policy.
    when: The caller requests the operation.
    then: The typed result, effective parameters, provenance, terminal/finality state, and measured dimensions are returned;
      only the declared effect occurs.
  - id: MEDIA-REQ-CAP-PROJECT-AC-02
    given: The requested language, format, right, profile, license, capability, or qualification is absent or unknown.
    when: Admission is evaluated.
    then: The operation is blocked or returns an explicit qualified fallback only when policy permits; unknown is never reported
      as available.
  relatedExternalContract: Record the owning public contract in dependency-contracts.yaml when P0-007 maps this family; do
    not invent a new external endpoint or duplicate owner schema.
  downstreamMappings:
    journeys: pending-P0-009
    viewsAndChannels: pending-P0-007/P0-009
    states: project/revision state refs authored as proposals; P0-005 owner review pending
    implementation: not-authorized-by-definition
  actorRoleBindings:
  - sourceRoleLabel: creator
    status: resolved
    actorRef: media.creator
    responsibilityRoleRef: media.role.creator
    resolution: exact
    note: Canonical actor/role assignment does not grant permission.
  - sourceRoleLabel: editor
    status: resolved
    actorRef: media.editor
    responsibilityRoleRef: media.role.editor
