requirementBindingAuthority:
  sourceFile: requirements.yaml
  disposition: generated-read-only-crosswalk-view; requirements.yaml remains the single editable Media-specific requirement
    mapping authority
actorRoleResolution:
  sourceFile: actors-responsibilities.yaml
  rules:
  - An actorRef and responsibilityRoleRef are separate descriptive references.
  - A responsibility role never grants access, permission, or approval authority.
  resolvedSourceLabels:
  - administrator
  - automation-agent
  - creator
  - developer-integrator
  - editor
  - external-provider
  - operator
  - privacy-rights-reviewer
  - reviewer
  - worker
  canonicalRoleAlias:
  - sourceRoleLabel: automation-agent
    actorRef: media.automation-client
    responsibilityRoleRef: media.role.automation-client
    basis: P0-002 names the canonical machine actor/role automation-client; preserve source label only as a mapped role alias.
  openSourceLabels:
  - sourceRoleLabel: domain-reviewer
    candidateActorRefs:
    - media.reviewer
    candidateResponsibilityRoleRefs:
    - media.role.fidelity-reviewer
    - media.role.media-domain-lead
    status: open
    reason: No exact domain-qualified reviewer actor/role exists in the current P0-002 actor artifact; these candidates are
      not treated as equivalent.
intentTraceResolution:
  sourceFile: goals-jtbd.yaml#intents
  rule: Only canonical intent IDs are emitted in traceToIntentIds. Outcomes are separately listed in relatedOutcomeRefs and
    are never substituted for intent references.
  openDispositionSummary:
  - requirementId: MEDIA-REQ-CAP-PROJECT
    familyId: media.project
    unresolvedIntentTraceDispositions:
    - scope: archive, restore, review and project recovery
      relatedOutcomeRefs:
      - media.goal.preserve-source
      - media.goal.resolve-safely
      reason: P0-002 has create/edit intents but no explicit project recovery or archival intent.
  - requirementId: MEDIA-REQ-CAP-ARTIFACT
    familyId: media.artifact
    unresolvedIntentTraceDispositions:
    - scope: retention, revocation, erasure, and recovery operations
      relatedOutcomeRefs:
      - media.goal.preserve-source
      - media.goal.resolve-safely
      reason: The authored intents cover create, understand, edit, improve, and deliver, but do not state an explicit artifact
        lifecycle/erasure intent.
  - requirementId: MEDIA-REQ-CAP-JOB
    familyId: media.job
    unresolvedIntentTraceDispositions:
    - scope: watch, cancel, retry, reconcile, and recover unknown job outcomes
      relatedOutcomeRefs:
      - media.goal.resolve-safely
      reason: The canonical safe-resolution outcome exists, but goals-jtbd.yaml has no matching user/system intent record.
  - requirementId: MEDIA-REQ-CAP-STREAM
    familyId: media.stream
    unresolvedIntentTraceDispositions:
    - scope: disconnect, reconnect, cancellation, and uncertain live-session recovery
      relatedOutcomeRefs:
      - media.goal.resolve-safely
      reason: The canonical safe-resolution outcome exists, but no streaming recovery intent is authored.
  - requirementId: MEDIA-REQ-CAP-PROFILE
    familyId: media.profile
    unresolvedIntentTraceDispositions:
    - scope: profile discovery and validation
      relatedOutcomeRefs:
      - media.goal.integrate-repeatably
      reason: No canonical intent currently states how an integrator or creator discovers/validates a profile; the goal is
        not itself an intent.
  - requirementId: MEDIA-REQ-CAP-CAPABILITY
    familyId: media.capability
    unresolvedIntentTraceDispositions:
    - scope: capability/provider diagnostics and execution compatibility
      relatedOutcomeRefs:
      - media.goal.integrate-repeatably
      reason: No canonical intent currently states capability discovery/compatibility inspection; do not substitute a goal
        for an intent.
  - requirementId: MEDIA-REQ-CAP-HEALTH
    familyId: media.health
    unresolvedIntentTraceDispositions:
    - scope: capability-scoped readiness inspection
      relatedOutcomeRefs:
      - media.goal.resolve-safely
      reason: No canonical operator intent for readiness/degraded-capability inspection is authored.
  - requirementId: MEDIA-REQ-CAP-RIGHTS
    familyId: media.rights
    unresolvedIntentTraceDispositions:
    - scope: consent grants/revocation, rights assertion, and privacy/lifecycle review outside delivery
      relatedOutcomeRefs:
      - media.goal.review-trustworthy-output
      - media.goal.resolve-safely
      reason: The delivery intent covers permitted-use checks at delivery, but no canonical intent explicitly covers rights/consent
        administration and revocation.
  - requirementId: MEDIA-REQ-CAP-PROVENANCE
    familyId: media.provenance
    unresolvedIntentTraceDispositions:
    - scope: retention/erasure lineage and source-origin disclosure beyond understand/improve/deliver
      relatedOutcomeRefs:
      - media.goal.preserve-source
      - media.goal.review-trustworthy-output
      reason: The current intents cover relevant understand/improve/deliver flows but do not explicitly state provenance,
        retention, or erasure inspection.
  emptyTraceRequirements:
  - MEDIA-REQ-CAP-PROFILE
  - MEDIA-REQ-CAP-CAPABILITY
  - MEDIA-REQ-CAP-HEALTH
