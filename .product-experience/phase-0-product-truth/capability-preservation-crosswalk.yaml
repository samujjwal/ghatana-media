schemaVersion: media.capability-preservation-crosswalk.v1
productId: media
status: P0-003-crosswalk-in-progress; completeness is mechanically checked against capabilities.yaml but does not imply Product
  Truth acceptance
masterPlanSource: docs/migration/expert-reviewed-master-plan.md §§6, 9, 11, 18
supplementalOwnershipDecision: docs/migration/decisions/MDI-001-document-intelligence-ownership.md
productDefinitionContract:
  package: '@ghatana/product-definition@0.1.0-SNAPSHOT'
  schemaExport: '@ghatana/product-definition/schema'
  publicValidator: validateProductDefinition
  owner: ghatana-tools
  sourceObservation: package manifest/schema/source exist in local Tools checkout; this establishes local source availability
    only
  consumerVerification: not performed for this Media repository; packed artifact/publication and consumer import remain unverified
  projectionPolicy: The productDefinition core instance is generated read-only from canonical Product Truth authorities once
    they are complete; do not create or edit a second projection authority. Media-specific leaves/qualification remain in
    capabilities.yaml and requirements.yaml as their distinct plan-defined artifacts.
  specializationBoundary: Tools owns neutral ProductDefinition, Capability and Requirement shape plus closed structural/local-reference
    validation. Media owns product meaning and the richer per-leaf inputs/outputs, actors, state coverage, authority, rights/privacy,
    fidelity, cancellation/recovery, dependencies, acceptance and qualification details. The generic schema is not extended
    with those fields.
rules:
- Every §6 family/operation is represented by one leaf or an explicit semantic alias.
- Source observations remain attributed to their source scope and evidence class; they never promote implementation/license/qualification/runtime
  axes.
- General document intelligence is platform-owned; only Media scene/time/region semantics are retained as Media capabilities.
