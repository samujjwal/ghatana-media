  masterPlanScope: §6.2 mentions PDF/Office/image parsing, OCR, schema-guided extraction, applicable embeddings, and region/fallback
    behavior as the former Media worker boundary.
  currentOwner: Ghatana services/document-intelligence; Shared owns frozen @ghatana/document-extraction contracts.
  mediaRetainedCapabilityIds:
  - media.vision.scene-text.region.track
  - media.vision.scene-text.observation.create
  platformOwnedScope:
  - PDF/Office/image document parsing
  - generic OCR and text extraction
  - schema-guided document extraction
  - document embeddings
  - document-region and fallback semantics
  - generic document workflow and worker execution
  mediaOwnedScope:
  - video/frame time ranges
  - scene and temporal text-region semantics
  - cross-frame text-region tracking
  - media-specific editing, overlays, and timestamped observations
  boundary: Media may call the public Document Intelligence API through a thin adapter; it does not implement or duplicate
    the generic service.
  qualificationAndActivation: Preserve frozen Shared contract identities, operation-generation cancellation, current dimensional
    qualification restrictions, and non-activation state; rehome and consumer parity remain open under GAP-14 and GAP-MEDIA-DI-PUBLIC-CLIENT.
