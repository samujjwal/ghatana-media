  proposedChannels: [media.channel.web, media.channel.product-integration]
  viewRefs: [M-REVIEW, M-OUTPUT, M-PROVENANCE]
  preconditions: Review purpose, exact artifact version, reviewer authority, and scope/expiry are explicit.
  completion: Decision attaches to the reviewed version and required approval state.
  criticalNonhappy: Stale version, changed material, expired delegation, or reviewer role confused with rights/publication
    authority.
  recovery: Invalidate only approvals whose reviewed material changed; reopen review for that exact scope.
  contextAndReturn: Retain comments bound to artifact version and time/region and return to the project/output.
