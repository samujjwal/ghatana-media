accessibilityDisposition:
  id: media.a11y.baseline
  status: required-by-plan; acceptance-review-pending
  proposedBaseline:
  - Semantic DOM or structured view of canvas, timeline, waveform, graph, and simulation meaning.
  - Keyboard operation and non-drag alternatives for selection, trim, reorder, masks, and controls.
  - Predictable focus, programmatic errors/status, captions/transcripts, visible audio controls, reduced motion, forced colors,
    zoom/reflow, and touch-target review.
  - Exact supported locale set and per-language testing remain unadmitted; generated language output is a reviewable draft.
  evidence: No WCAG or human-usability acceptance is claimed.

