- id: J-22
  title: Export/download/publish with destination acknowledgement
  outcomeRefs: [media.goal.deliver-approved-output, media.goal.review-trustworthy-output]
  actors: [media.creator, media.reviewer, media.operator]
  proposedChannels: [media.channel.web, media.channel.http-api, media.channel.cli, media.channel.product-integration]
  viewRefs: [M-OUTPUT, M-DELIVERY, M-JOB]
  conditionalHandoffRefs: [action-plane-publication]
  handoffCondition: Use Action Plane only for privileged external publication; export/download is a separate Media delivery
    operation.
  preconditions: Exact output, destination, rights, approval, and external-effect authority are current.
  completion: Package validity, transport, and external publication are reported as distinct finality outcomes.
  criticalNonhappy: Partial package, destination rejection, timeout after effect may have occurred, or approval scope mismatch.
  recovery: Reconcile by effect/idempotency identity before retry; never represent unknown publication as success or failure.
  contextAndReturn: Retain output/version, destination, authorization/approval refs, effect status, and receipt if returned.
  accessibility: media.a11y.baseline
- id: J-23
  title: Private/local workflow while disconnected and reconnect
  outcomeRefs: [media.goal.resolve-safely]
  actors: [media.creator, media.editor, media.administrator]
  proposedChannels: [media.channel.web, media.channel.cli]
  viewRefs: [M-PROJECT, M-ASSET, M-JOB, M-ACTIVITY]
  preconditions: An admitted local capability, offline mode, cached asset permission, and storage policy are explicitly established.
  completion: Only work allowed in the admitted disconnected mode is completed; reconnect reconciles versions and jobs without
    remote fallback.
  criticalNonhappy: Entitlement expires offline, local capability is unavailable, or reconnection would require unauthorized
    egress.
  recovery: Keep eligible local work, block unavailable operations, reauthenticate/revalidate at reconnect, and reconcile
    before submission.
  contextAndReturn: Preserve offline edits, pending sync state, source refs, and the identity of remote work requiring reconciliation.
  accessibility: media.a11y.baseline
- id: J-24
  title: CLI batch/JSON plan through verified outputs
  outcomeRefs: [media.goal.integrate-repeatably, media.goal.deliver-approved-output, media.goal.resolve-safely]
  actors: [media.developer-integrator, media.automation-client]
  proposedChannels: [media.channel.cli, media.channel.http-api]
  viewRefs: [M-CREATE, M-PLAN, M-JOB, M-OUTPUTS]
  preconditions: Public command/request schema, explicit approval/policy input, client keys, and per-item budgets are accepted.
  completion: Each item reports its terminal/partial/unknown outcome and output refs using the same semantics as other channels.
  criticalNonhappy: SIGINT, duplicate key, same key with changed content, per-item partial failure, malformed JSON, or uncertain
    effect.
  recovery: Stop watching separately from cancellation; reconcile accepted work and continue only unambiguous eligible items.
  contextAndReturn: Preserve batch/group ID, per-item semantic key, plan fingerprint, output refs, and exit/result disposition.
  accessibility: media.a11y.baseline
- id: J-25
  title: Agent or product integration with bounded delegated Media action
  outcomeRefs: [media.goal.integrate-repeatably]
  actors: [media.automation-client, media.developer-integrator, media.operator]
  proposedChannels: [media.channel.product-integration, media.channel.http-api]
  viewRefs: [M-PLAN, M-JOB, M-OUTPUT]
  handoffRefs: [agent-runtime-media-action]
  conditionalHandoffRefs: [action-plane-publication]
  handoffCondition: Use Action Plane only if the bounded agent request includes a privileged external effect.
  preconditions: Public Media action, bounded authority/delegation, recursion/cost limits, and return contract are admitted.
  completion: Caller receives an opaque job/result reference and truthful status; any consequential effect has separate authority.
  criticalNonhappy: Delegation expired, recursive budget reset, self-authorizing action, or result returned without Media
    finality.
  recovery: Stop at declared budget, preserve request identity, return safe reason code, and reconcile before any repeated
    effect.
  contextAndReturn: Restrict context to purpose, source refs, policy refs, deadline/budget, correlation refs, and accepted
    output refs.
  accessibility: media.a11y.baseline
