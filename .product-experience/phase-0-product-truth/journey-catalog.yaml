  conditionalHandoffRefs: [document-intelligence-scene-text]
  handoffCondition: Only if affected derivatives were produced through an admitted Document Intelligence boundary and its
    public deletion/retention contract applies.
  preconditions: Identity, deletion/revocation authority, retention/hold state, and affected artifact/derivative scope are
    resolved.
  completion: Product lifecycle reflects completion/partial/blocked status without claiming remote copies were recalled.
  criticalNonhappy: Retention hold, backup/cache/external copy, provider deletion uncertainty, or partial erasure.
  recovery: Preserve required minimal audit, continue owner-authorized erasure, and show the remaining scope/finality honestly.
  contextAndReturn: Keep affected versions/derivatives, authority refs, lifecycle state, and consumer/provider follow-up refs.
  accessibility: media.a11y.baseline
