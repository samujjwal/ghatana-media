    license, qualification, and runtime dimensions are represented separately.
  completion: The caller receives a bounded, current observation with provenance and explicit unknown/unsupported dimensions;
    an observation does not promise future availability.
  criticalNonhappy: Stale capability data, unavailable provider, unknown license/qualification, expired authority, or diagnostics
