- id: J-28
  title: Spatial/360/interactive/synthetic-data export to declared consumer
  outcomeRefs: [media.goal.finished-asset, media.goal.explain-or-demonstrate, media.goal.deliver-approved-output]
  actors: [media.creator, media.developer-integrator, media.reviewer]
  proposedChannels: [media.channel.web, media.channel.product-integration]
  viewRefs: [M-SCENE, M-ANIMATION, M-RENDER, M-DELIVERY]
  conditionalHandoffRefs: [tutorputor-domain-scene]
  handoffCondition: Only when an owner-approved TutorPutor domain model is the export source; Marketing is not a default spatial-export
    dependency.
  preconditions: Destination subset, coordinate/time conventions, synthetic-data labeling, and licensing are declared.
  completion: Consumer receives an identified package and conversion report with unsupported/lossy features disclosed.
  criticalNonhappy: Coordinate/time/format mismatch, unsupported feature, data provenance gap, or destination cannot accept
    the package.
  recovery: Keep source specification and produce only a user-approved supported subset; otherwise block export.
  contextAndReturn: Retain source/model/scene versions, subset, loss report, destination, and package refs.
  accessibility: media.a11y.baseline
- id: J-29
  title: Live session loss, consent change, and bounded recovery
  intentRefs:
  - media.intent.recover-live-session
  outcomeRefs:
  - media.goal.resolve-safely
  actors:
  - media.creator
  - media.editor
  - media.operator
  - media.automation-client
  proposedChannels:
  - media.channel.web
  - media.channel.grpc-api
  viewRefs:
  - M-ACTIVITY
  - M-JOB
  - M-VIDEO
  preconditions: A live session has stable session/frame identity, bounded buffers, a current lease, and authoritative consent
    scope.
  completion: The session is confirmed closed/drained or its in-flight external effects remain explicitly unknown; no new
    frame crosses the boundary after revocation or fencing.
  criticalNonhappy: Client disconnect, lease loss, consent revocation/expiry, out-of-order acknowledgement, or uncertain provider
    frame outcome.
  recovery: Fence new frames; use prior consent only for permitted termination; reconcile already-dispatched frame effects
    before any new session.
  contextAndReturn: Preserve session ID, last acknowledged frame sequence, current lease/consent version, and per-frame finality.
  accessibility: media.a11y.baseline
