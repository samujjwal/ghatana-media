  conditionalHandoffRefs: [ai-inference-execution]
  handoffCondition: Only for an outage of a capability whose admitted provider is AI Inference.
  preconditions: Capability qualification, license, runtime availability, and fallback policy are checked independently.
  completion: User receives an admitted equivalent fallback with material differences disclosed or a clear blocked result.
  criticalNonhappy: Provider/license/capacity outage, no eligible alternative, or fallback would reduce fidelity/privacy/rights
    guarantees.
  recovery: Preserve completed work, mark unknown outcome, reconcile before retry, and never silently downgrade or fabricate
    success.
  contextAndReturn: Preserve original plan, capability/reason status, fallback decision, budget, and completed outputs.
  accessibility: media.a11y.baseline
