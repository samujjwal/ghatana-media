- id: media.explorer.check.capability-label-uniqueness
  scope: unique-human-readable-labels-for-all-462-Phase-0-capability-leaves
  implementation: .product-experience/phase-0-product-truth/capabilities.yaml
  environment: local-YAML-audit
  observation: PASS
  detail: A source audit parsed all 462 capability leaves and found 462 distinct labels. It resolved three label
    collisions by distinguishing transcript speaker separation from audio separation, speech-to-face association
    from timing alignment, and speech-intelligibility measurement from candidate-quality evaluation. This verifies
    label uniqueness and those reviewed distinctions, not semantic owner approval of the full capability catalog.
- id: media.explorer.check.screen-contract-proposal-previews
  scope: read-only-Specification-previews-for-all-41-baseline-and-six-selected-lane-screen-contracts
  implementation: apps/media-experience-explorer
  environment: local-browser-127.0.0.1:4178
  observation: PASS
  detail: The Specification artifact index exposes all 47 media.screen-contract.v1 proposals. Browser review selected
    each contract and confirmed its read-only preview and non-executable-action disclaimer; the source YAML remains
    below the preview. At 390x844 and 320x640, the selected preview stacked into one column and the document width
    matched the available layout width with no page-level horizontal overflow. This is local preview evidence only;
    it does not realize the views or represent independent human review or phase acceptance.
- id: media.explorer.check.product-screen-contract-projections
  scope: direct-Product-mode-projection-and-deep-link-for-all-47-screen-contracts
  implementation: apps/media-experience-explorer
  environment: local-production-preview-127.0.0.1:4179
  observation: PASS
  detail: On 2026-10-05, the production preview rendered all 47 registered screen-contract routes with their declared
    context, goal, now, next, purpose, regions, states, and action references. Proposal action labels resolve from the
    Phase 2 action registry. Rendered anatomy/state names use sentence case and channel IDs resolve to declared
    human-readable channel names. A DOM geometry sweep after that label update covered all 47 routes at 320x640, 390x844,
    768x1024, 1024x768, and 1280x800; it found no page-level horizontal overflow or missing context/goal/now/next cards, 47 unique display titles,
    and no enabled proposal actions. The context grid used one column at 320/390px, two at 768px, and four at
    1024/1280px. Product routes contain no Explorer mode tabs or inspector, and reloading the job-status deep link
    reopens its proposal route. After the label update, screenshot spot checks covered edit-captions at 320x640, 768x1024,
    and 1280x800; earlier screenshots covered the job-status route at all five widths. No visible clipping or hierarchy
    issue was found in those samples. This verifies source-derived navigation and route-template geometry, not domain behavior,
    visual review of all 47 routes,
    independent human review, or phase acceptance.
