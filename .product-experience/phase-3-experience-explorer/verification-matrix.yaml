    claim: EXPERIENCE_AUTHORITY
    status: CANDIDATE_PLAN
    evidenceAuthorityId: unavailable
    selectedOperationIds: []
    failure: PLANNER_BINDING_OWNER_AMBIGUOUS
  - phase: P3
