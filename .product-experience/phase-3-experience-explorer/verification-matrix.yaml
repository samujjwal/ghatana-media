schemaVersion: media.explorer-verification-matrix.v1
productId: media
status: locally-built-and-partially-observed; no-Explorer-acceptance
checks:
- id: media.explorer.check.simulation-package-typecheck
  scope: strict-TypeScript-check-of-the-Media-simulation-package
  implementation: libs/media-experience-simulation
  environment: TypeScript-6.0.3
  command: pnpm dlx --package typescript@6.0.3 tsc --noEmit -p libs/media-experience-simulation/tsconfig.json
  observation: PASS
  detail: No compiler diagnostics were emitted.
- id: media.explorer.check.browser-client-typecheck
  scope: strict-TypeScript-check-of-the-Media-browser-review-client
  implementation: apps/media-experience-explorer
  environment: TypeScript-6.0.3
  command: pnpm dlx --package typescript@6.0.3 tsc --noEmit -p apps/media-experience-explorer/tsconfig.json
  observation: PASS
  detail: No compiler diagnostics were emitted.
- id: media.explorer.check.fixture-determinism-and-action-guards
  scope: deterministic-first-use-artifact-intake-verification-job-and-caption-fixtures-with-identity-finality-and-separate-entity-guards
  implementation: libs/media-experience-simulation
  command: pnpm dlx --package typescript@6.0.3 tsc -p libs/media-experience-simulation/tsconfig.json && node --test
    libs/media-experience-simulation/tests/simulation.test.mjs
  observation: PASS
  detail: Ten reducer checks passed, including deterministic replay, first-use authority and hidden-data guards,
    stable project-create, upload, and verification-job identities, unknown-result blocking, integrity outcomes,
    and access denial.
- id: media.explorer.check.fixture-runner-cli
  scope: deterministic-workflow-fixture-runner-json-jsonl-help-and-invalid-input
  implementation: libs/media-experience-simulation/bin/media-experience-fixture.mjs
  command: pnpm dlx --package typescript@6.0.3 tsc -p libs/media-experience-simulation/tsconfig.json && node --test
    libs/media-experience-simulation/tests/cli.test.mjs
  observation: PASS
  detail: Six fixture-runner CLI checks passed; fixture output reports upload status separately from processing
    jobs. This runner remains distinct from the canonical ghatana-media command simulator.
- id: media.explorer.check.canonical-command-cli
  scope: registered-ghatana-media-commands-version-validation-formatting-and-exit-status
  implementation: libs/media-experience-simulation/bin/ghatana-media.mjs
  command: pnpm dlx --package typescript@6.0.3 tsc -p libs/media-experience-simulation/tsconfig.json && node --test
    libs/media-experience-simulation/tests/product-cli.test.mjs
  observation: PASS
  detail: Fifteen command parser and executable checks passed, including the conventional invocation that omits the
    binary name from its arguments, same-upload-ID upload recovery, literal flag-shaped caption text, structured
    JSON/JSONL argument errors, and transcription-job cancellation that retains RUNNING/PENDING with
    CANCEL_REQUESTED until confirmation. A media output destination is rejected because this executable only writes
    fixture reports to stdout. The CLI remains a synthetic-fixture simulator with no runtime or provider connection.
- id: media.explorer.check.browser-build
  scope: browser-client-bundle-external-stylesheet-specification-assets-and-content-security-policy
  implementation: apps/media-experience-explorer
  environment: Vite-7.3.1
  command: pnpm dlx vite@7.3.1 build --config apps/media-experience-explorer/vite.config.mjs
  observation: PASS
  detail: Production bundle built with a 154.56 kB JavaScript asset, a 75.80 kB CSS asset, and all 146 current specification
    records; strict TypeScript checking passed for the updated client.
- id: media.explorer.check.screen-contract-proposal-previews
  scope: read-only-Specification-previews-for-all-41-baseline-and-six-selected-lane-screen-contracts
  implementation: apps/media-experience-explorer
  environment: local-browser-127.0.0.1:4178
  observation: PASS
  detail: The Specification artifact index exposes all 47 media.screen-contract.v1 proposals. Browser review selected
    each contract and confirmed its read-only preview and non-executable-action disclaimer; the source YAML remains
    below the preview. At 390x844 and 320x640, the selected preview stacked into one column and the document width
    matched the available layout width with no page-level horizontal overflow. This is local preview evidence only;
    it does not realize the views or represent independent human review or phase acceptance.
- id: media.explorer.check.cross-channel-parity
  scope: browser-cli-and-terminal-projections-from-one-parser-reducer-and-fixture-state
  implementation: libs/media-experience-simulation
  observation: PARTIAL
  detail: Browser and terminal CLI use the canonical parser and reducer. On 2026-10-05, the terminal CLI regression
    checks confirmed upload resume preserves its transfer identity without creating a processing job; the embedded
    CLI also returned the transcription job projection and was updated to expose artifact-verification job identity,
    related upload, stage, and finality from the same parser and reducer. The local browser rendered an unknown
    artifact-verification reconciliation in CLI mode with the same job and upload IDs, unknown finality, and inspection
    as the next action. API transport and embedded application channels remain unavailable.
- id: media.explorer.check.product-chrome-separation
  scope: local-Product-mode-versus-Explore-Specification-and-Verify-chrome
  implementation: apps/media-experience-explorer
  observation: PASS
  detail: The built client renders Product without the Explorer header, mode tabs, Explorer tabpanel, or Explore
    actions. The
- id: media.explorer.check.artifact-intake-product-route
  scope: J-02-metadata-only-import-route-inspection-and-stable-upload-resume
  implementation: apps/media-experience-explorer
  observation: PASS
  detail: On 2026-10-05, the browser preview displayed the interrupted upload identity, confirmed-part count, integrity
    disposition, and no-byte-transfer boundary. Resuming kept the same upload ID, advanced only the synthetic transfer
    status to RECEIVING, and left the UI in inspect mode; this is local fixture evidence, not independent human
    acceptance or real transfer verification.
- id: media.explorer.check.artifact-verification-job-product-route
  scope: J-02-synthetic-verification-job-state-related-upload-identity-and-unknown-finality
  implementation: apps/media-experience-explorer
  observation: PASS
  detail: On 2026-10-05, the local browser showed a separate verification-job ID and related upload ID, Integrity
    Check stage, unavailable progress, and unknown finality. Checking the existing outcome preserved both identities
    and remained unknown without owner evidence; opening
- id: media.explorer.check.activity-product-route
  scope: J-02-synthetic-activity-view-opening-the-exact-uncertain-verification-job
  implementation: apps/media-experience-explorer
  environment: local-browser-127.0.0.1:4173
  observation: PASS
  detail: On 2026-10-05, the activity route showed one synthetic unknown verification job with distinct job and
    related-upload IDs. Inspect job opened the exact detail view and preserved both IDs and unknown finality. DOM
    measurements at preview widths 320px and 390px showed no horizontal overflow. The fixture has no production
    activity query or event timestamps; independent human acceptance remains open.
- id: media.explorer.check.artifact-verification-job-cli-projection
  scope: J-02-CLI-inspection-and-reconciliation-of-the-existing-verification-job
  implementation: apps/media-experience-explorer
  environment: local-browser-127.0.0.1:4173
  observation: PASS
  detail: On 2026-10-05, Explore switched to the CLI channel for the artifact-verification unknown-outcome fixture
    and ran job reconcile in JSON mode. Output retained the distinct verification job and related upload IDs, INTEGRITY_CHECK
    stage, OUTCOME_UNKNOWN state, UNKNOWN finality, and inspect-job next action; no effects were emitted. This is
    local fixture evidence, not owner-contract or human acceptance.
- id: media.explorer.check.long-running-job-product-route
  scope: J-20-transcription-job-identity-observation-cancellation-pending-and-unknown-outcome-recovery
  implementation: apps/media-experience-explorer
  environment: local-browser-127.0.0.1:4173
  observation: PASS
  detail: On 2026-10-05, the Product route showed the existing transcription job separately from its exact source
    version, omitted unmeasured progress, and kept RUNNING distinct from cancellation finality. Request cancellation
    set attemptState CANCEL_REQUESTED and finality PENDING; Stop watching returned to transcript work without changing
    the job. Reattaching showed the same job identity and pending state. The unknown-outcome fixture kept the same
    identity and UNKNOWN finality through reconciliation to RECONCILING without a new request. At configured preview
    widths 390px and 320px, the job panel had no horizontal overflow (app scroll widths 388px and 318px respectively).
    This is local synthetic evidence; live watch, retries, runtime owner bindings, and independent acceptance remain
    open.
- id: media.explorer.check.long-running-job-cancellation-cli
  scope: J-20-canonical-CLI-job-cancel-command-and-shared-reducer-finality
  implementation: libs/media-experience-simulation
  environment: local-command-line
  command: node --test libs/media-experience-simulation/tests/product-cli.test.mjs
  observation: PASS
  detail: The CLI accepted job cancel only for the current transcription-job identity and returned the same job
    ID, RUNNING state, CANCEL_REQUESTED attempt state, PENDING finality, and inspect-job as the next action. A repeated
    request was blocked while pending; a separate fixture confirmation transitioned to CANCELLED/CONFIRMED. On
    2026-10-05, the browser CLI projection also inspected the running-job fixture and requested cancellation; it kept
    RUNNING with pending finality and exposed inspect-job as the next safe action. These commands are fixture-only;
    production CLI and cancellation owner contracts are not connected.
- id: media.explorer.check.first-use-product-route
  scope: J-01-synthetic-identity-workspace-and-empty-project-creation-boundaries
  implementation: apps/media-experience-explorer
  observation: PASS
  detail: On 2026-10-05, the rebuilt browser showed the empty-project action creating one synthetic project ID and
    version, kept identity-required and workspace-denied views free of workspace/project identifiers, preserved
    the unknown create request through inspection, and kept the unavailable-intent project without a processing
    job. These are local fixture observations; identity and project services remain unbound, and responsive geometry
    is recorded separately.
