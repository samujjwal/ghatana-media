- id: media.explorer.check.responsive-geometry
  scope: Responsive layout of the selected caption editor, job previews, CLI terminal, and Verify summary at recorded viewport sizes.
  implementation: apps/media-experience-explorer
  observation: PASS
  detail: The selected Product caption editor was checked at browser viewports 1536x960, 1280x800, 1024x768, 768x1024,
    390x844, and 320x640 after layout settled. The verification-job and transcription-job Product previews were
    inspected at configured widths 320px and 390px; their app scroll widths remained two CSS pixels below the configured
    widths, with no horizontal overflow. The host reserves 15 CSS px for its scrollbar, so caption-editor layout
    widths were 1521, 1265, 1009, 753, 375, and 305 CSS px respectively. The current embedded CLI was exercised with
    unknown transcription-job and artifact-verification-job outcomes. At browser/preview widths 320x640/320px and
    390x844/390px, document widths matched host inner widths of 305px and 375px; CLI surface widths were 287px and
    357px, terminal widths 267px and 337px, response widths 218px and 288px, and command-form widths 265px and 335px.
    Each measured scroll width matched its client width, with no horizontal overflow. At a 1280px browser width, the
    390px CLI surface was centered in its 765px preview column with a 0px center offset. The toolbar reports only the
    selected width instead of inferring a height the preview does not control. The Verify status summary was also inspected
    at browser viewports 390x844 and 320x640; the host-available inner widths were 354px and 291px, and document/body
    widths were 341px and 277px, with all four phase cards stacked inside the available width. This covers only the
    current Verify summary. A later direct viewport-override check of the updated Verify screen used 390x844 and 320x640
    (inner widths 390px and 320px; document widths 375px and 305px); all four phase cards fit their content widths with
    no horizontal overflow. Other baseline views, zoom, localization, and device-level rendering remain unverified.
- id: media.explorer.check.accessibility
  scope: keyboard-screen-reader-zoom-forced-colors-reduced-motion-localization
  implementation: apps/media-experience-explorer
  observation: PARTIAL
  detail: Landmark, mode-tab, panel, form-label, skip-link, product-route focus, and live-announcement semantics
    are present; screen-reader, zoom, forced-colors, and full keyboard-path reviews remain unrecorded.
- id: media.explorer.check.keyboard-mode-and-phase-navigation
  scope: keyboard-switching-and-focus-retention-for-mode-tabs-and-the-responsive-specification-phase-selector
  implementation: apps/media-experience-explorer
  environment: local-production-preview; 1280x800 and 320x640 CSS viewports
  observation: PASS
  detail: On 2026-10-05, ArrowRight moved the focused Explore tab to Specification and retained focus on the selected
    mode tab. The phase selector exposes a single selected radio stop; ArrowDown moved P0 to P1 in the desktop
    vertical layout and ArrowRight moved P0 to P1 at 320x640. Phase selection retained focus on P1 after its source
    loaded and triggered a content rerender. Resizing the open Specification view 320x640 -> 1280x800 -> 320x640
    updated aria-orientation horizontal -> vertical -> horizontal. Screenshot review at 320x640 confirmed five
    legible choices with Cross-phase on its own full-width row. This covers these selectors and their focus behavior;
    it does not establish complete keyboard access, screen-reader support, WCAG conformance, or phase acceptance.
- id: media.explorer.check.packaging-csp-offline
  scope: bundled-assets-base-path-deep-link-reload-mime-cache-csp-and-offline-fixtures
  implementation: apps/media-experience-explorer
  observation: PARTIAL
  detail: Static preview returned the app and phase source assets successfully under a preview CSP with connect-src
    self; phase YAML was served as text/yaml, and the browser fetched it without console errors. Non-root base paths,
    deep-link reload, cache behavior, and offline operation remain unverified.
- id: media.explorer.check.intent-based-view-names-and-caption-comparison-prerequisite
  scope: Product-and-Explore-route-names-source-selection-caption-comparison-next-action-and-narrow-workflow-navigation
  implementation: apps/media-experience-explorer
  environment: local-browser-127.0.0.1:4178
  observation: PASS
  detail: On 2026-10-05, browser accessibility and visual inspection confirmed that Product and Explore show the same
    intent-based names for source selection, transcript review, caption correction, and caption-version comparison in
    the page title, breadcrumb, document title, and workflow navigation. The unknown-job recovery action and contextual
    view both use the label Check job outcome. At 390x844 and 320x640, the five-step workflow navigation stays above
    the page content in one row without horizontal overflow. In the unknown-outcome view, status copy keeps the full
    card width and the View job status and Check job outcome actions stack below it at 320px and 390px. From the shared
    job-status view, checking the outcome retains the same job ID and reports Checking outcome without submitting a
    second request. With one saved caption version, the comparison view explains that a second version is needed and
    offers Correct captions as the next action. Verify reads the indexed artifact count and displays 146 source records.
    This is local UI and fixture evidence; it does not realize all baseline views or establish independent human review
    or phase acceptance.
- id: media.explorer.check.human-visual-review
  scope: every-canonical-view-and-required-variant
  blocker: GAP-12
  observation: REVIEW_REQUIRED
  detail: Local inspection is implementation evidence only; no independent reviewer decision is recorded.
acceptanceRule: Phase3 cannot pass until all 41 Phase2 baseline views, lane specializations, 28 required journeys,
  and CLI/API channel dispositions are realizable in the admitted host; observations are current; required variants
  pass; and human review is recorded.
