schemaVersion: media.explorer-verification-matrix.v1
productId: media
status: locally-built-and-partially-observed; no-Explorer-acceptance
checks:
- id: media.explorer.check.product-definition-local-invariants
  scope: canonical-source-index-trace-metadata-and-local-closure-matrix-invariants
  implementation: scripts/check-product-experience-local.mjs
  command: node scripts/check-product-experience-local.mjs
  observation: PASS
  detail: The read-only local check found all 147 indexed source records, 462 Phase 0 capability leaves with the required definition shape, 38 capability families, 38 requirement IDs, 10 vision outcomes with journey/supporting-view coverage, 28 Phase 1 component contracts with required fields, all 47 screen proposal contracts with required fields, 43 journey view references and 16 journey action references resolving, 30 indexed journeys with 28 required journey proposal files, complete 33-area matrix coverage, proposal actions disabled in the Product projection, and no generated currentness.yaml while Tools generation remains unresolved. This is local invariant evidence only; it is not native Tools admission or phase acceptance.
- id: media.explorer.check.vision-requirements-phase-alignment
  scope: master-prompt-vision-outcome-requirement-journey-view-and-phase-crosswalk
  implementation: .product-experience/vision-requirements-coverage.yaml; docs/PRODUCT-DEFINITION-COVERAGE.md
  command: node scripts/check-product-experience-local.mjs
  observation: PASS
  detail: The alignment ledger captures the pasted master prompt's eight auditable section bands, the PDP-0 through PDP-3 to local P0/P1/P2/P3 crosswalk, all 10 vision outcomes, all 38 requirement groups, all 13 NFR and decision records, 462 capability leaves, 28 components, 47 screen contracts, 30 journeys, 146 actions, and 147 Explorer source records. The permitted-settings outcome is explicitly covered by the supporting settings view and project requirement. This is a source-coverage and traceability observation, not owner acceptance or native Tools evidence.
- id: media.explorer.check.product-definition-local-invariant-regression
  scope: regression-test-for-the-cross-phase-local-invariant-check
  implementation: tests/product-experience-local.test.mjs
  command: pnpm test:product-experience-local
  observation: PASS
  detail: The focused Node test invokes the canonical local checker and asserts the published denominators for 462 Phase 0 capability leaves, 28 Phase 1 components, 47 Phase 2 screen contracts, 28 required journey proposals, and the intentional absence of generated currentness.yaml. This is a regression guard for local source integrity, not native evidence or phase acceptance.
- id: media.explorer.check.browser-experience-sweep
  scope: all-Explorer-scenarios-source-artifacts-Product-proposal-routes-Verify-keyboard-and-responsive-geometry
  implementation: scripts/check-experience-browser.mjs
  environment: Chromium via Playwright 1.63.0; local Vite preview at 127.0.0.1:4179
  command: pnpm test:experience-browser
  observation: PASS
  detail: The browser audit exercised all 29 synthetic Explore scenarios, all 147 Specification records, all 47 valid Product proposal routes, the inline artifact-verification job-family specialization, Verify, mode-tab and phase-radio keyboard navigation, visible control accessible names, and six viewports (1536x960, 1280x800, 1024x768, 768x1024, 390x844, and 320x640). It produced no console errors, page errors, enabled proposal actions, or horizontal overflow. Fixed-viewport screenshots were repeated in a second run with identical SHA-1 hashes for all eight review captures. Screenshots and report.json were emitted under /tmp/media-experience-browser-audit. This is deterministic browser evidence and visual-review input; it is not pixel-reference conformance, independent human review, assistive-technology certification, or Tools-native acceptance.
- id: media.explorer.check.tools-explorer-shared-projection
  scope: native-Tools-Explorer-picker-and-shared-traceability-graph
  implementation: Ghatana-Tools product-dev explore and workspace graph
  environment: current Ghatana Tools checkout with Media and Tools roots
  command: node tools/product-development/cli/dist/bin/product-dev.js explore --root &lt;media-root&gt; --root &lt;tools-root&gt; --coordinate ghatana.product/media --json; node tools/product-development/cli/dist/bin/product-dev.js workspace graph --root &lt;media-root&gt; --root &lt;tools-root&gt; --json
  observation: PASS_WITH_SYNTHETIC_RENDERER
  detail: Tools Explorer selected ghatana.product/media and loaded media-conformance-package with rendererId=default, source=synthetic, locale=en, and no diagnostics. The shared traceability graph resolved 147 nodes and 141 relations, including 132 Media nodes, six shared-framework-contract nodes, and two product-dev-explorer nodes. The native Explorer returned no product renderResult or inspection projection, so this proves picker/graph projection only; it does not prove a connected browser host or native phase acceptance.
- id: media.explorer.check.source-linked-trace-context
  scope: Specification-mode-source-link-metadata-and-phase-coverage
  implementation: apps/media-experience-explorer/src/specification.ts; apps/media-experience-explorer/src/main.ts
  environment: local-browser-127.0.0.1:4179
  observation: PASS
  detail: On 2026-10-05, the local production preview rendered the selected P0, P2, and P3 records and a direct P2 Product proposal route with stable Explorer projection ID, owning phase and authority class, canonical source path, pending Tools semantic fingerprint, intentionally ungenerated currentness, relation authority, and verification status. The phase coverage controls switched between 24 P0, 94 P2, and 6 P3 records without losing the trace panel. This proves local source-linked presentation only; it does not prove Tools currentness or acceptance.
