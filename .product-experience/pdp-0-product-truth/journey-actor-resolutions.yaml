  disclosure: .product-experience/pdp-0-product-truth/goals-jtbd.yaml#/disclosureLevels
  journeyContracts: .product-experience/pdp-3-product-experience/journey-contracts/
policy:
  selection: Select the initiating actor only when the narrative or ordered journey semantics distinguish that actor from collaborators.
  collaborators: Copy every journey actorRef unchanged; selecting an initiator does not remove collaborator roles or grant authorization.
  ambiguity: Keep initiatingActorRef null where the sources retain multiple plausible initiators.
  firstUse: The explicit firstUse actor resolves J-01 only; the generic sequence is not treated as an actor binding for unrelated journeys.
  disclosure: Simple, guided, and expert disclosure levels preserve the same action/state/authority and do not select an initiating actor.
  acceptance: These are Media-owner decisions only; independent P0-010 review remains pending.
