schemaVersion: media.journey-actor-resolutions.v1
productId: media
status: Media-owner-initiator-decisions-recorded; P0-010-independent-semantic-review-pending
authority: User-delegated Media product-owner decisions for P0-04
sourceRefs:
  journeyCatalog: .product-experience/pdp-0-product-truth/journey-catalog.yaml#/journeys
  firstUse: .product-experience/pdp-0-product-truth/goals-jtbd.yaml#/firstUse
  disclosure: .product-experience/pdp-0-product-truth/goals-jtbd.yaml#/disclosureLevels
  journeyContracts: .product-experience/pdp-3-product-experience/journey-contracts/
policy:
  selection: Use an exact source distinction where available; where a journey deliberately combines valid actor roles, the Media owner selects one representative initiator for ProductDefinition and retains every source collaborator.
  collaborators: Copy every journey actorRef unchanged; selecting an initiator does not remove collaborator roles or grant authorization.
  ambiguity: Keep initiatingActorRef null only where no bounded representative initiator can be selected without conflating materially different authority or effect paths.
  firstUse: The explicit firstUse actor resolves J-01 only; the generic sequence is not treated as an actor binding for unrelated journeys.
  disclosure: Simple, guided, and expert disclosure levels preserve the same action/state/authority and do not select an initiating actor.
  acceptance: These are Media-owner initiator choices only; they do not change collaborator roles or authorization, and independent P0-010 review remains pending.
