ownerDefinedInventoryRule:
  id: media.handoff.inventory-completeness
  rule: >-
    For each proposed or observed cross-product handoff, inventory the actual route, client operation, transport/proto
    fields, and external consumer when source evidence exists. A bounded scan that finds no path records that absence
    with its scan scope; it does not prove no consumer or callable contract exists. Do not derive an operation or wire
    mapping from a similar name, route family, package coordinate, or implementation-only symbol.
  scopeStatus: OWNER_DEFINED_INVENTORY_RULE; inventory presence does not establish public admission or runtime behavior.

handoffEnvelope:
  requiredForEveryAdmittedCall:
    - source owner and destination owner
    - operation and version
    - authentication/delegation and the authority source
    - data classification and purpose
    - minimum expected context
    - deadline/timeout and supported cancellation behavior
    - finality and uncertainty representation
    - idempotency/retry/reconciliation behavior
    - safe error mapping
    - return/continuation path
    - accepted artifact/result references
  invariants:
    - A service call does not authorize another owner's database mutation.
    - User intent, a signed URL, an artifact reference, or a cached plan does not widen authority.
    - Revalidate expiring/revoked policy at dispatch and artifact access where applicable.
    - A timeout or lost client connection does not prove that remote work stopped.
    - Do not blind-retry an unknown external effect; inspect/reconcile its stable request/effect identity first.
    - Unsupported or unavailable calls return an explicit bounded failure; no fabricated success or silent provider substitution.
    - Correlation/trace/job/attempt references are diagnostic context, not authorization.
    - Context and media bytes are minimized; credentials, raw prompts, voiceprints, signed URLs, and unrestricted tenant/user IDs are not propagated as general baggage.
  unresolvedFieldValue: >-
    A field marked pending-owner-contract is a known contract gap. It is not a
    default, an inferred guarantee, or permission to invent a route/payload.

pdpPhaseHandoffContracts:
  pdp0ToPdp1CapabilityIntent:
    id: media.pdp0-pdp1.capability-intent-handoff.v1
    sourcePhase: PDP-0
    consumerPhase: PDP-1
    status: DEFINITION_HANDOFF_CONTRACT
    sourceRecordPopulation:
      count: 462
      identity: .product-experience/pdp-0-product-truth/capabilities.yaml#/capabilities/@id=<capabilityIntentId>
      identityRule: Each existing capability leaf ID is the stable capabilityIntentId. PDP-1 consumes it verbatim; a family ID, operation ID, label, or generated ID is not a substitute.
      fullDenominatorSource: .product-experience/pdp-0-product-truth/capabilities.yaml#/capabilities
    requiredMeaning:
      actorRefs: .product-experience/pdp-0-product-truth/capabilities.yaml#/capabilities/@id=<capabilityIntentId>/actorRefs
      intentRefs: .product-experience/pdp-0-product-truth/capabilities.yaml#/capabilities/@id=<capabilityIntentId>/intentRefs
      outcome: .product-experience/pdp-0-product-truth/capabilities.yaml#/capabilities/@id=<capabilityIntentId>/outcome
      semanticOutcomeContract: .product-experience/pdp-0-product-truth/capabilities.yaml#/capabilities/@id=<capabilityIntentId>/ownerDefinition/semanticOutcomeContract
      requirementIds: .product-experience/pdp-0-product-truth/capabilities.yaml#/capabilities/@id=<capabilityIntentId>/requirementIds
      inputSemanticShapes:
        - .product-experience/pdp-0-product-truth/capabilities.yaml#/capabilities/@id=<capabilityIntentId>/inputArtifactTypes
        - .product-experience/pdp-0-product-truth/capabilities.yaml#/capabilities/@id=<capabilityIntentId>/supportedParameters
        - .product-experience/pdp-0-product-truth/capabilities.yaml#/capabilities/@id=<capabilityIntentId>/ownerDefinition/typedInputSlots
        - .product-experience/pdp-0-product-truth/capabilities.yaml#/capabilities/@id=<capabilityIntentId>/ownerDefinition/parameterSchema
      outputSemanticShapes:
        artifactTypes: .product-experience/pdp-0-product-truth/capabilities.yaml#/capabilities/@id=<capabilityIntentId>/outputArtifactTypes
        successOutputs: .product-experience/pdp-0-product-truth/capabilities.yaml#/capabilities/@id=<capabilityIntentId>/ownerDefinition/successOutputs
        successOutputVariants: .product-experience/pdp-0-product-truth/capabilities.yaml#/capabilities/@id=<capabilityIntentId>/ownerDefinition/successOutputs/*/resultVariants
        trustReconstructionBranches: .product-experience/pdp-0-product-truth/capability-leaf-review.yaml#ownerTrustReconstructionDispositions/records/@capabilityRef=<capabilityIntentId>/outputBranches/*/outcomes
        variantBindingRule: >-
          Each success output is joined to its owner trust branch by exact output artifact type. Each result variant is
          joined by its exact selector and disposition; PDP-1 preserves these P0 declarations verbatim. A missing or
          mismatched branch is an unresolved P0 semantic handoff, not a PDP-1 implementation choice.
      preconditions: .product-experience/pdp-0-product-truth/capabilities.yaml#/capabilities/@id=<capabilityIntentId>/preconditions
      constraints: .product-experience/pdp-0-product-truth/capabilities.yaml#/capabilities/@id=<capabilityIntentId>/constraints
      executionResourceAdmission: >-
        .product-experience/pdp-0-product-truth/profile-semantics.yaml#boundedInvocationAdmission
      rightsPrivacy: .product-experience/pdp-0-product-truth/capabilities.yaml#/capabilities/@id=<capabilityIntentId>/rightsPrivacyImplications
      fidelity: .product-experience/pdp-0-product-truth/capabilities.yaml#/capabilities/@id=<capabilityIntentId>/qualityFidelityContract
      provenance: .product-experience/pdp-0-product-truth/capabilities.yaml#/capabilities/@id=<capabilityIntentId>/provenance
      supportedChannels: .product-experience/pdp-0-product-truth/capabilities.yaml#/capabilities/@id=<capabilityIntentId>/supportedChannels
      channelApplicability: .product-experience/pdp-0-product-truth/capability-leaf-review.yaml#ownerCapabilityLeafAdjudication/records/@capabilityRef=<capabilityIntentId>/channelApplicability
      exclusions: .product-experience/pdp-0-product-truth/capabilities.yaml#/capabilities/@id=<capabilityIntentId>/explicitUnsupportedCases
      qualificationAndAvailability: .product-experience/pdp-0-product-truth/capabilities.yaml#/capabilities/@id=<capabilityIntentId>/supportDimensions
    consumerObligations:
      - Preserve the stable capabilityIntentId and exact WHAT/WHY, actors, semantic input/output shapes, source-backed result meaning and distinctions, unknown disposition, preconditions, constraints, applicability, exclusions, and support-axis meanings.
      - Treat typedInputSlots.sourceType, cardinality, and required as PDP-0 semantic shape; payloadSchemaRef names are downstream schema-lookup hints and their resolution is not a PDP-0 completion dependency.
      - Add exact typed PDP-1 operation, query, or non-domain disposition bindings only in PDP-1. A capability may bind to multiple operations or to an explicit no-domain-operation disposition when its meaning requires that.
      - Reject missing, duplicate, stale, or substituted capabilityIntentIds and any operation that broadens the handed-off product meaning.
      - Keep operation contracts, domain object identities, executable request/result schemas, and state transitions downstream; their absence does not make a complete PDP-0 intent incomplete.
      - Preserve UNKNOWN, NOT_EVALUATED, NOT_ADMITTED, and unsupported outcomes exactly; definition never implies implementation, license admission, qualification, or runtime availability.
      - Preserve every ownerDefinition.successOutputs result variant and its exact selector, result kind, origin relation, epistemic disposition, and claim limit together with the matching ownerTrustReconstructionDispositions branch. Do not flatten variants into a single artifact type or infer a variant from a reference alone.
    negativeCases:
      - A PDP-1 operation is matched to a capability by a similar label instead of the exact stable capabilityIntentId.
      - A PDP-1 operation silently adds an actor, outcome, channel, input, output, or effect that is absent from the handed-off P0 meaning.
      - A capability outcome is reduced to a generated inventory sentence, omits its exact required result distinction, or has no resolvable owner source reference.
      - A future operation ID, transport route, domain object, provider, or runtime implementation is required to establish PDP-0 semantic completeness.
      - An absent or unbound source is represented as source-derived rather than authored, inferred, or UNKNOWN according to the exact P0 branch.
      - A result variant is dropped, its selector or disposition is changed, or it is handed off without the matching P0 trust branch.
    scopeStatus: OWNER_DEFINED_PHASE_HANDOFF; does not claim PDP-1 operation completeness or runtime admission.

publicOwnerContractFingerprintRule:
  id: media.handoff.public-owner-contract-fingerprint
  authority: user-delegated-Media-semantic-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
  mediaSemanticAuthority: Media authors and governs Media product meaning in the current owning PDP records; an external owner controls its own public capability semantics. Bind Media to the exact published contract without copying or redefining the external owner's meaning.
  requiredBinding:
    - canonical external owner identity and accountable contract owner
    - immutable published artifact or package version and content fingerprint
    - exact public operation, request/result schema and compatibility revision
    - source/publication location and owner-resolution evidence
    - Media-owned semantic binding that maps the exact public fields without copying or redefining external-owner meaning
  unresolvedBehavior: If any identity, version, fingerprint, public schema, or owner resolution is missing, keep that binding pending; do not infer a callable endpoint or copy semantics from implementation source.
  scopeStatus: OWNER_DEFINED_BINDING_REQUIREMENT_ONLY; it does not assert that a current external contract is published, admitted, compatible, or accepted.

cancellationRetryReconciliationRule:
  id: media.handoff.cancellation-retry-reconciliation
  rule: >-
    Every admitted long-running call declares cancellation request semantics,
    whether cancellation is supported at each execution stage, the authoritative
    cancellation result/finality, retry eligibility, stable request/effect
    identity, and reconciliation steps for timeout or unknown outcome. A client
    stop-waiting event is not remote cancellation; retry never duplicates a
    possibly accepted effect and requires the exact owner contract.
  scopeStatus: OWNER_DEFINED_ENVELOPE_REQUIREMENT; no generic runtime behavior is asserted.

handoffs:
  - id: shared-auth-identity
    status: observed-consumer-path; public-owner-contract-and-consumer-binding-remain-shared-owned
    direction: Media client to Shared Auth Gateway
    sourceOwner: Media
    destinationOwner: ghatana-shared identity/authentication owner
    operationAndVersion:
      observed: GET /api/v1/auth/validate
      versionStatus: Route identity is recorded; no separate versioned auth schema is copied here.
      evidence: migration/consumer-inventory.yaml#shared-auth-gateway-client-path
    authenticationAndDelegation:
      observedHeaders: [Authorization, X-Tenant-ID]
      authority: Shared identity/authentication contract; a Media role label is not a grant.
      pending: Exact current public request/response revision and delegation semantics must be confirmed against Shared owner contract.
    classificationAndPurpose: Caller purpose and tenant context are minimized; authorization decision remains Shared-owned.
    expectedContext: Authenticated credential reference, requested tenant context, correlation reference; no media bytes.
    timeoutCancellation: Timeout/deadline and cancellation are pending confirmation from the Shared contract; do not cancel identity state by closing a view.
    finality: Identity validation response is not Media job/output finality.
    retryReconciliation: Follow the admitted Shared read/validation contract; never retry with widened tenant or delegated scope.
    errorMapping: Map denial/expiry to re-authentication or access-denied; unavailable/indeterminate auth fails closed with safe retry guidance.
    returnContinuation: Return to the same intended route/context after successful re-auth; denial retains no protected detail.
    acceptedArtifactReferences: []

  - id: datacloud-media-compatibility
    status: observed-retained-consumer-surface; lifecycle-writes-fail-closed-without-explicit-provider
    direction: Data Cloud client to Data Cloud Media compatibility/read-model surface; optional future adapter to Media public contract
    sourceOwner: Data Cloud consumer/application
    destinationOwner: Ghatana Data Cloud for read-model/compatibility routes; Media remains artifact/job/stream semantic owner
    operationAndVersion:
      observedRoutes:
        - /api/v1/media/artifacts
        - artifact, job, consent, transcript, frame-index, and processing route families documented under /api/v1/media
      authority: Data Cloud route boundary marks /api/v1/media READ_MODEL_OR_COMPATIBILITY and non-authoritative.
      evidence: migration/consumer-inventory.yaml#datacloud-media-compatibility
      pending: Exact per-operation Media public provider version and consumer parity are not established by the route inventory.
    authenticationAndDelegation: Existing Data Cloud route auth/tenant policy is owner-controlled; no direct Media database credential or owner mutation.
    classificationAndPurpose: Governed metadata/read-model projection and scoped search/reference access; use current owner policy and purpose.
    expectedContext: Opaque artifact/job/consent references and scoped query; exact per-route payload is the owning OpenAPI contract.
    timeoutCancellation: Per-route behavior not resolved here; query/read timeout is separate from cancellation of a Media job.
    finality: Read-model responses are non-authoritative. Mutation/processing routes fail closed when no explicit Media provider is configured.
    retryReconciliation: Preserve Data Cloud navigation and compatibility until consumer migration; mutations use the admitted Media request identity and reconcile uncertain jobs.
    errorMapping: Retain consumer-safe unavailable/forbidden/conflict/unknown status distinctions from owner contracts; exact mapping pending.
    returnContinuation: Return to Data Cloud media artifact/job views with the same scoped context and route identity, but revalidate current authorization and policy scope before revealing protected details or continuing access; if access is absent, expired, revoked, or indeterminate, preserve the consumer's navigation state while withholding protected data and require reauthorization as applicable. Route/context continuity never grants or widens access.
    acceptedArtifactReferences: Data Cloud may hold governed metadata references; Media remains the artifact-byte/lifecycle authority.
    prohibited:
      - Treating Data Cloud metadata rows as canonical Media artifact/job state.
      - Making Data Cloud read-model authority depend on Media's database.

  - id: tutorputor-governed-media-artifact
    status: current-contract-provider-admission-accepted; request-open; fulfillment-unfulfilled; activation-shadow
    direction: TutorPutor consumer to Media public provider contract
    sourceOwner: TutorPutor
    destinationOwner: Media
    operationAndVersion:
      requestId: TP-GHATANA-MEDIA-001
      contractIdentity: tutorputor.ghatana.media.v2
      operations:
        - appendMediaChunk
        - beginMediaUpload
        - cancelMediaJob
        - completeMediaUpload
        - getMediaArtifact
        - getMediaConsent
        - getMediaJob
        - grantMediaConsent
        - listMediaConsents
        - revokeMediaConsent
        - submitMediaJob
      statusEvidence: migration/consumer-inventory.yaml#tutorputor-governed-media-artifact
    authenticationAndDelegation: Must follow the accepted current Media provider contract; exact per-operation principal/delegation mapping remains to be reconciled by owners.
    classificationAndPurpose: Preserve Media consent, purpose, classification, residency, retention, and external-processing constraints from the current contract.
    expectedContext: Tenant/principal/request/correlation and artifact/job/consent refs only as authorized by the provider contract.
    timeoutCancellation: Preserve declared operation bounds and cancellation outcomes; exact async and timeout parity remains a consumer/provider verification item.
    finality: Consumer status explicitly says fulfillment UNFULFILLED and activation SHADOW; no runtime completion or canonical-lifecycle write is claimed.
    retryReconciliation: P0-005 must bind idempotency, attempt identity, safe retry, cancellation, and unknown-outcome reconciliation; do not infer semantics from contract acceptance.
    errorMapping: Preserve current contract errors; exact TutorPutor consumer mapping and conformance proof remain pending.
    returnContinuation: Return status/result through the consumer's accepted provider contract; consumer retains its own learning/pedagogy/assessment state.
    acceptedArtifactReferences: Opaque Media artifact/job/consent references described by the accepted contract.
    ownerBoundary:
      - TutorPutor owns Experience IR, Model IR, Scene IR, pedagogy, scientific meaning, learning evidence, and assessment.
      - Media supplies only the admitted Media artifact/job/provider capability; no canonical lifecycle mutation by TutorPutor is admitted in the inventory.
      - The open 11-operation request is not proof that all operations are implemented or qualified.
    reuseSelectionRule:
      id: media.handoff.tutorputor-reuse-selection
      rule: >-
        Before adding a collaboration service, CRDT, or duplicate persistence mechanism, inspect the existing Ghatana and
        TutorPutor collaboration components and their exact public contracts. Reuse only a published, owner-approved
        contract whose identity, version, data model, consistency, authorization, and recovery semantics satisfy the
        Media operation. If the contract is missing or incompatible, retain the dependency gap; do not infer reuse from
        repository presence or invent a replacement integration.
      scopeStatus: OWNER_DEFINED_SELECTION_RULE; no existing contract adoption is claimed.
    learningFidelityBoundary:
      id: media.handoff.tutorputor-learning-fidelity
      rule: >-
        TutorPutor remains authoritative for pedagogy, scientific/domain meaning, units, measurements, learner evidence,
        accessibility requirements, and assessment. Media may transform an explicitly supported scene subset only when
        the exact unit/fidelity mapping is declared; unsupported or lossy conversion is disclosed to TutorPutor and
        cannot be represented as preserved scientific meaning or a validated learning result.
      scopeStatus: OWNER_DEFINED_BOUNDARY; no TutorPutor scene adapter or scientific validation is admitted.

  - id: tutorputor-domain-scene
    status: proposed-cross-product-reuse; no-media-scene-binding-admitted
    direction: TutorPutor domain/model references to Media rendering/animation; output references return to TutorPutor
    sourceOwner: TutorPutor for learning/model truth; Media for media scene/rendering semantics
    destinationOwner: Media for an explicitly accepted render/animation boundary; TutorPutor for lesson/experience artifact use
    operationAndVersion:
      value: No public operation or Media scene/animation adapter version is established.
      ownerContractReferences:
        - products/tutorputor/contracts/v1/experience/model-ir.ts
        - products/tutorputor/contracts/v1/experience/scene-ir.ts
        - products/tutorputor/contracts/v1/experience/experience-ir.ts
    authenticationAndDelegation: Pending owner-approved contract and project/learner context; no authority is inferred from a model reference.
    classificationAndPurpose: Domain and learning evidence retain TutorPutor classification/purpose; media output lineage and rights remain explicit.
    expectedContext: Versioned owner references, supported subset, units/fidelity, accessibility requirements, and authorized output reference; exact schema pending.
    timeoutCancellation: Pending public operation; do not invent a solver/render deadline or cancellation guarantee.
    finality: A rendered artifact is not evidence of TutorPutor pedagogy, scientific validity, or learner outcome.
    retryReconciliation: Pending admitted operation identity, bounded execution, and artifact version semantics.
    errorMapping: Unsupported IR/features, units, fidelity, or adapter state must be explicit; mapping requires owner review.
    returnContinuation: Return opaque media artifact/version and conversion/fidelity report to TutorPutor for its own lesson/experience decision.
    acceptedArtifactReferences: Only owner-authorized, versioned model/scene/experience and output refs.
    prohibition: Do not import @tutorputor/simulation broad internals or copy/fork TutorPutor IRs into Media.

  - id: document-intelligence-scene-text
    status: MDI-001-owner-boundary-accepted; future-public-call-not-admitted
    direction: Media scene-text/temporal observation adapter to Ghatana Document Intelligence public API
    sourceOwner: Media for video frame selection, sampling, time ranges, tracking, scene identity, duplicate suppression, and overlay/edit intent
    destinationOwner: Ghatana services/document-intelligence for generic OCR/parser/document workflow
    operationAndVersion:
      value: Public operation/version and payload contract are pending owner admission; no endpoint or request shape is invented here.
      authority: Shared retains @ghatana/document-extraction; Media must call an admitted public Document Intelligence boundary.
    authenticationAndDelegation: Pending public caller identity, purpose, tenant, and policy/delegation binding.
    classificationAndPurpose: Media-specific temporal/scene-text purpose only; apply current consent, privacy, retention, residency, and provider policies.
    expectedContext: If the admitted API supports it, bind recognized result to opaque source artifact, frame/time map, scene, and Media correlation refs; exact fields remain unknown until owner contract review.
    timeoutCancellation: Pending Document Intelligence public contract; do not infer worker cancellation from client disconnect.
    finality: OCR/parser result is an observation with provenance/uncertainty; Media temporal association is not identity proof or document authority.
    retryReconciliation: Use the admitted service request identity and cancellation/finality rules; no direct worker source link from Media.
    errorMapping: Generic extraction errors remain Document Intelligence-owned; Media maps only documented public reason codes.
    returnContinuation: Attach accepted typed observation refs to the source time/scene and continue through Media editing/overlay intent.
    acceptedArtifactReferences: Opaque source, public result, and approved Media derivative refs only.
    prohibition:
      - Moving generic OCR/parser/document workflow into Media.
      - Importing Shared document-extraction implementation/schema as a Media-owned duplicate.
      - Treating a receipt/image as scene text solely because its MIME type is image.

  - id: gharbatai-direct-document-intelligence
    status: observed-consumer-reference-rebound; runtime-qualification-not-established
    direction: Gharbatai Org API directly to Document Intelligence client/service; no Media intermediary
    sourceOwner: Gharbatai Org API
    destinationOwner: Ghatana services/document-intelligence; Shared owns document-extraction contracts
    operationAndVersion:
      package: '@ghatana/document-intelligence-client'
      contract: '@ghatana/document-extraction'
      workerPathAfterRehome: services/document-intelligence
      evidence: migration/consumer-inventory.yaml#gharbatai-org-document-intelligence
    authenticationAndDelegation: Gharbatai/Document Intelligence owner contract; exact runtime identity and authorization remain outside Media.
    classificationAndPurpose: Document-intelligence consumer purpose/retention stays with Gharbatai and the public DI contract.
    expectedContext: Consumer-scoped request through the public client; Media receives no raw document or authority through this handoff.
    timeoutCancellation: Preserve the DI generation-token cancellation contract; consumer runtime qualification remains not established by the inventory.
    finality: Preserve current non-activation and qualification state; source relocation does not enable the feature.
    retryReconciliation: Gharbatai owns its direct request and verification path; no Media retry path is introduced.
    errorMapping: Keep DI public reason codes and consumer-specific error mapping; do not turn relocation/build failure into a Media success.
    returnContinuation: Return to Gharbatai's existing document-extraction workflow.
    acceptedArtifactReferences: Consumer-owned document/result refs under the public extraction contract.
    consumerPreservationBoundary:
      id: media.handoff.gharbatai-consumer-preservation
      rule: >-
        A Media migration or source relocation preserves the existing consumer's owner-qualified operation identity,
        authentication/delegation, cancellation/finality, retention, and qualification restrictions. It does not create
        a Media intermediary, activate the feature, broaden clinical/financial interpretation, or establish runtime
        availability. Missing identity or owner evidence remains an explicit dependency.
      scopeStatus: OWNER_DEFINED_BOUNDARY; no new consumer feature or runtime qualification is claimed.

  - id: phr-document-client-references
    status: documentation-only-reference; active-source-import-not-found-in-bounded-scan
    direction: PHR documentation proposes Media client/UI packages; no active runtime handoff established
    sourceOwner: PHR
    destinationOwner: Media client package only if PHR owner confirms current intent and public artifact admission
    operationAndVersion:
      packageReferences: ['@ghatana/audio-video-client', '@ghatana/audio-video-types', '@ghatana/audio-video-ui']
      version: No active manifest import/public package version found in the bounded scan.
      evidence: migration/consumer-inventory.yaml#phr-audio-video-package-documentation
    authenticationAndDelegation: Not established; PHR owner must confirm intended use and auth boundary.
    classificationAndPurpose: Any clinical/media use remains PHR purpose and policy; Media does not infer clinical meaning.
    expectedContext: Pending PHR owner confirmation; do not move protected data into Media for documentation-only package references.
    timeoutCancellation: Not established because no active call path was found.
    finality: No PHR runtime outcome or feature activation is claimed.
    retryReconciliation: No active Media client request is established.
    errorMapping: Pending PHR owner confirmation.
    returnContinuation: Preserve and reconcile documentation with published package bindings after the consumer owner confirms scope.
    acceptedArtifactReferences: None established by current consumer inventory.
    clinicalFeatureBoundary:
      id: media.handoff.phr-clinical-feature-boundary
      rule: >-
        Documentation-only PHR package references do not establish an active Media call, clinical or financial
        interpretation, protected-data transfer, or feature activation. PHR owner identity, authentication/delegation,
        purpose, retention, and a published Media consumer contract must be confirmed before any such integration.
        Missing device/PKCE or identity flows remain owner dependencies; do not invent an endpoint or credential flow.
      scopeStatus: OWNER_DEFINED_BOUNDARY; current consumer activation is not established.

  - id: digital-marketing-creative-brief
    status: master-plan-proposed; external-owner-contract-not-admitted
    direction: Digital Marketing sends approved brief/brand/claim/copy/asset references to Media; Media returns reviewed output refs
    sourceOwner: Digital Marketing for brand, campaign, offer, claims, and campaign approval
    destinationOwner: Media for composition and media artifact creation; Action Plane for consequential publication
    operationAndVersion:
      value: No named public operation/version is established by current consumer inventory.
      sourceDocument: docs/migration/expert-reviewed-master-plan.md
      sourceSection: '17 Cross-product recipes and dependency handoffs'
    authenticationAndDelegation: Pending Marketing owner contract; brief and brand references are not publication permission.
    classificationAndPurpose: Campaign/brand/claim purpose and rights must accompany approved references; exact classification is pending owner policy.
    expectedContext: Approved creative brief, versioned brand kit/claim/copy refs, constraints, and desired output spec; exact schema pending.
    timeoutCancellation: Pending public operation and any long-running render contract.
    finality: Media returns exact output refs and review state; Media does not approve marketing claims or publish externally.
    retryReconciliation: Bounded render jobs use Media job identity; external publication reconciles through Action Plane.
    errorMapping: Unsupported font/asset/claim scope or expired approval must be explicit and safely returned to Marketing owner.
    returnContinuation: Return versioned outputs and disclosed media/quality provenance for Marketing review; publication decision returns through Action Plane.
    acceptedArtifactReferences: Authorized versioned brand/claim refs and exact Media output refs only.
    campaignPolicyBoundary:
      id: media.handoff.marketing-policy-ownership
      rule: >-
        Digital Marketing owns campaign, brand, offer, claim approval, and campaign publication policy. Media owns only
        the admitted composition and exact media output transformation; it does not recreate a campaign or brand-policy
        engine, approve claims, or treat an approved creative brief as permission to publish externally.
      scopeStatus: OWNER_DEFINED_BOUNDARY; no Marketing policy contract or publication operation is admitted.
    campaignPublicationWorkflowBoundary:
      id: media.handoff.marketing-campaign-publication-workflow
      rule: >-
        Digital Marketing owns campaign, brand, offer, claim approval, and the
        campaign publication policy and workflow. Media owns only the admitted
        composition and exact media output transformation; it does not recreate
        a campaign or brand-policy engine, approve claims, run the campaign
        publication workflow, or treat an approved creative brief as permission
        to publish externally. Consequential publication uses the separately
        admitted Action Plane authority and effect contract.
      scopeStatus: OWNER_DEFINED_BOUNDARY; no Marketing policy contract or publication operation is admitted.

  - id: ai-inference-execution
    status: owner-boundary-established; exact-operation-version-binding-is-downstream-pdp-1-and-non-gating-for-pdp-0
    direction: Media bounded capability adapter to AI Inference public operation; provider/model selection remains AI Inference-owned
    sourceOwner: Media for intent, source artifacts, output requirements, and media operation state
    destinationOwner: Ghatana AI Inference for generic model/provider eligibility, routing, credentials, quota, health, and failover
    operationAndVersion:
      value: Exact public operation/version is not recorded in the current Media migration inventory.
      admission: Resolve the exact public AI Inference operation/version per admitted leaf capability in PDP-1 before runtime admission; this does not gate PDP-0 intent definition.
    authenticationAndDelegation: Use public service identity/delegation and current policy; Media does not pass credentials or widen authority through intent.
    classificationAndPurpose: Bind purpose, classification, residency/egress, retention, consent, and biometric restrictions where applicable.
    expectedContext: Typed operation/version, immutable artifact refs, Media bounds/deadline, policy-decision refs, and opaque correlation/job refs.
    timeoutCancellation: Use the AI Inference public cancellation/reconciliation contract; timeout is not provider cancellation confirmation.
    finality: Model/provider response is an execution result, not automatic quality, rights, fidelity, or publication approval.
    retryReconciliation: Bounded idempotent request and provider outcome reconciliation; exact operation-level semantics are a downstream PDP-1 binding.
    errorMapping: Preserve public health, quota, license, policy, capacity, and unknown-outcome reasons; do not silently select an unqualified fallback.
    returnContinuation: Return provider-neutral result/provenance refs to Media plan/job for Media-specific validation and registration.
    acceptedArtifactReferences: Authorized input/output artifact refs and owner-provided execution refs.
    prohibition: Media does not create a second generic model registry/router or select a model unavailable under current policy.
    requestInputBoundary:
      id: media.handoff.ai-inference-input-boundary
      rule: >-
        An admitted Media request supplies either validated bounded input bytes or immutable authorized artifact references,
        plus explicit capability-specific intent options and required profile/policy context. A receipt, filename, MIME label,
        or opaque reference alone is not meaningful intent or authorization. Exact accepted fields, bounds, and output
        references come only from the selected public AI Inference operation; absent contract details remain unresolved.
      scopeStatus: OWNER_DEFINED_REQUEST_REQUIREMENT; no AI Inference operation/version is admitted.
    genericInferenceOwnershipBoundary:
      id: media.handoff.generic-inference-ownership
      rule: >-
        AI Inference owns generic inference public contracts, model/provider
        eligibility, routing and selection, local deployment eligibility and
        placement, credential handling, quota, health, and failover policy. Media owns product intent, media artifacts and
        lifecycle, capability-specific bounds, rights/consent/purpose gates,
        and validation of returned media results. Media submits only through an
        exact admitted AI Inference public operation and does not duplicate its
        generic contracts or policy. Missing public identity/version or owner
        evidence remains a dependency; implementation symbols and similar names
        do not establish a callable contract.
      scopeStatus: OWNER_DEFINED_CROSS_PRODUCT_BOUNDARY; external contract acceptance remains pending.
    boundedWorkerExceptionRule:
      id: media.handoff.ai-inference-bounded-worker-exceptions
      rule: >-
        An explicitly documented existing worker exception is a narrow compatibility
        disposition for its exact owner, operation, input/output contract, authority
        scope, execution profile, resource and deadline bounds, policy checks, cancellation,
        idempotency, unknown-outcome reconciliation, and audit obligations. It does not
        establish a general bypass around AI Inference model/provider eligibility or
        Media consent, rights, privacy, locality, security, licensing, or qualification
        gates. Missing identity, owner approval, contract fields, or current evidence
        blocks the exception; repository location or a matching implementation symbol
        cannot create one.
      requiredEvidence:
        - exact existing worker and owning product identity
        - public operation or explicit source-bound compatibility contract
        - typed request/result and input/output authority
        - named execution profile with bounds and locality/retention policy
        - cancellation, idempotency, unknown-outcome and audit semantics
        - current owner approval and applicable license/security/qualification evidence
      absentEvidenceDisposition: DENY_OR_UNRESOLVED; never infer a general exception.
      scopeStatus: OWNER_DEFINED_EXCEPTION_BOUNDARY; no worker exception or runtime path is admitted by this rule.
    acceptedArtifactReferenceContract:
      id: media.handoff.ai-inference-artifact-reference-contract
      requiredFields:
        - exact artifact kind and schema identity/version
        - immutable artifact/version reference and content identity where applicable
        - input/output role and cardinality
        - declared size, duration, shape, and format bounds for the selected operation
        - owning authority, access scope, purpose, and current policy decision
        - origin/provenance binding for each returned output
      rule: >-
        An opaque reference alone is not a type or proof of access. Each exact
        admitted operation binds its accepted input and output artifact kinds,
        schema versions, cardinality, bounds, role, and owner authority. Unknown,
        mutable, expired, or out-of-scope references fail closed. No reference
        shape or artifact kind is inferred from a route, filename, or operation name.
      scopeStatus: OWNER_DEFINED_BINDING_REQUIREMENT; no AI Inference operation or artifact transport is admitted.

  - id: action-plane-publication
    status: master-plan-required-boundary; exact-public-effect-contract-is-downstream-and-not-a-pdp-0-meaning-gate
    direction: Media requests an authorized external publication effect through Action Plane
    sourceOwner: Media for output/version, delivery intent, and media lifecycle
    destinationOwner: Ghatana Action Plane for privileged effect authority, approval, idempotency, execution, and reconciliation
    operationAndVersion:
      value: No exact Action Plane operation/version is admitted in this artifact.
      source: docs/migration/expert-reviewed-master-plan.md#3.1-mandatory-dependency-selection-order
    authenticationAndDelegation: Current verified principal, explicit delegation, approval, and allowed destination are required from trusted owner contracts.
    classificationAndPurpose: Revalidate output classification, rights, consent, residency/egress, disclosure, and publication purpose immediately before the effect.
    expectedContext: Exact output/version/digest, destination, effect intent, approval refs, idempotency/effect key, policy decision refs, and safe correlation refs.
    timeoutCancellation: Cancellation outcome and remote dispatch boundary are set by Action Plane contract; after dispatch, uncertain effects require reconciliation.
    finality: Distinguish requested, accepted, dispatched, confirmed, rejected, partial, and unknown according to the admitted Action Plane status contract; no exact enum is invented here.
    retryReconciliation: Reconcile by stable effect identity before retry; duplicate publication is forbidden by default.
    errorMapping: Map documented Action Plane reasons; preserve unknown finality and safe next action.
    returnContinuation: Return receipt/effect status to Media delivery view and link to exact output; Media does not claim remote recall.
    acceptedArtifactReferences: Exact Media output and Action Plane effect receipt refs.
    actionSelectionRule:
      id: media.handoff.action-plane-admitted-actions
      rule: >-
        Version, branch, and other consequential publication actions are available only when the exact Action Plane public
        operation/version, request/result fields, authorization/delegation, idempotency, and finality contract is admitted.
        Do not infer an action from a similarly named Media method or a generic publication boundary; unsupported actions
        stay unavailable with an explicit reason.
      scopeStatus: OWNER_DEFINED_ACTION_REQUIREMENT; no Action Plane operation is admitted.

  - id: agent-runtime-media-action
    status: master-plan-proposed; agent-public-action-binding-not-admitted
    direction: Agent Runtime sends bounded intent/action to Media and receives job/result references
    sourceOwner: Ghatana Agent Runtime for reasoning/agent execution; Action Plane for privileged effects
    destinationOwner: Media for its public actions and media-owned state
    operationAndVersion:
      value: Exact public Media action/Agent Runtime operation is downstream channel binding and is not required to define the stable PDP-0 capability intent.
      source: docs/migration/expert-reviewed-master-plan.md#17-cross-product-recipes-and-dependency-handoffs
    authenticationAndDelegation: Explicit bounded delegation; an agent cannot self-authorize or use Media intent to widen scope.
    classificationAndPurpose: Pass only purpose-required media/intent/policy references; no unrestricted user context or secret-bearing baggage.
    expectedContext: Bounded recipe/operation, source refs, deadlines/budget, delegation and policy decision refs, correlation ref.
    timeoutCancellation: Follow both public contracts; a stopped agent is not proof the Media job was cancelled.
    finality: Agent plan completion is distinct from Media job completion and any Action Plane external effect.
    retryReconciliation: Prevent recursive budget reset; observe existing Media request before new submission.
    errorMapping: Map documented unsupported/denied/limit/unknown reasons without fabricating success.
    returnContinuation: Return Media job and artifact refs plus finality to the agent caller; require human review where policy says.
    acceptedArtifactReferences: Opaque Media job/output refs only.
    mediaActionOwnershipBoundary:
      id: media.handoff.agent-media-action-ownership
      rule: >-
        Media defines its public media actions and owns media-object, job, and
        artifact state. Action Plane owns privileged external effects, including
        authorization, approval, dispatch, idempotency, and reconciliation. Agent
        Runtime owns agent reasoning/execution. An agent request to Media is not
        itself authority for a privileged effect, and Media public actions do not
        replace Action Plane controls.
      scopeStatus: OWNER_DEFINED_OWNERSHIP_BOUNDARY; no Action Plane operation or agent binding is admitted.

  - id: yappc-product-authoring
    status: optional-master-plan-edge; no-direct-consumer-found-in-bounded-inventory
    direction: YAPPC public product/capability authoring facility to Media authoring/integration only if separately admitted
    sourceOwner: YAPPC for its product metadata/authoring contracts
    destinationOwner: Media for Media-specific product meaning and artifacts
    operationAndVersion: No current public operation/version or active consumer path is established; do not import YAPPC internals.
    adoptionRule: >-
      Integrate YAPPC authoring only when a published public authoring capability
      is needed by Media and its exact contract has been reviewed by the owning
      parties. Otherwise Media retains its own authoring behavior. A product or
      capability registry entry does not establish a callable contract, and
      private YAPPC packages or implementation details are not an integration
      surface.
    authenticationAndDelegation: Pending public contract and owner approval.
    classificationAndPurpose: Pending product authoring contract; Media content/asset rights remain Media-owned.
    expectedContext: Minimal public product/capability references if adopted; no implementation source references.
    timeoutCancellation: Pending operation; not a runtime dependency today.
    finality: No authoring or runtime support claim.
    retryReconciliation: Pending public contract; no Media state is written by this proposed edge.
    errorMapping: Pending owner contract.
    returnContinuation: Continue in Media's own authoring experience unless the public integration is later accepted.
    acceptedArtifactReferences: None currently admitted.
    implementationImportProhibition:
      id: media.handoff.yappc-implementation-import-prohibition
      rule: Media and generic Tools consumers do not import YAPPC private packages, internal schemas, or implementation modules; only a deliberately selected exact public authoring contract can cross the boundary.
      scopeStatus: OWNER_DEFINED_PROHIBITION; no YAPPC public operation or adoption is claimed.

  - id: kernel-product-lifecycle
    status: optional-master-plan-edge; no-direct-consumer-found-in-bounded-inventory
    direction: Media to a published Kernel lifecycle/shell/provider contract only when deliberately adopted
    sourceOwner: Media for product meaning and media jobs
    destinationOwner: Ghatana Kernel for generic lifecycle/shell/provider contracts
    operationAndVersion: No adopted Kernel operation/version is established; repository relocation does not imply Kernel-native materialization.
    kernelAdoptionRule: >-
      Adopt a Kernel lifecycle, shell, provider, or schema contract only when
      Media deliberately requires that exact published contract and its owner
      identity, version, and public surface have been reviewed. Media must not
      recreate Kernel-owned schemas, infer Kernel-native materialization from a
      dependency coordinate or repository relocation, or treat a host reference
      as an adopted public operation. A dependency alone is not adoption evidence.
    authenticationAndDelegation: Pending a selected public contract and identity binding.
    classificationAndPurpose: Pass minimal authorized lifecycle references; never transfer Media database authority.
    mediaStateAuthorityRule: >-
      Kernel lifecycle, shell, or provider contracts may carry an authorized opaque
      Media reference, but must not mutate or become the writer for Media artifact
      bytes, upload sessions, processing jobs, or streams. No Media database
      credential or direct database access crosses this handoff. Media remains the
      authority for those records, byte/object lifecycle, and product finality;
      only the deliberately selected public contract and scoped opaque references
      may cross the boundary.
    expectedContext: Published capability/lifecycle refs only; no private Kernel or Media implementation objects.
    timeoutCancellation: Pending selected contract.
    finality: Media remains authority for Media artifact/job/stream semantics.
    retryReconciliation: Pending selected contract; must preserve exactly-one Media writer and authority epoch.
    errorMapping: Pending selected contract.
    returnContinuation: Return to Media project/job state through explicit public references.
    acceptedArtifactReferences: None admitted by migration inventory.
    batchAndProofBoundary:
      id: media.handoff.kernel-batch-and-proof-boundary
      rule: >-
        Media authors product meaning in the current owner records. Media batch operations compose over the existing Media
        job and operation contracts; they do not establish a new generic workflow engine or transfer Media state authority
        to Kernel. Workbench, simulation, fixtures, or migration artifacts are not production proof, and migration alone
        does not activate a feature or establish runtime availability. Preserve the exact admitted Kernel public contract
        and owner proof boundary if selected.
      scopeStatus: OWNER_DEFINED_BOUNDARY; no Kernel materialization, runtime proof, or feature activation is claimed.
