# Owner-authored reuse and architecture rules extracted from the migration
# review. A definition here is not package admission, legal approval,
# qualification, or authorization to build/deploy runtime adapters.
mediaArchitectureRules:
  status: MEDIA_OWNER_AUTHORED_DEFINITION;
    implementation-and-independent-review-pending
  licenses:
    preferredWhenSuitable: [ MIT, Apache-2.0, BSD, ISC, Zlib ]
    selectionCondition: technically-suitable-and-after-Ghatana-reuse-gap-is-recorded
    categoriesRequiringSeparateReview:
      - weak-copyleft
      - strong-copyleft
      - network-copyleft
      - proprietary-services
      - noncommercial-or-research-only-model-weights
      - unclear-license-terms
    bundleSafetyRule: component-license-labels-and-selection-do-not-establish-that-an-entire-bundle-or-transitive-dependency-closure-is-cleared-for-distribution
    legalReviewStatus: not-performed; no-legal-conclusion-or-distribution-clearance
  reusePreferences:
    - prefer-current-Ghatana-image-and-media-integrations
    - prefer-Ghatana-Shared-public-primitives-for-generic-interface-mechanics
    - prefer-reviewed-TutorPutor-contracts-for-rendering-and-animation-integration
  externalSelectionRequires: concrete-Ghatana-reuse-gap-license-security-and-profile-qualification-admission
  engineAdapterSequencing:
    rule: do-not-simultaneously-build-parallel-engine-adapters-before-the-first-end-to-end-experience
    engines: [ Godot, Bevy, Filament, Jolt, PhysX, MuJoCo, Taichi ]
    purpose: avoid-premature-parallel-engine-adapter-work-before-a-first-end-to-end-experience
    runtimeEffect: no-engine-is-admitted-or-qualified-by-this-rule
  qualifiedStackRule: choose-the-smallest-stack-that-meets-the-qualified-requirements-of-the-next-admitted-recipe
  replaceablePortsRule:
    requirement: keep-implementation-ports-replaceable-at-the-accepted-contract-boundary
    prohibition: do-not-create-dozens-of-unused-abstractions-or-adapters-before-an-admitted-end-to-end-need
    canonicalSemantics: remain-in-Media-owned-contracts;
      external-engine-types-remain-adapter-private
  componentLicenseBoundary:
    id: media.reuse.component-license-boundary
    authority: user-delegated-Media-semantic-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
    rule: The wrapper or adapter license is independent from every bundled,
      downloaded or transitively used model weight, checkpoint, codec, encoder,
      decoder, plugin, font, dataset, asset and native library.
    requiredEvidence:
      - exact component and immutable version or content digest
      - authoritative source and full distribution/build SBOM
      - separate license and use-term disposition for code and each model/asset
        weight
      - commercial, hosted-service, redistribution, modification, attribution,
        patent, dataset, likeness and output-use rights as applicable
      - security provenance and integrity review
      - approved profile and execution/deployment scope
    unknownDisposition: DENY_SELECTION_OR_ACQUISITION; NOASSERTION, package-level
      license, owner label or successful test does not establish component or
      weight clearance.
    noAutomaticAcquisition: Package installation, provider selection and fallback
      never silently download weights or other media assets.
    scopeStatus: OWNER_DEFINED_POLICY_ONLY; legal/security review, exact artifact
      SBOMs and runtime admission remain pending
    processIsolationDoesNotWaiveLicenseRule:
      id: media.reuse.process-isolation-does-not-waive-component-terms.v1
      rule: Container, process, or adapter isolation narrows execution and authority
        boundaries but does not waive license, patent, attribution,
        redistribution, dataset, model-weight, codec, native-library, plugin,
        font, or asset terms for any included component or transitive
        dependency.
      requiredEvidence:
        - exact component and immutable version or content digest
        - authoritative source plus complete direct and transitive
          build/distribution inventory
        - separate applicable license, patent, attribution, redistribution, and
          use-term review for each included component
        - approved profile and execution/deployment scope
      unknownDisposition: DENY_SELECTION_OR_DISTRIBUTION; isolation is not license
        clearance and package-level NOASSERTION remains unresolved.
      scopeStatus: OWNER_DEFINED_POLICY_ONLY; exact artifacts and legal review remain
        pending
  enabledCodecBuildEvidenceRule:
    id: media.reuse.enabled-codec-build-evidence.v1
    authority: user-delegated-Media-semantic-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
    rule: >-
      For any executable that enables external codecs, record the exact executable
      binary digest, upstream version/source revision, build recipe and configuration
      flags, enabled codec/demuxer/muxer/protocol set, and the complete direct and
      transitive linked-component inventory. The observed runtime capability set must
      match that immutable build record; a package name, nominal FFmpeg version, or
      generic SBOM without enabled-codec configuration is insufficient. Missing or
      mismatched evidence leaves the binary/build identity and enabled codecs UNKNOWN
      and blocks selection or distribution. This evidence does not itself establish
      license clearance, codec patent rights, profile compatibility, security review,
      or runtime qualification.
    requiredEvidence:
      - immutable-executable-digest-and-upstream-source-version
      - exact-build-recipe-and-effective-configuration-flags
      - enabled-external-codec-demuxer-muxer-and-protocol-set
      - complete-direct-and-transitive-linked-component-inventory
      - observed-runtime-capabilities-matched-to-the-recorded-build
    failure: UNKNOWN_BUILD_OR_ENABLED_CODECS; DENY_SELECTION_OR_DISTRIBUTION
    scopeStatus: OWNER_DEFINED_EVIDENCE_REQUIREMENT_ONLY; no build is admitted or qualified
  historicalCandidateInventoryDisposition:
    id: media.reuse.historical-appendix-b-candidate-inventory.v1
    authority: user-delegated-Media-semantic-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
    historicalSource:
      document: docs/migration/expert-reviewed-master-plan.md
      section: Appendix B. External candidate inventory — only after the Ghatana reuse gate
      statement: >-
        Preserve the complete historical Appendix B candidate table, including each
        named candidate's intended role and evaluation constraint, as historical
        candidate discussion rather than a current procurement or integration list.
    currentRegisterRelationship: >-
      selectionRegister is the current owner-authored decision subset, not a claim
      that every historical candidate is currently evaluated. An item omitted from
      selectionRegister remains historical source material; omission alone is not
      acceptance, rejection, evaluation, or a replacement decision. A historical
      candidate row never mandates integration or waives exact version, license,
      security, profile, reuse, and qualification gates.
    acceptanceEffect: none
    scopeStatus: HISTORICAL_SOURCE_PRESERVATION_ONLY; no candidate is admitted
  externalStackSelectionRule:
    id: media.reuse.external-stack-selection-rule
    authority: user-delegated-Media-semantic-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
    rule: A candidate-library or engine selection is not an integration mandate.
      Integrate only when an exact admitted Media capability/profile has a
      demonstrated Ghatana reuse gap and the candidate closes that gap under its
      public contract.
    reuseBeforeSelection: >-
      Before selecting a new streaming stack, inspect the exact existing
      Ghatana-owned streaming modules and their public contracts. Reuse an
      existing module when it satisfies the requirements of the exact admitted
      Media capability/profile. If no existing module fits, record the concrete
      profile requirement it cannot meet and the evidence for that reuse gap
      before evaluating a new candidate. An inventory mention or package name
      alone does not establish that a module exists, is suitable, or is admitted.
    scope: Do not integrate every listed package or engine; select the smallest
      stack that meets the requirements of the next admitted recipe.
    multiplicity: One qualified implementation is selected for an exact
      capability/profile. An alternative requires a separate versioned profile
      and qualification; do not keep parallel adapters or silently fall back.
    additionalImplementationRule:
      id: media.reuse.additional-implementation-justification.v1
      rule: >-
        A second implementation for a capability family is considered only when
        a documented requirement demonstrates a material gap in quality,
        processing locality, hardware support, interoperability, or resilience
        that the selected qualified implementation cannot satisfy. Record the
        exact capability/profile, unmet requirement, evidence, and why a
        separately versioned profile is needed. A proposed justification does
        not qualify or admit the alternative implementation.
      requiredFacts:
        - exact capability and versioned profile identity
        - selected implementation identity and limitation
        - demonstrated unmet quality, locality, hardware, interoperability, or resilience requirement
        - evidence and consumer impact
        - separate profile and qualification decision for any alternative
      scopeStatus: OWNER_DEFINED_SELECTION_RULE; qualification and runtime NOT_ADMITTED
    sourceRefs:
      - .product-experience/pdp-0-product-truth/reuse-decisions.yaml#mediaArchitectureRules.qualifiedStackRule
      - .product-experience/pdp-0-product-truth/reuse-decisions.yaml#mediaArchitectureRules.externalSelectionRequires
      - .product-experience/pdp-0-product-truth/qualification-policy.yaml
    scopeStatus: OWNER_DEFINED_SELECTION_POLICY; no integration, candidate
      qualification, or runtime admission implied
  dependencyUpdatePolicy:
    id: media.reuse.dependency-update-policy
    authority: user-delegated-Media-semantic-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
    pinning:
      rule: Every runtime, build tool, transitive dependency, model, codec, plugin,
        and native component used by a candidate Media profile is pinned to an
        immutable version and integrity digest in the reproducible
        build/deployment manifest.
      floatingVersions: DENY_FOR_RELEASE_CANDIDATES
      lockfileOnly: Insufficient without source, digest, license, provenance, and
        resolved transitive closure.
    validationBeforePromotion:
      required:
        - reproducible clean-resolution/build against the committed lock and
          immutable artifact digests
        - API and ABI compatibility checks against the exact supported Media
          profile
        - security advisory, provenance, integrity and transitive dependency
          review
        - license and component-use-term review per
          media.reuse.component-license-boundary
        - relevant definition, regression, and profile-specific conformance tests
        - reviewed change record identifying affected capability/profile and
          rollback boundary
      failure: Reject promotion on missing pin/evidence, digest drift, compatibility
        regression, unresolved critical security finding, disallowed terms, or
        failed required checks; do not silently float, substitute, or roll
        forward.
      promotion: Only the existing authorized release process may promote after
        required evidence and independent review; this policy does not admit or
        qualify a dependency or runtime.
    scopeStatus: OWNER_DEFINED_UPDATE_GATE; build pipeline enforcement,
      security/legal review, and independent acceptance remain pending
  genericMechanicsBoundary:
    id: media.reuse.generic-mechanics-boundary
    authority: user-delegated-Media-semantic-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
    sharedWorkflow:
      rule: Reuse Ghatana Shared workflow, outbox, idempotency, CAS, retry-scheduling,
        and reconciliation mechanics behind Media-owned adapters when the exact
        public contract satisfies the Media operation guard and finality
        requirements.
      boundary: Media retains authoritative domain state, policy, rights/consent,
        persistence schema, attempt/effect classification, and product finality.
        Shared mechanics cannot assign Media state semantics or bypass Media
        policy.
      rejection: Do not fork generic workflow/outbox mechanics in Media when the
        Shared contract is suitable; do not use an unsuitable Shared contract
        merely to avoid a Media adapter.
    tools:
      rule: Tools authoring or development workflows do not constitute production
        Media execution, durable provider dispatch, or product finality.
      admission: Any production invocation needs an exact admitted Media operation,
        trusted delegation, current policy, and authoritative receipt.
    gpuSchedulerBoundary:
      id: media.reuse.shared-tools-are-not-gpu-scheduler.v1
      rule: Shared workflow/outbox mechanics and Tools authoring or development
        workflows do not by themselves establish a complete GPU job scheduler.
        Media job execution still requires a separately defined Media-owned
        dispatch, resource admission, durable attempt, cancellation, finality,
        and reconciliation contract bound to the exact capability and profile.
      nonClaims: [no-scheduler-implementation, no-GPU-capacity-admission, no-runtime-dispatch]
    scopeStatus: OWNER_DEFINED_REUSE_BOUNDARY; Shared/Tools contract qualification
      and deployment acceptance remain pending
  dependencyBlockScopeRule:
    id: media.reuse.dependency-block-scope-rule
    authority: user-delegated-Media-semantic-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
    rule: Scope a dependency blocker to the exact affected capability, versioned
      profile, channel, and deployment boundary. A defined capability is not
      held indefinitely by unrelated ecosystem hardening. Record the blocked
      dependency and criterion, select a separately qualified permitted
      alternative where one exists, or isolate/disable the affected feature
      while continuing independent work.
    nonWaiver: Narrowing a blocker never waives a required security, license,
      rights, consent, policy, conformance, independent review, or admission
      gate for the affected capability.
    scopeStatus: OWNER_DEFINED_DEPENDENCY_SCOPE_RULE; no dependency or feature
      admission implied
ownerDefinedPackagePublicationEvidenceRule:
  id: media.reuse.package-publication-evidence.v1
  authority: user-delegated-Media-semantic-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
  rule: >-
    A package declaration, source-workspace path, locally generated archive, or
    successful local build does not establish public publication, stable API,
    consumer isolation, license clearance, or functional completeness. Before
    describing a dependency as a reusable public package, identify the exact
    publisher and immutable released artifact/version; resolve its published
    export map and supported API surface; verify transitive dependency closure,
    compatibility range, license and redistribution terms; and exercise a
    representative isolated consumer against that released artifact. Any
    missing item remains explicitly unverified and cannot be represented as a
    completed reuse integration.
  requiredEvidence:
    - exact publisher and immutable released package artifact/version
    - published exports and supported API stability/version policy
    - isolated consumer import and representative contract tests
    - direct and transitive dependency closure and compatibility evidence
    - component-specific license and redistribution review
    - functional coverage of the exact intended Media use
  negativeCases:
    - treat a monorepo package declaration or local build as public publication
    - infer API stability from source visibility or package naming
    - infer consumer isolation from a successful in-repository build
    - infer license clearance from a wrapper or workspace license
    - treat a partial export or smoke test as functional completeness
  scopeStatus: OWNER_DEFINED_REUSE_EVIDENCE_REQUIREMENT; publication, legal review,
    independent acceptance, and runtime admission remain separate
ownerDefinedDistributionSourceOfferRule:
  id: media.reuse.distribution-source-offer-material.v1
  authority: user-delegated-Media-semantic-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
  rule: >-
    For a distribution mode that requires source availability or an offer,
    preserve the exact corresponding source revision and build recipe together
    with notices, modification records, scripts and materials needed to rebuild
    or relink the distributed work, including applicable codec/plugin/native
    component materials. State the offer's scope, recipient class, delivery
    method, duration, and fulfillment owner. A generic SBOM, attribution notice,
    license label, or source-repository URL is not by itself a compliant source
    offer. If the applicable license or distribution mode is unknown, block
    distribution pending review; this rule does not make a legal determination.
  requiredEvidence:
    - exact distributed binary and immutable source/build revision
    - applicable license and distribution mode for each included component
    - complete source, build, relink, notice, and modification materials required by that mode
    - source-offer scope, recipient, delivery, duration, and fulfillment owner
    - separate patent, codec, model, and asset rights review where applicable
  negativeCases:
    - treat an SBOM or attribution list as the complete corresponding source offer
    - treat a generic repository URL as sufficient without exact revision and build materials
    - distribute while the applicable offer duty or fulfillment owner is unknown
  scopeStatus: OWNER_DEFINED_DISTRIBUTION_EVIDENCE_REQUIREMENT; no legal clearance,
    publication, or runtime admission implied
ownerDefinedTutorPutorReuseReviewRule:
  id: media.reuse.tutorputor-concrete-path-review.v1
  authority: user-delegated-Media-semantic-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
  rule: >-
    Before adding a new simulation, animation, renderer, export, or accessibility
    mechanism, inspect the exact existing TutorPutor collaboration paths and
    their owner-published public contracts. Compare each intended Media use to
    the concrete boundary and record the exact reuse gap, ownership, compatibility
    evidence, and required adapter. Preserve TutorPutor's learning purpose,
    pedagogy, scientific/domain meaning, units, measurements, learner evidence,
    and assessment as TutorPutor-owned truth. Extract or consume only deliberately
    product-neutral mechanics behind a reviewed public contract; a broad package
    import, repository presence, or existing renderer is not itself a reuse
    decision, public API, compatibility proof, or admission.
  requiredEvidence:
    - exact TutorPutor consumer/provider path and public contract/version
    - exact intended Media capability/profile and comparison against that contract
    - demonstrated reuse gap or source-backed reason no reuse applies
    - owner and compatibility boundaries, conversion loss, and adapter requirement
    - separate evidence for any consumer parity or scientific validation claim
  negativeCases:
    - import a broad TutorPutor product barrel to avoid an exact contract review
    - copy TutorPutor Experience IR, Model IR, Scene IR, pedagogy, or assessment as Media authority
    - infer public API or compatibility from repository presence
    - treat a candidate assessment or proposed adapter as completed reuse or admission
  scopeStatus: OWNER_DEFINED_REUSE_REVIEW_REQUIREMENT; external-owner acceptance,
    compatibility, scientific validation, and runtime admission remain pending
