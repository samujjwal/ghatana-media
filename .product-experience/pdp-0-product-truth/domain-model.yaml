artifactVersion: media.phase-0.domain-model.v1
phaseTask: P0-004
status:
  maturity: proposal
  acceptance: not-submitted
  ownerReview: pending
  implementation: not-authorized-by-this-artifact
  statement: >-
    This file is a product-domain inventory and proposed contract boundary, not
    an accepted wire schema, generated API, or implementation claim.

purpose: >-
  Define Media record responsibilities from master-plan sections 7 and 7.2;
  separate immutable specifications, compiled plans, mutable execution state,
  and domain-owned physical/model state from visual presentation state.

authorityBoundary:
  productTruth: >-
    PDP-0 owns product purpose, outcomes, policy boundaries, and the high-level
    statement that Media owns media-specific semantics.
  canonicalDomainAndData: .product-experience/pdp-1-domain-data/
  handoffStatus: pending-PDP-1-reconciliation
  rule: >-
    The catalog, lifecycle rules, and observed-contract notes in this file are
    transitional source material, not an accepted canonical domain/data
    authority. Preserve their unique source observations and proposed meaning
    until corresponding PDP-1 records are reviewed; do not infer that the
    handoff is complete from PDP-1 references back to this file.
  unresolved: >-
    PDP-1 projections still cite this file and remain pending owner review.
    Authority references and any unique domain semantics require reconciliation
    in a separately authorized wave; this wave does not edit or claim acceptance
    of PDP-1 records.

