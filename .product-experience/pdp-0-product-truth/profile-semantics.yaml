schemaVersion: media.profile-semantics.v1
productId: media
phaseTask: P0-007
status: proposed-for-specialist-review
authority: prospective-Phase-0-semantics; not runtime binding or qualification evidence
sourceRefs:
  - master-plan:section-8
  - master-plan:section-9.5
  - master-plan:task-P0-007
  - master-plan:section-15
  - constitution:MEDIA-CONST-008
  - constitution:MEDIA-CONST-017
  - constitution:MEDIA-CONST-027
  - constitution:MEDIA-CONST-028
scopeNote: >-
  PDP-0 semantics for orthogonal profile axes, fallback authorization, and
  unknown/unbound denial are defined here. This file does not select, qualify,
  or declare available any engine, model, codec, provider, runtime, or
  deployment. The exact P0 capability/profile/schema envelope is owner-defined
  by the capability-bounds-envelope rule below. Operation bindings and runtime
  qualification remain separate downstream work; their absence does not weaken
  this fail-closed P0 admission rule.
semanticCompletion:
  phase: PDP-0
  status: DEV_COMPLETE_FOR_PROFILE_MEANING
  completed: [orthogonal-profile-axes, requested-effective-profile-record, fallback-default-deny, unknown-or-unbound-denial, bounded-invocation-admission, p0-capability-bounds-envelope, preservation-qualification-dimension-mapping]
  laterBindingWork: [exact-capability-operation-profile-bindings, owner-approved-limits, per-capability-profile-qualification-evidence, runtime-qualification-and-availability]
  ownerPendingSemantics: []
profileAxes:
  - id: PROFILE-AXIS-QUALITY-INTENT
    name: quality-intent
    values:
      - id: QUALITY-INTENT-PREVIEW
        value: preview
        meaning: A declared lower-latency or exploratory target; it is not permission to violate other requested constraints.
      - id: QUALITY-INTENT-BALANCED
        value: balanced
        meaning: A declared product target whose exact criteria require an accepted capability/profile binding.
      - id: QUALITY-INTENT-HIGH-QUALITY
        value: high-quality
        meaning: A declared higher quality target whose exact criteria require an accepted capability/profile binding.
      - id: QUALITY-INTENT-MASTER
        value: master
        meaning: A declared mastering target; it cannot be silently changed to preview or another lower target.
    axisRule: A quality-intent label is not a numeric threshold or evidence that an implementation can meet it.
  - id: PROFILE-AXIS-RESOURCE
    name: resource-profile
    values:
      - id: RESOURCE-PROFILE-STANDARD
        value: standard
      - id: RESOURCE-PROFILE-LOW
        value: low-resource
    aliases:
      - alias: low_vram
        resolvesTo: RESOURCE-PROFILE-LOW
        kind: legacy-name-only
      - alias: low-vram
        resolvesTo: RESOURCE-PROFILE-LOW
        kind: legacy-name-only
    axisRule: Resource savings alone do not authorize lower fidelity, quality, resolution, duration, or frame rate.
  - id: PROFILE-AXIS-EXECUTION-LOCATION
    name: execution-location
    values:
      - id: EXECUTION-LOCATION-LOCAL
        value: local
      - id: EXECUTION-LOCATION-REMOTE
        value: remote
      - id: EXECUTION-LOCATION-HYBRID
        value: hybrid
    axisRule: >-
      Eligibility is determined by the complete resolved plan and current
      policy. Local-only work must not fall back to remote/cloud execution;
      a local component alone does not make a hybrid plan local.
  - id: PROFILE-AXIS-PRESERVATION
    name: preservation
    qualificationPolicyDimension: preservation-policy
    qualificationPolicyMappingState: DEFINED; profile preservation maps to qualification-policy dimension preservation-policy; per-capability qualification remains NOT_EVALUATED until scoped evidence is supplied.
    qualificationPolicyMappingRef: .product-experience/pdp-0-product-truth/qualification-policy.yaml#/profileDimensions
    values:
      - id: PRESERVATION-MODE-PRESERVE
        value: preserve
        meaning: Preserve source and accepted revisions; do not introduce invented semantic detail as if it were recovered fact.
      - id: PRESERVATION-MODE-ENHANCE
        value: enhance
        meaning: Permit only bounded, authorized perceptual reconstruction under declared preservation and quality constraints.
      - id: PRESERVATION-MODE-CREATIVE
        value: creative
        meaning: Permit admitted generative edits within current rights, privacy, safety, and effect authority.
    axisRule: >-
      Preservation is independent of quality intent and resource profile. A
      quality or resource change never changes preservation permission.
  - id: PROFILE-AXIS-DELIVERY
    name: delivery-profile
    values:
      - id: DELIVERY-PROFILE-WEB
        value: web
      - id: DELIVERY-PROFILE-SOCIAL
        value: social
      - id: DELIVERY-PROFILE-PODCAST
        value: podcast
      - id: DELIVERY-PROFILE-BROADCAST
        value: broadcast
      - id: DELIVERY-PROFILE-CINEMATIC
        value: cinematic
      - id: DELIVERY-PROFILE-ARCHIVAL
        value: archival
      - id: DELIVERY-PROFILE-INTERACTIVE
        value: interactive
      - id: DELIVERY-PROFILE-NAMED
        value: named-explicit-profile
    axisRule: >-
      A delivery profile must bind exact codec/container, color/audio/caption,
      target, and compatibility constraints before execution. These names do
      not imply format support or qualification.
  - id: PROFILE-AXIS-REPRODUCIBILITY
    name: reproducibility-class
    values:
      - id: REPRODUCIBILITY-EXACT-ENVIRONMENT
        value: EXACT_ENVIRONMENT
      - id: REPRODUCIBILITY-TOLERANCE-BOUND
        value: TOLERANCE_BOUND
      - id: REPRODUCIBILITY-STATISTICAL
        value: STATISTICAL
      - id: REPRODUCIBILITY-REPLAY-UNAVAILABLE
        value: REPLAY_UNAVAILABLE
    meanings:
      EXACT_ENVIRONMENT: Identical declared output representation only within an evidence-backed engine/model/runtime/hardware/configuration/assets/seed envelope.
      TOLERANCE_BOUND: Named numeric, geometric, perceptual, or timing measurements satisfy declared tolerances over a stated scope.
      STATISTICAL: Repeated outputs satisfy a named distribution/quality protocol; a seed does not promise identical output.
      REPLAY_UNAVAILABLE: Preserve inputs, outputs, and execution provenance; do not offer unsupported reproduction.
    axisRule: Render determinism, solver determinism, and encoded-byte determinism are separate claims.
orthogonalityRules:
  - id: PROFILE-RULE-INDEPENDENT-AXES
    rule: >-
      Requested profiles represent independent dimensions. A value on one axis
      does not imply or authorize a value on another axis; every effective
      change is recorded against its own requested axis.
  - id: PROFILE-RULE-QUALITY-NOT-FIDELITY
    rule: A higher perceptual-quality target does not establish or authorize a change in domain/scientific fidelity.
  - id: PROFILE-RULE-RESOURCE-NOT-QUALITY
    rule: A resource profile does not itself authorize quality, resolution, duration, frame-rate, language, or fidelity degradation.
  - id: PROFILE-RULE-LOCATION-NOT-PRIVACY
    rule: Execution location is an independent declaration; deployment labels alone do not establish the processing policy of a complete plan.
  - id: PROFILE-RULE-DELIVERY-NOT-RIGHTS
    rule: A delivery target does not grant rights, consent, publication approval, or compatibility.
  - id: PROFILE-RULE-PRESERVATION-NOT-REPRODUCIBILITY
    rule: Preservation mode does not establish deterministic or replayable execution.
  - id: PROFILE-RULE-CINEMATIC-ALIAS
    rule: >-
      “Cinematic” may be a presentation/template alias resolving to an explicit
      quality-intent plus delivery-profile combination. It is not a new
      independent quality or execution policy.
  - id: PROFILE-RULE-TEST-ONLY
    rule: deterministic-test is a fixture/test binding label only and never a production provider or runtime profile.
profileResolutionRecord:
  id: PROFILE-RESOLUTION-RECORD
  requiredFields:
    - requestedAxes
    - effectiveAxes
    - unchangedAxes
    - changedAxes
    - fallbackPermissionRef
    - reasonForEachChange
    - capabilityBindingState
    - policyAndRightsDecisionRefs
    - qualificationScopeRef
    - budgetEstimateAndCeiling
    - confirmationOrApprovalOutcome
  capabilityBindingState: The P0 capabilityIntentId and family profile/schema envelope resolve through capabilityBoundsEnvelope; an executable implementation/operation binding remains unestablished and blocks admission.
boundedInvocationAdmission:
  id: media.profile.bounded-invocation-admission
  authority: PDP-0 product-level admission semantics; this rule does not establish an implementation, numeric limit, or runtime enforcement mechanism.
  requiredRecord:
    - capabilityLeafRef
    - requestedProfileRefAndVersion
    - effectiveProfileRefAndVersion
    - resourceDimensionDecisions
    - admissionDecision
    - decisionAuthorityRef
  resourceDimensions: [cpu, ram, vram, gpu-time, storage, network, process-count, time, retry-count, cost]
  resourceDimensionUnits:
    cpu: CPU-milliseconds per job
    ram: bytes of system memory per job
    vram: bytes of video memory per job
    gpu-time: GPU-milliseconds per job
    storage: bytes per job
    network: bytes transferred per job
    process-count: process count per job
    time: wall-milliseconds per job
    retry-count: retry count per job
    cost: currency minor units per job
  additionalResourceDimensionSources:
    vram: .product-experience/pdp-0-product-truth/qualification-policy.yaml#qualificationDimensions
    network: .product-experience/pdp-0-product-truth/qualification-policy.yaml#securityAndRightsBaseline
    scope: VRAM is separately named by the qualification policy's resource dimension list; network transfer is separately bounded for network imports by the policy's destination, redirect, size, and time rule. These dimensions add scoped accounting and do not relax or replace NFR-COST-001 bounds.
  resourceDimensionDecisionFields:
    - dimension
    - applicability
    - applicabilityReason
    - bound
    - unit
    - authorityRef
    - sourceRef
    - enforcementBoundary
  resourceEvidenceStates:
    bound: [DEFINED_FINITE, NOT_EVALUATED]
    unit: [DEFINED, NOT_EVALUATED]
    authority: [DEFINED, NOT_EVALUATED]
    source: [DEFINED, NOT_EVALUATED]
    enforcementBoundary: [DEFINED, NOT_EVALUATED]
    note: NOT_EVALUATED records an unresolved fact; it is not an empty, zero, unlimited, or inapplicable value.
  applicabilityStates:
    - APPLICABLE
    - INAPPLICABLE
    - UNKNOWN
  rules:
    - Every invocation declares a requested profile and its effective profile; an unbound profile is not an available profile.
    - Every resource dimension is classified independently for the exact capability leaf, profile, and invocation context.
    - APPLICABLE requires a finite bound, an explicit unit, an accountable authority reference, the source that establishes the bound, and the boundary that must enforce it before dispatch and throughout the bounded work.
    - INAPPLICABLE requires an explicit reason and evidence source; it cannot be used to hide a missing, unknown, or unevaluated bound.
    - UNKNOWN applicability, or an APPLICABLE dimension with a NOT_EVALUATED or missing finite bound, unit, authority, source, or enforcement boundary, means NOT_ADMITTED. The product must block before dispatch and report an explicit denial/blocked outcome; it must not interpret missing data as zero, unlimited, or implicitly available.
    - An explicit fallback may be admitted only when policy authorizes that exact change and the fallback invocation independently satisfies this contract. Fallback does not relax an existing bound or requested quality, fidelity, locality, rights, or preservation constraint.
  decisionCases:
    - id: bounded-resource-all-applicable
      given: Every applicable dimension has a finite bound, unit, authority, source, and pre-dispatch enforcement boundary; every inapplicable dimension has a reason and evidence source.
      then: Resource admission may proceed to the remaining capability, policy, rights, qualification, and runtime-availability gates.
    - id: bounded-resource-inapplicable-with-evidence
      given: A dimension is INAPPLICABLE with an explicit reason and evidence source.
      then: That dimension does not require a bound, and its disposition does not waive any other applicable dimension.
    - id: bounded-resource-unknown-applicability
      given: Any dimension has UNKNOWN applicability.
      then: NOT_ADMITTED; block before dispatch and return an explicit denial or blocked outcome.
    - id: bounded-resource-missing-bound-or-provenance
      given: Any APPLICABLE dimension lacks a finite bound, unit, authority, source, or enforcement boundary.
      then: NOT_ADMITTED; block before dispatch and return an explicit denial or blocked outcome.
    - id: bounded-resource-fallback
      given: A policy-authorized fallback changes the profile or resource plan.
      then: Re-evaluate every resource dimension under the fallback's exact profile and context before dispatch; no original bound is inherited unless its authority explicitly covers the fallback.
  nonClaims:
    - no numeric resource limits are selected here
    - no resource dimension is declared inapplicable for any capability leaf here
    - no runtime support, enforcement implementation, or availability is claimed
  scopeStatus: DEFINITION_ONLY; the exact per-leaf P0 identity/profile/schema envelope is owner-defined below, while per-invocation resource applicability/bounds/evidence and enforcement remain UNKNOWN or NOT_EVALUATED and are not runtime admission.
capabilityBoundsEnvelope:
  id: media.profile.p0-capability-bounds-envelope.v1
  authority: delegated-Media-product-semantic-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
  population:
    sourceRef: .product-experience/pdp-0-product-truth/capabilities.yaml#capabilities
    count: 462
    identity: Each capability record id is its stable capabilityIntentId.
  boundsRefResolution:
    identityField: capabilities[].ownerDefinition.boundsRef
    canonicalIdentityRule: For capabilityIntentId beginning with media., replace its remaining dots with hyphens and prefix media.capability-bounds.media-; the resulting identity must resolve to exactly that one capability record.
    oneToOne: Every one of 462 boundsRef identities is unique, maps to one capabilityIntentId, and is not inherited from a family or operation.
    profileBinding: The envelope profile is exactly that record's ownerDefinition.familyProfileRef.
  exactEnvelopeFields:
    - capabilities[].id
    - capabilities[].ownerDefinition.familyProfileRef
    - capabilities[].ownerDefinition.parameterSchema
    - capabilities[].ownerDefinition.typedInputSlots
    - capabilities[].inputArtifactTypes
    - capabilities[].outputArtifactTypes
    - capabilities[].ownerDefinition.successOutputs
  inputShapeRule: Each leaf's ownerDefinition.typedInputSlots is its closed product input shape. A slot's sourceType, cardinality, required flag, alternatives, and condition are normative together; reuse an existing shared shape only when all populated identity fields match, and record a leaf-specific exception in that leaf's owner definition. No family-level optionality, field, default, or cardinality is inherited. Parameter properties and their requiredness are governed only by that same leaf's closed parameterSchema.
  inputShapeFamilyReconciliation:
    sourceRef: capabilities[].ownerDefinition.typedInputSlots
    currentPopulation:
      leafCount: 462
      slotCount: 930
      distinctSharedShapeCount: 129
    sharedShapeIdentityFields: [sourceType, cardinality, required, alternatives, condition]
    rule: These are a computed reuse relation over the existing leaf-owned slots, not a second input catalog. Reuse requires exact equality of all populated identity fields; slotId remains local to its leaf. Missing or changed shape fields are explicit exceptions and do not inherit family values.
  parameterRule: The closed ownerDefinition.parameterSchema, including its required fields, property constraints, and emptyDisposition, is the exact product parameter shape. A property listed in required is mandatory; other declared properties are optional. Defaults exist only when explicitly present in that exact schema; no implicit, family, or operation default is inferred. No operation wire schema, family default, inferred field, or unsupported parameter value is added by this envelope.
  resourceDimensionRule:
    dimensions: [cpu, ram, vram, gpu-time, storage, network, process-count, time, retry-count, cost]
    currentEvidencePopulation:
      capabilityCount: 462
      dimensionCountPerCapability: 10
      applicability: UNKNOWN
      bound: NOT_EVALUATED
      unit: DEFINED
      unitSourceRef: .product-experience/pdp-0-product-truth/nonfunctional-requirements.yaml#ownerMeasurementDefinitions/records/@id=media.nfr-measurement.NFR-COST-001.v1
      authority: NOT_EVALUATED
      source: NOT_EVALUATED
      enforcementBoundary: NOT_EVALUATED
      meaning: No numeric resource ceiling or dimension inapplicability has been owner-established for a leaf/profile/invocation tuple in this P0 source cut. The normative units above are defined by NFR-COST-001; exact bound, authority, applicability, and enforcement evidence remain NOT_EVALUATED.
    unappliedEvidenceState: UNKNOWN applicability and NOT_EVALUATED bound, authority, bound source, or enforcement evidence are explicit until a scoped record supplies them; normative units are defined by NFR-COST-001.
    admission: UNKNOWN applicability or any missing/unknown required resource fact means NOT_ADMITTED and MUST block before dispatch with an explicit denial/blocked outcome.
    numericLimits: No numeric resource limit is invented or implied by the boundsRef identity.
  negativeCases:
    - A missing, duplicate, stale, or foreign boundsRef does not resolve to an envelope.
    - A boundsRef resolves to a different leaf, profile, parameter schema, typed input slot, or output shape.
    - UNKNOWN or NOT_EVALUATED resource evidence is treated as zero, unlimited, or admitted.
    - A required or optional input slot is accepted with a different sourceType, cardinality, or required flag from the exact leaf definition.
  scopeStatus: OWNER_DEFINED_P0_IDENTITY_AND_SCHEMA_ENVELOPE; per-invocation resource evidence and runtime enforcement remain NOT_EVALUATED and NOT_ADMITTED until supplied.
bindingProfileRule:
  id: media.profile.binding-profile-rule
  rule: >-
    Model-native parameters such as steps, guidance, offload, and quantization
    belong in an exact qualified binding profile. They are not ordinary user
    requirements or portable guarantees of a quality-intent label.
  requestedAndEffectiveProfileRule: >-
    Record requested and effective profile identities, versions, and quality
    dimensions separately, including unchanged and changed values and the
    authority and reason for every change. Unknown or unbound values block
    execution or use only an explicit policy-permitted fallback; they are never
    reported as available. A fallback never overwrites the requested profile.
  scopeStatus: PDP-0_PROFILE_SEMANTICS_COMPLETE; exact bindings and runtime qualification are separate and not claimed.
supportedIOContract:
  id: media.profile.supported-io-contract
  rule: >-
    Each capability leaf declares its accepted input kinds and exact constraints,
    required context and authority, output kinds and schemas, cardinality and
    size/duration bounds, and any preservation or transformation behavior.
    Declare unsupported combinations and typed failure behavior. A profile or
    reproducibility record may reference only an IO contract that is exact for
    its capability and version; it cannot imply support from a file extension,
    MIME label, example, or neighboring profile.
  scopeStatus: OWNER_DEFINED_IO_CONTRACT_REQUIREMENT; capability-specific registrations remain separately required.
streamProfileRule:
  id: media.profile.stream-profile-support
  rule: >-
    A real-time or recorded stream profile binds codec, transport, recording
    behavior, reconnect and resumption semantics, and latency bounds together
    for the exact profile version. State supported directions, media tracks,
    timing units, buffering and loss behavior, cancellation/finality, and
    compatibility evidence. An unbound or unqualified dimension is unsupported;
    support on one profile cannot be inferred for another.
  requiredProfileBindings:
    - profileIdentityAndVersion
    - codecAndContainerOrWireFormat
    - transportAndDirection
    - trackAndRecordingSemantics
    - reconnectAndResumeSemantics
    - latencyAndBufferBoundsWithUnits
    - compatibilityEvidenceAndQualificationScope
  scopeStatus: OWNER_DEFINED_PROFILE_REQUIREMENT; no stream profile is qualified by this rule.
preserveModeSemanticRule:
  id: media.profile.preserve-mode-semantic-boundary
  rule: >-
    Preserve mode does not invent or infer semantic detail absent from its source.
    A generated or reconstructed detail cannot be represented as source-preserved
    truth, even when it is disclosed as generated. Enhancement and creative modes
    are distinct explicit intents that may permit bounded reconstruction or edits
    subject to their own authorization, disclosure, and preservation limits; they
    never retroactively redefine a preserve-mode result.
  scopeStatus: OWNER_DEFINED_PRESERVATION_SEMANTICS; no enhancement or runtime capability is admitted.
fallbackSemantics:
  id: FALLBACK-PERMISSION-RECORD
  defaultPermission: denied
  omissionMeaning: denied
  requiredRecordFields:
    - id
    - requestedProfileRef
    - permittedChanges
    - qualityFloorRefs
    - budgetCeiling
    - confirmationRequirement
    - authorityDecisionRef
    - expiresOrInvalidatesWhen
  permissionFields:
    preserveAspectRatio:
      default: true
      mutableByFallback: false
      rule: Preserve the requested aspect ratio; changing it requires a new explicit user intent or delivery specification.
    resolutionReduction:
      permitted: false
      constraintsRequiredIfPermitted: [minimumWidthPixels, minimumHeightPixels, maximumScaleReduction, qualityFloorRefs]
    frameRateChange:
      permitted: false
      constraintsRequiredIfPermitted: [allowedOutputRates, maximumTemporalDeviation, qualityFloorRefs]
    durationChange:
      permitted: false
      constraintsRequiredIfPermitted: [minimumDuration, maximumDuration, editOrNarrativeDisposition]
    modelOrEngineSubstitution:
      permitted: false
      constraintsRequiredIfPermitted: [candidateCapabilityRefs, compatibilityEvidenceRef, qualityFloorRefs]
      candidateCapabilityRefState: P0 capability-intent catalog is resolved; because modelOrEngineSubstitution.permitted is false, no alternative is admitted. If a later owner permits substitution, exact compatible capability/profile candidates and evidence remain NOT_EVALUATED and must be supplied before admission.
    resourceProfileChange:
      permitted: false
      constraintsRequiredIfPermitted: [allowedValues, proof-no-protected-property-degradation]
    executionLocationChange:
      permitted: false
      constraintsRequiredIfPermitted: [allowedValues, current-policy-decision]
      localOnlyRule: Remote or cloud execution is never an implicit fallback for local-only intent.
    qualityIntentChange:
      permitted: false
      constraintsRequiredIfPermitted: [allowedValues, minimumQualityFloorRefs, userConfirmation]
      rule: OOM or capacity pressure alone does not authorize lowering master/high-quality to preview/balanced.
    preservationModeChange:
      permitted: false
      rule: A fallback cannot change preserve to enhance or creative; obtain a new explicit intent and relevant authority.
    deliveryProfileChange:
      permitted: false
      constraintsRequiredIfPermitted: [compatibleTargetProfileRef, deliveryQualityFloors, userConfirmation]
    reproducibilityClassChange:
      permitted: false
      constraintsRequiredIfPermitted: [newClass, evidenceScope, userConfirmation]
  budgetCeiling:
    requiredForAnyPermittedFallback: true
    fields: [maximumCandidateCount, maximumRepairAttempts, maximumWallTime, maximumCompute, maximumIncrementalCost]
    fieldUnits:
      maximumCandidateCount: positive-integer-candidates
      maximumRepairAttempts: positive-integer-attempts
      maximumWallTime: ISO-8601-duration
      maximumCompute: owner-defined-metered-compute-unit-with-expiry
      maximumIncrementalCost: finite-amount-with-explicit-currency
    limitsMustBeFiniteAndPositiveWhereApplicable: true
    unspecifiedLimitBehavior: fallback-denied
    concreteLimits: pending-profile-and-binding-integration
  confirmationRequirement:
    materialChange: required-before-application
    confirmationIsDistinctFromPolicyAuthorization: true
    authorizationSource: current-owner-policy-contract
    status: pending-policy-owner-integration
  requestedEffectiveHistory:
    recordRequestedValues: true
    recordEffectiveValues: true
    recordChangeReasonPerAxis: true
    preservePriorHumanSelectedVersion: true
aliases:
  - id: PROFILE-ALIAS-CINEMATIC
    alias: cinematic
    aliasKind: presentation-template
    resolvesTo: [PROFILE-AXIS-QUALITY-INTENT, PROFILE-AXIS-DELIVERY]
    requiresExplicitCombinationBinding: true
    independentPolicy: false
  - id: PROFILE-ALIAS-LOW-VRAM
    aliases: [low_vram, low-vram]
    aliasKind: migration-name
    resolvesTo: RESOURCE-PROFILE-LOW
    grantsQualityDowngrade: false
    independentPolicy: false
candidateDeliveryProfiles:
  - id: media.delivery-profile.webm-opus-av1-permissive
    decision: SELECTED
    status: candidate-not-runtime-available
    scope: WebM-oriented workflows using Opus audio and AV1 video, once the complete format path is qualified.
    codecCandidates:
      videoEncoder: TECH-SVT-AV1
      videoDecoder: TECH-DAV1D
      audioCodec: TECH-LIBOPUS
    qualificationRequirements:
      - exact-container-demux-mux-and-metadata-implementation
      - codec-and-patent-distribution-review-for-the-selected-build-and-profile
      - subtitle-and-transcript-multiplexing-compatibility
      - resampling-and-timebase-fidelity
      - hardware-acceleration-and-fallback-disposition
      - parser-containment-fuzzing-performance-and-player-compatibility
    otherRequestedFormats:
      disposition: requires-a-separately-licensed-and-qualified-provider-or-explicitly-unsupported
      implicitFallback: forbidden
    runtimeActivation: forbidden-until-all-profile-qualification-requirements-pass
    sourceAuthority: .product-experience/pdp-0-product-truth/reuse-decisions.yaml
    ownerReview: codec-profile-integration-and-patent-distribution-review-pending
integrationGaps:
  capabilityReferences: OWNER_DEFINED_P0_CAPABILITY_INTENT_BINDINGS_AND_BOUNDS_ENVELOPES_RESOLVED_FOR_462_LEAVES
  domainFidelityReferences: P0 capability intent and quality metric applicability are defined across the 462-leaf population; domain-specific scientific validation, fidelity thresholds, and specialist evidence remain NOT_EVALUATED.
  profileRuntimeBindings: P0 profile meanings are defined; concrete public-contract, license, and runtime qualification evidence remain NOT_EVALUATED
