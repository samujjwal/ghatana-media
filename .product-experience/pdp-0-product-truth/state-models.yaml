- modelId: media-project-version
  purpose: model mutable edit drafts, immutable committed project revisions, optimistic concurrency, branch/restore, and conflict
    disposition
  statusDimension: project-revision-lifecycle
  authorityStatus: proposed-for-P0-005-review
  versionIdentity:
    identity: tenant-scoped project ID plus immutable revision ID
    headConcurrency: commit uses compare-and-swap against an explicit expected head revision; stale head never overwrites
      current state
    restoreRule: restoring an older revision creates a new draft revision referencing the chosen source revision; old records
      are never rewritten
    authorizationRule: membership, grants, and action policy are checked through owner contracts at read and effect boundaries
  states:
  - id: DRAFT
    terminal: false
    meaning: A mutable candidate revision based on an explicit parent/head revision; it is not the canonical project head.
  - id: COMMITTED
    terminal: false
    meaning: An immutable revision atomically accepted as the current project head after expected-head comparison and validation.
  - id: SUPERSEDED
    terminal: true
    meaning: An immutable previously committed revision that is no longer the project head; retained for authorized history/branch/restore.
  - id: CONFLICTED
    terminal: true
    meaning: An immutable commit attempt rejected because the expected head was stale or a declared merge constraint failed.
  - id: ABANDONED
    terminal: true
    meaning: An uncommitted draft explicitly abandoned or expired without changing the project head.
  transitions:
  - from:
    - DRAFT
    to:
    - COMMITTED
    guard: current authorization and policy pass; validation succeeds; expected head compare-and-swap succeeds; revision and
      head update commit atomically
  - from:
    - DRAFT
    to:
    - CONFLICTED
    guard: expected head or declared merge precondition no longer matches; no partial project or artifact selection is committed
  - from:
    - DRAFT
    to:
    - ABANDONED
    guard: authorized explicit abandon or bounded draft-expiry policy records the disposition
  - from:
    - COMMITTED
    to:
    - SUPERSEDED
    guard: a newer revision atomically becomes the project head; prior revision content and evidence remain immutable
  safeNextActions:
    DRAFT:
    - edit-within-project-and-rights-scope
    - commit-with-explicit-if-match-head
    - branch-or-abandon-with-audit-record
    COMMITTED:
    - inspect-exact-immutable-revision
    - create-a-new-draft-for-any-change
    - branch-or-restore-only-as-a-new-version
    SUPERSEDED:
    - inspect-under-current-authorization
    - create-a-new-draft-to-branch-or-restore
    - never-rewrite-historical-revision
    CONFLICTED:
    - inspect-expected-and-current-head-diff
    - resolve-in-a-new-draft-or-branch
    - do-not-auto-retry-stale-write
    ABANDONED:
    - inspect-minimal-audit-evidence
    - create-a-new-draft-if-work-is-still-authorized
    - do-not-reactivate-old-draft
  transitionRecordRequirements:
  - project-id-and-tenant-scope
  - revision-id-and-parent-revision-id
  - expected-head-revision-and-observed-head-at-commit
  - actor-and-delegation-reference
  - policy-and-rights-decision
  - changed-operation-and-source-lineage
  - validation-and-merge-disposition
  - durable-commit-or-conflict-record
  invariants:
  - committed-and-superseded-revisions-are-immutable
  - stale-write-never-replaces-a-newer-head
  - every-conflict-is-inspectable-and-does-not-partially-commit
  - restore-branch-and-undo-redo-create-new-revision-history
  - project-membership-and-permission-evaluation-remain-owned-by-identity-policy-contracts
  - artifact-erasure-tombstones-remain-authoritative-across-restores
  currentSourceObservation:
    evidence: docs/migration/expert-reviewed-master-plan.md#6-2-core-and-existing-capabilities;docs/migration/expert-reviewed-master-plan.md#12-1-state-model-and-publication-invariants
    observedFacts:
    - versioned projects, optimistic concurrency, review, branch and restore are in declared product scope
    limitations: This is a product-state proposal; persistence, merge semantics, collaboration transport, and runtime qualification
      remain unbound.
- modelId: media-project-membership
  purpose: model the project-scoped membership relationship while leaving identity, authentication, and authorization decisions
    with their public owners
  statusDimension: project-membership-lifecycle
  authorityStatus: proposed-for-P0-005-review
  states:
  - id: INVITED
    terminal: false
    meaning: A scoped membership invitation exists but has not been accepted or activated.
  - id: ACTIVE
    terminal: false
    meaning: An accepted membership relationship exists; every action is still checked against current grants and project
      policy.
  - id: SUSPENDED
    terminal: false
    meaning: The relationship is retained but project actions are blocked pending authorized reactivation or revocation.
  - id: REVOKED
    terminal: true
    meaning: The membership relationship is ended; prior actions remain auditable and access is re-evaluated at every boundary.
  - id: EXPIRED
    terminal: true
    meaning: An invitation expired without becoming active.
  transitions:
