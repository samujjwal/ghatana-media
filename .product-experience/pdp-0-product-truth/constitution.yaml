ownerDefinedExperienceRules:
  authorityStatus: Media-owner authored PDP-0 definitions; independent review and phase acceptance remain pending.
  nativeProtectionAndQuality:
    requirement: >-
      Every normal product path applies the protections required by policy and
      verifies applicable media structure and quality before reporting success.
      User complexity settings cannot disable or weaken these protections or
      quality checks.
    sourceBasis: master-plan:section-4; exact source claim MPSEM-0002-C004
  progressiveComplexity:
    requirement: >-
      A person can act on intent and outcome without choosing models, queues,
      engines, or infrastructure. Simple, Guided, and Expert expose progressively
      deeper controls over one semantic model and the same actions and state;
      ordinary product outcomes do not require Expert controls.
    sourceBasis: master-plan:section-4; exact source claim MPSEM-0002-C004
  mechanismSelection:
    id: media.constitution.mechanism-selection.v1
    authority: media-product-owner
    rule: >-
      Select mechanisms per exact capability leaf and profile against that
      candidate's declared acceptance criteria and hard constraints. When a
      comparable deterministic DSP, computer-vision, or procedural candidate
      satisfies those criteria and constraints, select it unless exact
      task-specific evidence, evaluated under a predeclared decision rule and
      materiality criterion tied to the capability/profile acceptance criteria
      and applicable metrics, demonstrates a material benefit from an
      alternative. When no comparable deterministic candidate exists, an AI/ML
      candidate is eligible for admission only when it satisfies the explicit
      capability acceptance criteria with measured evidence. Compare candidates
      only with comparable inputs or corpus, evaluation scope, method/version,
      applicable metric, and the relevant cost/resource and reproducibility
      evidence. Never infer that a mechanism is cheaper, better, safer, or less
      predictable from its category. This rule defines selection evidence only;
      it admits no implementation, provider, model, or runtime.
    missingEvidenceDisposition: NOT_ADMITTED; block selection until the acceptance criterion, predeclared decision rule/materiality criterion, baseline/evaluation scope, or required evidence is defined and available.
    specialistAcceptance: pending; no independent quality, security, rights, or runtime approval is implied.
    negativeCases:
      - id: category-is-not-benefit-evidence
        given: A candidate is called AI/ML, deterministic, procedural, or inexpensive without task-specific comparison evidence.
        then: Do not infer benefit, adequacy, safety, cost, or predictability from the category; candidate is NOT_ADMITTED.
      - id: missing-criterion-or-baseline
        given: The exact capability/profile acceptance criterion, predeclared decision rule/materiality criterion, comparison baseline, or evaluation scope is absent.
        then: NOT_ADMITTED; do not claim measured benefit or select an alternative on that claim.
      - id: noncomparable-candidate-evidence
        given: Candidate evidence uses different inputs/corpus, method/version, or evaluation scope without an established comparison.
        then: Treat the comparison as UNKNOWN and do not use it to justify mechanism selection.
      - id: deterministic-candidate-satisfies
        given: A comparable deterministic candidate satisfies the exact acceptance criteria and hard constraints and no predeclared task-specific evidence demonstrates material alternative benefit.
        then: Select the deterministic candidate; do not select AI/ML by category preference.
      - id: ai-candidate-without-measured-acceptance
        given: No comparable deterministic candidate exists, or a claimed alternative benefit is material, but the AI/ML candidate lacks measured evidence against explicit capability acceptance criteria.
        then: NOT_ADMITTED; do not report provider success or plausible output as acceptance.
      - id: evidence-does-not-satisfy-hard-constraint
        given: A candidate's measured score improves while a declared rights, safety, fidelity, quality, locality, cost, or other hard constraint is violated or unknown.
        then: Reject the candidate; a metric improvement cannot waive a hard constraint.
    scopeStatus: PDP-0 product-level mechanism-selection meaning complete; comparative evidence and specialist/runtime acceptance remain unestablished.
    sourceBasis: exact owner-authored MEDIA-CONST-005 and MEDIA-CONST-006; related quality, cost, resource, fidelity, rights, and profile clauses are linked in their normativeFieldRefs.
