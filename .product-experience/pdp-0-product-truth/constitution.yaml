schemaVersion: media.product-constitution.v1
productId: media
authority: pdp-0-product-truth
status: proposed-for-phase-0-review
scopeNote: >-
  This materializes the 32 constitutional requirements from master-plan §4 as
  proposed Media product semantics. P0-001 boundary decisions remain accepted;
  this file does not claim full Phase 0 acceptance, runtime implementation,
  qualification, licensing admission, or availability.
sourceRefs:
  - master-plan:section-4
  - master-plan:task-P0-002
  - product-truth:P0-001-boundary-slice
  - decision:MDI-001
acceptancePolicy:
  allRequirementsRequireHumanReview: true
  missingRoleAssignmentMeans: review-required
  evidenceOfSourcePresenceIsNotAcceptance: true
domainRules:
  status: bounded-media-owner-rules-mapped-under-PXD-035; P0-010-independent-review-pending
  rule: >-
    PDP-0 does not restate canonical domain states, transition guards, or action
    semantics. The following cross-phase rules are projections of the bounded
    canonical policy decisions already recorded by PDP-1. Their authority stays
    at the referenced PDP-1 decision; these rows do not accept runtime, provider,
    transport, transition-guard, or phase semantics.
  records:
    - id: MEDIA-DOMAIN-RULE-001
      name: Machine-scoped state identity
      rule: A state identifier is meaningful only together with its machine; equal spellings across job, attempt, upload, stream, or delivery machines do not establish equivalent state or behavior.
      rationale: Preserve the owner-adjudicated machine-scoped identity rule and reject lossy cross-machine normalization.
      sourceRef: .product-experience/pdp-1-domain-data/state-adjudication.yaml#/ownerAcceptedPolicyDecisions/machineScopedStateIdentity
      expectedDecisionValue: true
      violation: Reject a state mapping or action decision that omits machine identity or relies on spelling alone.
      trustScope: Every tenant and principal context; apply at state interpretation and effect authorization boundaries.
      ownerRef: .product-experience/pdp-1-domain-data/state-adjudication.yaml#ownerAcceptedPolicyDecisions
      failClosed: Preserve the source observation and return blocked-or-review-required; do not normalize or execute an inferred action.
      decisionStatus: bounded-media-owner-approved; PXD-035-bounded-mapping-accepted; P0-010-independent-review-pending
    - id: MEDIA-DOMAIN-RULE-002
      name: Request receipt is not queued execution
      rule: A request receipt or ACCEPTED response proves receipt only; it does not prove durable queueing, worker claim, dispatch, or execution.
      rationale: Keep ingress acknowledgment distinct from job state and attempt execution.
      sourceRef: .product-experience/pdp-1-domain-data/state-adjudication.yaml#/ownerAcceptedPolicyDecisions/requestReceiptIsQueuedJob
      expectedDecisionValue: false
      violation: Reject a queue, claim, dispatch, or execution assertion that is supported only by request acknowledgment.
      trustScope: Every submission boundary, tenant and principal context.
      ownerRef: .product-experience/pdp-1-domain-data/state-adjudication.yaml#ownerAcceptedPolicyDecisions
      failClosed: Report receipt-only or unknown outcome; do not expose a durable-queued claim or enable execution-dependent actions.
      decisionStatus: bounded-media-owner-approved; PXD-035-bounded-mapping-accepted; P0-010-independent-review-pending
    - id: MEDIA-DOMAIN-RULE-003
      name: Unknown outcome remains unresolved
      rule: OUTCOME_UNKNOWN is neither running nor failure nor safe-to-retry; preserve uncertainty until an authoritative reconciliation resolves the effect.
      rationale: Prevent a lossy observation from authorizing duplicate external effects.
      sourceRef: .product-experience/pdp-1-domain-data/state-adjudication.yaml#/ownerAcceptedPolicyDecisions/unknownOutcomeRule
      expectedDecisionValue: never-conflate-with-running-failure-or-safe-retry
      violation: Reject conversion of an unresolved outcome into running, failure, completion, or safe replay.
      trustScope: Every potentially effectful operation and its tenant, provider and recipient context.
      ownerRef: .product-experience/pdp-1-domain-data/state-adjudication.yaml#ownerAcceptedPolicyDecisions
      failClosed: Retain OUTCOME_UNKNOWN and require authoritative reconciliation before retry or finality claims.
      decisionStatus: bounded-media-owner-approved; PXD-035-bounded-mapping-accepted; P0-010-independent-review-pending
    - id: MEDIA-DOMAIN-RULE-004
      name: Completion is distinct from delivery acknowledgment
      rule: A completed job requires the operation-defined output set, integrity, authority, and durable result commit; it does not establish recipient delivery acknowledgment.
      rationale: Keep result finality separate from external delivery evidence.
      sourceRef: .product-experience/pdp-1-domain-data/state-adjudication.yaml#/ownerAcceptedPolicyDecisions/completedRule
      expectedDecisionValue: exact-output-set-integrity-authority-and-durable-result-commit-required; not-delivery-acknowledgement
      violation: Reject a delivered or recipient-acknowledged claim without the destination's defined acknowledgment evidence.
      trustScope: Every output-producing operation and each named destination/recipient.
      ownerRef: .product-experience/pdp-1-domain-data/state-adjudication.yaml#ownerAcceptedPolicyDecisions
      failClosed: Report result completion separately and retain delivery as unacknowledged or unknown.
      decisionStatus: bounded-media-owner-approved; PXD-035-bounded-mapping-accepted; P0-010-independent-review-pending
    - id: MEDIA-DOMAIN-RULE-005
      name: Cancellation requires authoritative finality
      rule: A cancellation request or observer detachment does not establish cancellation; cancellation requires authoritative no-dispatch or confirmed fenced-effects finality under the operation contract.
      rationale: Keep request intent and observed cancellation result distinct.
      sourceRef: .product-experience/pdp-1-domain-data/state-adjudication.yaml#/ownerAcceptedPolicyDecisions/cancelledRule
      expectedDecisionValue: authoritative-no-dispatch-or-confirmed-fenced-effects-finality; request-and-observer-detach-insufficient
      violation: Reject terminal cancellation when only a request, timeout, or observer detachment is known.
      trustScope: Every cancellable job, attempt and effect boundary under current tenant, requester, and provider context.
      ownerRef: .product-experience/pdp-1-domain-data/state-adjudication.yaml#ownerAcceptedPolicyDecisions
      failClosed: Keep cancellation pending or outcome unknown until authoritative no-dispatch or fenced-effects finality is established.
      decisionStatus: bounded-media-owner-approved; PXD-035-bounded-mapping-accepted; P0-010-independent-review-pending
    - id: MEDIA-DOMAIN-RULE-006
      name: Partial success requires closed effect accounting
      rule: PARTIALLY_SUCCEEDED is terminal only when every declared sub-effect has an explicit closed disposition and no consequential effect remains unknown.
      rationale: Prevent unresolved effects from being hidden by an aggregate partial-success label.
      sourceRef: .product-experience/pdp-1-domain-data/state-adjudication.yaml#/ownerAcceptedPolicyDecisions/partialSuccessRule
      expectedDecisionValue: terminal-only-if-declared-sub-effects-have-explicit-closed-dispositions-and-no-consequential-unknown-effect
      violation: Reject terminal partial success while any declared sub-effect is missing a closed disposition or has consequential unknown finality.
      trustScope: Every multi-effect job and its tenant, provider, destination, and output-version context.
      ownerRef: .product-experience/pdp-1-domain-data/state-adjudication.yaml#ownerAcceptedPolicyDecisions
      failClosed: Keep the aggregate nonterminal or outcome-unknown and expose unresolved sub-effects for reconciliation.
      decisionStatus: bounded-media-owner-approved; PXD-035-bounded-mapping-accepted; P0-010-independent-review-pending
  pendingSources:
    - ref: .product-experience/pdp-1-domain-data/states.yaml
      reason: State records are proposal-only and their meaningDisposition remains pending-owner-review.
    - ref: .product-experience/pdp-1-domain-data/transitions.yaml
      reason: Transition records remain proposals; guards, operation bindings, permission checks, and effects are pending.
    - ref: .product-experience/pdp-1-domain-data/authority.yaml
      reason: PDP-1 authority and identity/provider bindings remain proposal-only or unverified.
invariants:
  resolutionStatus: media-owner-resolved; P0-010-independent-review-pending
  sourceOfResolution: .product-experience/pdp-0-product-truth/policy-authority-model.yaml
  records:
    - id: MEDIA-INV-001
      statement: A private context does not imply local processing, and local processing does not imply authorized use.
      violation: If processing locality or authorization is missing or conflicting, return blocked or review-required; make no locality claim without a binding and observation.
      sourceRefs: [.product-experience/pdp-0-product-truth/policy-authority-model.yaml#/productPolicy/independentGovernanceAxes/3, .product-experience/pdp-0-product-truth/policy-authority-model.yaml#/productPolicy/invariants/0, .product-experience/pdp-0-product-truth/policy-authority-model.yaml#/productPolicy/invariants/1]
    - id: MEDIA-INV-002
      statement: User attestation is not verified consent or license.
      violation: Do not admit governed processing or distribution when required consent or license evidence is absent, expired, revoked, or unverified; return blocked or review-required with the reason.
      sourceRefs: [.product-experience/pdp-0-product-truth/policy-authority-model.yaml#/productPolicy/independentGovernanceAxes/8, .product-experience/pdp-0-product-truth/policy-authority-model.yaml#/productPolicy/independentGovernanceAxes/9, .product-experience/pdp-0-product-truth/policy-authority-model.yaml#/productPolicy/enforcementPoints/2]
    - id: MEDIA-INV-003
      statement: Source classification is a floor for derived data until an authorized deidentification promotion.
      violation: Do not persist or promote metadata whose classification, tenant ownership, retention, or provenance checks fail.
      sourceRefs: [.product-experience/pdp-0-product-truth/policy-authority-model.yaml#/productPolicy/independentGovernanceAxes/1, .product-experience/pdp-0-product-truth/policy-authority-model.yaml#/productPolicy/invariants/3, .product-experience/pdp-0-product-truth/policy-authority-model.yaml#/productPolicy/enforcementPoints/1]
    - id: MEDIA-INV-004
      statement: Model-generated content or assertions cannot authorize themselves.
      violation: Reject model output as approval or privileged authority; require current policy and a separately authorized decision at the effect boundary.
      sourceRefs: [.product-experience/pdp-0-product-truth/policy-authority-model.yaml#/productPolicy/invariants/4, .product-experience/pdp-0-product-truth/policy-authority-model.yaml#/productPolicy/platformMechanics/privilegedEffects]
    - id: MEDIA-INV-005
      statement: Required audit intent must be recorded before crossing an external effect boundary.
      violation: Do not dispatch or publish when required audit intent cannot be recorded; if an effect may already have occurred, preserve outcome uncertainty and do not replay to repair the audit record.
      sourceRefs: [.product-experience/pdp-0-product-truth/policy-authority-model.yaml#/productPolicy/platformMechanics/audit, .product-experience/pdp-0-product-truth/policy-authority-model.yaml#/productPolicy/invariants/8, .product-experience/pdp-0-product-truth/policy-authority-model.yaml#/productPolicy/adversarialAcceptanceCases/8]
    - id: MEDIA-INV-006
      statement: Policy revocation stops future dispatch and restricts outputs at the next enforcement point.
      violation: Re-check current authority at effect boundaries; stop future dispatch and restrict outputs when policy has been revoked, without claiming an in-flight effect was terminated.
      sourceRefs: [.product-experience/pdp-0-product-truth/policy-authority-model.yaml#/productPolicy/invariants/7, .product-experience/pdp-0-product-truth/policy-authority-model.yaml#/productPolicy/enforcementPoints]
    - id: MEDIA-INV-007
      statement: Cross-tenant access and reuse are denied.
      violation: Deny read, reuse, or effect when tenant ownership does not match the verified request context, even when content digests match.
      sourceRefs: [.product-experience/pdp-0-product-truth/policy-authority-model.yaml#/productPolicy/independentGovernanceAxes/2, .product-experience/pdp-0-product-truth/policy-authority-model.yaml#/productPolicy/enforcementPoints/4]
normativeRecordContract:
  requiredFields:
    - what
    - why
    - who
    - context
    - preconditions
    - requiredBehavior
    - outcome
    - importantConsequences
    - failureOrDegradedBehavior
    - authority
    - acceptanceCriteria
    - scopeStatus
  rule: >-
    Each normative requirement must provide or reference every field. A source
    reference does not by itself satisfy a missing field. Do not infer an owner
    appointment, product commitment, bound, or acceptance decision from source
    presence.
  scopeStatusVocabulary: [CURRENT, TARGET, DEFERRED, RESEARCH, COMPATIBILITY_ONLY, NOT_APPLICABLE, OBSOLETE]
  scopeStatusIndependence:
    - implementation
    - qualification
    - runtimeAvailability
    - licenseAdmission
  knownGaps:
    - >-
      The constitutional entries below currently provide a statement, role
      references, review state, and source references; their required-field
      completeness has not been established. Missing semantic details and
      owner decisions remain for required review and independent P0-010.
    - >-
      Record-level scopeStatus placement in requirements.yaml and
      capabilities.yaml requires normalization; those files are outside this
      wave's write set and are not modified here.
requirements:
  - id: MEDIA-CONST-001
    statement: Collect and retain the minimum media, metadata, and derived information necessary for the declared purpose.
    ownerRoleRef: media.role.product-manager
    acceptanceOwnerRoleRef: media.role.privacy-rights-reviewer
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4"]
  - id: MEDIA-CONST-002
    statement: Authenticate trusted boundaries, authorize each consequential action, and preserve tenant and principal isolation.
    ownerRoleRef: media.role.security-privacy-lead
    acceptanceOwnerRoleRef: media.role.security-privacy-lead
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4", "master-plan:section-11"]
  - id: MEDIA-CONST-003
    statement: Normal user experiences shall let people act on intent and outcome without requiring them to select models, queues, engines, or infrastructure.
    ownerRoleRef: media.role.ux-architect
    acceptanceOwnerRoleRef: media.role.ux-architect
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4", "master-plan:section-14"]
  - id: MEDIA-CONST-004
    statement: Simple, Guided, and Expert shall expose progressively deeper controls over one semantic model and the same actions and state.
    ownerRoleRef: media.role.ux-architect
    acceptanceOwnerRoleRef: media.role.ux-architect
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4", "master-plan:section-14"]
  - id: MEDIA-CONST-005
    statement: Use AI and machine learning only where measured benefit justifies them; they are neither mandatory nor a separate isolated product area.
    ownerRoleRef: media.role.media-domain-lead
    acceptanceOwnerRoleRef: media.role.quality-fidelity-reviewer
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4"]
  - id: MEDIA-CONST-006
    statement: Prefer adequate deterministic DSP, computer vision, or procedural execution before more expensive or less predictable mechanisms.
    ownerRoleRef: media.role.media-domain-lead
    acceptanceOwnerRoleRef: media.role.quality-fidelity-reviewer
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4"]
  - id: MEDIA-CONST-007
    statement: Validate media structure and measure applicable quality; provider success alone shall not count as quality acceptance.
    ownerRoleRef: media.role.media-domain-lead
    acceptanceOwnerRoleRef: media.role.quality-fidelity-reviewer
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4"]
  - id: MEDIA-CONST-008
    statement: Never silently weaken privacy, rights, safety, scientific fidelity, requested quality, or external-effect finality.
    ownerRoleRef: media.role.security-privacy-lead
    acceptanceOwnerRoleRef: media.role.privacy-rights-reviewer
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4"]
  - id: MEDIA-CONST-009
    statement: Every meaningful operation shall have bounded, privacy-safe diagnostics and trace correlation.
    ownerRoleRef: media.role.sre
    acceptanceOwnerRoleRef: media.role.security-privacy-lead
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4", "master-plan:section-12"]
  - id: MEDIA-CONST-010
    statement: Consequential operations shall have durable audit intent and truthful outcome and finality records.
    ownerRoleRef: media.role.security-privacy-lead
    acceptanceOwnerRoleRef: media.role.privacy-rights-reviewer
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4", "master-plan:section-11"]
  - id: MEDIA-CONST-011
    statement: Derived artifacts shall retain authorized lineage and processing provenance throughout their permitted lifecycle.
    ownerRoleRef: media.role.media-domain-lead
    acceptanceOwnerRoleRef: media.role.privacy-rights-reviewer
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4"]
  - id: MEDIA-CONST-012
    statement: Accessible operation, review, and suitable output alternatives shall be intrinsic product behavior and shall not require a paid add-on.
    ownerRoleRef: media.role.accessibility-lead
    acceptanceOwnerRoleRef: media.role.accessibility-lead
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4", "master-plan:section-14"]
  - id: MEDIA-CONST-013
    statement: Failures shall preserve eligible completed work and expose safe recovery; an unknown outcome shall remain explicit.
    ownerRoleRef: media.role.sre
    acceptanceOwnerRoleRef: media.role.media-domain-lead
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4", "master-plan:section-7"]
  - id: MEDIA-CONST-014
    statement: Evaluate suitable Ghatana reuse first, then approved permissively licensed external software, before implementing replacement mechanics.
    ownerRoleRef: media.role.media-domain-lead
    acceptanceOwnerRoleRef: media.role.platform-owner
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4", "master-plan:section-3", "master-plan:section-15"]
  - id: MEDIA-CONST-015
    statement: Animation shall be a native creation mode and shall not be treated only as an incidental AI-video feature.
    ownerRoleRef: media.role.media-domain-lead
    acceptanceOwnerRoleRef: media.role.product-manager
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4", "master-plan:section-6"]
  - id: MEDIA-CONST-016
    statement: Simulation shall be a native creation and control mode with explicit fidelity and reproducibility declarations.
    ownerRoleRef: media.role.media-domain-lead
    acceptanceOwnerRoleRef: media.role.fidelity-reviewer
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4", "master-plan:section-8"]
  - id: MEDIA-CONST-017
    statement: Offer local or private execution only when the entire selected plan can satisfy the applicable policy.
    ownerRoleRef: media.role.security-privacy-lead
    acceptanceOwnerRoleRef: media.role.privacy-rights-reviewer
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4", "master-plan:section-11"]
  - id: MEDIA-CONST-018
    statement: Web, CLI, API, SDK, embedded integrations, and Explorer shall refer to one domain, action, and state authority.
    ownerRoleRef: media.role.product-manager
    acceptanceOwnerRoleRef: media.role.ux-architect
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4", "master-plan:section-5"]
  - id: MEDIA-CONST-019
    statement: Preserve ecosystem ownership and prohibit product-internal imports from the core Ghatana runtime.
    ownerRoleRef: media.role.platform-owner
    acceptanceOwnerRoleRef: media.role.platform-owner
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4", "product-truth:P0-001-boundary-slice"]
  - id: MEDIA-CONST-020
    statement: Exact text, branding, logos, captions, figures, and required disclosures shall use deterministic composition.
    ownerRoleRef: media.role.media-domain-lead
    acceptanceOwnerRoleRef: media.role.publication-approver
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4"]
  - id: MEDIA-CONST-021
    statement: Disclose generative reconstruction; restoration shall not certify recovery of unknowable original detail.
    ownerRoleRef: media.role.media-domain-lead
    acceptanceOwnerRoleRef: media.role.fidelity-reviewer
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4"]
  - id: MEDIA-CONST-022
    statement: Reveal model, provider, or engine identity when needed for trust, rights, cost, reproducibility, or expert diagnosis.
    ownerRoleRef: media.role.media-domain-lead
    acceptanceOwnerRoleRef: media.role.product-manager
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4"]
  - id: MEDIA-CONST-023
    statement: Long-running remote work shall be independent of browser or CLI attachment; stopping observation shall not imply cancellation.
    ownerRoleRef: media.role.sre
    acceptanceOwnerRoleRef: media.role.media-domain-lead
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4", "master-plan:section-7"]
  - id: MEDIA-CONST-024
    statement: Every ordinary user-facing state shall have a clear next action and actionable explanation of material blockers.
    ownerRoleRef: media.role.ux-architect
    acceptanceOwnerRoleRef: media.role.ux-architect
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4", "master-plan:section-14"]
  - id: MEDIA-CONST-025
    statement: Original bytes and accepted project revisions shall not be destructively overwritten by enhancement.
    ownerRoleRef: media.role.media-domain-lead
    acceptanceOwnerRoleRef: media.role.privacy-rights-reviewer
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4", "master-plan:section-6"]
  - id: MEDIA-CONST-026
    statement: Customer assets shall not be used for training, content telemetry, or cross-tenant learning without separate authorization.
    ownerRoleRef: media.role.security-privacy-lead
    acceptanceOwnerRoleRef: media.role.privacy-rights-reviewer
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4", "master-plan:section-11"]
  - id: MEDIA-CONST-027
    statement: Automatic repair shall be bounded by admissible changes, cost, time, attempts, and measured improvement.
    ownerRoleRef: media.role.media-domain-lead
    acceptanceOwnerRoleRef: media.role.quality-fidelity-reviewer
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4", "master-plan:section-9"]
  - id: MEDIA-CONST-028
    statement: Capability, profile, license, and runtime status shall remain explicit; absence of evidence shall never imply availability.
    ownerRoleRef: media.role.media-domain-lead
    acceptanceOwnerRoleRef: media.role.quality-fidelity-reviewer
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4", "master-plan:section-6"]
  - id: MEDIA-CONST-029
    statement: Deletion, consent revocation, cache reuse, and publication shall re-check current policy at the effect boundary.
    ownerRoleRef: media.role.security-privacy-lead
    acceptanceOwnerRoleRef: media.role.privacy-rights-reviewer
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4", "master-plan:section-11"]
  - id: MEDIA-CONST-030
    statement: Explorer simulation, model qualification, runtime correctness, and external certification shall remain separate claims.
    ownerRoleRef: media.role.product-manager
    acceptanceOwnerRoleRef: media.role.product-manager
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4", "master-plan:section-21"]
  - id: MEDIA-CONST-031
    statement: Untrusted inputs, scripts, native tools, and models shall execute only through admitted, bounded isolation boundaries.
    ownerRoleRef: media.role.security-privacy-lead
    acceptanceOwnerRoleRef: media.role.security-privacy-lead
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4", "master-plan:section-11"]
  - id: MEDIA-CONST-032
    statement: Convenience shall not create hidden duplicate authority, implementation, registry, state machine, or platform framework.
    ownerRoleRef: media.role.platform-owner
    acceptanceOwnerRoleRef: media.role.platform-owner
    acceptanceState: pending-human-review
    sourceRefs: ["master-plan:section-4", "master-plan:section-5"]
