    capabilityDefinition:
      id: media.rules.manage
      scopeStatus: TARGET
      familyId: media.rules
      operation: manage
      label: Manage reusable action and quality rules
      definitionState: COORDINATOR_AUTHORED_PDP0_PROPOSAL; owner acceptance pending
      outcome: Author or inspect a scoped action/quality rule-set candidate, assign a stable version identity
        without replacing its prior version, and return a validation observation or candidate operation plan
        only when explicitly requested. A candidate or validation result does not approve or execute the
        rules; every affected media operation requires its own explicit request and separate admission.
      sourceScope:
        masterPlanSection: §6.2
        sourcePhrase: Reusable user-configurable action/quality rules (AUD-SPEC-020)
      relatedMasterPlanSections:
        - §6.1
        - §11.1–11.6
        - §18.2–18.3
      actorRoles:
        - creator
        - editor
        - developer-integrator
        - operator
      actorBindingState: proposed-canonical-actor-refs; owner acceptance pending
      inputArtifactTypes:
        - action-quality-rule-set-draft
        - declared-media-operation-reference
        - declared-input-and-constraint-set
        - optional-prior-rule-set-version-reference
      outputArtifactTypes:
        - versioned-action-quality-rule-set-candidate
        - rule-set-validation-observation
        - candidate-operation-plan
      preconditions:
        - The caller identifies the rule-set scope and has authority to author or inspect it; authorization
          does not admit affected operations.
        - Validation and reuse name the exact rule-set version and target media operation.
        - Any affected operation is separately admitted before its execution.
      supportedParameters: P0 defines the typed draft, prior-version reference, target operation, inputs, and
        constraints as operation inputs. No execution parameters or product defaults are implied.
      constraints:
        - A new rule-set candidate has a stable version identity and preserves the referenced prior version
          unchanged.
        - Validation is observational; reuse returns a candidate plan and does not execute a rule or
          consequential media operation.
        - Invalid, unsupported, denied, unavailable, stale, or unknown rule-set evidence is explicit; invalid
          or unauthorized sets are never partially applied.
        - Reuse requires an explicit request for the exact version and a separate admission decision for every
          affected operation.
        - A candidate, saved rule set, or validation observation is not human approval, runtime availability,
          or qualification.
      actionStateReferences:
        action: author-inspect-validate-or-reuse-exact-rule-set-version
        stateCoverage:
          - not-admitted
          - candidate-returned
          - validation-returned
          - blocked
          - outcome-unknown
        stateModelBindingState: no-persistent-lifecycle-model-is-asserted-by-this-proposal
        stateModelRefs: []
      requiredAuthority:
        - identity-and-tenant-context
        - rule-set-scope-read-or-write-permission-as-applicable
        - operation-specific-policy-and-rights-for-each-affected-operation
      rightsPrivacyImplications:
        - Rule-set scope, source references, and tenant ownership must remain explicit; a reusable rule does
          not transfer rights or consent.
        - Inputs and rule contents are subject to the declared operation's privacy, egress, retention, and
          rights policy.
      qualityFidelityContract: A validation observation describes only the exact rule-set version, declared target
        operation, inputs, and constraints. A candidate operation plan is not a measured quality result or
        evidence that a rule was applied.
      cancellationRetryReconciliation: Rule authoring and validation produce version-bound candidates or
        observations. Unknown validation remains UNKNOWN; callers must revalidate the exact version and
        inputs. No rule execution or retry is implied.
      executionResourceRequirements: This definition selects no numeric resource limit and authorizes no execution.
        Any affected operation applies its own current bounded invocation and resource-admission contract.
      accessibilityRepresentation: Interactive authoring and validation results require a semantic,
        keyboard-operable representation; concrete interface behavior is a later PDP-2/PDP-3 definition.
      provenance:
        - Preserve rule-set identity, version, declared scope, target operation, and source references in
          every candidate and validation observation.
        - Do not infer truth, rights, runtime support, or applied effects from a rule's contents or validation
          result.
      ghatanaReuseDisposition: No external rule engine or execution dependency is selected by this product
        definition; any later reuse selection requires its own source decision and qualification.
      externalDependencies: []
      requirementIds:
        - MEDIA-REQ-CAP-RULES
      acceptanceCases:
        - given: A caller authors a valid scoped action/quality rule-set draft and optionally names an exact prior
            version.
          when: The caller requests authoring or versioning.
          then: Return a versioned candidate with a stable identity and preserve the prior version unchanged; do not
            approve or execute its rules.
          id: AUD-SPEC-020-CAP-AC-01
        - given: A caller explicitly requests validation or reuse of an exact version for a declared media operation.
          when: The request is evaluated.
          then: Return a version-bound validation observation or candidate plan with provenance; every affected
            operation remains separately admitted and unexecuted.
          id: AUD-SPEC-020-CAP-AC-02
        - given: The rule set or any required input is invalid, unsupported, denied, unavailable, stale, or unknown.
          when: Authoring, validation, or reuse is evaluated.
          then: Return the explicit non-success state, apply no partial rules, preserve the prior version, and do not
            execute an affected operation.
          id: AUD-SPEC-020-CAP-AC-03
      qualificationDimensions:
        - operation-and-contract-version
        - rule-set-version-and-scope
        - rights/privacy/security-policy
        - invalid/unsupported/unknown-input-handling
        - accessibility-of-interactive-authoring
      proposedApplicableChannels:
        - web
        - api
        - embedded
        - http-api
        - grpc-api
        - sdk
        - cli
        - product-integration
      channelDispositionState: eight-channel-PDP0-proposal; owner review pending; no runtime admission
