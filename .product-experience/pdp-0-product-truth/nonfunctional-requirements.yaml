    - id: media.nfr-measurement.NFR-DEPLOY-001.v1
      requirementRef: NFR-DEPLOY-001
      metric: undeclared egress/model-download/fallback count and profile-contract completeness
      unit: count per profile × capability × boundary; checklist item completion fraction
      scope: Local-development, private-local, connected-production, and hybrid-production profiles at capability scope.
      samplePopulation:
        include: Each declared profile and each capability it claims, including offline, unavailable dependency, denied egress, and lower-fidelity fallback cases.
        exclude: Profiles not yet authored and deployment environments without approved identity/durability/security owners; these remain unadmitted.
      protocol:
        - Freeze profile, capability set, identity/durability/encryption/backup/quota/integration declarations, and allowed egress list.
        - Exercise denied-network and unavailable-dependency cases; record attempted egress, download, fallback, and stop behavior.
        - Verify each fallback requires an explicit profile permission and repeats quality, budget, and authority checks.
      invalidOrAbstain: Abstain if profile identity, egress policy, capability list, or stop condition is undefined; absent policy is not local-only permission.
      requiredEvidence: profile version, capability list, network policy, deployment manifest, observed egress trace, and stop/fallback decision.
      observationStatus: NOT_EVALUATED
      sourceRefs:
        - .product-experience/pdp-0-product-truth/nonfunctional-requirements.yaml#requirements/NFR-DEPLOY-001
