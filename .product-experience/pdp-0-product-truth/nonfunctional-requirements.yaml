        - .product-experience/pdp-0-product-truth/quality-policy.yaml#protectedSemanticProperties/PROTECTED-DOMAIN-FIDELITY
    - id: media.nfr-measurement.NFR-RECOVERY-001.v1
      requirementRef: NFR-RECOVERY-001
      metric: unsafe-replay count, fence/tombstone violation count, and unresolved-outcome misclassification count
      unit: count per injected crash/race scenario and operation identity
      scope: Restart, retry, cancellation, restore, and reconciliation for each exact stateful owner operation.
      samplePopulation:
        include: Duplicate request, stale lease/fence, crash before/after dispatch, cancel race, partial success, restore, tombstone replay, and provider-outcome-unknown cases.
        exclude: Uncontrolled real provider execution and scenarios with no deterministic authoritative expected-state oracle.
      protocol:
        - Freeze operation/state-machine version, durable fixture, actor/tenant, attempt identity, and fault schedule.
        - Inject each crash/race point, restart or reconcile from persisted evidence, and assert only declared safe next actions are possible.
        - Verify unknown outcomes stay UNKNOWN and are never converted to success/failure or replay authorization without exact evidence.
      invalidOrAbstain: Abstain if a fence, durable identity, tombstone rule, or state oracle is missing; a passing in-process test alone does not establish restart safety.
      requiredEvidence: fault schedule, before/after durable snapshots, actor and attempt identities, state oracle, and safe-next-action result.
      observationStatus: NOT_EVALUATED
      sourceRefs:
        - .product-experience/pdp-0-product-truth/nonfunctional-requirements.yaml#requirements/NFR-RECOVERY-001
