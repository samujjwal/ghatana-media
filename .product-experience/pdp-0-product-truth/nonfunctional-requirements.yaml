    - id: media.nfr-measurement.NFR-SLO-001.v1
      requirementRef: NFR-SLO-001
      metric: owner-approved availability/error/latency SLI, recovery-point loss, recovery-time, restore integrity, and soak stability
      unit: owner-selected ratio/percentile, seconds, bytes or records lost, and incident/error count over a named window
      scope: One named production deployment, service boundary, data class, and runtime-operations-approved target set.
      samplePopulation:
        include: Only production or approved production-like observations with a frozen service boundary, target environment, traffic/data class, and SRE-approved measurement window.
        exclude: Local tests, synthetic-only drills as evidence of real availability, unapproved environments, and any number not approved by the service owner.
      protocol:
        - Obtain runtime-operations approval for exact SLI/SLO, RPO/RTO, restore and soak targets, environment, and window before evaluating compliance.
        - Measure availability/error/latency from the approved service boundary; measure RPO/RTO and restore integrity using approved failure and restore exercises.
        - Report missing instrumentation or an unapproved target as NOT_SET/NOT_EVALUATED; never substitute a proposed budget or synthetic pass.
      invalidOrAbstain: Abstain until the service owner names and approves the target, environment, window, data boundary, and evidence source; no production activation follows from this method definition.
      requiredEvidence: signed target decision, deployment/environment identity, SLI query/version, observation window, restore/drill trace, and limitations.
      observationStatus: NOT_EVALUATED
      sourceRefs:
