  - at least one material failure/degradation case and safe recovery
  - preserved context, return path, channel disposition, and accessibility disposition
  phase2DetailStillRequired:
  - exact view/state/action ordering and state transitions
  - automation versus human decisions and authority checks
  - loading/empty/partial/stale/offline/permission/policy/conflict/unknown-finality states
  - responsive variants, exact copy, accessibility/localization contracts, and executable fixtures
  currentness: >-
    Entries below are planning references from the reviewed master plan and
    proposed Goal/Actor records. Current P0 capability intent and channel
    applicability are resolved by the exact owner adjudications above. This
    list is not a proof that every downstream PDP-1 operation is mapped,
    available, or admitted.

accessibilityDisposition:
  id: media.a11y.baseline
  status: required-by-plan; acceptance-review-pending
  proposedBaseline:
  - Semantic DOM or structured view of canvas, timeline, waveform, graph, and simulation meaning.
  - Keyboard operation and non-drag alternatives for selection, trim, reorder, masks, and controls.
  - Predictable focus, programmatic errors/status, captions/transcripts, visible audio controls, reduced motion, forced colors,
    zoom/reflow, and touch-target review.
  - Exact supported locale set and per-language testing remain unadmitted; generated language output is a reviewable draft.
  evidence: No WCAG or human-usability acceptance is claimed.

