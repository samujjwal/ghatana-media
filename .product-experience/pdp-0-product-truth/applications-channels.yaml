localeAdmission:
  status: no-product-locale-set-admitted
  implementationAndRuntimeSupport: NOT_EVALUATED_BY_LOCALE
  dimensionsAreIndependent:
    - uiLocale
    - speechRecognitionLanguage
    - subtitleLanguage
    - synthesisVoiceLocale
    - metadataFormattingLocale
    - timeAndNumberFormattingLocale
  evidenceOnlyIdentifiers:
    - { tag: en, evidence: Media code/model/test fixtures contain English defaults or examples; product-wide UI admission is not established. }
    - { tag: fr-CA, evidence: A language-detection test uses a French-Canadian locale; no product locale admission follows. }
  proposedResilienceFixtures:
    - { tag: en, script: Latin, status: proposed-test-fixture-not-launch-claim }
    - { tag: hi-IN, script: Devanagari, status: proposed-test-fixture-not-launch-claim }
    - { tag: ar, script: Arabic/RTL, status: proposed-only-no-locale-support-claim }
    - { tag: qps-ploc, script: pseudo-localization, status: proposed-only-no-locale-support-claim }
  requiredResilienceTestRule:
    id: media.locale.required-resilience-test-rule
    rule: >-
      Where locale behavior is claimed, exercise at least Latin and Devanagari fixtures plus RTL or pseudo-localization.
      Verify bidi direction, licensed font fallback, script shaping, long-label expansion, translated-caption wrapping,
      and date/number/time formatting independently for each admitted capability. A fixture passing is test evidence for
      that exact capability and configuration only; it does not admit a locale, establish launch support, or certify
      localization generally.
    testOnlyFixtures: [en-Latin, hi-IN-Devanagari, ar-Arabic-RTL, qps-ploc-pseudo-localization]
    scopeStatus: DEFINITION_ONLY; no locale set or runtime is admitted here.
  rules:
    - Unadmitted or unqualified language/voice choices appear as unavailable with a reason; never silently fall back to English.
    - Locale admission requires testing long labels, translated-caption wrapping, bidi/RTL, shaping, licensed font fallback, and formatting independently per capability.
    - Evidence in one STT/TTS model or one fixture does not imply UI, subtitle, voice, or mastering support.

applicationAndConsumerContext:
  ownerRegistry: handoff-contracts.yaml
  observedConsumerInventory: migration/consumer-inventory.yaml
  note: Consumer availability, contract acceptance, fulfillment, activation, and channel admission are distinct statuses.
ownerLeafApplicabilityRules:
  decisionId: MEDIA-OWNER-2026-10-08-P0-07-LEAF-CHANNEL-APPLICABILITY-01
  authority: user-delegated-Media-semantic-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
  sourceRef: .product-experience/pdp-0-product-truth/capability-leaf-review.yaml#ownerCapabilityLeafAdjudication.records
  ruleBoundary: Definition-scope decisions only; none of these rows is runtime, license, qualification, or channel admission.
  rules:
    EXACT_SOURCE_CHANNEL_LABEL: Map each capability supportedChannels label only to the channel whose source ID has that exact label; logical api maps only to media.channel.api.
    API_ALIAS_DOES_NOT_ASSERT_HTTP_GRPC_OR_SDK_EQUIVALENCE: A leaf naming logical api is definition-applicable to HTTP, gRPC, and SDK contract work only as a pending concrete adapter; no transport equivalence, endpoint, or package admission is claimed.
    AGENT_ROLE_OR_EXPLICIT_PRODUCT_INTEGRATION: Agent definition scope applies only when the leaf explicitly names automation-agent or product-integration; exact per-action tool binding, host identity, and authorization remain required.
    NO_AGENT_ROLE_OR_PRODUCT_INTEGRATION_IN_THIS_LEAF_SOURCE: No Agent tool invocation is included for the leaf unless its actor/interface source explicitly includes an automation agent or product integration.
    EVENTS_ARE_VERSIONED_NOTIFICATIONS_NOT_COMMAND_TRANSPORT: Events are not capability invocation channels. Exact producer/observer applicability is defined by PDP-1 event contracts; no event is command acknowledgement absent an explicit receipt contract.
    ARCHIVED_DESKTOP_SOURCE_ONLY: Legacy desktop is excluded from active product scope based on archived-only consumer inventory; no desktop feature or migration is implied.
    NO_EXACT_LEAF_SOURCE_OR_PRODUCT_ACTOR_SCOPE_FOR_CHANNEL: The Media owner does not select a channel absent an exact source label or explicit actor/interface role; this is a definition-scope exclusion, not a runtime denial.
ownerDefinedChannels:
  authority: user-delegated-Media-semantic-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
  sourceRefs:
    - .product-experience/pdp-0-product-truth/capability-leaf-review.yaml#ownerCapabilityLeafAdjudication.records.channelApplicability
  records:
    - id: media.channel.agent
      name: Agent tool mediation
      definitionState: owner-defined; independent-review-pending
      implementationState: UNKNOWN
      qualificationState: NOT_EVALUATED
      licenseAdmissionState: NOT_EVALUATED
      runtimeAvailability: UNKNOWN
      phase0Admission: pending
      intendedRole: Expose only exact, owner-defined Media operation and query contracts to an admitted host agent. The host supplies trusted tenant/principal/workspace context; tool arguments cannot assert identity or elevate authority.
      authorityBoundary: Every call is re-authorized under the exact Media contract and current policy. No general shell, arbitrary URL retrieval, provider selection, unsupported parameter, or bypass of rights, consent, workspace, or finality checks.
      resultBoundary: Return the canonical typed result or declared error with provenance and observedAt. A tool response is not proof of external completion unless the canonical operation receipt says so.
      contractRequirement: Exact action-to-operation mapping, input/output schema, trusted context, delegation, errors, idempotency, and unknown-outcome recovery are required before any Agent channel admission.
      sourceBasis:
        - .product-experience/pdp-0-product-truth/applications-channels.yaml#applicationAndConsumerContext
        - .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts
      executionAdmission: NOT_ADMITTED
    - id: media.channel.event
      name: Domain event observation and notification
      definitionState: owner-defined; independent-review-pending
      implementationState: UNKNOWN
      qualificationState: NOT_EVALUATED
      licenseAdmissionState: NOT_EVALUATED
      runtimeAvailability: UNKNOWN
      phase0Admission: pending
      intendedRole: Observe only explicitly catalogued Media domain events or user notification events. This channel is not a command invocation surface.
      authorityBoundary: Events are tenant-scoped, minimized, versioned observations. Event names, producer, ordering, deduplication, replay, retention and privacy are defined by the exact PDP-1 event contract; an event is not command acknowledgement or finality without a contract-specific receipt.
      contractRequirement: Event publisher/observer, schema, ordering, deduplication, privacy, durability, and recovery contract must be exact; external event-plane and runtime qualification remain separate.
      sourceBasis:
        - .product-experience/pdp-1-domain-data/events.yaml#observedEnvelope
        - .product-experience/pdp-1-domain-data/events.yaml#ownerEventContracts
      executionAdmission: NOT_ADMITTED
channelIdentityPrecedence: channels preserves the nine historically authored channel observations; ownerDefinedChannels.records adds the two Media-owner decisions for Agent and Event. The active Media definition union is both collections (11 IDs); neither source observation nor owner definition implies phase admission or runtime support.
