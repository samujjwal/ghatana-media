  - id: media.channel.cli
    name: Command-line batch interface
    definitionState: owner-defined-command-identity; commands-and-admission-pending
    implementationState: no-user-facing-Media-CLI-admission-established
    qualificationState: NOT_EVALUATED
    licenseAdmissionState: NOT_EVALUATED
    runtimeAvailability: UNKNOWN
    phase0Admission: pending
    commandIdentity: ghatana-media
    commandIdentityMeaning: Canonical intended product CLI command label only; this does not assert an installed, published, supported, or runtime-available executable.
    evidence: Master-plan sections 17 and 20 propose safe bounded batch rendering through CLI; exact commands and installed behavior remain to be authored.
    intendedRole: Deterministic non-interactive plan/submit/watch/reconcile over the same Media semantic state/actions as Web and API.
    supportRule: Consequential operations require explicit authority; scripts/build entrypoints are not treated as a product CLI.
    ownerCliDefinitionContract:
      id: media.cli.definition-boundaries.v1
      authority: user-delegated-Media-semantic-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
      sourceBasis:
        - .product-experience/pdp-1-domain-data/operations.yaml#actionOperationDispositionInventory
        - Master-plan sections 17 and 20 cited by media.channel.cli
      definitionOnly: true
      pathHandling:
        rule: A local filesystem path is a client-side input reference only. Never reinterpret it as an HTTP route, URL, server filesystem path, or arbitrary server-side retrieval target.
        serverRead: A server-side read requires an exact canonical Media artifact/version identity and current authorized query contract; local paths are not Media artifact identities.
      interruptHandling:
        ctrlC:
          effect: stop-local-wait-or-stream-observation
          exitCode: 130
          serverCancellation: false
          jobStateChange: false
          unknownMutationOutcome: A command already sent remains pending or OUTCOME_UNKNOWN until an exact authorized reconciliation query resolves it; interruption does not imply rejection or cancellation.
      flagApplicability:
        rule: Each flag is declared per exact command identity and request schema; unknown, inapplicable, or conflicting flags fail before dispatch. A flag name shared across commands does not imply shared meaning.
        readOnlyCommands:
          idempotencyKey: FORBIDDEN_OR_NOT_APPLICABLE; queries do not accept a replay key because they create no effect.
        consequentialCommands:
          idempotencyKey: REQUIRED_ONLY_WHEN_THE_EXACT_CANONICAL_COMMAND_SCHEMA_DECLARES_IT; never inferred from CLI family or added to queries.
      outputAndExit:
        query: Emit a bounded observation with observedAt; exit status describes local query completion only.
        command: Emit the exact canonical receipt/error/unknown outcome; exit status does not expand operation finality.
        interruptExitCode: 130
      scopeStatus: "OWNER_DEFINED_CLI_SEMANTICS; CLI executable, parser, route, server behavior and channel admission are not established"
      executionAdmission: NOT_ADMITTED
  - id: media.channel.product-integration
    name: Product-to-product integration
