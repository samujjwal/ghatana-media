capabilityChannelAliases:
  status: proposed-vocabulary-normalization; does-not-establish-per-operation-support
  mapping:
    web: media.channel.web
    cli: media.channel.cli
    api: media.channel.api
    embedded: media.channel.embedded
    http-api: media.channel.http-api
    grpc-api: media.channel.grpc-api
    sdk: media.channel.sdk
    product-integration: media.channel.product-integration
  rules:
    - Capability supportedChannels entries are proposal-time vocabulary and normalize only through this map.
    - The api alias is protocol-neutral; it never implies simultaneous HTTP/OpenAPI and gRPC support.
    - The embedded alias means a host-context Media experience; it is not a synonym for product-integration.
    - Channel identity, implementation, qualification, license admission, runtime availability, and owner acceptance remain separate.

channelInvariants:
  - Web, CLI, API, SDK, and product integrations project the same versioned product semantics, authorization, finality, and recovery rules.
  - A view detaching from a long-running request does not mean cancellation; cancellation must use the operation contract and report its certainty.
  - No channel silently weakens privacy, rights, fidelity, cost bounds, or publication review.
  - Unsupported channel/operation combinations remain visible as unsupported or not evaluated; never convert UNKNOWN to AVAILABLE.
  - Proposed Web routes in master-plan section 20.2 are product-view references and not server endpoint claims.

