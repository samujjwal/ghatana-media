schemaVersion: media.phase-schema-bindings.v2
productId: media
authorityStatus: semantic-role-mapping-authored; publication-and-owner-validation-pending
principle: >-
  Media owns all product-specific normative meaning. Tools schemas are assigned by
  their actual contract role, never by legacy phase number. Projections are
  generated from Media authorities, read-only, and remain proposals until the
  relevant owners accept their source semantics and the Tools owner accepts the
  consumer binding.
canonicalPhases:
  - phase: PDP-0
    name: Product Truth
    sourceAuthority: .product-experience/pdp-0-product-truth/
    toolsContracts: [product-definition]
    acceptanceState: P0-001-boundary-slice-only; full-PDP-0-review-pending
  - phase: PDP-1
    name: Canonical Domain and Data
    sourceAuthority: .product-experience/pdp-1-domain-data/
    toolsContracts: []
    bindingDisposition: >-
      No public generic Product Development domain-data contract is currently
      bound. Keep canonical domain/data proposals Media-owned; do not misclassify
      PDP-0 domain observations or force them into the product-definition shape.
    acceptanceState: domain-owner-adjudication-pending
  - phase: PDP-2
    name: Design Language and Interface System
    sourceAuthority: .product-experience/pdp-2-design-interface-system/
    toolsContracts: [experience-language]
    acceptanceState: P1-006-review-and-Shared-binding-pending
  - phase: PDP-3
    name: Complete Product Experience
    sourceAuthority: .product-experience/pdp-3-product-experience/
    toolsContracts: [experience-specification]
    acceptanceState: P2-008-and-runtime-binding-pending
explorerBinding:
  phase: EXPLORER
  outsideCanonicalPhases: true
  sourceAuthority: .product-experience/explorer/
  toolsContracts: [experience-package, experience-explorer-contracts, product-dev-explorer]
  acceptanceState: browser-review-and-owner-binding-pending
toolsContracts:
  product-definition:
    package: '@ghatana/product-definition'
    packagePath: libs/product-development/product-definition
    schemaPath: libs/product-development/product-definition/schemas/product-definition.v1.schema.json
    schemaVersion: ghatana.product-definition.v1
    publicValidator: validateProductDefinition
    sourceProjection: .product-experience/pdp-0-product-truth/generated/product-definition.candidate.json
    sourceAuthorities:
      - .product-experience/pdp-0-product-truth/constitution.yaml
      - .product-experience/pdp-0-product-truth/actors-responsibilities.yaml
      - .product-experience/pdp-0-product-truth/goals-jtbd.yaml
      - .product-experience/pdp-0-product-truth/capabilities.yaml
      - .product-experience/pdp-0-product-truth/requirements.yaml
      - .product-experience/pdp-0-product-truth/domain-model.yaml
      - .product-experience/pdp-0-product-truth/policy-authority-model.yaml
      - .product-experience/pdp-0-product-truth/journey-catalog.yaml
      - .product-experience/pdp-0-product-truth/nonfunctional-requirements.yaml
    role: neutral-shape-projection; media-detail-remains-in-source-authorities
    projectionStatus: generated-candidate; Tools-schema-and-public-validator-blocked-on-required-product-mappings
    publication: not-verified
    ownerConsumerValidation: pending
  experience-language:
    package: '@ghatana/experience-language'
    packagePath: libs/product-development/experience-language
    schemaPath: libs/product-development/experience-language/schemas/experience-language.v1.schema.json
    schemaVersion: ghatana.experience-language.v1
    publicValidator: validateExperienceLanguage
    sourceProjection: .product-experience/pdp-2-design-interface-system/generated/experience-language.candidate.json
    sourceAuthorities:
      - .product-experience/pdp-2-design-interface-system/gui/primitives.yaml
      - .product-experience/pdp-2-design-interface-system/component-contracts.yaml
      - .product-experience/pdp-2-design-interface-system/gui/patterns/catalog.yaml
      - .product-experience/pdp-2-design-interface-system/gui/layout.yaml
      - .product-experience/pdp-2-design-interface-system/gui/templates/catalog.yaml
      - .product-experience/pdp-2-design-interface-system/accessibility.yaml
      - .product-experience/pdp-2-design-interface-system/responsive-adaptive.yaml
      - .product-experience/pdp-2-design-interface-system/localization-content.yaml
      - .product-experience/pdp-2-design-interface-system/media-token-aliases.yaml
    role: reusable-experience-language-projection; semantic-and-Shared-review-pending
    projectionStatus: generated-candidate; Tools-schema-and-public-validator-blocked-on-required-product-mappings
    publication: not-verified
    ownerConsumerValidation: pending
  experience-specification:
    package: '@ghatana/experience-specification'
    packagePath: libs/product-development/experience-specification
    schemaPath: libs/product-development/experience-specification/schemas/experience-specification.v1.schema.json
    schemaVersion: ghatana.experience-specification.v1
    publicValidator: validateExperienceDefinition
    sourceProjection: .product-experience/pdp-3-product-experience/generated/experience-specification.candidate.json
    sourceAuthorities:
      - .product-experience/pdp-3-product-experience/screen-contracts/
      - .product-experience/pdp-3-product-experience/journey-contracts/
      - .product-experience/pdp-3-product-experience/action-registry.yaml
      - .product-experience/pdp-3-product-experience/interaction-registry.yaml
      - .product-experience/pdp-3-product-experience/state-transition-bindings.yaml
      - .product-experience/pdp-3-product-experience/scenario-fixture-registry.yaml
    role: executable-experience-contract-projection; owner-resolvers-required
    projectionStatus: generated-candidate; Tools-schema-and-public-validator-blocked-on-required-product-mappings
    publication: not-verified
    ownerConsumerValidation: pending
  experience-package:
    package: '@ghatana/experience-package'
    packagePath: libs/product-development/experience-package
    schemaPath: libs/product-development/experience-package/schemas/product-experience-manifest.v1.schema.json
    schemaVersion: ghatana.product-experience.v1
    role: Media-owned-product-package-contract-consumed-by-Explorer
    publication: not-verified
    ownerConsumerValidation: pending
  experience-explorer-contracts:
    package: '@ghatana/experience-explorer-contracts'
    packagePath: libs/product-development/experience-explorer-contracts
    role: generic-Explorer-host-contracts
    publication: not-verified
    ownerConsumerValidation: pending
  product-dev-explorer:
    package: '@ghatana/product-dev-explorer'
    packagePath: tools/product-development/explorer
    publicExports: ['.', './headless', './package.json']
    role: generic-host-mechanics; not-Media-product-semantic-authority
    ownerConsumerValidation: local-packed-consumer-observation-only
  lifecycle:
    ownerRepository: ghatana-lifecycle
    role: phase-obligations-evidence-currentness-receipts-and-closure
    publicContract: consumer-defined-phase-obligations-and-proof-producer-bindings
    ownerConsumerValidation: pending
projectionRules:
  generation: scripts/generate-media-phase-projections.mjs
  edits: canonical-source-authorities-only; generated-projections-are-read-only
  validation: actual-public-Tools-schema-and-validator-contracts
  semanticAcceptance: owner-review-and-phase-specific-semantic-coverage-in-addition-to-schema-validation
  currentnessAndClosure: Lifecycle-owner-generated-output-only
  prohibited: [legacy-phase-number-remapping, generic-local-schema-copy, inferred-operation-equivalence, fabricated-acceptance-or-currentness]
gaps:
  - id: GAP-MEDIA-TOOLS-SCHEMA-BINDING
    status: open
    remaining: public-artifact-availability-isolated-consumer-validation-and-Tools-owner-accepted-phase-validator-bindings
    impact: blocks-full-GOV-003-and-PDP-0-through-PDP-3-certification
  - id: GAP-02
    status: open
    remaining: immutable-public-versions-and-artifact-only-consumption-for-Tools-packages
    impact: blocks-target-package-consumption-without-source-workspace-coupling
ownerReviewRequired: true
