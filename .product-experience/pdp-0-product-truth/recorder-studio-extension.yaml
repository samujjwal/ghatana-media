  - bounded-capability-and-codec-qualification-before-run
  - observed-semantic-action-and-finality-or-admitted-unavailable-with-exact-reason
  - rational-media-time-and-source-timestamp-mapping-with-uncertainty
  - inspectable-ai-suggestions-not-executable-unapproved-authority
  - quality-thresholds-per-media-profile-with-abstention-and-real-review-separate
  - configurable-OTel-traces-metrics-safe-logs-and-privacy-redaction
  - per-stage-rights-consent-retention-erasure-and-no-unauthorized-egress
negativeOutcomes:
  - wrong-tenant-or-actor-denied-without-effect
