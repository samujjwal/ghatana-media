channelSurfaceProposals:
  schemaVersion: media.channel-surface-proposals.v1
  status: owner-reviewed-candidate-crosswalk; channel-admission-and-runtime-support-remain-pending
  source: .product-experience/pdp-0-product-truth/applications-channels.yaml
  rule: >-
    Candidate mappings normalize product channel identifiers to surface identifiers for
    contract references only. They do not admit the channel, establish runtime support,
    or replace per-operation and per-consumer owner decisions.
  mappings:
    - channelRef: media.channel.web
      candidateSurfaceRefs: [media.surface.web]
      status: proposal; PDP-0 and PDP-3 acceptance pending
    - channelRef: media.channel.embedded
      candidateSurfaceRefs: [media.surface.embedded]
      status: proposal; host and integrating-product owner review pending
    - channelRef: media.channel.http-api
      candidateSurfaceRefs: [media.surface.public-http]
      status: proposal; API owner and per-operation admission pending
    - channelRef: media.channel.grpc-api
      candidateSurfaceRefs: [media.surface.service-grpc]
      status: aggregate proposal; service-specific owner and RPC mapping pending
    - channelRef: media.channel.sdk
      candidateSurfaceRefs: [media.surface.sdk]
      status: proposal; publication and consumer-compatibility review pending
    - channelRef: media.channel.cli
      candidateSurfaceRefs: [media.surface.cli]
      status: proposal; production CLI admission pending; Explorer fixture commands excluded
    - channelRef: media.channel.product-integration
      candidateSurfaceRefs: [media.surface.integrations]
      status: proposal; each consumer/producer handoff requires owner acceptance
    - channelRef: media.channel.legacy-desktop
      candidateSurfaceRefs: [media.surface.desktop-archive]
      status: historical-only; not an active or supported surface
    - channelRef: media.channel.api
      candidateSurfaceRefs: []
      status: abstract-protocol-neutral-layer; no direct consumer surface; bind only through an admitted concrete transport
