schemaVersion: media.artifact-identities.v1
status: OWNER_APPROVED_IDENTITY_AND_CLASSIFICATION_METADATA_ONLY
purpose: Pinned canonical artifact identity and explicit display-authority classification.
inventoryPolicy:
  locationMetadata: repository-relative paths; moving an artifact updates path only and preserves artifactId.
  identityPolicy: Every artifactId is explicitly pinned in this registry and remains unchanged when its source path moves; the generator never derives semantic identity from path, title, content, or inventory order. Opaque legacy IDs remain stable identifiers, not claims about meaning.
  classificationPolicy: authorityClass is explicitly authored per identity and is not inferred from owningPhase.
  selfExclusion: .product-experience/artifact-identities.yaml is source metadata and is excluded from its own generated artifact inventory.
allowedAuthorityClasses:
  - "CROSS_PHASE_GOVERNANCE"
  - "EXPLORER_PROJECTION"
  - "PRODUCT_TRUTH_AUTHORITY"
  - "DOMAIN_DATA_AUTHORITY"
  - "DESIGN_INTERFACE_AUTHORITY"
  - "PRODUCT_EXPERIENCE_AUTHORITY"
manifestProjection:
  path: ".product-experience/source-manifest.yaml"
  artifactId: "ART-MEDIA-SOURCE-MANIFEST"
  authorityClass: "CROSS_PHASE_GOVERNANCE"
records:
