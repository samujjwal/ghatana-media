schemaVersion: media.explorer-tools-binding.v1
productId: media
status: EXTERNAL_PACKAGE_AND_OWNER_REVIEW_PENDING
owner: ghatana-tools
purpose: >-
  Declare the reusable Tools Product/Experience mechanics and generic Explorer
  host boundary for Media without copying their contracts or treating local
  browser behavior as native Explorer evidence. Cross-repository closure,
  evidence admission, currentness, receipts, and convergence belong to
  ghatana-lifecycle.
hostPackage: '@ghatana/product-dev-explorer'
sourceContracts:
  sourceReview: VERIFIED
  packageArtifactResolution: LOCAL_PACKED_ARTIFACTS_TESTED; registry-publication-not-verified
  mediaPackageConsumer: LOCAL_PACKED_API_TESTED
  cleanMediaInstall: NOT_VERIFIED
  packages:
    - packageId: '@ghatana/product-definition'
      version: 0.1.0-SNAPSHOT
      role: normative-product-truth-contract
    - packageId: '@ghatana/experience-language'
      version: 0.1.0-SNAPSHOT
      role: presentation-interaction-responsive-accessibility-and-product-owned-binding-contracts
    - packageId: '@ghatana/experience-specification'
      version: 0.1.0-SNAPSHOT
      role: experience-view-journey-interaction-state-transition-action-and-effect-contracts
    - packageId: '@ghatana/experience-package'
      version: 0.1.0-SNAPSHOT
      role: runtime-package-context-session-render-dispatch-effect-and-inspection-contracts
    - packageId: '@ghatana/experience-explorer-contracts'
      version: 0.1.0-SNAPSHOT
      role: explorer-headless-state-package-loader-workspace-inspection-and-diagnostics-contracts
    - packageId: '@ghatana/product-dev-explorer'
      version: 0.1.0-SNAPSHOT
      role: standalone-headless-explorer-library-not-a-media-browser-host
    - packageId: '@ghatana/development-traceability'
      version: 0.1.0-SNAPSHOT
      role: product-development-source-projectors-for-documentation-model-graph
requiredBindings:
  - product-picker-and-coordinate: ghatana.product/media
  - source-manifest-consumer: .product-experience/source-manifest.yaml
  - phase-verification: NOT_VERIFIED_IN_NAMED_EXPLORER_PACKAGES
  - traceability-projection: '@ghatana/development-traceability@0.1.0-SNAPSHOT'
  - traceability-graph: '@ghatana/documentation-model (graph construction and resolution; not owned by development-traceability)'
  - render-inspect-dispatch: '@ghatana/experience-package contract consumed by the headless Explorer library'
localProjection:
  path: apps/media-experience-explorer/
  status: LOCAL_ONLY
  semanticAuthority: false
  mediaPackageAdapter: libs/media-experience-simulation/src/product-experience-package.ts
  toolsConsumerBridge: apps/media-experience-explorer/src/tools-consumer.ts
  packedArtifactProof: tests/tools-media-consumer.test.mjs
  browserHostIntegration: DEDICATED_TOOLS_REVIEW_ROUTE; PRODUCT_AND_EXPLORE_HOST_REMAINS_MEDIA_OWNED
  receiptAuthority: ghatana-lifecycle-owner-workflow
  currentnessAuthority: ghatana-lifecycle-owner-generated-currentness
explicitNonClaims:
  - local packed-artifact API testing does not verify registry publication, normal Media workspace lockfile resolution, or installation from the configured registry
  - the Vite client exposes a dedicated Tools Review route that runs the consumer bridge; the existing Product/Explore modes are still Media-owned and are not admitted through the generic Tools host
  - the local Tools API proof does not claim owner acceptance or a completed Lifecycle binding
  - the headless product-dev-explorer library is not the Media-owned Vite browser host
  - development-traceability projects source models and does not implement graph construction or resolution
  - named source packages do not establish Media phase-verification support or host admission
  - the local Tools Review route does not establish production host integration, canonical presentation identity, or representation admission
  - deterministic simulation does not prove runtime qualification
  - pending currentness is not a generated receipt
