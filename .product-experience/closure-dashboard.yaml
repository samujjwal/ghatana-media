- id: cross-artifact-consistency
  intent: References, dependencies, shared concepts, and downstream projections agree with their owning phase authorities.
- id: owner-and-specialist-review
  intent: Required product, domain, Shared/platform, and independent reviewers have adjudicated their assigned scope.
- id: verification-evidence
  intent: Applicable schema, semantic, behavioral, accessibility, interface, and projection checks have reviewable evidence.
- id: lifecycle-currentness-and-closure
  intent: Lifecycle has admitted evidence, resolved dependencies/currentness, and issued a current phase closure result.
