schemaVersion: media.journey-contract.v1
productId: media
journeyId: J-02
title: Upload or import, inspect, and verify a usable artifact
status: proposal; upload-policy-and-public-contract-review-pending
scope: accept-one-authorized-source-as-an-immutable-verified-artifact-version; processing-and-external-delivery-are-outside-this-journey
outcomes: [media.goal.understand-media, media.goal.preserve-source, media.goal.resolve-safely]
actors: [media.creator, media.editor]
intent: media.intent.understand
channels: [media.channel.web, media.channel.http-api, media.channel.sdk]
preconditions:
  - Resolve the current principal, workspace, and any selected project before exposing or mutating protected artifact data.
  - Recheck upload/import authority, source purpose, rights, consent, retention, and applicable policy at admission and commit boundaries.
  - Accept only an owner-admitted source path, media type, and bounded transfer contract; browser filename and extension checks are advisory only.
  - Keep artifact bytes and immutable artifact identity separate from a project-specific MediaAsset attachment.
steps:
  - view: media.view.browse-media
    result: show-only-currently-authorized-artifact-versions-and-an-admitted-import-entry-point
  - view: media.view.import-media
    action: media.action.begin-artifact-upload
    result: one-stable-upload-identity-is-established-and-only-acknowledged-transfer-progress-is-reported
  - view: media.view.import-media
    action: media.action.resume-artifact-upload
    when: an-existing-upload-is-interrupted-and-its-identity-source-metadata-and-current-authority-still-match
    result: resume-the-matching-upload-or-explain-why-it-cannot-resume; never-create-a-duplicate-from-an-unknown-result
  - view: media.view.inspect-job
    when: the-owner-contract-returns-a-stable-job-identity-for-asynchronous-integrity-or-format-verification
    result: show-the-existing-verification-job-and-finality; do-not-label-a-transfer-id-as-a-processing-job
  - view: media.view.inspect-media
    action: media.action.inspect-artifact
    when: the-artifact-state-is-AVAILABLE-or-an-authorized-review-is-required
    result: show-the-exact-artifact-version-integrity-state-and-separately-recorded-policy-dispositions
optionalContinuation:
  action: media.action.attach-source-asset
  boundary: attachment-creates-a-project-specific-reference-to-an-existing-immutable-artifact-version; it-does-not-copy-or-change-source-bytes
terminalSuccess: The original bytes remain identifiable and one artifact version is AVAILABLE only after expected size, part integrity, full digest, format, and required policy checks are recorded; available technical metadata may remain explicitly unknown.
criticalNonhappyPaths:
  - id: upload-interrupted
    response: preserve-the-stable-upload-identity-and-confirmed-parts; offer-resume-only-after-current-authority-and-source-match-are-rechecked
  - id: upload-checksum-mismatch
    response: keep-the-artifact-unavailable-until-the-owner-policy-records-rejection-or-quarantine; explain-that-integrity-was-not-confirmed
  - id: unsupported-format
    response: do-not-promote-or-parse-the-content; show-the-admitted-format-limitation-and-a-safe-return
  - id: quarantine-review
    response: hold-new-reads-and-processing; route-only-to-an-authorized-review-outcome
  - id: upload-outcome-unknown
    response: inspect-the-same-stable-upload-identity-before-offering-any-new-upload
  - id: permission-revoked
    response: stop-accepting-new-parts; retain-or-expire-partial-data-under-the-recorded-policy-and-report-the-actual-state
  - id: no-network
    response: disclose-that-server-receipt-is-unavailable; do-not-report-client-buffered-bytes-as-uploaded
recovery: Preserve the source name, selected project target, stable upload identity, server-acknowledged parts, integrity state, and return destination; unknown finality requires inspection of the same upload identity before any successor request.
contextPreserved: [selected-workspace, selected-project-target-when-present, source-name, stable-upload-identity, acknowledged-transfer-progress, integrity-disposition, next-inspection-action]
channelEquivalents: [web, http-api, sdk]
accessibilityRef: .product-experience/phase-1-design-language/accessibility.yaml
requiredScenarioBehaviors:
  status: seven-metadata-only-Phase-3-fixtures-authored; actual-transfers-and-runtime-contracts-remain-unimplemented
  scenarios:
    - media.scenario.upload-interrupted
    - media.scenario.upload-checksum-mismatch
    - media.scenario.upload-format-unsupported
    - media.scenario.upload-quarantined
    - media.scenario.upload-verified-available
    - media.scenario.upload-outcome-unknown
    - media.scenario.upload-permission-revoked
  verificationJobScenarios:
    status: three-synthetic-job-fixtures-authored; owner-issued-verification-contract-remains-unbound
    scenarios:
      - media.scenario.artifact-verification-running
      - media.scenario.artifact-verification-outcome-unknown
      - media.scenario.artifact-verification-completed
scenarioRefs: [media.scenario.upload-interrupted, media.scenario.upload-checksum-mismatch, media.scenario.upload-format-unsupported, media.scenario.upload-quarantined, media.scenario.upload-verified-available, media.scenario.upload-outcome-unknown, media.scenario.upload-permission-revoked]
unresolvedProductDecisions:
  - exact-supported-source-formats-and-size-or-duration-bounds-remain-with-the-media.artifact.upload-owner-and-qualified-public-contract
  - external-provider-imports-and-progressive-transfer-limits-require-an-admitted-source-integration-and-rights-policy
  - exact-upload-resumption-and-integrity-wire-fields-remain-pending-P0-003-owner-review-and-GAP-05-public-route-binding
