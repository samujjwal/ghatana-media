schemaVersion: media.journey-contract.v1
productId: media
journeyId: J-03
title: Transcribe an audio recording and correct captions
status: proposal; all-upstream-acceptance-and-role-review-pending
laneRef: .product-experience/lanes/transcribe-and-correct-captions.yaml
scope: selected-audio-source-slice-of-J-03; video-transcription-and-video-audio-extraction-remain-out-of-scope
outcomes: [media.goal.understand-media, media.goal.review-trustworthy-output]
actors: [media.creator, media.editor, media.reviewer]
intent: media.intent.understand
preconditions:
  - One exact audio source artifact version is available to the actor; video sources are not executable in this lane.
  - Current authority, rights, consent, and processing-location policy allow the requested operation.
  - A language intent is provided; locale support is evaluated by an admitted runtime, not inferred from this fixture.
steps:
  - view: media.view.select-source
    action: media.action.choose-source
    result: exact-source-version-is-bound-to-the-workflow
  - view: media.view.monitor-transcription
    action: media.action.request-transcription
    result: stable-job-identity-and-current-state-are-returned
  - view: media.view.monitor-transcription
    action: media.action.inspect-job
    result: progress-and-finality-reflect-owning-job-state
  - view: media.view.review-transcript
    action: media.action.review-transcript
    result: recognition-and-alignment-uncertainty-remain-visible
  - view: media.view.correct-captions
    action: media.action.correct-caption
    result: a-draft-caption-version-links-to-the-exact-source-and-parent
  - view: media.view.correct-captions
    action: media.action.align-caption-timing
    result: caption-time-is-corrected-on-the-source-media-clock
  - view: media.view.correct-captions
    action: media.action.save-caption-version
    result: an-authorized-immutable-caption-version-is-created-or-the-action-is-blocked
  - view: media.view.compare-caption-versions
    action: media.action.compare-caption-versions
    result: text-timing-and-source-version-differences-are-shown-without-approving-either-version
terminalSuccess: A reviewable caption version is linked to the exact source and carries timing, language, provenance, and the recorded authority/finality disposition.
criticalNonhappyPaths:
  - id: language-uncertain
    response: keep-result-review-required; permit correction only under current policy; do not claim confidence.
  - id: timing-missing
    response: identify missing alignment and permit explicit correction; do not infer exact timing.
  - id: consent-revoked
    response: block new processing and reconcile in-flight work under the owning lifecycle; retain necessary evidence.
  - id: provider-outcome-unknown
    response: retain the same job identity; disable resubmission; reconcile or route to operator review.
  - id: source-version-changed
    response: preserve draft and mark its parent stale; require explicit rebase or restart.
recovery: Every recovery preserves the source and completed output; retry requires a classified safe state and a fresh policy check.
contextPreserved: [project, source-artifact-version, source-time, language-intent, job-identity, transcript-version, caption-draft-version]
channelEquivalents: [web, cli, grpc-api, sdk]
accessibilityRef: .product-experience/phase-1-design-language/accessibility.yaml
