schemaVersion: media.journey-contract.v1
productId: media
journeyId: J-19
phase0JourneyRef: J-19
phase0Authority: .product-experience/phase-0-product-truth/journey-catalog.yaml
title: Inspect quality and run bounded optimization
status: phase0-grounded-proposal; phase2-action-state-scenario-channel-and-owner-bindings-pending; not-accepted
scope: Phase 0 outcome and ordered view intents mapped to the Phase 2 screen registry; exact action/state transitions,
  per-channel behavior, scenarios, wire bindings, and runtime commitments remain unresolved.
outcomes:
- media.goal.improve-with-disclosure
- media.goal.preserve-source
actors:
- media.creator
- media.editor
- media.reviewer
channels:
- media.channel.web
channelBindingState: Phase 0 proposed channels only; per-channel operation, state, transport, and accessibility
  equivalence remain unbound.
preconditions:
- Applicable metrics, thresholds, budget, stop conditions, and protected properties are defined.
steps:
- view: media.view.review-quality
  legacyViewRef: M-QUALITY
  screenContractRef: screen-contracts/review-quality.yaml
  viewIntent: Applicable dimensions, abstentions, defects and repair plan
  actionRef: null
  actionBindingState: journey-specific-action-binding-pending; candidate-refs-come-from-screen-contract-only
  stateRefs: []
  stateBindingState: pending-owner-bound-state-reference-and-transition
  candidateActionRefs:
  - media.action.inspect-provenance
- view: media.view.review-creation-plan
  legacyViewRef: M-PLAN
  screenContractRef: screen-contracts/review-creation-plan.yaml
  viewIntent: Proposed graph, estimates, material decisions and validation
  actionRef: null
  actionBindingState: journey-specific-action-binding-pending; candidate-refs-come-from-screen-contract-only
  stateRefs: []
  stateBindingState: pending-owner-bound-state-reference-and-transition
  candidateActionRefs: []
- view: media.view.compare-results
  legacyViewRef: M-COMPARE
  screenContractRef: screen-contracts/compare-results.yaml
  viewIntent: Before/after, candidate ranking and applicable measurements
  actionRef: null
  actionBindingState: journey-specific-action-binding-pending; candidate-refs-come-from-screen-contract-only
  stateRefs: []
  stateBindingState: pending-owner-bound-state-reference-and-transition
  candidateActionRefs:
  - media.action.compare-caption-versions
  - media.action.inspect-provenance
- view: media.view.prepare-render
  legacyViewRef: M-RENDER
  screenContractRef: screen-contracts/prepare-render.yaml
  viewIntent: Snapshot/profile, validation, cost and submission
  actionRef: null
  actionBindingState: journey-specific-action-binding-pending; candidate-refs-come-from-screen-contract-only
  stateRefs: []
  stateBindingState: pending-owner-bound-state-reference-and-transition
  candidateActionRefs: []
stepBindingRule: The ordered view path is sourced from Phase 0 and each legacy view maps to one registered intent-based
  screen. Null actionRef and empty stateRefs are deliberate open bindings, not no-op actions or completed transitions.
terminalSuccess: User selects or declines a measurable successor candidate with estimated/reconstructed properties
  disclosed.
criticalNonhappyPaths:
- id: phase0-critical-exception
  condition: Metric abstention, no improvement, incorrect metric domain, exhausted budget, or attempted fidelity
    downgrade.
  responseIntent: Follow the Phase 0 recovery intent; exact per-condition state, copy, and action bindings remain
    pending.
recovery: Stop at declared bound, preserve best valid candidate and source, and expose next permitted action.
contextPreserved:
- Retain metric version/scope, candidate fingerprint, budget consumed, and previous accepted quality.
channelEquivalents:
- web
accessibilityIntentRef: media.a11y.baseline
requiredScenarioBehaviors:
  status: scenario-fixtures-and-owner-approved-expected-results-pending
  successIntent: User selects or declines a measurable successor candidate with estimated/reconstructed properties
    disclosed.
  criticalNonhappyIntent: Metric abstention, no improvement, incorrect metric domain, exhausted budget, or attempted
    fidelity downgrade.
scenarioRefs: []
unresolvedProductDecisions:
- Bind each view transition to an owner-approved action, state, and finality contract; no action identifier or state
  transition is inferred by this proposal.
- Define equivalent behavior, authority, transport, recovery, and accessibility for each proposed channel.
- Author deterministic fixtures with owner-approved expected results for success, critical exceptions, recovery,
  and preserved context.
- Complete capability bounds, wire/API/CLI contracts where applicable, and required named-owner and independent
  review before Phase 2 acceptance.
