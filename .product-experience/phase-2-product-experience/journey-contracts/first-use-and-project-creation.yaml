schemaVersion: media.journey-contract.v1
productId: media
journeyId: J-01
title: First use, authentication, context, and project creation
status: proposal; upstream-acceptance-and-role-review-pending
scope: create-an-empty-versioned-project-in-an-authorized-workspace; media-processing-and-output-delivery-remain-outside-this-journey
outcomes: [media.goal.finished-asset, media.goal.resolve-safely, media.goal.preserve-source]
actors: [media.creator, media.administrator, media.editor, media.operator]
intent: media.intent.restore-project
channels: [media.channel.web]
preconditions:
  - Resolve an authenticated principal and authorized tenant/workspace through the admitted Shared identity contract before showing protected project data.
  - Project creation requires current project-scoped authority; actor and responsibility-role labels do not grant permission.
  - No source media, provider, model, engine, or processing request is required to create an empty project.
steps:
  - view: media.view.authenticate-and-select-context
    handoff: media.handoff.identity
    result: current-principal-and-authorized-workspace-are-resolved-or-a-recoverable-access-state-is-shown
  - view: media.view.resume-work
    result: authorized-projects-or-a-purposeful-first-use-state-are-shown; no-cross-tenant-project-data-is-visible
  - view: media.view.find-projects
    action: media.action.create-project
    result: a-new-empty-project-is-created-only-after-current-authority-and-the-project-request-are-validated
  - view: media.view.work-in-project
    result: the-exact-project-identity-and-version-are-visible-with-a-safe-next-action
optionalContinuation:
  view: media.view.create-media
  intentSelectionAction: media.action.choose-intent
  planReviewView: media.view.review-creation-plan
  boundary: J-01-completes-after-project-creation; selecting-a-processing-intent-or-submitting-work-belongs-to-its-own-journey-and-action
terminalSuccess: An authorized creator has a versioned empty project in the selected workspace and can see a safe next action without selecting a provider, model, queue, or engine.
criticalNonhappyPaths:
  - id: identity-not-established
    response: preserve-the-return-destination; do-not-read-protected-project-data-or-accept-protected-inputs-before-the-identity-handoff-succeeds
  - id: workspace-access-denied
    response: keep-project-data-hidden; explain-the-access-boundary-and-return-to-the-same-destination-after-approved-access-is-granted
  - id: project-create-not-authorized
    response: keep-the-project-list-and-workspace-context; explain-the-required-access-without-claiming-creation
  - id: project-create-outcome-unknown
    response: keep-the-same-create-request-identity; inspect-or-reconcile-its-result-before-offering-another-create-action
  - id: requested-intent-unavailable
    response: keep-the-empty-project; explain-that-the-intent-is-not-admitted-here-and-offer-only-an-admitted-alternative-or-a-safe-return
recovery: Preserve the return destination, selected workspace, and any non-sensitive intent draft across re-authentication; never infer successful project creation from a lost response or retry an unknown effect blindly.
contextPreserved: [return-destination, selected-workspace, selected-project-identity-and-version, selected-intent-when-present]
channelEquivalents: [web]
accessibilityRef: .product-experience/phase-1-design-language/accessibility.yaml
requiredScenarioBehaviors:
  status: six-synthetic-Phase-3-fixtures-authored; Shared-identity-and-project-service-bindings-pending
  scenarios:
    - media.scenario.first-use-empty
    - media.scenario.identity-required
    - media.scenario.workspace-access-denied
    - media.scenario.project-create-outcome-unknown
    - media.scenario.project-created-empty
    - media.scenario.intent-unavailable
scenarioRefs: [media.scenario.first-use-empty, media.scenario.identity-required, media.scenario.workspace-access-denied, media.scenario.project-create-outcome-unknown, media.scenario.project-created-empty, media.scenario.intent-unavailable]
unresolvedProductDecisions:
  - project-creation-input-shape-and-name-generation-policy-remain-pending-the-media.project.create-leaf-owner-review
  - exact-authentication-return-and-access-request-bindings-remain-pending-the-published-Shared-identity-consumer-contract
