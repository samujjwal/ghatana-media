intentRef: media.intent.edit
purpose: compare source-linked caption versions before deciding how to continue the editing workflow
contextGoalNowNext:
  context: Exact source version, prior caption version, candidate caption version, and their provenance.
  goal: Understand textual, timing, and limitation differences.
  now: Show aligned differences and the evidence used to produce the candidate.
  next: Continue caption correction or leave the comparison; review approval is outside this lane.
anatomy:
- source-time-selection
- prior-version
- candidate-version
- text-differences
- timing-differences
- provenance
- next-action
states:
- comparable
- partial-comparison
- source-version-mismatch
- unavailable
actions:
- media.action.inspect-provenance
- media.action.compare-caption-versions
validation: Versions must share a declared source or show the mismatch; comparison does not equal approval.
recovery: Retain both immutable versions; return to correction without discarding the current selection.
responsive: stack-prior-and-candidate-at-narrow-widths-with-time-selection-retained
accessibility: differences-have-textual-and-structural-representation
