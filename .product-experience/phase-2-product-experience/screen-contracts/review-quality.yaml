validation: No overall pass when a material dimension is unassessed; recommendations are not applied changes; metrics
  identify method, scope, and qualification.
recovery: Retain abstentions and contradictory observations; offer manual review; do not convert unavailable evidence
  to a pass.
responsive: Lead with target version, material defects, and abstentions; let people open methodology and supporting
  evidence.
accessibility: List metrics and abstentions semantically; provide units, methods, and limitations in text; use no
  color-only pass/fail.
