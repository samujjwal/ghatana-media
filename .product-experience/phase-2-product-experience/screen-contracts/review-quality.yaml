purpose: Applicable dimensions, abstentions, defects and repair plan
contextGoalNowNext:
  context: An exact candidate version, applicable quality dimensions, methods and evidence, abstentions, and bounded
    repair options.
  goal: Decide what the evidence supports about this version and whether further review or repair is needed.
  now: Show assessed and unassessed dimensions, metric basis and units, evidence, defect scope, and recommendation
    limits.
  next: Inspect supporting evidence, compare an exact candidate, or review a bounded repair plan.
