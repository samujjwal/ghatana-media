validation: Possession, provenance, or a filename never grants rights; scope and evidence freshness are explicit;
  only assigned authority records decisions.
recovery: Block affected use when evidence is unknown, expired, or revoked; preserve the decision trail and direct
  the person to the responsible owner.
responsive: Keep the effective decision and scope at the top; group evidence, retention, and remediation below.
accessibility: State denied, unknown, expired, and revoked conditions in text; make evidence source, scope, and
  date available to screen readers.
