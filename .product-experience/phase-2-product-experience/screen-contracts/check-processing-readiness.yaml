- ready
- degraded
- unavailable
- stale-observation
- recovery-required
- access-denied
actions: []
actionBindingState: intent-bindings-pending
actionIntents:
- inspect readiness for a declared operation
- refresh a read-only check
- open an authorized recovery instruction
channelDispositions:
- channelRef: media.channel.web
  disposition: baseline-view-contract-proposal
- channelRef: media.channel.cli
  disposition: command-counterpart-not-bound
- channelRef: media.channel.api
