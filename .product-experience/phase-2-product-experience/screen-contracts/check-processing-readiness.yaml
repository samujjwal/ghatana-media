- channelRef: media.channel.embedded
  disposition: host-rendering-and-focus-contract-not-bound
validation: Readiness is scoped and time-bound; does not expose credentials or raw sensitive diagnostics; never
  promises successful processing.
recovery: Keep the diagnostic scope and timestamp; offer only owner-authorized recovery steps; record when a check
  is stale.
responsive: Show readiness summary and stale/degraded state first; expand dependency details progressively.
accessibility: Use a semantic list of checks with text state, scope, and observation time; announce refresh completion
  once.
