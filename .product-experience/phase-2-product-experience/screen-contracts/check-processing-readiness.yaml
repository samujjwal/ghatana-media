intentRef: media.intent.check-processing-readiness
purpose: Safe diagnostics, capacity/recovery/erasure and audit access
contextGoalNowNext:
  context: A permitted readiness scope, operation or dependency identifier, time of observation, and safe recovery
    evidence.
  goal: Diagnose whether a declared operation is currently ready and what authorized recovery is available.
  now: Show scoped checks, freshness, capacity or dependency limits, and safe next steps without exposing secrets
    or private data.
  next: Retry a read-only diagnostic, open an approved recovery action, or refer to the responsible operator.
anatomy:
- readiness-scope
- observation-time-and-freshness
- check-results
- capacity-and-dependency-disposition
- safe-recovery-guidance
- audit-reference
