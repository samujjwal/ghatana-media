- media.editor
intentRef: media.intent.understand
purpose: select one authorized source artifact version for speech understanding
contextGoalNowNext:
  context: Project and source candidates visible to the current user.
  goal: Select a verified source version for transcription and caption review.
  now: Show source identity, version, media kind, integrity, and rights disposition.
  next: Continue only when source access and processing policy allow it.
anatomy:
- project-context
- source-search
- source-list
- source-version
- integrity-status
- rights-summary
- choose-action
states:
- empty
- loading
- source-available
- source-verifying
- source-quarantined
- permission-denied
- offline
actions:
- media.action.choose-source
- media.action.inspect-source
validation: Require one exact audio source version for this lane; video sources remain visible but unavailable until
  audio extraction and source-time mapping are admitted. Do not infer authorization from a file name or fixture.
recovery: Preserve search and project context; explain re-authentication, quarantine review, or a safe alternate
  source.
responsive: use-typography-layout-and-responsive-variants; preserve-source-selection
accessibility: labelled-search-and-list; keyboard-selection; source-state-is-not-color-only
localization: Localize human-readable labels and explanations; preserve canonical IDs, reason codes, raw timestamps, measurements, and object identity; format dates, numbers, units, and plurals by locale without changing stored values.
