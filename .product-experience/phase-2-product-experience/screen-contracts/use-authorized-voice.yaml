validation: Voice possession is not consent; scope includes operation and use; revocation and retention effects
  are explicit; no voice identity is inferred.
recovery: When evidence is unavailable or revoked, block the operation and explain the authorized remediation path;
  do not reuse a cached permission.
responsive: Put decision, scope, and expiry/revocation state first; show the evidence chain in a separate disclosure.
accessibility: Announce blocked or revoked use in text; make evidence and scope readable without relying on an icon
  or badge.
