validation: Show source time separately from output time; mark estimates and continuity observations by evidence
  basis; a completed job does not prove quality or rights.
recovery: Keep the same job identity to view status, request a stop, and check its outcome; do not offer blind retry
  for unknown finality.
responsive: Use a focused job/candidate view; preserve source version, timebase, and job finality while secondary
  controls collapse.
accessibility: Provide keyboard access to temporal controls and semantic candidate summaries; expose progress only
  when measured and throttle announcements.
