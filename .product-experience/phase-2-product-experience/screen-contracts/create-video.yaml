purpose: Generation strategy, controls, progress and alternatives
contextGoalNowNext:
  context: The requested video outcome, source/reference versions, temporal controls, and generation job.
  goal: Plan and review a video-generation request with explicit temporal scope and limitations.
  now: Show admitted inputs and controls, expected duration/frame scope, continuity evidence, estimates, and job
    finality.
  next: Edit the plan, inspect candidates, or check an uncertain job outcome before any new request.
