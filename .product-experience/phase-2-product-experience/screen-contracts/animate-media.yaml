purpose: Timeline/keyframes/curves/rig/path/control actions
contextGoalNowNext:
  context: A versioned animation scene, selected track and keyframe, exact timebase, curve state, and simulation/model
    binding when used.
  goal: Create or edit animation with explicit temporal, spatial, and version controls.
  now: Show tracks, keyframes, interpolation curves, selected values, constraints, and the origin of driven motion.
  next: Edit a selected value or curve, review playback, or save a versioned change.
