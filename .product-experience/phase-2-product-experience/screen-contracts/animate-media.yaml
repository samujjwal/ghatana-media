validation: Driven motion identifies its source; simulation output is labeled; exact time and values are available;
  unsupported interpolation is not silently approximated.
recovery: Preserve keyframes and version history; surface constraint conflicts before applying changes; allow undo
  without losing identity.
responsive: Focus on a selected track and inspector; keep exact time, selected keyframe, and playback controls reachable.
accessibility: Expose semantic track/keyframe tables and numeric curve values; keyboard selection, insert/remove,
  undo/redo; respect reduced motion.
