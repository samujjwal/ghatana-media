intentRef: media.intent.resolve-job
purpose: inspect-one-existing-job-and-choose-a-safe-next-action
contextGoalNowNext:
  context: Stable job identity, exact source version when applicable, current authority, attempt state, and observed
    finality.
  goal: Reattach to existing long-running work and understand its current evidence.
  now: Show the job and source identities separately, preserve attempt state and finality, and expose only measured
    progress.
  next: Continue observing, request cancellation, or reconcile the same job when its outcome is unknown.
anatomy:
- job-identity
- source-version-when-applicable
- job-state
- attempt-state-when-authorized
- measured-progress-when-reported
- finality
- safe-next-action
states:
- queued
- running
- cancellation-pending
- completed
- partially-succeeded
- failed
- outcome-unknown
- reconciling
- cancelled
actions:
- media.action.inspect-job
- media.action.request-cancellation
- media.action.reconcile-job
observation:
  detaching: stop-watching-only-changes-the-current-view; it-does-not-cancel-or-delete-the-job
  reattachment: use-the-same-stable-job-identity-and-read-current-owner-evidence
  progress: omit-when-not-measured; never-infer-progress-from-elapsed-time-or-state
  cancellation: report-a-request-as-pending-until-owner-confirmation-or-a-racing-result
  uncertainOutcome: inspect-or-reconcile-the-existing-job; do-not-blindly-resubmit
  retry: no-retry-action-is-admitted-by-this-local-slice
responsive: identity-state-and-finality-precede-secondary-details; actions-wrap-without-horizontal-overflow
accessibility: announce-state-change-once; label-cancellation-pending; stop-watching-is-distinct-from-cancellation
