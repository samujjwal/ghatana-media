- uploadId-is-separate-and-present-only-when-returned
- cancellation-request-is-not-cancelled-finality
- detaching-observation-does-not-change-job-state
- unknown-outcome-retains-the-same-job-identity-until-reconciliation
validation: Job finality is separate from attempt state and related upload/artifact lifecycle; progress is shown
  only when owner evidence measures it.
recovery: Inspection is observational; cancellation remains pending until owner confirmation; reconcile the same
  job before retry; detaching a watcher never cancels work.
localization: Localize human-readable copy and date/number/unit formatting by admitted locale; keep canonical IDs,
  stored values, reason codes, and command/API keys stable. Unsupported locale behavior remains explicit.
