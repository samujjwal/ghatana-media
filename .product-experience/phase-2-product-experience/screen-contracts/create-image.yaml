validation: A listed control is not necessarily supported; references remain tied to exact versions; generated results
  are distinct from source artifacts.
recovery: Preserve the request identity on unknown outcome; reconcile before retry; disclose omitted or failed candidates.
responsive: Keep request summary, blocking state, and the primary safe action visible; stack candidate details below.
accessibility: Label all controls and candidate thumbnails with text alternatives; expose unsupported controls and
  uncertainty without color.
