contextGoalNowNext:
  context: An immutable artifact or composition version, reviewer scope, existing comments, and current approval
    state.
  goal: Record a scoped review decision on the exact version and require review again if material content changes.
  now: Show version identity, review scope, policy and rights status, prior decisions, and the evidence available
    to this reviewer.
  next: Comment, approve, reject, request changes, or defer when the reviewer has the authority for that decision.
