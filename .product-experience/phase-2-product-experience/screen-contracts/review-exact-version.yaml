validation: Decision binds to an immutable version and stated scope; changing material content creates a new review
  requirement; reviewer authority is explicit.
recovery: Keep comments and decision history attached to their version; revoke or reopen approval when authority
  or content changes.
responsive: Show version and review scope before comments; keep the decision state and authorized actions visible.
accessibility: Use labeled form fields and a semantic comment history; announce decision result and return focus
  to the version heading.
