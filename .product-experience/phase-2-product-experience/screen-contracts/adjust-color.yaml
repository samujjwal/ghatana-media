purpose: Input/output color interpretation and shot matching
contextGoalNowNext:
  context: An exact source or candidate version, input/output color interpretation, selected region/shot, and grading
    revision.
  goal: Review and adjust color within declared color-space and output-profile constraints.
  now: Show input interpretation, target gamut/transfer function, measured or authored adjustments, and shot-matching
    basis.
  next: Edit a bounded adjustment, compare against the source, or save a new color revision.
