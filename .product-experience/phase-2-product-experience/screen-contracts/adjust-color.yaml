validation: Do not assume color space from a file name; state conversion and gamut tradeoffs; distinguish subjective
  grade from measured signal.
recovery: Keep the original source and grade revision; if target interpretation is unknown, block export and explain
  the missing evidence.
responsive: Focus on one shot with persistent input/target labels; stack controls and measurement details below
  preview.
accessibility: Expose adjustment values and color-space names as text; do not use color chips alone; provide keyboard
  numeric controls.
