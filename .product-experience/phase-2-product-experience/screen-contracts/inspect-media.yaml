purpose: inspect one exact artifact version, its integrity evidence, metadata, and separately governed lifecycle
contextGoalNowNext:
  context: Authorized artifact identity, immutable version, workspace, and project reference when one exists.
  goal: Decide whether this exact artifact version is verified, usable, under review, or unavailable.
  now: Show recorded digest/size/media type/technical descriptors with explicit unknown states and current policy
    dispositions.
  next: Attach the exact available version to an authorized project or return to the library without changing its
    bytes.
