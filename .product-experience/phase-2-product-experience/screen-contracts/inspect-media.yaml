- media.action.inspect-artifact
- media.action.attach-source-asset
validation: Artifact identity and bytes are immutable; technical metadata may be unknown; authorization, rights,
  retention, and project membership remain separate facts.
recovery: Preserve the exact version selection and return destination; refresh only after access is confirmed; never
  turn an unknown digest or quarantine into a usable source.
responsive: Keep artifact version and integrity disposition together; previews and secondary metadata may stack
  below the safe action.
accessibility: preview-has-a-text-equivalent-when-content-is-presented; metadata-state-is-explicit; integrity-and-rights-are-not-color-only
