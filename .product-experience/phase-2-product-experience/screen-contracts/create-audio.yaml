validation: Distinguish generated, transformed, and source audio; label target levels separately from measurements;
  preserve stem and mix provenance.
recovery: Retain the exact mix revision and job identity; check an unknown outcome before another submission.
responsive: Show one selected track or bus at a time and keep source identity, units, and output state visible.
accessibility: Offer numeric alternatives to faders and time selections; expose measurements, units, and clipping
  as structured text.
