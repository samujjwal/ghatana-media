intentRef: media.intent.simulate
purpose: Initial conditions, domain fidelity, time control and instruments
contextGoalNowNext:
  context: A declared simulation model and revision, initial conditions, units, timebase, fidelity evidence, and
    output measurements.
  goal: Explore a simulation and inspect its results only within a stated domain and fidelity boundary.
  now: Show model, initial conditions, parameter units/ranges, time control, qualified domain, and output status.
  next: Correct inputs, review fidelity evidence, or submit only after explicit validation and authorization.
