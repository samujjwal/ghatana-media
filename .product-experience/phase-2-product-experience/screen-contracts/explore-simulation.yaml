validation: Simulation is not observation of reality; units and coordinate/time bases are explicit; qualification
  claims are limited to their evidence scope.
recovery: Keep the exact model and run identity; reconcile unknown state; disclose partial outputs and avoid blind
  rerun.
responsive: Use grouped parameter forms and measurement tables; pin run state, units, and fidelity label.
accessibility: Provide numeric keyboard controls and structured output tables with units and timestamps; plots have
  text equivalents.
