contextGoalNowNext:
  context: An exact source frame or time range, selected region/mask, tracking evidence, and propagation bounds.
  goal: Correct a visual region or mask while constraining temporal propagation and preserving reviewability.
  now: Show source frame/time, region identity, tracking confidence, affected-frame range, and any changed approval
    scope.
  next: Adjust the region, reduce propagation, inspect candidate frames, or save a new revision.
