validation: Tracking confidence does not establish identity; show affected frames and estimate/uncertainty; preserve
  exact source timebase.
recovery: On track loss, stop propagation and retain the last valid mask; require explicit review after scope changes.
responsive: Show one frame and selected region with a clear range summary; move secondary controls into a drawer.
accessibility: Provide structured region coordinates and frame index; support non-canvas keyboard adjustment and
  a semantic affected-frame list.
