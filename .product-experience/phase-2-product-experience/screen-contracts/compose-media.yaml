validation: Brand assets and fonts are exact references; captions retain timing; preview differs from rendered artifact;
  rights and output profile are separate.
recovery: Preserve timeline state and selected clip; resolve missing asset or version conflicts before render.
responsive: Show track list and selected track editor; keep total timebase, caption alignment, and dirty state visible.
accessibility: Support keyboard track reorder, trim, and selection; provide semantic track and timing lists and
  numeric alternatives to drag.
