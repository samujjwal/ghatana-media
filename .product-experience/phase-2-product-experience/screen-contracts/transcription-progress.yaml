schemaVersion: media.screen-contract.v1
productId: media
screenId: media.view.monitor-transcription
status: proposal; provider-and-runtime-availability-not-claimed
channel: media.channel.web
actors:
- media.creator
- media.editor
intentRef: media.intent.understand
purpose: follow one submitted transcription job and decide its safe next action
contextGoalNowNext:
  context: Exact source version, language intent, consent scope, and stable job reference.
  goal: Understand progress and finality.
  now: Render the owning job and attempt states, known progress, and current limitation.
  next: Review a completed transcript, observe active work, or check an uncertain job outcome.
anatomy:
- source-reference
- job-purpose
- job-state
- progress-if-known
- finality
- safe-next-action
states:
- queued
- running
- completed
- partially-succeeded
- failed
- outcome-unknown
- reconciling
- cancelled
actions:
- media.action.request-transcription
- media.action.view-job-status
- media.action.request-cancellation
- media.action.check-job-outcome
validation: Progress is omitted when not measured; unknown finality is never presented as failure or completion.
recovery: For unknown outcome, check the existing job outcome; do not submit again.
responsive: status-and-safe-next-action-precede-secondary-job-details
accessibility: announce-state-change-once; throttle-progress-announcements; expose-progress-text
localization: Localize human-readable labels and explanations; preserve canonical IDs, reason codes, raw timestamps, measurements, and object identity; format dates, numbers, units, and plurals by locale without changing stored values.
copyRefs:
- media.copy.job.queued
- media.copy.job.running
- media.copy.job.unknown
fixtureRefs:
- media.scenario.job-running
- media.scenario.job-outcome-unknown
componentRefs:
- media.component.job-status-card
journeyRefs: []
copyDisposition: canonical-copy-IDs-pending
fixtureDisposition: synthetic-fixture-contract-not-authored
sourceRefs:
- master-plan:section-20.2
channelDispositions:
- channelRef: media.channel.web
  disposition: selected-lane-view-proposal
- channelRef: media.channel.cli
  disposition: selected-lane-command-counterpart-pending
- channelRef: media.channel.api
  disposition: logical-operation-and-wire-contract-not-bound
- channelRef: media.channel.embedded
  disposition: host-rendering-and-focus-contract-not-bound
actionBindingState: bound-to-existing-P2-actions
actionIntents: []
