validation: User preferences and workspace policy are distinct; inaccessible changes do not bypass Shared authority;
  policy changes disclose affected jobs.
recovery: Preserve the last saved value; on conflict refresh effective policy before saving; do not silently discard
  edits.
responsive: Use category navigation with one setting group per view; keep scope and inherited status visible.
accessibility: Use labeled native controls, visible focus, textual lock reasons, and confirmation of saved effective
  values.
