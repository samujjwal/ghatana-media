purpose: User/workspace policies, accessibility and integration scope
contextGoalNowNext:
  context: A user or workspace setting category, current value, policy owner, inheritance, and effect on active
    work.
  goal: Change a permitted preference or workspace policy with clear scope and effective date.
  now: Show inherited versus local values, authority, affected workflows, accessibility impact, and unsaved changes.
  next: Edit a setting within authority, save explicitly, or return to the previous value.
