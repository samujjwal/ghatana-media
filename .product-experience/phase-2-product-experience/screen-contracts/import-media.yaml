intentRef: media.intent.understand
purpose: admit one authorized source and report its actual transfer and integrity state
contextGoalNowNext:
  context: Current workspace, optional project target, source selection, and stable upload identity when one exists.
  goal: Transfer a source under the admitted contract and reach a truthful verification disposition.
  now: Show selected source and admitted limits before transfer; then show only server-acknowledged progress and
    current finality.
  next: Resume the same eligible upload, inspect a verification result, or return with a clear blocked/recovery
    state.
anatomy:
- workspace-and-project-target
- accessible-source-picker
- admitted-source-limits
- transfer-identity
- acknowledged-progress
- integrity-and-policy-state
- safe-next-action
componentRefs:
