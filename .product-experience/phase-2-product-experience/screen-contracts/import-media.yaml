- empty
- source-selected
- receiving
- interrupted
- verifying
- outcome-unknown
- available
- quarantined
- rejected
- permission-revoked
- offline
actions:
- media.action.begin-artifact-upload
- media.action.resume-artifact-upload
- media.action.inspect-artifact
validation: Admit source type and bounds from the owner contract, not from filename heuristics. Never promote an
  incomplete upload, unverified digest, quarantined object, or unknown result to AVAILABLE.
recovery: Resume only the same upload after stable identity, source metadata, workspace, and current authority match;
  otherwise keep the partial source isolated or expire it under policy and explain the confirmed disposition.
responsive: Keep stable identity, integrity state, and safe next action visible without horizontal scrolling; progress
  may collapse only when its finality remains visible.
accessibility: native-file-picker; drag-and-drop-is-optional; announced-progress-is-throttled-and-server-acknowledged;
  state-and-blocking-reason-are-textual
