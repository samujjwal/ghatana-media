purpose: Scenes, timing, references, versions and transitions
contextGoalNowNext:
  context: A storyboard version, ordered scenes, source references, timing, and transition choices.
  goal: Arrange and review a scene sequence before any generation or render is submitted.
  now: Show scene order, exact timing, reference availability, version conflicts, and missing rights evidence.
  next: Edit a scene or reference, save a new storyboard version, or return to the project.
