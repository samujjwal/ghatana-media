validation: Scene order and timebase are explicit; reference presence does not imply rights; manual storyboarding
  remains available if an optional planner is unavailable.
recovery: Preserve scene identities and ordering across conflicts; restore the last saved version without submitting
  generation.
responsive: Use an ordered scene-card list; keep order, timing, reference, and status visible in every card.
accessibility: Support keyboard scene insertion and reorder; expose scene count, position, duration, and reference
  status as text.
