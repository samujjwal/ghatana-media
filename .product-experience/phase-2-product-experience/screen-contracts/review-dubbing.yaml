validation: Translation is not source-grounded fact; preserve the source/target relation; label estimated sync separately
  from measured sync.
recovery: Retain segment correspondence during edits; block voice use after consent revocation; do not mark complete
  while required segments remain unresolved.
responsive: Present one aligned source/target segment at a time; keep language, timing, and voice authority visible.
accessibility: Expose source/target pairing and timestamps as structured text; provide keyboard segment navigation
  and non-drag timing edits.
