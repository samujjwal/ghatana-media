purpose: Translation, voice, timing, meaning review and sync
contextGoalNowNext:
  context: Source and target language versions, approved voice choice, translated meaning, timed segments, and synchronized
    audio/video.
  goal: Review dubbing for meaning, timing, voice authorization, and synchronization before registering an output.
  now: Show original and translated text, voice-use authority, source/output timing, sync observations, and unresolved
    segments.
  next: Revise a segment, request authorized timing or voice review, or save a reviewable output version.
