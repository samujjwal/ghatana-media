purpose: Proposed graph, estimates, material decisions and validation
contextGoalNowNext:
  context: The current proposed plan, selected inputs, settings, estimates, policy decisions, and plan revision.
  goal: Decide whether the plan is complete, permitted, and suitable for an explicit submission.
  now: Show the operation graph, unresolved requirements, measured versus estimated costs, supported alternatives,
    and exact approval effects.
  next: Edit a decision, return to its owner, or submit only through a separately admitted action after validation.
anatomy:
- plan-summary
- operation-graph
- input-and-output-versions
- capability-dispositions
- estimates-and-cost-basis
- rights-and-policy-effects
- validation-findings
- explicit-next-actions
