validation: A plan is a proposal; every operation and estimate names its evidence and scope; viewing the plan has
  no execution effect.
recovery: Keep the same plan revision when returning from a blocker; require revalidation after material settings
  or rights change; never resubmit an unknown request blindly.
responsive: On narrow screens show blockers, estimate basis, and approval effects before optional operation details.
accessibility: Present the plan graph as a semantic ordered list; identify estimated values and unsupported steps
  in text; keep validation findings keyboard reachable.
