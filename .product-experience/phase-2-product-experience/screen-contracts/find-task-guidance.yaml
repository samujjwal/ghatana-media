recovery: Keep the current workflow context when returning from guidance; disclose when guidance is stale or unavailable.
responsive: Show concise next steps first; expand prerequisites and limitations; keep diagnostic sharing separate.
accessibility: Use descriptive headings and links, keyboard navigation, and plain-language uncertainty; do not require
  visual interpretation.
