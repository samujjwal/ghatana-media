intentRef: media.intent.deliver
purpose: Playback/download/review/provenance and delivery action
contextGoalNowNext:
  context: One exact output artifact version, its playback or preview, provenance, integrity, and allowed delivery
    actions.
  goal: Inspect an output version and its recorded origin before deciding whether to use or deliver it.
  now: Show the preview, artifact identity, integrity and quality evidence, provenance limitations, and current
    rights state.
  next: Download, request approval, or return to the output list only when the relevant action is admitted.
anatomy:
- output-version-identity
- accessible-preview
- integrity-and-quality-summary
- provenance-and-limitations
- rights-and-approval-state
- allowed-next-actions
