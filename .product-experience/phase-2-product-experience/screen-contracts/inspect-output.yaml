- channelRef: media.channel.embedded
  disposition: host-rendering-and-focus-contract-not-bound
validation: Preview is not the original bytes; quality and rights are separate; provenance does not establish authenticity
  or clearance.
recovery: Keep the exact output version selected; explain unavailable preview; do not replace a denied version with
  another one.
responsive: Keep version, integrity, and rights state visible; stack preview before optional metadata on narrow
  screens.
accessibility: Provide text-equivalent content for preview where available; label media controls; expose integrity
  and limitations without color.
