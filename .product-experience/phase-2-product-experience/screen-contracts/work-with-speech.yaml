validation: Do not infer locale or speaker identity from fixture settings; distinguish recognition from verified
  text and synthesis from a real-person recording.
recovery: Preserve source and job identity when consent changes; stop affected processing on revocation and retain
  the explicit outcome.
responsive: Keep source, language/consent disposition, and current job state before secondary speech settings.
accessibility: Expose recognition uncertainty, language support, and consent state in text; retain transcript as
  the equivalent content path.
