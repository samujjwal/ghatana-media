schemaVersion: media.screen-contract.v1
productId: media
screenId: media.view.work-with-speech
status: proposal; baseline-view-contract-authored; action-state-channel-bindings-and-owner-review-pending
channel: media.channel.web
actors:
- media.creator
- media.editor
intentRef: media.intent.understand
purpose: Transcription/TTS/pronunciation/language/voice choices
contextGoalNowNext:
  context: The exact source version, language intent, rights/consent scope, transcript or synthesis job, and resulting
    speech artifact.
  goal: Understand, produce, or transform speech only within the admitted language and consent boundaries.
  now: Show whether the task is recognition, synthesis, translation, or speech transformation; disclose source identity,
    language support, consent state, and uncertainty.
  next: Choose a source or admitted speech action, review a result, or stop when authority or support is unresolved.
anatomy:
- speech-task-choice
- source-version
- language-and-locale-disposition
- consent-and-permitted-use
- job-state
- recognized-or-synthesized-content
- provenance-and-limitations
