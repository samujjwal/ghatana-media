intentRef: media.intent.edit
purpose: Edit caption wording, timing, and language for accessibility and review.
contextGoalNowNext:
  context: An immutable source version, transcript basis, caption language, active caption version, and selected
    segment.
  goal: Create a reviewable caption version by editing text or source-time alignment.
  now: Show source context, recognition provenance, segment timing, language, alignment state, and version conflict
    state.
  next: Correct a segment, resolve a conflict, save a new caption version, or preserve an incomplete draft.
anatomy:
- source-and-language-context
- caption-version
- timed-segment-list
- alignment-state
- text-and-timing-editor
- conflict-and-save-actions
