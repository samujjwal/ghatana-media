validation: Editing never changes source bytes; transcript and captions remain distinct records; saved versions
  carry source-time provenance.
recovery: Preserve unsaved work and the selected segment; on conflict compare exact revisions before resolving;
  require current authority before save.
responsive: Stack text and timing fields while retaining source time, segment selection, and save/conflict status.
accessibility: Provide numeric time-entry alternatives to dragging; identify each segment by time range and text;
  restore focus to the edited row.
