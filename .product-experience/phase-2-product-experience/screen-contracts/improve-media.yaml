purpose: Preserve/enhance/creative choice, measured defects, safe plan
contextGoalNowNext:
  context: One source version, selected improvement intent, available defect measurements, bounded repair plan,
    and candidate version.
  goal: Choose a preservation, enhancement, or creative change with an evidence-based scope.
  now: Show measured defects and their basis, unassessed dimensions, proposed change bounds, rights effects, and
    reversible comparison path.
  next: Inspect evidence, edit the bounds, or submit a validated repair plan explicitly.
