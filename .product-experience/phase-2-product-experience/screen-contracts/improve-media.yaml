validation: A measurement is scoped to its metric and method; recommendation is not applied repair; creative intent
  is distinct from restoration.
recovery: Preserve the source version; report partial or failed operations honestly; keep candidate lineage and
  bounds for reconciliation.
responsive: Show source, intent, measured defect, and bounds first; make advanced processing controls progressive
  disclosures.
accessibility: Provide a structured list of dimensions and evidence; name which dimensions are not assessed; offer
  keyboard access to comparison.
