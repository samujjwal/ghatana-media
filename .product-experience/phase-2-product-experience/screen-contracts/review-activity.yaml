- populated
- empty
- partial
- stale
- access-denied
- offline
- job-outcome-unknown
- evidence-unavailable
actions:
- media.action.inspect-job
- media.action.reconcile-job
validation: Activity rows use the authorized job-status projection; the list query, ordering, pagination, and owner
  wire binding remain undefined until their owning contract is published.
recovery: Preserve the workspace query and exact job identity; open the same job to refresh stale evidence; keep
  unknown finality visible and block duplicate submission.
responsive: Keep job purpose, state, finality, and the inspect action together; stack secondary identity details
  below them at narrow widths.
accessibility: Each job row has a heading and named inspect action; state and finality are textual; updates are
  announced only when the recorded state changes.
