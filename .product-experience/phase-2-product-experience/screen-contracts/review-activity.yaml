intentRef: media.intent.resolve-job
purpose: find a job that needs attention and open its exact status before taking another consequential action
contextGoalNowNext:
  context: Current authorized workspace and the jobs visible under its read authority.
  goal: Identify which recorded job needs inspection, reconciliation, or a later follow-up.
  now: Group the available job summaries by recorded state and keep job identity, finality, and safe next action
    visible.
  next: Open one exact job; reconcile only that same job when its recorded outcome is unknown.
anatomy:
- activity-heading
- job-activity-list
- job-purpose
- job-state-and-finality
- safe-next-action
- empty-state
