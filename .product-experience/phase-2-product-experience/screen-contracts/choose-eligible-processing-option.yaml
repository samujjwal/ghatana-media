validation: Discovery is not qualification; overrides are bounded and named; fallback is never silent.
recovery: Retain the requested outcome when no profile fits; explain the blocking constraint and owner path.
responsive: Show profile name, compatibility, and qualification state first; expand technical constraints on demand.
accessibility: Each profile is a named choice with text compatibility reason; preserve keyboard selection when results
  update.
