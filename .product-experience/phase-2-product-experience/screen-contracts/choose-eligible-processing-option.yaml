    override scope.
  goal: Find and validate a profile that fits the intended output without implying that profile discovery is delivery.
  now: Show profile identity, applicable constraints, qualification status, compatibility findings, and any allowed
    override.
  next: Validate a profile, choose a supported option, or request the owner decision needed to unblock it.
