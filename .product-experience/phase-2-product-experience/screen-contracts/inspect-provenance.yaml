validation: Provenance describes recorded origin, not truth, rights, safety, or quality; mark inferred, generated,
  and unknown fields distinctly.
recovery: Show gaps without inventing values; preserve lineage when a source is deleted or access is revoked subject
  to retention policy.
responsive: Lead with result and source identity; present lineage as an ordered chain and disclose missing links.
accessibility: Expose lineage as a navigable ordered list; label each origin type and missing relation in text.
