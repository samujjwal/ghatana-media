purpose: Source/edit/model/simulation lineage and disclosure limits
contextGoalNowNext:
  context: An exact source/result version, operation lineage, model or simulation origin when declared, and disclosure
    limitations.
  goal: Understand where a result came from and which parts of its lineage are known or incomplete.
  now: Show source versions, operations, timing basis, execution records, generated or inferred origin, and missing
    lineage.
  next: Open a source or execution record, export a governed manifest, or return to the result.
anatomy:
- result-version
- source-lineage
- operation-and-execution-lineage
- model-or-simulation-reference
- origin-and-timing-basis
- missing-data-and-disclosure-limits
