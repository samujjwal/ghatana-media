validation: Job completion and output availability are separate; each rendition has an immutable identity; unapproved
  outputs are not presented as published.
recovery: Preserve the manifest for partial jobs; check unknown finality; show missing outputs without suggesting
  blind retry.
responsive: List outputs by rendition with state and safe action; keep job finality above the list.
accessibility: Expose output names, version, verification and approval state in each row; announce job changes once.
