validation: The submitted snapshot is immutable; estimates are labeled; fallback and lossy conversion require explicit
  disclosure; render completion is not publication.
recovery: On unknown submission, check the outcome for that same request/job; never start a second render blindly.
responsive: Keep snapshot identity, profile, blockers, and submit finality visible before secondary settings.
accessibility: Present validation as a structured list with focusable reasons; label estimates and units; confirmation
  names the exact snapshot and profile.
