validation: Source remains immutable; constraints are visible; undo/redo points to revisions; preview does not equal
  committed output.
recovery: Preserve edit intent and selection after an error; resolve version conflicts against exact source revisions;
  do not overwrite source.
responsive: Use a selected-track/region editor and contextual parameter panel; keep source version and dirty state
  visible.
accessibility: Provide keyboard selection and numeric controls; expose canvas/timeline items semantically; maintain
  focus after edits.
