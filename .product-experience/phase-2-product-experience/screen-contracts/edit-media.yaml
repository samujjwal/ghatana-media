purpose: Region/track operations, exact constraints and undo
contextGoalNowNext:
  context: A versioned source or composition, selected track/region, exact edit constraints, and undo history.
  goal: Make a bounded, reviewable media edit that preserves the source and records a new revision.
  now: Show the selected target, edit range, constraints, version state, and operations that will change the output.
  next: Apply an admitted edit, review the candidate, undo a versioned change, or save a new revision.
