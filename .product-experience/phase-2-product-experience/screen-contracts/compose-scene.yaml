validation: A visual placeholder is not an admitted model; distinguish authored, generated, and simulation data;
  exact references use immutable versions.
recovery: Keep scene hierarchy on validation errors; report missing dependencies without silently substituting assets.
responsive: Use a semantic entity list with a focused inspector; keep selected entity and validation state visible.
accessibility: Represent scene hierarchy, materials, and bindings in navigable lists; do not make the 3D canvas
  the only path.
