purpose: Scene entities/material/camera/light and model bindings
contextGoalNowNext:
  context: A versioned scene graph with entities, material references, camera/light state, and model or simulation
    bindings.
  goal: Assemble a scene whose references and technical bindings remain explicit and inspectable.
  now: Show scene hierarchy, asset versions, material/lighting controls, camera, and missing or unqualified bindings.
  next: Edit a scene element, validate the composition, or open a reviewable preview.
