  - media.artifact.search
  - media.artifact.list
  - media.artifact.inspect
  actionBindingState: proposed-component-intent-action-refs; P2-contract-semantics-authority-and-owner-review-pending
  actionIntents:
  - search authorized artifacts
  - inspect a specific artifact version
  - select an artifact for an admitted workflow
  keyboard: label search and filters; preserve focus through result updates; provide named row actions and keyboard
    selection without drag.
  narrowLayout: Keep artifact name, version, integrity state, and selection action together; stack secondary metadata.
  accessibility: Announce result count and current filter; each result names media kind and version; access denial
    and stale results have text and recovery.
  localization: Localize search labels, filter descriptions, and dates; do not translate canonical artifact IDs,
    digest values, or reason codes.
  prohibitedUse: must-not-enumerate unauthorized artifacts; must-not-treat a project reference as artifact authorization;
    must-not-claim indexed results are current when stale
  status: authored-proposal; bindings-and-review-pending
