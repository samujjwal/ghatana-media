  - outcome-unknown
  - reconciling
  - cancelled
  actions:
  - media.action.view-job-status
  - media.action.request-cancellation
  - media.action.check-job-outcome
  - media.action.retry-job
  identityRules:
  - show-an-owner-issued-job-identity-only-when-returned-by-its-contract
  - label-a-related-upload-identity-separately
  - keep-verification-job-state-distinct-from-upload-progress-and-artifact-lifecycle
  keyboard: actions-have-explicit-names-and-reasons
  narrowLayout: status-and-next-action-precede-secondary-evidence
  accessibility: status-change-announced-once; progress-updates-are-throttled
  prohibitedUse: must-not-offer-retry-for-an-unknown-outcome-or-without-a-classified-retryable-attempt-and-current-authority-policy-and-budget; must-not-infer-artifact-availability-from-job-completion-alone
  semanticRole: Shows one processing job, its authoritative state and finality, and the safe next action.
  hierarchy:
  - job identity and purpose
  - authoritative job state
  - progress only when measured
  - finality and related identities
  - safe next action
  states:
  - queued
  - running
  - completed
  - partially-succeeded
  - failed
  - retry-pending
  - outcome-unknown
  - reconciling
  - cancelled
  capabilityRefs:
  - media.job.view-status
  - media.job.cancel
  - media.job.check-outcome
  - media.job.retry
  actionBindingState: bound-to-existing-PDP-3-actions
  actionIntents:
  - view status for one exact job
  - request cancellation for the existing job
  - check the outcome of the same job when it is unknown
  - retry the same job after a prior attempt is classified as retryable and current policy allows it
  actionIntentBindings:
  - intent: view status for one exact job
    actionRefs: [media.action.view-job-status]
    bindingState: proposed-reference; action-authority-and-owner-review-pending
  - intent: request cancellation for the existing job
    actionRefs: [media.action.request-cancellation]
    bindingState: proposed-reference; action-authority-and-owner-review-pending
  - intent: check the outcome of the same job when it is unknown
    actionRefs: [media.action.check-job-outcome]
    bindingState: proposed-reference; action-authority-and-owner-review-pending
  - intent: retry the same job after a prior attempt is classified as retryable and current policy allows it
    actionRefs: [media.action.retry-job]
    bindingState: proposed-reference; action-authority-and-owner-review-pending
  localization: Localize human-readable labels and explanations; preserve canonical IDs, reason codes, raw timestamps,
    measurements, and object identity; format dates, numbers, units, and plurals by locale without changing stored
    values.
  status: authored-proposal; bindings-and-review-pending
