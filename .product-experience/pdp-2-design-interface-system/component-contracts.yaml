  - identity handoff context
  - requested destination
  - upstream identity result
  - authorized context decision
  - safe return action
  states:
  - identity-required
  - reauthentication-required
  - context-ready
  - context-denied
  - unavailable
  capabilityRefs: []
  actionBindingState: no-bound-action; display-and-proposal-only
  localization: Localize human-readable labels and explanations; preserve canonical IDs, reason codes, raw timestamps,
    measurements, and object identity; format dates, numbers, units, and plurals by locale without changing stored
    values.
  status: authored-proposal; bindings-and-review-pending
  sourceRef: master-plan:section-19.2
