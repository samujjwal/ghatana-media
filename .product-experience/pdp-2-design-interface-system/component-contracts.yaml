schemaVersion: media.component-contracts.v1
productId: media
authority: Media component anatomy and behavior; Shared owns generic component primitives
status: authored-proposal; component-and-token-bindings-and-P0-010-pending
components:
- id: media.component.identity-context-boundary
  purpose: return from the Shared identity handoff to the same Media destination only after current context is resolved
  anatomy:
  - requested-destination
  - upstream-handoff
  - context-status
  - safe-return
  variants:
  - identity-required
  - reauthentication-required
  - context-ready
  - context-denied
  - unavailable
  actions: []
  handoffRefs:
  - media.handoff.identity
  keyboard: preserve-return-focus-and-destination-across-the-upstream-handoff
  narrowLayout: show-the-required-identity-step-and-return-destination-before-secondary-help
  accessibility: upstream-identity-controls-retain-their-accessible-names; explain-denial-in-text; never-announce-protected-project-data-before-access
  prohibitedUse: must-not-collect-or-mirror-Shared-credentials-or-infer-authorization-from-a-remembered-workspace
  semanticRole: Returns a person to the same Media destination after the upstream identity and workspace context
    are resolved.
  hierarchy:
  - identity handoff context
  - requested destination
  - upstream identity result
  - authorized context decision
  - safe return action
  states:
  - identity-required
  - reauthentication-required
  - context-ready
  - context-denied
  - unavailable
  capabilityRefs: []
  actionBindingState: no-bound-action; display-and-proposal-only
  localization: Localize human-readable labels and explanations; preserve canonical IDs, reason codes, raw timestamps,
    measurements, and object identity; format dates, numbers, units, and plurals by locale without changing stored
    values.
  status: authored-proposal; bindings-and-review-pending
  sourceRef: master-plan:section-19.2
  typedDefinition:
    id: "media.component.identity-context-boundary.typed-definition.v1"
    sourceAuthority: Media
    contractStatus: OWNER_DEFINED_TYPED_COMPONENT_CONTRACT; INDEPENDENT_REVIEW_OPEN
    runtimeAdmission: NOT_ADMITTED
    sourceRefs:
      - ".product-experience/pdp-2-design-interface-system/component-contracts.yaml#components/@id=media.component.identity-context-boundary"
      - ".product-experience/pdp-2-design-interface-system/component-value-types.yaml#/$defs"
      - ".product-experience/pdp-3-product-experience/action-registry.yaml#actions/@id=media.action.return-to-requested-destination-after-identity-confirmation"
    props:
      - name: "requestedDestinationRef"
        type: "MediaViewRef"
        required: true
        meaning: "Exact destination to return to after the upstream identity handoff; retain the same destination identity."
      - name: "handoffState"
        type: "Enum<identity-required|reauthentication-required|context-ready|context-denied|unavailable>"
        required: true
        meaning: "Current identity handoff disposition; only context-ready permits return."
      - name: "resolvedWorkspaceRef"
        type: "TenantScopedWorkspaceRef"
        required: false
        meaning: "Workspace selected by the upstream authority, present only when the handoff resolves context."
      - name: "identityRequest"
        type: "OptionalIdentityHandoffRequest"
        required: false
        meaning: "Exact PXD-082 Media adapter request with host nonce, registered route, and trusted host identity/workspace context."
      - name: "contextResolution"
        type: "OptionalIdentityHandoffEvaluation"
        required: false
        meaning: "Host-normalized result, exact configured owner pin, evaluation time, and recomputed PXD-082 disposition; only acceptable authorized outcome can establish context."
      - name: "safeReturnIntent"
        type: "ActionIntentRef<media.action.return-to-requested-destination-after-identity-confirmation>"
        required: true
        meaning: "The exact source-defined safe return action intent; never an authentication or authorization grant."
      - name: "state"
        type: "Enum<media.component.identity-context-boundary.typedDefinition.states>"
        required: true
        meaning: "Exact declared component state; unrecognized values are rejected and expose no consequential action."
      - name: "variant"
        type: "Enum<media.component.identity-context-boundary.typedDefinition.variants>"
        required: true
        meaning: "Exact declared component variant; variant changes presentation but does not grant authority or alter domain meaning."
      - name: "actionIntents"
        type: "Array<media.component.identity-context-boundary.typedDefinition.actions[number]>"
        required: true
        meaning: "Only the exact action intent identifiers declared by this component; an empty source action list means the array must be empty."
      - name: "keyboardBehavior"
        type: "KeyboardBehaviorContract"
        required: true
        meaning: "Must satisfy the exact keyboard requirement authored for this component; this definition does not claim browser or assistive-technology conformance."
    inputSchema:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: media.component.identity-context-boundary input
      type: object
      additionalProperties: false
      properties:
        requestedDestinationRef:
          $ref: media.component-value-types.v1#/$defs/MediaViewRef
        handoffState:
          type: string
          enum:
            - identity-required
            - reauthentication-required
            - context-ready
            - context-denied
            - unavailable
          description: Closed enum source values for
            Enum<identity-required|reauthentication-required|context-ready|context-denied|unavailable>.
          examples:
            - identity-required
        resolvedWorkspaceRef:
          $ref: media.component-value-types.v1#/$defs/TenantScopedWorkspaceRef
        identityRequest:
          $ref: media.component-value-types.v1#/$defs/OptionalIdentityHandoffRequest
        contextResolution:
          $ref: media.component-value-types.v1#/$defs/OptionalIdentityHandoffEvaluation
        safeReturnIntent:
          type: string
          const: media.action.return-to-requested-destination-after-identity-confirmation
          description: Exact source-bound action intent identity.
        state:
          type: string
          enum:
            - identity-required
            - reauthentication-required
            - context-ready
            - context-denied
            - unavailable
        variant:
          type: string
          enum:
            - identity-required
            - reauthentication-required
            - context-ready
            - context-denied
            - unavailable
        actionIntents:
          type: array
          maxItems: 0
        keyboardBehavior:
          const: preserve-return-focus-and-destination-across-the-upstream-handoff
      required:
        - requestedDestinationRef
        - handoffState
        - safeReturnIntent
        - state
        - variant
        - actionIntents
        - keyboardBehavior
      allOf:
        - oneOf:
            - properties:
                state:
                  const: identity-required
                variant:
                  const: identity-required
              required:
                - state
                - variant
            - properties:
                state:
                  const: reauthentication-required
                variant:
                  const: reauthentication-required
              required:
                - state
                - variant
            - properties:
                state:
                  const: context-ready
                variant:
                  const: context-ready
              required:
                - state
                - variant
            - properties:
                state:
                  const: context-denied
                variant:
                  const: context-denied
              required:
                - state
                - variant
            - properties:
                state:
                  const: unavailable
                variant:
                  const: unavailable
              required:
                - state
                - variant
        - if:
            properties:
              handoffState:
                const: context-ready
            required:
              - handoffState
          then:
            required:
              - resolvedWorkspaceRef
              - contextResolution
            properties:
              contextResolution:
                properties:
                  evaluatorDisposition:
                    const: HOST_ADAPTER_EVIDENCE_ACCEPTABLE_FOR_CONTEXT
                  result:
                    properties:
                      outcome:
                        const: AUTHORIZED
                    required:
                      - outcome
                required:
                  - evaluatorDisposition
                  - result
    schemaDialect: JSON_SCHEMA_2020_12_WITH_MEDIA_COMPONENT_VALUE_TYPES_V1
    requiredDataProps:
      - "requestedDestinationRef"
      - "handoffState"
      - "resolvedWorkspaceRef"
      - "identityRequest"
      - "contextResolution"
      - "safeReturnIntent"
    allowedStateVariantPairs:
      - {state: "identity-required", variant: "identity-required"}
      - {state: "reauthentication-required", variant: "reauthentication-required"}
      - {state: "context-ready", variant: "context-ready"}
      - {state: "context-denied", variant: "context-denied"}
      - {state: "unavailable", variant: "unavailable"}
    positiveFixture: {"requestedDestinationRef":"media.view.adjust-color","handoffState":"identity-required","safeReturnIntent":"media.action.return-to-requested-destination-after-identity-confirmation","state":"identity-required","variant":"identity-required","actionIntents":[],"keyboardBehavior":"preserve-return-focus-and-destination-across-the-upstream-handoff"}
    states:
      - "identity-required"
      - "reauthentication-required"
      - "context-ready"
      - "context-denied"
      - "unavailable"
    variants:
      - "identity-required"
      - "reauthentication-required"
      - "context-ready"
      - "context-denied"
      - "unavailable"
    actions:
      []
    errors:
      - {code: "CONTEXT_DENIED", state: "context-denied", meaning: "The exact context-denied state is visible with a textual reason; only explicitly allowed recovery intents remain available."}
      - {code: "UNAVAILABLE", state: "unavailable", meaning: "The exact unavailable state is visible with a textual reason; only explicitly allowed recovery intents remain available."}
      - {code: UNRECOGNIZED_STATE, condition: input is not an exact member of states, meaning: reject the state and expose no consequential action.}
    keyboard:
      requirement: "preserve-return-focus-and-destination-across-the-upstream-handoff"
      status: Media-owned behavior definition only; keyboard and assistive-technology verification remains pending.
    invariants:
      - "Return only to the originating destination after upstream identity and workspace context resolve; do not collect credentials or infer permission from remembered context."
    nonClaims: [Shared export, package consumption, implementation, runtime behavior, rendered conformance, independent acceptance]

