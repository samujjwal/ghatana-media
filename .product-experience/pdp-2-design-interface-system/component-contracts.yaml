ownerDefinedComponentRules:
  - id: media.component.bounded-repair-loop.v1
    rule: Every automatic repair or retry loop has a finite per-operation bound for attempt count, elapsed time, and resource budget before work starts. Each iteration uses the exact source/output version and request identity; an unknown outcome is reconciled before continuing, and reaching any bound stops the loop with an inspectable non-success rather than silently widening the budget.
    negativeCases: [unbounded-repeat, new-request-after-unknown, bound-widened-by-provider, report-loop-success-after-exhaustion]
    scopeStatus: OWNER_DEFINED_COMPONENT_BEHAVIOR; exact limits come from the selected operation/profile, runtime remains separate.
  - id: media.component.erasure-retention-provenance.v1
    rule: Immutable output versions and provenance do not require retaining source media or personal content forever. Apply the exact lifecycle decision to content and derivatives; retain only provenance fields required and permitted for audit, remove protected content from copied caches/previews/temporary artifacts, and report any legal hold or undeletable external copy as a separately scoped disposition.
    negativeCases: [immutability-used-to-deny-erasure, provenance-copy-retains-source-bytes, deletion-claim-without-downstream-copy-inventory, legal-hold-inferred-from-missing-evidence]
    scopeStatus: OWNER_DEFINED_COMPONENT_BEHAVIOR; legal retention authority and runtime erasure proof remain external/open.
  - id: media.component.navigation-and-safety-visibility.v1
    rule: Reduce cognitive load through progressive disclosure while keeping the current location, primary task navigation, Cancel, Undo where valid, access/rights denial, uncertainty, and safety warnings discoverable and operable. Compact layouts may move secondary detail behind a labeled control but cannot hide a required next action or change its authority.
    negativeCases: [primary-navigation-hidden-to-simplify, cancel-or-undo-hidden-as-secondary, rights-denial-reduced-to-color-only, safety-warning-hidden-by-quiet-layout]
    scopeStatus: OWNER_DEFINED_COMPONENT_BEHAVIOR; visual and assistive-technology acceptance remains separate.
  - id: media.component.typed-parameter-boundaries.v1
    rule: Every component parameter that affects an operation has a finite declared type, unit when dimensional, accepted range or finite enum, default source, and unknown-field behavior. Reject unknown or conflicting values; never coerce a display label, provider setting, or unitless number into an operation input.
    negativeCases: [unknown-field-silently-ignored, unitless-value-assumed, out-of-range-value-clamped-without-disclosure, provider-field-overrides-policy]
    scopeStatus: OWNER_DEFINED_COMPONENT_BEHAVIOR; operation-specific schemas and runtime validation remain separate.
  - id: media.component.risk-bounded-analysis-selection.v1
    rule: Analysis or enhancement planning selects only operations eligible for the exact source, purpose, rights, profile, and budget, and only when the measured improvement is greater than the declared artifact risk. A default pipeline never applies every enhancer; preserve the source and disclose declined, unavailable, or uncertain steps.
    negativeCases: [all-enhancers-applied-by-default, estimated-improvement-treated-as-measured, operation-selected-without-rights-or-profile, source-overwritten-before-review]
    scopeStatus: OWNER_DEFINED_COMPONENT_BEHAVIOR; measurement and model qualification remain NOT_EVALUATED.
  - id: media.component.acceptance-after-durable-identity.v1
    rule: A user-visible accepted job or command has a stable tenant/principal-scoped identity and durable owner receipt before acceptance is reported. A request body parsed, provider call started, or UI optimistic state is not acceptance; unknown commit results remain unknown and use the same identity for reconciliation.
    negativeCases: [accepted-before-identity-persisted, optimistic-ui-treated-as-durable-acceptance, provider-start-treated-as-job-receipt, unknown-commit-reported-as-rejected]
    scopeStatus: OWNER_DEFINED_COMPONENT_BEHAVIOR; runtime durability and production admission remain NOT_ADMITTED.
  - id: media.component.contextual-workspace-navigation.v1
    rule: Show only the Storyboard, Editor, Audio, Captions, Versions, and Outputs sections relevant to the exact project task and supported data, but preserve their stable destinations and user navigation. Section visibility is not a permission grant; resolve tenant, principal, rights, and exact version before exposing protected content or enabling an effect.
    negativeCases: [all-sections-assumed-applicable, hidden-section-treated-as-deleted, navigation-visibility-grants-access, stale-workspace-context-reused]
    scopeStatus: OWNER_DEFINED_COMPONENT_BEHAVIOR; project authorization and route reachability are separate.
  - id: media.component.undo-redo-effect-boundary.v1
    rule: Undo and redo describe only the versioned local edit history that the selected operation can reverse. They never reverse a published delivery, external provider effect, consent decision, or already-dispatched job; those effects require their own explicit correction, revocation, cancellation, or compensation contract and finality evidence.
    negativeCases: [published-effect-reported-undone, external-provider-effect-erased-from-history, undo-without-exact-source-version, compensation-inferred-from-local-history]
    scopeStatus: OWNER_DEFINED_COMPONENT_BEHAVIOR; external-effect compensation remains operation-specific.
  - id: media.component.source-change-and-evidence-boundary.v1
    rule: A source relocation preserves existing behavior, identities, authority checks, and side effects; new product behavior is specified as a separate change. Reuse a component only when its actual public boundary covers the required typed inputs, states, actions, errors, and accessibility behavior; a name or visual resemblance is insufficient. Safety-critical authority, denial, uncertainty, finality, and budget rules must be explicit before the affected action is available. Desired quality is a target, not a guarantee; claims of achieved quality require scoped qualification evidence.
    negativeCases: [feature-change-hidden-as-relocation, component-selected-by-name-only, safety-critical-rule-left-implicit, quality-target-presented-as-guaranteed]
    scopeStatus: OWNER_DEFINED_PRODUCT_DEFINITION_RULE; source relocation, reuse selection, and desired quality remain distinct from independent acceptance or runtime qualification.
  - id: media.component.upstream-owner-source-first.v1
    rule: If a downstream screen, Explorer, adapter, or consumer discovers a missing or contradictory product rule, route the requirement to the authoritative source phase and correct that source first. A downstream consumer may cite or project an accepted rule but cannot repair it with a local override, duplicate taxonomy, or generated artifact edit. Record the exact owner source and selector before updating projections; revalidate derived views after the owner-source correction.
    ownerOrder: [pdp0_product_truth, pdp1_domain_data, pdp2_design_interface_system, pdp3_product_experience]
    negativeCases: [explorer-local-rule-substitutes-for-product-truth, screen-override-masks-missing-domain-rule, generated-projection-edited-as-source-fix, duplicate-downstream-rule-creates-second-authority]
    scopeStatus: OWNER_DEFINED_SOURCE_AUTHORITY_RULE; it defines correction order without asserting generated projection freshness or independent acceptance.
  - id: media.component.job-outcome-and-safe-next-action.v1
    rule: The job-status composition explains the exact submitted operation and authoritative recorded outcome; distinguishes queued/running, succeeded, failed, cancellation-requested, confirmed-cancelled, partial, and unknown finality; and states whether work may still be running when the current observer cannot prove otherwise. Label an output safe only when its exact immutable version is inspectable and its applicable integrity, access, rights, and review requirements are satisfied; job success alone is insufficient. Offer only the next action explicitly supported by the current operation contract, authority, and observed state.
    requiredFacts: [exactJobAndOperationIdentity, currentObservationSourceAndTimeWhenProvided, executionState, effectFinality, possiblyStillRunningOrNotEstablished, exactOutputVersionAndVerificationDisposition, currentAccessAndRightsDisposition, permittedNextActionOrNone]
    negativeCases: [success-means-output-safe,missing-observation-means-not-running,job-completion-means-artifact-accepted,partial-output-reported-as-full-success,unknown-finality-hidden,action-inferred-from-label]
    scopeStatus: OWNER_DEFINED_JOB_STATUS_PRESENTATION; no runtime observation, output verification, or action authority is admitted.
  - id: media.component.optional-ai-planner-isolation.v1
    rule: An unavailable or unqualified optional AI planner does not make a separately defined deterministic editing operation unavailable. Disable only the planner-dependent suggestion or planning affordance; preserve the exact deterministic input, edit, validation, and save path when its own operation contract and current authority permit it. Do not silently substitute another model/provider, change the requested effect, or present a generated suggestion as a deterministic result. Planner availability, model qualification, and runtime behavior remain independently unevaluated.
    negativeCases: [optional-planner-outage-disables-unrelated-deterministic-edit,unqualified-planner-substituted-silently,generated-suggestion-labeled-deterministic,planner-availability-grants-edit-authority]
    scopeStatus: OWNER_DEFINED_OPTIONAL_PLANNER_BOUNDARY; no planner, model, or runtime qualification is implied.
