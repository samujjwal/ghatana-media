  semanticRole: Finds and inspects authorized media artifacts and immutable versions in the selected workspace.
  anatomy:
  - workspace-and-access-context
  - artifact-search-and-filters
  - artifact-result-list
  - version-and-integrity-summary
  - selection-or-inspection-action
  hierarchy:
  - workspace boundary and access state
  - search and admitted filters
  - artifact identity and media type
  - immutable version and integrity state
  - available safe action
  variants:
  - loading
  - populated
  - empty
  - no-results
  - stale-index
  - access-denied
