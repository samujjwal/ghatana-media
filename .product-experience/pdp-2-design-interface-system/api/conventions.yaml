    sourceAuthority: .product-experience/pdp-0-product-truth/reuse-decisions.yaml#mediaArchitectureRules/genericMechanicsBoundary
    acceptanceEffect: none
  - id: media.p2.rule.api-health-readiness-diagnostics-separation.v1
    ruleRef: .product-experience/pdp-2-design-interface-system/api/conventions.yaml#ownerDefinedHealthAndDiagnosticsBoundary
    sourceAuthority: .product-experience/pdp-0-product-truth/policy-authority-model.yaml#productPolicy/enforcementPoints
