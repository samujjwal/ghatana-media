  - id: media.p2.rule.api-contract-generation-and-transport-verification.v1
    ruleRef: .product-experience/pdp-2-design-interface-system/api/conventions.yaml#/ownerDefinedProjectionRules/@id=media.api.contract-generation-and-transport-verification.v1
