schemaVersion: media.api-idempotency.v1
owner: ghatana-media-product-api
authority: Media mutation contracts own effect identity and replay semantics
sourceRefs: [.product-experience/pdp-2-design-interface-system/api/conventions.yaml, .product-experience/pdp-2-design-interface-system/api/async-operations.yaml, .product-experience/pdp-2-design-interface-system/api/retry-timeout-unknown-outcome.yaml, .product-experience/pdp-0-product-truth/state-models.yaml]
scopeStatus: proposal; operation-specific retention and persistence await runtime design
acceptance: {criteria: [each mutation declares whether idempotency is supported; supported mutations define scope and any actual retention, key reuse with different input is rejected or otherwise explicitly resolved, replay behavior is documented], status: pending-runtime-owner-review}
verification: {method: For operations claiming idempotency, inject duplicate and concurrent submissions including response loss and verify effect identity and the actually implemented persistence/retention boundary, status: not-run}
rules: [proposed scope includes principal or tenant and operation as authorized by the operation contract, define request-equivalence canonicalization before binding a digest, reject or safely resolve key reuse with different input, state the implemented retention only after runtime binding and do not imply persistence from this proposal, retention must cover only a documented retry window if such support is claimed, explicitly state when idempotency is unsupported or unverified]
ownerDefinedIdempotencySemantics:
  id: media.api.idempotency-identity.v1
  identityTuple: [trustedTenantId, trustedPrincipalIdWhenOperationScoped, exactCanonicalOperationId, operationVersion, clientRequestKey, canonicalValidatedRequestFingerprint]
  rules:
    - tenant and principal values are supplied by the authenticated host context; request-body values cannot select or widen identity scope
    - the operation identity and version are exact; similarly named operations, aliases, or transport paths do not share a key namespace unless explicitly declared
    - canonical request fingerprint covers every validated effect-bearing input, exact immutable target/version references, selected profile/version, and authority scope required by that operation
    - a matching key and fingerprint resolves to the same prior request/receipt without a second effect; a matching key with a different fingerprint conflicts
    - unresolved acknowledgement is reconciled under the same tuple before resubmission; a missing stored outcome is UNKNOWN_OUTCOME, not permission to create a new effect
    - key retention and persistence are claimed only when the exact implementation/source boundary establishes them; this rule creates no durable store, replay window, or automatic retry
    - an operation may declare idempotency unsupported, in which case callers must not automatically retry its mutation
  runtimeAdmission: NOT_ADMITTED
normativeRuleRecords:
  - id: media.p2.rule.api-idempotency-identity.v1
    ruleRef: .product-experience/pdp-2-design-interface-system/api/idempotency.yaml#ownerDefinedIdempotencySemantics
    sourceAuthority: .product-experience/pdp-2-design-interface-system/api/idempotency.yaml#rules
    acceptanceEffect: none
