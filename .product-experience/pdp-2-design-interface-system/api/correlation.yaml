schemaVersion: media.api-correlation.v1
owner: ghatana-media-product-api
authority: Media defines product trace continuity; Shared owns generic observability primitives
sourceRefs: [.product-experience/pdp-2-design-interface-system/api/conventions.yaml, .product-experience/pdp-0-product-truth/nonfunctional-requirements.yaml]
scopeStatus: proposal; header names and tracing format await platform binding
acceptance: {criteria: [where an operation/job boundary and platform trace context are supported, correlation continuity is documented and verified; caller-supplied values are validated; sensitive data is excluded], status: pending-platform-review}
verification: {method: Trace one authorized request through supported status/audit boundaries without presuming durable jobs or exposing content or credentials, status: not-run}
rules: [use platform-approved trace context, return correlation reference for support, correlation IDs are not authorization or idempotency keys, bound length/character set, do not place media content or personal data in trace baggage]
ownerDefinedProtectedInspectorRule:
  id: media.api.protected-technical-inspector.v1
  rule: >-
    A correlation reference may lead to technical details only through a separately
    authenticated protected inspector. Resolve it within the exact tenant, principal,
    operation, and resource scope; revalidate current read authority before returning
    details. Redact credentials, secrets, raw media, prompts, transcript text, and
    personal data unless a separately authorized exact field is required. A
    correlation identifier is a lookup key only, never a bearer capability or
    substitute for authentication. Missing or ambiguous scope, stale authority, or
    an unavailable authorization check denies the inspector response.
  requiredBindings: [trustedTenant, trustedPrincipal, exactOperation, exactResource, currentReadAuthority]
  redaction: [credentials, secrets, rawMedia, prompts, transcriptText, personalData]
  failBehavior: deny-inspector-response-without-leaking-whether-protected-record-exists
  nonClaims: [no-inspector-endpoint-or-authentication-implementation-is-claimed, correlation-id-is-not-authorization]
  acceptanceEffect: none
normativeRuleRecords:
  - id: media.p2.rule.api-protected-technical-inspector.v1
    ruleRef: .product-experience/pdp-2-design-interface-system/api/correlation.yaml#ownerDefinedProtectedInspectorRule
    sourceAuthority: .product-experience/pdp-2-design-interface-system/api/correlation.yaml#rules
    acceptanceEffect: none
