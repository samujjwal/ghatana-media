schemaVersion: media.api-async-operations.v1
owner: ghatana-media-product-api
authority: Proposed Media job semantics; no durable job behavior is established here. Shared transport primitives do not own Media job lifecycle.
sourceRefs: [.product-experience/pdp-2-design-interface-system/api/conventions.yaml, .product-experience/pdp-2-design-interface-system/api/identifiers.yaml, .product-experience/pdp-2-design-interface-system/api/cancellation.yaml, .product-experience/pdp-2-design-interface-system/api/retry-timeout-unknown-outcome.yaml, .product-experience/pdp-0-product-truth/state-models.yaml]
scopeStatus: proposal; endpoint and event bindings remain unverified
acceptance: {criteria: [for operations approved as asynchronous, the accepted request has an operation-scoped job identity, job state and effect finality are separate, result references and terminal reasons are explicit], status: pending-runtime-owner-review}
verification: {method: Verify request acknowledgment, status-read availability and persistence guarantees only as claimed by the bound runtime contract, terminal result, and response-loss behavior with runtime owner, status: not-run}
rules: [where an approved operation is asynchronous, transport acceptance means only the documented acknowledgment and not completion, expose authorized status lookup only when implemented and bound, distinguish execution state from effect finality, preserve uploadId separately when linked, a job result does not by itself imply artifact acceptance, this proposal establishes no durable storage or retention guarantee]
mediaOwnerDefinitionDecision:
  status: MEDIA_OWNER_DEFINED_DEFINITION_ONLY
  authority: User-delegated Media product-semantic owner under the PDP-0–PDP-3 mandate
  scope: Shared asynchronous request/job/finality grammar only; no transport or runtime behavior is accepted by this definition.
  exclusions: [durable-job-storage-guarantee, runtime-route-admission, provider-delivery-guarantee, phase-or-lifecycle-acceptance]
ownerDefinedAsyncRules:
  - id: media.async.request-ack-job-effect-separation.v1
    sourceRefs: [.product-experience/pdp-1-domain-data/operations.yaml#/individualOperationContracts/records/@id=media.operation-slice.submit-job, .product-experience/pdp-1-domain-data/states.yaml#/stateMachines/@machineId=media-job, .product-experience/pdp-1-domain-data/transitions.yaml#transitionRecords]
    rule: A transport acknowledgement identifies only the request result defined by its exact operation contract. A job identity may be returned only when the bound operation establishes it; job admission is not provider dispatch, execution, output creation, artifact acceptance, or terminal effect finality. Keep request status, job execution state, output availability, and effect finality as separate typed observations.
    negativeCases: [http-202-without-job-receipt-promoted-to-created-job,job-accepted-promoted-to-provider-dispatch,completed-job-promoted-to-artifact-accepted]
  - id: media.async.observation-bounds-and-currentness.v1
    sourceRefs: [.product-experience/pdp-1-domain-data/operations.yaml#/individualOperationContracts/records/@id=media.operation-slice.inspect-job, .product-experience/pdp-1-domain-data/states.yaml#/stateMachines/@machineId=media-job]
    rule: Status lookup and event continuation require current tenant/principal authority and the exact job identity; scope-safe absence, stale version, unavailable observer, and denied access remain distinguishable. Poll cadence, wait duration, and event continuation are bounded by the exact operation contract, and a resume cursor is not a job or mutation identity.
    negativeCases: [cross-tenant-job-lookup,stale-job-version-reported-current,unbounded-event-continuation,observer-cursor-used-as-mutation-key]
  - id: media.async.timeout-and-unknown-finality.v1
    sourceRefs: [.product-experience/pdp-2-design-interface-system/api/retry-timeout-unknown-outcome.yaml#ownerDefinedRetrySemantics, .product-experience/pdp-2-design-interface-system/api/cancellation.yaml#ownerDefinedCancellationSemantics]
    rule: A client wait timeout, disconnected listener, or local interruption ends observation only. Preserve the same request and job identities, report unknown finality when authoritative evidence is unavailable, and reconcile the same operation before retrying or submitting a new mutation. A local observer stop is not remote cancellation.
    negativeCases: [client-timeout-as-server-cancel,unknown-outcome-as-failure,blind-resubmit-after-response-loss,disconnect-as-terminal-job-state]
  - id: media.async.parent-child-budget-and-cancellation-scope.v1
    sourceRefs: [.product-experience/pdp-1-domain-data/operations.yaml#/capabilityOperationContracts/records, .product-experience/pdp-1-domain-data/transitions.yaml#ownerDefinedTransitionRecords]
    rule: When an exact contract defines child stages, the parent request identity, deadline, cancellation policy, and remaining budget propagate to each child stage; child completion remains scoped to that child and does not establish parent completion. A stage label or orchestration graph does not create a new job authority or lifecycle taxonomy.
    negativeCases: [child-outlives-parent-deadline-without-explicit-policy,child-success-promoted-to-parent-success,stage-label-created-as-independent-job-authority]
  - id: media.async.group-retry-item-finality.v1
    sourceRefs: [.product-experience/pdp-1-domain-data/operations.yaml#/capabilityOperationContracts/records, .product-experience/pdp-1-domain-data/states.yaml#stateMachines, .product-experience/pdp-2-design-interface-system/api/retry-timeout-unknown-outcome.yaml#ownerDefinedRetrySemantics]
    rule: A group retry retains each item's exact original operation and request identity. Completed eligible items are reused and not resubmitted; failed items are retried only when their exact operation declares replay safe and current authority, rights, profile, and budget still permit it. An item with unknown outcome is read-only reconciled under its original identity before any new effect; unresolved ambiguity blocks that item's resubmission and cannot be converted to ordinary failure or success. Report per-item outcomes and never mark a partial group complete.
    negativeCases: [resubmit-completed-item,blindly-resubmit-ambiguous-item,retry-with-changed-request-identity,report-partial-group-as-complete,inherit-eligibility-from-another-item]
    scopeStatus: OWNER_DEFINED_ASYNC_GROUP_RETRY_DEFINITION; no batch execution, durable storage, or runtime retry is admitted.
  - id: media.async.child-output-lifecycle-boundary.v1
    sourceRefs: [.product-experience/pdp-1-domain-data/privacy.yaml#retentionAndErasure, .product-experience/pdp-1-domain-data/operations.yaml#/capabilityOperationContracts/records]
    rule: A completed child asset retains its exact immutable output identity and parent/child operation provenance only for the lifecycle and retention scope authorized by its owning Media policy. Later parent failure does not erase or rewrite a completed child effect; a retention, rights, or erasure decision can restrict access or trigger its own lifecycle operation. A child result is neither automatically retained forever nor implicitly deleted with its parent.
    negativeCases: [parent-failure-rewrites-completed-child-effect,retain-personal-content-forever-by-immutability,erase-child-without-lifecycle-authority,child-output-access-after-rights-revocation]
    scopeStatus: OWNER_DEFINED_CHILD_OUTPUT_LIFECYCLE_DEFINITION; durable retention and erasure implementation remain unestablished.
  - id: media.async.definition-and-run-state-separation.v1
    sourceRefs: [.product-experience/pdp-1-domain-data/operations.yaml#/capabilityOperationContracts/records, .product-experience/pdp-1-domain-data/states.yaml#/stateMachines/@machineId=media-job, .product-experience/pdp-1-domain-data/transitions.yaml#transitionRecords]
    rule: A versioned workflow definition contains only its declared stages, typed parameters, policy references, and dependency edges. Labels such as “planning” or “rendering” are presentation labels and do not create another job authority or lifecycle taxonomy. Each invocation is a separately identified run whose execution state and effect finality come from the exact owning Media operation and job state machine. Run status never rewrites the definition, parameter or policy values never stand in for run state, and a workflow graph alone grants no dispatch authority or runtime execution.
    negativeCases: [run-state-written-into-shared-definition,parameter-value-treated-as-execution-state,workflow-graph-implies-dispatch-authority,stage-label-creates-another-job-authority,one-run-status-reused-for-another-run]
    scopeStatus: OWNER_DEFINED_WORKFLOW_DEFINITION_AND_RUN_SEPARATION; no runtime workflow engine or dispatch behavior is admitted.
  - id: media.async.bounded-poll-and-resumable-event-observation.v1
    sourceRefs: [.product-experience/pdp-1-domain-data/operations.yaml#/individualOperationContracts/records/@id=media.operation-slice.inspect-job, .product-experience/pdp-1-domain-data/states.yaml#/stateMachines/@machineId=media-job]
    rule: >-
      Long-running job observation uses bounded polling controls from the exact inspect operation. A resumable event stream is
      a separate, optional observer contract and may be described only when implemented and bound: continuation identifiers
      are opaque monotonic event IDs scoped to the exact tenant, principal, job, and stream revision; resumption returns events
      strictly after the supplied ID, reports an expired or missing cursor as a gap requiring an authorized status read, and
      never changes job state. Disconnect or cursor loss does not lose or finalize the job. Missing progress measurements stay
      unknown rather than becoming synthetic percentages. Endpoint paths, status codes, cursor retention, and event schema are
      supplied by the exact transport owner; this definition does not assert their current availability.
    requiredBindings: [exact-job-and-observer-scope, bounded-poll-interval-and-deadline, monotonic-event-id, continuation-order, explicit-gap-recovery, unknown-progress-preserved]
    negativeCases: [unbounded-poll-loop,nonmonotonic-event-id-accepted-as-resumption,cursor-used-across-job-or-tenant,expired-cursor-reported-as-gap-free-continuity,disconnect-reported-as-job-finality,missing-progress-invented-as-percent]
    scopeStatus: OWNER_DEFINED_ASYNC_OBSERVATION_REQUIREMENT; event-stream implementation and transport/runtime conformance remain unverified.
normativeRuleRecords:
  - {id: media.p2.rule.async-request-ack-job-effect-separation.v1, ruleRef: .product-experience/pdp-2-design-interface-system/api/async-operations.yaml#/ownerDefinedAsyncRules/@id=media.async.request-ack-job-effect-separation.v1, sourceAuthority: .product-experience/pdp-2-design-interface-system/api/async-operations.yaml#mediaOwnerDefinitionDecision, acceptanceEffect: none}
  - {id: media.p2.rule.async-observation-bounds-currentness.v1, ruleRef: .product-experience/pdp-2-design-interface-system/api/async-operations.yaml#/ownerDefinedAsyncRules/@id=media.async.observation-bounds-and-currentness.v1, sourceAuthority: .product-experience/pdp-2-design-interface-system/api/async-operations.yaml#mediaOwnerDefinitionDecision, acceptanceEffect: none}
  - {id: media.p2.rule.async-timeout-unknown-finality.v1, ruleRef: .product-experience/pdp-2-design-interface-system/api/async-operations.yaml#/ownerDefinedAsyncRules/@id=media.async.timeout-and-unknown-finality.v1, sourceAuthority: .product-experience/pdp-2-design-interface-system/api/async-operations.yaml#mediaOwnerDefinitionDecision, acceptanceEffect: none}
  - {id: media.p2.rule.async-parent-child-budget-cancellation.v1, ruleRef: .product-experience/pdp-2-design-interface-system/api/async-operations.yaml#/ownerDefinedAsyncRules/@id=media.async.parent-child-budget-and-cancellation-scope.v1, sourceAuthority: .product-experience/pdp-2-design-interface-system/api/async-operations.yaml#mediaOwnerDefinitionDecision, acceptanceEffect: none}
  - {id: media.p2.rule.async-group-retry-item-finality.v1, ruleRef: .product-experience/pdp-2-design-interface-system/api/async-operations.yaml#/ownerDefinedAsyncRules/@id=media.async.group-retry-item-finality.v1, sourceAuthority: .product-experience/pdp-2-design-interface-system/api/async-operations.yaml#mediaOwnerDefinitionDecision, acceptanceEffect: none}
  - {id: media.p2.rule.async-child-output-lifecycle-boundary.v1, ruleRef: .product-experience/pdp-2-design-interface-system/api/async-operations.yaml#/ownerDefinedAsyncRules/@id=media.async.child-output-lifecycle-boundary.v1, sourceAuthority: .product-experience/pdp-2-design-interface-system/api/async-operations.yaml#mediaOwnerDefinitionDecision, acceptanceEffect: none}
  - {id: media.p2.rule.async-definition-run-state-separation.v1, ruleRef: .product-experience/pdp-2-design-interface-system/api/async-operations.yaml#/ownerDefinedAsyncRules/@id=media.async.definition-and-run-state-separation.v1, sourceAuthority: .product-experience/pdp-2-design-interface-system/api/async-operations.yaml#mediaOwnerDefinitionDecision, acceptanceEffect: none}
  - {id: media.p2.rule.async-bounded-poll-resumable-events.v1, ruleRef: .product-experience/pdp-2-design-interface-system/api/async-operations.yaml#/ownerDefinedAsyncRules/@id=media.async.bounded-poll-and-resumable-event-observation.v1, sourceAuthority: .product-experience/pdp-2-design-interface-system/api/async-operations.yaml#mediaOwnerDefinitionDecision, acceptanceEffect: none}
