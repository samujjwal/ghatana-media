viewStateContracts:
  denied: always-show-policy-reason-without-protected-details-and-allowed-retry-options
  unavailable: show-exact-unsupported-source-provider-locale-codec-or-feature
  outOfDate: preserve-edit-draft-and-display-current-observed-revision-before-commit
  unknownFinality: show-observation-not-failed-or-successful-and-reconcile-original-request
  partial: show-which-scenes-and-business-results-are-measured-vs-missing
  abstained: show-unavailable-metric-or-model-advice-with-reason-and-deterministic-fallback
  erasurePending: distinguish-access-revoked-backup-pending-legal-hold-and-external-unknown
  captureDegraded: preserve-qualified-dimensions-and-explicitly-unqualified-supplementary-lanes
  releaseNotApproved: show-independent-human-and-rights-gates-despite-passing-technical-QA
interactionAndA11yRequirements:
  keyboard: [source-select, timecode-seek, region-select, undo, redo, save-draft, publish-denial, branch-choice, source-inspection]
  assistiveStructure: [navigable-timeline-tree, track-grouping, authoritative-revision-label, source-provenance, labelled-controls, live-region-state-announcements, logical-reading-order]
  visualProfiles: [high-contrast, reduced-motion, zoom-responsive, portrait-crop-safe-area, RTL-where-applicable]
  clipboardAndExport: source-bound-versioned-content-only-with-privacy-policy
  focusSafety: errors-and-conflicts-never-steal-focus-or-leave-unreachable-actions
  semanticParity: machine-readable-NOT_ADMITTED-does-not-dispatch-to-fake-runtime
interfacesAndOperations:
  cliInput: versioned-schema-validated-YAML-or-JSON-config-with-explicit-effective-profile
  cliOutput: [plan-hash, project-revision, runId, attemptId, sceneReceipts, measurements, finality, redacted-traceRef, remediation]
  cliFormats: [tty-human-progress, json, jsonl]
  api: signed-versioned-typed-request-response-with-exact-owner-admission-and-idempotency
  sdk: same-operation-ids-errors-guards-and-result-types-as-API-when-admitted
  graphical: same-project-revision-as-CLI-SDK-API-no-secondary-data-model
  events: observations-are-not-publication-acknowledgements-or-domain-success
  agentTools: untrusted-input-with-host-supplied-tenant-and-purpose
  recovery: [read-only-inspect-original-request, qualified-retry-when-explicitly-admitted, safe-cancel-observation, manual-conflict-review]
  never: [invented-route, rendered-cli-view-implies-API-availability, transport-status-implies-domain-success]
productionStudioNavigation:
  entry: [new-from-product-spec, open-source-project, open-generated-project, import-exchange-format]
  workspace: [project-library, production-planner, scene-storyboard, source-review, multitrack-timeline, captions-transcript, narration-mixer, camera-multiview, effects-inspector, interactive-authoring, quality-review, render-preview, delivery]
  persistentPanelState: [selection, source-timecode, active-revision, draft-dirty, locks, scene-focus, inspector-property, review-decision]
  exit: [save-draft, compare-revision, export-draft, submit-review, request-authorized-publish, safe-close]
  constraints: no-implicit-acceptance-no-silent-project-mutating-on-read
nativeAIPresentation:
  modes: [DISABLED, DETERMINISTIC_ONLY, ADVISORY, POLICY_BOUNDED_AUTO]
  suggestionState: [PROPOSED, ABSTAINED, STALE_SOURCE, DENIED, ACCEPTED_EDIT_OPERATION, REJECTED]
  evidence: [sourceIds, modelAndPromptFingerprint, uncertainty, supportedProfile, rightsScope, costBudget]
  manualControl: show-why-each-recommended-edit-exists-and-provide-versioned-reject-or-modify
  denial: no-automated-manual-lock-override-or-training-egress-by-presentation-option
technicalAndSemanticQA:
  separateTabs: [capture-timing, encoded-output, scene-semantic-outcomes, audio-and-captions, provenance-and-rights, human-review]
  measures: [p50-p95-p99-frame-interval, frame-drop-and-duplication, av-drift, silence-black-gaps, source-time-map-uncertainty, output-profile-size]
  reporting: distinguish-measured-PASS-FAIL-ABSTAIN-UNOBSERVED-from-human-approval
securityAndPrivacyViews:
  show: [purpose-and-consent, authorized-source, audience, egress, license-and-codec, retention, intermediate-cleanup, erasure-and-hold]
  logs: redacted-structured-events-and-permission-gated-encrypted-artifact-references-only
  player: CSP-sanitized-sandboxed-no-product-credentials-or-replayable-privileged-script

