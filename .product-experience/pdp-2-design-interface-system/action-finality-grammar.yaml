schemaVersion: media.action-finality-grammar.v1
productId: media
authority: Media interaction and wording for PDP-0 action/finality semantics
status: authored-proposal; P0-010-and-distributed-systems-review-pending
rules:
  - Name an action by its effect, not by its implementation or transport.
  - Confirm only consequential effects that cannot be safely undone; explain scope and affected version.
  - Report a cancellation request separately from confirmed cancellation.
  - Stopping observation or leaving a job view changes only the observer attachment; it does not request or confirm cancellation.
  - An unknown remote outcome disables resubmission until checking the existing job provides a safe next action.
  - Retry creates a new attempt under the same logical job only after the prior attempt is classified as retryable and current authority, policy, and remaining budget are confirmed.
  - Preserve completed artifacts and drafts when a later step fails.
# Explicit Tools-compatible recovery semantics; automatic means observer-safe only.
# No automatic recovery pattern below replays an external effect.
recoveryPatterns:
  - id: media.recovery.unknown-outcome
    name: Reconcile an uncertain external effect
    description: Preserve original job and attempt identities and query authoritative status before any retry or duplicate effect.
    automaticRecovery: false
  - id: media.recovery.observer-reconnect
    name: Reattach to existing observation
    description: A client may reconnect and resume bounded read-only observation using a stable job identity and current authorization.
    automaticRecovery: true
  - id: media.recovery.policy-blocked
    name: Resolve an unmet rights or capability prerequisite
    description: Explain denied or missing rights, consent, owner or provider qualifications; require a fresh authorized decision.
    automaticRecovery: false
  - id: media.recovery.partial-output
    name: Inspect partial output and preserve known completed effects
    description: Show exact completed and uncertain sub-effects; do not automatically submit replacement operations.
    automaticRecovery: false
  - id: media.recovery.cancel-requested
    name: Observe cancellation finality
    description: Observe attempt or provider cancellation acknowledgment without changing logical job finality before confirmed.
    automaticRecovery: true
  - id: media.recovery.conflicted-offline-edit
    name: Reconcile concurrent or stale revisions
    description: Preserve both identities and edits, display the conflicting changes and require an explicit approved merge.
    automaticRecovery: false
boundedUploadArtifactSlice:
  status: bounded-interface-definition-under-PXD-051; independent-PDP-review-and-runtime-admission-open
  decisionRef: .product-experience/decision-log.md#PXD-051
  domainRefs: [media.domain.upload-session, media.domain.artifact, media.domain.artifact-version]
  actions:
    media.action.begin-artifact-upload:
      operationRef: media.operation-slice.begin-upload
      resultMeaning: upload-session-receipt-only; product-artifact-is-RECEIVING-not-AVAILABLE
    media.action.resume-artifact-upload:
      kind: compound-user-confirmed-workflow; not-a-single-operation-or-route
      orderedOperationRefs: [media.operation-slice.inspect-upload, media.operation-slice.append-upload-chunk, media.operation-slice.complete-upload]
      prerequisites: inspect-same-upload; recheck-current-tenant-principal-authority-source-and-state; explicit-user-confirmation-before-appending
      appendRule: OPEN-session-and-contiguous-current-nextChunkIndex-only; append-remaining-parts-only
      unknownOutcome: stop-mutation-and-inspect-same-identity; no-automatic-append-or-completion-replay
      finality: completion-returns-integrity-checked-artifact-receipt-and-enters-VERIFYING-only
      prohibited: [append-after-FINALIZING, append-after-COMPLETED, infer-AVAILABLE-from-completion, create-new-operation-or-route]
    media.action.inspect-artifact:
      operationRef: media.operation-slice.inspect-artifact
      resultMeaning: scoped-metadata-observation-and-opaque-objectReference; not-content-retrieval-or-current-rights-proof
  interfaces:
    http:
      status: exact-existing-route-shapes-cross-linked-to-PDP1; runtimeAdmission-NOT_ADMITTED
      operationIds: [beginMediaUpload, getMediaUpload, appendMediaChunk, completeMediaUpload, getMediaArtifact]
      source: contracts/openapi/media.yaml
      identityRule: exact-method-path-operationId-plus-PDP1-source-ref; names-alone-never-establish-equivalence
    sdk:
      status: exact-existing-method-crosswalk; no-compound-resume-method; runtimeAdmission-NOT_ADMITTED
      methods: [media.sdk.createUploadSession, media.sdk.getUploadSession, media.sdk.uploadPart, media.sdk.completeUploadSession, media.sdk.getArtifact]
      source: .product-experience/pdp-3-product-experience/sdk/operation-registry.yaml
      caveat: completeUploadSession-id-only-overload-cannot-bind-response-to-expected-upload-payload; session-overload-does
    cli:
      status: one-installed-host-configured-read-only-consumer; no-upload-or-resume-command
      commandId: media.cli.artifact.inspect
      operationRef: media.operation-slice.inspect-artifact
      source: .product-experience/pdp-3-product-experience/cli/production-command-registry.yaml
      caveat: explicit-host-and-principal-arguments-are-not-host-identity-or-production-qualification
    agentTool:
      status: no-current-registered-tool-matches-upload-artifact-slice
      observedToolIds: [av.speech-to-text, av.text-to-speech, av.vision-analysis, av.multimodal-inference]
      source: .product-experience/pdp-3-product-experience/agent-tools/tool-registry.yaml
      prohibition: do-not-map-a-media-artifact-reference-input-in-an-unrelated-analysis-tool-to-upload-or-artifact-inspection
  runtimeAdmission: NOT_ADMITTED
  phaseAdmission: pending-independent-PDP2-review
boundedProjectSetupSlice:
  status: bounded-definition-grammar-under-PXD-056; Shared-identity-authority-and-runtime-admission-open
  decisionRef: .product-experience/decision-log.md#PXD-056
  journeyRef: .product-experience/pdp-0-product-truth/journey-catalog.yaml#J-01
  journeyContractRef: .product-experience/pdp-3-product-experience/journey-contracts/first-use-and-project-creation.yaml#journeyId
  scope: create-an-empty-project-with-its-initial-immutable-revision; intent-selection-and-media-processing-are-outside-J-01
  domainRefs: [media.domain.project, media.domain.project-revision]
  authorityRefs:
    identity: .product-experience/pdp-1-domain-data/authority.yaml#ownership.identityAuthenticationAndDelegation
    projectAccessPolicy: .product-experience/pdp-0-product-truth/policy-authority-model.yaml#productPolicy
    deploymentQualification: NOT_ADMITTED
  identityAndContext:
    handoff: Shared-owned-authentication-and-identity-handoff; exact-Shared-authority-and-deployment-binding-remain-unqualified
    protectedDataGate: resolve-current-principal-tenant-and-authorized-workspace-before-project-list-inspection-or-mutation
    workspaceSelection: user-selected-context-is-not-itself-authentication-or-project-access-authority
    failure: preserve-return-destination-and-nonsensitive-intent-draft; keep-protected-project-data-hidden
  operations:
    create:
      operationRef: media.operation-slice.create-project
      actionRef: media.action.create-project
      requestIdentity: trusted-tenant-principal-workspace-plus-stable-caller-requestId-and-canonical-create-payload
      requestFields: [trustedTenantId, trustedPrincipalId, selectedAuthorizedWorkspaceId, title, requestId]
      userDecisionFields: [title, selectedAuthorizedWorkspaceId]
      callerGeneratedFields: [requestId]
      trustedContextFields: [trustedTenantId, trustedPrincipalId]
      confirmation: before-dispatch-show-the-selected-workspace-and-exact-title-and-require-explicit-user-confirmation
      successReceipt: authoritative-durable-commit-of-project-and-initial-revision; result-projectId-and-revisionId-with-headRevisionId-equal-to-revisionId
      committedState: media-project/ACTIVE-plus-media-project-version/COMMITTED
      duplicateRequest: same-requestId-and-same-canonical-payload-resolves-to-the-same-project-and-revision-identities
      conflictingRequest: same-requestId-with-different-canonical-payload-returns-IDEMPOTENCY_CONFLICT
      uncertainOutcome: UNKNOWN_OUTCOME; inspect-the-same-creationRequestId-and-original-requestFingerprint-in-the-original-tenant-principal-and-workspace-scope; unresolved-or-expired-evidence-does-not-authorize-replay-or-a-new-requestId
      prohibited: [blind-create-replay, silent-workspace-or-title-replacement, infer-commit-from-transport-acknowledgement]
    list:
      operationRef: media.operation-slice.list-projects
      actionRef: null
      intent: read-only-currently-authorized-project-summaries-in-trusted-caller-scope
      output: [projectId, workspaceId, title, headRevisionId, projectState, observedAt, nextPageToken]
      limits: [page-bounded, cursor-opaque, read-may-be-stale, never-count-or-suggest-out-of-scope-projects]
    inspect:
      operationRef: media.operation-slice.inspect-project
      actionRefs: [media.action.open-project]
      selector: exactly-one-of-projectId-or-creationRequestId; selectorKind-identifies-the-selected-branch
      requestIdentitySelector: creationRequestId-is-the-same-requestId-and-original-requestFingerprint-used-for-create-and-is-scoped-to-original-tenant-principal-workspace
      output: [selectorKind, projectId, workspaceId, title, projectState, headRevisionId, headRevisionState, headRevisionSnapshot, creationRequestId, requestFingerprint, initialRevisionId, creationOutcome, observedAt]
      reconciliation: creationRequestId-returns-original-create-receipt-and-initialRevisionId-even-if-project-head-has-advanced; never-substitute-current-head-for-created-revision
      limits: [read-only, may-be-stale, no-media-bytes, no-rights-proof, no-global-absence-inference]
      notFound: NOT_FOUND_IN_CALLER_SCOPE; indistinguishable-outside-scope; never-authorizes-create-replay
  problemCodes: [INVALID_REQUEST, ACCESS_DENIED, NOT_FOUND_IN_CALLER_SCOPE, IDEMPOTENCY_CONFLICT, UNAVAILABLE, UNKNOWN_OUTCOME]
  interactionGrammar:
    orderedJourneySteps: 4
    stepBindings:
      J01-1: {view: media.view.authenticate-and-select-context, kind: external-identity-handoff, operationRefs: [], transitionDisposition: NOT_APPLICABLE_WITH_REASON}
      J01-2: {view: media.view.resume-work, kind: authorized-project-list-query, operationRefs: [media.operation-slice.list-projects], transitionDisposition: NOT_APPLICABLE_WITH_REASON}
      J01-3: {view: media.view.find-projects, kind: explicit-confirmed-project-create, operationRefs: [media.operation-slice.create-project], transitionDisposition: NOT_APPLICABLE_WITH_REASON}
      J01-4: {view: media.view.work-in-project, kind: exact-project-and-head-inspection, operationRefs: [media.operation-slice.inspect-project], transitionDisposition: NOT_APPLICABLE_WITH_REASON}
    identityAndWorkspace: [resolve-Shared-identity-handoff, select-or-confirm-authorized-workspace, do-not-read-protected-data-before-handoff]
    resume: list-projects-read-only; present-purposeful-empty-state-when-no-visible-projects
    create: review-exact-title-and-workspace; explicit-confirmation; preserve-requestId-across-uncertain-outcome
    open: inspect-exact-project-and-head-revision-before-entering-project-context
    optionalContinuation: create-media-and-processing-intent-selection-belong-after-J01-and-are-not-project-creation
  channelApplicability:
    web:
      definition: J-01-four-step-project-setup-grammar
      implementation: screen-and-host-qualification-open
    http:
      definition: canonical-logical-operation-records-only
      currentRouteBinding: none-claimed; no-route-or-wire-equivalence-inferred
    sdk:
      currentMatchingMethods: []
      status: no-project-create-list-or-inspect-method-identity-claimed
    cli:
      currentMatchingCommands: []
      status: no-project-create-list-or-inspect-command-identity-claimed
    agentTool:
      currentMatchingTools: []
      status: no-current-registered-tool-identity-claimed
  runtimeAdmission: NOT_ADMITTED
  phaseAdmission: pending-independent-PDP2-review
boundedCaptionVersionSlice:
  status: bounded-definition-grammar-under-PXD-059; independent-PDP-review-and-runtime-admission-open
  decisionRef: .product-experience/decision-log.md#PXD-059
  journeyRef: .product-experience/pdp-0-product-truth/journey-catalog.yaml#J-03
  journeyContractRef: .product-experience/pdp-3-product-experience/journey-contracts/transcribe-and-correct-captions.yaml#journeyId
  scope: register-an-immutable-caption-version-and-compare-two-exact-caption-versions; no-review-approval-or-publication
  domainRefs: [media.domain.caption-version, media.domain.artifact-version, media.domain.transcription]
  authorityRefs:
    identity: .product-experience/pdp-1-domain-data/authority.yaml#ownership.identityAuthenticationAndDelegation
    rightsAndConsent: .product-experience/pdp-0-product-truth/policy-authority-model.yaml#productPolicy
    deploymentQualification: NOT_ADMITTED
  operations:
    registerCaptionVersion:
      operationRef: media.operation.caption-version-write
      actionRef: media.action.save-caption-version
      trustedContextFields: [tenantId, principalId]
      requiredFields: [sourceArtifactId, sourceArtifactVersionId, parentVersionKind, parentVersionId, sourceClockId, ticksPerSecond, sourceDurationTicks, languageDisposition, captionSegments, requestId]
      optionalFields: [languageTag, purpose]
      segmentFields: [segmentId, text, startTick, endTick, origin]
      optionalSegmentFields: [speakerLabel]
      parentRefKinds: [TRANSCRIPT_VERSION, CAPTION_VERSION]
      languageDispositionValues: [NOT_SELECTED, DECLARED_BY_USER, UNCERTAIN]
      segmentOriginValues: [RECOGNIZED, USER_EDITED]
      exactPayloadBinding: tenantId-principalId-requestId-bound-to-the-exact-canonical-fingerprint-of-source-parent-clock-duration-language-disposition-ordered-segments-origin-purpose-and-optional-speaker-label
      confirmation: before-registration-show-the-exact-source-version-parent-caption-content-and-source-clock-timing-basis-and-require-explicit-user-confirmation
      authorization: trusted-current-tenant-and-principal-plus-current-caption-write-policy-consent-and-source-rights-at-the-effect-boundary; actor-role-labels-grant-no-authority
      immutableEffect: create-a-distinct-immutable-caption-version-linked-to-the-exact-source-artifact-version-and-parent; never-overwrite-parent
      successReceiptFields: [captionVersionId, registrationReceiptId, requestFingerprint, sourceArtifactId, sourceArtifactVersionId, parentVersionKind, parentVersionId, languageDisposition, sourceClockId, registeredAt]
      finality: durable-caption-version-registration-only; does-not-approve-review-deliver-publish-or-grant-rights
      sameRequest: exact-same-scope-requestId-and-payload-fingerprint-reconciles-to-the-original-receipt-on-commit; only-a-proven-no-commit-allows-that-same-request-to-proceed-once
      conflict: same-requestId-with-different-payload-or-stale-source-or-parent-must-fail-without-overwrite
      unknownOutcome: stop-and-preserve-the-same-requestId-and-payload-fingerprint; exact-same-request-may-reconcile-only-through-the-canonical-durable-idempotency-contract; if-commit-or-noncommit-cannot-be-proven-remain-UNKNOWN_OUTCOME; never-create-a-new-key-or-blindly-resubmit
      timing: integer-startTick-and-endTick-on-sourceClockId-with-ticksPerSecond-and-sourceDurationTicks; require-startTick>=0-endTick>startTick-and-endTick<=sourceDurationTicks; preserve-submitted-order-and-text-exactly; no-unit-conversion-or-accuracy-claim
      prohibited: [mutate-parent-version, infer-review-approval-from-registration, infer-publication-or-delivery, infer-rights-from-editor-role, retry-with-new-requestId-after-unknown]
      problemCodes: [INVALID_REQUEST, ACCESS_DENIED, VERSION_REGISTRATION_NOT_ALLOWED, SOURCE_NOT_READY, CAPTION_DRAFT_EMPTY, CAPTION_ALIGNMENT_REQUIRED, CAPTION_VERSION_CONFLICT, IDEMPOTENCY_CONFLICT, UNAVAILABLE, UNKNOWN_OUTCOME]
    compareCaptionVersions:
      operationRef: media.operation.caption-version-read
      actionRef: media.action.compare-caption-versions
      selectorKind: EXACT_PAIR
      requestFields: [leftCaptionVersionId, rightCaptionVersionId]
      trustedContextFields: [tenantId, principalId]
      comparisonBounds: exact-distinct-readable-version-pair; claim-comparable-differences-only-when-both-resolve-to-the-same-exact-sourceArtifactId-sourceArtifactVersionId-and-sourceClock
      resultFields: [leftCaptionVersionRef, rightCaptionVersionRef, comparability, sourceIdentityComparison, languageComparison, segmentDifferences, observedAt]
      authorization: trusted-current-tenant-and-principal-plus-current-read-policy-for-both-exact-versions
      finality: read-only-observation; no-merge-no-winning-version-no-review-approval-no-rights-grant
      mismatch: CAPTION_VERSIONS_NOT_COMPARABLE; preserve-both-identities-and-do-not-normalize-away-source-or-clock-mismatch
      unknownOutcome: timeout-or-read-failure-is-UNAVAILABLE; no-domain-mutation-or-write-finality-is-implied
      prohibited: [mutate-either-version, infer-approval-from-comparison, infer-current-rights-from-comparison, select-a-winner]
      problemCodes: [INVALID_REQUEST, ACCESS_DENIED, CAPTION_VERSION_NOT_FOUND_IN_CALLER_SCOPE, CAPTION_VERSIONS_NOT_COMPARABLE, UNAVAILABLE, UNKNOWN_OUTCOME]
    registrationReceiptReconciliation:
      operationRef: media.operation.caption-version-read
      actionRef: media.action.save-caption-version
      selectorKind: REGISTRATION_REQUEST
      requestFields: [requestId, requestFingerprint]
      trustedContextFields: [tenantId, principalId]
      scope: same-original-trusted-tenant-and-principal-as-write; exact-full-requestFingerprint-required
      requiredResultFields: [requestId, requestFingerprint, registrationOutcome, observedAt]
      registrationOutcomeValues: [REGISTERED, DEFINITIVE_NO_COMMIT]
      registeredFields: [captionVersionId, registrationReceiptId, originalSourceArtifactId, originalSourceArtifactVersionId, originalParentVersionKind, originalParentVersionId, originalSourceClockId, originalTicksPerSecond]
      definitiveNoCommitFields: [authoritativeNoCommitEvidenceRef, evidenceObservedAt]
      registeredOutcomeRequires: all-registeredFields-and-original-receipt-for-exact-same-requestFingerprint
      noCommitOutcomeRequires: all-definitiveNoCommitFields
      absentOrUnknown: absent-expired-or-unavailable-receipt-evidence-remains-UNKNOWN_OUTCOME; only-authoritative-proof-may-distinguish-registered-from-definitive-no-commit; never-infers-no-effect-or-authorizes-blind-replay-or-new-requestId
      prohibited: [mutate-version, replay-write, infer-global-absence, infer-approval]
      problemCodes: [INVALID_REQUEST, ACCESS_DENIED, CAPTION_VERSION_NOT_FOUND_IN_CALLER_SCOPE, CAPTION_VERSIONS_NOT_COMPARABLE, UNAVAILABLE, UNKNOWN_OUTCOME]
  observedChannels:
    web:
      source: libs/audio-video-ui/src/screens/TranscriptCaptionScreen.tsx
      actions: [media.action.save-caption-version, media.action.compare-caption-versions]
      disposition: observed-local-action-dispatch; this-grammar-does-not-claim-host-or-runtime-admission
    syntheticFixtureCli:
      source: libs/media-experience-simulation/src/cli.ts
      commands: [media.cli.caption.save-version, media.cli.caption.compare-versions]
      disposition: fixture-only; no-production-cli-equivalence-or-authority-claim
    httpSdkGrpcAgentToolEvents:
      disposition: no-existing-matching-method-or-accepted-binding-claimed
  runtimeAdmission: NOT_ADMITTED
  phaseAdmission: pending-independent-PDP2-review
outcomes:
  - id: media.action-outcome.applied
    label: Request recorded
    next: Show the stable job reference and current state; this does not mean the result was reviewed or approved.
  - id: media.action-outcome.completed
    label: Result ready to review
    next: Link the result to its exact source version and provenance.
  - id: media.action-outcome.partial
    label: Some results are ready
    next: Identify completed and unfinished items separately.
  - id: media.action-outcome.cancellation-pending
    label: Cancellation requested
    next: Keep observing until the stop is confirmed or a racing result is reconciled.
  - id: media.action-outcome.unknown
    label: Outcome not confirmed
    next: View the existing job status or check its uncertain outcome; do not offer blind retry.
  - id: media.action-outcome.blocked
    label: This action is not available
    next: Name the missing authority, rights, integrity, language, or qualification prerequisite.
