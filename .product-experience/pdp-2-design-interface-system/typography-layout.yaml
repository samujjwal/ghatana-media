schemaVersion: media.typography-layout.v1
productId: media
authority: Media reading hierarchy and layout behavior; Shared owns typography and layout primitives
status: authored-proposal; shared-token-binding-and-P0-010-pending
mediaOwnerDefinitionDecision:
  status: MEDIA_OWNER_ACCEPTED_DEFINITION_ONLY
  authority: User-delegated Media product/design owner under the PDP-0–PDP-3 completion mandate
  scope: Reading hierarchy, simple/guided/expert density, task/review/engineering presentation profiles, and progressive disclosure rules below
  acceptance: Density changes information amount and grouping only; it cannot alter permission, action meaning, effect, or finality.
  exclusions: [Shared typography/spacing token values, measured usability or comprehension findings, immutable package binding, independent visual/accessibility acceptance]
  rationale: Keep the immediate safe task and exact source/version visible; progressively disclose diagnostic detail without hiding rights, uncertainty, destructive effects, or recovery.
dependencies:
  pdp0: .product-experience/pdp-0-product-truth/information-architecture.yaml
  sharedOwner: ghatana-shared
readingOrder:
  - user-outcome
  - source-and-current-version
  - current-status-and-uncertainty
  - primary-safe-action
  - supporting-evidence-and-provenance
  - advanced-controls
density:
  simple: intent and safe defaults for one primary task, essential source/version context, and the next safe action over the same state and actions
  guided: quality, style, duration, reference, output, and privacy choices plus timing, rights status, decision inputs, and review evidence over the same state and actions
  expert: typed graph, curves, solver limits, generation, color, audio, and encoding controls plus measurements and provenance over the same state and actions; no hidden change to action meaning or authority
# Delegated Media owner selection over the existing simple/guided/expert behaviors.
# Tools controls the public enum; Shared owns the actual typographic values.
densityProfiles:
  - id: media.density.minimal
    name: Simple
    density: minimal
    description: The current task, affected exact source/version, critical status and next safe action stay visible.
    sourceMode: simple
  - id: media.density.standard
    name: Guided
    density: standard
    description: Adds decision inputs, timing, rights and review evidence without hiding critical safety context.
    sourceMode: guided
  - id: media.density.rich
    name: Expert
    density: rich
    description: Adds typed parameters, measurements and provenance without changing domain meaning or permissions.
    sourceMode: expert
presentationProfiles:
  - id: media.presentation.task
    name: Task focused
    densityRef: media.density.minimal
    description: Default for first use and consequential decisions; advanced detail available explicitly.
  - id: media.presentation.review
    name: Guided review
    densityRef: media.density.standard
    description: Compare source, generated output, status, uncertainty and rights with safe decisions.
  - id: media.presentation.engineering
    name: Expert inspection
    densityRef: media.density.rich
    description: Detailed time, codec, quality, state and provenance parameters for qualified roles.
progressiveDisclosureRules:
  - id: media.disclosure.advanced-parameters
    trigger: Explicit user expansion of Advanced parameters in the current operation.
    reveals: Typed engine, codec, timebase, accuracy, sampling and provider constraints when supported.
    conceals: Technical choices not required to understand the next safe action.
  - id: media.disclosure.provenance
    trigger: Explicit inspection of source and result provenance.
    reveals: Exact version ancestry, model/provider/config and evidence identity plus uncertainty.
    conceals: Long lineage internals without changing access to required rights and consent state.
  - id: media.disclosure.technical-diagnostics
    trigger: Explicit request for detailed diagnostics or assistive inspector navigation.
    reveals: Job, attempt, delivery and reconciliation observations with stable code and explanation.
    conceals: Internal low-level trace content unnecessary for basic task completion.
disclosureInvariants:
  - Never conceal identity, active rights/consent, destructive effect, uncertainty, or safe recovery.
  - Density affects presentation only; it cannot alter domain permission, effect, or finality.
  - Keyboard and screen-reader equivalents expose advanced detail without pointer-only actions.
proposedResponsiveViewports:
  source: docs/migration/expert-reviewed-master-plan.md#19-3-canonical-responsive-and-terminal-variants
  widths: [1536, 1280, 1024, 768, 390, 320]
  heights: [960, 800, 768, 1024, 844, 640]
  status: proposed-fixtures-not-browser-acceptance
layoutRules:
  - Transcript text and its source-time reference stay adjacent at every width.
  - At narrow widths, source playback and transcript editing switch between clear task views; neither loses its position or pending edits.
  - Use contextual drawers for optional technical details instead of compressing the primary transcript region.
  - Long localized labels wrap; they do not clip, overlap controls, or change meaning.
  - The source-versus-caption distinction remains visible without relying on color.
