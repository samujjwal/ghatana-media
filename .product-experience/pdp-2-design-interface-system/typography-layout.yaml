schemaVersion: media.typography-layout.v1
productId: media
authority: Media reading hierarchy and layout behavior; Shared owns typography and layout primitives
status: authored-proposal; shared-token-binding-and-P0-010-pending
mediaOwnerDefinitionDecision:
  status: MEDIA_OWNER_ACCEPTED_DEFINITION_ONLY
  authority: User-delegated Media product/design owner under the PDP-0–PDP-3 completion mandate
  scope: Reading hierarchy, simple/guided/expert density, task/review/engineering presentation profiles, and progressive disclosure rules below
  acceptance: Density changes information amount and grouping only; it cannot alter permission, action meaning, effect, or finality.
  exclusions: [Shared typography/spacing token values, measured usability or comprehension findings, immutable package binding, independent visual/accessibility acceptance]
  rationale: Keep the immediate safe task and exact source/version visible; progressively disclose diagnostic detail without hiding rights, uncertainty, destructive effects, or recovery.
dependencies:
  pdp0: .product-experience/pdp-0-product-truth/information-architecture.yaml
  sharedOwner: ghatana-shared
readingOrder:
  - user-outcome
  - source-and-current-version
  - current-status-and-uncertainty
  - primary-safe-action
  - supporting-evidence-and-provenance
  - advanced-controls
density:
  simple: intent and safe defaults for one primary task, essential source/version context, and the next safe action over the same state and actions
  guided: quality, style, duration, reference, output, and privacy choices plus timing, rights status, decision inputs, and review evidence over the same state and actions
  expert: typed graph, curves, solver limits, generation, color, audio, and encoding controls plus measurements and provenance over the same state and actions; no hidden change to action meaning or authority
# Delegated Media owner selection over the existing simple/guided/expert behaviors.
# Tools controls the public enum; Shared owns the actual typographic values.
densityProfiles:
  - id: media.density.minimal
    name: Simple
    density: minimal
    description: The current task, affected exact source/version, critical status and next safe action stay visible.
    sourceMode: simple
  - id: media.density.standard
    name: Guided
    density: standard
    description: Adds decision inputs, timing, rights and review evidence without hiding critical safety context.
    sourceMode: guided
  - id: media.density.rich
    name: Expert
    density: rich
    description: Adds typed parameters, measurements and provenance without changing domain meaning or permissions.
    sourceMode: expert
presentationProfiles:
  - id: media.presentation.task
    name: Task focused
    densityRef: media.density.minimal
    description: Default for first use and consequential decisions; advanced detail available explicitly.
  - id: media.presentation.review
    name: Guided review
    densityRef: media.density.standard
    description: Compare source, generated output, status, uncertainty and rights with safe decisions.
  - id: media.presentation.engineering
    name: Expert inspection
    densityRef: media.density.rich
    description: Detailed time, codec, quality, state and provenance parameters for qualified roles.
progressiveDisclosureRules:
  - id: media.disclosure.advanced-parameters
    trigger: Explicit user expansion of Advanced parameters in the current operation.
    reveals: Typed engine, codec, timebase, accuracy, sampling and provider constraints when supported.
    conceals: Technical choices not required to understand the next safe action.
  - id: media.disclosure.provenance
    trigger: Explicit inspection of source and result provenance.
    reveals: Exact version ancestry, model/provider/config and evidence identity plus uncertainty.
    conceals: Long lineage internals without changing access to required rights and consent state.
  - id: media.disclosure.technical-diagnostics
    trigger: Explicit request for detailed diagnostics or assistive inspector navigation.
    reveals: Job, attempt, delivery and reconciliation observations with stable code and explanation.
    conceals: Internal low-level trace content unnecessary for basic task completion.
disclosureInvariants:
  - Never conceal identity, active rights/consent, destructive effect, uncertainty, or safe recovery.
  - Density affects presentation only; it cannot alter domain permission, effect, or finality.
  - Keyboard and screen-reader equivalents expose advanced detail without pointer-only actions.
proposedResponsiveViewports:
  source: docs/migration/expert-reviewed-master-plan.md#19-3-canonical-responsive-and-terminal-variants
  widths: [1536, 1280, 1024, 768, 390, 320]
  heights: [960, 800, 768, 1024, 844, 640]
  status: proposed-fixtures-not-browser-acceptance
layoutRules:
  - Transcript text and its source-time reference stay adjacent at every width.
  - At narrow widths, source playback and transcript editing switch between clear task views; neither loses its position or pending edits.
  - Use contextual drawers for optional technical details instead of compressing the primary transcript region.
  - Long localized labels wrap; they do not clip, overlap controls, or change meaning.
  - The source-versus-caption distinction remains visible without relying on color.

responsiveCompositionReferences:
  status: OWNER_DEFINED_REFERENCE_CONTRACTS; no rendered conformance or comprehension result is implied
  widthBands:
    narrow: { widthsCssPx: [320, 390], arrangement: single-column-reading-order }
    medium: { widthsCssPx: [768, 1024], arrangement: primary-work-region-with-contextual-support }
    wide: { widthsCssPx: [1280, 1536], arrangement: parallel-regions-with-explicit-reading-order }
  representativeViews:
    - viewRef: media.view.review-rights-and-consent
      sourceContractRef: .product-experience/pdp-3-product-experience/screen-contracts/review-rights-and-consent.yaml
      requiredVisibleFacts: [affected-source-identity-and-version, requested-purpose, rights-and-consent-scope, validity-and-revocation, decision-and-safe-next-action]
      factBindings:
        - { fact: affected-source-identity-and-version, sourcePointer: '#/anatomy/0' }
        - { fact: requested-purpose, sourcePointer: '#/contextGoalNowNext/context' }
        - { fact: rights-and-consent-scope, sourcePointer: '#/anatomy/2' }
        - { fact: validity-and-revocation, sourcePointer: '#/anatomy/3' }
        - { fact: decision-and-safe-next-action, sourcePointer: '#/contextGoalNowNext/next' }
    - viewRef: media.view.job-status
      sourceContractRef: .product-experience/pdp-3-product-experience/screen-contracts/job-status.yaml
      requiredVisibleFacts: [job-and-attempt-identity, observed-state, effect-finality, unknown-outcome-warning, safe-recovery-action]
      factBindings:
        - { fact: job-and-attempt-identity, sourcePointer: '#/anatomy/0' }
        - { fact: observed-state, sourcePointer: '#/anatomy/2' }
        - { fact: effect-finality, sourcePointer: '#/anatomy/5' }
        - { fact: unknown-outcome-warning, sourcePointer: '#/anatomy/5' }
        - { fact: safe-recovery-action, sourcePointer: '#/anatomy/6' }
    - viewRef: media.view.review-transcript
      sourceContractRef: .product-experience/pdp-3-product-experience/screen-contracts/review-transcript.yaml
      requiredVisibleFacts: [source-version, transcript-version, source-time-reference, recognition-uncertainty, edit-and-review-actions]
      factBindings:
        - { fact: source-version, sourcePointer: '#/contextGoalNowNext/context' }
        - { fact: transcript-version, sourcePointer: '#/domainObjectRefs/0' }
        - { fact: source-time-reference, sourcePointer: '#/anatomy/3' }
        - { fact: recognition-uncertainty, sourcePointer: '#/contextGoalNowNext/now' }
        - { fact: edit-and-review-actions, sourcePointer: '#/contextGoalNowNext/next' }
    - viewRef: media.view.work-in-project
      sourceContractRef: .product-experience/pdp-3-product-experience/screen-contracts/work-in-project.yaml
      requiredVisibleFacts: [project-identity-and-version, source-and-output-identities, pending-work-finality, primary-safe-action, recovery-path]
      factBindings:
        - { fact: project-identity-and-version, sourcePointer: '#/anatomy/1' }
        - { fact: source-and-output-identities, sourcePointer: '#/anatomy/2' }
        - { fact: pending-work-finality, sourcePointer: '#/anatomy/3' }
        - { fact: primary-safe-action, sourcePointer: '#/contextGoalNowNext/next' }
        - { fact: recovery-path, sourcePointer: '#/anatomy/5' }
  invariants:
    - Every width band presents the same source identities, domain state, permissions, actions, and finality; layout may only change arrangement and optional-detail disclosure.
    - Keyboard traversal and assistive reading order follow the same declared hierarchy at all widths; no essential action or critical fact is reachable only by horizontal scrolling, pointer hover, or color interpretation.
    - The advanced-detail disclosure control remains discoverable at every width and exposes the same declared detail without changing defaults or authority.

comprehensionRubric:
  status: REVIEW_PROTOCOL_DEFINED; participant study NOT_RUN
  taskPrompts:
    - id: media.comprehension.identify-source-and-version
      measures: Participant identifies the exact selected source and immutable version before acting.
    - id: media.comprehension.distinguish-request-from-effect
      measures: Participant distinguishes a requested action, observed acknowledgement, completed effect, and unknown finality.
    - id: media.comprehension.find-rights-boundary
      measures: Participant identifies affected material, purpose, scope, expiry/revocation and the applicable decision.
    - id: media.comprehension.find-safe-recovery
      measures: Participant identifies whether work may still run and the next permitted recovery action without blind resubmission.
    - id: media.comprehension.locate-advanced-detail
      measures: Participant finds advanced typed controls and provenance while recognizing that detail does not grant new authority.
  evidenceRecordFields: [viewRef, viewportWidthCssPx, zoomPercent, inputMethod, assistiveTechnology, participantRole, taskId, firstAction, answerByCriticalFact, promptCount, observedFailure, severity, retestDecision]
  passRule: Every safety-critical fact is identified accurately without facilitator prompting; any error concerning source/version, rights, effect finality, authority, or recovery is a blocking design finding until retested.
  nonClaims: [No participant study completed, no measured usability or comprehension acceptance, no independent visual or accessibility approval]

repeatSafeStepDisclosure:
  id: media.disclosure.repeat-safe-step-scope.v1
  rule: A repeated technical step that is read-only or otherwise explicitly classified as safe by its exact owner operation does not require a second confirmation dialog when the operation, source/object versions, authority, purpose, profile, destination, and material risk facts remain unchanged and current. Re-evaluate and request the operation-defined confirmation whenever one of those facts changes, authority or consent may have expired or been revoked, the effect is irreversible or externally visible, or the operation does not establish that repetition is safe. A prior confirmation is scoped to the exact action and facts shown; it is not a reusable blanket authorization.
  unchangedFacts: [canonicalActionId, operationIdAndVersion, exactSourceAndObjectVersions, trustedTenantAndPrincipal, purposeAndConsentScope, profileAndVersion, destination, declaredEffectRiskAndBudget]
  recheckBeforeRepeat: [currentAuthority, currentConsentAndRights, currentEligibility, exactOperationIdempotencyOrReadOnlyClassification]
  negativeCases:
    - reuse-confirmation-after-source-version-change
    - repeat-after-consent-expiry-or-revocation
    - repeat-destructive-or-external-effect-under-read-only-classification
    - suppress-operation-required-confirmation
    - infer-safety-from-prior-success-or-display-label
  scopeStatus: OWNER_DEFINED_INTERACTION_CONFIRMATION_SCOPE; it removes redundant prompts only for unchanged, owner-classified safe steps and does not establish operation safety or runtime admission.

normativeRuleRecords:
  - id: media.p2.rule.responsive-content-and-order.v1
    ruleRef: '#/responsiveCompositionReferences/invariants/0'
    authorityRef: '#/responsiveCompositionReferences'
    acceptanceEffect: none
  - id: media.p2.rule.responsive-keyboard-equivalence.v1
    ruleRef: '#/responsiveCompositionReferences/invariants/1'
    authorityRef: .product-experience/pdp-2-design-interface-system/accessibility.yaml
    acceptanceEffect: none
  - id: media.p2.rule.advanced-detail-discoverability.v1
    ruleRef: '#/responsiveCompositionReferences/invariants/2'
    authorityRef: '#/density'
    acceptanceEffect: none
  - id: media.p2.rule.comprehension-rubric.v1
    ruleRef: '#/comprehensionRubric/passRule'
    authorityRef: '#/comprehensionRubric'
    acceptanceEffect: none
  - id: media.p2.rule.repeat-safe-step-disclosure.v1
    ruleRef: '#/repeatSafeStepDisclosure'
    authorityRef: '#/repeatSafeStepDisclosure'
    acceptanceEffect: none
