    id: media.pdp2-pdp3.design-interface-handoff.v1
    sourcePhase: PDP-2
    consumerPhase: PDP-3
    status: DEFINITION_HANDOFF_CONTRACT
    authorityBoundary: >-
      This contract exports the reusable design, component, responsive, accessibility, and machine-interface meanings
      for PDP-3 screen and journey definitions. It does not claim Shared package release or owner acceptance, independent
      design/accessibility certification, implementation admission, runtime availability, or production deployment.
    sourcePopulations:
