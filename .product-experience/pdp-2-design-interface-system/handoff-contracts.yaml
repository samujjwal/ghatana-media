    requiredMeaning:
      reusableComposition: >-
        Bind each screen to exact template, layout, region, component, recipe, pattern, and composition-rule identities.
        Use the reviewed family classification; a contract-only family is a definition, not an implemented control.
      designAuthority: >-
        Consume exact Media semantic aliases and the pinned public Shared CSS-variable contract. Preserve Shared ownership
        of primitive values and defer immutable package, registry, and owner admission.
      stateAndFinality: >-
        Present exact PDP-1 state, action, guard, effect, request identity, and operation references. Keep pending,
        accepted, completed, denied, cancelled, and outcome-unknown meanings distinct; unknown is never a blind retry.
      responsiveAndAccessibleBehavior: >-
        Preserve information order and essential rights, source/version, job state, unknown finality, and safe recovery
        across narrow reflow, zoom, RTL, forced colors, and reduced motion. Labels, keyboard behavior, focus, and live
        region semantics remain part of each selected component contract.
      interfaceMeaning: >-
        Preserve exact typed HTTP, gRPC, SDK, CLI, event, and Agent Tool operation/request/result/error/authority
        meanings. For gRPC, keep exact service/RPC identity, request and response fields, streaming shape, and its
        explicit operation/non-operation disposition; unresolved semantic field parity remains unresolved. Unadmitted
        or fixture-only interfaces remain visibly non-callable and do not gain invented routes or guarantees.
    consumerObligations:
      - Complete the 47 concrete screens, 30 journeys, and 130 journey steps against the frozen PDP-0, PDP-1, and PDP-2 meanings.
      - Bind screen actions to exact operation, request/result/error, capability, requirement, state, guard, effect, and finality references where applicable.
      - Keep all state and action variants source-linked and define denial, pending, loading, error, empty, partial, and outcome-unknown cases where applicable.
      - Use reusable templates, layouts, recipes, patterns, component families, and token aliases; do not create screen-local semantic primitives.
      - Treat candidate screen links as inputs to PDP-3 review, not as evidence that screen behavior is complete.
      - Preserve the exact PDP-1 canonical-domain handoff and all PDP-2 identity references; reject stale, duplicate, or name-matched substitutions.
      - For proposal-only PDP-1 feature handoffs, carry the explicitly defined PDP-2 presentation, accessible control, typed interface bindings, and source-surface mappings into PDP-3 without promoting proposed applicability, support, or admission.
      - Record development completion separately from external admission and independent certification.
    negativeCases:
      - A contract-only component is presented as an implemented or callable control.
      - A public Shared package name or CSS variable is accepted without the exact pinned public-export and semantic-source binding.
      - A narrow, zoomed, RTL, forced-color, or reduced-motion presentation hides a right, source/version, denial, or unknown outcome.
      - A cancellation request, accepted job, timeout, or abort is presented as confirmed finality.
      - An unknown outcome triggers a blind retry or is rendered as success or failure.
      - A screen invents an operation, route, permission, effect, availability, or event-delivery guarantee.
      - A semantic state or action is bound by display label while its exact source identity differs.
      - A missing Shared release or independent review is represented as approval or qualification.
    deferredEvidence:
      - Shared package immutable release, registry publication, and Shared owner acceptance.
      - Independent visual, accessibility, and specialist conformance certification.
      - Runtime, production-host, provider, route, and event-delivery admission.
      - Lifecycle receipts, convergence, release certification, and production deployment.
    deferredDownstreamFindings:
      - id: PDP3-J03-2-DECISION-REFERENCE-CROSSWALK
        ownerPhase: PDP-3
        disposition: SOURCE_CROSS_REFERENCE_RECONCILIATION_REQUIRED
        sourceRefs:
          - .product-experience/pdp-2-design-interface-system/action-finality-grammar.yaml#boundedTranscriptionSubmissionSlice/journeyDecisionRef
          - .product-experience/pdp-3-product-experience/journey-contracts/transcribe-and-correct-captions.yaml#steps/@stepId=J03-2/decisionRef
          - .product-experience/pdp-3-product-experience/action-registry.yaml#actions/@id=media.action.request-transcription/actionDefinitionSemantics/reviewDecisionRef
        observedReferences:
          pdp2GrammarJourneyDecisionRef: .product-experience/decision-log.md#PXD-072
          pdp3JourneyStepDecisionRef: .product-experience/decision-log.md#PXD-159
          pdp3ActionRegistryReviewDecisionRef: .product-experience/decision-log.md#PXD-072
        reviewQuestion: >-
          Determine whether these fields intentionally name distinct decisions or whether an exact PDP-3 projection
          update is needed. Preserve the PDP-2 grammar's PXD-072 journeyDecisionRef until that cross-reference is
          reconciled; this item records a question, not a proven defect or runtime-admission finding.
    proposalFeatureHandoffs:
      - id: media.rules.manage.pdp2-interface-proposal.v1
        featureRef: media.rules.manage
        sourcePhase: PDP-2
        consumerPhase: PDP-3
        status: COORDINATOR_AUTHORED_PROPOSAL_HANDOFF; PENDING_OWNER_REVIEW
        sourceRefs:
          - .product-experience/pdp-1-domain-data/handoff-contracts.yaml#/handoffs/pdp1ToPdp2CanonicalDomain/proposalHandoffs/@id=media.rules.manage.pdp1-definition-handoff.v1
          - .product-experience/pdp-2-design-interface-system/interface-grammar.yaml#ruleManagementProposalInterfaceBinding
          - .product-experience/pdp-2-design-interface-system/semantic-state-grammar.yaml#ruleManagementProposalPresentation
          - .product-experience/pdp-2-design-interface-system/accessibility.yaml#ownerDefinedRuleManagementProposalControls
        surfaceMappingRef: .product-experience/pdp-0-product-truth/campaign-extensions.yaml#records/@id=AUD-SPEC-020/capabilityDefinition/proposedApplicableChannels
        surfaceMappingDisposition: COORDINATOR_PROPOSAL_ONLY; exact physical-surface applicability remains governed by the authoritative surface registry and phase applicability records
        typedMeaningRefs:
          compileRequest: .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/compileContract/requestSchema
          compileResult: .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/compileContract/resultSchema
          inspectRequest: .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/inspectContract/requestSchema
          inspectResult: .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/inspectContract/resultSchema
          validationRequest: .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/validationContract/requestSchema
          validationResult: .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/validationContract/resultSchema
          reuseRequest: .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/reuseContract/requestSchema
          reuseResult: .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/reuseContract/resultSchema
          candidate: .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/ruleSetVersion/candidate/schema
          normalizedGraph: .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/normalizedSemanticGraph/schema
          fingerprint: .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/semanticFingerprint/schema
          validationReceipt: .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/validationContract/resultSchema
          candidateOperationPlan: .product-experience/pdp-1-domain-data/rule-management-contracts.yaml#/reuseContract/operationPlanSchema
        preservedMeaning: >-
          Preserve tenant, purpose, exact scope and version, expected predecessor, source provenance, normalized graph,
          semantic fingerprint, validation context and receipt, target operation, candidate operation plan, and every
          distinct operation outcome. Candidates and validation are not approval or execution; reuse returns a
          candidate operation plan only. UNKNOWN and STALE require exact-version reconciliation and never select a
          latest version, silently rebase, blindly retry, or produce partial effects.
        consumerObligations:
          - Define complete author, inspect, validate, reuse, and recovery journeys only against the exact typed references above.
          - Keep channel-to-surface mappings visibly proposal-only until an authoritative applicability/owner decision exists; no channel mapping admits a route, runtime, or invocation.
          - Preserve accessible control and status requirements from the PDP-2 accessibility definition and keep presentation values distinct from persistent domain states.
          - Bind each candidate, validation receipt, and operation plan to its exact tenant, purpose, version, provenance, predecessor, fingerprint, target, and request context.
          - Expose each denied, invalid, unsupported, stale, conflict, unknown, or unavailable outcome with its exact recovery boundary and no implied partial effects.
        negativeCases:
          - Presenting a proposal-only operation or proposed channel as callable, supported, or owner-approved.
          - Treating a candidate, VALID observation, or operation plan as approval, execution, or a measured media result.
          - Substituting a latest/different version, silently rebasing, or blindly retrying after STALE or UNKNOWN.
          - Omitting accessible keyboard and non-drag authoring, exact-source status naming, or screen-reader exposure.
        ownerApproval: NOT_CLAIMED
        independentAcceptance: NOT_CLAIMED
        runtimeAdmission: NOT_ADMITTED
        executionAdmission: NOT_ADMITTED
    developmentStatusRef: docs/implementation/pdp-2-phase-dev-status.json
    scopeStatus: design-and-interface-definitions-exported-for-PDP3; development-gate-status-is-recorded-separately
