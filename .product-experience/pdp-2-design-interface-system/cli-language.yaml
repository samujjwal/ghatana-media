schemaVersion: media.cli-language.v1
productId: media
authority: Product command language and human-readable terminal output
status: authored-proposal; CLI-owner-and-P0-010-review-pending
commandPrinciples:
  - Start from a product verb and object; provider, model, queue, and codec names are advanced diagnostic data only.
  - Use one registry of command IDs; aliases must resolve to the same action and may not duplicate behavior.
  - Human labels can localize; JSON keys, reason codes, and stable IDs do not.
  - TTY progress is concise; non-TTY output is stable and line-oriented.
  - JSON output contains state, finality, source/result references, and the next safe action.
  - External-engine and model names are expert diagnostics; they are not required positional arguments for product intent.
finiteOperationAliasRule:
  id: media.cli.finite-operation-aliases
  rule: >-
    Command aliases are a finite, explicitly enumerated set that resolves to an
    existing canonical creation or composition command/action. An alias cannot
    create a new operation, change the canonical action, widen its accepted
    inputs or outputs, bypass validation/authority, or add duplicated behavior.
    Aliases are registered with the canonical command and have exact parity tests;
    unknown aliases fail as unsupported.
  scopeStatus: OWNER_DEFINED_COMMAND_LANGUAGE_RULE; command/runtime admission remains separate.
ownerDefinedInvocationRules:
  - id: media.cli.literal-argument-boundary.v1
    sourceAuthority: Media CLI command language and the selected command's typed argument contract
    rule: Treat user-supplied values, paths, filter expressions, profile names, and request text as literal data. Never interpolate them into a shell command or executable fragment. Any subprocess boundary uses a fixed executable plus separately passed argument values; parsing and validation happen before invoking the child, and unsupported values fail without dispatch.
    appliesTo: [CLI command arguments, file paths, query/filter text, configured profile values, child-process invocation]
    negativeCases:
      - shell metacharacters remain data and cannot append a command
      - a path or filter value cannot select an executable or inject an option outside the typed argument contract
      - invalid or unsupported arguments fail before any child process is launched
    scopeStatus: OWNER_DEFINED_INTERFACE_DEFINITION; this rule does not admit a CLI runtime or an external executable.
  - id: media.cli.finite-command-family-registry.v1
    sourceAuthority: .product-experience/pdp-3-product-experience/cli/command-registry.yaml
    rule: Parameterized command families expand only to a finite set of registered command identities. Where an exact action binding is authored, it is explicit; this current fixture registry has no production action bindings. Wildcards, implicit aliases, or a parameter value cannot introduce a new command, action, operation, or permission; unknown members fail as unsupported.
    negativeCases:
      - an unregistered family member fails instead of deriving a command ID by string substitution
      - an alias resolves only through an explicitly authored canonical action binding and does not duplicate behavior
      - a parameter cannot widen authority or accepted inputs beyond the registered command
    scopeStatus: OWNER_DEFINED_COMMAND_LANGUAGE_RULE; the finite owner-defined command population does not imply an installed production CLI or runtime admission.
  - id: media.cli.cross-channel-canonical-action-identity.v1
    sourceAuthority: Media canonical action and operation identities; channel adapters own only exact bindings to those identities.
    rule: Every production CLI command that invokes a Media operation has an explicit canonical action ID and exact operation/version binding equal to the binding used by the corresponding Web/API command. An alias resolves to that same action and operation; command spelling, route shape, provider name, or fixture label never establishes equivalence. A command lacking a complete exact cross-channel binding remains a fixture or NOT_ADMITTED and cannot dispatch.
    canonicalRegistryRef: .product-experience/pdp-3-product-experience/cli-command-registry.yaml
    registryCoverageRule: Every command has one unique command ID in the finite Media command registry. A command that corresponds to a source-defined UI action carries an exact actionRef and operation/version binding; a genuinely CLI-only command carries an explicit machine-only applicability disposition and an exact owner operation/version instead. No command or alias may be inferred from a family name, path, label, or option. The canonical registry is the sole source for help/completion and channel adapters project its exact bindings.
    requiredBindingFields: [commandId, canonicalActionId, operationId, operationVersion, webBindingRef, apiBindingRef, cliBindingRef]
    equalityRules: [cliBindingRef.actionId==canonicalActionId, webBindingRef.actionId==canonicalActionId, apiBindingRef.actionId==canonicalActionId, cliBindingRef.operationId==operationId, webBindingRef.operationId==operationId, apiBindingRef.operationId==operationId, everyBinding.operationVersion==operationVersion]
    negativeCases:
      - command-name-matched-to-action-without-source-binding
      - cli-action-id-differs-from-web-or-api-action-id
      - same-action-name-but-different-operation-version
      - unsupported-api-route-invented-to-complete-cli-row
      - fixture-command-promoted-to-production-admission
    currentPopulation: >-
      The current owner-defined registry contains 47 finite command identities:
      42 capability-backed command contracts and five separately authored
      logical owner-operation contracts. Six command rows have exact source
      action/operation candidates; commands without an exact UI action carry a
      machine-only disposition rather than a name-derived action. This does not
      establish production CLI/Web/API transport binding or runtime admission.
    scopeStatus: OWNER_DEFINED_CROSS_CHANNEL_IDENTITY_RULE; production command bindings and runtime admission remain NOT_ADMITTED until exact source records exist.
  - id: media.cli.command-flag-and-idempotency-applicability.v1
    sourceAuthority: Media CLI owner command registry joined to each exact canonical operation contract
    rule: >-
      Every option has an explicit applicability set of exact command IDs and
      invocation modes in the canonical command registry. A command accepts only
      options declared for that command; a common presentation option is inherited
      only through an explicit registry binding and cannot change operation,
      authority, effect, or finality. An idempotency key is required only when the
      exact canonical operation contract declares it for that effect. A read-only
      query does not acquire a mutation idempotency requirement from a shared CLI
      flag set, transport convention, or neighboring command. Missing applicability
      or operation semantics remain unsupported; do not infer them from names.
    requiredBindings: [commandId, invocationMode, exactOptionSet, canonicalOperationRef, operationEffectClass, idempotencyRuleWhenRequired]
    negativeCases:
      - flag-accepted-by-unlisted-command
      - shared-global-flag-injected-without-explicit-registry-binding
      - read-only-query-forced-to-supply-mutation-idempotency-key
      - mutation-omits-operation-declared-idempotency-key
      - idempotency-requirement-inferred-from-command-or-transport-name
    scopeStatus: OWNER_DEFINED_CLI_OPTION_APPLICABILITY; no parser/runtime behavior or command admission is implied.
