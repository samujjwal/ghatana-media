    sourceAuthority: .product-experience/pdp-1-domain-data/operations.yaml#ownerDefinedOperationContracts
    acceptanceEffect: none
commandNaming:
  rootCommand: ghatana-media
  rule: Prefer a user-intent verb and a concrete object; stable IDs, exact options, aliases, and effects are owned by the PDP-3 command registry.
  commandRegistry: .product-experience/pdp-3-product-experience/cli-command-registry.yaml
  completionHelpRule: Generate command completion and help from the one canonical command registry; aliases resolve to the same action and cannot add independent behavior.
  jobCommands:
    viewStatus: ghatana-media job status --job <job-id>
    checkUncertainOutcome: ghatana-media job check-outcome --job <job-id>
    rule: Status is read-only; checking an uncertain outcome uses the same job identity and never dispatches new work.
  status: naming-rule-only; no-installed-cli-claim
machineOutput:
  formats: [json, jsonl]
  stableExitCodesRequired: true
  unknownOutcome: represent-explicitly-and-disable-blind-retry
  exitCodeMapping: local-simulator-mapping-is-defined-in-the-PDP-3-registry; production-runtime-mapping-awaits-owner-review
  productExitCodeTaxonomy:
    source: docs/migration/expert-reviewed-master-plan.md#17-command-line-interface
    ownerRuleId: media.cli.exit-code-taxonomy
    scope: Media product command result taxonomy; definition does not assert installed-runtime behavior or production owner acceptance
    codes:
      - {id: media.cli.exit.request-succeeded, code: 0, result: requested-action-succeeded-or-durable-submission-accepted}
      - {id: media.cli.exit.invalid-request, code: 2, result: invalid-arguments-or-input-validation}
      - {id: media.cli.exit.authentication-failure, code: 3, result: authentication-failure}
      - {id: media.cli.exit.authorization-rejection, code: 4, result: authorization-privacy-rights-or-policy-rejection}
      - {id: media.cli.exit.capability-unavailable, code: 5, result: required-capability-unavailable-or-unqualified}
      - {id: media.cli.exit.admission-rejection, code: 6, result: capacity-quota-or-dependency-admission-rejection}
      - {id: media.cli.exit.job-failed, code: 7, result: job-failed}
      - {id: media.cli.exit.cancelled, code: 8, result: remote-job-confirmed-cancelled}
      - {id: media.cli.exit.client-timeout, code: 9, result: client-wait-timeout-remote-job-may-still-run}
      - {id: media.cli.exit.outcome-unknown, code: 10, result: outcome-unknown-reconciliation-required}
      - {id: media.cli.exit.version-conflict, code: 11, result: version-or-idempotency-conflict}
      - {id: media.cli.exit.local-interruption, code: 130, result: local-observation-interrupted-remote-job-state-and-finality-unchanged}
    distinctions:
      - authentication-failure-is-not-authorization-or-rights-rejection
      - client-wait-timeout-does-not-prove-remote-job-failure
      - cancellation-request-does-not-prove-confirmed-cancellation
      - exit-130-reports-local-signal-interruption-only-and-never-server-cancellation-or-job-failure
      - production-runtime-exit-code-mapping-remains-owner-review-pending
  sigintSemantics: distinguish-stop-watching-from-request-cancellation-and-confirmed-cancellation
ownerDefinedMachineOutputRules:
  - id: media.cli.machine-output-exit-semantics.v1
    sourceAuthority: Media product result taxonomy and command presentation contract
    rule: In JSON mode, stdout contains exactly one versioned result or error object; diagnostics and progress use stderr. TTY, color, quiet, and width choices may change presentation only; they cannot change stable JSON keys, reason codes, command effects, or exit-code meaning. Non-TTY output remains line-oriented; color-disabled output contains no ANSI escapes.
    negativeCases:
      - progress text or a banner on JSON stdout invalidates the machine-output contract
      - changing terminal width or NO_COLOR cannot change the result object or exit code
      - a quiet presentation cannot hide a safety warning, authorization denial, unknown outcome, or next required action
      - rendering an outcome unknown as ordinary failure or success is invalid
    scopeStatus: OWNER_DEFINED_INTERFACE_DEFINITION; local fixture mappings do not admit production exit-code behavior.
  - id: media.cli.wait-timeout-semantics.v1
    sourceAuthority: Media command identity/finality and client-versus-server deadline definitions
    rule: A wait option returns the requested final result or an explicit non-success. A client timeout bounds observation unless a command separately declares a server deadline; timeout or interruption of local waiting does not cancel the remote job, prove failure, or authorize a blind resubmission. Reconciliation observes the same job/request identity first.
    negativeCases:
      - local wait timeout cannot be reported as remote job failure
      - interrupting a local poll cannot be reported as confirmed remote cancellation
      - an unknown outcome cannot trigger a second mutation under a new request identity
      - only a separately declared server deadline changes remote execution
    scopeStatus: OWNER_DEFINED_INTERFACE_DEFINITION; it defines no connected CLI runtime behavior.
  - id: media.cli.effective-configuration-redaction.v1
    sourceAuthority: Media owns the effective configuration schema and precedence; CLI output consumes the resolved non-secret projection only.
    rule: >-
      `config show` reports effective values only for declared configuration fields
      and reports their safe source category without exposing credentials, tokens,
      secrets, or protected content. Secret-bearing values are always redacted; if a
      value cannot be safely classified, omit it and report that the value is
      redacted or unavailable. The command is read-only and cannot write, activate,
      authorize, or broaden a configuration value.
    requiredFields: [effectiveValues, sourceByField, redactedFields]
    sourceCategories: [explicit-flag, environment, selected-project-or-profile-file, user-config, product-default, unknown]
    resolutionOrder: [explicit-flag, environment, selected-project-or-profile-file, user-config, product-default]
    nonOverridablePolicyRule: Policy constraints apply after value-source precedence and cannot be overridden by any flag, environment variable, project/profile file, user config, or product default. Reject unknown or conflicting profile fields; do not silently pick one interpretation.
    precedenceEvidence: [exact-declared-field, selected-profile-identity-and-version, selected-source-category, applied-policy-constraint, conflict-or-unknown-disposition]
    negativeCases:
      - print-secret-value-or-token
      - claim-unresolved-precedence-source-as-effective
      - emit-undeclared-configuration-field
      - mutate-configuration-during-show
      - treat-displayed-configuration-as-policy-or-authority-grant
      - higher-precedence-value-overrides-nonoverridable-policy
      - conflicting-profile-field-silently-selected
    scopeStatus: OWNER_DEFINED_CLI_CONFIGURATION_OUTPUT; exact configuration fields and precedence are bound only by the owning Media profile source, no CLI runtime/admission is implied.
  - id: media.cli.jsonl-record-framing.v1
    sourceAuthority: Media product result taxonomy and command presentation contract
    rule: In JSONL mode, stdout contains only one complete JSON object per line, each with the exact declared schema version and a finite record kind. Result, error, and progress records retain stable field names and reason codes; records never contain banners, ANSI escapes, or human prose. Diagnostics use stderr, and output format cannot change command effects or exit-code meaning.
    recordKinds: [result, error, progress]
    requiredFieldsByKind:
      result: [schemaVersion, recordKind, commandId, outcome]
      error: [schemaVersion, recordKind, commandId, reasonCode, safeMessage]
      progress: [schemaVersion, recordKind, commandId, scope, unit, observedValueOrUnknown]
    negativeCases:
      - human-banner-or-ansi-on-jsonl-stdout
      - unknown-record-kind-or-schema-version
      - progress-record-reported-as-completion
      - format-switch-changes-effect-or-exit-code
    scopeStatus: OWNER_DEFINED_MACHINE_OUTPUT_DEFINITION; current CLI implementation and runtime parity remain NOT_ADMITTED.
  - id: media.cli.local-interruption-boundary.v1
    sourceAuthority: Media job finality and CLI client-observation semantics
    rule: Ctrl-C or another local interruption while waiting stops the local wait only. It does not cancel the remote job, confirm cancellation, establish failure, or authorize a resubmission. Preserve the same request/job identities and report unknown finality when the owner has not supplied an authoritative result; a remote cancellation is a separate explicit operation with its own request and result.
    requiredSemantics: [local-observation-stopped, original-request-and-job-identities-preserved, unknown-finality-when-unresolved, remote-cancel-operation-remains-distinct]
    negativeCases:
      - SIGINT-reported-as-confirmed-server-cancellation
      - local-interrupt-triggers-blind-new-request
      - timeout-or-signal-mapped-to-job-failure-without-owner-finality
      - local-observer-exit-drops-request-identity
    scopeStatus: OWNER_DEFINED_CLIENT_INTERRUPTION_CONTRACT; no connected CLI runtime or server cancellation admission is implied.
ownerDefinedCanonicalCommandContracts:
  id: media.cli.owner-defined-canonical-command-contracts.v1
  sourceAuthority: Media command owner; each command delegates request, result, authority, effects, idempotency, and finality to the exact canonical operation contract.
  status: OWNER_DEFINED_COMMAND_DEFINITIONS; exact cross-channel action binding, independent review, and runtime admission remain open.
  identityRule: Every argv prefix is explicitly enumerated and binds one exact canonical operation contract. Capability-backed commands additionally bind the exact capability and leaf adjudication; owner-defined logical commands do not fabricate either identity. No family-name substitution, aliases, provider defaults, or inferred action/operation mappings are permitted.
  schemaRule: The referenced operation request and result schemas are the exclusive typed argument and result contracts. The host constructs authenticated tenant, principal, authorization, consent-decision, operation identity, and finality facts outside caller arguments. User-selected purpose, workspace, profile, destination, and source references remain caller inputs only where the exact request schema permits them; the host resolves and authorizes each selected scope before any effect. A selection is not authority.
  hostContextBoundary:
    id: media.cli.host-context-separation.v1
    trustedHostOnlyFields: [tenantId, principalId, authorityRef, authenticatedPrincipal, authorizationDecision, consentDecision, operationIdentity, finality]
    callerForbiddenOverrides: [tenantId, principalId, authorityRef, authenticatedPrincipal, authorizationDecision, consentDecision, operationIdentity, finality]
    callerSelectableFields: exact-fields-in-the-resolved-operation-request-schema-excluding-trusted-host-only-fields
    resolutionRule: Resolve each caller-selected purpose, workspace, profile, destination, or source reference under the authenticated tenant and principal; verify exact scope and current authorization before effect.
    selectionIsNotAuthority: true
    jsonRequestBoundary: Parse --request-json as a closed caller-input object, reject trusted-host-only fields, assemble a separate host context, then validate the reconstructed canonical request against its exact closed operation schema before authorization or dispatch.
    negativeCases: [caller-tenant-substitution, caller-principal-substitution, caller-authority-override, forged-consent-decision, unresolvable-selected-reference, selected-reference-outside-authorized-tenant, unknown-request-property]
    executionAdmission: NOT_ADMITTED
  effectRule: Command observation is read-only unless the exact operation declares a command effect. A submitted or accepted request is not completed media output. UNKNOWN_OUTCOME requires reconciliation of the same request/job identity before any retry.
  requiredCommandIds:
    - media.cli.command.artifact-upload.v1
