  contracts:
  - id: media.cli.command.artifact-upload.v1
    argvPrefix: [artifact, upload]
    capabilityRef: media.artifact.upload
    capabilitySourceRef: .product-experience/pdp-0-product-truth/capabilities.yaml#capabilities/@id=media.artifact.upload
    ownerLeafAdjudicationRef: .product-experience/pdp-0-product-truth/capability-leaf-review.yaml#ownerCapabilityLeafAdjudication/records/@capabilityRef=media.artifact.upload
    operationContractRef: .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/records/@id=media.capability-binding.media-artifact-upload
    operationVersion: 1
    requestSchemaRef: .product-experience/pdp-1-domain-data/operations.yaml#individualOperationContracts/records/@id=media.operation-slice.begin-upload/ownerWireSchema/requestSchema
    resultSchemaRef: .product-experience/pdp-1-domain-data/operations.yaml#individualOperationContracts/records/@id=media.operation-slice.begin-upload/ownerWireSchema/resultSchema
    typedSchemaBindingStatus: EXACT_CANONICAL_OWNER_WIRE_REQUEST_AND_RESULT_SCHEMAS
    canonicalSourceContractRefs: [.product-experience/pdp-1-domain-data/operations.yaml#individualOperationContracts/records/@id=media.operation-slice.begin-upload]
    canonicalActionRef: media.action.begin-artifact-upload
    actionBindingStatus: EXACT_ACTION_CANDIDATE_REQUIRES_CROSS_CHANNEL_REVIEW
    actionApplicability: EXACT_UI_ACTION_CANDIDATE_REQUIRES_CROSS_CHANNEL_REVIEW
    argumentSemantics: Pass literal, closed-schema request values to the exact owner operation; option applicability, requiredness, types, bounds, and defaults come only from requestSchemaRef. Reject any undeclared argument before dispatch.
    resultSemantics: Project only the exact owner resultSchemaRef; preserve request/job/artifact identity and owner finality, including UNKNOWN_OUTCOME. Do not infer remote success from process exit or local observation.
    idempotencySemantics: Use only the exact owner operation idempotency and effect contract; never infer retry safety from command shape or transport.
    hostContextSemantics: Host supplies authenticated tenant, principal, authorization decisions, and operation identity; request-schema-permitted purpose/workspace/profile/destination/source selections remain caller inputs and are resolved and authorized under that host context before effect. Selection is not authority.
    admissionState: NOT_ADMITTED
    runtimeState: NOT_EVALUATED
    argumentContract:
      encoding: ONE_CLOSED_JSON_REQUEST_OBJECT
      option: --request-json
      schemaRef: .product-experience/pdp-1-domain-data/operations.yaml#individualOperationContracts/records/@id=media.operation-slice.begin-upload/ownerWireSchema/requestSchema
      positionalData: FORBIDDEN
      additionalProperties: REJECT
      validationOrder: BEFORE_AUTHORIZED_EFFECT_OR_DISPATCH
    commandSpecificSemanticRefs:
