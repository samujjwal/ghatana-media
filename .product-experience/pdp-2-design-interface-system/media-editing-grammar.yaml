schemaVersion: media.editing-grammar.v1
productId: media
authority: Media playback, transcript selection, timing edit, and revision presentation
status: authored-proposal; P0-010-and-audio-specialist-review-pending
sourceRefs:
  - .product-experience/pdp-0-product-truth/time-units-fidelity.yaml
  - .product-experience/pdp-0-product-truth/domain-model.yaml
rules:
  - Source playback time is mapped to the source presentation clock; wall-clock time is never used as media position.
  - Transcript selection, caption selection, and playback position are distinct but linked projections.
  - Caption text edits preserve source bytes and create a draft revision; saving the draft registers a new immutable version.
  - A drag gesture always has a keyboard-accessible, numeric or menu-based equivalent.
  - Timing displays disclose rounding and frame/sample conversion when the exact source time cannot be shown.
selection:
  primaryUnit: timed-transcript-or-caption-segment
  sourceLink: exact-source-artifact-version-and-half-open-time-interval
  navigation: previous-segment-next-segment-and-direct-time-entry
revisionBehavior:
  autosave: draft-only; no implicit approval
  conflict: retain-local-edit-and-current-server-version; ask-for-resolution-before-commit
  undo: scoped-to-current-draft; does-not-rewrite-source-or-saved-versions
  saveVersion: registers-a-new-caption-version-with-provenance-and-exact-parent-revision; does-not-record-a-review-decision
exactContentOverlayRule:
  id: media.design.exact-content-overlay.v1
  authority: delegated-Media-product-definition-owner
  appliesTo:
    - logos-and-brand-marks
    - captions-and-subtitles
    - legal-copy
    - mathematics-and-equations
    - user-interface-screenshots
    - diagrams
    - product-labels
  sourceBinding:
    required: [exactSourceOrApprovedAssetRef, immutableVersion, rightsAndUseScope, localeWhenTextual, ownerApprovalWhenRequired]
    identity: The exact source text, structured equation, or approved asset is authoritative. Bind the selected version and scope; a generative output or visual resemblance is not an authoritative source.
  composition:
    method: Render exact content from its bound source using declared typography, layout, timing, and output-profile parameters; preserve source and content identity in the composition revision and provenance.
    prohibit: [model-authored-or-rewritten-exact-copy, silently-substituted-logo-or-product-mark, unapproved-equation-reconstruction, screenshot-redrawing-as-source-truth, altered-legal-or-label-content]
    unknownBehavior: If source identity, version, applicable rights, locale, or required owner approval is missing or conflicting, do not claim exact-content fidelity and block the affected composition branch.
  translationAndDubbing:
    assistance: A model may propose translation or dubbing as a reviewable draft tied to the exact source version.
    authority: The user or domain owner retains meaning approval; duration or timing fit never authorizes mistranslation, omission, or semantic change.
    finality: A generated translation or dub remains a draft until the required meaning review is recorded.
  nonClaims: [no-runtime-rendering-proof, no-license-clearance, no-human-meaning-approval, no-phase-acceptance]
  status: OWNER_DEFINED_DESIGN_RULE; rendering and owner review evidence remain separate
  acceptanceEffect: none
  rejectionCases:
    - exact-copy-output-has-no-bound-source-version
    - generated-text-is-presented-as-approved-legal-copy-or-product-label
    - logo-or-screenshot-is-substituted-by-a-visually-similar-generated-asset
    - translation-is-accepted-only-because-it-fits-the-duration
    - source-version-or-rights-scope-conflicts-with-the-composition
revisionProjectionRule:
  id: media.design.same-revision-editor-projections.v1
  authority: Media owns the canonical editable revision and its exact versioned projection bindings.
  rule: >-
    The visual timeline, graph, and textual/accessible editor are projections of one exact canonical revision, not separate
    competing drafts. A project revision projects its immutable timelines[] snapshots; each snapshot binds stable timelineId,
    opaque semanticVersionId, and Graph(timelineId, scenes[], tracks[], clips[]) as defined by the PDP-1 owner decision.
    Project creation shows zero timelines. Explicit timeline creation produces a distinct empty graph with zero scenes, tracks,
    and clips in a successor project revision. Every displayed selection and edit is bound to the same project identity,
    exact expected revision, snapshot timelineId and semanticVersionId, and current observed revision. A mutation uses the
    exact expected revision and owner-defined compare-and-swap contract; stale state is a conflict and cannot silently submit
    a render or overwrite another projection. Saving through any projection creates one successor revision; refresh cannot
    create an independent semantic revision or merge same-field edits without the declared conflict rule. Scene, track,
    clip, source artifact-version, and rational-time fields follow the PDP-1 graph mapping; source-presentation and story clocks
    remain distinct, with no implicit conversion, overlap, or transition semantics. Session-local Undo and Redo select only
    immutable revisions observed from the server in this workspace session, re-read and validate the exact target identity
    and scope, restore the selected snapshot as a new project-head CAS successor, and verify the exact committed head by
    readback. A new committed edit clears Redo; historical revisions remain immutable. Stale-head conflicts clear the local
    history and require review. Unknown outcomes lock further edits until exact reconciliation; a retry is enabled only after
    the original head confirms absence, revalidates the target, and reuses the same request ID. Undo and Redo apply only to
    project snapshot content and never reverse render, export, review, rights, or other external effects.
  undoRedoRule:
    disposition: ACCEPTED_DELEGATED_TECHNICAL_OWNER_DECISION
    decisionRef: docs/development/PROJECT-TIMELINE-MAPPING-DISPOSITION-2026-11-09.md#addendum-exact-timeline-graph-field-mapping-2026-11-22
    rationale: Provide a bounded user-facing way to restore a previously observed immutable project snapshot through the existing canonical revision CAS, without creating a client-owned graph history or implying reversal of external effects.
    historyScope: current-workspace-session-and-only-server-observed-revisions
    targetSelection: last-local-committed-snapshot-for-undo; most-recent-undone-snapshot-for-redo
    targetVerification: reread-exact-revisionId-and-verify-DEV_ONLY-scope-tenantId-projectId-before-restore
    restore: existing-ProjectRevision-restore-operation-with-exact-current-head-CAS-and-new-successor-revision
    successVerification: reread-current-project-and-confirm-exact-successor-revision-and-snapshot
    redoInvalidation: every-new-committed-project-edit-clears-redo-targets
    staleBehavior: changed-owner-head-clears-session-history; no-automatic-restore-or-retry
    unknownBehavior: lock-mutations-until-reconciliation; report-success-only-for-an-exact-verified-successor
    retryBehavior: allow-only-after-original-head-confirms-absence; reverify-target-scope-and-identity; reuse-same-requestId
    externalEffectBoundary: undo-and-redo-do-not-reverse-render-export-review-rights-or-other-external-effects
    historicalRevisionBehavior: immutable-and-retained
    acceptanceEffect: none
  requiredBindings: [canonical-project-identity, exact-expected-revision-identity, current-observed-revision, shared-selection-identity, exact-timelineId-and-semanticVersionId, graph-node-and-source-version-identities, rational-time-clock-domain, owner-cas-mutation-contract, stale-revision-conflict-display, session-local-server-observed-history-target, exact-target-scope-and-identity-revalidation, restore-as-new-successor-revision, exact-successor-head-readback, redo-cleared-by-new-edit, external-effect-boundary]
  negativeCases:
    - visual-timeline-and-text-editor-point-to-different-revision-ids
    - stale-selection-renders-against-a-newer-unnoticed-revision
    - same-field-edit-merged-without-declared-conflict-policy
    - projection-refresh-creates-a-second-canonical-revision
    - read-only-graph-view-authorizes-a-hidden-mutation
    - project-create-silently-inserts-an-empty-timeline-snapshot
    - timeline-selection-omits-or-mismatches-semanticVersionId
    - graph-contains-duplicate-or-detached-scene-track-clip-nodes
    - clip-track-and-clip-scene-belong-to-different-scenes
    - source-and-story-time-use-the-wrong-clock-domain-or-are-implicitly-converted
    - source-interval-or-story-duration-is-nonpositive-or-story-end-is-unrepresentable
    - overlap-or-transition-behavior-is-implied-without-an-owner-policy
    - undo-or-redo-selects-an-unobserved-or-client-authored-graph-snapshot
    - undo-or-redo-restores-a-target-with-mismatched-tenant-project-or-revision-identity
    - undo-or-redo-replays-against-a-changed-head-or-retries-before-absence-is-confirmed
    - retry-changes-requestId-or-skips-exact-target-revalidation
    - redo-remains-available-after-a-newer-committed-edit
    - restored-project-snapshot-is-claimed-to-reverse-render-export-review-rights-or-other-external-effects
    - prior-project-revision-is-mutated-or-deleted-by-undo-or-redo
  renderSourceUseRule:
    id: media.design.project-render-source-use.v1
    authority: The exact immutable graph source ref identifies bytes; it does not grant authority to read, render, or register output.
    rule: >-
      Before source bytes are read or decoded, resolve one trusted exact binding for tenant, workspace, authenticated
      principal, project, project revision, timeline and semantic version, render target/effect, and every referenced
      artifact ID, immutable version, and SHA-256. Require current effect-specific rights and policy for source use.
      Revalidate the same binding and current authority immediately before output registration. Unknown or failed
      revalidation blocks registration. Keep source-use and output-registration effects distinct.
    authorityBinding: docs/development/PROJECT-TIMELINE-MAPPING-DISPOSITION-2026-11-09.md#addendum-source-use-for-dev_only-project-rendering-2026-11-22
    decisionRef: .product-experience/pdp-1-domain-data/decisions.yaml#decisions/@id=media.pdp1.decision.project-render-source-use
    unavailableBehavior: Missing, unavailable, revoked, stale, expired, conflicting, or cross-scope evidence blocks before source read; no local-owner or artifact-reference inference.
    negativeCases:
      - render-source-authority-has-no-exact-workspace-and-target-binding
      - source-reference-is-treated-as-rights-or-policy-allow
      - source-version-and-sha256-do-not-identify-the-same-bytes
      - authority-binding-does-not-match-tenant-principal-project-revision-timeline-or-target
      - source-rights-or-policy-is-missing-unknown-stale-revoked-or-unavailable
      - source-authority-is-revoked-or-changed-before-output-registration
      - output-is-registered-after-failed-or-unknown-pre-registration-revalidation
    requiredBindings: [tenant, workspace, authenticated-principal, project, exact-project-revision, timelineId, semanticVersionId, render-target, artifactId, immutableArtifactVersion, artifactSha256, current-effect-specific-source-rights, current-policy, exact-binding-revalidation-before-output-registration]
    sourceRefs:
      - .product-experience/pdp-1-domain-data/domain-objects.yaml#media.domain.timeline/graphSchema
      - .product-experience/pdp-1-domain-data/decisions.yaml#decisions/@id=media.pdp1.decision.project-render-source-use
      - docs/development/PROJECT-TIMELINE-MAPPING-DISPOSITION-2026-11-09.md#addendum-source-use-for-dev_only-project-rendering-2026-11-22
    status: OWNER_DEFINED_DESIGN_RULE; source-authority-provider-and-runtime-binding-remain-unavailable; no-acceptance-effect
    acceptanceEffect: none
  sourceRefs:
    - .product-experience/pdp-1-domain-data/domain-objects.yaml#media.domain.project-revision/timelineSnapshotBinding
    - .product-experience/pdp-1-domain-data/domain-objects.yaml#media.domain.timeline/graphSchema
    - docs/development/PROJECT-TIMELINE-MAPPING-DISPOSITION-2026-11-09.md#addendum-exact-timeline-graph-field-mapping-2026-11-22
    - docs/development/PROJECT-TIMELINE-MAPPING-DISPOSITION-2026-11-09.md#addendum-source-use-for-dev_only-project-rendering-2026-11-22
    - .product-experience/pdp-1-domain-data/versioning.yaml#ownerDefinedRevisionSemantics/projectRevision
    - .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/records
  status: OWNER_DEFINED_EDITOR_REVISION_RULE; UI implementation and multi-client consistency remain unverified.
  runtimeAdmission: NOT_ADMITTED
  acceptanceEffect: none
normativeRuleRecords:
  - id: media.p2.rule.exact-content-overlay.v1
    ruleRef: .product-experience/pdp-2-design-interface-system/media-editing-grammar.yaml#exactContentOverlayRule
    sourceAuthority: .product-experience/pdp-2-design-interface-system/media-editing-grammar.yaml#authority
    acceptanceEffect: none
  - id: media.p2.rule.same-revision-editor-projections.v1
    ruleRef: .product-experience/pdp-2-design-interface-system/media-editing-grammar.yaml#revisionProjectionRule
    sourceAuthority: .product-experience/pdp-1-domain-data/versioning.yaml#ownerDefinedRevisionSemantics
    acceptanceEffect: none

recorderStudioTimelineSpecialization:
  status: SOURCE_AUTHORED_PDP2_DEFINITION
  source: .product-experience/pdp-2-design-interface-system/recorder-studio-interface.yaml
  operationSource: .product-experience/pdp-1-domain-data/recorder-studio-contracts.yaml#objects/media.recorder.edit-operation
  manualOperationKindCount: 52
  capability: Same-canonical-revision-versioned-edit-and-undo-operations-for-GUI-headless-SDK-CLI
  invariants:
    - no-pointer-only-manual-feature
    - no-unreviewed-loss-of-LOCKED-or-MANUAL_PREFERRED-edit
    - source-and-versioned-captions-audio-and-narration-remain-exact
    - preview-and-export-compare-semantic-effects-at-declared-tolerance
    - unauthorized-external-release-not-a-creative-edit
  noClaims: [no-canvas-implementation, no-visual-a11y-certification, no-runtime-parity]
