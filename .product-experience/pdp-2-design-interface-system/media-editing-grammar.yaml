schemaVersion: media.editing-grammar.v1
productId: media
authority: Media playback, transcript selection, timing edit, and revision presentation
status: authored-proposal; P0-010-and-audio-specialist-review-pending
sourceRefs:
  - .product-experience/pdp-0-product-truth/time-units-fidelity.yaml
  - .product-experience/pdp-0-product-truth/domain-model.yaml
rules:
  - Source playback time is mapped to the source presentation clock; wall-clock time is never used as media position.
  - Transcript selection, caption selection, and playback position are distinct but linked projections.
  - Caption text edits preserve source bytes and create a draft revision; saving the draft registers a new immutable version.
  - A drag gesture always has a keyboard-accessible, numeric or menu-based equivalent.
  - Timing displays disclose rounding and frame/sample conversion when the exact source time cannot be shown.
selection:
  primaryUnit: timed-transcript-or-caption-segment
  sourceLink: exact-source-artifact-version-and-half-open-time-interval
  navigation: previous-segment-next-segment-and-direct-time-entry
revisionBehavior:
  autosave: draft-only; no implicit approval
  conflict: retain-local-edit-and-current-server-version; ask-for-resolution-before-commit
  undo: scoped-to-current-draft; does-not-rewrite-source-or-saved-versions
  saveVersion: registers-a-new-caption-version-with-provenance-and-exact-parent-revision; does-not-record-a-review-decision
exactContentOverlayRule:
  id: media.design.exact-content-overlay.v1
  authority: delegated-Media-product-definition-owner
  appliesTo:
    - logos-and-brand-marks
    - captions-and-subtitles
    - legal-copy
    - mathematics-and-equations
    - user-interface-screenshots
    - diagrams
    - product-labels
  sourceBinding:
    required: [exactSourceOrApprovedAssetRef, immutableVersion, rightsAndUseScope, localeWhenTextual, ownerApprovalWhenRequired]
    identity: The exact source text, structured equation, or approved asset is authoritative. Bind the selected version and scope; a generative output or visual resemblance is not an authoritative source.
  composition:
    method: Render exact content from its bound source using declared typography, layout, timing, and output-profile parameters; preserve source and content identity in the composition revision and provenance.
    prohibit: [model-authored-or-rewritten-exact-copy, silently-substituted-logo-or-product-mark, unapproved-equation-reconstruction, screenshot-redrawing-as-source-truth, altered-legal-or-label-content]
    unknownBehavior: If source identity, version, applicable rights, locale, or required owner approval is missing or conflicting, do not claim exact-content fidelity and block the affected composition branch.
  translationAndDubbing:
    assistance: A model may propose translation or dubbing as a reviewable draft tied to the exact source version.
    authority: The user or domain owner retains meaning approval; duration or timing fit never authorizes mistranslation, omission, or semantic change.
    finality: A generated translation or dub remains a draft until the required meaning review is recorded.
  nonClaims: [no-runtime-rendering-proof, no-license-clearance, no-human-meaning-approval, no-phase-acceptance]
  status: OWNER_DEFINED_DESIGN_RULE; rendering and owner review evidence remain separate
  acceptanceEffect: none
  rejectionCases:
    - exact-copy-output-has-no-bound-source-version
    - generated-text-is-presented-as-approved-legal-copy-or-product-label
    - logo-or-screenshot-is-substituted-by-a-visually-similar-generated-asset
    - translation-is-accepted-only-because-it-fits-the-duration
    - source-version-or-rights-scope-conflicts-with-the-composition
revisionProjectionRule:
  id: media.design.same-revision-editor-projections.v1
  authority: Media owns the canonical editable revision and its exact versioned projection bindings.
  rule: >-
    The visual timeline, graph, and textual/accessible editor are projections of one exact canonical revision, not separate
    competing drafts. Every displayed selection and edit is bound to the same project identity, expected revision identity,
    and current observed revision. A mutation uses the exact expected revision and owner-defined compare-and-swap contract;
    a stale or changed revision is shown as a conflict and cannot silently submit a render or overwrite another projection.
    Saving through any projection creates the same kind of successor revision with a single canonical owner; a projection
    refresh cannot create an independent semantic revision or merge same-field edits without the declared conflict rule.
  requiredBindings: [canonical-project-identity, exact-expected-revision-identity, current-observed-revision, shared-selection-identity, owner-cas-mutation-contract, stale-revision-conflict-display]
  negativeCases:
    - visual-timeline-and-text-editor-point-to-different-revision-ids
    - stale-selection-renders-against-a-newer-unnoticed-revision
    - same-field-edit-merged-without-declared-conflict-policy
    - projection-refresh-creates-a-second-canonical-revision
    - read-only-graph-view-authorizes-a-hidden-mutation
  sourceRefs:
    - .product-experience/pdp-1-domain-data/versioning.yaml#ownerDefinedRevisionSemantics/projectRevision
    - .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/records
  status: OWNER_DEFINED_EDITOR_REVISION_RULE; UI implementation and multi-client consistency remain unverified.
  runtimeAdmission: NOT_ADMITTED
  acceptanceEffect: none
normativeRuleRecords:
  - id: media.p2.rule.exact-content-overlay.v1
    ruleRef: .product-experience/pdp-2-design-interface-system/media-editing-grammar.yaml#exactContentOverlayRule
    sourceAuthority: .product-experience/pdp-2-design-interface-system/media-editing-grammar.yaml#authority
    acceptanceEffect: none
  - id: media.p2.rule.same-revision-editor-projections.v1
    ruleRef: .product-experience/pdp-2-design-interface-system/media-editing-grammar.yaml#revisionProjectionRule
    sourceAuthority: .product-experience/pdp-1-domain-data/versioning.yaml#ownerDefinedRevisionSemantics
    acceptanceEffect: none

professionalStudioGrammar:
  id: media.pdp2.professional-studio.editor-grammar.v1
  sourceOwner: media
  status: SOURCE_DEFINED_SUCCESSOR_WITH_UNBOUND_SCREEN_INSTANCES
  productSurface: media.surface.presentation-studio
  requiredSiblingSurfaces: [media.surface.experience-recorder, media.surface.capture-agent, media.surface.interactive-demo-player]
  sourceContract: .product-experience/pdp-1-domain-data/versioning.yaml#experienceProductionRevisionContract
  operationContract: .product-experience/pdp-1-domain-data/action-contracts.yaml#experienceProductionActionOrchestration
  templateReuse: [media.gui.template.media-composition, media.gui.template.workbench, media.gui.template.review-and-compare, media.gui.template.job-observation, media.gui.template.consent-gate, media.gui.template.render-preparation-and-review]
  layoutReuse: [media.gui.layout.media-workbench, media.gui.layout.review, media.gui.layout.render, media.gui.layout.consent]
  reusableComponents: [media.component.source-player, media.component.storyboard, media.component.timeline-keyframe-editor, media.component.audio-mixer, media.component.mask-tracking-editor, media.component.caption-track-editor, media.component.scene-inspector, media.component.result-comparison, media.component.quality-inspector, media.component.rights-retention-review, media.component.provenance-summary, media.component.activity-recovery-feed, media.component.delivery-profile-picker]
  singleProjectModel:
    projectId: existing-MediaProject
    projectRevision: expectedProjectRevisionId-and-currentObservedRevision
    selection: shared-scene-track-source-version-and-half-open-time-interval-across-all-projections
    submit: exact-revision-authorized-CAS-only
    conflicts: retain-proposed-manual-edit-current-head-and-explain-resolution-required
    source: immutable-artifact-version-and-exact-provenance
    generated: optional-edit-suggestions-never-the-authoritative-source-or-human-approval
    manual: user-locks-and-approved-authored-deltas-not-overwritten-by-auto-regeneration
  panes:
    - name: source-and-storyboard
      layout: project-source-provenance-and-scene-order-with-explicit-actor-session-and-experience-goal
      semanticAlternative: ordered-scene-list-with-immutable-source-refs-and-editable-position-numbers
    - name: multitrack-timeline
      layout: video-audio-narration-captions-overlays-masks-effects-and-camera-tracks
      semanticAlternative: table-of-tracks-and-half-open-time-regions-with-keyboard-reorder-and-numeric-value-entry
    - name: properties-and-effects
      layout: crop-zoom-reframe-color-speed-keyframe-composite-PIP-transition-parameters
      semanticAlternative: bound-range-fields-and-enumerated-effects-with-full-typed-input-validation
    - name: narration-and-audio
      layout: approved-voice-and-script-audition-word-alignment-mix-and-true-peak-review
      semanticAlternative: text-and-timestamp-narration-editor-with-sample-accurate-scrub-alternative
    - name: review-and-quality
      layout: original-versus-proposed-visual-comparison-technical-QA-and-semantic-business-case-evidence
      semanticAlternative: table-of-metrics-exact-version-and-rejection-reasons; technical-pass-never-human-approval
    - name: interactive-branch-authoring
      layout: declarative-hotspot-regions-branch-graph-and-safe-sandboxed-preview
      semanticAlternative: node-and-edge-table-with-explicit-link-targets-no-executable-script-actions
    - name: output-and-publication
      layout: multiple-aspect-ratios-caption-and-audio-alternatives-licenses-rights-approval-and-destination-finality
      semanticAlternative: typed-profiles-output-refs-and-recipient-acknowledgement-readback
  commands:
    - family: capture-and-direction
      operations: [manual-capture-start, pause-request, stop-request, cursor-path, focus-annotation, source-switch]
      rule: capture-effects-run-only-through-admitted-capability-checked-providers-and-product-owned-adapters
    - family: nonlinear-timeline
      operations: [trim, split, slip, slide, ripple, reorder, group, mute, solo, undo, redo]
      rule: exact-time-and-CAS-revision-edits; no-source-file-mutation
    - family: visual
      operations: [crop, zoom, smart-reframe, pan, keyframe, easing, mask, blur, highlight, color-correction, camera-PIP, transition]
      rule: editor-selected-and-AI-suggested-values-share-typed-parameter-contract-and-manual-lock-precedence
    - family: audio-narration
      operations: [voice-audition, narration-record, timing-align, transcript-correct, captions, soundtrack, ducking, gain, audio-fades, normalization]
      rule: exact-voice-rights-consent-and-time-map; no-implicit-cloning-or-mixing-with-unapproved-voice
    - family: interactive
      operations: [insert-hotspot, edit-branch, inspect-action, set-sandbox-profile, simulate-read-only-player]
      rule: whitelist-declarative-media-navigation-not-product-business-command
    - family: delivery
      operations: [render-preview, render-master, output-variant, request-review, request-publish, inspect-finality]
      rule: render-review-human-approval-and-external-delivery-have-distinct-typed-status
  interaction:
    keyboard: every-action-has-focusable-command-available-without-drag-hover-or-precision-pointer
    timelineNumerics: editable-exact-ticks-with-disclosed-rational-unit-and-rounding
    zoomAndResponsive: panels-reflow-without-hiding-identity-rights-policy-unknown-outcome-or-cancellation-facts
    reducedMotion: source-media-animation-and-editor-chrome-motion-are-separately-controlled
    accessibilityStatus: screen-reader-live-regions-announce-only-result-transitions-without-autoplaying-private-audio
    validation: deny-unknown-codec-unavailable-model-unsupported-profile-missing-rights-and-stale-revision-before-effect
    aiSuggestion: cite-observed-source-and-uncertainty; accept-edit-and-reject-edit-both-explicit; never-silent-overwrite
  conflictVisualStates: [stale-CAS, incompatible-recapture-anchor, unavailable-provider, version-restricted, rights-denied, erasure-pending, unknown-external-effect, source-time-unavailable]
  negativeCases: [drag-only-trim, context-switch-with-hidden-revision, auto-edit-erases-user-choice, fake-human-review-badge, source-time-inferred-from-wall-clock, arbitrary-hotspot-JavaScript, typed-error-replaced-by-toast-only, cross-tenant-preview-cache]
  pdp3ScreensAndJourneys: REQUIRES_SUCCESSOR_AUTHORING_EXPLORER_IS_PROJECTION
  runtimeAdmission: NOT_ADMITTED
