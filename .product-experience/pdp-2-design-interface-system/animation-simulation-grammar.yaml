  schemaVersion: media.declarative-production.pdp2.v1
  sourcePhase: PDP-2
  status: SOURCE_AUTHORED_PDP2_DEFINITION
  normativeCaseAuthority: .product-experience/pdp-0-product-truth/requirements.yaml#declarativeProductionProfile
  operationAndValueAuthority: .product-experience/pdp-1-domain-data/declarative-production-contracts.yaml
  componentAuthority: .product-experience/pdp-2-design-interface-system/component-contracts.yaml
  recorderSurfaceAuthority: .product-experience/pdp-2-design-interface-system/recorder-studio-interface.yaml
  noIndependentAuthority: Presentation layer cannot create operations, physics, rights, academic evidence or generated source claims
  caseCount: 61
  surfaces: [media.surface.recorder-orchestrator, media.surface.capture-adapters, media.surface.production-studio, media.surface.interactive-demo-player]
  existingManualStudioOperationKinds: 52
  manualParitySource: .product-experience/pdp-2-design-interface-system/recorder-studio-interface.yaml#manualOperationParity
  existingCanonicalScreenRefs: [media.view.animate-media, media.view.arrange-scenes, media.view.compose-scene, media.view.explore-simulation, media.view.compose-media]
  existingVisualComponents: [media.component.scene-inspector, media.component.simulation-instruments]
  commonVisualGrammar:
    rendererIndependent: semantic-source-object-bound-2D-and-3D-graph-with-retained-node-identity-and-scene-revision
    geometry: [2D-vector, raster-image, 3D-geometry, camera, lighting, mesh-rig, constraints, charts, mathematical-formulas, trajectories]
    animations: [keyframes, easing, property-curves, procedural-operators, camera-choreography, rigging, audio-voice-bound-cues]
    timeline: Declared tStory rational ticks and source PTS, never implicit wall time or simulation-step ticks
    proceduralSafety: Allowed bounded declarative operators only, no arbitrary imported JS Python shader source or network access
    dataBindings: Typed immutable input snapshot plus exact semantic node and observable identifiers; no speculative measurement or hidden interpolation
    templates: Reuse existing Media physics-math, product demonstration, infographic, scientific visualization and lesson recipes; no second template engine
    ai: Visible provenance, model and version, confidence and disagreement; proposals use versioned reversible project edits and respect manual locks
    accessibility: Keyboard, screen reader, high contrast, reduced motion, visual descriptions, accessible formulas, text and tabular graph equivalents
    editing: Same selected entity/curve/scene revision across Studio, CLI, SDK and API where admitted; all 52 canonical manual discriminants preserved
  simulationGrammar:
    modelSource: Versioned scientific Model IR or authorized domain equation set; never infer from pixels
    requiredFacts: [modelVersion, equationsOrRulesVersion, initialAndBoundaryConditions, parameterUnits, solverBuild, stepPolicy, numericTolerances, validityDomain, modelTimeClock]
    state: [declared, validated, admitted, running, paused, checkpointed, completed, denied, quality-blocked, unknown]
    commands: [run, pause, resume, step, seek-by-validated-checkpoint, fork-counterfactual, bounded-parameter-sweep, sample-observable]
    stateRule: Pausing or seeking tStory never mutates tSim; only qualified command updates scientific model
    scientificValidation: F0-F4 validity is model-owner-scoped, not inferred from rendering, scene attractiveness or FPS
    instruments: Show source, exact unit, applicability, sample time, calibration, method, uncertainty, numerical error and model fidelity for each observable
    deterministicReplay: EXACT only with supported solver and byte-stable environment; otherwise BOUNDED or STOCHASTIC with declared precision, seed and tolerances
    safety: Invalid unit or unsupported solver/fidelity/version becomes visibly UNAVAILABLE or DENIED with preserved input and remedial action
    visualOutputs: Scientific state drives diagram/graph/3D/number, never the reverse
    chartEquivalent: Zoom/pan/timeseries/phase-portrait with keyboard numeric and tabular readings and explicit downsampling loss
  tutorPutorIntegration:
    productOwner: TutorPutor
    mediaOwner: generic-animation-render-simulation-adapter-and-presentation
    publicContract: Versioned ExperienceIR ModelIR SceneIR compatibility with explicit missing-field and unsupported-major-version status
    interactionCycle: [predict, manipulate, measure, explain, compare, retry-if-admitted]
    evidenceOwner: TutorPutor only; Media exports minimally scoped redacted content/interaction receipts, never mastery decisions or protected learner state
    localOfflineAndMobile: Only declared and independently qualified feature subsets; accessible fallback if advanced 3D/solver provider unavailable
    release: Model, pedagogy and scientific approval are distinct from Media technical QA
  headlessAndEmbeddedParity:
    apiOnly: CLI/API/grpc events and typed values rendered as semantic timelines/charts/text; do not invent a real browser screen
    readOutput: Structured status, exact source refs, model/solver/tolerance, consent/policy, typed operation finality, redacted trace and recovery
    gui: Desktop/web/presentation use same P1 semantics and style tokens as normal Media Studio
    embedded: Signed sandboxed bundle, safe no-privileged-tenant-actions, CSP, offline declaration, keyboard focus and no arbitrary scripts
    unavailable: Unsupported media devices, codec, model or sensor declare unavailable with reason and admissible fallback
  caseInterfaceBindings:
