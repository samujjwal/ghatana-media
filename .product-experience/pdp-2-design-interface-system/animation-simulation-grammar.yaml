schemaVersion: media.animation-simulation-grammar.v1
productId: media
authority: Media presentation grammar for animation and simulation; PDP-0 owns domain/time/fidelity meaning
status: authored-proposal; graphics-simulation-and-domain-owner-review-pending
sourceRefs:
  - .product-experience/pdp-0-product-truth/time-units-fidelity.yaml
  - .product-experience/pdp-0-product-truth/quality-policy.yaml
rules:
  - Keep animation/story time, media presentation time, simulation time, and wall-clock deadlines visibly distinct.
  - Identify the active clock and units beside the timeline or instrument that uses it.
  - Label the source, model, solver, and conversion loss before presenting a simulation result.
  - Scrubbing or pausing a presentation never silently advances or changes the simulation model.
  - A plausible render does not imply validated domain behavior.
sharedPatterns:
  timeline: selectable-track-list-plus-precise-time-control-with-numeric-alternative-to-dragging
  keyframes: announce-selected-object-property-time-and-value
  simulationInstrument: show-unit-method-applicability-uncertainty-and-fidelity-class
  unsupportedConversion: preserve-source-model-and-report-the-lost-or-unmapped-feature
ownerDefinedClockPresentation:
  id: media.animation.clock-domain-presentation.v1
  sourceAuthority: Media presentation grammar consumes exact PDP-1 time/value definitions; it does not create clock arithmetic or scientific timing qualification.
  canonicalDefinitionRefs:
    rationalMediaAndSimulationStoryTime: .product-experience/pdp-1-domain-data/value-objects.yaml#/canonicalConversionDefinitions/records/@id=media.value.rational-media-time
    sampleBoundary: .product-experience/pdp-1-domain-data/value-objects.yaml#/canonicalConversionDefinitions/records/@id=media.value.sample-boundary-index
    sourceFrameSampleMapping: .product-experience/pdp-1-domain-data/value-objects.yaml#/ownerDescriptorDefinitions/records/@id=media.value.source-frame-sample-mapping
  clockRoles:
    mediaPresentation: exact-source-clock-kind-id-stream-and-rational-ticks; VFR uses retained frame mapping
    audioSamples: exact-stream-and-sample-rate-boundary; priming-padding require an explicit mapping
    simulation: explicit simulation clock and units; never implicitly synchronized to media presentation
    story: explicit story clock and units; never implicitly synchronized to wall clock
    wallClock: deadline or observation instant only; never used as a media-frame or simulation-step count
  rules:
    - every displayed time control identifies its clock kind, clock identity, stream when applicable, units, and conversion convention
    - cross-clock, cross-stream, timebase, frame-rate, sample-rate, and drift conversion uses the exact referenced PDP-1 definition and explicit alignment mapping; missing mapping disables conversion
    - numeric frame-rate division cannot replace VFR frame maps or source PTS; rounded values disclose the selected rounding and loss
    - scrubbing, pausing, or changing story presentation does not advance, reset, or mutate the simulation state
    - an unsupported conversion preserves the source value and model and exposes the lost or unmapped feature; it never silently substitutes 24 fps, zero, or a guessed duration
  scopeStatus: OWNER_DEFINED_PRESENTATION_DEFINITION; clock accuracy, alignment qualification, provider timing, and simulation validity remain NOT_EVALUATED.
mediaSemanticResponsibilityBoundary:
  id: media.animation.media-semantic-responsibility-boundary.v1
  authority: Media P2 presentation owner; cited phases remain the sole semantic owners of their exact definitions.
  responsibilities:
    mediaMeaningProjectsAndAssets: .product-experience/pdp-0-product-truth/domain-model.yaml#authorityBoundary
    processingSpecificationsAndOperations: .product-experience/pdp-1-domain-data/operations.yaml#operations
    jobPolicyAndState: .product-experience/pdp-1-domain-data/states.yaml#stateMachines
    timelineAndExactTime: .product-experience/pdp-1-domain-data/value-objects.yaml#canonicalConversionDefinitions
    animationAndSimulationPresentation: .product-experience/pdp-2-design-interface-system/animation-simulation-grammar.yaml#ownerDefinedClockPresentation
    mediaQualityPolicy: .product-experience/pdp-0-product-truth/quality-policy.yaml#assessmentContract
    rightsAndPrivacy: .product-experience/pdp-1-domain-data/privacy.yaml#axes
    deliveryAndExecutionPolicy: .product-experience/pdp-0-product-truth/policy-authority-model.yaml#productPolicy
  rule: >-
    Media product meaning, project/asset identity, processing specification, job policy/state, timeline time, animation/simulation presentation, quality applicability, rights/privacy, and delivery intent remain Media-owned at their cited exact phase sources. P2 consumes and presents those meanings; it does not create a second authority, silently infer missing definitions, or treat a presentation control as authorization or execution. A missing or unresolved source remains visibly unresolved and blocks only the dependent representation/action.
  negativeCases: [presentation-rule-substitutes-for-domain-owner,p2-control-invents-operation-or-rights-meaning,missing-owner-definition-defaulted-to-success,screen-rendering-treated-as-policy-or-execution]
  scopeStatus: OWNER_DEFINED_CROSS_PHASE_PRESENTATION_BOUNDARY; source phase acceptance, specialist review, runtime, and Lifecycle receipts remain separate.
normativeRuleRecords:
  - id: media.p2.rule.animation-clock-domain-presentation.v1
    ruleRef: .product-experience/pdp-2-design-interface-system/animation-simulation-grammar.yaml#ownerDefinedClockPresentation
    sourceAuthority: .product-experience/pdp-1-domain-data/value-objects.yaml#canonicalConversionDefinitions
    acceptanceEffect: none
  - id: media.p2.rule.animation-media-semantic-responsibility-boundary.v1
    ruleRef: .product-experience/pdp-2-design-interface-system/animation-simulation-grammar.yaml#mediaSemanticResponsibilityBoundary
    sourceAuthority: .product-experience/pdp-0-product-truth/domain-model.yaml#authorityBoundary
    acceptanceEffect: none
  - id: media.p2.rule.visual-vs-scientific-fidelity.v1
    ruleRef: .product-experience/pdp-2-design-interface-system/animation-simulation-grammar.yaml#ownerDefinedVisualVsScientificFidelityBoundary
    sourceAuthority: .product-experience/pdp-1-domain-data/value-objects.yaml#ownerDescriptorDefinitions
    acceptanceEffect: none
ownerDefinedVisualVsScientificFidelityBoundary:
  id: media.animation.visual-vs-scientific-fidelity.v1
  authority: PDP-0 Media/domain owner defines model and solver semantics; PDP-2 presents them without substitution
  rule: >-
    A visually polished or photorealistic render is not evidence of scientific
    correctness, calibrated measurements, physical plausibility, or a selected
    simulation model. Derive available physics controls from the exact
    versioned model, solver, initial/boundary conditions, parameters, units,
    numerical bounds, and applicable fidelity tier. Do not invent or infer a
    physical control from image appearance, a recipe template, or a renderer
    option. When the model, solver, parameter, or evidence is missing, expose
    the corresponding control or validity claim as unresolved; visual level of
    detail may adapt without changing model fidelity.
  sourceRefs:
    - .product-experience/pdp-1-domain-data/value-objects.yaml#ownerDescriptorDefinitions/records/@id=media.value.simulation-fidelity-definition
    - .product-experience/pdp-0-product-truth/time-units-fidelity.yaml#simulationFidelity
    - .product-experience/pdp-0-product-truth/capabilities.yaml#capabilities/@id=media.simulation.rigid-body
  requiredFacts:
    - exact model and version
    - solver identity/version/configuration and numerical/time-step bounds or explicit NOT_APPLICABLE
    - typed units, initial and boundary conditions, and fidelity tier
    - separate evidence for scientific or physical-validation claims
  negativeCases:
    - infer a physics control or validated result from rendered appearance
    - label photorealism as calibrated, physically plausible, or scientifically validated
    - change visual level of detail while silently changing model fidelity
    - default a missing model/solver/units to a successful physics configuration
  scopeStatus: OWNER_DEFINED_PRESENTATION_BOUNDARY; solver qualification, scientific validation,
    independent review, and runtime admission remain NOT_EVALUATED
