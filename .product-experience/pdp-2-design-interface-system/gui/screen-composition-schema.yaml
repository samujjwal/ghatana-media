schemaVersion: media.gui-screen-composition-schema.v1
owner: ghatana-media-product-experience
authority: Media owns view composition contracts; PDP-0 owns domain meaning and PDP-3 owns view/action registries
sourceRefs:
  - .product-experience/pdp-0-product-truth/glossary.yaml
  - .product-experience/pdp-0-product-truth/state-models.yaml
  - .product-experience/pdp-3-product-experience/screen-registry.yaml
  - .product-experience/pdp-3-product-experience/action-registry.yaml
scopeStatus: proposed-schema; no downstream screen is claimed validated by this schema alone
acceptance:
  criteria:
    - Composition instances use canonical media.view, media.action, and media.gui identifiers.
    - Every region declares its data/state source and accessibility reading order.
    - Async effects represent state and finality separately and include unknown-outcome recovery.
    - No composition grants authority or invents domain states.
  status: pending-review
verification:
  method: Validate instances structurally, then trace every referenced identifier and state to its owning registry.
  status: not-run
requiredFields:
  - schemaVersion
  - viewId
  - templateRef
  - sourceRefs
  - scopeStatus
  - regions
  - acceptance
  - verification
fieldRules:
  viewId: Must resolve to a canonical media.view identifier in the PDP-3 screen registry.
  templateRef: Must resolve to a media.gui.template identifier.
  patternIds: Ordered primary pattern identifiers; each must be a primary pattern declared by the selected template.
  patternOverlayIds: Optional explicitly selected pattern overlays; every entry must be approved by the selected template. Consequential actions with unknown finality require an overlay whose required states and regions cover unknown outcome and safe recovery.
  sourceRefs: Must identify the authoritative contracts for all displayed data and state.
  regions: Ordered list; every item has id, patternRef, contentRefs, stateRefs, and accessibilityOrder.
  actions: Each actionRef resolves to media.action; declare preconditions and finalityRef; presentation is not authorization.
  responsive: Changes arrangement and disclosure only; it cannot change semantics or remove critical state.
  status: Proposed contracts do not assert implementation, qualification, or acceptance.
semanticCoverageRequirement:
  id: media.gui.composition-semantic-coverage.v1
  status: OWNER_DEFINED_REQUIREMENT; per-screen source coverage and acceptance remain independently reviewable.
  categories:
    - {id: meaning-actors-outcomes-requirements, requiredRefs: [.product-experience/pdp-0-product-truth/goals-jtbd.yaml, .product-experience/pdp-0-product-truth/capabilities.yaml], rule: "Bind each screen to its exact product goal, actors, outcomes, requirement, and applicable capability; do not copy an unrelated family summary as screen meaning."}
    - {id: domain-time-units, requiredRefs: [.product-experience/pdp-1-domain-data/domain-objects.yaml, .product-experience/pdp-1-domain-data/value-objects.yaml], rule: "Bind displayed domain identities and time/unit values to canonical owner definitions and exact conversion profiles; presentation text cannot redefine them."}
    - {id: authority-and-rights, requiredRefs: [.product-experience/pdp-1-domain-data/authority.yaml, .product-experience/pdp-1-domain-data/privacy.yaml], rule: "Bind each consequential display or action to its authority and rights/consent source; visibility, selection, or confirmation is not permission."}
    - {id: state-failure-and-finality, requiredRefs: [.product-experience/pdp-1-domain-data/states.yaml, .product-experience/pdp-1-domain-data/operations.yaml], rule: "Bind state, failure, recovery, and effect-finality to their exact owning machine or operation; visual labels and job progress cannot invent completion."}
    - {id: dependencies-and-nfrs, requiredRefs: [.product-experience/pdp-0-product-truth/dependency-contracts.yaml, .product-experience/pdp-0-product-truth/quality-policy.yaml], rule: "Bind required external dependencies and applicable measurable quality/NFR clauses, preserving unknown or unqualified status instead of promising a quality result."}
  negativeCases: [missing-product-goal-or-actor-source,domain-or-unit-inferred-from-label,screen-selection-used-as-authority,visual-state-used-as-finality,unqualified-quality-presented-as-guarantee,unbound-dependency-described-as-available]
example:
  schemaVersion: media.gui-screen-composition.v1
  viewId: media.view.job-status
  templateRef: media.gui.template.job-observation
  sourceRefs: [.product-experience/pdp-3-product-experience/screen-contracts/job-status.yaml]
  scopeStatus: proposal
  regions:
    - id: job-summary
      patternRef: media.gui.pattern.job-status-and-recovery
      contentRefs: [jobId, state, finality]
      stateRefs: [media.job-state, media.effect-finality]
      accessibilityOrder: 1
  acceptance: {status: pending-owner-review, criteria: [state-and-finality-remain-distinct]}
  verification: {status: not-run, method: Resolve references and review against the job contract}
normativeRuleRecords:
  - id: media.p2.rule.gui-composition-semantic-coverage.v1
    ruleRef: .product-experience/pdp-2-design-interface-system/gui/screen-composition-schema.yaml#semanticCoverageRequirement
    sourceAuthority: .product-experience/pdp-2-design-interface-system/gui/screen-composition-schema.yaml#authority
    acceptanceEffect: none

experienceProductionScreenCompositionRules:
  id: media.pdp2.experience-production.screen-composition.v1
  status: CANONICAL_DESIGN_RULE_ONLY_NO_NEW_PDP3_SCREEN_DECLARED
  authority: .product-experience/pdp-2-design-interface-system/media-editing-grammar.yaml#professionalStudioGrammar
  profile: .product-experience/pdp-2-design-interface-system/interface-grammar.yaml#experienceProductionChannelGrammar
  ownerScreens: [media.surface.presentation-studio, media.surface.interactive-demo-player]
  machineOnlySurfaces: [media.surface.experience-recorder, media.surface.capture-agent]
  regions:
    Studio: [source-selector, storyboard, multitrack-timeline, numeric-time-editor, effect-inspector, caption-narration, QA-review, provenance-manual-locks, export-rights-finality]
    Player: [safe-declarative-media-canvas, accessible-hotspot-list, branch-graph, caption-transcript-alternative, viewer-policy-and-unavailable-status]
    Headless: [typed-operation-plan, source-capability-probe, request-and-result, scene-job-technical-status, policy-denial, safe-recovery]
  requiredBinding: [exact-MediaProject-and-revision, source-artifact-version, selected-scene-or-track, source-timebase, permitted-command-ref, outcome-finality, rights-and-consent-scope, quality-and-human-review-distinction]
  hostReuse: [existing-Media-workbench-template, existing-semantic-components, existing-CLI-and-API-error-conventions]
  noAuthorityClaims: [new-view-ids, new-screen-contract-ids, deployed-Studio-host, live-capture-agent, browser-only-API-products, new-user-permissions, production-a11y-conformance]
  forbidden: [pointer-only-edit, canvas-only-hotspot, automatic-manual-lock-erasure, implicit-script-in-player, transport-result-as-human-approval, silent-unknown-effect, duplicate-project-revision-editor]
  futurePdp3: Bind actual Studio/Player screen and headless journey IDs through the PDP3 registry and Explorer projection on the same source meanings.
