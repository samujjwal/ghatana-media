schemaVersion: media.gui-composition-validation-grammar.v1
owner: ghatana-media-product-experience
authority: Media owns the source definition of screen composition; this grammar validates links and semantic coverage, not visual admission
scopeStatus: MEDIA_OWNER_SOURCE_RULES; Shared publication and independent visual/accessibility acceptance remain separate
sourceRefs:
  screenSchema: .product-experience/pdp-2-design-interface-system/gui/screen-composition-schema.yaml
  screenRegistry: .product-experience/pdp-3-product-experience/screen-registry.yaml
  templates: .product-experience/pdp-2-design-interface-system/gui/templates/catalog.yaml
  layouts: .product-experience/pdp-2-design-interface-system/gui/layout.yaml
  recipes: .product-experience/pdp-2-design-interface-system/gui/recipes/catalog.yaml
  patterns: .product-experience/pdp-2-design-interface-system/gui/patterns/catalog.yaml
  componentContracts: .product-experience/pdp-2-design-interface-system/component-contracts.yaml
  actions: .product-experience/pdp-3-product-experience/action-registry.yaml
  accessibility: .product-experience/pdp-2-design-interface-system/accessibility.yaml
  finality: .product-experience/pdp-2-design-interface-system/action-finality-grammar.yaml
linkRules:
  template: screenContract.templateId and screenContract.templateContract.templateRef must identify the same canonical template.
  layout: Every screenContract.layoutIds entry must resolve to a canonical layout, and the selected template/layout pair must be reciprocally declared by both catalogs.
  recipe: Each template and recipe must reciprocally bind by recipeRefs/templateRef; the recipe semanticPattern must be a primary pattern or approved overlay of that template.
  pattern: Every selected screen pattern must be a primary pattern or an explicitly compatible overlay of its selected template.
  requiredRegions: The exact templateId/templateContract.templateRef binding inherits that template's ordered required region sequence; exact patternIds and patternOverlayIds bind their own ordered pattern region sequences. Screen anatomy is additive, screen-specific product detail and is not a renamed copy of the shared template/pattern vocabulary. No substring or inferred-name matching is permitted. Each selected reference must resolve to the exact canonical sequence pinned below.
  overlaySelection: Consequential actions with uncertain finality select a required safe unknown-outcome/recovery overlay in patternOverlayIds; template availability alone does not count as selection.
  component: Every screen component and every selected-pattern component resolves to a Media component contract with nonempty anatomy, keyboard semantics, and accessibility semantics.
accessibilityRules:
  screenFocus: Every screen composition carries an accessibility rule that preserves focus and reading order; this source rule is proposal-level and does not establish conformance.
  keyboard: Every composed component has an explicit keyboard contract and accessible behavior; every action identifier resolves to a source-owned action definition.
  unknownFinality: If an action can remain pending, uncertain, or unknown, the selected template's primary patterns or approved overlays must include a safe unknown-outcome/recovery pattern with an explicit unknown state.
nonClaims:
  - This grammar does not claim rendered screen correctness, assistive-technology acceptance, public Shared package admission, or PDP-2 phase receipt.
  - A valid composition link does not authorize an action or establish runtime behavior.
regionContracts:
