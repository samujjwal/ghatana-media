    "media.gui.template.collection": ["context", "heading", "filters", "results", "pagination", "empty-or-error", "primary-action"]
    "media.gui.template.workbench": ["project-context", "source-player", "synchronized-work-area", "selection-details", "validation", "save-action"]
    "media.gui.template.job-observation": ["job-identity", "state-and-finality", "progress", "outputs", "cancellation-or-recovery", "provenance"]
    "media.gui.template.review-and-compare": ["source-context", "compared-identities", "comparison-content", "quality-and-uncertainty", "provenance", "decision-actions"]
    "media.gui.template.consent-gate": ["requested-outcome", "affected-material", "scope-and-validity", "decision", "next-safe-action"]
    "media.gui.template.render-preparation-and-review": ["composition-snapshot", "profile-and-validation", "rights-and-estimates", "submission-and-job-finality", "output-verification", "review-decision", "delivery-status"]
    "media.gui.template.lifecycle-confirmation": ["exact-target-and-version", "authority-and-preconditions", "impact-and-retention", "explicit-confirmation", "pending-or-unknown-finality", "safe-verification-and-recovery"]
    "media.gui.template.media-composition": ["project-context", "composition-version", "multitrack-timeline", "track-and-clip-list", "transition-and-caption-alignment", "brand-and-typography-references", "safe-area-and-output-profile", "validation-state", "save-action"]
    "media.gui.template.operational-readiness": ["readiness-scope", "observation-time-and-freshness", "check-results", "capacity-and-dependency-disposition", "safe-recovery-guidance", "audit-reference"]
    "media.gui.template.record-detail": ["workspace-and-project-context", "exact-record-identity", "observed-state", "detail-and-provenance", "uncertainty-and-limitations", "governed-actions"]
    "media.gui.template.workspace-settings": ["workspace-identity", "settings-scope", "category-navigation", "current-and-inherited-values", "policy-owner", "affected-workflows", "unsaved-changes", "save-and-reset-actions"]
    "media.gui.template.project-overview": ["project-identity-and-version", "source-and-output-summary", "pending-work-summary", "intent-launcher", "recovery-and-navigation"]
    "media.gui.template.task-setup": ["project-context", "requested-outcome", "selected-inputs", "capability-and-policy-disposition", "validation", "next-safe-action"]
  patterns:
    "media.gui.pattern.project-browser": ["workspace-context", "search", "result-list", "empty-or-error-state", "create-action"]
    "media.gui.pattern.project-context-header": ["workspace", "project-identity", "revision", "access-state", "safe-next-action"]
    "media.gui.pattern.intent-launcher": ["intent-name", "outcome", "availability", "reason", "choose-action"]
    "media.gui.pattern.creation-plan-review": ["outcome", "inputs", "choices", "limits", "consent-and-rights", "effect-summary", "confirm-or-edit"]
    "media.gui.pattern.source-picker": ["source-context", "searchable-artifacts", "version", "eligibility", "selection"]
    "media.gui.pattern.upload-and-verification": ["upload-id", "transfer-progress", "verification-job-id", "verification-stage", "artifact-availability", "recovery"]
    "media.gui.pattern.job-status-and-recovery": ["job-identity", "state", "finality", "progress", "outputs", "next-safe-action"]
    "media.gui.pattern.activity-attention": ["activity-heading", "job-identity-and-purpose", "recorded-state-and-finality", "supported-age-or-urgency", "safe-next-action", "empty-or-unavailable-state"]
    "media.gui.pattern.multitrack-composition": ["composition-version", "multitrack-timeline", "track-and-clip-list", "transition-and-caption-alignment", "brand-and-typography-references", "safe-area-and-output-profile", "validation-state"]
    "media.gui.pattern.transcript-and-playback": ["player", "transport-controls", "source-time", "transcript-region", "selection"]
    "media.gui.pattern.caption-editor": ["source-context", "selected-cue", "text-editor", "timing", "validation", "save-as-new-version"]
    "media.gui.pattern.version-comparison": ["version-identities", "comparison-basis", "aligned-content", "difference-summary", "provenance"]
    "media.gui.pattern.review-approval": ["exact-output-version-identity", "review-scope-and-current-decision-state", "content-and-quality-evidence", "rights-and-policy-status", "reviewer-authority", "decision-outcome-and-follow-up"]
    "media.gui.pattern.quality-and-uncertainty": ["observation", "scope", "method", "value-or-uncertainty", "threshold", "reviewer-state"]
    "media.gui.pattern.rights-and-consent-review": ["material", "right-or-consent", "scope", "source", "validity", "decision", "next-action"]
    "media.gui.pattern.rendering": ["exact-composition-snapshot", "profile-and-validation", "rights-and-estimates", "explicit-submission", "job-state", "output-verification-and-review", "separate-delivery"]
    "media.gui.pattern.provenance-and-lineage": ["artifact-identity", "source-links", "derivation-steps", "methods", "timestamps", "unknowns"]
    "media.gui.pattern.safe-confirmation-and-unknown-outcome": ["effect-summary", "preconditions", "confirmation", "pending-state", "outcome-check", "safe-recovery"]
    "media.gui.pattern.destructive-lifecycle-action": ["exact-target-and-version-scope", "authority-and-preconditions", "impact-retention-and-reversibility", "explicit-confirmation", "pending-or-unknown-outcome", "safe-verification-and-recovery"]

