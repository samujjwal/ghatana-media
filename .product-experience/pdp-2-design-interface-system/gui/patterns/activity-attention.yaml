schemaVersion: media.gui-pattern.v1
id: media.gui.pattern.activity-attention
productId: media
authority: Media owns domain-specific composition and behavior; Shared owns reusable primitive implementation
status: proposal; semantics, source completeness, owner bindings, accessibility, and implementation pending
intent: Help an authorized user find a recorded job requiring status review, outcome check, or later follow-up, then open that exact job before another consequential action.
sourceRefs:
  - .product-experience/pdp-3-product-experience/screen-contracts/review-activity.yaml
  - .product-experience/pdp-3-product-experience/screen-registry.yaml#media.view.review-activity
  - .product-experience/pdp-3-product-experience/action-registry.yaml#media.action.view-job-status
  - .product-experience/pdp-3-product-experience/action-registry.yaml#media.action.check-job-outcome
context:
  scope: Current authorized workspace and jobs visible under its read authority.
  purpose: Attention for jobs or notifications requiring attention; not an infrastructure dashboard.
  identity: Keep the selected job identity and purpose visible; open and check only that exact job.
anatomy:
  - activity-heading
  - job-activity-list
  - job-identity-and-purpose
  - recorded-state-and-finality
  - age-or-time-context-when-source-provides-it
  - urgency-only-when-source-provides-an-authoritative-level
  - safe-next-action
  - empty-or-unavailable-state
states:
  - loading
  - populated
  - empty
  - partial
  - stale
  - access-denied
  - offline
  - job-outcome-unknown
  - evidence-unavailable
behavior:
  stateAndFinality: Show only the recorded job state and its supported finality; unknown or unavailable outcome remains explicitly unknown and is not inferred from age, absence, or event observation.
  nextSafeAction: Offer opening the exact job status; offer checking the outcome only for that same job when its recorded outcome is unknown and the action is authorized.
  urgencyAndAge: Do not invent priority, urgency, due time, or age. Display age or timestamps only when a bound source supplies them and their meaning is reviewed.
  acknowledgement: No dismiss, acknowledge, read/unread, or notification-clear action is proposed because source support is not established.
  deliveryAndReceipts: A listed item is not proof of event delivery, durable receipt, unseen notification, or authoritative finality.
actions:
  - media.action.view-job-status
  - media.action.check-job-outcome
componentRefs:
  - media.component.job-status-card
review:
  semantics: pending
  sourceCompleteness: pending
  ownerBindings: pending
  accessibility: pending
  implementation: pending
ownerDefinedAttentionNotificationScope:
  id: media.gui.attention-notification-scope.v1
  allowedReasons: [action-required, material-degradation, approval-required, long-running-work-completed, delivery-outcome, critical-security-or-rights-issue]
  requiredEvidence: [exact-source-identity, authoritative-current-fact-or-event, affected-job-or-resource-identity, observedTimeWhenProvided, recipientAndAuthorityScope, safeNextActionWhenOneExists]
  rules:
    - Emit an attention item only for one listed reason supported by an authoritative current fact or event; a workflow label, elapsed age, missing event, model inference, or unverified status is insufficient.
    - Keep the exact affected job/resource and source reference visible. Material degradation, approval need, and delivery outcome retain their source-defined meaning and are not collapsed into generic completion.
    - A notification or opening its item grants no action authority; each consequential next action rechecks current access, policy, rights, and finality.
    - Do not imply that delivery, display, read state, or omission is an acknowledgment, receipt, completion, or cancellation. Notification delivery/acknowledgment remains unimplemented unless an exact owner contract establishes it.
  nonGoals: [invent-priority-or-due-time,create-read-unread-or-dismiss-action-without-owner-contract,imply-job-cancellation,derive-material-degradation-from-unqualified-score]
  status: OWNER_DEFINED_ATTENTION_DEFINITION; event publisher, notification transport, and independent usability/accessibility review remain open.
  negativeCases: [notify-from-unverified-status,age-alone-creates-urgency,approval-and-degradation-collapsed,notification-opened-as-action-authority,delivery-treated-as-completion,dismissal-treated-as-cancellation]
normativeRuleRecords:
  - id: media.p2.rule.gui-attention-notification-scope.v1
    ruleRef: .product-experience/pdp-2-design-interface-system/gui/patterns/activity-attention.yaml#ownerDefinedAttentionNotificationScope
    sourceAuthority: .product-experience/pdp-2-design-interface-system/gui/patterns/activity-attention.yaml#authority
    acceptanceEffect: none
