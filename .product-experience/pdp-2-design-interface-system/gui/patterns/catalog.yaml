schemaVersion: media.gui-patterns.v1
owner: ghatana-media-product-experience
authority: Media owns domain-specific composition and behavior; Shared owns reusable primitive implementation
sourceRefs:
  - ../primitives.yaml
  - .product-experience/pdp-2-design-interface-system/component-contracts.yaml
  - .product-experience/pdp-2-design-interface-system/semantic-state-grammar.yaml
  - .product-experience/pdp-2-design-interface-system/action-finality-grammar.yaml
  - .product-experience/pdp-0-product-truth/state-models.yaml
scopeStatus: proposal; pattern behavior and component bindings require product and accessibility review
acceptance:
  criteria:
    - Each pattern composes Shared primitives and references canonical Media state and action contracts.
    - Every consequential action exposes preconditions, pending state, finality, and safe recovery.
    - Patterns preserve identity, provenance, access boundaries, and responsive and keyboard behavior.
  status: pending-review
verification:
  method: Check each pattern against its source contract, keyboard and narrow-layout behavior, and status/finality variants.
  status: not-run
patterns:
  - id: media.gui.pattern.project-browser
    intent: Find, create, and open projects in the current authorized workspace.
    anatomy: [workspace-context, search, result-list, empty-or-error-state, create-action]
    states: [loading, populated, empty, no-results, stale, access-denied]
    sourceRef: .product-experience/pdp-2-design-interface-system/component-contracts.yaml#media.component.project-browser
  - id: media.gui.pattern.project-context-header
    intent: Keep workspace, project identity, and exact revision visible.
    anatomy: [workspace, project-identity, revision, access-state, safe-next-action]
    states: [loading, ready, stale-revision, access-limited]
    sourceRef: .product-experience/pdp-2-design-interface-system/component-contracts.yaml#media.component.project-context-summary
  - id: media.gui.pattern.intent-launcher
    intent: Choose an outcome without selecting an implementation provider.
    anatomy: [intent-name, outcome, availability, reason, choose-action]
    states: [available, unavailable, selected, loading]
    sourceRef: .product-experience/pdp-2-design-interface-system/component-contracts.yaml#media.component.intent-launcher
  - id: media.gui.pattern.creation-plan-review
    intent: Review proposed outcome, material choices, support, and consequences before execution.
    anatomy: [outcome, inputs, choices, limits, consent-and-rights, effect-summary, confirm-or-edit]
    states: [draft, needs-input, blocked, ready, submitting, outcome-unknown]
    sourceRef: .product-experience/pdp-2-design-interface-system/component-contracts.yaml#media.component.creation-plan-summary
  - id: media.gui.pattern.source-picker
    intent: Propose selection of an eligible source artifact and version, subject to owner-authorized access; selection does not establish authority.
    anatomy: [source-context, searchable-artifacts, version, eligibility, selection]
    states: [loading, available, unavailable, access-denied, stale]
    sourceRef: .product-experience/pdp-2-design-interface-system/component-contracts.yaml#media.component.source-picker
  - id: media.gui.pattern.upload-and-verification
    intent: Show transfer and artifact-verification lifecycles as related but distinct.
    anatomy: [upload-id, transfer-progress, verification-job-id, verification-stage, artifact-availability, recovery]
    states: [queued, transferring, interrupted, verifying, verified, rejected, unknown]
    sourceRef: .product-experience/pdp-3-product-experience/screen-contracts/import-media.yaml
  - id: media.gui.pattern.job-status-and-recovery
    intent: Observe one job record and offer only contract-authorized state-appropriate recovery; durability is not established by this proposal.
    anatomy: [job-identity, state, finality, progress, outputs, next-safe-action]
    states: [queued, running, cancel-pending, completed, failed, cancelled, outcome-unknown]
    sourceRef: .product-experience/pdp-3-product-experience/screen-contracts/job-status.yaml
  - id: media.gui.pattern.activity-attention
    intent: Find a recorded job that needs status review, an outcome check, or follow-up, then open that exact job.
    anatomy: [activity-heading, job-identity-and-purpose, recorded-state-and-finality, supported-age-or-urgency, safe-next-action, empty-or-unavailable-state]
    states: [loading, populated, empty, partial, stale, access-denied, offline, job-outcome-unknown, evidence-unavailable]
    sourceRef: .product-experience/pdp-2-design-interface-system/gui/patterns/activity-attention.yaml#media.gui.pattern.activity-attention
  - id: media.gui.pattern.transcript-and-playback
    intent: Keep playback position, transcript selection, and source time aligned.
    anatomy: [player, transport-controls, source-time, transcript-region, selection]
    states: [loading, playable, seeking, unavailable, failed]
    sourceRef: .product-experience/pdp-2-design-interface-system/media-editing-grammar.yaml
  - id: media.gui.pattern.caption-editor
    intent: Edit text and timing while keeping source and proposed caption-revision context distinct; immutability is not established by this proposal.
    anatomy: [source-context, selected-cue, text-editor, timing, validation, save-as-new-version]
    states: [clean, dirty, invalid, saving, saved, outcome-unknown]
    sourceRef: .product-experience/pdp-2-design-interface-system/component-contracts.yaml#media.component.caption-track-editor
  - id: media.gui.pattern.version-comparison
    intent: Compare exact version identifiers and identify differences and proposed lineage; immutable-byte guarantees remain unverified.
    anatomy: [version-identities, comparison-basis, aligned-content, difference-summary, provenance]
    states: [ready, loading, incomparable, unavailable]
    sourceRef: .product-experience/pdp-2-design-interface-system/component-contracts.yaml#media.component.result-comparison
  - id: media.gui.pattern.review-approval
    intent: Review evidence for an exact output version and record a scoped decision only when authorized; distinct from pre-execution plan review.
    anatomy: [exact-output-version-identity, review-scope-and-current-decision-state, content-and-quality-evidence, rights-and-policy-status, reviewer-authority, decision-outcome-and-follow-up]
    states: [review-pending, evidence-incomplete, authorized-to-review, decision-recorded, approval-expired, new-version-requires-review, access-denied, outcome-unknown]
    sourceRef: .product-experience/pdp-2-design-interface-system/gui/patterns/review-approval.yaml#media.gui.pattern.review-approval
  - id: media.gui.pattern.quality-and-uncertainty
    intent: Present scoped measurements, review requirements, uncertainty, and acceptance separately.
    anatomy: [observation, scope, method, value-or-uncertainty, threshold, reviewer-state]
    states: [measured, inferred, unresolved, not-evaluated, accepted, rejected]
    sourceRef: .product-experience/pdp-2-design-interface-system/component-contracts.yaml#media.component.quality-inspector
  - id: media.gui.pattern.rights-and-consent-review
    intent: Make rights, consent scope, expiry, and policy decision visible before affected work.
    anatomy: [material, right-or-consent, scope, source, validity, decision, next-action]
    states: [required, valid, expired, revoked, denied, unresolved]
    sourceRef: .product-experience/pdp-3-product-experience/screen-contracts/review-rights-and-consent.yaml
  - id: media.gui.pattern.rendering
    intent: Keep exact-snapshot render preparation, submission, asynchronous execution, verification, review, and delivery distinct.
    anatomy: [exact-composition-snapshot, profile-and-validation, rights-and-estimates, explicit-submission, job-state, output-verification-and-review, separate-delivery]
    states: [preparation-draft, validation-required, ready-to-submit, submission-pending, submission-outcome-unknown, execution-queued-or-running, execution-outcome-unknown, output-awaiting-verification, output-available-for-review, delivery-pending, delivery-outcome-unknown, delivery-acknowledged]
    sourceRef: .product-experience/pdp-2-design-interface-system/gui/patterns/rendering.yaml#media.gui.pattern.rendering
  - id: media.gui.pattern.provenance-and-lineage
    intent: Explain source, derivation, transformations, and unresolved provenance.
    anatomy: [artifact-identity, source-links, derivation-steps, methods, timestamps, unknowns]
    states: [complete, partial, unresolved, unavailable]
    sourceRef: .product-experience/pdp-2-design-interface-system/component-contracts.yaml#media.component.provenance-summary
  - id: media.gui.pattern.safe-confirmation-and-unknown-outcome
    intent: Confirm consequential intent and recover safely when the effect is uncertain.
    anatomy: [effect-summary, preconditions, confirmation, pending-state, outcome-check, safe-recovery]
    states: [ready, submitting, confirmed, rejected, unknown]
    sourceRef: .product-experience/pdp-2-design-interface-system/action-finality-grammar.yaml
  - id: media.gui.pattern.destructive-lifecycle-action
    intent: Propose exact-scope, authority-checked confirmation and safe reconciliation for consequential lifecycle requests; artifact deletion remains unbound.
    anatomy: [exact-target-and-version-scope, authority-and-preconditions, impact-retention-and-reversibility, explicit-confirmation, pending-or-unknown-outcome, safe-verification-and-recovery]
    states: [target-or-version-unresolved, authority-unresolved, retention-or-hold-blocked, ready-for-explicit-confirmation, request-pending, outcome-unknown, effect-confirmed-within-reported-scope, recovery-requires-owner]
    sourceRef: .product-experience/pdp-2-design-interface-system/gui/patterns/destructive-lifecycle-action.yaml#media.gui.pattern.destructive-lifecycle-action
