  implementationEvidence:
  - libs/audio-video-ui/src/components/MediaTaskFlow.tsx
  bindingStatus: candidate-public-export-needs-owner-review
  publicExport: "@audio-video/ui/components#MediaTaskFlow"
  sharedReuse:
    package: "@ghatana/design-system"
    publicExport: "."
    components: [Badge, Button]
    mediaFacade: libs/audio-video-ui/src/foundations/index.ts
    status: source-consumer-candidate; installed-artifact-and-owner-review-pending
    progress: excluded-from-Shared-reuse
    progressReason: Shared Progress emits inline style attributes; Explorer enforces style-src-attr 'none'. Media uses native HTML progress for measured and indeterminate states; unknown and no-measurement remain text-only.
    stepNavigation: native-button-retained
    stepNavigationReason: Shared Button emits an inline style attribute blocked by Explorer style-src-attr 'none' and wraps its children in a label span that breaks Media's direct-child nav layout selectors; native button matches the host-gated step contract.
  reviewState: MediaTaskFlow composes Shared Badge and Button through the public Media foundations facade; Shared Progress is excluded because its inline style attributes violate the Explorer CSP. Consumer, accessibility, responsive, Shared theme, and owner review remain pending
