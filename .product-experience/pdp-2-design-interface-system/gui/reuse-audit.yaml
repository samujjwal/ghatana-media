  - job-recovery: JobRecoveryScreen; host job projection and shared workflow ports are typed
  - transcript-caption: TranscriptCaptionScreen; host transcript projection and draft callbacks are typed
  contractInventory: 48 files represent 47 canonical screens plus the artifact-verification job-family specialization
  noAdditionalRendererFamily:
    reason: Remaining canonical contracts describe distinct component anatomies and/or operation/effect consequences; the current public screen prop families do not supply exact matching data and action ports. Proposal action consequences remain unresolved, so no family adapter is inferred.
  existingSharedReuse:
    mediaFacade: libs/audio-video-ui/src/foundations/index.ts
    controls: [EmptyState, FileUpload]
    evidence: libs/audio-video-ui/src/screens/shared-control-reuse.test.ts
    status: Shared EmptyState and ArtifactIntakeScreen FileUpload have source/test-verified class-based defaults. Shared Button, Badge, Select, TextArea, TextField, and Spinner also use external CSS by default; Media keeps native action/draft controls where host-gated semantics remain the current exact implementation. External owner, visual, and accessibility acceptance remain pending.
  browserEvidence:
    route: Explorer #product; current caption workflow
    csp: Explorer response header enforces style-src-attr 'none'
    result: Historical Chromium run logged CSP violations for the then-current Shared control renderers; after their CSS correction, that route rendered without inline style attributes. Shared EmptyState and FileUpload now have source-level class-only regression coverage. This historical browser observation did not exercise the current FileUpload composition.
