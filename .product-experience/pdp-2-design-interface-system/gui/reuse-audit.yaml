    consumer: modules/intelligence/ai-voice/libs/ai-voice-ui-react/src/components/VoiceProductionWorkflow.tsx
    observation: VoiceProductionWorkflow imports MediaTaskFlow from @audio-video/ui and composes it around its workflow content.
    status: existing cross-product implementation reuse; source-only evidence, accessibility, visual, responsive, and owner acceptance pending
  workflowConcept:
    consumer: modules/intelligence/ai-voice/libs/ai-voice-ui-react/src/components/VoiceProductionWorkflow.tsx
    observation: AI Voice uses the shared action, eligibility, progress, and finality frame supplied by MediaTaskFlow; its product-specific step content remains local to VoiceProductionWorkflow.
    status: shared workflow concept in use; source-only evidence, accessibility, visual, responsive, and owner acceptance pending
  excludedCandidates:
  - component: Progress
    reason: Shared implementation emits inline style attributes prohibited by Explorer style-src-attr 'none'; native progress is already tested for determinate and indeterminate measurement, while unknown/no measurement remain text.
  - component: FileUpload
    reason: Shared implementation retains a bounded internal file list and offers drag/drop/preview behavior; ArtifactIntakeScreen hands the selected FileList to the host without those extra retention or upload semantics. The native input preserves the exact selection callback contract.
  - component: OperationStatus
    reason: Shared state domain is idle/running/completed/failed/paused and cannot represent Media OUTCOME_UNKNOWN/finality without an unapproved mapping; it also emits semantic styling outside the current Media facade.
  - component: ResponsiveTable
    reason: PDP-3 artifact and project projections are ordered collections with list semantics, not tabular row/column contracts.
  nativeControlsRetained:
  - workflow-step buttons: selection is host-gated and the current direct-child navigation markup is required; Shared Button adds a wrapper and inline style attributes.
  - source file input: native multiple-file selection forwards the complete host File[] projection without FileUpload's internal retention, preview, or drop behavior.
  - definition lists and ordered/unordered lists: existing projections are key/value observations and ordered media collections; no exact Shared data-component contract is bound.
ecosystemReuseReview:
  status: local-source-review; no additional implementation binding admitted
  scope:
    mediaPnpmWorkspace: pnpm-workspace.yaml
    includedSiblingWorkspaces:
    - ../ghatana-shared/platform/typescript/*
    - ../ghatana-tools/libs/product-development/*
    - ../ghatana-tools/tools/product-development/explorer
    - ../ghatana-lifecycle/libs/*
    - ../ghatana-lifecycle/tools/*
    - apps/*
    - libs/*
    - modules/**/libs/*
    inspectedMediaSurfaces:
    - libs/audio-video-ui/src/screens/FirstUseProjectScreen.tsx
    - libs/audio-video-ui/src/screens/ArtifactIntakeScreen.tsx
    - libs/audio-video-ui/src/screens/JobRecoveryScreen.tsx
    - libs/audio-video-ui/src/screens/TranscriptCaptionScreen.tsx
    - libs/audio-video-ui/src/components/MediaTaskFlow.tsx
    - libs/audio-video-ui/src/components/MediaProgress.tsx
    - apps/media-experience-explorer/src/product-review.tsx
    - modules/intelligence/ai-voice/libs/ai-voice-ui-react/src/components/VoiceProductionWorkflow.tsx
    - modules/intelligence/ai-voice/libs/ai-voice-ui-react/src/components/TrainingProgress.tsx
    filesystemAccessibleButOutsideMediaWorkspace:
    - repository: ../ghatana-kernel
      reviewedPackages: ["@ghatana/auth-core", "@ghatana/auth-contracts", "@ghatana/sso-client"]
      finding: Auth packages expose framework-neutral contracts/state and a repository-private SSO client, not reusable Media UI. They are not included by Media pnpm-workspace.yaml; the current Media screen receives host-projected accessState and does not implement login, token, or session handling.
    - repository: ../gharbatai
      reviewedPackages: ["@gharbatai/ui-react", "@gharbatai/ui-web", "@gharbatai/ui-mui", "@gharbatai/forms-react-hook-form", "@gharbatai/table-tanstack", "@gharbatai/auth-session"]
      finding: These packages are outside the Media pnpm workspace; the inspected React/forms/table/MUI packages are private product-family adapters or contracts, and current UI-kit renderers include inline styles. No exact Media contract fit or dependency binding is established.
    - repository: ../ghatana-products
      reviewedPackages: ["@ghatana/phr-web", "@ghatana/phr-experience-package"]
      finding: Product-specific PHR UI and experience contracts, outside the Media pnpm workspace; no generic Media component binding identified.
  packageReviews:
  - package: "@ghatana/design-system"
    workspacePackage: true
    disposition: exact-empty-state-reuse; other-observed-controls-excluded
    surfaceMapping:
      project-and-artifact-empty-collections: "EmptyState exact role=status/title projection; used by FirstUseProjectScreen and ArtifactIntakeScreen"
      workflow-actions-and-step-navigation: "Shared Button adds markup/style behavior and does not preserve current host-gated direct-child workflow contract under Explorer CSP"
      project-name-and-caption-drafts: "Shared TextField/TextArea wrappers emit inline styles; native labeled controls preserve host callbacks and pass the current CSP boundary"
      artifact-and-project-collections: "DataGrid/ResponsiveTable require row/column, sort/filter/page semantics absent from the current ordered list projections"
      access-and-operation-states: "AsyncState/LoadingState and OperationStatus add role, styling, spinner, or state vocabulary not equivalent to host-projected Media states and unknown finality"
    evidence:
    - sibling-repository:ghatana-shared/platform/typescript/design-system/src/molecules/EmptyState.tsx
    - sibling-repository:ghatana-shared/platform/typescript/design-system/src/atoms/TextField.tsx
    - sibling-repository:ghatana-shared/platform/typescript/design-system/src/atoms/TextArea.tsx
    - sibling-repository:ghatana-shared/platform/typescript/design-system/src/atoms/Progress.tsx
    - sibling-repository:ghatana-shared/platform/typescript/design-system/src/molecules/AsyncState.tsx
    - libs/audio-video-ui/src/screens/shared-control-reuse.test.ts
  - package: "@ghatana/product-shell"
    workspacePackage: true
    disposition: future-host-integration-candidate; not-current-workflow-body
    evidence: .product-experience/pdp-2-design-interface-system/gui/reuse-audit.yaml#ecosystemComponentCandidates/@ghatana/product-shell
    finding: Host-level shell/layout is distinct from the Media workflow body. Current MediaTaskFlow already supplies main and h1; direct shell/page composition can duplicate landmarks/headings, underlying Shared layout primitives emit inline style attributes, and @audio-video/ui has no package dependency or Explorer host binding.
  - package: "@ghatana/tokens"
    workspacePackage: true
    disposition: existing-package-dependency; no-new-media-token-binding
    finding: Media package already depends on and re-exports Shared tokens. Current Media stylesheet deliberately uses browser/OS system colors; the audited Shared token CSS and ui-styles recipes still have no exact variable-name matches or admitted semantic/unit bridge. Do not synthesize aliases in Media.
    evidence:
    - libs/audio-video-ui/package.json
    - libs/audio-video-ui/src/index.tsx
    - libs/audio-video-ui/src/styles.css
    - .product-experience/pdp-2-design-interface-system/gui/reuse-audit.yaml#sharedStylesheetBindingReview
  - package: "@ghatana/theme"
    workspacePackage: true
    disposition: existing-dependency; no-direct-media-renderer-binding
    finding: Media does not own host theme resolution; AI Voice's useSemanticColors uses the Shared theme/tokens path. Theme provider output applies inline style variables and is not a CSS-only bridge for the current Explorer CSP.
    evidence:
    - libs/audio-video-ui/package.json
    - modules/intelligence/ai-voice/libs/ai-voice-ui-react/src/components/useSemanticColors.ts
    - .product-experience/pdp-2-design-interface-system/gui/reuse-audit.yaml#sharedStylesheetBindingReview
  - package: "@ghatana/ui-styles"
    workspacePackage: true
    disposition: candidate-not-consumed; unresolved-token-contract
    evidence: .product-experience/pdp-2-design-interface-system/gui/reuse-audit.yaml#sharedStylesheetBindingReview/uiStylesRecipeCandidate
    finding: Public stylesheet is CSP-compatible as an asset but its generated recipe references do not resolve to token CSS exports; adding it would not style current Media controls without an owner-published semantic and unit bridge.
  - package: "@ghatana/ds-headless"
    workspacePackage: true
    disposition: no-exact-behavioral-duplication
    finding: Exposes generic interaction state and React adapters, but the current Media workflow uses native button/input/select elements with host-owned eligibility, callback ports, and operation projection. No missing behavior requiring a headless adapter was identified.
    evidence: sibling-repository:ghatana-shared/platform/typescript/ds-headless/package.json
  - package: "@ghatana/accessibility"
    workspacePackage: true
    disposition: verification-tooling-not-renderer
    finding: Public package provides accessibility auditing, interaction contracts, focus management, and live-region utilities. It is not a drop-in screen component; current native controls have no missing focus/overlay primitive use case. Human keyboard, screen-reader, zoom/reflow, forced-colors, and reduced-motion observations remain required separately.
    evidence:
    - sibling-repository:ghatana-shared/platform/typescript/accessibility/package.json
    - sibling-repository:ghatana-shared/platform/typescript/accessibility/src/index.ts
  - package: "@ghatana/experience-package and product-development Explorer"
    workspacePackage: true
    disposition: specification-and-review-tooling-not-product-runtime-ui
    finding: These workspace packages define, validate, or display PDP artifacts and Explorer review surfaces; the Media Explorer already consumes their packages for specification/review. They do not provide a matching end-user Media screen renderer to replace MediaProductRenderer or MediaTaskFlow.
    evidence:
    - apps/media-experience-explorer/package.json
    - apps/media-experience-explorer/src/product-review.tsx
    - apps/media-experience-explorer/src/specification.ts
  - package: "@gharbatai/ui-react and @gharbatai/ui-web"
    workspacePackage: false
    disposition: not-adopted-private-out-of-workspace
    finding: ui-web exports component/layout/theme contracts rather than a Media-ready renderer; ui-react provides an ExperienceUiKit including native elements, but package is private, outside the Media workspace, and its current controls assign inline styles. It would introduce another theming/provider contract and does not improve on the exact Shared EmptyState plus existing native Media controls.
    evidence:
    - sibling-repository:gharbatai/packages/gharbatai/ui-react/package.json
    - sibling-repository:gharbatai/packages/gharbatai/ui-react/src/native-kit.tsx
    - sibling-repository:gharbatai/packages/gharbatai/ui-web/package.json
  - package: "@gharbatai/forms-react-hook-form and @gharbatai/table-tanstack"
    workspacePackage: false
    disposition: not-adopted-private-out-of-workspace
    finding: These are private provider adapters for React Hook Form and TanStack Table. Current PDP-3 screens have individual host-projected draft callbacks and ordered collections without form-schema, sorting, filtering, pagination, or saved-view contracts; adopting them would add unrelated provider semantics.
    evidence:
    - sibling-repository:gharbatai/packages/gharbatai/forms-react-hook-form/package.json
    - sibling-repository:gharbatai/packages/gharbatai/table-tanstack/package.json
  verificationBoundary:
    sourceReview: Local sibling package source/manifests/exports and current Media/AI Voice consumer source; not package registry resolution, release verification, or external owner acceptance.
    styleBoundary: Explorer CSP enforces style-src-attr 'none'; local Media CSS remains structural/system-color fallback, not Shared visual qualification.
    acceptanceBoundary: No new component, package, theme, shell, auth/session, form, table/filter, loading/error, accessibility, or token binding is admitted by this review. Existing owner/accessibility and visual review gates remain open.
