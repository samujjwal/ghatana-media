crossProductReuse:
  componentReuse:
    implementation: libs/audio-video-ui/src/components/MediaProgress.tsx
    consumers:
      - libs/audio-video-ui/src/components/MediaTaskFlow.tsx
      - modules/intelligence/ai-voice/libs/ai-voice-ui-react/src/components/TrainingProgress.tsx
    observation: Both products use one MediaProgress implementation for determinate or indeterminate progress semantics; the caller supplies operation meaning and finality remains separate.
    status: existing cross-product implementation reuse; source-only evidence, accessibility, visual, responsive, and owner acceptance pending
  codeReuse:
    implementation: libs/audio-video-ui/src/components/MediaTaskFlow.tsx
    consumer: modules/intelligence/ai-voice/libs/ai-voice-ui-react/src/components/VoiceProductionWorkflow.tsx
    observation: VoiceProductionWorkflow imports MediaTaskFlow from @audio-video/ui and composes it around its workflow content.
    status: existing cross-product implementation reuse; source-only evidence, accessibility, visual, responsive, and owner acceptance pending
  workflowConcept:
    consumer: modules/intelligence/ai-voice/libs/ai-voice-ui-react/src/components/VoiceProductionWorkflow.tsx
    observation: AI Voice uses the shared action, eligibility, progress, and finality frame supplied by MediaTaskFlow; its product-specific step content remains local to VoiceProductionWorkflow.
    status: shared workflow concept in use; source-only evidence, accessibility, visual, responsive, and owner acceptance pending
  excludedCandidates:
  - component: Progress
    reason: Shared implementation emits inline style attributes prohibited by Explorer style-src-attr 'none'; native progress is already tested for determinate and indeterminate measurement, while unknown/no measurement remain text.
  - component: OperationStatus
    reason: Shared state domain is idle/running/completed/failed/paused and cannot represent Media OUTCOME_UNKNOWN/finality without an unapproved mapping; it also emits semantic styling outside the current Media facade.
  - component: ResponsiveTable
    reason: PDP-3 artifact and project projections are ordered collections with list semantics, not tabular row/column contracts.
  nativeControlsRetained:
  - workflow-step buttons: selection is host-gated and the current direct-child navigation markup is required; Shared Button defaults use external CSS, but the Media step contract retains native markup.
  - ArtifactIntakeScreen source selection: Shared FileUpload supplies the chooser UI around a native file input; Media disables preview and drag-and-drop so the full selection is forwarded without upload behavior.
  - definition lists and ordered/unordered lists: existing projections are key/value observations and ordered media collections; no exact Shared data-component contract is bound.
