status: audit-recorded; component-owner-review-pending; composition-review-pending; Shared-style-binding-unverified
sharedPackageMetadataObservation:
  packages:
    "@ghatana/design-system": { version: 0.1.0-SNAPSHOT, declaredLicense: MIT }
    "@ghatana/theme": { version: 0.1.0-SNAPSHOT, declaredLicense: MIT }
    "@ghatana/tokens": { version: 0.1.0-SNAPSHOT, declaredLicense: MIT }
  scope: Current sibling package.json metadata only; this is not a transitive dependency license assessment, immutable artifact verification, or Shared owner/design acceptance.
sharedStylesheetBindingReview:
  candidatePackages:
    tokens: sibling-repository:ghatana-shared/platform/typescript/tokens/package.json#./tokens.css
    recipes: sibling-repository:ghatana-shared/platform/typescript/ui-styles/package.json#./styles.css
  observedMismatch:
    tokensProvide: ["--gh-semantic-colors-light-interactive-default", "--gh-semantic-colors-light-surface-default", "--gh-semantic-geometry-control-height-standard"]
    recipesRequire: ["--gh-semantic-interactive-accent", "--gh-semantic-surface-default", "--gh-geometry-control-height"]
    missingRecipeVariables: 56
    exactNameMatches: 0
    semanticBridge: absent
    dimensionalUnitBridge: absent
  disposition: not-consumed; package CSS exports are public, but current token CSS does not define the variable names required by the recipe stylesheet and no source-backed Shared bridge was identified
  evidence: Explorer CSP permits same-origin stylesheets and blocks inline style attributes; no Shared stylesheet binding is admitted until variable parity, semantic mappings, dimensional units, and runtime behavior are verified against an owner-approved release. Theme provider output is not a CSS-only bridge because its runtime path applies inline styles.
  nextAction: Shared owner to publish a compatible bridge or approve a complete alias/unit mapping; keep only CSP-compatible Shared components in Media, and use native controls with Media-owned CSS where Shared inline styles are blocked.
  reviewState: design-system-owner-and-consumer-binding-review-pending
  uiStylesRecipeCandidate:
    package: "@ghatana/ui-styles"
    packageManifest: sibling-repository:ghatana-shared/platform/typescript/ui-styles/package.json
    publicStylesheetExport: "./styles.css -> ./dist/styles.css"
    publicStylesheetProducer: sibling-repository:ghatana-shared/platform/typescript/ui-styles/scripts/build-stylesheet.mjs
    version: 0.1.0-SNAPSHOT
    declaredLicense: MIT
    dependencyClosure: ["@ghatana/ds-schema@workspace:*"]
    packageBinding: absent-from-libs/audio-video-ui/package.json
    observedBuiltAsset: sibling-repository:ghatana-shared/platform/typescript/ui-styles/dist/styles.css
    stylesheetBoundary: package documentation states CSS text/assets only; host/bundler owns stylesheet loading and CSP/hydration/order
    variableAudit:
      generatedStylesheetReferences: 56
      generatedStylesheetDefines: 6
      exactTokenCssReferenceMatches: 0
      unresolvedReferenceNames: 50
      tokenCssUsesLightDarkScopedNames: true
      recipeCssUsesUnscopedNames: true
      themeRuntimeBridge: excluded; Theme provider runtime applies inline styles and Explorer blocks style-src-attr
      aliasesOrUnitConversions: none admitted
    disposition: candidate-not-consumed
    rationale: The public generated stylesheet is a deterministic CSP-compatible asset boundary, but its recipe references do not resolve against the public token CSS names. Token CSS exposes light/dark scoped semantic names and numeric dimensional values, while recipes reference unscoped names and dimensional CSS values. No owner-published bridge or complete approved semantic/unit mapping is present. Importing the stylesheet would leave required declarations unresolved; synthesizing aliases, units, or theme projection in Media would create an unapproved Shared token authority.
    ownerAndLicenseBinding: declared MIT metadata observed for ui-styles; transitive license review, immutable package artifact binding, Shared owner approval, and Media consumer verification remain pending
    evidenceScope: Source package manifests, README, public exports, stylesheet build script, token stylesheet, and built stylesheet inspected; no sibling source changed. This does not claim accessibility, visual qualification, owner acceptance, or production binding.
    followUp: Shared owner to publish a compatible token-to-recipe CSS bridge with explicit semantic and dimensional mappings, then validate the exact public artifact in an isolated CSP-enforced Media consumer before recording a binding.
inRepoConsumerEvidence:
  source: modules/intelligence/ai-voice/libs/ai-voice-ui-react/src/components
  observations:
  - StemTrack, TrainingProgress, and VoiceProductionWorkflow import Button from @ghatana/design-system.
  - TrainingProgress imports MediaProgress from @audio-video/ui; it uses the same native determinate progress presentation as MediaTaskFlow.
  - useSemanticColors composes useTheme from @ghatana/theme/react with semanticColorRoles from @ghatana/tokens/semantic-roles.
  limit: Existing imports are ecosystem usage evidence only; they do not establish a new Media component binding or CSP compatibility for other components.
additionalSharedCandidates:
  - candidate: "@ghatana/design-system/data-grid#DataGrid"
    evidence: sibling-repository:ghatana-shared/platform/typescript/design-system/src/data-grid/DataGrid.tsx
    observedCapabilities: [sorting, filtering, pagination, row-selection, row-actions, loading-and-empty-messages]
    disposition: rejected-for-current-artifact-browser
    rationale: The current Media artifact-browser contract is a media-oriented browse/review surface; the DataGrid API exposes tabular rows and generic row actions, with no evidence that its interaction model or presentation matches that contract. Public export alone is insufficient to justify adapting the browser to a table.
    followUp: Reconsider only if a tabular Media inventory view is explicitly designed and verified against DataGrid's renderer, styling, and CSP behavior.
  - candidate: "@ghatana/design-system/atoms#DataUseNotice"
    evidence: sibling-repository:ghatana-shared/platform/typescript/design-system/src/atoms/DataUseNotice.tsx; modules/intelligence/ai-voice/libs/ai-voice-ui-react/src/components/VoiceProductionWorkflow.tsx
    disposition: not-adopted
    rationale: DataUseNotice defaults to asserting either local or external AI processing plus 90-day retention. AI Voice's current rights/consent inputs do not establish processing location or a retention period, so composing this public component would add unsupported privacy claims. Keep the rights attestation and consent-reference contract explicit until a source selects those values.
    followUp: Reconsider when an owner-approved screen contract supplies processing location and retention scope and the Shared renderer passes the host CSP check.
  - candidate: "@ghatana/design-system/primitives/react"
    evidence: sibling-repository:ghatana-shared/platform/typescript/design-system/src/primitives/react/primitives.tsx
    disposition: not-adopted
    rationale: Primitives are generic building blocks; no concrete Media UI duplication or missing behavior was identified that their adoption would remove. Adding a wrapper solely to increase package reuse would create another abstraction without a source-backed need.
  - candidate: "@ghatana/design-system/molecules#EmptyState"
    evidence: sibling-repository:ghatana-shared/platform/typescript/design-system/src/molecules/EmptyState.tsx; libs/audio-video-ui/src/screens/shared-control-reuse.test.ts
    disposition: adopted-through-existing-public-foundations-facade
    rationale: The class-only component emits the same role=status and title label needed by resolved empty project and artifact collections; Explorer confirms CSP-safe markup. Media adds its own external class because Explorer does not load the Shared utility stylesheet. No additional screen substitution is needed.
  - candidate: "@ghatana/design-system/molecules#AccessDeniedState"
    evidence: sibling-repository:ghatana-shared/platform/typescript/design-system/src/molecules/AsyncState.tsx
    disposition: not-adopted
    rationale: It renders class-only markup, but announces access denial as role=alert while FirstUseProjectScreen currently uses role=status with explicit disclosure that project data stays hidden until access is granted. Its utility classes are not supplied by the Explorer stylesheet pipeline. Replacing the current projection would change announcement semantics and require unverified styling.
  - candidate: "@ghatana/design-system/molecules#LoadingState"
    evidence: sibling-repository:ghatana-shared/platform/typescript/design-system/src/molecules/AsyncState.tsx; sibling-repository:ghatana-shared/platform/typescript/design-system/src/atoms/Spinner.tsx
    disposition: not-adopted
    rationale: The shared component adds a spinner and class-only utility styling; Media's current access-loading projection is a text status with no measured or animation contract. Its Spinner emits inline style attributes and a style element blocked by Explorer CSP, and the utility stylesheet is not loaded.
  - candidate: "@ghatana/design-system/molecules#StatusBadge"
    evidence: sibling-repository:ghatana-shared/platform/typescript/design-system/src/molecules/StatusBadge.tsx; sibling-repository:ghatana-shared/platform/typescript/design-system/src/atoms/Badge.tsx
    disposition: excluded-from-current-media-status-projections
    rationale: StatusBadge delegates to Badge, whose current renderer/theme path applies inline styles blocked by Explorer style-src-attr 'none'. Its generic status mappings also do not establish Media job finality or OUTCOME_UNKNOWN semantics.
  - candidate: "@ghatana/design-system/atoms#Divider"
    evidence: sibling-repository:ghatana-shared/platform/typescript/design-system/src/atoms/Divider.tsx
    disposition: not-adopted
    rationale: Divider has a matching structural separator role but its Tailwind utility classes are not loaded in Explorer and its API accepts inline style overrides. Current Media structures do not need a semantic separator that native section/heading boundaries fail to express.
  - candidate: "@ghatana/design-system/molecules#ReviewRequiredBanner"
    evidence: sibling-repository:ghatana-shared/platform/typescript/design-system/src/molecules/ReviewRequiredBanner.tsx
    disposition: not-adopted
    rationale: The candidate is class-only but encodes pending/approved/rejected review states and affordances that are not represented by the current Media screen projections. Importing it would invent decision semantics rather than reuse an exact contract.
  - candidate: "@ghatana/design-system/molecules#Stepper"
    evidence: sibling-repository:ghatana-shared/platform/typescript/design-system/src/molecules/Stepper.tsx; libs/audio-video-ui/src/components/MediaTaskFlow.tsx
    disposition: not-adopted
    rationale: Shared Stepper models only index-based completed/active/pending states, and its interactive mode allows arbitrary step clicks. MediaTaskFlow carries host-authored available/current/completed/blocked state, block reasons, selectable permission, current action eligibility, and typed operation outcomes. Its renderer also uses inline styles blocked by Explorer style-src-attr 'none'. Replacing MediaTaskFlow would lose state and interaction semantics.
  - candidate: "@ghatana/design-system/molecules/FormStepper#FormStepper"
    evidence: sibling-repository:ghatana-shared/platform/typescript/design-system/src/molecules/FormStepper/FormStepper.tsx; libs/audio-video-ui/src/components/MediaTaskFlow.tsx
    disposition: not-adopted
    rationale: FormStepper represents completed/current/upcoming form steps and only allows clicks on completed steps; it has no blocked state or block reason and uses utility classes absent from the Explorer host stylesheet. MediaTaskFlow is an operation/workflow projection with host-gated selectable steps and operation finality, not a form-progress contract.
ecosystemComponentCandidates:
  - candidate: "@ghatana/product-shell#ProductShell/DashboardLayout/PageHeader/PageContent"
    evidence: sibling-repository:ghatana-shared/platform/typescript/product-shell/package.json; sibling-repository:ghatana-shared/platform/typescript/product-shell/src/components/ProductShell.tsx; sibling-repository:ghatana-shared/platform/typescript/product-shell/src/components/PagePrimitives.tsx; sibling-repository:ghatana-shared/platform/typescript/design-system/src/layout/Box.tsx; sibling-repository:ghatana-shared/platform/typescript/design-system/src/layout/Container.tsx
    disposition: not-adopted-current-media-workflow-body
    rationale: ProductShell and DashboardLayout compose host-level application chrome, while the current Media public components are workflow bodies. PageHeader would add another h1 around MediaTaskFlow's existing h1; PageContent outside DashboardLayout emits a main and inside it emits a section, while MediaTaskFlow already emits main, so direct composition risks duplicate main landmarks. These exports compose Shared Box, Container, Stack, and Typography; the inspected layout primitives emit inline styles, which conflict with Explorer style-src-attr 'none'. @ghatana/product-shell is also not a dependency of @audio-video/ui, and no Explorer host binding or CSP/accessibility qualification is admitted.
    followUp: Keep as a future host-integration candidate. Reconsider if the Explorer host adopts ProductShell at the application boundary, the Media workflow body is composed without duplicate headings or main landmarks, the package dependency is explicitly bound, and the exact composition passes CSP and accessibility review.
  - candidate: "@gharbatai/ui-mui#EmptyStateCard"
    evidence: sibling-repository:gharbatai/packages/gharbatai/ui-mui/src/EmptyStateCard.tsx; sibling-repository:gharbatai/packages/gharbatai/ui-mui/package.json
    disposition: not-adopted
    rationale: This is a private Gharbatai MUI adapter with profile-specific card, icon, typography, and optional-action semantics. It adds MUI/Emotion package coupling and does not match Media's title-only role=status empty collection projection. Media already composes the public Shared EmptyState for the exact matching state.
  - candidate: "@gharbatai/ui-mui#LoadingCard"
    evidence: sibling-repository:gharbatai/packages/gharbatai/ui-mui/src/LoadingCard.tsx; sibling-repository:gharbatai/packages/gharbatai/ui-mui/package.json
    disposition: not-adopted
    rationale: This private MUI card always adds a circular spinner and card layout; Media's current access-loading state is text-only and has no measured-progress or animation contract. It would add MUI/Emotion coupling without matching the current meaning.
