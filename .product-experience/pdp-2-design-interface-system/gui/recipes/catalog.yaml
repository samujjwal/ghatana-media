schemaVersion: media.gui-recipes.v1
productId: media
authority: Media-defined UI composition recipes; distinct from Media processing recipes and Shared primitive implementations
status: OWNER_APPROVED_AS_DEFINITION_RECIPES; SHARED_COMPONENT_AND_SCREEN_INSTANCE_ADMISSION_PENDING
sourceTemplates: .product-experience/pdp-2-design-interface-system/gui/templates/catalog.yaml
sourcePatterns: .product-experience/pdp-2-design-interface-system/gui/patterns/catalog.yaml
ownership:
  media: Semantic recipe identities, template linkage and product interaction intent
  shared: Generic components, accessibility primitives and token values
  lifecycle: Evidence and independently accepted closure only
nonClaims:
  - This catalog is not executable product UI, a product runtime processing recipe, or an admitted Shared package export.
  - Defining recipes does not accept the 47 downstream screen instances or independent visual and screen-reader review.
