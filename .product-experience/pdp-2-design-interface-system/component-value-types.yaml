    description: Keyframe binds rational time, typed property, value unit, and explicit interpolation.
    sourceAuthority: Media
  - id: media.component-value-type.VersionedMask
    schemaRef: media.component-value-types.v1#/$defs/VersionedMask
    description: Mask geometry is coordinate-profile and exact-version bound; unknown validation does not imply propagation.
    sourceAuthority: Media
  - id: media.component-value-type.TrackingObservation
    schemaRef: media.component-value-types.v1#/$defs/TrackingObservation
    description: Tracking observation binds exact frame time and evidence; unknown/lost is not successful propagation.
    sourceAuthority: Media
  - id: media.component-value-type.SimulationObservation
    schemaRef: media.component-value-types.v1#/$defs/SimulationObservation
    description: Simulation observation is model-version, run, rational time, quantity, unit, and epistemic-status scoped.
    sourceAuthority: Media
  - id: media.component-value-type.QualifiedModelBinding
    schemaRef: media.component-value-types.v1#/$defs/QualifiedModelBinding
    description: Model binding identifies exact version/profile and separate qualification disposition with evidence.
    sourceAuthority: Media
  - id: media.component-value-type.ComparisonBasis
    schemaRef: media.component-value-types.v1#/$defs/ComparisonBasis
    description: Comparison basis is explicit, version-aware, and method-bound.
    sourceAuthority: Media
  - id: media.component-value-type.ScopedDifference
    schemaRef: media.component-value-types.v1#/$defs/ScopedDifference
    description: Difference binds both values, unit, epistemic status, and uncertainty.
    sourceAuthority: Media
  - id: media.component-value-type.CapabilityProfileDisposition
    schemaRef: media.component-value-types.v1#/$defs/CapabilityProfileDisposition
    description: Capability disposition is an exact capability/profile pair; availability and qualification remain separate.
    sourceAuthority: Media
  - id: media.component-value-type.ScopedPolicyDecision
    schemaRef: media.component-value-types.v1#/$defs/ScopedPolicyDecision
    description: Policy decision binds exact scope, current authority, outcome, and the owner's current validity disposition; any time window is separately bound by its owning policy contract.
    sourceAuthority: Media
  - id: media.component-value-type.TransformWithCoordinateProfile
    schemaRef: media.component-value-types.v1#/$defs/TransformWithCoordinateProfile
    description: Transform binds matrix, unit, coordinate profile, and exact source version.
    sourceAuthority: Media
  - id: media.component-value-type.SourceTimestampWithClock
    schemaRef: media.component-value-types.v1#/$defs/SourceTimestampWithClock
    description: Timestamp binds exact rational value, clock authority, source version, and semantic kind.
    sourceAuthority: Media
  - id: media.component-value-type.ScopedSignalObservation
    schemaRef: media.component-value-types.v1#/$defs/ScopedSignalObservation
    description: Signal observation binds interval, channel, units, method, and epistemic status.
    sourceAuthority: Media
  - id: media.component-value-type.ProposedPlanRef
    schemaRef: media.component-value-types.v1#/$defs/ProposedPlanRef
    description: ProposedPlanRef is an exact opaque typed identity/value.
    sourceAuthority: Media
  - id: media.component-value-type.OperationExecutionRef
    schemaRef: media.component-value-types.v1#/$defs/OperationExecutionRef
    description: Recorded operation execution identity.
    sourceAuthority: Media
  - id: media.component-value-type.IntegrityEvidenceRef
    schemaRef: media.component-value-types.v1#/$defs/IntegrityEvidenceRef
    description: Integrity evidence identity, version binding, and verification algorithm.
    sourceAuthority: Media
  - id: media.component-value-type.OpaqueSceneEntityRef
    schemaRef: media.component-value-types.v1#/$defs/OpaqueSceneEntityRef
    description: Opaque scene entity identity.
    sourceAuthority: Media
  - id: media.component-value-type.VersionedMaterialRef
    schemaRef: media.component-value-types.v1#/$defs/VersionedMaterialRef
    description: Exact immutable material version identity.
    sourceAuthority: Media
  - id: media.component-value-type.ProvenanceRef
    schemaRef: media.component-value-types.v1#/$defs/ProvenanceRef
    description: Recorded provenance identity.
    sourceAuthority: Media
  - id: media.component-value-type.ScopedDecisionRef
    schemaRef: media.component-value-types.v1#/$defs/ScopedDecisionRef
    description: ScopedDecisionRef is an exact opaque typed identity/value.
    sourceAuthority: Media
  - id: media.component-value-type.VersionedDecisionRef
    schemaRef: media.component-value-types.v1#/$defs/VersionedDecisionRef
    description: VersionedDecisionRef is an exact opaque typed identity/value.
    sourceAuthority: Media
  - id: media.component-value-type.OutcomeEvidenceRef
    schemaRef: media.component-value-types.v1#/$defs/OutcomeEvidenceRef
    description: Evidence identity for observed outcome; not success authority.
    sourceAuthority: Media
