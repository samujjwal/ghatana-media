      streamId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Exact clock stream identity.
        examples:
          - stream-a
      secondsPerTick: &a2
        type: object
        additionalProperties: false
        properties:
          numerator:
            type: string
            maxLength: 20
            pattern: ^(?:0|-?[1-9][0-9]*)$
          denominator:
            type: string
            maxLength: 19
            pattern: ^[1-9][0-9]*$
            description: Positive signed-64-bit integer encoded in base-10 for exact BigInt arithmetic.
        required:
          - numerator
          - denominator
        description: Exact signed-64-bit decimal-string rational pair; consumers parse with bounded BigInt and reject unsafe
          Number coercion.
        examples:
          - numerator: "1"
            denominator: "1"
      originTicks:
        type: string
        maxLength: 20
        pattern: ^(?:0|-?[1-9][0-9]*)$
      discontinuityPolicy:
        type: string
        enum:
          - explicit-segments
          - continuous-only
          - unknown
        description: Clock discontinuity handling.
        examples:
          - explicit-segments
    required:
      - clockKind
      - clockId
      - streamId
      - secondsPerTick
      - originTicks
      - discontinuityPolicy
    description: "Rational timeline clock follows media.value.rational-media-time: identified domain/id/stream, exact
      positive signed-64-bit seconds per tick, signed-64-bit origin, and explicit discontinuity policy."
    examples:
      - clockKind: media
        clockId: clock-timeline-1
        streamId: stream-a
        secondsPerTick:
          numerator: "1001"
          denominator: "24000"
        originTicks: "0"
        discontinuityPolicy: explicit-segments
  SourceTimebaseRef:
    type: object
