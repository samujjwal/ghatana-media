$schema: https://json-schema.org/draft/2020-12/schema
$id: media.component-value-types.v1
title: Media component domain value type schemas
description: Closed source-owned value types used by proposal-only typed component input contracts; resolving a schema
  does not admit runtime or public Shared implementation.
normativeTypeRecords:
  - id: media.component-value-type.MediaViewRef
    schemaRef: media.component-value-types.v1#/$defs/MediaViewRef
    description: Exact canonical Media screen or lane-view identity from the current screen registry.
    sourceAuthority: Media
    authorityRefs:
      - .product-experience/pdp-3-product-experience/screen-registry.yaml#/screens
      - .product-experience/pdp-3-product-experience/screen-registry.yaml#/laneViews
  - id: media.component-value-type.RegisteredMediaReturnRouteRef
    schemaRef: media.component-value-types.v1#/$defs/RegisteredMediaReturnRouteRef
    description: Exact Media screen-registry identity eligible for host allowlist binding; source membership does not prove
      host registration or runtime binding.
    sourceAuthority: Media
    authorityRefs:
      - .product-experience/pdp-3-product-experience/screen-registry.yaml#/screens
  - id: media.component-value-type.MediaActionIntentRef
    schemaRef: media.component-value-types.v1#/$defs/MediaActionIntentRef
    description: Exact canonical Media action identity; an intent is not authorization.
    sourceAuthority: Media
    authorityRefs:
      - .product-experience/pdp-3-product-experience/action-registry.yaml#/actions
      - .product-experience/pdp-3-product-experience/action-registry.yaml#/ownerDefinedActions
  - id: media.component-value-type.ActionIntentRef
    schemaRef: media.component-value-types.v1#/$defs/ActionIntentRef
    description: Exact canonical action identity; not a dispatched operation.
    sourceAuthority: Media
    authorityRefs:
      - .product-experience/pdp-3-product-experience/action-registry.yaml#/actions
      - .product-experience/pdp-3-product-experience/action-registry.yaml#/ownerDefinedActions
  - id: media.component-value-type.CanonicalIntentRef
    schemaRef: media.component-value-types.v1#/$defs/CanonicalIntentRef
    description: Exact canonical user outcome intent identity from PDP-0 goals-jtbd.
    sourceAuthority: Media
    authorityRefs:
      - .product-experience/pdp-0-product-truth/goals-jtbd.yaml#/intents
  - id: media.component-value-type.TenantScopedWorkspaceRef
    schemaRef: media.component-value-types.v1#/$defs/TenantScopedWorkspaceRef
    description: Workspace reference is tenant-scoped and never an authorization grant.
    sourceAuthority: Media
  - id: media.component-value-type.ExactArtifactVersionRef
    schemaRef: media.component-value-types.v1#/$defs/ExactArtifactVersionRef
    description: Exact artifact version identity is the tuple (tenantId, artifactId, versionId); digest is evidence, not identity.
    sourceAuthority: Media
  - id: media.component-value-type.ImmutableProjectRevisionRef
    schemaRef: media.component-value-types.v1#/$defs/ImmutableProjectRevisionRef
    description: Exact immutable project revision tuple.
    sourceAuthority: Media
  - id: media.component-value-type.ExactCompositionVersionRef
    schemaRef: media.component-value-types.v1#/$defs/ExactCompositionVersionRef
    description: Exact immutable composition version tuple.
    sourceAuthority: Media
  - id: media.component-value-type.ExactTranscriptVersionRef
    schemaRef: media.component-value-types.v1#/$defs/ExactTranscriptVersionRef
    description: Exact immutable transcript version tuple.
    sourceAuthority: Media
  - id: media.component-value-type.ExactModelVersionRef
    schemaRef: media.component-value-types.v1#/$defs/ExactModelVersionRef
    description: Exact model version includes its immutable version and integrity digest.
    sourceAuthority: Media
  - id: media.component-value-type.ExactSceneVersionRef
    schemaRef: media.component-value-types.v1#/$defs/ExactSceneVersionRef
    description: Tenant-scoped exact immutable scene version tuple.
    sourceAuthority: Media
  - id: media.component-value-type.ExactSubjectVersionRef
    schemaRef: media.component-value-types.v1#/$defs/ExactSubjectVersionRef
    description: Tenant-scoped versioned subject identity for the rights or retention decision.
    sourceAuthority: Media
  - id: media.component-value-type.OpaqueProjectRef
    schemaRef: media.component-value-types.v1#/$defs/OpaqueProjectRef
    description: Tenant-scoped project identity.
    sourceAuthority: Media
  - id: media.component-value-type.ProjectSearchQuery
    schemaRef: media.component-value-types.v1#/$defs/ProjectSearchQuery
    description: Typed project query; text is a search term, not a scope or access predicate.
    sourceAuthority: Media
  - id: media.component-value-type.ArtifactSearchQuery
    schemaRef: media.component-value-types.v1#/$defs/ArtifactSearchQuery
    description: Typed artifact query; search filters do not establish authorization or global absence.
    sourceAuthority: Media
  - id: media.component-value-type.PageState
    schemaRef: media.component-value-types.v1#/$defs/PageState
    description: Query pagination state with exact current status and opaque cursor.
    sourceAuthority: Media
  - id: media.component-value-type.RationalSourceTime
    schemaRef: media.component-value-types.v1#/$defs/RationalSourceTime
    description: Exact signed-64-bit tick time with explicit clock id/stream and positive signed-64-bit rational seconds per
      tick, following media.value.rational-media-time.
    sourceAuthority: Media
    authorityRefs:
      - .product-experience/pdp-1-domain-data/value-objects.yaml#canonicalConversionDefinitions/records/@id=media.value.rational-media-time
  - id: media.component-value-type.RationalTimelineTimebaseRef
    schemaRef: media.component-value-types.v1#/$defs/RationalTimelineTimebaseRef
    description: "Rational timeline clock follows media.value.rational-media-time: identified domain/id/stream, exact
      positive signed-64-bit seconds per tick, signed-64-bit origin, and explicit discontinuity policy."
    sourceAuthority: Media
    authorityRefs:
      - .product-experience/pdp-1-domain-data/value-objects.yaml#canonicalConversionDefinitions/records/@id=media.value.rational-media-time
  - id: media.component-value-type.SourceTimebaseRef
    schemaRef: media.component-value-types.v1#/$defs/SourceTimebaseRef
    description: Declared source timebase follows media.value.rational-media-time; nominal frame rate does not replace this
      identified exact clock.
    sourceAuthority: Media
    authorityRefs:
      - .product-experience/pdp-1-domain-data/value-objects.yaml#canonicalConversionDefinitions/records/@id=media.value.rational-media-time
  - id: media.component-value-type.SourceSampleTimebaseRef
    schemaRef: media.component-value-types.v1#/$defs/SourceSampleTimebaseRef
    description: Sample clock binds identified stream, positive uint32 rate, uint63 sample count/origin and explicit
      priming/padding.
    sourceAuthority: Media
    authorityRefs:
      - .product-experience/pdp-1-domain-data/value-objects.yaml#canonicalConversionDefinitions/records/@id=media.value.sample-boundary-index
  - id: media.component-value-type.CompositionTimebaseRef
    schemaRef: media.component-value-types.v1#/$defs/CompositionTimebaseRef
    description: Composition timebase follows media.value.rational-media-time and binds an identified clock stream, exact
      positive signed-64-bit seconds per tick, signed-64-bit origin, and unit.
    sourceAuthority: Media
    authorityRefs:
      - .product-experience/pdp-1-domain-data/value-objects.yaml#canonicalConversionDefinitions/records/@id=media.value.rational-media-time
  - id: media.component-value-type.OptionalHalfOpenRationalInterval
    schemaRef: media.component-value-types.v1#/$defs/OptionalHalfOpenRationalInterval
    description: Nullable exact rational interval; a present value must have one positive same-clock half-open interval.
    sourceAuthority: Media
    authorityRefs:
      - .product-experience/pdp-1-domain-data/value-objects.yaml#canonicalConversionDefinitions/records/@id=media.value.rational-media-time
      - .product-experience/pdp-1-domain-data/value-objects.yaml#canonicalConversionDefinitions/records/@id=media.value.sample-boundary-index
  - id: media.component-value-type.OptionalHalfOpenFrameInterval
    schemaRef: media.component-value-types.v1#/$defs/OptionalHalfOpenFrameInterval
    description: Nullable exact frame interval; a present value retains its explicit frame/timebase boundaries.
    sourceAuthority: Media
  - id: media.component-value-type.PositiveRationalRate
    schemaRef: media.component-value-types.v1#/$defs/PositiveRationalRate
    description: Positive uint32 rational rate; zero and overflow fail closed.
    sourceAuthority: Media
  - id: media.component-value-type.DigestWithAlgorithm
    schemaRef: media.component-value-types.v1#/$defs/DigestWithAlgorithm
    description: Integrity digest identifies algorithm and encoded digest value; digest is not artifact identity.
    sourceAuthority: Media
  - id: media.component-value-type.ExplicitChannelLayout
    schemaRef: media.component-value-types.v1#/$defs/ExplicitChannelLayout
    description: Explicit ordered channel identities; no implied downmix or layout conversion.
    sourceAuthority: Media
  - id: media.component-value-type.ConsentValidity
    schemaRef: media.component-value-types.v1#/$defs/ConsentValidity
    description: Closed owner-defined ConsentValidity values; unknown or pending never implies success or permission.
    sourceAuthority: Media
  - id: media.component-value-type.IdentityHandoffRequest
    schemaRef: media.component-value-types.v1#/$defs/IdentityHandoffRequest
    description: PXD-082 adapter request; request construction is not authentication or authorization.
    sourceAuthority: Media
  - id: media.component-value-type.IdentityHandoffResult
    schemaRef: media.component-value-types.v1#/$defs/IdentityHandoffResult
    description: Exact PXD-082 normalized owner result; schema presence alone does not verify the external signer or owner pin.
    sourceAuthority: Media
  - id: media.component-value-type.IdentityOwnerPin
    schemaRef: media.component-value-types.v1#/$defs/IdentityOwnerPin
    description: Trusted owner pin is supplied out of band; result cannot supply its own expected pin.
    sourceAuthority: Media
  - id: media.component-value-type.IdentityHandoffEvaluation
    schemaRef: media.component-value-types.v1#/$defs/IdentityHandoffEvaluation
    description: Bounded evaluation record carries exact request/result, trusted owner pin, evaluation time and recomputable
      disposition; not proof of live identity.
    sourceAuthority: Media
  - id: media.component-value-type.RightsConsentScope
    schemaRef: media.component-value-types.v1#/$defs/RightsConsentScope
    description: Rights or consent decision is bound to tenant, exact subject version, purpose, and territory.
    sourceAuthority: Media
  - id: media.component-value-type.RightsConsentType
    schemaRef: media.component-value-types.v1#/$defs/RightsConsentType
    description: Closed owner-defined RightsConsentType values; unknown or pending never implies success or permission.
