  TenantScopedWorkspaceRef:
    type: object
    additionalProperties: false
    properties:
      tenantId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Trusted tenant scope.
        examples:
          - tenant-a
      workspaceId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Opaque workspace identity within that tenant.
        examples:
          - workspace-a
    required:
      - tenantId
      - workspaceId
    description: Workspace reference is tenant-scoped and never an authorization grant.
    examples:
      - tenantId: tenant-a
        workspaceId: workspace-a
  ExactArtifactVersionRef:
    type: object
    additionalProperties: false
    properties:
      tenantId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Trusted tenant identity for the exact immutable version.
        examples:
          - tenant-a
      artifactId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Stable artifact identity; not a content digest.
        examples:
          - artifact-1
      versionId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Opaque immutable version identity within the artifact.
        examples:
          - version-1
    required:
      - tenantId
      - artifactId
      - versionId
    description: Exact artifact version identity is the tuple (tenantId, artifactId, versionId); digest is evidence, not identity.
    examples:
      - tenantId: tenant-a
        artifactId: artifact-1
        versionId: version-1
  ImmutableProjectRevisionRef:
    type: object
    additionalProperties: false
    properties:
      tenantId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Trusted tenant scope.
        examples:
          - tenant-a
      projectId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Stable project identity.
        examples:
          - project-a
      revisionId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Immutable project revision identity.
        examples:
          - revision-4
    required:
      - tenantId
      - projectId
      - revisionId
    description: Exact immutable project revision tuple.
    examples:
      - tenantId: tenant-a
        projectId: project-a
        revisionId: revision-4
  ExactCompositionVersionRef:
    type: object
    additionalProperties: false
    properties:
      tenantId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Trusted tenant scope.
        examples:
          - tenant-a
      compositionId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Stable composition identity.
        examples:
          - composition-a
      versionId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Immutable composition version identity.
        examples:
          - version-8
    required:
      - tenantId
      - compositionId
      - versionId
    description: Exact immutable composition version tuple.
    examples:
      - tenantId: tenant-a
        compositionId: composition-a
        versionId: version-8
  ExactTranscriptVersionRef:
    type: object
    additionalProperties: false
    properties:
      tenantId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Trusted tenant scope.
        examples:
          - tenant-a
      transcriptId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Stable transcript identity.
        examples:
          - transcript-a
      versionId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Immutable transcript version identity.
        examples:
          - version-2
    required:
      - tenantId
      - transcriptId
      - versionId
    description: Exact immutable transcript version tuple.
    examples:
      - tenantId: tenant-a
        transcriptId: transcript-a
        versionId: version-2
  ExactModelVersionRef:
    type: object
    additionalProperties: false
    properties:
      modelId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Stable model identity.
        examples:
          - model-a
      versionId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Immutable model version identity.
        examples:
          - version-1
      digest:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Integrity digest bound to the version.
        examples:
          - sha256:abc123
    required:
      - modelId
      - versionId
      - digest
    description: Exact model version includes its immutable version and integrity digest.
    examples:
      - modelId: model-a
        versionId: version-1
        digest: sha256:abc123
  ExactSceneVersionRef:
    type: object
    additionalProperties: false
    properties:
      tenantId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Trusted tenant scope for this scene identity.
        examples:
          - tenant-a
      sceneId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Stable scene identity within tenant.
        examples:
          - scene-a
      versionId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Immutable scene version identity.
        examples:
          - version-1
    required:
      - tenantId
      - sceneId
      - versionId
    description: Tenant-scoped exact immutable scene version tuple.
    examples:
      - tenantId: tenant-a
        sceneId: scene-a
        versionId: version-1
  ExactSubjectVersionRef:
    type: object
    additionalProperties: false
    properties:
      tenantId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Trusted tenant scope for the subject.
        examples:
          - tenant-a
      subjectId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Stable subject identity within tenant.
        examples:
          - subject-a
      versionId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Exact subject version identity.
        examples:
          - version-1
    required:
      - tenantId
      - subjectId
      - versionId
    description: Tenant-scoped versioned subject identity for the rights or retention decision.
    examples:
      - tenantId: tenant-a
        subjectId: subject-a
        versionId: version-1
  OpaqueProjectRef:
    type: object
    additionalProperties: false
    properties:
      tenantId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Tenant scope.
        examples:
          - tenant-a
      projectId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Opaque project identity.
        examples:
          - project-a
    required:
      - tenantId
      - projectId
    description: Tenant-scoped project identity.
    examples:
      - tenantId: tenant-a
        projectId: project-a
  ProjectSearchQuery:
    type: object
    additionalProperties: false
    properties:
      text:
        type: string
        maxLength: 512
      sort:
        type: string
        enum:
          - recent
          - name
      limit:
        type: integer
        minimum: 1
        description: Page size bounded by the owning query contract.
        examples:
          - 1
    required:
      - text
      - sort
      - limit
    description: Typed project query; text is a search term, not a scope or access predicate.
    examples:
      - text: review
        sort: recent
        limit: 20
  ArtifactSearchQuery:
    type: object
    additionalProperties: false
    properties:
      text:
        type: string
        maxLength: 512
      mediaTypes:
        type: array
        items:
          type: string
          minLength: 1
          maxLength: 8192
          description: IANA media type filter.
          examples:
            - sample
        uniqueItems: true
      limit:
        type: integer
        minimum: 1
        description: Page size bounded by the owning query contract.
        examples:
          - 1
    required:
      - text
      - mediaTypes
      - limit
    description: Typed artifact query; search filters do not establish authorization or global absence.
    examples:
      - text: audio
        mediaTypes:
          - audio/wav
        limit: 20
  PageState:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
          - loading
          - populated
          - empty
          - partial
          - stale
          - offline
          - access-denied
        description: Current query collection state.
        examples:
          - loading
      nextPageRef:
        anyOf:
          - type: string
            minLength: 1
            maxLength: 256
            pattern: \S
            description: Opaque continuation cursor scoped to the exact query.
            examples:
              - media.test.0
          - type: "null"
    required:
      - status
      - nextPageRef
    description: Query pagination state with exact current status and opaque cursor.
    examples:
      - status: populated
        nextPageRef: null
  RationalSourceTime:
    type: object
    additionalProperties: false
    properties:
      clockKind:
        type: string
        enum:
          - media
          - simulation
          - story
        description: Explicit source clock kind; these domains are never implicitly aligned.
        examples:
          - media
      clockId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Stable source clock identity.
        examples:
          - clock-source-1
      streamId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: \S
        description: Exact source stream identity.
        examples:
          - stream-a
      ticks:
        type: string
        maxLength: 20
        pattern: ^(?:0|-?[1-9][0-9]*)$
        description: Signed-64-bit ticks as a decimal string; parsed with BigInt, never Number.
      secondsPerTick:
        type: object
        additionalProperties: false
        properties:
          numerator:
            type: string
            maxLength: 19
            pattern: ^[1-9][0-9]*$
          denominator:
            type: string
            maxLength: 19
            pattern: ^[1-9][0-9]*$
        required:
          - numerator
          - denominator
    required:
      - clockKind
      - clockId
      - streamId
      - ticks
      - secondsPerTick
    description: Exact signed-64-bit tick time with explicit clock id/stream and positive signed-64-bit rational seconds per
      tick, following media.value.rational-media-time.
    examples:
      - clockKind: media
        clockId: clock-source-1
        streamId: stream-a
        ticks: "3"
        secondsPerTick:
          numerator: "1"
          denominator: "2"
  RationalTimelineTimebaseRef:
    type: object
    additionalProperties: false
    properties:
      clockKind:
        type: string
        enum:
