    description: Normalized IANA media type.
    sourceAuthority: Media
  - id: media.component-value-type.BCP47LanguageTag
    schemaRef: media.component-value-types.v1#/$defs/BCP47LanguageTag
    description: BCP 47 language tag.
    sourceAuthority: Media
  - id: media.component-value-type.NonnegativeInteger
    schemaRef: media.component-value-types.v1#/$defs/NonnegativeInteger
    description: Nonnegative byte/sample/count value.
    sourceAuthority: Media
  - id: media.component-value-type.MeasuredNonnegativeInteger
    schemaRef: media.component-value-types.v1#/$defs/MeasuredNonnegativeInteger
    description: Observed nonnegative integer with measurement provenance.
