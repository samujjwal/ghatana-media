schemaVersion: media.accessibility-language.v1
productId: media
authority: Media-specific accessibility contracts over Shared primitives
status: MEDIA_OWNER_REQUIREMENTS_DEFINED; accessibility-specialist-review-pending
mediaOwnerDefinitionDecision:
  status: MEDIA_OWNER_ACCEPTED_REQUIREMENTS_ONLY
  authority: User-delegated Media product/design owner under the PDP-0–PDP-3 completion mandate
  scope: WCAG 2.2 AA as the graphical review target and the keyboard, focus, non-color, reflow, reduced-motion, forced-color, and nonvisual-equivalent requirements below
  excludes: [independent-conformance-finding, screen-reader-acceptance, Shared-component-accessibility-approval, phase-acceptance]
reviewTarget: WCAG-2.2-AA-for-graphical-and-web-experiences; EN-301-549-where-applicable
selectedPolicy:
  decision: delegated-Media-product-owner-standard-selection
  standard: WCAG 2.2
  level: AA
  scope: Applicable web and graphical Media views, Explorer review modes and reused Media UI components; machine-only products use semantic output, documentation and applicable nonvisual operation obligations instead of invented graphical screens
  policyStatus: SELECTED_AS_ACCEPTANCE_TARGET_NOT_CERTIFIED
  assistiveReview: Independent keyboard and screen-reader verification required for accepted critical flows; no automated-only certification
  nonVisualAlternatives: Timeline, waveform, graph, animation and canvas interactions require inspectable semantic data and keyboard-equivalent operations
  mandatoryFailureMode: Unsupported assistive semantics remain explicit and prevent corresponding representation acceptance
accessibilityRules:
  - id: media.a11y.keyboard-equivalence
    standard: WCAG 2.2
    level: AA
    requirement: Actions and time-based editing have named keyboard and non-drag equivalents with visible focus and predictable order.
  - id: media.a11y.programmatic-state
    standard: WCAG 2.2
    level: AA
    requirement: Exact source versions, selected ranges, operation state, uncertainty, errors and next steps are programmatically determinable.
  - id: media.a11y.media-alternatives
    standard: WCAG 2.2
    level: AA
    requirement: Speech, video, waveform, spectrogram, timeline and canvas semantics have appropriate captions/transcripts/textual or structured alternatives.
  - id: media.a11y.readability-reflow
    standard: WCAG 2.2
    level: AA
    requirement: Content works with supported text resizing, reflow and long localization without loss of safety, state or actions.
  - id: media.a11y.noncolor
    standard: WCAG 2.2
    level: AA
    requirement: Status, provenance and selection are expressed without relying only on color, sound, animation or position.
  - id: media.a11y.movement-and-status
    standard: WCAG 2.2
    level: AA
    requirement: Reduced motion, live status announcements and focus restoration preserve comprehension without repeated disruptive announcements.
  - id: media.a11y.text-spacing-and-target-size
    standard: WCAG 2.2
    level: AA
    requirement: Text remains readable and functionality remains available when users apply the applicable WCAG 2.2 text-spacing overrides and increase text size; pointer targets meet the minimum target-size rule or a specifically applicable WCAG exception.
    sourceRefs:
      - https://www.w3.org/WAI/WCAG22/Understanding/text-spacing.html
      - https://www.w3.org/WAI/WCAG22/Understanding/target-size-minimum.html
    textSpacingOverride:
      appliesTo: Content and controls implemented with markup supporting these text style properties; apply only the properties used by the language/script.
      lineHeightMinimum: 1.5em
      paragraphAfterMinimum: 2em
      letterSpacingMinimum: 0.12em
      wordSpacingMinimum: 0.16em
      invariant: No content or functionality is clipped, obscured, overlapped, truncated, or lost when these user overrides are applied.
    pointerTargetMinimum:
      width: 24 CSS pixels
      height: 24 CSS pixels
      exceptions:
        spacing: For an undersized target, a centered 24 CSS-pixel-diameter circle does not intersect another target circle.
        equivalent: The same function is available through another target that satisfies the minimum.
        inline: The target is in a sentence or its size is constrained by non-target text line-height.
        user-agent: Target size is determined by the user agent and not modified by the author.
      invariant: Exceptions are recorded per target and do not silently shrink neighboring interactive targets.
    textResizeAndReflow:
      requirement: At 200-percent text size and supported narrow reflow widths, users can read content and reach every control without two-dimensional scrolling except where the content itself requires a two-dimensional layout.
      longLocalizedStrings: Permit wrapping and container growth; do not clip, overlap, hide, or replace a safety, rights, identity, uncertainty, job-finality, or recovery fact.
      stableIdentifiers: Locale direction, user spacing, resize, and reflow do not change canonical IDs, reason codes, authority, operation effects, or machine fields.
    evidenceBoundary:
      status: DEFINITION_ONLY_NOT_MEASURED
      requiredObservation: Measure rendered target bounds, text-spacing override behavior, zoom/reflow behavior, and visible/pointer reachable content for each accepted representation.
      nonClaims: [no-rendered-conformance-finding, no-specialist-accessibility-acceptance, no-phase-acceptance]
    rejectionCases:
      - text-spacing-override-causes-content-or-functionality-loss
      - author-modified-pointer-target-is-under-24-by-24-css-pixels-without-a-valid-per-target-exception
      - undersized-neighboring-target-circles-intersect-under-spacing-exception
      - long-localized-label-is-clipped-or-hides-a-critical-fact
      - reflow-or-text-resize-removes-a-control-or-changes-a-canonical-identifier
requirements:
  - All visible actions have a keyboard path, visible focus, and accessible name that includes purpose and affected object.
  - Playback, transcript, waveform, and timeline have equivalent semantic controls; no operation depends only on drag, color, sound, or motion.
  - Live status announcements are concise and throttled; stable content is not re-announced on every progress update.
  - Errors are associated with the control or segment that needs correction and explain the safe next action.
  - Captions and transcripts remain readable at 200-percent text and supported reflow sizes.
  - Reduced-motion preferences remove decorative movement without hiding state or progress.
  - Forced-colors mode preserves source/derived distinctions, selection, focus, and error meaning.
  - System color keywords and native semantic controls remain the fallback when Shared theme colors are unavailable or overridden; forced-color-adjust must not suppress user-selected system colors without a reviewed reason.
  - Motion preferences remove decorative component transitions and movement while preserving explicit state, progress, and focus indication.
  - Localized labels and caption content remain separate from stable reason codes and machine fields.
verificationEvidenceRequired:
  - keyboard-only-observation
  - screen-reader-observation
  - zoom-and-reflow-observation
  - forced-colors-and-reduced-motion-observation
  - human-reviewer-and-version
acceptance: review-required; no conformance result is asserted
ownerDefinedCaptionAndAudioDescriptionOutputUse:
  id: media.a11y.caption-and-audio-description-output-use.v1
  authority: Media accessibility definition; independent specialist acceptance remains separate
  rule: >-
    Specify caption, transcript, and audio-description obligations against the
    exact output artifact/version, intended audience, locale, time map, and
    delivery profile. Captions/transcripts are text alternatives with their own
    language, timing, and source/version binding; audio description is a
    distinct narrated or described audio alternative and cannot be counted as a
    caption. Prerecorded alternatives are version-bound output content. A live
    stream session's open/connected/frame/acknowledgement or terminal state is
    only session observation; it is not caption text, a finalized transcript,
    or proof that an accessibility alternative was delivered. Live content
    needs an exact content-bearing stream contract and explicit finalization
    before it can be represented as a retained transcript. Applicability and
    completeness are assessed per intended output use; neither a universal
    requirement nor an exemption is inferred from the capability name.
  requiredBindings:
    - exact output artifact and immutable version
    - intended output use, audience, and delivery profile
    - locale and direction where text is present
    - exact caption/transcript content and media time-map when applicable
    - separate audio-description track/content identity when applicable
    - applicability disposition and evidence owner
  sourceRefs:
    - .product-experience/pdp-2-design-interface-system/accessibility.yaml#accessibilityRules/@id=media.a11y.media-alternatives
    - .product-experience/pdp-0-product-truth/capabilities.yaml#capabilities/@id=media.stream.caption.live
    - .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/records/@id=media.operation.capability.media-stream-session-open
  evidenceBoundary:
    status: DEFINITION_ONLY_NOT_MEASURED
    nonClaims: [no-caption-content-from-session-state, no-transcript-finalization-proof, no-rendered-conformance, no-specialist-acceptance]
  negativeCases:
    - treat a live session state as caption text or finalized transcript content
    - count audio description as captions or captions as audio description
    - bind an alternative to a mutable artifact without exact version and time-map
    - infer universal applicability or exemption from capability name alone
  runtimeAdmission: NOT_ADMITTED
  acceptanceEffect: none
ownerDefinedRuleManagementProposalControls:
  id: media.a11y.rule-management-proposal-controls.v1
  authority: Media accessibility definition for a coordinator-authored PDP-1 proposal; independent specialist acceptance remains separate
  scopeStatus: PROPOSAL_ONLY; PENDING_OWNER_REVIEW; DEFINITION_ONLY_NOT_MEASURED
  sourceRefs:
    - .product-experience/pdp-1-domain-data/handoff-contracts.yaml#/handoffs/pdp1ToPdp2CanonicalDomain/proposalHandoffs/@id=media.rules.manage.pdp1-definition-handoff.v1
    - .product-experience/pdp-1-domain-data/rule-management-contracts.yaml
    - .product-experience/pdp-2-design-interface-system/interface-grammar.yaml#ruleManagementProposalInterfaceBinding
    - .product-experience/pdp-2-design-interface-system/semantic-state-grammar.yaml#ruleManagementProposalPresentation
  requiredBindings:
    - exact authenticated tenant and purpose context
    - exact rule-set scope and target operation reference
    - exact immutable rule-set version and expected predecessor, including explicit null only for a known absent head
    - exact versioned source provenance, normalized graph, and semantic fingerprint
    - exact validation context and validation receipt when validation is requested
    - exact candidate operation plan when reuse is requested
    - operation-specific authorization and current status where applicable
  interactionRequirements:
    - Every author, inspect, validate, and reuse affordance has a keyboard-operable, non-drag equivalent and a visible focus indicator.
    - Accessible names identify the requested action and the exact rule-set/version or target operation affected.
    - Programmatic state distinguishes proposal, candidate, validation result, candidate operation plan, and each exact non-success outcome; color or icon alone never carries the distinction.
    - Long rule details and diagnostics remain navigable by keyboard and exposed in a stable reading order; no editor requires drag, hover, or animation to inspect or correct a value.
    - Validation and reuse outcomes are associated with the exact version, fingerprint, scope, and target operation that produced them.
    - UNKNOWN and STALE expose safe read-only reconciliation or an explicit new-request path; they never trigger silent fallback, rebase, or blind retry.
  states:
    source: .product-experience/pdp-2-design-interface-system/semantic-state-grammar.yaml#ruleManagementProposalPresentation
    presentationOnly: true
    createsLifecycleState: false
  negativeCases:
    - keyboard or screen-reader user cannot author, inspect, correct, or understand a rule candidate without pointer dragging
    - tenant, purpose, scope, exact version, predecessor, source provenance, or fingerprint is hidden or inferred from a display label
    - valid validation is presented as approval, execution, applied media effect, or measured quality
    - STALE or UNKNOWN silently selects a latest/different version or automatically resubmits
    - non-success state is represented by color, icon, or animation without an accessible name and explanation
  evidenceBoundary:
    status: DEFINITION_ONLY_NOT_MEASURED
    requiredObservation: Independent keyboard and screen-reader review of each accepted author, inspect, validate, and reuse flow plus status announcements and focus restoration.
    nonClaims: [no-rendered-conformance-finding, no-specialist-accessibility-acceptance, no-owner-acceptance, no-runtime-admission, no-phase-acceptance]
  runtimeAdmission: NOT_ADMITTED
  executionAdmission: NOT_ADMITTED
  acceptanceEffect: none
normativeRuleRecords:
  - id: media.p2.rule.caption-and-audio-description-output-use.v1
    ruleRef: .product-experience/pdp-2-design-interface-system/accessibility.yaml#ownerDefinedCaptionAndAudioDescriptionOutputUse
    sourceAuthority: .product-experience/pdp-2-design-interface-system/accessibility.yaml#selectedPolicy
    acceptanceEffect: none
  - id: media.p2.rule.rule-management-proposal-controls-accessibility.v1
