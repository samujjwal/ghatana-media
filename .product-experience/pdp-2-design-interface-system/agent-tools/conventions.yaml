schemaVersion: media.agent-tools-conventions.v1
owner: ghatana-media-product-agent-interface
authority:
  media: Owns tool purpose, domain meaning, domain effects, and the policy decision required for each effect.
  shared: Owns generic agent-runtime interfaces, execution mechanics, transport, handler lifecycle, and runtime enforcement.
  boundary: A Media declaration does not implement or grant a Shared runtime capability; Shared runtime availability does not define Media domain permission.
sourceRefs:
  - .product-experience/pdp-2-design-interface-system/api/auth.yaml
  - .product-experience/pdp-2-design-interface-system/api/idempotency.yaml
  - .product-experience/pdp-2-design-interface-system/api/async-operations.yaml
  - .product-experience/pdp-2-design-interface-system/api/retry-timeout-unknown-outcome.yaml
  - .product-experience/pdp-0-product-truth/policy-authority-model.yaml
  - .product-experience/pdp-0-product-truth/quality-policy.yaml
scopeStatus: proposal; no tool is admitted, callable, or authorized by this convention
currentRuntimeBindingObservation:
  status: source-observation-only; owner-and-public-export-binding-pending
  mediaBuildResolution: Current composite build compiles the handler APIs from the Ghatana Tools runtime/java/tool-contracts and runtime/java/tool-runtime sources.
  sharedPublicAgentToolContract: No matching ToolExecutionEnvelope, ToolExecutionResult, ToolContract, or ToolHandler source/export was found in the inspected Shared platform/java/agent-core or platform/java/agent-runtime trees; Media handlers consume the separately owned Ghatana Tools runtime SPI.
  consequence: Shared owner confirmation of the public Agent Tool/runtime contract and a consumer binding is still required; the Tools build resolution does not establish Shared acceptance or execution admission.
acceptance:
  status: pending-agent-and-runtime-owner-review
  criteria:
    - Every admitted tool has one stable canonical ID and an explicitly versioned, bounded input and result schema.
    - Every tool declares authority, delegation, effect class, idempotency, timeout, cancellation, unknown-outcome, evidence, and safe-failure behavior.
    - Authorization and current-resource preconditions are enforced by the owning runtime at invocation; consequential effects require explicit policy and provenance.
    - The exact handler, capability, transport, runtime, and consumer bindings are verified before admission.
verification:
  method: Adversarially test schema bounds, authorization and delegation, prompt/tool-description injection, duplicate invocation, timeout, cancellation races, unknown outcomes, evidence provenance, and safe failure.
  status: not-run

# Normative shape. A concrete tool record must resolve every field below; an
# unresolved value blocks admission rather than inheriting a permissive default.
perToolContract:
  requiredFields:
    canonicalToolId:
      rule: Stable, globally unambiguous, namespaced ID. Never derive identity from display name, prompt text, handler class name, or transport route.
    inputSchema:
      rule: Versioned, machine-validated closed schema; declare required/optional fields, types, bounds, formats, resource scope, and rejection behavior. Reject unknown fields unless an explicitly versioned extension is defined.
    resultSchema:
      rule: Versioned closed schema; distinguish success, safe failure, pending, cancelled, and outcome-unknown. Include operation identity, finality, and evidence references only when actually available; never represent missing evidence as success.
    authorityAndDelegation:
      rule: Declare effect class, principal/tenant/resource scope, required policy and consent evidence, delegation chain, and invocation-time checks. The least-privilege runtime must reject absent, expired, mismatched, or unverifiable authority.
    idempotency:
      rule: Declare whether the operation is read-only or effectful, its idempotency-key scope and retention, duplicate behavior, and whether the same key returns the original operation/result. If safe deduplication cannot be established, do not retry an effect automatically.
    timeout:
      rule: Declare a finite invocation deadline, including whether it covers queueing and downstream work; timeout is not proof that the effect did not happen.
    cancellation:
      rule: Declare when cancellation is accepted, what work can be stopped, and how races are reported. Cancellation requested or acknowledged is not proof of rollback or non-execution.
    unknownOutcome:
      rule: Return an explicit non-final unknown state with the original operation ID and a safe status-resolution path. Do not convert uncertainty to failure or success and do not blindly resubmit an effect.
    evidence:
      rule: Declare provenance, issuer, subject/resource and version scope, timestamps, correlation/operation IDs, and integrity/currentness checks for every authority or effect claim. Emit only evidence actually observed; distinguish request, decision, execution, and verified outcome.
    safeFailure:
      rule: Before dispatch, fail closed on invalid input, unresolved authority, stale resource state, unavailable runtime/provider, or unverifiable evidence. After dispatch, a timeout or cancellation race returns outcome-unknown with original operation identity; it must not imply that the effect did or did not occur. Return a bounded non-sensitive error and safe recovery/status guidance; do not leak secrets.
  defaultSafeBehavior:
    - No authority is inferred from tool availability, a description, prompt, model-generated argument, or agent intent.
    - No user consent, authorization, delegation, or policy approval is inferred from a tool call or from wording that claims it exists.
    - Missing or ambiguous contract fields deny invocation; there is no permissive fallback.
    - Read and mutation effects are separate contracts; a read capability cannot be upgraded into a mutation.
    - Validate caller, tenant, exact resource/version, current state, schema, and policy at invocation time; deny cross-tenant or out-of-scope access.
    - Expose no unrestricted filesystem, network, credential, or arbitrary-code capability; allowlist any required resource access in the runtime contract.
    - Unknown outcome blocks automatic retry of a consequential effect until the original operation is resolved or an authorized recovery decision is recorded.
    - Logs and results exclude secrets and sensitive payloads; evidence references are scoped and access-controlled.

# Bounded J-02 interaction-slice disposition. No current registered Agent Tool
# exposes upload-session begin/append/complete or scoped artifact inspection.
# These are domain reads/effects and cannot be inferred from an analysis tool
# accepting an artifact ID.
mediaUploadArtifactSlice:
  status: no-current-registered-tool-matches-the-bounded-slice
  ownerDecisionRef: .product-experience/decision-log.md#PXD-051
  registeredToolIds: [av.speech-to-text, av.text-to-speech, av.vision-analysis, av.multimodal-inference]
  matchingToolIds: []
  operationRefs: []
  runtimeAdmission: NOT_ADMITTED
  reason: Existing handlers perform delegated inference or synthesis; none exposes the exact PDP-1 upload command or scoped metadata query with its required authority, finality, and reconciliation semantics.
  prohibitedInference: Artifact-reference-input-on-an-analysis-tool-does-not-bind-that-tool-to-media.operation-slice.inspect-artifact-or-upload-actions.

