schemaVersion: media.agent-tools-conventions.v1
owner: ghatana-media-product-agent-interface
authority:
  media: Owns tool purpose, domain meaning, domain effects, and the policy
    decision required for each effect.
  shared: Owns generic agent-runtime interfaces, execution mechanics, transport,
    handler lifecycle, and runtime enforcement.
  boundary: A Media declaration does not implement or grant a Shared runtime
    capability; Shared runtime availability does not define Media domain
    permission.
sourceRefs:
  - .product-experience/pdp-2-design-interface-system/api/auth.yaml
  - .product-experience/pdp-2-design-interface-system/api/idempotency.yaml
  - .product-experience/pdp-2-design-interface-system/api/async-operations.yaml
  - .product-experience/pdp-2-design-interface-system/api/retry-timeout-unknown-outcome.yaml
  - .product-experience/pdp-0-product-truth/policy-authority-model.yaml
  - .product-experience/pdp-0-product-truth/quality-policy.yaml
scopeStatus: proposal; no tool is admitted, callable, or authorized by this convention
currentRuntimeBindingObservation:
  status: source-observation-only; owner-and-public-export-binding-pending
  mediaBuildResolution: Current composite build compiles the handler APIs from the
    Ghatana Tools runtime/java/tool-contracts and runtime/java/tool-runtime
    sources.
  sharedPublicAgentToolContract: No matching ToolExecutionEnvelope,
    ToolExecutionResult, ToolContract, or ToolHandler source/export was found in
    the inspected Shared platform/java/agent-core or platform/java/agent-runtime
    trees; Media handlers consume the separately owned Ghatana Tools runtime
    SPI.
  consequence: Shared owner confirmation of the public Agent Tool/runtime contract
    and a consumer binding is still required; the Tools build resolution does
    not establish Shared acceptance or execution admission.
toolsRuntimeSourceObservation:
  status: source-observation-only; Ghatana Tools owns these generic runtime types
  sourceRefs:
    - ../ghatana-tools/runtime/java/tool-contracts/src/main/java/com/ghatana/agent/framework/tools/ToolExecutionEnvelope.java
    - ../ghatana-tools/runtime/java/tool-contracts/src/main/java/com/ghatana/agent/framework/tools/ToolExecutionResult.java
    - ../ghatana-tools/runtime/java/tool-runtime/src/main/java/com/ghatana/toolruntime/ToolExecutionBudget.java
    - ../ghatana-tools/runtime/java/tool-runtime-api/src/main/java/com/ghatana/toolruntime/ToolTransportInvocationContext.java
  observedEnvelopeFields:
    [
      invocationId,
      toolId,
      toolVersion,
      callerAgentId,
      callerReleaseId,
      tenantId,
      actionClass,
      requestSchemaVersion,
      input,
      requestedAt
    ]
  observedTransportContextFields:
    [
      tenantId,
      invocationId,
      idempotencyKey,
      commandFingerprint,
      attempt,
      leaseToken,
      admissionDeadline,
      executionDeadline,
      maximumInputBytes,
      maximumOutputBytes,
      maximumRetries,
      cancellation,
      progress,
      correlationId,
      traceContext
    ]
  observedRuntimeOutcomeSupport: ToolExecutionResult supports non-final
    OUTCOME_UNKNOWN and CANCELLATION_REQUESTED with operation/attempt identity
    and no success output.
  notProvidedByTheseTypes:
    [
      principalId,
      delegationChain,
      exactMediaResourceVersion,
      purposeAndPolicyEvidence,
      consentAndRightsEvidence,
      outputProvenanceContract
    ]
  boundary: Runtime budget/cancellation/idempotency mechanics are observable in
    Tools source; they do not prove Shared public ownership, consumer package
    availability, Media policy enforcement, or handler-level operation
    equivalence.
acceptance:
  status: pending-agent-and-runtime-owner-review
  criteria:
    - Every admitted tool has one stable canonical ID and an explicitly
      versioned, bounded input and result schema.
    - Every tool declares authority, delegation, effect class, idempotency,
      timeout, cancellation, unknown-outcome, evidence, and safe-failure
      behavior.
    - Authorization and current-resource preconditions are enforced by the
      owning runtime at invocation; consequential effects require explicit
      policy and provenance.
    - The exact handler, capability, transport, runtime, and consumer bindings
      are verified before admission.
verification:
  method: Adversarially test schema bounds, authorization and delegation,
    prompt/tool-description injection, duplicate invocation, timeout,
    cancellation races, unknown outcomes, evidence provenance, and safe failure.
  status: not-run

# Normative shape. A concrete tool record must resolve every field below; an
# unresolved value blocks admission rather than inheriting a permissive default.
perToolContract:
  requiredFields:
    canonicalToolId:
      rule: Stable, globally unambiguous, namespaced ID. Never derive identity from
        display name, prompt text, handler class name, or transport route.
    inputSchema:
      rule: Versioned, machine-validated closed schema; declare required/optional
        fields, types, bounds, formats, resource scope, and rejection behavior.
        Reject unknown fields unless an explicitly versioned extension is
        defined.
    resultSchema:
      rule: Versioned closed schema; distinguish success, safe failure, pending,
        cancelled, and outcome-unknown. Include operation identity, finality,
        and evidence references only when actually available; never represent
        missing evidence as success.
    authorityAndDelegation:
      rule: Declare effect class, principal/tenant/resource scope, required policy and
        consent evidence, delegation chain, and invocation-time checks. The
        least-privilege runtime must reject absent, expired, mismatched, or
        unverifiable authority.
    idempotency:
      rule: Declare whether the operation is read-only or effectful, its
        idempotency-key scope and retention, duplicate behavior, and whether the
        same key returns the original operation/result. If safe deduplication
        cannot be established, do not retry an effect automatically.
    timeout:
      rule: Declare a finite invocation deadline, including whether it covers queueing
        and downstream work; timeout is not proof that the effect did not
        happen.
    cancellation:
      rule: Declare when cancellation is accepted, what work can be stopped, and how
        races are reported. Cancellation requested or acknowledged is not proof
        of rollback or non-execution.
    unknownOutcome:
      rule: Return an explicit non-final unknown state with the original operation ID
        and a safe status-resolution path. Do not convert uncertainty to failure
        or success and do not blindly resubmit an effect.
    evidence:
      rule: Declare provenance, issuer, subject/resource and version scope,
        timestamps, correlation/operation IDs, and integrity/currentness checks
        for every authority or effect claim. Emit only evidence actually
        observed; distinguish request, decision, execution, and verified
        outcome.
    safeFailure:
      rule: Before dispatch, fail closed on invalid input, unresolved authority, stale
        resource state, unavailable runtime/provider, or unverifiable evidence.
        After dispatch, a timeout or cancellation race returns outcome-unknown
        with original operation identity; it must not imply that the effect did
        or did not occur. Return a bounded non-sensitive error and safe
        recovery/status guidance; do not leak secrets.
  defaultSafeBehavior:
    - No authority is inferred from tool availability, a description, prompt,
      model-generated argument, or agent intent.
    - No user consent, authorization, delegation, or policy approval is inferred
      from a tool call or from wording that claims it exists.
    - Missing or ambiguous contract fields deny invocation; there is no
      permissive fallback.
    - Read and mutation effects are separate contracts; a read capability cannot
      be upgraded into a mutation.
    - Validate caller, tenant, exact resource/version, current state, schema,
      and policy at invocation time; deny cross-tenant or out-of-scope access.
    - Expose no unrestricted filesystem, network, credential, or arbitrary-code
      capability; allowlist any required resource access in the runtime
      contract.
    - Unknown outcome blocks automatic retry of a consequential effect until the
      original operation is resolved or an authorized recovery decision is
      recorded.
    - Logs and results exclude secrets and sensitive payloads; evidence
      references are scoped and access-controlled.

# Bounded J-02 interaction-slice disposition. No current registered Agent Tool
# exposes upload-session begin/append/complete or scoped artifact inspection.
# These are domain reads/effects and cannot be inferred from an analysis tool
# accepting an artifact ID.
mediaUploadArtifactSlice:
  status: no-current-registered-tool-matches-the-bounded-slice
  ownerDecisionRef: .product-experience/decision-log.md#PXD-051
  registeredToolIds:
    [
      av.speech-to-text,
      av.text-to-speech,
      av.vision-analysis,
      av.multimodal-inference
    ]
  matchingToolIds: []
  operationRefs: []
  runtimeAdmission: NOT_ADMITTED
  reason: Existing handlers perform delegated inference or synthesis; none exposes
    the exact PDP-1 upload command or scoped metadata query with its required
    authority, finality, and reconciliation semantics.
  prohibitedInference: Artifact-reference-input-on-an-analysis-tool-does-not-bind-that-tool-to-media.operation-slice.inspect-artifact-or-upload-actions.

# Observed handler IDs below are an inventory seed only. The source handlers
# currently validate only subsets of their inputs and delegate execution; this
# file does not promote those observations into canonical admitted contracts.
observedHandlerInventory:
  status: observed-source-identifiers-only; schemas-and-runtime-bindings-pending
  sourceRefs:
    - libs/common/src/main/java/com/ghatana/audio/video/tools/SpeechToTextToolHandler.java
    - libs/common/src/main/java/com/ghatana/audio/video/tools/TextToSpeechToolHandler.java
    - libs/common/src/main/java/com/ghatana/audio/video/tools/VisionAnalysisToolHandler.java
    - libs/common/src/main/java/com/ghatana/audio/video/tools/MultimodalInferenceToolHandler.java
  tools:
    - canonicalToolId: av.speech-to-text
      idStatus: observed-in-handler; canonical registry admission pending
      inputSchema:
        status: observed-subset-not-authoritative
        fields:
          audioSource: "Observed: required object with exactly one nonblank
            mediaArtifactId or bounded Base64 audioBytes; the flat
            mediaArtifactId fallback is rejected. Nested unknown keys are
            rejected."
      resultSchema: unresolved; define versioned success, failure, pending,
        cancellation, unknown-outcome, operation identity, and evidence fields
        before admission
      authorityAndDelegation: unresolved; require invocation-time tenant/resource
        authorization and any required consent/policy; handler identity or model
        request grants none
      idempotency: unresolved; transcription/provider side effects and duplicate
        semantics are not established; default no automatic retry
      timeout: unresolved finite bound; runtime binding pending; timeout must not
        imply non-execution
      cancellation: unresolved; runtime/provider cancellation and race semantics pending
      unknownOutcome: unresolved result binding; require original operation resolution
        before retry
      evidence: unresolved provenance/currentness contract; do not claim
        transcript/source lineage from handler invocation alone
      safeFailure: observed handler returns failure for invalid/missing source or
        unavailable delegate; post-dispatch ambiguity is preserved for runtime
        reconciliation; canonical sanitized error/result semantics remain
        pending
    - canonicalToolId: av.text-to-speech
      idStatus: observed-in-handler; canonical registry admission pending
      inputSchema:
        status: observed-subset-not-authoritative
        fields:
          text: "Observed required nonblank string."
          voiceId: "Observed optional value, default en-US-default; allowed values and
            schema bounds unresolved."
          speakingRate: "Observed optional Number, default 1.0; rejects non-finite values
            and values outside the inclusive range 0.25..4.0."
          audioEncoding: "Observed optional value, default MP3; supported enum unresolved."
          storeAsArtifact: "Observed boolean controlling requested artifact storage;
            storage effect, authorization, and defaults require canonical
            definition."
      resultSchema: unresolved; define versioned output/artifact identity, finality,
        operation identity, failure, and evidence before admission
      authorityAndDelegation: unresolved; artifact creation/storage requires explicit
        invocation-time authority, scope, and consent/policy where applicable
      idempotency: unresolved; artifact creation and provider duplicate behavior are
        not established; default no automatic retry
      timeout: unresolved finite bound; runtime/provider binding pending; timeout must
        not imply no artifact was created
      cancellation: unresolved; runtime/provider cancellation and possible artifact
        side effects pending
      unknownOutcome: unresolved result binding; resolve original operation and
        artifact state before any retry
      evidence: unresolved; generated audio, storage, provenance, and artifact-version
        evidence must be specified and observed
      safeFailure: observed handler rejects blank text and reports unavailable
        delegate; post-dispatch ambiguity is preserved for runtime
        reconciliation; canonical sanitized errors and partial-effect handling
        remain pending
    - canonicalToolId: av.vision-analysis
      idStatus: observed-in-handler; canonical registry admission pending
      inputSchema:
        status: observed-subset-not-authoritative
        fields:
          mediaSource: "Observed: required object with exactly one nonblank
            mediaArtifactId or bounded Base64 imageBytes; optional mimeType is
            limited to image/jpeg, image/png, or image/webp. Flat fallback and
            nested unknown keys are rejected."
          analysisTypes: "Observed optional list, default [OBJECT_DETECTION], 1..8 entries
            when provided; each entry is one of OBJECT_DETECTION,
            SCENE_CLASSIFICATION, OCR, FACE_DETECTION, LABEL_DETECTION,
            CUSTOM_MODEL."
          maxResults: "Observed optional integer, default 10, inclusive range 1..100."
      resultSchema: unresolved; define versioned findings, uncertainty, finality,
        operation identity, and evidence before admission
      authorityAndDelegation: unresolved; require invocation-time tenant/resource
        authorization and any required consent/policy; analysis output is not
        authorization
      idempotency: unresolved provider and duplicate semantics; default no automatic
        retry until side-effect and billing behavior are bounded
      timeout: unresolved finite bound; runtime/provider binding pending; timeout must
        not imply analysis did not run
      cancellation: unresolved; runtime/provider cancellation and race semantics pending
      unknownOutcome: unresolved result binding; require original operation resolution
        before retry
      evidence: unresolved model/provider provenance, source/version scope, and
        integrity/currentness contract
      safeFailure: observed handler rejects missing source and reports unavailable
        delegate; post-dispatch ambiguity is preserved for runtime
        reconciliation; canonical sanitized errors and partial-result rules
        remain pending
    - canonicalToolId: av.multimodal-inference
      idStatus: observed-in-handler; canonical registry admission pending
      inputSchema:
        status: observed-subset-not-authoritative
        fields:
          mediaArtifactId: "Observed required nonblank string."
          inferenceMode: "Observed optional strict enum
            SUMMARY|SEGMENT|FRAME_BY_FRAME|FULL, default SUMMARY."
          samplingRateMs: "Observed optional integer in inclusive range 100..60000,
            default 1000."
          enableTranscription: "Observed optional strict boolean, default true;
            non-boolean values reject."
          enableVisionAnalysis: "Observed optional strict boolean, default true;
            non-boolean values reject."
          languageCode: "Observed optional BCP-47 language tag, default en-US."
          rejection: "Rejects unknown top-level fields and rejects when both modality
            flags are false."
      resultSchema: unresolved; define versioned component outputs, partial/failure
        semantics, finality, operation identity, and evidence before admission
      authorityAndDelegation: unresolved; require authorization for exact
        artifact/version and each enabled analysis; one permission must not
        imply another
      idempotency: unresolved across component calls and provider effects; default no
        automatic retry
      timeout: unresolved finite end-to-end and component bounds; runtime binding
        pending; timeout must not imply no component ran
      cancellation: unresolved across component calls; partial completion and
        cancellation races pending
      unknownOutcome: unresolved result binding; resolve original operation and
        component states before retry
      evidence: unresolved per-component source/version, provider/model, provenance,
        and partial-result evidence
      safeFailure: observed handler rejects missing artifact ID and reports
        unavailable delegate; post-dispatch ambiguity is preserved for runtime
        reconciliation; canonical sanitized errors and partial-effect/result
        rules remain pending

admissionGates:
  handlerCapabilityTransportRuntimeBindings: pending; resolve exact registered
    capability, handler, transport, schema, identity, and runtime enforcement
    without inferring from class names or source observations
  mediaDomainMeaningAndPolicy: pending Media owner approval for each tool's
    purpose, data scope, effects, and required policy/consent evidence
  sharedRuntimeOwnership: pending Shared owner verification of generic runtime
    authorization, delegation, idempotency, timeout, cancellation, outcome
    resolution, evidence, and safe-failure mechanisms
  adversarialVerification: pending schema, authority, injection, duplicate,
    timeout, cancellation-race, unknown-outcome, evidence, and secret-leakage
    tests
  acceptance: pending; no Agent Tool contract, handler capability, or PDP phase is
    accepted by this proposal

# Delegated product-owner semantics for the four observed public Agent Tools.
# These selections authorize *definition* only. Java handler/Shared runtime
# binding, exact schemas, policy enforcement and producer qualification remain
# independently fail-closed until proved.
ownerSemanticSelections:
  status: OWNER_POLICY_ACCEPTED; CONTRACT_AND_EXECUTION_ADMISSION_PENDING
  sourceDecision: .product-experience/decision-log.md#PXD-027
  invariantRules:
    - Agent tool listings and descriptions never grant domain, tenant, rights,
      consent, identity or delegation authority.
    - An invocation requires caller, tenant, purpose, exact resource/version and
      current policy at effect boundaries.
    - Request receipt is not execution completion; timeout, disconnect or
      cancellation request does not prove non-execution.
    - A repeated effect requires stable idempotency scope and proof of safe
      deduplication, otherwise prohibit automatic retry.
    - A finite named execution-profile deadline is required before runnable
      admission; a missing limit is not an infinite fallback.
    - Missing or unqualified provider, audio codec, language, model, weights or
      source authorization is a typed non-admission outcome.
    - Return original operation/attempt identities for reconciliation and
      distinguish missing evidence from a negative result.
    - Prompt content, uploaded media and AI-generated descriptions are untrusted
      input, never execution instructions or grants.
  tools:
    - toolId: av.speech-to-text
      canonicalOperationFamily: media.operation.transcription
      inputBoundary: Only authorized audio asset/version or a separately admitted
        bounded raw-audio payload; no trust in caller-supplied artifact ID
        alone.
      effectSemantics: Submit a bounded recognition request and expose
        job/attempt/result finality separately; a transcript result does not
        imply user-approved captions.
      requiredProof: exact-input-schema; size-format-language-profile;
        principal-resource-rights; stable-idempotency-key; finite-timeout;
        cancellation-race; model-provenance; unknown-outcome-reconciliation
      executionAdmitted: false
    - toolId: av.text-to-speech
      canonicalOperationFamily: media.operation.synthesis
      inputBoundary: Nonblank bounded text, authorized voice/profile, accepted speech
        and audio-format capability, explicit artifact-write authority where
        requested.
      effectSemantics: Produce governed synthesis output or an explicit
        pending/unknown outcome; a successful provider response does not grant
        use, cloning or publishing rights.
      requiredProof: exact-text-voice-format-schema; consent-and-voice-authorization;
        finite-timeout; artifact-write-idempotency;
        output-version-and-provenance; cancellation-finality;
        unknown-effect-reconciliation
      executionAdmitted: false
    - toolId: av.vision-analysis
      canonicalOperationFamily: media.operation.vision-analysis
      inputBoundary: Exact authorized source asset/version and accepted analysis
        operation list, result bound and image/video format profile.
      effectSemantics: Generate scoped observations carrying per-region/temporal
        context and uncertainty; not scientific or factual authority without
        qualification.
      requiredProof: exact-input-schema; source-version-rights; analysis-type-bounds;
        model-dataset-scope; finite-timeout; result-provenance;
        safety-and-injection; safe-failure
      executionAdmitted: false
    - toolId: av.multimodal-inference
      canonicalOperationFamily: media.operation.multimodal-analysis
      inputBoundary: Exact authorized artifact/version with separately approved
        enabled transcription and/or vision sub-capabilities and bounded
        aggregate resource budget.
      effectSemantics: Treat each modality as a distinct sub-effect; report partial,
        unknown and per-component provenance without overclaiming aggregate
        success.
      requiredProof: exact-composition-schema; per-modality-policy;
        sub-effect-idempotency; partial-finality;
        finite-aggregate-and-component-timeout; per-component-provenance;
        cancellation-and-reconcile
      executionAdmitted: false

mediaHandlerImplementationObservation:
  status: hardened-adapter-contract; execution-not-admitted
  sourceRefs:
    - libs/common/src/main/java/com/ghatana/audio/video/tools/AgentToolInput.java
    - libs/common/src/test/java/com/ghatana/audio/video/tools/AudioVideoToolHandlersTest.java
  implementedChecks:
    - Tool ID, version and effect-class binding between invocation envelope and
      declared tool contract.
    - Closed top-level input fields and type/bound validation for accepted
      handler parameters.
    - Malformed artifact references and malformed byte inputs fail closed;
      inline bytes have a 20 MiB adapter bound.
    - Invalid optional values are rejected rather than silently defaulted or
      coerced.
    - Successful delegate output is validated with NetworkNT 3.0.6 Draft 2020-12
      against the matching ToolContract outputSchema; strict unknown-keyword
      handling, disabled remote-reference loading, and serialized-character,
      depth, and node bounds fail closed. Output bounds apply even if the
      supplied result schema is empty.
  limits:
    - The invocation envelope itself has no idempotency key, deadline,
      cancellation token, or authority/delegation evidence fields; the runtime
      supplies idempotency, deadline, cancellation, and attempt context
      separately through ToolExecutionBudget and ToolTransportInvocationContext.
    - Ghatana Tools ToolExecutionResult now supports non-final OUTCOME_UNKNOWN
      and CANCELLATION_REQUESTED values with operation/attempt references. Media
      handlers preserve post-dispatch ambiguity on the promise error channel,
      validate returned invocation identity, and do not persist or reconcile
      operation state themselves.
    - Handler checks are schema/context validation only; they do not authorize
      tenant/resource access or enforce consent, rights, policy, idempotency, or
      provenance.
    - Empty ToolContract output schemas remain unresolved and pass through; this
      adapter behavior does not bind the four capability YAML outputSchema
      descriptors as canonical registered result schemas. Additional properties
      remain permitted unless the supplied schema prohibits them, and
      unsupported schema keywords are not enforced.
    - Structural output checks do not define semantic result meaning,
      provenance, evidence, completeness, finality, rights, or production
      qualification. Media handlers preserve delegate rejection and reject
      malformed successful payloads on the promise error channel; at the Ghatana
      Tools DefaultToolExecutor boundary, ambiguous effectful failures map to
      non-final OUTCOME_UNKNOWN while read-only failures map to FAILED.
  executionAdmitted: false
  requiredSharedOwnerIntegration:
    - Publish and qualify the generic invocation SPI with principal/delegation,
      exact resource scope, invocation deadline, idempotency key, cancellation
      signal and operation identity.
    - Publish an explicit non-final outcome-unknown result and status-resolution
      contract preserving original operation and attempt IDs.
    - Qualify async completion/error mapping, cancellation races, and effect
      reconciliation semantics in the Shared runtime.
    - Bind Media tools to exact canonical operation contracts and independently
      tested output/provenance schemas.

# Media-owned definition contracts. These closed schemas define the intended
# Media boundary; they are not schemas published by Shared or enforced by the
# observed handler adapters. Adapter and public-runtime bindings remain pending.
mediaOwnedToolDefinitionContracts:
  status: MEDIA_OWNER_DEFINITION_ONLY; public-runtime-binding-pending
  schemaDialect: https://json-schema.org/draft/2020-12/schema
  hostInvocationContext:
    id: media.agent-tool-host-context.v1
    ownership: host/runtime supplied out-of-band; never copied from model/tool input
    schema:
      type: object
      additionalProperties: false
      required:
        - principalRef
        - tenantRef
        - delegationChainRef
        - purposeRef
        - resourceBindings
        - invocationId
        - deadline
        - idempotencyDisposition
        - cancellationRef
      properties:
        principalRef:
          type: string
          minLength: 1
          maxLength: 512
        tenantRef:
          type: string
          minLength: 1
          maxLength: 512
        delegationChainRef:
          type: string
          minLength: 1
          maxLength: 1024
        purposeRef:
          type: string
          minLength: 1
          maxLength: 256
        invocationId:
          type: string
          minLength: 1
          maxLength: 256
        deadline:
          type: string
          format: date-time
        idempotencyDisposition:
          enum:
            - READ_ONLY_NO_KEY
            - REQUIRED_SCOPED_KEY
            - UNSUPPORTED_NO_DISPATCH
        idempotencyKeyRef:
          type: string
          minLength: 1
          maxLength: 512
        cancellationRef:
          type: string
          minLength: 1
          maxLength: 512
        policyDecisionRefs:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 1024
        resourceBindings:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required:
              - objectRef
              - versionRef
              - tenantRef
              - purposeRef
              - authorityDecisionRef
              - decision
              - evidenceRef
              - observedAt
              - validUntil
            properties:
              objectRef:
                type: string
                minLength: 1
                maxLength: 512
              versionRef:
                type: string
                minLength: 1
                maxLength: 512
              tenantRef:
                type: string
                minLength: 1
                maxLength: 512
              purposeRef:
                type: string
                minLength: 1
                maxLength: 256
              authorityDecisionRef:
                type: string
                minLength: 1
                maxLength: 1024
              decision:
                const: AUTHORIZED
              evidenceRef:
                type: string
                minLength: 1
                maxLength: 1024
              observedAt:
                type: string
                format: date-time
              validUntil:
                type: string
                format: date-time
      allOf:
        - if:
            properties:
              idempotencyDisposition:
                const: READ_ONLY_NO_KEY
            required:
              - idempotencyDisposition
          then:
            not:
              required:
                - idempotencyKeyRef
        - if:
            properties:
              idempotencyDisposition:
                const: REQUIRED_SCOPED_KEY
            required:
              - idempotencyDisposition
          then:
            required:
              - idempotencyKeyRef
        - if:
            properties:
              idempotencyDisposition:
                const: UNSUPPORTED_NO_DISPATCH
            required:
              - idempotencyDisposition
          then:
            not:
              required:
                - idempotencyKeyRef
    enforcementBoundary: Shared runtime must attest the tuple at invocation and
      recheck current resource/policy facts at every effect boundary; Media's
      current envelope exposes only tool/version/invocation/tenant/action/input
      and does not carry this context. Resource bindings are exact
      object/version/tenant/purpose tuples with an authority decision, evidence,
      and observed validity interval; shape validation does not authenticate the
      issuer or establish current rights.
    bindingRules:
      - Each binding object/version must be a canonical source identity, not a
        free-form resource label.
      - binding.tenantRef must equal host tenantRef; binding.purposeRef must
        equal host purposeRef; authority decision must be current at trusted
        evaluation time and bind the exact object/version tuple.
      - The host schema validates shape only; trusted runtime verifies issuer,
        signature, currentness, authorization, expiry, and source resolution. A
        valid-looking ref is not proof.
  invocationSemantics:
    authority: Deny when principal, tenant, delegation chain, purpose, exact
      resource/version, rights/consent, or current policy evidence is missing,
      expired, mismatched, or unverified. Tool availability and model-generated
      arguments confer no authority.
    deadline: Require a finite host-issued deadline covering queue and downstream
      execution. Expiry after dispatch yields UNKNOWN unless authoritative
      reconciliation proves an outcome.
    idempotency: Read-only queries use READ_ONLY_NO_KEY. Mutations require a stable
      scoped key and owner-confirmed deduplication contract; absent proof means
      UNSUPPORTED_NO_DISPATCH. Never retry an unresolved effect.
    cancellation: Cancellation is a request; it may stop not-yet-dispatched work,
      but accepted/racing cancellation does not prove rollback. Return the
      original operation identity and UNKNOWN when effect status is unresolved.
    unknownOutcome: Preserve operationId and attemptId, return no success payload,
      expose only an authorized status-query reference, and require
      reconciliation before another effect.
    provenance: Bind output to exact input object/version, operation/attempt,
      producer/profile/version, observedAt, and evidence refs. Omit unavailable
      provenance; never infer it from handler invocation. A successful terminal
      result also carries exact finality evidence; no submission/accepted
      receipt is a completed output.
    adapterBoundary: Candidate input/result schemas below are Media-owned definition
      contracts. The current Java handlers forward the original envelope and
      supplied ToolContract; they do not adapt or enforce these host-context
      fields or Media result variants.
    resultDisposition:
      SUCCEEDED: Only after exact canonical operation payload, subject version,
        authority, provenance, and required component results validate.
      ACCEPTED: Receipt only; never implies processing completion, output
        registration, or publication.
      OUTCOME_UNKNOWN: Must preserve the original operation and attempt identity and
        provide authorized status resolution; no success payload and no repeat
        effect.
      FAILED: Only an owner-confirmed terminal failure; transport rejection/timeout
        after dispatch is unknown.
      CANCELLATION_REQUESTED: Request acknowledgment only; no rollback or stopped-effect claim.
      CANCELLED: Only owner-confirmed cancellation finality; does not imply artifact
        erasure or rollback of an already-applied effect.
    id: media.agent-tool-invocation-policy.v1
    scopeStatus: MEDIA_OWNER_DEFINITION_ONLY; host verification, public binding, and
      runtime admission pending
    rulesRef: .product-experience/pdp-2-design-interface-system/agent-tools/conventions.yaml#mediaOwnedToolDefinitionContracts/invocationSemantics
  boundedPlanningSemantics:
    id: media.agent-tool-bounded-planning.v1
    scopeStatus: MEDIA_OWNER_DEFINITION_ONLY; planner/runtime binding and execution
      admission pending
    planningUnit: A plan is a bounded ordered list of declared Media action
      references. It is not an agent-runtime graph, tool capability, or dispatch
      receipt.
    allowedMemberSchema: &boundedPlanMember
      type: object
      additionalProperties: false
      required:
        - actionRef
        - actionDefinitionRef
        - operationRefs
        - operationContractRefs
        - purposeRef
        - resourceBindings
        - preconditionRefs
        - expectedResultDisposition
      properties:
        actionRef:
          type: string
          minLength: 1
          maxLength: 512
        actionDefinitionRef:
          type: string
          pattern: '^\.product-experience/pdp-3-product-experience/action-registry\.yaml#actions/@id=media\.action\.[a-z0-9.-]+$'
        operationRefs:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 512
        operationContractRefs:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 1024
        purposeRef:
          type: string
          minLength: 1
          maxLength: 256
        resourceBindings:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [objectRef, versionRef]
            properties:
              objectRef:
                type: string
                minLength: 1
                maxLength: 512
              versionRef:
                type: string
                minLength: 1
                maxLength: 512
        preconditionRefs:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 1024
        expectedResultDisposition:
          enum: [SUCCEEDED, ACCEPTED, OUTCOME_UNKNOWN, FAILED, CANCELLED]
    planEnvelopeSchema:
      type: object
      additionalProperties: false
      required:
        - planId
        - planVersion
        - members
        - budget
        - authorityContextRef
      properties:
        planId:
          type: string
          minLength: 1
          maxLength: 256
        planVersion:
          type: string
          pattern: '^[1-9][0-9]*\\.[0-9]+\\.[0-9]+$'
        members:
          type: array
          minItems: 1
          maxItems: 16
          items: *boundedPlanMember
        budget:
          type: object
          additionalProperties: false
          required:
            - budgetRef
            - policyVersionRef
            - maxPlanningSteps
            - maxToolInvocations
            - maxReasoningTokens
            - deadline
          properties:
            budgetRef:
              type: string
              minLength: 1
              maxLength: 1024
            policyVersionRef:
              type: string
              minLength: 1
              maxLength: 512
            maxPlanningSteps:
              type: integer
              minimum: 1
              maximum: 16
            maxToolInvocations:
              type: integer
              minimum: 0
              maximum: 16
            maxReasoningTokens:
              type: integer
              minimum: 1
              maximum: 100000
            deadline:
              type: string
              format: date-time
        authorityContextRef:
          type: string
          minLength: 1
          maxLength: 1024
    rules:
      - Every member must resolve its exact actionRef, ordered operationRefs, and
        versioned Media definition contract; display names, descriptions,
        handler names, or inferred family membership do not resolve identity.
      - The planner may order only the exact declared members. It cannot add a
        tool, operation, resource, purpose, authority, or delegation edge that
        the caller and host context did not provide.
      - Tool and reasoning coordination is limited to bounded planning over
        declared actions. It does not create an agent graph, recursive planner,
        dynamic tool authority, or implicit tool invocation.
      - Every plan is bounded by one host-issued budget and authority context.
        A child step cannot reset, enlarge, or delegate those limits; exhausting
        or losing either context stops further dispatch.
      - Observation, inspection, search, and status-resolution members are
        read-only. Their results can inform a later explicitly declared action,
        but observation itself never dispatches that action.
      - Each consequential member is checked independently against its exact
        current resource/version, purpose, authority, policy, and consent
        preconditions immediately before dispatch.
      - ACCEPTED, UNKNOWN, cancellation-requested, or incomplete results do not
        satisfy a later member's precondition. Continue only from the exact
        typed result and recovery rule declared for that member; unresolved
        effects stop the plan and prohibit blind retry.
      - Planning or reasoning output is advisory until validated against this
        closed envelope. Prompt, media, observation text, and model-generated
        plans cannot change the envelope or grant authority.
    prohibitedInference:
      - A sequence or conditional branch is not evidence of an admitted agent
        runtime or workflow executor.
      - A named tool or operation in a plan is not evidence that its handler,
        transport, identity context, or runtime is bound or admitted.
      - A planner decision, observation, or accepted receipt is not proof that
        a consequential effect completed.
    sourceRefs:
      - .product-experience/pdp-1-domain-data/operations.yaml#ownerDefinedOperationContracts/records
      - .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/records
      - .product-experience/pdp-1-domain-data/authority.yaml#ownerDefinedPdp10AuthorityScopes/effectAuthority
    decisionRef: PXD-PENDING-PDP38-EXPERIENCE
    acceptanceEffect: none
    rulesRef: .product-experience/pdp-2-design-interface-system/agent-tools/conventions.yaml#mediaOwnedToolDefinitionContracts/boundedPlanningSemantics
  untrustedMediaDataBoundary:
    id: media.agent-tool-untrusted-media-data-boundary.v1
    scopeStatus: MEDIA_OWNER_DEFINITION_ONLY; runtime input filtering and execution admission pending
    untrustedInputClasses:
      - transcript-text-and-recognized-speech
      - OCR-and-scene-text
      - captions-subtitles-and-user-authored-media-notes
      - media-metadata-and-embedded-descriptions
      - raw-image-audio-video-and-frame-content
      - model-generated labels, summaries, recommendations, and plans
    authorityRule: >-
      Every value in an untrusted input class is data to inspect or quote, not an
      instruction source. A quoted or embedded request to change tools, operation,
      principal, tenant, target/version, purpose, rights, consent, policy, scope,
      resource bounds, confirmation, or result finality has no authority to do so.
      It cannot add an action or operation to a plan, select an unlisted target,
      satisfy a guard, or turn an observation into a dispatch.
    envelopeSourceRule: >-
      The invocation envelope and host context are built from the authenticated
      caller, exact registry identity, closed validated request, host-selected
      tenant/resource scope, and current owner policy. Untrusted media content,
      transcript/OCR, metadata, and model output cannot supply or override those
      fields. A direct user selection may choose only among the exact branches
      already declared by the action contract and must pass its own guards.
    handling:
      - Preserve untrusted input as bounded, provenance-labelled content.
      - Pass it to a declared read/analysis operation only as a typed input slot.
      - Treat embedded tool names, commands, URLs, credentials, claims, or policy
        directives as inert content; do not execute, dereference, or promote them.
      - If content would alter a closed envelope or exceed a declared target,
        purpose, or budget, reject that requested expansion and keep the original
        scoped operation unchanged.
    adversarialCases:
      - id: media.agent-tool-untrusted-case.transcript-tool-injection.v1
        inputClass: transcript-text-and-recognized-speech
        attack: Transcript says to call a different tool and export another tenant's artifact.
        expected: Preserve as transcript data; retain the host-selected tool and exact tenant/version or reject.
      - id: media.agent-tool-untrusted-case.ocr-policy-override.v1
        inputClass: OCR-and-scene-text
        attack: A frame contains text claiming that consent and human review are already approved.
        expected: Do not satisfy consent, rights, review, or approval guards from OCR content.
      - id: media.agent-tool-untrusted-case.model-target-expansion.v1
        inputClass: model-generated labels, summaries, recommendations, and plans
        attack: A model result proposes an unlisted operation, target, or larger budget.
        expected: Reject the expansion; only a separately selected exact declared action can proceed.
    sourceAuthorityRefs:
      - .product-experience/pdp-2-design-interface-system/agent-tools/conventions.yaml#defaultSafeBehavior
      - .product-experience/pdp-2-design-interface-system/agent-tools/conventions.yaml#mediaOwnedToolDefinitionContracts/boundedPlanningSemantics
    runtimeAdmission: NOT_ADMITTED
    acceptanceEffect: none
