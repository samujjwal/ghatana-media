  sharedBinding:
    status: NOT_BOUND
    ownerBoundaries:
      media: product inputs
      operation meanings: null
      policy preconditions and payload/provenance mapping: null
      tools: generic invocation budget
      transport: null
      cancellation and outcome mechanics: null
      shared-and-identity: authenticated principal/delegation and public host-context integration
    missingPublicRuntimeContract: Need a public, consumer-testable integration
      contract joining trusted Shared/identity principal and delegation to the
      existing Tools invocation budget/context and Media exact
      resource/purpose/policy evidence. Tools source already has deadline,
      idempotency, attempt, lease, cancellation and non-final unknown support;
      it does not carry principal, delegation, Media resource-version,
      purpose/rights evidence or output provenance. The public integrated
      package, owner-approved adapter contract and qualified enforcement
      behavior are not established here.
    adapterStatus: NOT_IMPLEMENTED; no Media adapter currently maps the proposed
      Media result schemas to the installed Tools SPI.
    prohibitedClaim: Handler source validation and Media-owned schema validity do
      not establish Shared ownership, public package availability, authorization
      enforcement, runtime availability, or execution admission.
  resultRules:
    preDispatchFailure: REJECTED_PRE_DISPATCH identifies only the invocation and
      bounded local error; operationId is forbidden because dispatch did not
      create an operation.
    acceptedReceipt: ACCEPTED is a canonical operation receipt only. attemptId is
      optional and is never fabricated; acceptance does not mean output exists
      or processing completed.
    unknown: OUTCOME_UNKNOWN allows either a known operation identity or an
      unresolved dispatch identity. It never includes a success payload, and
      requires invocation/request correlation; an unresolved effect blocks
      retry.
    terminalFailure: FAILED is only an authoritative terminal post-dispatch result
      with operation, attempt, and terminal evidence. An unclassified rejection
      or timeout is OUTCOME_UNKNOWN.
    success: SUCCEEDED requires exact operation and attempt identity plus a typed
      canonical payload reference/schema, exact subject object/version,
      producer/profile/version, provenance, evidence, and timestamp. A
      submission receipt alone cannot be SUCCEEDED.
    transcription: For speech-to-text, transcription-submission may yield ACCEPTED
      only. SUCCEEDED requires a separate exact transcript-version read/result
      operation and must not relabel its submission receipt as a completed
      transcript.
  binaryInputBounds:
    enforcement: JSON Schema contentEncoding/base64 pattern validates alphabet/shape
      but does not enforce decoded byte count. The adapter candidate must decode
      and count bytes before dispatch; schema maxLength alone is insufficient.
    tools:
      av.speech-to-text:
        field: audioSource.audioBytes
        maximumDecodedBytes: 20971520
        sourceRef: libs/common/src/main/java/com/ghatana/audio/video/tools/SpeechToTextToolHandler.java#resolveAudioSource
      av.vision-analysis:
        field: mediaSource.imageBytes
        maximumDecodedBytes: 20971520
        sourceRef: libs/common/src/main/java/com/ghatana/audio/video/tools/VisionAnalysisToolHandler.java#resolveMediaSource
