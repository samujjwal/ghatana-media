    - canonicalToolId: av.speech-to-text
      idStatus: observed-in-handler; canonical registry admission pending
      inputSchema:
        status: observed-subset-not-authoritative
        fields:
          audioSource: "Observed: object containing mediaArtifactId or audioBytes; a flat mediaArtifactId fallback also exists. Full types, limits, source authorization, and closed-schema behavior are unresolved."
      resultSchema: unresolved; define versioned success, failure, pending, cancellation, unknown-outcome, operation identity, and evidence fields before admission
      authorityAndDelegation: unresolved; require invocation-time tenant/resource authorization and any required consent/policy; handler identity or model request grants none
      idempotency: unresolved; transcription/provider side effects and duplicate semantics are not established; default no automatic retry
      timeout: unresolved finite bound; runtime binding pending; timeout must not imply non-execution
      cancellation: unresolved; runtime/provider cancellation and race semantics pending
      unknownOutcome: unresolved result binding; require original operation resolution before retry
      evidence: unresolved provenance/currentness contract; do not claim transcript/source lineage from handler invocation alone
