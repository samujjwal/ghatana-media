admissionGates:
  handlerCapabilityTransportRuntimeBindings: pending; resolve exact registered capability, handler, transport, schema, identity, and runtime enforcement without inferring from class names or source observations
  mediaDomainMeaningAndPolicy: pending Media owner approval for each tool's purpose, data scope, effects, and required policy/consent evidence
  sharedRuntimeOwnership: pending Shared owner verification of generic runtime authorization, delegation, idempotency, timeout, cancellation, outcome resolution, evidence, and safe-failure mechanisms
  adversarialVerification: pending schema, authority, injection, duplicate, timeout, cancellation-race, unknown-outcome, evidence, and secret-leakage tests
  acceptance: pending; no Agent Tool contract, handler capability, or PDP phase is accepted by this proposal

# Delegated product-owner semantics for the four observed public Agent Tools.
# These selections authorize *definition* only. Java handler/Shared runtime
# binding, exact schemas, policy enforcement and producer qualification remain
# independently fail-closed until proved.
ownerSemanticSelections:
  status: OWNER_POLICY_ACCEPTED; CONTRACT_AND_EXECUTION_ADMISSION_PENDING
  sourceDecision: .product-experience/decision-log.md#PXD-027
  invariantRules:
    - Agent tool listings and descriptions never grant domain, tenant, rights, consent, identity or delegation authority.
    - An invocation requires caller, tenant, purpose, exact resource/version and current policy at effect boundaries.
    - Request receipt is not execution completion; timeout, disconnect or cancellation request does not prove non-execution.
    - A repeated effect requires stable idempotency scope and proof of safe deduplication, otherwise prohibit automatic retry.
    - A finite named execution-profile deadline is required before runnable admission; a missing limit is not an infinite fallback.
    - Missing or unqualified provider, audio codec, language, model, weights or source authorization is a typed non-admission outcome.
    - Return original operation/attempt identities for reconciliation and distinguish missing evidence from a negative result.
    - Prompt content, uploaded media and AI-generated descriptions are untrusted input, never execution instructions or grants.
  tools:
    - toolId: av.speech-to-text
      canonicalOperationFamily: media.operation.transcription
      inputBoundary: Only authorized audio asset/version or a separately admitted bounded raw-audio payload; no trust in caller-supplied artifact ID alone.
      effectSemantics: Submit a bounded recognition request and expose job/attempt/result finality separately; a transcript result does not imply user-approved captions.
      requiredProof: exact-input-schema; size-format-language-profile; principal-resource-rights; stable-idempotency-key; finite-timeout; cancellation-race; model-provenance; unknown-outcome-reconciliation
      executionAdmitted: false
    - toolId: av.text-to-speech
      canonicalOperationFamily: media.operation.synthesis
      inputBoundary: Nonblank bounded text, authorized voice/profile, accepted speech and audio-format capability, explicit artifact-write authority where requested.
      effectSemantics: Produce governed synthesis output or an explicit pending/unknown outcome; a successful provider response does not grant use, cloning or publishing rights.
      requiredProof: exact-text-voice-format-schema; consent-and-voice-authorization; finite-timeout; artifact-write-idempotency; output-version-and-provenance; cancellation-finality; unknown-effect-reconciliation
      executionAdmitted: false
    - toolId: av.vision-analysis
      canonicalOperationFamily: media.operation.vision-analysis
      inputBoundary: Exact authorized source asset/version and accepted analysis operation list, result bound and image/video format profile.
      effectSemantics: Generate scoped observations carrying per-region/temporal context and uncertainty; not scientific or factual authority without qualification.
      requiredProof: exact-input-schema; source-version-rights; analysis-type-bounds; model-dataset-scope; finite-timeout; result-provenance; safety-and-injection; safe-failure
      executionAdmitted: false
    - toolId: av.multimodal-inference
      canonicalOperationFamily: media.operation.multimodal-analysis
      inputBoundary: Exact authorized artifact/version with separately approved enabled transcription and/or vision sub-capabilities and bounded aggregate resource budget.
      effectSemantics: Treat each modality as a distinct sub-effect; report partial, unknown and per-component provenance without overclaiming aggregate success.
      requiredProof: exact-composition-schema; per-modality-policy; sub-effect-idempotency; partial-finality; finite-aggregate-and-component-timeout; per-component-provenance; cancellation-and-reconcile
      executionAdmitted: false


mediaHandlerImplementationObservation:
  status: hardened-adapter-contract; execution-not-admitted
  sourceRefs:
    - libs/common/src/main/java/com/ghatana/audio/video/tools/AgentToolInput.java
    - libs/common/src/test/java/com/ghatana/audio/video/tools/AudioVideoToolHandlersTest.java
  implementedChecks:
    - Tool ID, version and effect-class binding between invocation envelope and declared tool contract.
    - Closed top-level input fields and type/bound validation for accepted handler parameters.
    - Malformed artifact references and malformed byte inputs fail closed; inline bytes have a 20 MiB adapter bound.
    - Invalid optional values are rejected rather than silently defaulted or coerced.
    - Successful delegate output is validated with NetworkNT 3.0.6 Draft 2020-12 against the matching ToolContract outputSchema; strict unknown-keyword handling, disabled remote-reference loading, and serialized-character, depth, and node bounds fail closed. Output bounds apply even if the supplied result schema is empty.
  limits:
    - The invocation envelope itself has no idempotency key, deadline, cancellation token, or authority/delegation evidence fields; the runtime supplies idempotency, deadline, cancellation, and attempt context separately through ToolExecutionBudget and ToolTransportInvocationContext.
    - Ghatana Tools ToolExecutionResult now supports non-final OUTCOME_UNKNOWN and CANCELLATION_REQUESTED values with operation/attempt references. Media handlers preserve post-dispatch ambiguity on the promise error channel, validate returned invocation identity, and do not persist or reconcile operation state themselves.
    - Handler checks are schema/context validation only; they do not authorize tenant/resource access or enforce consent, rights, policy, idempotency, or provenance.
    - Empty ToolContract output schemas remain unresolved and pass through; this adapter behavior does not bind the four capability YAML outputSchema descriptors as canonical registered result schemas. Additional properties remain permitted unless the supplied schema prohibits them, and unsupported schema keywords are not enforced.
    - Structural output checks do not define semantic result meaning, provenance, evidence, completeness, finality, rights, or production qualification. Media handlers preserve delegate rejection and reject malformed successful payloads on the promise error channel; at the Ghatana Tools DefaultToolExecutor boundary, ambiguous effectful failures map to non-final OUTCOME_UNKNOWN while read-only failures map to FAILED.
  executionAdmitted: false
  requiredSharedOwnerIntegration:
    - Publish and qualify the generic invocation SPI with principal/delegation, exact resource scope, invocation deadline, idempotency key, cancellation signal and operation identity.
    - Publish an explicit non-final outcome-unknown result and status-resolution contract preserving original operation and attempt IDs.
    - Qualify async completion/error mapping, cancellation races, and effect reconciliation semantics in the Shared runtime.
    - Bind Media tools to exact canonical operation contracts and independently tested output/provenance schemas.
