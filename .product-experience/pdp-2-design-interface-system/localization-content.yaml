schemaVersion: media.localization-content.v1
productId: media
authority: Media language, locale, and content behavior
status: authored-proposal; locale-owner-and-P0-010-review-pending
rules:
  - A locale present in a fixture is not an admitted runtime language.
  - Keep user-facing translations separate from stable action IDs, field names, and reason codes.
  - Preserve original recognized text and record translation as a derived version with provenance.
  - Never silently convert transcript language or measurement units.
  - Dates, numbers, decimal marks, and time display follow the selected presentation locale while stored rational media time remains unchanged.
  - Unsupported locale output is blocked or clearly marked as a reviewable draft; it is never presented as qualified.
fixtureLocale:
  value: en
  purpose: synthetic-content-example-only
  supportedAtRuntime: not-claimed
copyReview:
  requiresNativeOrQualifiedLanguageReviewer: true
  machineTranslationMayBePresentedAsApprovedCopy: false
ownerDefinedLocalizationRules:
  - id: media.localization.original-and-intermediate-precision.v1
    rule: Preserve the exact original value and every retained intermediate value when localizing or transforming text, numbers, units, or media time. Locale-specific separators and display formatting are presentation only and cannot overwrite the canonical value. A conversion that changes precision must produce a separately identified derived value with the exact conversion, rounding mode, and disclosed loss; unknown precision or conversion history remains unknown rather than reconstructed from display text.
    requiredEvidence: [sourceValueAndVersion, retainedIntermediateValueAndVersion, canonicalUnitOrTimebase, exactConversionAndRoundingWhenChanged, disclosedPrecisionLoss]
    negativeCases: [localized-display-round-tripped-into-canonical-value, intermediate-precision-discarded, unit-inferred-from-locale, rounding-loss-hidden, missing-conversion-history-reconstructed]
    scopeStatus: OWNER_DEFINED_LOCALIZATION_AND_PRECISION_RULE; source-specific scientific or measurement qualification remains separate.
  - id: media.localization.direction-and-reflow.v1
    sourceRefs: [.product-experience/pdp-2-design-interface-system/typography-layout.yaml#responsiveCompositionReferences, .product-experience/pdp-2-design-interface-system/accessibility.yaml#/accessibilityRules/@id=media.a11y.readability-reflow]
    rule: Resolve presentation direction only from the selected locale's explicit direction metadata (`ltr` or `rtl`); do not infer it from translated text or user identity. Apply direction to reading and layout order while isolating canonical Media identifiers, field names, reason codes, version refs, time values, and code so bidirectional text cannot reorder or rewrite machine identity. At each supported layout width, long localized strings wrap or expand within their content region without clipping, overlap, hiding required facts, or making controls unreachable. Text resizing to 200% and reflow at the narrow 320 CSS-pixel reference preserve the same content, identity, state, and available actions; horizontal scrolling is allowed only for a specifically identified intrinsically two-dimensional media surface with an equivalent structured or numeric control. Missing or unsupported locale-direction metadata remains unresolved and cannot silently select a direction or be treated as runtime locale support.
    invariants: [direction-is-explicit-ltr-or-rtl,canonical-identifiers-are-bidi-isolated,localized-copy-wraps-without-loss,text-resize-preserves-all-required-content,320-css-pixel-reflow-preserves-controls-and-actions,unsupported-direction-does-not-imply-runtime-locale-support]
    negativeCases: [rtl-direction-inferred-from-script,canonical-id-reordered-by-bidirectional-copy,long-label-clipped-at-narrow-width,200-percent-text-resize-hides-required-fact,control-becomes-unreachable-after-reflow,unsupported-locale-marked-runtime-supported]
    scopeStatus: OWNER_DEFINED_LOCALIZATION_AND_REFLOW_RULE; browser, assistive-technology, native-language, and runtime locale acceptance remain separate and unclaimed.
  - id: media.localization.font-fallback-shaping-and-license.v1
    sourceRefs: [.product-experience/pdp-2-design-interface-system/typography-layout.yaml#mediaOwnerDefinitionDecision, .product-experience/pdp-2-design-interface-system/accessibility.yaml#accessibilityRules]
    rule: Select fonts from an explicitly ordered, locale/script-compatible fallback list; record the selected face and version for reproducible rendering. Shape each text run with its declared script and direction, preserve grapheme clusters and combining marks, and never split a cluster at line wrapping. A fallback may be selected only when it covers the required glyphs and preserves the declared reading order; a missing glyph or shaping capability is an explicit unsupported-rendering condition, not permission to silently substitute a visually unrelated face or drop text. Before bundling, embedding, converting, or redistributing a font, require source-specific license evidence that covers the exact font/version and intended distribution/use; unknown, conflicting, or insufficient rights block that action. A system-provided font may be used without bundling only when the platform exposes it under its own terms; do not infer redistribution rights from local availability. This is an owner rendering rule, not legal clearance or proof of current font availability.
    requiredEvidence: [localeAndScript, explicitDirection, orderedFallbackCandidates, selectedFontIdentityAndVersion, glyphCoverageAndShapingDisposition, exactLicenseEvidenceForBundledOrEmbeddedFont, intendedDistributionScope]
    negativeCases: [implicit-font-substitution,missing-glyph-dropped,grapheme-cluster-split,direction-inferred-from-font,local-font-availability-treated-as-redistribution-license,unknown-font-license-bundled,license-for-different-font-version-reused]
    scopeStatus: OWNER_DEFINED_FONT_FALLBACK_AND_SHAPING_RULE; legal review, actual font qualification, and runtime availability remain separate and unclaimed.
normativeRuleRecords:
  - id: media.p2.rule.localization-original-intermediate-precision.v1
    ruleRef: .product-experience/pdp-2-design-interface-system/localization-content.yaml#/ownerDefinedLocalizationRules/@id=media.localization.original-and-intermediate-precision.v1
    sourceAuthority: .product-experience/pdp-2-design-interface-system/localization-content.yaml#authority
    acceptanceEffect: none
  - id: media.p2.rule.localization-direction-and-reflow.v1
    ruleRef: .product-experience/pdp-2-design-interface-system/localization-content.yaml#/ownerDefinedLocalizationRules/@id=media.localization.direction-and-reflow.v1
    sourceAuthority: .product-experience/pdp-2-design-interface-system/typography-layout.yaml#responsiveCompositionReferences
    acceptanceEffect: none
  - id: media.p2.rule.localization-font-fallback-shaping-and-license.v1
    ruleRef: .product-experience/pdp-2-design-interface-system/localization-content.yaml#/ownerDefinedLocalizationRules/@id=media.localization.font-fallback-shaping-and-license.v1
    sourceAuthority: .product-experience/pdp-2-design-interface-system/typography-layout.yaml#mediaOwnerDefinitionDecision
    acceptanceEffect: none
