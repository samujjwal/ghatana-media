      rules:
        - Model authority specifies equations/constraints or its authoritative
          model reference, initial/boundary conditions, solver type/version,
          fixed/adaptive step, tolerances and integration policy; collision,
          mass/inertia and materials declare exact typed contracts or explicit
          non-applicability.
