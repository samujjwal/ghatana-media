schemaVersion: media.pdp-1.value-objects.v1
artifactId: media.pdp-1.value-objects
productId: media
semanticOwner: media
authority: .product-experience/pdp-0-product-truth/time-units-fidelity.yaml
scopeStatus: proposed-values-and-observed-fields; pending-owner-review
sourceRefs: [.product-experience/pdp-0-product-truth/domain-model.yaml, .product-experience/pdp-0-product-truth/time-units-fidelity.yaml, .product-experience/pdp-0-product-truth/quality-policy.yaml, runtime-contracts/src/main/java/com/ghatana/media/runtime/MediaRuntimeContracts.java, libs/audio-video-types/src/contracts.ts, contracts/openapi/media.yaml, modules/speech/stt-service/src/main/proto/stt_service.proto, modules/speech/tts-service/src/main/proto/tts_service.proto, modules/vision/vision-service/src/main/proto/vision_service.proto, modules/intelligence/multimodal-service/src/main/proto/multimodal_service.proto, modules/infrastructure/persistence/src/main/resources/db/migration/V1__init_schema.sql, providers/aws-postgresql/src/main/resources/db/media-runtime/V001__media_runtime_state.sql]
values:
  - id: media.value.opaque-id
    name: OpaqueId
    meaning: stable-reference-without-embedded-authority
    observedForms: Java String; bounded TypeScript string; protobuf identifiers
    scopeStatus: observed-shape; canonical-format-unselected; pending-owner-review
  - id: media.value.artifact-digest
    name: ArtifactDigest
    meaning: content-integrity-digest-bound-to-algorithm-and-bytes
    observedForms: SHA-256 in Java and TypeScript contracts
    scopeStatus: observed-shape; canonical-multialgorithm-policy-unselected; pending-owner-review
  - id: media.value.byte-count
    name: ByteCount
    unit: byte
    observedForms: byteLength and sizeBytes numeric fields
    scopeStatus: observed-fields; wire-range-parity-pending-owner-review
  - id: media.value.wall-clock-instant
    name: WallClockInstant
    meaning: lifecycle-or-deadline-instant; not-media-or-simulation-time
    observedForms: Java Instant; ISO timestamp; protobuf millisecond timestamps
    scopeStatus: observed-forms; precision-conversion-contract-pending-owner-review
  - id: media.value.duration
    name: Duration
    meaning: interval-bound-to-an-explicit-clock-and-unit
    observedForms: durationMs, duration_ms, Java Duration
    scopeStatus: some-fields-explicitly-milliseconds; other-unit-unknown; pending-owner-review
  - id: media.value.source-pts
    name: SourcePresentationTimestamp
    meaning: exact-position-on-source-stream-time-base
    observedStatus: no shared source-PTS/time-base contract established by the named inputs
    scopeStatus: unresolved; absent-from-scanned-client-contract; do-not-infer-representation
  - id: media.value.sample-position
    name: AudioSamplePosition
    meaning: integer-sample-index-in-identified-audio-stream
    proposedRequiredContext: [sampleRate, sampleFormat, channelLayout, sampleCount, encoderPriming, encoderPadding]
    requiredContextStatus: proposed; unaccepted; pending-owner-review
    sourceRefs: [.product-experience/pdp-0-product-truth/time-units-fidelity.yaml#integerDomains]
    scopeStatus: proposed; pending-owner-review
  - id: media.value.frame-rate
    name: FrameRate
    observedForms: scalar-fps-in-TypeScript-contract; other service-specific frame fields
    scopeStatus: frame-rate-meaning-and-exactness-unresolved; do-not-infer-rational-or-constant-rate
  - id: media.value.pixel-coordinate
    name: PixelCoordinate
    meaning: image-space-value-requiring-origin-reference-dimensions-and-mapping
    observedForm: numeric-x-y-width-height
    scopeStatus: observed-fields-with-incomplete-coordinate-semantics; pending-owner-review
  - id: media.value.physical-quantity
    name: PhysicalQuantity
    meaning: magnitude-with-explicit-dimension-and-unit
    observedStatus: no shared physical-unit registry established by the named inputs
    scopeStatus: unit-and-dimension-unresolved; no-default-unit-selected
  - id: media.value.uncertainty
    name: Uncertainty
    meaning: scoped uncertainty, confidence, limitation, or explicit abstention
    rule: confidence-is-not-correctness; missing-is-not-pass
    scopeStatus: PDP-0-quality-semantics; pending-owner-review
  - id: media.value.classification
    name: MediaClassification
    meaning: sensitivity-classification-with-source-floor-propagated-to-derivatives
    observedForms: Java and TypeScript vocabularies differ
    scopeStatus: vocabulary-crosswalk-unresolved; pending-owner-review
  - id: media.value.policy-disposition
    name: PolicyDisposition
    meaning: independent-outcome-for-named-policy-axis-and-exact-scope
    values: not-enumerated-here
    scopeStatus: PDP-0-policy-owned; pending-owner-review
observedTemporalSpatialFields:
  status: source-field-reconciliation; no-cross-interface-unit-or-coordinate-adapter-accepted
  crossAuditRefs:
    - .product-experience/pdp-0-product-truth/time-units-fidelity.yaml
    - .product-experience/pdp-1-domain-data/interoperability.yaml
    - .product-experience/pdp-1-domain-data/versioning.yaml
    - .product-experience/pdp-1-domain-data/provenance.yaml
    - .product-experience/pdp-2-design-interface-system/media-editing-grammar.yaml
    - .product-experience/pdp-2-design-interface-system/animation-simulation-grammar.yaml
  crossAuditDisposition:
    interoperability: preserve-source-specific-scalar-fps-and-unqualified-coordinate-fields; no-shared-source-PTS-timebase-or-cross-surface-adapter-established
    versioning: no-canonical-artifact-version-record-or-key-observed; job-version-is-not-artifact-version-identity
    provenance: conversion-clock-unit-origin-rounding-and-loss-record-is-proposed; conversion-observation-does-not-qualify-runtime-adapter
    editingAndAnimation: separate-clock-and-accessible-timing-rules-are-authored-proposals; not-source-runtime-guarantees
  sources:
    - id: media.observed-temporal-spatial.legacy-typescript
      source: libs/audio-video-types/src/index.ts
      fields:
        audio:
          fields: [AudioData.durationMs, AudioData.sampleRate, AudioData.channels, AudioData.bitsPerSample]
          observedMeaning: durationMs-name-states-milliseconds; sampleRate-is-a-separate-numeric-field
          unresolved: [sample-format-clock-origin-duration-derivation]
        video:
          fields: [VideoData.durationMs, VideoData.fps, VideoData.width, VideoData.height]
          observedMeaning: durationMs-name-states-milliseconds; fps-is-number; dimensions-are-numeric
          unresolved: [exact-or-rational-frame-rate,-constant-or-variable-frame-rate,frame-origin,coordinate-convention]
        wordTiming:
          fields: [WordTimestamp.start, WordTimestamp.end]
          observedMeaning: numeric-values-without-declared-unit
          unresolved: [unit-clock-origin-interval-endpoint-convention]
        imageGeometry:
          fields: [BoundingBox.x, BoundingBox.y, BoundingBox.width, BoundingBox.height, ImageData.width, ImageData.height]
          observedMeaning: numeric-coordinates-and-dimensions
          unresolved: [coordinate-origin, pixel-centers-or-edges, normalized-or-pixel-space, reference-image-and-clipping]
    - id: media.observed-temporal-spatial.contract-typescript
      source: libs/audio-video-types/src/contracts.ts
      fields:
        transcriptWords: ["TranscriptionResult.words[].startMs", "TranscriptionResult.words[].endMs"]
        synthesis: [SynthesisResult.durationMs]
        providerCapability: [ProviderCapability.maxDurationMs]
        constraints: [startMs/endMs/durationMs/maxDurationMs-are-nonnegative-integers]
        unresolved: [clock-and-origin, interval-semantics, relationship-to-legacy-WordTimestamp-and-protobuf-fields]
      spatialFields: none-observed-in-this-contract-file; legacy-index-ts-bounding-box-is-a-separate-source
    - id: media.observed-temporal-spatial.runtime-java
      source: runtime-contracts/src/main/java/com/ghatana/media/runtime/MediaRuntimeContracts.java
      fields:
        wallClockInstants: [StreamSession.leaseExpiresAt, StreamSession.createdAt, StreamSession.updatedAt, StreamSession.closedAt, StreamFrame.receivedAt]
        duration: StreamSessionRequest.leaseDuration
        sequence: [StreamFrame.sequence, StreamAck.acceptedSequence]
        constraints: [sequence-is-nonnegative-and-is-not-declared-a-media-timestamp, leaseDuration-is-greater-than-zero-and-at-most-one-hour]
        limits: [Instant-fields-do-not-define-media-position-or-monotonic-elapsed-time, sequence-does-not-establish-frame-rate-or-timebase]
    - id: media.observed-temporal-spatial.openapi
      source: contracts/openapi/media.yaml
      fields:
        wallClockDateTime: [ConsentRecord.grantedAt, ConsentRecord.expiresAt, ConsentRecord.revokedAt, PlatformResponseMeta.timestamp, PlatformOperation.createdAt, PlatformOperation.updatedAt, PlatformOperation.completedAt]
        duration: [UploadRequest.retention, StreamSessionRequest.leaseDuration]
        streamSequence: ["POST /api/v1/streams/{sessionId}/frames/{sequence}", StreamAck.acceptedSequence]
        observedFormats: [date-time, duration, nonnegative-int64-sequence]
        unresolved: [OpenAPI-schema-is-permissive-for-StreamSession-and-contains-no-media-PTS-or-coordinate-convention]
    - id: media.observed-temporal-spatial.protobuf-stt
      source: modules/speech/stt-service/src/main/proto/stt_service.proto
      fields:
        durationAndPosition: [AudioChunk.timestamp_ms, Transcription.timestamp_ms, WordTiming.start_ms, WordTiming.end_ms, Interaction.timestamp_ms]
        sampleRate: [TranscribeRequest.sample_rate, AudioChunk.sample_rate]
        declaredUnits: [timestamp_ms/start_ms/end_ms-are-milliseconds, sample_rate-is-separate]
        unresolved: [source-timebase, rounding, clock-origin, interval-endpoint-convention, sample-index-mapping]
    - id: media.observed-temporal-spatial.protobuf-tts
      source: modules/speech/tts-service/src/main/proto/tts_service.proto
      fields: [SynthesizeResponse.sample_rate, SynthesizeResponse.duration_ms, AudioChunk.sample_rate, AudioChunk.timestamp_ms]
      declaredUnits: [duration_ms/timestamp_ms-are-milliseconds, sample_rate-is-separate]
      unresolved: [timestamp-clock-origin, exact-sample-count-mapping, encoder-priming-and-padding]
    - id: media.observed-temporal-spatial.protobuf-vision
      source: modules/vision/vision-service/src/main/proto/vision_service.proto
      fields: [VideoFrameRequest.timestamp_ms, VideoFrameRequest.frame_number, VideoFrameResponse.timestamp_ms, VideoFrameResponse.frame_number, VideoFileRequest.sample_fps, VideoFileResponse.video_duration_ms, VideoFrameDetections.timestamp_ms, VideoFrameDetections.frame_number, BoundingBox.x, BoundingBox.y, BoundingBox.width, BoundingBox.height]
      declaredUnits: [timestamp_ms/video_duration_ms-are-milliseconds, sample_fps-is-integer-frames-per-second]
      unresolved: [frame-number-origin-and-timebase, constant-or-variable-frame-rate, bounding-box-origin-units-and-reference-dimensions]
    - id: media.observed-temporal-spatial.protobuf-multimodal
      source: modules/intelligence/multimodal-service/src/main/proto/multimodal_service.proto
      fields: [VideoAudioRequest.frame_sample_rate, FrameAnalysis.timestamp_ms, CrossModalRequest.analysis_window_ms, CrossModalEvent.timestamp_ms, BoundingBox.x, BoundingBox.y, BoundingBox.width, BoundingBox.height]
      declaredUnits: [analysis_window_ms/timestamp_ms-are-milliseconds, frame_sample_rate-is-an-integer-field-with-no-explicit-rate-unit-comment]
      unresolved: [frame-sample-rate-unit-and-clock-origin, source-timebase, bounding-box-origin-units-and-reference-dimensions]
  nonEquivalences:
    - legacy WordTimestamp.start/end and contract TranscriptionResult.words[].startMs/endMs retain distinct names and unit evidence; no binding or conversion is inferred
    - media durations and positions are distinct from Java/OpenAPI wall-clock Instants and lease/retention Durations
    - frame_number and stream sequence are integer identities/counters, not timestamps or proof of frame rate
    - legacy VideoData.fps, Vision VideoFileRequest.sample_fps, and Multimodal VideoAudioRequest.frame_sample_rate remain separate fields with source-specific declarations
    - Vision and Multimodal BoundingBox numeric x/y/width/height fields do not establish equal coordinate spaces or a shared origin
  canonicalization:
    rational-timebase: unresolved; PDP-0 values remain proposals pending owner and source-contract review
    coordinate-system: unresolved; no handedness, axis, origin, units, transform order, or normalization rule accepted
    profiles-and-conversion: unresolved; no mastering profile, adapter, rounding rule, or runtime qualification established
    external-owner-acceptance: not-established
