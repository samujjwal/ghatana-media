          output mastering.
    - id: media.value.source-frame-sample-mapping
      meaning: Source decode/presentation timestamps and audio sample clocks preserve
        explicit source mapping, discontinuities and conversion loss.
      rules:
        - Keep signed source PTS/DTS in the original positive rational time base,
          stream and immutable artifact version. VFR presentation index resolves
          through the retained explicit frame map, not numeric fps.
        - Audio sample time names the identified stream, exact sample rate, sample
          count, origin and encoder priming/padding. A source recording timestamp
          is not its duration. Last-frame PTS and total duration must follow the
          explicit container/model contract; never guess frameCount/rate or
          (frameCount-1)/rate.
        - Frame indices are zero-based; intervals half-open. Drop-frame timecode
          is UNSUPPORTED unless a versioned adapter specifies supported rates,
          numbering, conversion and round-trip cases. It is not frame dropping or
          inferred from elapsed time.
        - Frame-rate/sample-rate conversion and drift/discontinuity correction
          require a versioned mapping with source/target clocks, selected
          rounding, priming/padding, loss and retained provenance. No implicit
          drift correction or sample insertion/removal.
        - A 24000/1001 source cannot silently become 24 fps. VFR normalization or
          a changed rate creates a new immutable artifact with the original source
          map and explicit conversion report.
      oracle: scripts/lib/media-descriptor-definition-oracles.mjs#inspectSourceFrameTime
      conversionRefs:
        - media.value.rational-media-time
        - media.value.sample-boundary-index
