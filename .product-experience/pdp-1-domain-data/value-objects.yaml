          referenced; appearance is not evidence of collision geometry. Pivot
          operations are explicit transforms, never hidden engine defaults.
        - Keep declared unit dimensions, frame identity, handedness/up/camera
          axes, transform order, quaternion order and serialization explicit.
          Unknown or mismatched conventions deny conversion; silent axis flips or
          degree/radian mixing fail validation.
