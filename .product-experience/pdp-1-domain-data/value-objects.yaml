canonicalConversionDefinitions:
  schemaVersion: media.definition.temporal-spatial-conversion.v1
  status: MEDIA_OWNER_DEFINED; independent-scientific-review-pending
  decisionRef: .product-experience/decision-log.md#PXD-074
  authority: user-delegated Media definition owner; no legacy-wire-unit or runtime-adapter equivalence inferred
  executableModel: scripts/lib/media-temporal-spatial-definition-model.mjs
  verification: tests/media-temporal-spatial-definition-model.test.mjs
  machineContract:
    version: media.definition.temporal-spatial-conversion.v1
    clockKinds: [media, simulation, story]
    tickBits: 64
    timeBaseBits: 64
    sampleRateBits: 32
    sampleCountBits: 64
    imageDimensionBits: 32
    rounding: [exact, floor, ceil, nearest-ties-even]
    pixelConvention: 'pixel-boundary; top-left; right-down'
    pixelCenterConvention: 'pixel-center-index; top-left; right-down; normalized=(index+1/2)/dimension'
    units: [m, cm, mm, km, s, ms, us, ns]
    qualification: NOT_EVALUATED
  profileApplicability:
    exact-rational-media: identified media/source stream PTS with explicit positive rational seconds per tick
    exact-rational-simulation-story: explicit identified simulation or story clock; never implicitly aligned to media or wall clock
    audio-sample-boundary: identified stream with explicit integer sample rate and sample count; priming/padding mapping is a separate qualified contract
    image-pixel-boundary: exact image version and dimensions; top-left origin, right/down axes; coordinates name pixel boundaries, not pixel centers
    image-pixel-center: exact image version and dimensions; top-left origin, right/down axes; zero-based rational center index maps to normalized (index+1/2)/dimension; never silently substitute a boundary coordinate
    scalar-SI-length-time: declared m/cm/mm/km or s/ms/us/ns dimension; other units require an explicit owner extension
  records:
    - id: media.value.rational-media-time
      representation: clockKind(media|simulation|story), clockId, streamId, signed-64-bit integer ticks, positive signed-64-bit numerator/denominator seconds-per-tick
      convention: Reduced rational arithmetic with exact BigInt intermediates; destination ticks checked against signed-64-bit range before exposure.
      conversionPreconditions: Source and target clock kind, clock ID and stream ID match; cross-clock or cross-stream mapping requires an explicit alignment contract.
      rounding: Caller selects exact, floor, ceil or nearest-ties-even; missing method denied even for exact values.
      loss: Exact signed discardedTicks and discardedSeconds; lossless only if discardedTicks is zero. Negative timestamps use mathematical floor/ceil.
      failClosed: Reject unknown units/clocks, Number scalar inputs, zero/negative time bases, cross-clock inference, unspecified rounding and destination overflow.
      qualifications: Unit arithmetic is definition-level; clock accuracy, drift, alignment, decoder/provider timing and scientific fidelity remain NOT_EVALUATED.
    - id: media.value.sample-boundary-index
      representation: Nonnegative integer boundary in [0,sampleCount], explicit sampleRate in [1,2^32-1], sampleCount at most 2^63-1.
      convention: Intervals are half-open. sampleCount is the end boundary, not an addressable sample; sample indices are [0,sampleCount).
      conversion: Convert the same identified clock/stream using timeBase 1/sampleRate and explicit rounding; no hidden encoder priming or padding correction.
      loss: Preserve the rational-time loss record; reject negative/out-of-range boundary or implicit numeric sample rate.
    - id: media.value.image-pixel-boundary
      representation: Exact rational x/y boundaries, imageVersionId, positive integer width/height at most 2^32-1, origin top-left, axes right-down.
      convention: x in [0,width], y in [0,height]; normalized x/width and y/height in [0,1]. Half-open rectangle end boundaries may equal width/height.
      conversion: Exact rational normalize/denormalize under the same image version and dimensions; no implicit rotate, crop, pixel-aspect, center/boundary or origin conversion.
      failClosed: Reject stale image version, missing origin/axes/dimensions and outside-image coordinates. Transformations require a separate explicit image-version mapping.
      qualifications: Exact coordinate arithmetic does not establish a camera calibration, spatial world frame or qualified vision geometry.
    - id: media.value.dimensioned-scalar
      representation: Exact rational magnitude plus selected unit and dimension.
      conversion: SI decimal length/time scaling is exact; target must have same dimension. Missing/unknown units and dimension mismatches are denied.
      exclusions: degrees/radians, arbitrary physical units, vector frames and simulation validity are not silently inferred by the scalar converter.
    - id: media.value.image-pixel-center
      representation: Exact rational zero-based x/y center index, imageVersionId, positive integer width/height at most 2^32-1, origin top-left, axes right-down.
      convention: Index zero names the first pixel center; index width-1/height-1 names the last. Rational subpixel indices remain within this center extent. Normalized coordinates are (index+1/2)/dimension; a one-pixel axis maps its only center to 1/2.
      conversion: Exact rational normalize/denormalize under the same image version and dimensions with an explicit center convention. Center and boundary converters reject each other's serialized convention; no implicit crop, rotate, axis or image-version transformation.
      failClosed: Reject outside-center-extent values, normalized border zero/one, stale image version/dimensions and missing or incompatible coordinate conventions. No silent clipping.
      qualifications: Definition arithmetic only; legacy wire bindings, camera calibration and vision geometry remain unqualified.
  proofBoundary:
    definitionOracles: rational cadence, long-duration round trip, inexact signed loss, ties-even, overflow, ambiguous clock, stale geometry, bounds and dimension-denial cases
    independentReview: P1-09-qualified-domain-expert-pending
    runtimeAdapterAdmission: NOT_EVALUATED
    scientificQualification: NOT_EVALUATED

