          owner-reviewed mapping. TutorPutor illustrative through empirically
          calibrated tiers are its authority; a photorealistic render cannot
          become scientifically validated. Visual LOD changes cannot lower the
          model fidelity.
    - id: media.value.replay-provenance-definition
      meaning: Every replay claim names source/output and exact execution provenance,
        class, qualified envelope and bounded predicate.
      schema:
        type: object
        additionalProperties: false
        required:
          - sourceVersionRefs
          - outputVersionRefs
          - executionProvenanceVersionRef
          - replayClass
          - methodAndScopeVersionRef
          - qualifiedEvidenceRef
        properties:
          sourceVersionRefs:
            type: array
            minItems: 1
            maxItems: 1024
            uniqueItems: true
            items: *a3
          outputVersionRefs:
            type: array
            maxItems: 1024
            uniqueItems: true
            items: *a3
          executionProvenanceVersionRef: *a3
          replayClass:
            enum:
              - EXACT_ENVIRONMENT
              - TOLERANCE_BOUND
              - STATISTICAL
              - REPLAY_UNAVAILABLE
          methodAndScopeVersionRef: *a3
          qualifiedEvidenceRef:
            oneOf:
              - type: object
                additionalProperties: false
                required:
                  - status
                  - value
                properties:
                  status:
                    const: KNOWN
                  value: *a3
              - type: object
                additionalProperties: false
                required:
                  - status
                  - reason
                properties:
                  status:
                    const: UNKNOWN
                  reason:
                    type: string
                    minLength: 1
                    maxLength: 512
                    pattern: \S
              - type: object
                additionalProperties: false
                required:
                  - status
                  - reason
                properties:
                  status:
                    const: NOT_APPLICABLE
                  reason:
                    type: string
                    minLength: 1
                    maxLength: 512
                    pattern: \S
        allOf:
          - if:
              properties:
                replayClass:
                  enum:
                    - EXACT_ENVIRONMENT
                    - TOLERANCE_BOUND
                    - STATISTICAL
              required:
                - replayClass
            then:
              properties:
                qualifiedEvidenceRef:
                  type: object
                  additionalProperties: false
                  required:
                    - status
                    - value
                  properties:
                    status:
                      const: KNOWN
                    value:
                      type: string
                      minLength: 1
                      maxLength: 384
                      pattern: \S
      rules:
        - Capture source/output versions and exact execution environment,
          engine/model/runtime/hardware/library versions, configuration, assets,
          seed and output representation. A seed alone is not replay evidence.
        - TOLERANCE_BOUND names numeric/geometric/perceptual/timing metrics,
          metric versions, units, tolerances, scope and measurement methods. A
          deviation is acceptable only within that exact named bound.
        - EXACT_ENVIRONMENT, solver-state replay, render replay and encoded-byte
          identity are distinct claims with separately qualified scope.
          Statistical replay requires its repeated-sample protocol and acceptance
          bounds.
        - If qualified evidence is missing or unknown, report REPLAY_UNAVAILABLE
          or unresolved fidelity; retain provenance without advertising
          deterministic replay.
