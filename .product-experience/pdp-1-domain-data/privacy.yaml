ownerDefinedPdp10Boundary:
  decisionId: MEDIA-OWNER-2026-10-08-PDP1-10-PRIVACY-BOUNDARY-01
  authority: user-delegated-Media-semantic-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
  sourceRefs:
  - .product-experience/pdp-0-product-truth/policy-authority-model.yaml#productPolicy
  - .product-experience/pdp-1-domain-data/authority.yaml#ownerDefinedPdp10AuthorityScopes
  - .product-experience/pdp-1-domain-data/domain-objects.yaml#canonicalIdentityAdjudication
  - .product-experience/pdp-1-domain-data/states.yaml#stateMachines
  scopeStatus: OWNER_DEFINED_SOURCE_POLICY; enforcement, provider and security review remain pending
  identity:
    requiredTrustedContext:
    - tenantRef
    - principalRef
    - delegationRef
    - workspaceRef
    - identityEpoch
    - issuedAt
    - expiresAt
    callerControlledIdentityFields:
    - tenantId
    - principalId
    - delegation
    - workspaceAuthority
    disposition: Reject caller-supplied identity authority; resolve resource only within host-attested tenant/workspace and exact owner principal scope; unknown or mismatch is DENY.
  effectBoundary:
    recheckBefore:
    - provider dispatch
    - durable artifact registration
    - external disclosure
    - delivery or publication
    - consent/right restriction changes
    - erasure finalization
    required:
      identityEpoch: must match current trusted host epoch
      policyDecision: current and scoped to exact operation, resource version, purpose and destination
      rights: source rights and derived-use scope permit exact operation
      consent: verified ACTIVE and matching subject, purpose, region and operation when required by the leaf
      profile: exact versioned profile and provider retention/locality constraints known
      audit: required audit intent durably accepted before external effect
    unknownRule: DENY new effect or return UNKNOWN_OUTCOME only after a dispatch boundary was crossed; never treat an unavailable authority as approval
  tenantIsolation:
    lookupKey: tenantRef plus exact domain object identity; owner principal additionally required for owner-private drafts and sessions
    crossTenantRead: DENY without an explicit source-defined shared grant from current trusted authority
    crossTenantWrite: DENY; no global fallback; do not reveal whether another tenant owns the identifier
  classificationAndDisclosure:
    inheritance: Derived observations and artifacts retain the source sensitivity floor unless an authorized, evidenced declassification decision applies.
    logs: Exclude raw media, prompt, transcript, biometric and credentials; record minimized opaque refs, outcome class and policy decision reference.
    providerRetention: Unknown provider retention is ineligible when the selected policy requires bounded/no retention.
    locality: Private does not imply local; unknown locality cannot satisfy a local-only or residency restriction.
  consentRevocation:
    futureDispatch: Block new governed dispatch at the next effect boundary after revocation.
    inFlight: Record affected exact job/session/effect identities and reconcile; cancellation, provider stop, recall and deletion are separate outcomes.
    unknownProviderOutcome: Keep effect finality UNKNOWN until an authoritative observer resolves it; never claim revocation recalled already disclosed data.
  retentionAndErasure:
    accessRevocation: Immediately deny new reads/uses under revoked authority; this is not physical deletion.
    erasureStates:
    - REQUESTED
    - ACCESS_RESTRICTED
    - DELETION_PENDING
    - PARTIALLY_ERASED
    - ERASURE_CONFIRMED
    - ERASURE_BLOCKED_BY_HOLD
    - ERASURE_OUTCOME_UNKNOWN
    confirmRule: ERASURE_CONFIRMED requires all declared primary, replica, backup, cache, export and provider scopes to return owner-authoritative deletion evidence; absent scope evidence keeps result partial or unknown.
    legalHold: A current legal hold blocks physical purge for its exact scope and duration but grants no processing or disclosure authority; expose a hold-blocked disposition.
    partialErasure: Retain per-copy completion and unresolved scope; do not collapse partial deletion to confirmed erasure.
  duplicateEffectPrevention:
    identity: tenantRef + principalRef + canonical operationRef + caller requestId + server-computed canonical request digest
    sameRequest: Return the same durable receipt or perform no second effect.
    sameKeyDifferentDigest: Reject with IDEMPOTENCY_CONFLICT.
    ambiguousOutcome: Reconcile the same request identity with authoritative effect owner before retry; no blind replay.
    providerWithoutReplayProtection: Do not automatically repeat a consequential external effect.
  nonClaims:
  - This definition does not assert implementation, provider-side deletion, authorization integration, storage-wide inventory, qualified policy enforcement, or independent review.
