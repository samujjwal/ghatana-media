  externalConsumerAuthority:
    status: unresolved
    requiredEvidence:
      - owner-defined-reference-identity-and-version-meaning
      - published-consumer-contract-and-immutable-package-or-schema-identity
      - compatibility-and-round-trip-fixtures-for-each-named-consumer
