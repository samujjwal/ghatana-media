      exactLookup:
        method: GET
        operationId: getStreamEvent
        scope: [trustedTenant, streamId, eventId]
        requiredAuthority: Authenticated Shared Event Plane reader with `event-plane:event:read`, bound to the exact trusted tenant; lookup authority is distinct from the Media publisher authority.
        authorityRef: ../ghatana/services/event-plane/contracts/openapi/event-plane.yaml#/paths/~1api~1v1~1streams~1{streamId}~1events~1{eventId}/get/x-ghatana-security
