      id: media.event-dependency-review.event-plane-retry-reconciliation.v1
      owner: Shared Event Plane
      status: PENDING_SHARED_CONTRACT_RECONCILIATION
      exactQuestion: Reconcile the public append operation's explicit no-automatic-retry declaration with EVT-EXACT-LOOKUP-001's same-caller-ID-across-retries requirement.
      requiredContractEvidence:
      - Versioned public append contract states whether same tenant, stream, eventId, and canonical payload may be retried after timeout without duplicating the event.
      - Exact lookup contract states whether 200 and 404 are current/complete for this tuple, exposes enough typed fields to compare the full event intent, and specifies stale, partial, and unavailable outcomes.
      - Contract test demonstrates crash-after-append-before-receipt, same-ID/same-payload retry or exact lookup reconciliation, same-ID/different-payload conflict, cross-tenant isolation, and incomplete lookup behavior.
      - Published schema version and owner approval identify the required caller and response fields; no private runtime/bootstrap route substitutes for the public contract.
      MediaDispositionUntilClosed: Keep ambiguous append UNKNOWN, retain outbox intent, and do not automatically repeat POST. Do not claim delivery, replay safety, or at-least-once delivery as established runtime behavior.
    mediaOutbox:
      requiredPattern: Media state transition and immutable minimized event intent commit atomically in the same Media-owned persistence transaction.
      eventIdentity: One stable eventId and canonical payload fingerprint per committed transition; retries preserve both exactly; same eventId with different fingerprint is EVENT_ID_CONFLICT.
      ordering: Aggregate version is strictly increasing and checked within (trustedTenant, aggregateType, aggregateId); gaps are buffered or reconciled, never silently reordered into a global clock.
      privacy: Store and transmit only each exact event schema's allowed fields; never place raw media, prompts, transcripts, credentials, biometric templates, or rights-document contents in the outbox or event payload.
      dispatch: Dispatch only after the aggregate commit and matching outbox intent are durable. A crash before commit emits nothing; a crash after commit leaves a recoverable intent; an ambiguous external append is not discarded or replayed blindly.
      replay: At-least-once delivery is a target only after the dependency contract permits safe reconciliation. Duplicate same-ID/same-fingerprint observations are idempotent; same-ID/different-fingerprint, cross-tenant scope, stale aggregate version, and unknown event versions fail closed.
      partialFailureOutcomes:
      - { condition: aggregate-transaction-aborts, disposition: NO_EVENT_AND_NO_OUTBOX_INTENT }
      - { condition: aggregate-and-outbox-commit-succeeds-before-dispatch, disposition: OUTBOX_PENDING }
      - { condition: append-returns-exact-current-receipt, disposition: EVENT_PLANE_ACCEPTED }
      - { condition: append-timeout-or-ambiguous-response, disposition: UNKNOWN_RECONCILE_EXACT_LOOKUP, automaticAppendRetry: FORBIDDEN }
      - { condition: lookup-is-stale-incomplete-unavailable-or-not-found-without-authoritative-currentness, disposition: UNKNOWN_RETAIN_OUTBOX_INTENT }
      - { condition: lookup-exactly-matches-tenant-stream-event-and-payload-fingerprint, disposition: RECONCILED_ACCEPTED }
      - { condition: lookup-or-receipt-crosses-tenant-or-conflicts-with-event-intent, disposition: UNKNOWN_QUARANTINE_AND_ESCALATE }
