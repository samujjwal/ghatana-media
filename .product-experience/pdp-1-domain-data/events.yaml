  - id: media.event-contract.media-job-accepted
    eventType: media.job.accepted
    eventVersion: 1.0.0
    producer:
      identity: MediaRuntime#submitJob
      sourceRef: launcher/src/main/java/com/ghatana/media/launcher/MediaRuntime.java#L1153-L1164
      ownerRule: Only the exact persisted state transition listed by this contract may publish; transaction receipt/outbox append precedes dispatch.
    delegatedTechnicalOwnerDecision:
      id: media.event-contract.media-job-accepted.atomic-outbox-owner-decision.v1
      authority: accepted-delegated-Media-technical-owner-decision; not-independent-review-or-Shared-owner-signature
      decision: >-
        Emit exactly one canonical media.job.accepted v1.0.0 outbox intent when the submit-job operation commits a new
        ACCEPTED processing-job revision. Bind eventId to `media:media.job.accepted:{jobId}:{aggregateVersion}`, take
        occurredAt from that committed job record's createdAt, and use the exact payload {jobId, operationRef:
        media.operation-slice.submit-job, admissionState: ACCEPTED}. Persist the canonical V016 intent in the same
        transaction as the job row. Continue the existing V011 append and its Shared publication ownership as a
        distinct legacy compatibility channel. V016 alone carries this canonical Event Plane event; this decision
        authorizes no V011 cutover, equivalence, forwarding, deletion, replay, or quarantine. A matching idempotent submit replay returns the
        committed job and does not create another outbox row; a pre-existing accepted job without a V016 intent is not
        backfilled by replay and remains noncanonical. The event classification is max(INTERNAL, source artifact
        classification) under PUBLIC < INTERNAL < CONFIDENTIAL < RESTRICTED; PUBLIC therefore maps to INTERNAL, higher
        classifications are preserved, and missing/unrecognized values fail closed before commit.
        The Shared relay is fact transport authorized as its own host workload; it does not act as the submitting
        user. Shared `subjectId` is an opaque transport partition key only and never authenticates or authorizes a
        consumer/user effect. An actor-scoped or delegated consumer effect requires a separately host-resolved
        Kernel `principalRef` bound to the trusted tenant and authenticated principal. Missing, untrusted, or
        tenant-mismatched `principalRef` leaves that consumer effect UNKNOWN with no effect; it does not block or
        imply authorization for canonical fact transport.
      rationale: The accepted-job contract is a minimal statement of committed admission, while the source artifact classification remains a lower bound for disclosure. V016 is the current relay source; V011 is retained historical data and has a different payload identity.
      negativeAcceptanceCases:
        - direct-parallel-media-job-accepted-publication
        - forward-or-delete-legacy-V011-row
        - publish-terminal-or-cancellation-event-under-this-decision
        - infer-operationRef-from-jobType-or-provider
        - include-artifactId-providerId-jobType-or-unlisted-payload-field
        - eventId-not-bound-to-committed-jobId-and-version
        - occurredAt-not-equal-to-committed-job-createdAt
