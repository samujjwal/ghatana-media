    "SOURCE_GUARDS_USE_UPLOAD_BOUNDS_AUTHORITY_AND_INTEGRITY_NOT_JOB_FENCE": "The machine guard vocabulary has no job lease fence; it retains upload authority and integrity checks."
    "NO_DESTINATION_DELIVERY_ACK_STATE": "The machine contains no destination acknowledgment state."
    "SESSION_GUARD_REQUIRES_CURRENT_PROVIDER_BINDING_AND_PER_EFFECT_CHECK": "The exact stream transition guard rechecks current provider binding, lease, sequence and consent per effect."
    "FRAME_EFFECT_MAY_BE_ACTIVE_AT_DRAIN_OR_PROCESS_DEATH": "Active frame effects can remain in flight while the session drains; confirm or record unknown."
