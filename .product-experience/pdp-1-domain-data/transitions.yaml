ownerRaceResolutionContract:
  id: media.pdp1.job-attempt-race-resolution.v1
  authority: user-delegated-Media-product-semantic-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
  sourceRefs:
    - .product-experience/pdp-1-domain-data/states.yaml#stateMachines[media-job]
    - .product-experience/pdp-1-domain-data/states.yaml#stateMachines[media-attempt]
    - .product-experience/pdp-1-domain-data/transitions.yaml#transitionRecords
    - .product-experience/pdp-1-domain-data/operations.yaml#ownerDefinedOperationContracts
    - .product-experience/pdp-1-domain-data/domain-objects.yaml#ownerTypedIdentityContracts
  status: OWNER_DEFINED_DEFINITION_ONLY; independent-review-open; runtime-observation-UNKNOWN; provider-qualification-NOT_EVALUATED
  authoritySemantics: "The model specifies the only safe interpretation of owner state facts; it does not claim that a store, process, provider or delivery destination implements these atomicity and evidence requirements."
  invariants:
    - {"id":"media.pdp1.invariant.current-fence-only","rule":"A mutating attempt result may change canonical job, artifact, or delivery state only when its attempt identity and fencing token equal the current durable lease tuple.","denial":"Stale or absent fence cannot publish output, advance job finality, or overwrite a newer attempt; retain the last authoritative state and report conflict or unknown."}
    - {"id":"media.pdp1.invariant.unknown-is-not-final","rule":"OUTCOME_UNKNOWN is nonterminal and cannot be projected as success, failure, cancellation, or delivery acknowledgment without authoritative evidence bound to the exact job/attempt/request."}
    - {"id":"media.pdp1.invariant.dispatch-intent-before-crossing","rule":"Before crossing a provider or destination effect boundary, persist request fingerprint, unique attempt identity, current fence, and dispatch intent; absent durable intent, no external dispatch is authorized."}
    - {"id":"media.pdp1.invariant.no-blind-redispatch","rule":"If an effect may have crossed its boundary and outcome evidence is missing, do not dispatch a duplicate effect; reconcile by exact idempotency identity or retain OUTCOME_UNKNOWN."}
    - {"id":"media.pdp1.invariant.cancel-request-not-finality","rule":"A cancellation request records intent only. CANCELLED or CANCEL_CONFIRMED requires evidence that the relevant execution can no longer commit an effect, or that all possible effects and their disposition have been reconciled."}
    - {"id":"media.pdp1.invariant.retry-fenced-and-bounded","rule":"A retry requires a classified retryable prior result, remaining declared retry budget, no unresolved possible effect from the prior attempt, fresh attempt identity, and strictly greater fence; otherwise retain UNKNOWN or deny."}
    - {"id":"media.pdp1.invariant.delivery-needs-destination-ack","rule":"A delivery is acknowledged only by a destination receipt bound to exact output version, destination, and request; a local send completion or missing response is not destination acknowledgment."}
