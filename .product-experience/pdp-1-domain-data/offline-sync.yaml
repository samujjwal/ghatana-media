ownerDefinedOfflineSemantics:
  decisionId: MEDIA-OWNER-2026-10-08-PDP1-10-OFFLINE-01
  authority: user-delegated-Media-semantic-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
  sourceRefs:
  - .product-experience/pdp-3-product-experience/journey-contracts/work-locally-and-reconcile-after-reconnect.yaml
  - .product-experience/pdp-1-domain-data/privacy.yaml#ownerDefinedPdp10Boundary
  - .product-experience/pdp-1-domain-data/versioning.yaml#ownerDefinedRevisionSemantics
  - .product-experience/pdp-1-domain-data/operations.yaml#individualOperationContracts
  scopeStatus: OWNER_DEFINED_PRODUCT_SEMANTICS; offline capability admission and device-security review pending
  allowedDisconnectedWork:
  - read-only inspection of an exact immutable version already present in an authorized local cache, subject to current local policy and expiry
  - session-local draft editing against an exact retained source/version snapshot; the draft is not a canonical artifact or accepted project revision
  prohibitedDisconnectedEffects:
  - durable project revision mutation
  - job submission, retry or cancellation command
  - provider dispatch or stream frame send/reconnect
  - artifact registration, export, delivery or publication
  - consent/right grant or revocation
  - retention or erasure finalization
  - any operation whose current authority, rights, retention, locality or idempotency cannot be checked
  queuePolicy: No consequential command is queued for automatic replay. A locally captured user intent is an inert draft until explicit reconnect-time review and submission.
  reconnectProtocol:
  - authenticate tenant, principal, delegation and workspace through a current trusted host observation; user-supplied identity, role, delegation or consent booleans never authorize lookup or effect
  - re-resolve exact artifact/project/job/session identifiers within the same tenant and current access scope
  - recheck current consent, rights, policy, locality, retention, legal hold and profile from their authoritative owners before each effect; missing, stale or mismatched observations deny the new effect
  - bind consent and rights decisions to the exact immutable source/subject version and current authority version; a latest alias, digest, job version or user assertion cannot substitute
  - compare every expected canonical source/project revision and typed parent-version edge; stale values produce CONFLICT, as does changed ancestry
  - show the local draft and remote version separately; never auto-merge or last-write-wins
  - submit only a new explicit request with a fresh idempotency identity after user confirmation when a consequential effect is requested; confirmation records intent and is not itself authority
  idempotencyGuard:
    scope: exact trusted tenant and principal, canonical operation and version, requestId, and server-computed canonical payload digest
    sameIdentitySameDigest: Return the same durable receipt or perform no second effect.
    sameIdentityDifferentDigest: Reject as IDEMPOTENCY_CONFLICT without mutation or effect.
    ambiguousOutcome: Reconcile the same request identity and digest with the authoritative operation/effect owner before retry; absent a current trusted owner observation, preserve UNKNOWN_OUTCOME and prohibit blind replay.
    unprotectedExternalEffect: Never automatically replay a consequential provider effect lacking authoritative replay protection.
  ambiguousSubmission: Lookup/reconcile the same requestId and canonical payload digest with the authoritative operation owner before any retry; if no authoritative observer exists, retain UNKNOWN_OUTCOME and require human resolution.
  offlineDataProtection: No local persistence, encryption-at-rest, key management, eviction, cache retention or background execution is claimed by this product definition; a deployment must qualify those controls before enabling cached/offline work.
  nonClaims:
  - No durable offline command queue
  - No automatic background synchronization
  - No cross-device merge
  - No runtime reconnect or upload-resume guarantee
