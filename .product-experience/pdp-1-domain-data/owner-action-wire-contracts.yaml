relatedOperationCoverage:
  - actionRef: media.action.request-cancellation
    sourceActionRef: .product-experience/pdp-3-product-experience/action-registry.yaml#actions/@id=media.action.request-cancellation
    operationRef: media.operation-slice.cancel-job
    sourceOperationRef: .product-experience/pdp-1-domain-data/operations.yaml#individualOperationContracts/records/@id=media.operation-slice.cancel-job
    sourceOwnerDefinitionRef: .product-experience/pdp-1-domain-data/operations.yaml#individualOperationContracts/records/@id=media.operation-slice.cancel-job/ownerDefinition
    actorRefs:
      - media.creator
      - media.editor
      - media.operator
    requestedMeaning: SUCCEEDED acknowledges only the durable cancellation-request record or an already-terminal-job
      observation; the request may move an attempt to CANCEL_REQUESTED after durability, but does not confirm stop.
    confirmedStopMeaning: A stop is confirmed only by authoritative finality evidence that no further effect can occur; a
      cancellation request, returned projection, detach, timeout, or provider acknowledgement alone is not that
      evidence.
    unknownMeaning: UNKNOWN_OUTCOME remains unknown; inspect the same job and attempt evidence, reconcile the same request
      identity before resubmission, and never automatically retry after lost acknowledgement.
    noReversalMeaning: Cancellation is not reversal, remote recall, provider stop, or rewriting terminal history; preserve
      the current or unknown state until authoritative evidence.
    idempotency: tenantId-plus-principalId-plus-jobId-plus-requestId; matching-replay-returns-the-same-request-record;
      payload-mismatch-conflicts
    retry: same-request-reconciliation-before-resubmission; no-automatic-retry-after-lost-ack
    negativeCases:
      - cross-tenant-cancel
      - wrong-principal
      - stale-job-version
      - lost-ack-blind-repeat
      - request-as-cancelled-finality
      - unknown-dispatch-treated-as-no-effect
      - running-provider-treated-as-stopped
      - cancellation-after-completed-rewrites-terminal-history
