    type: object
    additionalProperties: false
    required:
      - snapshotId
      - artifactVersionRefs
      - snapshotDigest
      - projectBacked
    properties:
      snapshotId:
        type: string
        minLength: 1
        maxLength: 256
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,255}$
      artifactVersionRefs:
        type: array
        items:
          oneOf:
            - $ref: "#/$defs/canonicalReferences/media_domain_artifact-version"
        minItems: 1
      projectBacked:
        type: boolean
      projectRevisionRef:
        oneOf:
          - $ref: "#/$defs/canonicalReferences/media_domain_project-revision"
      snapshotDigest:
        type: string
        pattern: ^sha256:[a-f0-9]{64}$
    if:
      required:
        - projectBacked
      properties:
        projectBacked:
          const: true
    then:
      required:
        - projectRevisionRef
  boundedPreferenceValue:
    oneOf:
      - type: "null"
      - type: boolean
      - type: number
      - type: string
        maxLength: 4096
      - type: array
        maxItems: 128
        items:
          $ref: "#/$defs/boundedPreferenceValue"
      - type: object
        maxProperties: 128
        propertyNames:
          maxLength: 128
        additionalProperties:
          $ref: "#/$defs/boundedPreferenceValue"
