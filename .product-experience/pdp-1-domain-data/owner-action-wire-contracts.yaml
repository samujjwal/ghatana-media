definitions:
  description: Closed JSON Schema definitions for action request/result envelopes. Trusted principal, tenant and
    authority are assembled out of band; raw legacy JSON is never a canonical action result.
$defs:
  canonicalReferences:
    media_domain_project:
      type: object
      additionalProperties: false
      required:
        - objectType
        - identity
      properties:
        objectType:
          const: media.domain.project
        identity:
          type: object
          additionalProperties: false
          required:
            - tenantId
            - projectId
          properties:
            tenantId:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
              minLength: 1
              maxLength: 128
            projectId:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
              minLength: 1
              maxLength: 128
    media_domain_project-revision:
