# Individual HTTP/runtime source slices. Exact bounded decisions are per record;
# no family-wide approval or cross-interface equivalence is inferred.
individualOperationContracts:
  status: source-bounded-proposals; media-owner-review-and-independent-P0-010-pending
  crossInterfaceEquivalence: unresolved; same or similar names across HTTP, SDK, CLI, gRPC, and runtime do not establish one operation
  records:
    - id: media.operation-slice.begin-upload
      sourceOperation: beginMediaUpload
      sourceRef: contracts/openapi/media.yaml#/paths/~1api~1v1~1artifacts~1uploads/post
      runtimeRef: runtime-contracts/src/main/java/com/ghatana/media/runtime/MediaRuntimeContracts.java#MediaArtifactStore.begin
      requestFields: [tenantId, principalId, fileName, contentType, expectedSizeBytes, expectedSha256, classification, retention, metadata]
      sourceBounds: >-
        Runtime constructor requires tenant/principal, filename, content type,
        positive expected size, SHA-256, classification, and retention in the
        1 ms–3650 day range. HTTP requires authenticated OPERATOR access and tenant
        context, policy and audit; declares idempotency scoped to tenantId|uploadRequest
        with payload hash. HTTP 201 returns an open UploadSession.
      authority: requester identity and tenant are source fields; actual identity, policy, and storage authority remain host-owned and unresolved.
      preconditions: input validation and current tenant authorization; declared HTTP policy check; no proof of byte receipt or artifact availability.
      finality: successful response establishes only an upload-session receipt; upload completion and artifact verification are separate operations.
      implementationDiscrepancies:
        - Declared HTTP Idempotency-Key/payload binding is not implemented; local and PostgreSQL begin currently allocate a new session on every call. Key transmission is not replay admission.
      sdkWireObservation: Existing createUploadSession uses the actual runtime route/body/DTO and configured tenant/principal; full command authority and create replay remain unqualified.
      negativeCases: [missing-or-wrong-tenant, invalid-size-or-digest, expired-or-invalid-retention, duplicate-idempotency-key-with-different-payload, treat-session-receipt-as-artifact]
      status: proposed-local-source-contract
    - id: media.operation-slice.append-upload-chunk
      sourceOperation: appendMediaChunk
      sourceRef: contracts/openapi/media.yaml#/paths/~1api~1v1~1artifacts~1uploads~1{uploadId}~1chunks~1{chunkIndex}/put
      runtimeRef: runtime-contracts/src/main/java/com/ghatana/media/runtime/MediaRuntimeContracts.java#MediaArtifactStore.append
      requestFields: [tenantId, principalId, uploadId, chunkIndex, bytes]
      sourceBounds: >-
        HTTP chunkIndex is an integer >= 0 and body is binary; runtime store takes
        tenantId/principalId/uploadId/index/bytes. HTTP requires authenticated OPERATOR access,
        tenant context, policy and audit. No replay-safe idempotency is declared;
        clients must not automatically retry. HTTP exposes 400 and 409.
      authority: tenant and owning principal are checked at the upload mutation boundary under the local upload lock or PostgreSQL locked row; trusted principal authentication and permission remain host-owned.
      preconditions: upload exists for tenant, chunk index accepted by source store, and session permits append; no canonical ordering/duplicate-chunk rule is established here.
      finality: updated upload-session receipt reports observed bytesReceived/nextChunkIndex/status; it does not establish complete bytes or artifact availability.
      negativeCases: [negative-chunk-index, wrong-tenant-or-unknown-upload, conflicting-chunk-replay, automatic-retry-after-lost-ack, treat-chunk-ack-as-completed-artifact]
      status: proposed-local-source-contract
    - id: media.operation-slice.complete-upload
      sourceOperation: completeMediaUpload
      sourceRef: contracts/openapi/media.yaml#/paths/~1api~1v1~1artifacts~1uploads~1{uploadId}~1complete/post
      runtimeRef: runtime-contracts/src/main/java/com/ghatana/media/runtime/MediaRuntimeContracts.java#MediaArtifactStore.complete
      requestFields: [tenantId, principalId, uploadId]
      sourceBounds: >-
        HTTP requires authenticated OPERATOR access and tenant context, policy and
        audit; declares payload-hash idempotency scoped to tenantId|uploadId|contentHash.
        HTTP 201 describes a checksum-verified artifact and 409 conflict. Runtime
        complete returns MediaArtifact, whose constructor requires tenant/principal,
        artifactId, positive size, SHA-256, objectReference, classification, and expiry.
      authority: tenant and owning principal are checked before the locked finalization claim; principal-less legacy mutation fails closed. Trusted identity, storage and policy qualification remain host-owned.
      preconditions: source upload state and integrity must permit completion; exact missing-byte/quarantine rules are not specified by these source contracts.
      finality: returned artifact is source-described checksum-verified and references opaque storage; it does not prove downstream job use, rights clearance, or delivery.
      implementationDiscrepancies:
        - Declared payload-hash idempotency has no request key/body binding. PostgreSQL returns the same artifact for a completed upload, while the local store rejects repeat completion; provider parity remains open.
      sdkWireObservation: Existing completeUploadSession sends a bodyless request to the actual runtime path and parses exact artifact observation; it grants no replay authority.
      negativeCases: [wrong-tenant-or-unknown-upload, incomplete-or-digest-mismatch, conflicting-completion, equate-storage-reference-with-public-availability, infer-rights-from-upload]
      status: proposed-local-source-contract
    - id: media.operation-slice.inspect-upload
      sourceOperation: getMediaUpload
      sourceRef: contracts/openapi/media.yaml#/paths/~1api~1v1~1artifacts~1uploads~1{uploadId}/get
      runtimeRef: runtime-contracts/src/main/java/com/ghatana/media/runtime/MediaRuntimeContracts.java#MediaArtifactStore.upload
      requestFields: [tenantId, principalId, uploadId]
      sourceBounds: HTTP authenticated OPERATOR and tenant context; read-only governance metadata says no policy check and no audit; 200 returns UploadSession, 404 error. Runtime lookup is Optional and tenant-scoped.
      authority: Media defines tenant/owning-principal read semantics; runtime filters by principal after tenant-scoped store lookup. Trusted transport identity remains Shared/host-owned and production-unqualified.
      preconditions: caller supplies upload identity under current tenant context.
      finality: response is a time-scoped upload-session observation, not an artifact or completion proof.
      negativeCases: [cross-tenant-lookup, treat-stale-session-as-current, infer-artifact-existence-from-session, treat-404-as-global-nonexistence]
      status: accepted-bounded-read-semantics; independent-phase-review-and-runtime-qualification-open
      ownerDecisionRef: .product-experience/decision-log.md#PXD-040
      operationKind: QUERY
      contractVersion: 1
      resourceScope: tenant-and-owning-principal
      wireBinding:
        method: GET
        operationId: getMediaUpload
        handlerRef: launcher/src/main/java/com/ghatana/media/launcher/MediaHttpHandler.java#upload
        runtimePrincipalOverload: upload(tenantId, principalId, uploadId)
        successStatus: 200
        absentOrInaccessibleStatus: 404
        absentOrInaccessibleCode: UPLOAD_NOT_FOUND
      readSemantics:
        mutatesDomainState: false
        observationFreshness: stored-projection-at-read; not-a-currentness-or-external-effect-receipt
        versionPrecondition: none; returned-version-if-present-is-an-observation-not-a-write-guard
        authorityInput: trusted-host-tenant-and-principal; headers-alone-do-not-prove-identity
        ownershipGuard: record.tenantId-equals-tenantId-and-record.principalId-equals-principalId
        rightsImplication: none; metadata-read-does-not-authorize-bytes-processing-or-delivery
        noResultMeaning: absent-in-caller-scope; never-global-nonexistence-or-no-prior-effect
        unknownOutcome: unavailable-read-remains-unavailable; never-inferred-job-failure-or-safe-replay
        retry: bounded-query-reobservation-only; no-command-replay
      evidenceRefs:
        - launcher/src/test/java/com/ghatana/media/launcher/MediaRuntimeActiveTest.java
        - tests/media-canonical-read-contracts.test.mjs
      executionAdmission: LOCAL_CONTRACT_TESTS_ONLY; production-trusted-identity-and-independent-acceptance-unqualified
    - id: media.operation-slice.inspect-artifact
      sourceOperation: getMediaArtifact
      sourceRef: contracts/openapi/media.yaml#/paths/~1api~1v1~1artifacts~1{artifactId}/get
