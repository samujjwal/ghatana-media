  - id: media.pdp1.decision.mdc30-task-operation-result-joins
    state: OWNER_DEFINED_LOGICAL_MEANING; independent-acceptance-pending
    decision: >-
      Under PXD-163, define exact request/result joins for MDC30-C-03, C-04,
      C-16, C-22, C-25, and C-27: transcription output lineage; scoped TTS
      rights/profile/output/approval; dubbing source/locale/profile/version;
      trusted delivery request fingerprint and destination ACK; typed bounded
      delegated results; and read-only status plus explicit candidate-bound
      fallback guards. Preserve UNKNOWN on stale, unavailable, denied, or
      mismatched owner evidence. Transport remains UNBOUND and runtime remains
      NOT_ADMITTED.
    sourceRefs:
      - .product-experience/decision-log.md#PXD-163
