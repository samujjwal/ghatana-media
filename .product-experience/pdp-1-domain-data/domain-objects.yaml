      identitySource: .product-experience/pdp-1-domain-data/domain-objects.yaml#media.domain.project
    - objectId: media.domain.project-revision
      disposition: MEDIA_PRODUCT_IDENTITY_DEFINED
      ownerSelectedIdentity: tenantId + projectId + stable opaque revisionId; revisionId is not a digest; revisions are immutable snapshots.
      identitySource: .product-experience/pdp-1-domain-data/domain-objects.yaml#media.domain.project-revision
    - objectId: media.domain.artifact
      disposition: MEDIA_PRODUCT_IDENTITY_DEFINED
      ownerSelectedIdentity: tenantId + stable opaque artifactId; owning principal is an access scope, not part of artifact identity.
      identitySource: .product-experience/pdp-1-domain-data/domain-objects.yaml#media.domain.artifact
    - objectId: media.domain.artifact-version
      disposition: MEDIA_PRODUCT_IDENTITY_DEFINED
      ownerSelectedIdentity: tenantId + artifactId + stable opaque versionId; content digest is an integrity attribute, never the version identity.
      identitySource: .product-experience/pdp-1-domain-data/domain-objects.yaml#media.domain.artifact-version
    - objectId: media.domain.media-asset
      disposition: MEDIA_PRODUCT_IDENTITY_DEFINED
      ownerSelectedIdentity: tenantId + projectId + stable opaque assetId; asset identity refers to a project membership/reference, not artifact bytes.
      identitySource: .product-experience/pdp-1-domain-data/domain-objects.yaml#media.domain.media-asset
    - objectId: media.domain.recipe
      disposition: MEDIA_PRODUCT_IDENTITY_DEFINED
      ownerSelectedIdentity: tenantId + stable recipeId + semanticVersion; each semantic edit creates a new version.
      identitySource: .product-experience/pdp-1-domain-data/domain-objects.yaml#media.domain.recipe
    - objectId: media.domain.processing-graph
      disposition: MEDIA_PRODUCT_IDENTITY_DEFINED
      ownerSelectedIdentity: tenantId + stable graphId + semanticVersion; graph identity is not a provider workflow or runtime implementation identity.
      identitySource: .product-experience/pdp-1-domain-data/domain-objects.yaml#media.domain.processing-graph
    - objectId: media.domain.resolved-plan
      disposition: MEDIA_PRODUCT_IDENTITY_DEFINED
      ownerSelectedIdentity: tenantId + stable planId; fingerprint is a separate integrity/binding value and cannot replace plan identity.
