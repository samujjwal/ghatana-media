  decisionId: MEDIA-OWNER-2026-10-09-P1-01-IDENTITY-AND-REFERENCE-CONTRACTS-01
  authority: user-delegated-Media-product-semantic-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
  scopeStatus: OWNER_DEFINED_SOURCE_SEMANTICS; independent-review-open;
    runtime-persistence-and-wire-enforcement-NOT_ADMITTED
  population:
    registeredCurrentIdentities: 38
    canonicalMediaObjects: 37
