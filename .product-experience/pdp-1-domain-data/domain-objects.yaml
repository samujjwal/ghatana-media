    excludedLegacyTranscriptionCount: 1
  scalarTypeAuthority: .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/scalarTypes
  tupleRules:
  - id: media.identity-rule.trusted-tenant-scope
    rule: Every canonical identity tuple includes a trusted host-attested tenantId.
      Caller-supplied tenant labels never replace the authenticated tenant
      context. Cross-entity references repeat tenant scope and fail closed on
      tenant mismatch.
  - id: media.identity-rule.same-tenant-duplicate-conflict
    rule: Within one tenant and object type, an existing canonical identity cannot
      be rebound to different immutable content, parentage, authority scope, or
      semantic version. A duplicate identity with divergent immutable fields is
      a conflict, not an overwrite.
  - id: media.identity-rule.content-digest-not-identity
    rule: Content digests are integrity attributes and never substitute for an
      opaque object/version identity. Equal bytes may have distinct authored
      version identities; a digest collision never merges records.
  - id: media.identity-rule.immutable-version-lineage
    rule: A registered immutable version has a stable version identity, exact
      same-tenant parent/source references where required, no mutation of parent
      bytes, and a directed acyclic lineage graph. Missing or cross-tenant
      parent references fail closed.
  - id: media.identity-rule.source-observation-not-promoted
    rule: Implementation persistence or wire records remain source observations
      unless a separate exact owner binding defines equivalence. UUID, row key,
      session id, chunk index, digest, provider id, and transport id are not
      silently equated with canonical identity.
