    - objectId: media.domain.project-revision
      disposition: MEDIA_PRODUCT_IDENTITY_DEFINED
      ownerSelectedIdentity: tenantId + projectId + stable opaque revisionId; revisionId is not a digest; revisions are immutable snapshots.
