  persistenceAndWireSemantics:
    id: media.identity.persistence-wire-boundary.v1
    normativeIdentityRule: Exact canonicalIdentityTuple in each canonical object record defines owner identity; the wire/persistence shape is not inferred from row keys, UUIDs, hashes, provider IDs, or transport IDs.
    canonicalObjectDisposition: IDENTITY_DEFINED; persistenceAdapter_NOT_ADMITTED; wireAdapter_NOT_ADMITTED; exact implementation projection unresolved per record.
    sourceObservationDisposition: Preserve exact sourceObservationFields only as observations; no canonical tuple, persistence equivalence, DTO equivalence, or owner identity is asserted.
    trustedTenantDisposition: tenantId is sourced only from trusted authenticated host context; caller-body tenant fields are denied.
    immutableVersionDisposition: Versioned object identities include the exact declared version component; content digest is an integrity attribute, and lineage must be same-tenant and acyclic.
    immutableFingerprintDefinition: Any fingerprint used for same-identity collision comparison is a SHA-256 digest encoded exactly as `sha256:` plus 64 lowercase hexadecimal characters, computed from the contract's validated immutable-field projection; arbitrary nonempty strings and content digests used as object identity are rejected.
    allowedLineageRelationKinds: [version-parent, DERIVED_FROM, TRANSFORMED_FROM, GENERATED_FROM, INFERRED_FROM, EXECUTED_BY, AUTHORIZED_BY, ASSESSED_BY]
    requiredAdapterProofBeforeBinding: [exact-source-type, exact-field-map, trusted-tenant-injection, immutable-version-collision-policy, cross-entity-reference-resolution, round-trip-or-explicit-loss, stale-version-and-cross-tenant-negative-cases]
