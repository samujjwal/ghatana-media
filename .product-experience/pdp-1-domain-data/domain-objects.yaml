ownerDefinedLogicalSemantics:
  authority: user-delegated-Media-domain-definition; narrow-P1-01-logical-meaning-only
  status: OWNER_DEFINED_LOGICAL_DEFINITION_ONLY; runtime-storage-wire-and-independent-review-not-claimed
  criteria: >-
    These records resolve only source-backed identity, exact references, lifecycle
    boundaries, and conservative unknown behavior. Existing per-object scopeStatus
    remains unchanged. No new relationship, scientific calibration, policy outcome,
    runtime capability, storage constraint, or external-owner approval is inferred.
  records:
    - objectRef: media.domain.media-asset
      identityContractRef: .product-experience/pdp-1-domain-data/domain-objects.yaml#ownerTypedIdentityContracts/records/@id=media.identity-contract.media-asset
      relationshipRefs: [media.rel.project-asset, media.rel.asset-artifact-version]
      identityRule: Tenant and project scope are part of asset-use identity; asset identifies project membership/reference, not bytes. Artifact and exact immutable artifact version are separate typed references.
      lifecycleRule: Membership/purpose/presentation edits are represented by a new containing project revision; changing bytes requires a different artifact-version reference. Removing a reference does not delete bytes.
      sourceOrParentRule: A project revision selects the asset membership set; the asset binds one same-tenant exact artifact version, never artifact-only or latest.
      unknownBehavior: Missing project, artifact, tenant, or version identity blocks the join; no digest, display name, or latest-version fallback is allowed.
      sourceRefs: [.product-experience/pdp-0-product-truth/domain-model.yaml#MediaAsset, .product-experience/pdp-1-domain-data/relationships.yaml#relationships/@id=media.rel.project-asset, .product-experience/pdp-1-domain-data/relationships.yaml#relationships/@id=media.rel.asset-artifact-version]
    - objectRef: media.domain.recipe
      identityContractRef: .product-experience/pdp-1-domain-data/domain-objects.yaml#ownerTypedIdentityContracts/records/@id=media.identity-contract.recipe
      relationshipRefs: []
      identityRule: Tenant-scoped stable recipe identity plus semantic version; semantic edits create a new version. Parameters and ports are typed specification content, not identity substitutes.
      lifecycleRule: A recipe is immutable authored intent at a selected semantic version; drafts are not committed versions.
      sourceOrParentRule: Recipe describes processing, animation, or simulation intent; it does not itself identify an engine/provider implementation or create an execution relationship.
      unknownBehavior: Missing recipe version, typed parameter meaning, bounds, or required port fails validation; unknown content cannot dispatch work.
      sourceRefs: [.product-experience/pdp-0-product-truth/domain-model.yaml#MediaRecipe]
    - objectRef: media.domain.processing-graph
      identityContractRef: .product-experience/pdp-1-domain-data/domain-objects.yaml#ownerTypedIdentityContracts/records/@id=media.identity-contract.processing-graph
      relationshipRefs: []
      identityRule: Tenant-scoped stable graph identity plus semantic version; graph identity is not provider workflow or runtime implementation identity.
      lifecycleRule: Graph definition is immutable by semantic version; edits produce a new version. An admitted execution plan is acyclic; any bounded loop must remain within a typed node contract.
      sourceOrParentRule: Node/edge artifact references name exact typed inputs and outputs; graph membership does not prove source consumption or lineage by itself.
      unknownBehavior: Unknown node, edge, port type, artifact version, or parameter contract blocks plan admission; no generic/untyped map is treated as equivalent.
      sourceRefs: [.product-experience/pdp-0-product-truth/domain-model.yaml#MediaProcessingGraph]
      deferredBoundary: Universal runtime IR and engine/provider execution mapping are not observed or admitted.
    - objectRef: media.domain.resolved-plan
      identityContractRef: .product-experience/pdp-1-domain-data/domain-objects.yaml#ownerTypedIdentityContracts/records/@id=media.identity-contract.resolved-plan
      relationshipRefs: [media.rel.job-plan]
      identityRule: Tenant-scoped stable planId is identity; fingerprint is an integrity/binding value and not plan identity.
      lifecycleRule: A selected resolved plan is immutable for its bound run/accepted request; replanning creates a successor plan.
      sourceOrParentRule: A job has zero or one plan while unresolved or where its operation needs none; when required, bind the exact plan identity and fingerprint. Absence cannot be silently replaced by another profile or latest plan.
      unknownBehavior: If an operation requires a plan and exact plan binding is missing or unavailable after acceptance, deny dispatch or reconcile UNKNOWN; do not substitute.
      sourceRefs: [.product-experience/pdp-0-product-truth/domain-model.yaml#ResolvedMediaPlan, .product-experience/pdp-1-domain-data/relationships.yaml#relationships/@id=media.rel.job-plan]
      deferredBoundary: Plan registry persistence, admission, resource reservation, and execution are not claimed.
    - objectRef: media.domain.media-run
      identityContractRef: .product-experience/pdp-1-domain-data/domain-objects.yaml#ownerTypedIdentityContracts/records/@id=media.identity-contract.media-run
      relationshipRefs: [media.rel.run-checkpoint]
      identityRule: Tenant-scoped stable runId; run is distinct from source revision, plan, logical job, and attempt.
      lifecycleRule: Run progression does not mutate its source graph/plan; terminal or uncertain observations do not rewrite prior observations.
      sourceOrParentRule: A run binds the exact source revision or resolved plan used. Its checkpoint children use exact same-tenant run identity.
      unknownBehavior: Missing exact source/plan reference or replay class remains UNKNOWN/unavailable; no latest source, regenerated plan, or deterministic-replay claim is inferred.
      sourceRefs: [.product-experience/pdp-0-product-truth/domain-model.yaml#MediaRun-and-Checkpoint, .product-experience/pdp-1-domain-data/relationships.yaml#relationships/@id=media.rel.run-checkpoint]
      deferredBoundary: Durable run history, replay implementation, and execution qualification are not established.
    - objectRef: media.domain.checkpoint
      identityContractRef: .product-experience/pdp-1-domain-data/domain-objects.yaml#ownerTypedIdentityContracts/records/@id=media.identity-contract.checkpoint
      relationshipRefs: [media.rel.run-checkpoint]
      identityRule: TenantId + runId + checkpointId; sequence orders checkpoints within the exact run and is not a standalone identity.
      lifecycleRule: Checkpoints are immutable observations; append-only ordering does not by itself promise durable storage or replayability.
      sourceOrParentRule: Every checkpoint belongs to one exact same-tenant run; source graph/plan and execution provenance are preserved as explicit references when known.
      unknownBehavior: Missing sequence, source version, or execution provenance remains explicitly unknown; do not infer deterministic replay from a checkpoint or seed alone.
      sourceRefs: [.product-experience/pdp-0-product-truth/domain-model.yaml#MediaRun-and-Checkpoint, .product-experience/pdp-1-domain-data/relationships.yaml#relationships/@id=media.rel.run-checkpoint]
      deferredBoundary: Persistence, retention, and replay qualification remain unverified.
    - objectRef: media.domain.scene-plan
      identityContractRef: .product-experience/pdp-1-domain-data/domain-objects.yaml#ownerTypedIdentityContracts/records/@id=media.identity-contract.scene-plan
      relationshipRefs: []
      identityRule: Tenant and project scoped stable scenePlanId plus semantic version.
      lifecycleRule: Semantic edits create a new immutable authored-intent version; scene intent is distinct from generated scene output.
      sourceOrParentRule: Timing, references, controls, narration, and transitions are intent fields; an absent source means source-free authorship, not an invented parent.
      unknownBehavior: Unknown timing/reference meaning remains unknown and cannot establish permission, model truth, or source ancestry.
      sourceRefs: [.product-experience/pdp-0-product-truth/domain-model.yaml#ScenePlan-and-SceneBrief]
    - objectRef: media.domain.scene-brief
      identityContractRef: .product-experience/pdp-1-domain-data/domain-objects.yaml#ownerTypedIdentityContracts/records/@id=media.identity-contract.scene-brief
      relationshipRefs: []
      identityRule: Tenant and project scoped stable sceneBriefId plus semantic version.
      lifecycleRule: Brief changes create a new intent version; a brief does not become a scene graph or simulation result by naming one.
      sourceOrParentRule: Narrative and visual references remain typed references; no permission or behavior proof is inherited from the prose.
      unknownBehavior: Missing or ambiguous reference, clock, or purpose cannot authorize processing or assert model behavior.
      sourceRefs: [.product-experience/pdp-0-product-truth/domain-model.yaml#ScenePlan-and-SceneBrief]
    - objectRef: media.domain.scene-graph
      identityContractRef: .product-experience/pdp-1-domain-data/domain-objects.yaml#ownerTypedIdentityContracts/records/@id=media.identity-contract.scene-graph
      relationshipRefs: [media.rel.scene-model-binding, media.rel.animation-property-owner]
      identityRule: Tenant and project scoped stable sceneGraphId plus semantic version.
      lifecycleRule: Visual entities, transforms, materials, cameras, lights, and bindings are versioned representation; engine-specific objects stay adapter-private.
      sourceOrParentRule: Artifact references bind exact artifact versions. Scene representation is separate from physical/model state and receives no implicit simulation truth.
      unknownBehavior: Missing asset version, transform convention, coordinate frame, or binding owner blocks the affected mapping; no default axis/unit or engine object is inferred.
      sourceRefs: [.product-experience/pdp-0-product-truth/domain-model.yaml#SceneGraph, .product-experience/pdp-1-domain-data/relationships.yaml#relationships/@id=media.rel.scene-model-binding, .product-experience/pdp-1-domain-data/relationships.yaml#relationships/@id=media.rel.animation-property-owner]
    - objectRef: media.domain.animation-graph
      identityContractRef: .product-experience/pdp-1-domain-data/domain-objects.yaml#ownerTypedIdentityContracts/records/@id=media.identity-contract.animation-graph
      relationshipRefs: [media.rel.animation-property-owner]
      identityRule: Tenant and project scoped stable animationGraphId plus semantic version.
      lifecycleRule: Tracks, keyframes, curves, constraints, events, and rig mappings are immutable by semantic version.
      sourceOrParentRule: "Each animated property has one declared owner: animation/kinematic driver or simulation-supplied value. Contradictory ownership is invalid."
      unknownBehavior: Missing property owner, rig mapping, timebase, or target scene version blocks that binding; no engine default or implicit simulation coupling is used.
      sourceRefs: [.product-experience/pdp-0-product-truth/domain-model.yaml#AnimationGraph, .product-experience/pdp-1-domain-data/relationships.yaml#relationships/@id=media.rel.animation-property-owner]
    - objectRef: media.domain.simulation-world
      identityContractRef: .product-experience/pdp-1-domain-data/domain-objects.yaml#ownerTypedIdentityContracts/records/@id=media.identity-contract.simulation-world
      relationshipRefs: [media.rel.scene-model-binding]
      identityRule: Tenant-scoped stable worldId plus semantic version; identity does not certify scientific validity.
      lifecycleRule: Initial model state, quantities, units, solver/engine requirements, boundary conditions, constraints, and sampled output contract are versioned separately from visual scene state.
      sourceOrParentRule: Quantitative fidelity requires equations or an authoritative model reference, units, and validity range; scene meshes are not model evidence.
      unknownBehavior: Missing unit, equation/model authority, solver version, validity range, or calibration remains unknown and blocks quantitative/scientific claims; no calibration is invented.
      sourceRefs: [.product-experience/pdp-0-product-truth/domain-model.yaml#SimulationWorld, .product-experience/pdp-1-domain-data/value-objects.yaml#canonicalConversionDefinitions, .product-experience/pdp-1-domain-data/relationships.yaml#relationships/@id=media.rel.scene-model-binding]
      deferredBoundary: Domain scientific authority, solver qualification, and model validity are external or not evaluated.
    - objectRef: media.domain.timeline
      identityContractRef: .product-experience/pdp-1-domain-data/domain-objects.yaml#ownerTypedIdentityContracts/records/@id=media.identity-contract.timeline
      relationshipRefs: []
      identityRule: Tenant and project scoped stable timelineId plus semantic version.
      lifecycleRule: Timeline edits create a new immutable editorial specification version; tracks and clips retain their declared clock and exact references.
      sourceOrParentRule: Editorial/media time is separate from simulation and wall-clock time; timeline content does not silently align clocks.
      unknownBehavior: Unknown clock, timebase, frame cadence, origin, or rounding denies conversion and preserves source values/loss state.
