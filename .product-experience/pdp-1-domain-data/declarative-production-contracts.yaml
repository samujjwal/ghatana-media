        resultSchemaSource: .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/records/@id=media.operation.capability.media-animation-output-output-composited-video/resultSchema
        basis: Case 015 binds canonical animation semantics to preview and delivery output receipts; no schema-field equality is claimed.
    negativeCases: [unknown-property, wrong-reference-shape, unsupported-story-clock, nonpositive-timebase, unadmitted-operator-reference]
