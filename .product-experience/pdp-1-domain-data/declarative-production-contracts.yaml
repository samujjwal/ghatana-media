                properties:
                  evidenceClass: {const: SPEAKER_TURN_OBSERVATION}
                  evidenceRef: {$ref: '#/$defs/versionRef'}
              cameraSourceEvidence:
                type: object
                additionalProperties: false
                required: [evidenceClass, evidenceRef]
                properties:
                  evidenceClass: {const: CAMERA_SOURCE_OBSERVATION}
                  evidenceRef: {$ref: '#/$defs/versionRef'}
              uncertaintyRef: {$ref: '#/$defs/versionRef'}
        uncertaintyRef: {$ref: '#/$defs/versionRef'}
        proposalDisposition: {const: REVIEWABLE_LOCAL_CANDIDATE_NO_PROJECT_COMMIT}
    operationSchemaRelations:
      - caseId: MEDIA-REQ-CAP-COMPOSE-AC-03
        relation: PRODUCED_BY
        fieldMapping: NOT_ASSERTED
        p0CaseSource: .product-experience/pdp-0-product-truth/requirements.yaml#requirements/@id=MEDIA-REQ-CAP-COMPOSE/acceptanceCases/@id=MEDIA-REQ-CAP-COMPOSE-AC-03
        requestSchemaSource: .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/records/@id=media.operation.capability.media-compose-multitrack-timeline/requestSchema
