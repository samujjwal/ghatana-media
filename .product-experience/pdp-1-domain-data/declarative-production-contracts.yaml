semanticSource:
  id: media.production.semantic-source.v1
  structuralType: closed-versioned-object
  status: SOURCE_AUTHORED_DEFINITION_ONLY
  runtimeAdmission: NOT_ADMITTED
  canonicalOperationAuthority: .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/records
  candidateOnly: true
  apiBinding:
    required: [semanticSourceRef, semanticSourceSha256]
    schema:
      type: object
      additionalProperties: false
      required: [semanticSourceRef, semanticSourceSha256]
      properties:
        semanticSourceRef:
          type: string
          format: opaque-versioned-reference
          minLength: 1
          maxLength: 384
          pattern: '^[^\u0009-\u000D\u001C-\u0020\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000\uFEFF]+$'
        semanticSourceSha256: {$ref: '#/$defs/immutableSha256'}
  sourceBindings:
    description: >-
      Bind the graph to the exact resolved immutable production-spec, its exact
      schema, and compiler-contract references. Each reference is paired with
      the SHA-256 of the corresponding content. The compiler compares these
      values to caller-supplied fingerprint records but cannot prove those
      records came from an authoritative resolver. Resolution and source
      authorization remain the responsibility of the caller.
    required: [productionSpecRef, productionSpecSha256, productionSpecSchemaRef, productionSpecSchemaSha256, compilerContractRef, compilerContractSha256]
    fields:
      productionSpecRef: {$ref: '#/semanticSource/schema/$defs/semanticVersionRef'}
      productionSpecSha256: {$ref: '#/$defs/immutableSha256'}
      productionSpecSchemaRef: {$ref: '#/semanticSource/schema/$defs/semanticVersionRef'}
      productionSpecSchemaSha256: {$ref: '#/$defs/immutableSha256'}
      compilerContractRef: {$ref: '#/semanticSource/schema/$defs/semanticVersionRef'}
      compilerContractSha256: {$ref: '#/$defs/immutableSha256'}
  schema:
    type: object
    additionalProperties: false
    $defs:
      semanticVersionRef:
        type: string
        format: opaque-versioned-reference
        minLength: 1
        maxLength: 384
        pattern: '^[^\u0009-\u000D\u001C-\u0020\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000\uFEFF]+$'
      semanticSha256:
        type: string
        pattern: '^sha256:[0-9a-f]{64}$'
      semanticStepId:
        type: string
        format: opaque-id
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
      semanticVersionRefList:
        type: array
        uniqueItems: true
        maxItems: 512
        items: {$ref: '#/$defs/semanticVersionRef'}
      semanticStepIdList:
        type: array
        uniqueItems: true
        maxItems: 512
        items: {$ref: '#/$defs/semanticStepId'}
    required: [schemaVersion, sourceBindings, nodes]
    properties:
      schemaVersion: {const: media.production.semantic-source.v1}
      sourceBindings:
        type: object
        additionalProperties: false
        required: [productionSpecRef, productionSpecSha256, productionSpecSchemaRef, productionSpecSchemaSha256, compilerContractRef, compilerContractSha256]
        properties:
          productionSpecRef: {$ref: '#/$defs/semanticVersionRef'}
          productionSpecSha256: {$ref: '#/$defs/semanticSha256'}
          productionSpecSchemaRef: {$ref: '#/$defs/semanticVersionRef'}
          productionSpecSchemaSha256: {$ref: '#/$defs/semanticSha256'}
          compilerContractRef: {$ref: '#/$defs/semanticVersionRef'}
          compilerContractSha256: {$ref: '#/$defs/semanticSha256'}
      nodes:
        type: array
        minItems: 1
        maxItems: 512
        items:
          type: object
          additionalProperties: false
          required: [stepId, kind, operationRef, inputArtifactVersionRefs, outputArtifactVersionRefs, dependsOn, sourceSceneRefs, manualLockTarget]
          properties:
            stepId: {$ref: '#/$defs/semanticStepId'}
            kind: {enum: [DETERMINISTIC, GENERATIVE, UNKNOWN]}
            operationRef:
              allOf:
                - {$ref: '#/$defs/semanticVersionRef'}
              description: Exact operation reference resolved by caller against the canonical PDP-1 operation authority; never inferred from stepId or kind.
            inputArtifactVersionRefs: {$ref: '#/$defs/semanticVersionRefList'}
            outputArtifactVersionRefs: {$ref: '#/$defs/semanticVersionRefList'}
            dependsOn: {$ref: '#/$defs/semanticStepIdList'}
            sourceSceneRefs: {$ref: '#/$defs/semanticVersionRefList'}
            manualLockTarget:
              oneOf:
                - {type: 'null'}
                - type: object
                  additionalProperties: false
                  required: [scopeKind, targetRef]
                  properties:
                    scopeKind: {enum: [SCENE, OUTPUT]}
                    targetRef: {$ref: '#/$defs/semanticVersionRef'}
  canonicalization:
    nodeOrder: TOPOLOGICAL_THEN_LEXICOGRAPHIC_READY_STEP_ID
    dependencyOrder: LEXICOGRAPHIC_STEP_ID
    artifactReferenceOrder: LEXICOGRAPHIC_EXACT_VERSION_REF
    lengthPrefix: UTF8_BYTE_LENGTH_COLON_VALUE
    graphFingerprint:
      algorithm: SHA256_OVER_LENGTH_PREFIXED_UTF8_FIELDS
      orderedFields: [schemaVersion, productionSpecRef, productionSpecSha256, productionSpecSchemaRef, productionSpecSchemaSha256, compilerContractRef, compilerContractSha256, nodeCount, nodes]
      nodeFields: [stepId, kind, operationRef, inputArtifactVersionRefs, outputArtifactVersionRefs, dependsOn, sourceSceneRefs, manualLockTarget.scopeKindOrNO_LOCK, manualLockTarget.targetRefOrNO_LOCK]
      listEncoding: DECIMAL_ITEM_COUNT_THEN_EACH_ITEM_AS_LENGTH_PREFIXED_FIELD
    sourceBoundFingerprint:
      algorithm: SHA256_OVER_LENGTH_PREFIXED_UTF8_FIELDS
      orderedFields: [media.production.semantic-source-artifact-binding.v1, semanticSourceRef, verifiedSemanticSourceSha256, graphFingerprint]
      outputField: publicCompilationResult.fingerprint
    refResolution: >-
      Node input/output artifact refs, sourceSceneRefs, and manualLockTarget refs
      receive syntax and shape validation only. The result does not resolve
      those references or claim they exist. Source-binding fingerprint records
      and operation-resolution cardinalities are caller-owned evidence.
  resultSemantics:
    CANDIDATE_PREPARED: Exact semantic-source bytes are digest-checked and the closed graph passes syntax, shape, and topology checks only; a separate source-bound candidate binder may join the graph to a v3 context by exact stepId keys, without proving operation compatibility or authorizing execution.
    operationResolutionBoundary: >-
      A caller-owned resolver supplies exact operation-reference resolution evidence.
      The compiler checks the supplied cardinality but does not prove resolver
      authority, source-currentness, or operation existence.
    UNKNOWN: [ABSENT_GRAPH, UNKNOWN_NODE_KIND, UNRESOLVED_OPERATION, AMBIGUOUS_OPERATION, UNRESOLVED_SOURCE_BINDING, SOURCE_BINDING_MISMATCH, INVALID_SEMANTIC_SOURCE_CONTENT, MISSING_DEPENDENCY]
    NOT_ADMITTED: [CYCLIC_GRAPH, EXECUTION_CONTEXT_MISMATCH]
    effect: No dispatch, job creation, project mutation, provider call, or admission decision is produced by semantic-source compilation.
  executionAdmissionMapping:
    target: executionAdmissionBinding
    version: media.production.execution-admission.v3
    relation: SEMANTIC_SOURCE_INPUT_TO_SEPARATE_EXECUTION_CONTEXT
    stepOperationMapping: OWNER_AUTHORED_EXACT_STEP_ID_JOIN_CANDIDATE_REVIEW_REQUIRED
    mappings:
      semanticSourceRefAndSha256: exact_resolved_source_ref_and_digest_checked_bytes
      graphStepIds: enginesByStep_keys_exactly
      sourceSceneRefs: each_node_subset_of_ProductionSpec_sceneRefs; sourceBindingsByScene_keys_exactly_ProductionSpec_sceneRefs
      manualLockTarget: each_declared_step_exactly_matches_editLocksByStep_scope_and_target; editLocksByStep_keys_exactly_declared_lock_steps
      engineIdentity: candidate_carries_v3_engine_entry_at_exact_matching_stepId_only; no_engine_operation_compatibility_claim
      semanticNodeOperationRef: exact_operationRef_preserved_in_digest_bound_graph; caller_resolved_operation_evidence_required; v3_has_no_operation_ref_field
      artifactVersionRefs: source_bindings_and_existing_v3_authority_refs_only; no_implicit_authority
    candidateFingerprint:
      algorithm: SHA256_OVER_LENGTH_PREFIXED_UTF8_FIELDS
      orderedFields: [media.production.semantic-source-v3-candidate.v1, semanticSourceRef, semanticSourceSha256, normalizedGraphFingerprint, executionAdmissionBindingFingerprint]
      outputField: SemanticCandidateBindResult.candidateFingerprint
      status: DETERMINISTIC_EFFECT_FREE_CANDIDATE_IDENTITY_ONLY
    rule: >-
      Each digest-bound semantic graph node is structurally joined to the v3
      enginesByStep entry only when their exact stepId keys are identical.
      The graph preserves its exact operationRef, resolved by caller-supplied
      PDP-1 operation evidence; neither operationRef nor engine identity is
      inferred from stepId or node kind. This creates an owner-authored,
      effect-free candidate binding only: it does not prove resolver authority,
      source-currentness, operation existence, or engine-operation compatibility,
      and it does not admit runtime execution. Its deterministic
      candidateFingerprint is SHA-256 over length-prefixed UTF-8 fields in
      candidateFingerprint.orderedFields; the final fields are the normalized
      graph fingerprint and the complete v3 binding fingerprint. Missing/extra
      engine keys remain NOT_ADMITTED/EXECUTION_CONTEXT_MISMATCH; unresolved or
      ambiguous operation evidence remains UNKNOWN. Candidate preparation
      produces no dispatch, job, project mutation, provider call, or admission
      decision. No v3 schema, bytes, or API semantics are changed.
  acceptance: DEFINITION_ONLY_NO_NEW_DATA_STORE

executionAdmissionBinding:
  id: media.production.execution-admission.v3
  structuralType: closed-versioned-object
  canonicalOperationRef: media.recipe.specification.compile
  status: SOURCE_AUTHORED_DEFINITION_ONLY
  runtimeAdmission: NOT_ADMITTED
  requiredFields:
    - perNodeEngineModelSolverIdentityAndImmutableBuildSha256OrNoEngine
    - pinnedProviderQualificationAndRights
    - worstCaseCostComputeTimeUnitsTariffQuoteVersionAndReservationId
    - authenticatedTenantPrincipalPurposeAndImmutableSourceVersion
    - perSceneImmutableSourceVersionDigestRightsOwnerDecisionExpiryAndRevocation
    - currentOwnerDecisionRefExpiryAndRevocationEpoch
    - expectedProjectRevisionCas
    - perStepSceneAndOutputEditLockOwnerLeaseEpochAndExpiry
    - storyMediaSimulationAndWallClockIdentitiesAndRationalConversions
  schema:
    type: object
    additionalProperties: false
    required: [schemaVersion, requestIdentity, enginesByStep, providerQualification, reservation, authority, sourceBindingsByScene, project, editLocksByStep, clocks]
    properties:
      schemaVersion: {const: media.production.execution-admission.v3}
      requestIdentity:
        type: object
        additionalProperties: false
        required: [requestId, requestFingerprint]
        properties:
          requestId: {$ref: '#/$defs/opaqueId'}
          requestFingerprint: {$ref: '#/$defs/immutableSha256'}
      enginesByStep:
        type: object
        minProperties: 1
        propertyNames: {$ref: '#/$defs/opaqueId'}
        additionalProperties:
          type: object
          additionalProperties: false
          required: [identityKind, identity, immutableBuildSha256]
          properties:
            identityKind: {enum: [ENGINE, MODEL, SOLVER, NO_ENGINE]}
            identity: {type: string, minLength: 1}
            immutableBuildSha256: {$ref: '#/$defs/digestOrNoEngine'}
          allOf:
            - if: {properties: {identityKind: {const: NO_ENGINE}}, required: [identityKind]}
              then:
                properties:
                  identity: {const: NO_ENGINE}
                  immutableBuildSha256: {const: NO_ENGINE}
            - if: {properties: {identityKind: {not: {const: NO_ENGINE}}}, required: [identityKind]}
              then:
                properties:
                  identity: {not: {const: NO_ENGINE}}
                  immutableBuildSha256: {$ref: '#/$defs/immutableSha256'}
      providerQualification:
        type: object
        additionalProperties: false
        required: [providerId, qualificationRef, qualificationSha256, state, rightsRef]
        properties:
          providerId: {$ref: '#/$defs/opaqueId'}
          qualificationRef: {$ref: '#/$defs/versionRef'}
          qualificationSha256: {$ref: '#/$defs/immutableSha256'}
          state: {const: QUALIFIED}
          rightsRef: {$ref: '#/$defs/versionRef'}
      reservation:
        type: object
        additionalProperties: false
        required: [quoteRef, quoteVersion, reservationId, worstCaseCost, reservedCost, worstCaseCompute, reservedCompute, worstCaseTime, reservedTime]
        properties:
          quoteRef: {$ref: '#/$defs/versionRef'}
          quoteVersion: {$ref: '#/$defs/versionRef'}
          reservationId: {$ref: '#/$defs/opaqueId'}
          worstCaseCost: {$ref: '#/$defs/boundedQuantity'}
          reservedCost: {$ref: '#/$defs/boundedQuantity'}
          worstCaseCompute: {$ref: '#/$defs/boundedQuantity'}
          reservedCompute: {$ref: '#/$defs/boundedQuantity'}
          worstCaseTime: {$ref: '#/$defs/boundedQuantity'}
          reservedTime: {$ref: '#/$defs/boundedQuantity'}
      authority:
        type: object
        additionalProperties: false
        required: [tenantId, principalId, purposeRef, rightsRef, sourceVersionRef, sourceSha256, ownerDecisionRef, decisionExpiresAt, revocationEpoch]
        properties:
          tenantId: {$ref: '#/$defs/opaqueId'}
          principalId: {$ref: '#/$defs/opaqueId'}
          purposeRef: {$ref: '#/$defs/versionRef'}
          rightsRef: {$ref: '#/$defs/versionRef'}
          sourceVersionRef: {$ref: '#/$defs/versionRef'}
          sourceSha256: {$ref: '#/$defs/immutableSha256'}
          ownerDecisionRef: {$ref: '#/$defs/versionRef'}
          decisionExpiresAt: {type: string, format: date-time}
          revocationEpoch: {$ref: '#/$defs/nonnegativeInt64'}
      sourceBindingsByScene:
        description: >-
          Exact immutable source authority for each ProductionSpec.sceneRefs entry.
          Keys must equal that list exactly: no missing scene, extra scene, alias,
          or substituted scene key. Each decision is re-resolved for its exact
          source version and digest before that scene's dispatch, retry, or restart.
        type: object
        minProperties: 1
        propertyNames: {$ref: '#/$defs/versionRef'}
        additionalProperties:
          type: object
          additionalProperties: false
          required: [sourceVersionRef, sourceSha256, rightsRef, ownerDecisionRef, decisionExpiresAt, revocationEpoch]
          properties:
            sourceVersionRef: {$ref: '#/$defs/versionRef'}
            sourceSha256: {$ref: '#/$defs/immutableSha256'}
            rightsRef: {$ref: '#/$defs/versionRef'}
            ownerDecisionRef: {$ref: '#/$defs/versionRef'}
            decisionExpiresAt: {type: string, format: date-time}
            revocationEpoch: {$ref: '#/$defs/nonnegativeInt64'}
      project:
        type: object
        additionalProperties: false
        required: [projectId, expectedRevision, compareAndSet]
        properties:
          projectId: {$ref: '#/$defs/opaqueId'}
          expectedRevision: {$ref: '#/$defs/versionRef'}
          compareAndSet: {const: REQUIRED}
      editLocksByStep:
        description: >-
          Exact per-step scene/output lock receipts. A lock is never implicitly
          shared by another scene or output in this plan.
        type: object
        minProperties: 2
        propertyNames: {$ref: '#/$defs/opaqueId'}
        additionalProperties:
          type: object
          additionalProperties: false
          required: [scopeKind, targetRef, ownerPrincipalId, leaseId, epoch, expiresAt]
          properties:
            scopeKind: {enum: [SCENE, OUTPUT]}
            targetRef: {$ref: '#/$defs/versionRef'}
            ownerPrincipalId: {$ref: '#/$defs/opaqueId'}
            leaseId: {$ref: '#/$defs/opaqueId'}
            epoch: {$ref: '#/$defs/positiveInt64'}
            expiresAt: {type: string, format: date-time}
      clocks:
        type: object
        additionalProperties: false
        required: [storyClockRef, mediaClockRef, simulationClockRef, wallClockRef, conversions]
        properties:
          storyClockRef: {$ref: '#/$defs/versionRef'}
          mediaClockRef: {$ref: '#/$defs/versionRef'}
          simulationClockRef: {$ref: '#/$defs/versionRef'}
          wallClockRef: {$ref: '#/$defs/versionRef'}
          conversions:
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required: [fromClockRef, toClockRef, numerator, denominator]
              properties:
                fromClockRef: {$ref: '#/$defs/versionRef'}
                toClockRef: {$ref: '#/$defs/versionRef'}
                numerator: {$ref: '#/$defs/positiveInt64'}
                denominator: {$ref: '#/$defs/positiveInt64'}
  executionRule: >-
    Missing, unknown, expired, revoked, stale, unbounded, or insufficient data is
    NOT_ADMITTED before effect. Read and validate the current authoritative
    project, rights, qualification, reservation, source and edit-lock state again
    before each dispatch, retry and restart; resolve the request identity through
    the existing MediaRuntime/JobAttempt authority and reconcile an existing exact
    attempt rather than dispatching it twice. A reused key with another
    fingerprint is an idempotency conflict. Reserved cost, compute, and time
    must each cover their corresponding worst-case bound in the same declared
    unit. sourceBindingsByScene keys must exactly equal ProductionSpec.sceneRefs;
    each scene's immutable version and digest, rights, owner decision, expiry,
    and revocation epoch must be re-resolved for that exact scene immediately
    before each dispatch, retry, and restart. Missing, extra, stale, wrong-scene,
    expired, or revoked bindings remain NOT_ADMITTED. Use the existing operation
    journal and compare-and-set authority only.
  operationSchemaRelation:
    operationRef: media.recipe.specification.compile
    relation: COMPILES_PLAN_ADMISSION_CONTEXT
    fieldMapping: NOT_APPLICABLE_SEPARATE_VERSIONED_ENVELOPE
    status: OWNER_AUTHORED_SOURCE_MAPPING_REVIEW_REQUIRED
    sourceOwnerDisposition: >-
      The execution-admission envelope is a separate versioned runtime context
      for the plan candidate produced by this operation. It is not a field in
      ProductionSpec v1 and is not a new compile-operation input; the existing
      six operation slots are unchanged. Compilation remains local candidate
      preparation with no job, project mutation, or external effect. The scene
      guard checks a compiler-produced plan candidate's capture node and exact
      scene binding as structural input; candidate provenance is not attested
      by this envelope and this check does not authorize runtime effects.
    planBindingRules:
      projectId: EXACT_EQUAL_TO_PRODUCTION_SPEC_PROJECT_ID
      expectedProjectRevision: EXACT_EQUAL_TO_PRODUCTION_SPEC_REVISION_ID
      optionalProjectRevisionRef: EXACT_EQUAL_TO_PRODUCTION_SPEC_REVISION_ID_OR_REJECT_STALE
      authorityTenantId: EXACT_EQUAL_TO_PRODUCTION_SPEC_TENANT_ID
      authorityPurposeRef: EXACT_EQUAL_TO_PRODUCTION_SPEC_PURPOSE_REF
      authorityRightsRef: EXACT_EQUAL_TO_PRODUCTION_SPEC_RIGHTS_REF
      enginesByStepKeys: EXACT_EQUAL_TO_COMPILED_PLAN_NODE_STEP_IDS
      sourceBindingsBySceneKeys: EXACT_EQUAL_TO_PRODUCTION_SPEC_SCENE_REFS
      sourceBindingAtEachCaptureStep: EXACT_SCENE_REF_AT_SAME_INPUT_INDEX
      captureGuard: EXACT_COMPILED_CAPTURE_NODE_ID_AND_SINGLETON_SCENE_REF; LOCK_TARGET_MUST_EQUAL_SCENE_REF
      sourceBindingFingerprint: INCLUDED_IN_STABLE_CONTEXT_AND_MATCHING_CAPTURE_NODE_AND_DESCENDANTS
      compiledPlanSchemaVersion: media.production-plan.v1
      compiledPlanSteps:
        - stepId: validate-spec
          kind: validate
          executionMode: AUTOMATIC
        - stepId: rights-review
          kind: rights-review
          executionMode: MANUAL_GATE
          dependsOn: [validate-spec]
        - stepIdTemplate: capture-source-{zeroBasedSceneIndex}
          kind: capture
          executionMode: AUTOMATIC
          iterationSource: ProductionSpec.sceneRefs_in_input_order
          dependsOn: [rights-review]
        - stepId: compose-timeline
          kind: compose
          executionMode: AUTOMATIC
          dependsOn: all_capture_source_steps_in_scene_order
        - stepIdTemplate: render-profile-{zeroBasedOutputProfileIndex}
          kind: render
          executionMode: AUTOMATIC
          iterationSource: ProductionSpec.outputProfileRefs_in_input_order
          dependsOn: compose-timeline
        - stepId: publish-review
          kind: publish-review
          executionMode: MANUAL_GATE
          dependsOn: all_render_profile_steps_in_output_profile_order
      planFingerprint: INCLUDES_STABLE_ADMISSION_CONTEXT_AND_PER_STEP_ENGINE_DIGESTS
      changedEngineDigest: INVALIDATES_ONLY_THAT_STEP_AND_DESCENDANTS
      editLocksByStep:
        capture-source-{zeroBasedSceneIndex}: EXACT_SCENE_REF_AT_SAME_INPUT_INDEX
        render-profile-{zeroBasedOutputProfileIndex}: EXACT_OUTPUT_PROFILE_REF_AT_SAME_INPUT_INDEX
        allOtherSteps: NO_IMPLICIT_SCENE_OR_OUTPUT_LOCK_MAPPING; EFFECT_NOT_ADMITTED
      stepOperationMapping: EXACT_IDENTICAL_STEP_ID_JOIN_ONLY; OPERATION_COMPATIBILITY_UNPROVEN
    admissionContextBindingRules:
      engineByStep:
        keys: EXACT_EQUAL_TO_COMPILED_PLAN_NODE_STEP_IDS
        nonEngineBuildDigest: IMMUTABLE_SHA256_REQUIRED
        noEngine: EXPLICIT_IDENTITY_AND_DIGEST_MUST_BOTH_EQUAL_NO_ENGINE
      reservation:
        quoteRefAndVersion: IMMUTABLE_VERSIONED_REFERENCES_REQUIRED
        reservationId: REQUIRED_BEFORE_EFFECT
        reservedCostComputeAndTime: MUST_EACH_COVER_WORST_CASE_IN_THE_SAME_UNIT
        staleOrInsufficientReservation: NOT_ADMITTED
      currentAuthority:
        tenantId: EXACT_EQUAL_TO_PRODUCTION_SPEC_TENANT_ID
        purposeRef: EXACT_EQUAL_TO_PRODUCTION_SPEC_PURPOSE_REF
        rightsRef: EXACT_EQUAL_TO_PRODUCTION_SPEC_RIGHTS_REF
        decision: RE_RESOLVE_CURRENT_OWNER_DECISION_AND_REVOCATION_EPOCH_BEFORE_EACH_EFFECT
        sourceBindingsByScene:
          keys: EXACT_EQUAL_TO_PRODUCTION_SPEC_SCENE_REFS; MISSING_EXTRA_OR_WRONG_SCENE_NOT_ADMITTED
          captureStepIndex: capture-source-{i}_MUST_MATCH_PRODUCTION_SPEC_SCENE_REFS[i]
          guardIdentity: EXACT_COMPILED_PLAN_CAPTURE_NODE_AND_SCENE_EDIT_LOCK_TARGET
          sourceVersionAndDigest: EXACT_IMMUTABLE_VERSION_AND_SHA256_PER_SCENE
          rightsDecision: EXACT_RIGHTS_AND_OWNER_DECISION_EXPIRY_AND_REVOCATION_EPOCH_PER_SCENE
          recheck: BEFORE_EACH_SCENE_DISPATCH_RETRY_AND_RESTART
      projectRevision: EXACT_EQUAL_TO_PRODUCTION_SPEC_REVISION_ID_AND_COMPARE_AND_SET_REQUIRED
      editLock:
        targetRef: EXACT_SCENE_OR_OUTPUT_VERSION_FOR_THE_EFFECT_STEP
        ownerLeaseEpochAndExpiry: CURRENT_FENCED_LEASE_REQUIRED
        multiTargetCoverage: ONE_EXACT_TARGET_PER_LOCK; NO_IMPLICIT_SHARING
      clocks:
        identities: ALL_DECLARED_CLOCK_REFS_MUST_RESOLVE_TO_VERSIONED_CLOCKS
        conversions: RATIONAL_DIRECTIONAL_MAPPINGS_REQUIRED_FOR_EACH_CROSS_CLOCK_EFFECT
        missingOrAmbiguousMapping: NOT_ADMITTED
    operationInputCoverage:
      scope: EFFECT_FREE_RESOLVED_CONTENT_INSTANCE_BOUND_SEMANTIC_GRAPH_CANDIDATE; FIXED_DAG_API_REMAINS_A_LEGACY_PROTOTYPE
      typedProductionSpecInput: >-
        EXISTING_TYPED_PRODUCTION_SPEC_MIRROR_ACCEPTED; EXACT_INPUT1_VERSION_REF_BOUND_WHEN_SUPPLIED;
        RESOLVER_OVERLOAD_REQUIRES_THE_DECODED_INPUT1_VALUE_TO_STRUCTURALLY_EQUAL_THE_TYPED_MIRROR;
        ORIGINAL_RESOLVED_BYTES_DIGEST_AND_LENGTH_ARE_BOUND_IN_THE_CANDIDATE
      optionalProjectRevisionInput: EXACT_EQUALITY_CHECKED_WHEN_PRESENT
      input1Content: >-
        RESOLVER_OVERLOAD_CHECKS_EXACT_REFERENCE_ECHO_AND_SHA256_OF_RETURNED_BYTES;
        IMMUTABLE_VERSION_AND_AUTHORIZATION_ARE_NOT_PROVEN_BY_THE_RESOLVER_RESPONSE
      input2ProductionSpecSchema: >-
        EXACT_VERSIONED_REFERENCE_AND_SUPPLIED_PRODUCTION_SPEC_SCHEMA_VERSION_MUST_MATCH_SPEC_SCHEMA_VERSION;
        RESOLVER_OVERLOAD_VALIDATES_INPUT1_AGAINST_THE_RESOLVED_LOCAL_DRAFT_2020_12_SCHEMA_WITH_REMOTE_FETCH_DISABLED;
        RESOLVED_SCHEMA_DOCUMENT_$ID_IS_NOT_MATCHED_TO_THE_SUPPLIED_VERSION;
        AUTOMATIC_MATERIALIZATION_OF_THE_SHARED_PDP1_DEFS_CONTEXT_IS_NOT_IMPLEMENTED
      input3CompilerContract: >-
        EXACT_VERSIONED_REFERENCE_REQUIRED; RESOLVER_OVERLOAD_CHECKS_REFERENCE_ECHO_AND_SHA256_OF_RETURNED_BYTES;
        CONTENT_MUST_BE_A_CLOSED_MEDIA_PRODUCTION_COMPILER_CONTRACT_V1_INSTANCE_BOUND_TO_THE_EXACT_INPUT1_AND_INPUT2_REFS_AND_DIGESTS;
        EXPLICIT_STEP_GRAPH_IS_NORMALIZED_WITHOUT_INFERRING_OPERATION_OR_KIND;
        RESOLVER_AUTHORITY_AND_SOURCE_CURRENTNESS_REMAIN_UNPROVEN
      input3CompilerContractSchema:
        id: media.production.compiler-contract.v1
        schema:
          type: object
          additionalProperties: false
          required: [schemaVersion, targetProductionSpecRef, targetProductionSpecSha256, targetProductionSpecSchemaRef, targetProductionSpecSchemaSha256, steps]
          properties:
            schemaVersion: {const: media.production.compiler-contract.v1}
            targetProductionSpecRef: {$ref: '#/semanticSource/schema/$defs/semanticVersionRef'}
            targetProductionSpecSha256: {$ref: '#/semanticSource/schema/$defs/semanticSha256'}
            targetProductionSpecSchemaRef: {$ref: '#/semanticSource/schema/$defs/semanticVersionRef'}
            targetProductionSpecSchemaSha256: {$ref: '#/semanticSource/schema/$defs/semanticSha256'}
            steps:
              type: array
              minItems: 1
              maxItems: 512
              items: {$ref: '#/semanticSource/schema/properties/nodes/items'}
        candidateFingerprint:
          algorithm: SHA256_OVER_LENGTH_PREFIXED_UTF8_FIELDS
          orderedFields: [media.production.semantic-graph-resolved-input-candidate.v1, productionSpecRef, productionSpecSha256, productionSpecByteLength, productionSpecSchemaRef, productionSpecSchemaSha256, productionSpecSchemaByteLength, compilerContractRef, compilerContractSha256, compilerContractByteLength, normalizedGraphFingerprint]
          outputField: MediaProductionSemanticSource.CompilationResult.fingerprint
          status: DETERMINISTIC_EFFECT_FREE_CANDIDATE_IDENTITY_ONLY
        bindingRule: >-
          targetProductionSpecRef/Sha256 and targetProductionSpecSchemaRef/Sha256 must equal the exact
          resolver-confirmed input1/input2 references and byte digests. Steps are explicit per-instance
          graph nodes; no template, label, stepId, implementation, kind, or engine identity is used to infer
          an operation or step kind. The contract's own input3 reference and digest are included in the
          normalized semantic graph fingerprint.
        ownerAuthoredAssumption: >-
          ProductionSpec v1 remains closed and unchanged. Because it carries no step array, input3 must
          provide the complete explicit step graph for the exact input1/input2 identities and digests;
          the compiler does not synthesize a graph from ProductionSpec labels or the legacy fixed plan.
        nodeKindRule: DETERMINISTIC_OR_GENERATIVE_REQUIRED; UNKNOWN_OR_UNSUPPORTED_KIND_RETURNS_UNKNOWN
        operationResolution: EXACT_OPERATION_REF_WITH_ONE_CALLER_SUPPLIED_RESOLUTION; AUTHORITY_AND_CURRENTNESS_UNPROVEN
        sourceSceneRule: EVERY_STEP_SOURCE_SCENE_REF_MUST_BE_A_MEMBER_OF_EXACT_INPUT1_SCENE_REFS
        effect: NO_DISPATCH_NO_JOB_NO_PROJECT_MUTATION_NO_PROVIDER_CALL
      notImplementedInputs: [input1-immutable-version-and-authorization-proof, input2-shared-definitions-context-materialization, input3-resolver-authority-and-source-currentness, input5-target-schema, input6-migration-transformation]
      schemaMigrationCandidate: NOT_IMPLEMENTED; UNKNOWN_UNSUPPORTED_WITHOUT_A_SOURCE_DECLARED_SUPPORTED_TRANSFORMATION
    sourceAndLockCoverage:
      authoritySourceVersionAndRightsDecisionToEachScene: EXACT_SCENE_KEYED_MAP_REQUIRED; COMPILE_CHECKED; EFFECT_RECHECK_REQUIRED
      editLockCardinality: ONE_EXACT_SCENE_OR_OUTPUT_PER_MAPPED_EFFECT_STEP
      oneLockAuthorizesOtherScenesOrOutputsInPlan: false
    effectBoundary:
      compileOperation: LOCAL_CANDIDATE_ONLY_NO_JOB_OR_EXTERNAL_EFFECT
      beforeProviderDispatchRetryOrRestart:
        required: RECHECK_CURRENT_AUTHORITY_THROUGH_EXISTING_MEDIARUNTIME_JOBATTEMPT
        implementationStatus: NOT_WIRED_TO_H02_EXECUTION_PATH
        missingStaleOrWrongSceneSourceBinding: NOT_ADMITTED
      unknownProviderOutcome:
        required: RECONCILE_EXISTING_ATTEMPT_WITHOUT_DUPLICATE_DISPATCH
        implementationStatus: UNKNOWN_UNTIL_AUTHORITY_BACKED_ATTEMPT_READBACK
      editLockScope:
        cardinality: ONE_EXACT_SCENE_OR_OUTPUT_PER_MAPPED_EFFECT_STEP
        authorizesOtherTargetsInMultiScenePlan: false
      runtimeAdmission: NOT_ADMITTED_PENDING_INDEPENDENT_SOURCE_REVIEW_AND_AUTHORITY_BACKED_ADAPTER
    sourceReviewRequirement: Independently review the owner-authored candidate binding rules and exact source cut before runtime admission; candidate preparation itself remains effect-free and NOT_ADMITTED.
nonClaims: [no-new-operation-or-route, no-new-MediaProject-writer, no-scientific-solver-qualification, no-full-Discovery-exit, no-native-test-evidence]
