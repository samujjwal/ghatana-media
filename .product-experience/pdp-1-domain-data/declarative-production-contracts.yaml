$defs:
  opaqueId: {type: string, format: opaque-id, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'}
  existingSimulationCapabilityLeafId:
    type: string
    enum: [media.simulation.rigid-body, media.simulation.soft-body, media.simulation.cloth, media.simulation.rope, media.simulation.particle, media.simulation.fluid, media.simulation.smoke, media.simulation.fire, media.simulation.collision, media.simulation.constraint, media.simulation.vehicle, media.simulation.crowd, media.simulation.agent, media.simulation.human-motion, media.simulation.procedural-world, media.simulation.camera-experiment, media.simulation.lighting-experiment, media.simulation.educational-demo, media.simulation.scientific-demo, media.simulation.robotics, media.simulation.kinematics, media.simulation.synthetic-data]
  versionRef: {type: string, format: opaque-versioned-reference, minLength: 1, maxLength: 384, pattern: '\S'}
  nullableVersionRef: {oneOf: [{$ref: '#/$defs/versionRef'}, {type: 'null'}]}
  signedInt64Decimal:
    type: string
    format: signed-int64-decimal
    pattern: '^(0|-[1-9][0-9]*|[1-9][0-9]*)$'
    description: Canonical decimal text preserves the exact signed-64-bit value without JSON/YAML binary floating-point rounding.
  positiveInt64Decimal:
    type: string
    format: positive-int64-decimal
    pattern: '^[1-9][0-9]*$'
    description: Canonical positive decimal text preserves the exact signed-64-bit value without JSON/YAML binary floating-point rounding.
  digest:
    type: object
    additionalProperties: false
    required: [algorithmRef, value, subjectVersionRef]
    properties:
      algorithmRef: {$ref: '#/$defs/versionRef'}
      value: {type: string, minLength: 1, maxLength: 384, pattern: '\S'}
      subjectVersionRef: {$ref: '#/$defs/versionRef'}
  immutableSha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  digestOrNoEngine: {oneOf: [{$ref: '#/$defs/immutableSha256'}, {const: NO_ENGINE}]}
  positiveInt64: {$ref: '#/$defs/positiveInt64Decimal'}
  nonnegativeInt64:
    allOf:
      - {$ref: '#/$defs/signedInt64Decimal'}
      - {type: string, pattern: '^(0|[1-9][0-9]*)$'}
  boundedQuantity:
    type: object
    additionalProperties: false
    required: [amount, unit]
    properties:
      amount: {$ref: '#/$defs/positiveInt64'}
      unit: {$ref: '#/$defs/versionRef'}
  resourceBounds:
    type: object
    additionalProperties: false
    required: [stepLimit, wallClockBudgetMs, memoryBudgetBytes, workloadLimit, recursionLimit]
    properties:
      stepLimit: {type: integer, minimum: 1}
      wallClockBudgetMs: {type: integer, minimum: 1}
      memoryBudgetBytes: {type: integer, minimum: 1}
      workloadLimit: {type: integer, minimum: 1}
      recursionLimit: {type: integer, minimum: 1}
  opaqueIdList: {type: array, uniqueItems: true, items: {$ref: '#/$defs/opaqueId'}}
  nonEmptyOpaqueIdList: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/$defs/opaqueId'}}
  versionRefList: {type: array, uniqueItems: true, items: {$ref: '#/$defs/versionRef'}}
  nonEmptyVersionRefList: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/$defs/versionRef'}}
  possiblyEmptyVersionRefList: {type: array, uniqueItems: true, items: {$ref: '#/$defs/versionRef'}}
  rational:
    type: object
    additionalProperties: false
    required: [numerator, denominator]
    properties:
      numerator: {$ref: '#/$defs/signedInt64Decimal'}
      denominator: {$ref: '#/$defs/positiveInt64Decimal'}
