schemaVersion: media.declarative-production.pdp1.v1
productId: media
sourcePhase: PDP-1
status: SOURCE_AUTHORED_DEFINITION_ONLY
canonicalProductAuthority: .product-experience/pdp-0-product-truth/requirements.yaml#declarativeProductionProfile
canonicalOperationAuthority: .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts
canonicalDomainAuthority: .product-experience/pdp-1-domain-data/domain-objects.yaml#objects
canonicalClockAuthority: .product-experience/pdp-1-domain-data/value-objects.yaml#canonicalConversionDefinitions
canonicalReplaySemanticsAuthority: .product-experience/pdp-1-domain-data/value-objects.yaml#ownerDescriptorDefinitions/records/@id=media.value.replay-provenance-definition/schema/properties/randomnessSemantics
recorderReuse: .product-experience/pdp-1-domain-data/recorder-studio-contracts.yaml
reason: Specialized closed typed producer specifications; not a duplicate operation registry, source of model science, or new persistence writer
denominator: {newRequirements: 61, distinctExistingCapabilityLeaves: 39, operationBindings: 61, newCanonicalOperations: 0, newCanonicalDomainObjects: 0}
existingCanonicalDomainRefs:
  - media.domain.project-revision
  - media.domain.media-run
  - media.domain.processing-job
  - media.domain.job-attempt
  - media.domain.checkpoint
  - media.domain.scene-graph
  - media.domain.animation-graph
  - media.domain.simulation-world
  - media.domain.timeline
  - media.domain.artifact-version
  - media.domain.quality-assessment
  - media.domain.provenance-manifest
originClasses: [REAL_CAPTURE, DECLARATIVE_ANIMATION, MODEL_SIMULATION, GENERATIVE_MEDIA, PDP_SYNTHETIC_FIXTURE]
sourceClassRule: Producer reports exact origin, input lineage, qualified model/solver and tool version. Scientific measurements never originate from pixels or synthetic PDP fixtures.
requestResultSemantics:
  requiredTrustedContext: [tenantId, actorOrPrincipalRef, projectRevisionRef, exactCapabilityLeafRef, exactOperationRef, explicitVersion, policyAndPurposeRef, rightsConsentRef, deadlineOrBudgetRef]
  immutableInputs: [sourceDigests, modelAndSolverRevisionsWhenUsed, tSimOrTStoryClockRefAsApplicable, typedUnitRegistry, sceneAndOutputProfileRefs]
  effectIdentity: [requestIdWhenMutation, expectedRevisionIdWhenProjectEdit, priorOwnerResultRefWhenReconciliation]
  stateVocabulary: [REQUEST_ACCEPTED, EFFECT_CONFIRMED, DENIED, CONFLICT, UNAVAILABLE, OUTCOME_UNKNOWN, PARTIAL, ABSTAINED]
  finality: REQUEST_ACCEPTED does not prove durable queue, solver execution, scene render, remote product effect, or publication; owner observation is required.
  unknownOutcome: Reconcile exact request/job/attempt before any non-idempotent replay; preserve manual edits and source receipts.
  failClosed: Missing rights, tenant context, unit, clock transform, model version, qualified adapter or owner result denies only the dependent action.
  boundedExecution: Recursion/step/time/memory/workload capped, no arbitrary code or shaders, provider sandbox and explicit tool/codec rights.
  ai: Agent proposes typed operations against existing revision, with evidence, confidence, manual locks, review/abstention; no privileged evaluation.
  o11y: Redacted trace/span and run/model/source identity, semantic error states, measured latency/cost/jitter, critical audit separate from telemetry.
typedProductionValueSchemaContext:
  schemaVersion: media.declarative-production.typed-value-schema-context.v1
  dialect: https://json-schema.org/draft/2020-12/schema
  sharedDefinitionsSource: .product-experience/pdp-1-domain-data/declarative-production-contracts.yaml#/$defs
  requiredCustomFormats:
    signed-int64-decimal: canonical base-10 integer string in [-9223372036854775808, 9223372036854775807], validated losslessly with arbitrary-precision integer arithmetic
    positive-int64-decimal: canonical base-10 integer string in [1, 9223372036854775807], validated losslessly with arbitrary-precision integer arithmetic
  resolutionRule: >-
    Each typedProductionValueDescriptors[].schema is evaluated as the schema root with the exact shared $defs
    selected above merged at that root. Local #/$defs/... references therefore resolve to this contract's
    definitions; consumers must not substitute a similarly named schema or infer another reference base.
    Implementations must enforce requiredCustomFormats exactly; number-valued approximations are not conformant.
typedProductionValueDescriptors:
  - id: media.declarative.value.production-spec.v1
    ownerDomainRef: media.domain.project-revision
    structuralType: closed-versioned-object
    runtimeAdmission: NOT_ADMITTED
    requiredFields: [tenantId, projectId, revisionId, schemaVersion, originClass, purposeRef, sceneRefs, timelineRef, rightsRef, outputProfileRefs]
    schemaAuthorities:
      - .product-experience/pdp-1-domain-data/domain-objects.yaml#objects/@id=media.domain.project-revision
      - .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/records/@id=media.operation.capability.media-project-version/requestSchema
    schema:
      type: object
      additionalProperties: false
      required: [tenantId, projectId, revisionId, schemaVersion, originClass, purposeRef, sceneRefs, timelineRef, rightsRef, outputProfileRefs]
      properties:
        tenantId: {type: string, format: opaque-id, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'}
        projectId: {type: string, format: opaque-id, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'}
        revisionId: {type: string, format: opaque-id, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'}
        schemaVersion: {const: media.declarative.value.production-spec.v1}
        originClass: {enum: [REAL_CAPTURE, DECLARATIVE_ANIMATION, MODEL_SIMULATION, GENERATIVE_MEDIA, PDP_SYNTHETIC_FIXTURE]}
        purposeRef: {$ref: '#/$defs/versionRef'}
        sceneRefs: {$ref: '#/$defs/nonEmptyVersionRefList'}
        timelineRef: {$ref: '#/$defs/versionRef'}
        rightsRef: {$ref: '#/$defs/versionRef'}
        outputProfileRefs: {$ref: '#/$defs/nonEmptyVersionRefList'}
    operationSchemaRelations:
      - caseId: MEDIA-DECL-P0-AC-054
        relation: CONSUMED_BY
        fieldMapping: NOT_ASSERTED
        requestSchemaSource: .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/records/@id=media.operation.capability.media-project-version/requestSchema
        resultSchemaSource: .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/records/@id=media.operation.capability.media-project-version/resultSchema
        basis: Case 054 defines selective regeneration and manual edit-lock behavior for a versioned project; this relation does not assert field equivalence.
      - caseId: MEDIA-DECL-P0-AC-055
        relation: CONSUMED_BY
        fieldMapping: NOT_ASSERTED
        requestSchemaSource: .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/records/@id=media.operation.capability.media-project-composition-update/requestSchema
        resultSchemaSource: .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/records/@id=media.operation.capability.media-project-composition-update/resultSchema
        basis: Case 055 defines a canonical revision update; no field-level equivalence is asserted.
    negativeCases: [unknown-property, wrong-identifier-format, unsupported-origin-class, empty-reference-list, inconsistent-origin-and-scene-source]
    invariant: "one canonical MediaProject revision, immutably linked assets and checked CAS edits"
    missingRequiredField: DENIED_WITH_SOURCE_RETAINED
    acceptance: DEFINITION_ONLY_NO_NEW_DATA_STORE
