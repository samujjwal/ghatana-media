        relation: CONSUMED_BY
        fieldMapping: NOT_ASSERTED
        requestSchemaSource: .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/records/@id=media.operation.capability.media-animation-2d/requestSchema
        resultSchemaSource: .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/records/@id=media.operation.capability.media-animation-2d/resultSchema
