    oneOf:
      - type: object
        additionalProperties: false
        required: [applicability, evidenceRefs]
        properties:
          applicability: {const: ADMITTED}
          evidenceRefs: {$ref: '#/$defs/nonEmptyVersionRefList'}
      - type: object
        additionalProperties: false
        required: [applicability, evidenceRefs]
        properties:
          applicability: {const: NOT_ADMITTED}
          evidenceRefs: {$ref: '#/$defs/versionRefList'}
      - type: object
        additionalProperties: false
        required: [applicability, evidenceRefs]
        properties:
          applicability: {const: UNKNOWN}
          evidenceRefs: {$ref: '#/$defs/versionRefList'}
    description: This nested disposition applies only to its enclosing exact modelFamilyRef and modelVersionRef. ADMITTED requires non-empty versioned source evidence and passes familyApplicabilityValidationContract. NOT_ADMITTED and UNKNOWN remain non-executable; unknown or unsupported family scope rejects. This does not assert owner authorization or scientific qualification.
  randomnessSemantics:
    oneOf:
      - type: object
        additionalProperties: false
        required: [disposition, prngAlgorithmVersionRef, prngImplementationVersionRef, randomStreamVersionRef, seedPolicyVersionRef, seedMaterialVersionRef, checkpointStateFormatVersionRef, checkpointStateVersionRefs]
        properties:
          disposition: {const: SPECIFIED}
