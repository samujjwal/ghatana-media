      properties:
        sceneId: {type: string, format: opaque-id, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'}
        sceneGraphRef: {$ref: '#/$defs/versionRef'}
