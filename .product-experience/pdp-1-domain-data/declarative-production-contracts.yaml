schemaVersion: media.declarative-production.pdp1.v1
productId: media
sourcePhase: PDP-1
status: SOURCE_AUTHORED_PENDING_NATIVE_VALIDATION_AND_CURRENTNESS
canonicalProductAuthority: .product-experience/pdp-0-product-truth/requirements.yaml#declarativeProductionProfile
canonicalOperationAuthority: .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts
canonicalDomainAuthority: .product-experience/pdp-1-domain-data/domain-objects.yaml#objects
canonicalClockAuthority: .product-experience/pdp-1-domain-data/value-objects.yaml#canonicalConversionDefinitions
recorderReuse: .product-experience/pdp-1-domain-data/recorder-studio-contracts.yaml
reason: Specialized closed typed producer specifications; not a duplicate operation registry, source of model science, or new persistence writer
denominator: {newRequirements: 61, distinctExistingCapabilityLeaves: 39, operationBindings: 61, newCanonicalOperations: 0, newCanonicalDomainObjects: 0}
existingCanonicalDomainRefs:
  - media.domain.project-revision
  - media.domain.media-run
  - media.domain.processing-job
  - media.domain.job-attempt
  - media.domain.checkpoint
  - media.domain.scene-graph
  - media.domain.animation-graph
  - media.domain.simulation-world
  - media.domain.timeline
  - media.domain.artifact-version
  - media.domain.quality-assessment
  - media.domain.provenance-manifest
originClasses: [REAL_CAPTURE, DECLARATIVE_ANIMATION, MODEL_SIMULATION, GENERATIVE_MEDIA, PDP_SYNTHETIC_FIXTURE]
sourceClassRule: Producer reports exact origin, input lineage, qualified model/solver and tool version. Scientific measurements never originate from pixels or synthetic PDP fixtures.
requestResultSemantics:
  requiredTrustedContext: [tenantId, actorOrPrincipalRef, projectRevisionRef, exactCapabilityLeafRef, exactOperationRef, explicitVersion, policyAndPurposeRef, rightsConsentRef, deadlineOrBudgetRef]
  immutableInputs: [sourceDigests, modelAndSolverRevisionsWhenUsed, tSimOrTStoryClockRefAsApplicable, typedUnitRegistry, sceneAndOutputProfileRefs]
  effectIdentity: [requestIdWhenMutation, expectedRevisionIdWhenProjectEdit, priorOwnerResultRefWhenReconciliation]
  stateVocabulary: [REQUEST_ACCEPTED, EFFECT_CONFIRMED, DENIED, CONFLICT, UNAVAILABLE, OUTCOME_UNKNOWN, PARTIAL, ABSTAINED]
  finality: REQUEST_ACCEPTED does not prove durable queue, solver execution, scene render, remote product effect, or publication; owner observation is required.
  unknownOutcome: Reconcile exact request/job/attempt before any non-idempotent replay; preserve manual edits and source receipts.
  failClosed: Missing rights, tenant context, unit, clock transform, model version, qualified adapter or owner result denies only the dependent action.
  boundedExecution: Recursion/step/time/memory/workload capped, no arbitrary code or shaders, provider sandbox and explicit tool/codec rights.
  ai: Agent proposes typed operations against existing revision, with evidence, confidence, manual locks, review/abstention; no privileged evaluation.
  o11y: Redacted trace/span and run/model/source identity, semantic error states, measured latency/cost/jitter, critical audit separate from telemetry.
typedProductionValueDescriptors:
  - id: media.declarative.value.production-spec.v1
    ownerDomainRef: media.domain.project-revision
    structuralType: closed-versioned-object
    requiredFields: [tenantId, projectId, revisionId, schemaVersion, originClass, purposeRef, sceneRefs, timelineRef, rightsRef, outputProfileRefs]
    invariant: "one canonical MediaProject revision, immutably linked assets and checked CAS edits"
    missingRequiredField: DENIED_WITH_SOURCE_RETAINED
    acceptance: DEFINITION_ONLY_NO_NEW_DATA_STORE
  - id: media.declarative.value.scene-binding.v1
    ownerDomainRef: media.domain.scene-graph
    structuralType: closed-versioned-object
    requiredFields: [sceneId, sceneGraphRef, animationGraphRef, modelStateRefOrNull, sourceRefs, temporalMappingRef, semanticAnchorRefs, accessibilityRef]
    invariant: "typed source, scene, animation and model relationship without owner transfer"
    missingRequiredField: DENIED_WITH_SOURCE_RETAINED
    acceptance: DEFINITION_ONLY_NO_NEW_DATA_STORE
  - id: media.declarative.value.animation-spec.v1
    ownerDomainRef: media.domain.animation-graph
    structuralType: closed-versioned-object
    requiredFields: [schemaVersion, sceneGraphRef, animationGraphRef, operatorTreeRef, assetsRef, propertyCurveRefs, tStoryRef, renderingRef]
    invariant: "versioned 2D and 3D semantic graph, admitted operators only and bounded derivations"
    missingRequiredField: DENIED_WITH_SOURCE_RETAINED
    acceptance: DEFINITION_ONLY_NO_NEW_DATA_STORE
  - id: media.declarative.value.model-execution-spec.v1
    ownerDomainRef: media.domain.simulation-world
    structuralType: closed-versioned-object
    requiredFields: [modelVersionRef, modelDigest, solverId, solverVersion, solverBuildDigest, numericPrecision, initialConditionsRef, boundaryConditionsRef, unitsRegistryRef, parameterRevisionRef, tSimClockRef, stepPolicy, toleranceContractRef, fidelityProfileRef, resourceBounds, seedPolicy]
    invariant: "pinned domain-owned equations and constraints, qualified execution only and no implicit model rewrite"
    missingRequiredField: DENIED_WITH_SOURCE_RETAINED
    acceptance: DEFINITION_ONLY_NO_NEW_DATA_STORE
  - id: media.declarative.value.simulation-state.v1
    ownerDomainRef: media.domain.checkpoint
    structuralType: closed-versioned-object
    requiredFields: [runId, attemptId, modelVersionRef, solverVersionRef, tSimTicks, stepIndex, stateVersion, stateDigest, parameterDigest, rngStateOrNull, checkpointParentRefOrNull]
    invariant: "simulation advances solely on explicit model commands and records resumable immutable state"
    missingRequiredField: DENIED_WITH_SOURCE_RETAINED
    acceptance: DEFINITION_ONLY_NO_NEW_DATA_STORE
  - id: media.declarative.value.measurement.v1
    ownerDomainRef: media.domain.simulation-world
    structuralType: closed-versioned-object
    requiredFields: [observableId, modelRunRef, stateVersion, tSimSamplePoint, numericValue, unitId, coordinateFrameRefOrNull, instrumentRef, calibrationRef, uncertaintyRef, validityDomainRef, provenanceRef]
    invariant: "measured outputs originate in solver or qualified sensor, never from illustrative renderer"
    missingRequiredField: DENIED_WITH_SOURCE_RETAINED
    acceptance: DEFINITION_ONLY_NO_NEW_DATA_STORE
  - id: media.declarative.value.validation-report.v1
    ownerDomainRef: media.domain.quality-assessment
    structuralType: closed-versioned-object
    requiredFields: [modelVersionRef, solverBuildDigest, oracleRef, expectedSamples, actualSamples, toleranceSpecRef, residualStatisticsRef, verdict, applicability, limitations, environmentRef]
    invariant: "scientific validity evidence separated from media quality and fidelity of rendered appearance"
    missingRequiredField: DENIED_WITH_SOURCE_RETAINED
    acceptance: DEFINITION_ONLY_NO_NEW_DATA_STORE
  - id: media.declarative.value.clock-alignment.v1
    ownerDomainRef: media.domain.timeline
    structuralType: closed-versioned-object
    requiredFields: [sourceClockId, destClockId, sourceOriginRef, destOriginRef, mappingVersionRef, rationalScale, rationalOffset, lossAndRoundingRef, uncertaintyRef]
    invariant: "cross-clock conversions require explicit declared mapping and no VFR approximation"
    missingRequiredField: DENIED_WITH_SOURCE_RETAINED
    acceptance: DEFINITION_ONLY_NO_NEW_DATA_STORE
  - id: media.declarative.value.public-aef-bridge.v1
    ownerDomainRef: media.domain.scene-graph
    structuralType: closed-versioned-object
    requiredFields: [contractVersion, tutorPutorModelIrRef, tutorPutorSceneIrRef, tutorPutorExperienceIrRef, supportedCapabilityRefs, adapterVersion, mediaProjectRevisionRef]
    invariant: "versioned public contract with TutorPutor science, pedagogy and learner authority retained"
    missingRequiredField: DENIED_WITH_SOURCE_RETAINED
    acceptance: DEFINITION_ONLY_NO_NEW_DATA_STORE
  - id: media.declarative.value.source-classification.v1
    ownerDomainRef: media.domain.provenance-manifest
    structuralType: closed-versioned-object
    requiredFields: [originClass, sourceVersionRef, producingToolVersionRef, consentRightsRef, sourceClockRef, runOrCaptureReceiptRef, digest, traceRefOrNull]
    invariant: "REAL_CAPTURE DECLARATIVE_ANIMATION MODEL_SIMULATION GENERATIVE_MEDIA PDP_SYNTHETIC_FIXTURE distinct and truthful"
    missingRequiredField: DENIED_WITH_SOURCE_RETAINED
    acceptance: DEFINITION_ONLY_NO_NEW_DATA_STORE
scientificReferenceOracles:
  - id: media.declarative.oracle.force-motion.v1
    assumptions: constant-net-force constant-mass 1D zero-initial-position zero-initial-velocity no-friction
    testInputs: {massKg: 2, forceN: 6, durationS: 2, initialVelocityMPerS: 0}
    expected: {accelerationMPerS2: 3, finalVelocityMPerS: 6, displacementM: 6}
    check: typed-units analytical-math independent-solver-output tolerance-verified residual-recorded
    sourceClass: MODEL_SIMULATION
    state: ANALYTICAL_ORACLE_DECLARED_ONLY_NO_SOLVER_QUALIFICATION
publicIntegrationAdapters:
  gharbatai: {input: authorized-product-journey-and-seed-lease, output: REAL_CAPTURE-and-product-owned-postcondition-receipt, productBusinessAuthority: Gharbatai, mediaAuthority: capture-render-qa}
