  - id: media.declarative.value.model-execution-spec.v1
    ownerDomainRef: media.domain.simulation-world
    structuralType: closed-versioned-object
    runtimeAdmission: NOT_ADMITTED
    requiredFields: [modelFamilyRef, modelVersionRef, familyApplicability, familyQualificationRef, familyQualificationState, replayability, modelDigest, declaredAssumptionsRef, solverId, solverVersion, solverBuildDigest, numericPrecision, initialConditionsRef, boundaryConditionsRef, unitsRegistryRef, parameterRevisionRef, tSimClockRef, stepPolicy, toleranceContractRef, fidelityProfileRef, resourceBounds, seedPolicy, randomnessSemantics, distributionRef, samplingConditionsRef, samplingPlanRef]
    schemaAuthorities:
      - .product-experience/pdp-1-domain-data/domain-objects.yaml#objects/@id=media.domain.simulation-world
      - .product-experience/pdp-0-product-truth/requirements.yaml#requirements/@id=MEDIA-REQ-CAP-SIMULATION/acceptanceCases/@id=MEDIA-REQ-CAP-SIMULATION-AC-01
      - .product-experience/pdp-0-product-truth/requirements.yaml#requirements/@id=MEDIA-REQ-CAP-SIMULATION/acceptanceCases/@id=MEDIA-REQ-CAP-SIMULATION-AC-03
      - .product-experience/pdp-1-domain-data/value-objects.yaml#ownerDescriptorDefinitions/records/@id=media.value.replay-provenance-definition/schema/properties/randomnessSemantics
      - .product-experience/pdp-1-domain-data/value-objects.yaml#canonicalConversionDefinitions/records/@id=media.value.rational-media-time
      - .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/records/@id=media.operation.capability.media-simulation-scientific-demo/requestSchema
    schema:
      type: object
      additionalProperties: false
      required: [modelFamilyRef, modelVersionRef, familyApplicability, familyQualificationRef, familyQualificationState, replayability, modelDigest, declaredAssumptionsRef, solverId, solverVersion, solverBuildDigest, numericPrecision, initialConditionsRef, boundaryConditionsRef, unitsRegistryRef, parameterRevisionRef, tSimClockRef, stepPolicy, toleranceContractRef, fidelityProfileRef, resourceBounds, seedPolicy, randomnessSemantics, distributionRef, samplingConditionsRef, samplingPlanRef]
      properties:
        modelFamilyRef: {$ref: '#/$defs/existingSimulationCapabilityLeafId'}
        modelVersionRef: {$ref: '#/$defs/versionRef'}
        familyApplicability: {$ref: '#/$defs/familyApplicability'}
        familyQualificationRef: {$ref: '#/$defs/versionRef'}
        familyQualificationState: {enum: [QUALIFIED, UNQUALIFIED, UNKNOWN]}
        replayability: {enum: [REPLAYABLE, NON_REPLAYABLE, UNKNOWN]}
        modelDigest: {$ref: '#/$defs/digest'}
        declaredAssumptionsRef: {$ref: '#/$defs/versionRef'}
        solverId: {$ref: '#/$defs/opaqueId'}
        solverVersion: {$ref: '#/$defs/versionRef'}
        solverBuildDigest: {$ref: '#/$defs/digest'}
        numericPrecision: {type: string, minLength: 1, maxLength: 128, pattern: '\S'}
        initialConditionsRef: {$ref: '#/$defs/versionRef'}
        boundaryConditionsRef: {$ref: '#/$defs/versionRef'}
        unitsRegistryRef: {$ref: '#/$defs/versionRef'}
        parameterRevisionRef: {$ref: '#/$defs/versionRef'}
        tSimClockRef: {$ref: '#/$defs/simulationClock'}
        stepPolicy: {$ref: '#/$defs/versionRef'}
        toleranceContractRef: {$ref: '#/$defs/versionRef'}
        fidelityProfileRef: {$ref: '#/$defs/versionRef'}
        resourceBounds: {$ref: '#/$defs/resourceBounds'}
        seedPolicy: {$ref: '#/$defs/versionRef'}
        randomnessSemantics: {$ref: '#/$defs/randomnessSemantics'}
        distributionRef: {$ref: '#/$defs/versionRef'}
        samplingConditionsRef: {$ref: '#/$defs/versionRef'}
        samplingPlanRef: {$ref: '#/$defs/versionRef'}
      allOf:
        - if: {properties: {randomnessSemantics: {properties: {disposition: {const: UNKNOWN}}, required: [disposition]}}, required: [randomnessSemantics]}
          then: {properties: {replayability: {enum: [NON_REPLAYABLE, UNKNOWN]}}}
    familyBindingInvariant: modelFamilyRef is the exact existing simulation capability leaf identity (for example media.simulation.agent), never the shared media.simulation category. familyApplicability is nested under that exact modelFamilyRef and modelVersionRef, so no independently supplied family/version pair can mismatch; familyQualificationRef and familyQualificationState apply only to the same enclosing pair. UNKNOWN or NOT_ADMITTED applicability rejects execution. Qualification and replay claims require matching source-bound evidence and execution profile; execution alone does not qualify a model.
    applicabilityAdmissionRule: ADMITTED requires at least one versioned source evidence reference. UNKNOWN, NOT_ADMITTED, unsupported, or unresolved family applicability is not executable and must be rejected. This is a domain applicability disposition, not owner authorization or scientific qualification.
    familyApplicabilityValidationContract:
      contractVersion: media.declarative.family-applicability-validation.v1
      validationMode: SOURCE_BOUND_REFERENTIAL_VALIDATION
      familyIdentity:
        identityAuthoritySource: .product-experience/pdp-0-product-truth/capabilities.yaml#capabilities
        supportedFamilyIds: [media.simulation.rigid-body, media.simulation.soft-body, media.simulation.cloth, media.simulation.rope, media.simulation.particle, media.simulation.fluid, media.simulation.smoke, media.simulation.fire, media.simulation.collision, media.simulation.constraint, media.simulation.vehicle, media.simulation.crowd, media.simulation.agent, media.simulation.human-motion, media.simulation.procedural-world, media.simulation.camera-experiment, media.simulation.lighting-experiment, media.simulation.educational-demo, media.simulation.scientific-demo, media.simulation.robotics, media.simulation.kinematics, media.simulation.synthetic-data]
        supportedIdsMustResolveAsExactCapabilityLeaves: true
        forbiddenFamilyIds: [media.simulation, media.simulation.output]
        rejectAnyUnlistedOrUnsupportedFamilyId: true
      applicabilityEvidence:
        resolveEveryEvidenceRef: true
        minimumResolvedEvidenceRecords: 1
        resolvedRecordMustMatch:
          modelFamilyRef: EXACT_EQUAL_TO_ENCLOSING_MODEL_FAMILY_REF
          modelVersionRef: EXACT_EQUAL_TO_ENCLOSING_MODEL_VERSION_REF
          applicabilityDisposition: ADMITTED
        requiredAuthorizedAuthoritySource:
          authorityRefMustResolve: true
          authorityRecordMustDeclare:
            authorityRole: QUALIFIED_DOMAIN_OWNER
            authorizationDisposition: AUTHORIZED_FOR_EXACT_FAMILY_AND_MODEL_VERSION
            modelFamilyRef: EXACT_EQUAL_TO_ENCLOSING_MODEL_FAMILY_REF
            modelVersionRef: EXACT_EQUAL_TO_ENCLOSING_MODEL_VERSION_REF
        applicabilityCanBeAdmittedOnlyWhenAllEvidenceAndAuthorityChecksPass: true
        noAdmissionRecordOrOwnerAuthorizationIsAssertedByThisContract: true
    operationSchemaRelations:
      - caseId: MEDIA-REQ-CAP-SIMULATION-AC-01
        relation: CONSUMED_BY
        fieldMapping: NOT_ASSERTED
        p0CaseSource: .product-experience/pdp-0-product-truth/requirements.yaml#requirements/@id=MEDIA-REQ-CAP-SIMULATION/acceptanceCases/@id=MEDIA-REQ-CAP-SIMULATION-AC-01
        requestSchemaSource: .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/records/@id=media.operation.capability.media-simulation-agent/requestSchema
        resultSchemaSource: .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/records/@id=media.operation.capability.media-simulation-agent/resultSchema
        basis: Core simulation acceptance mapping for the exact existing media.simulation.agent leaf; unsupported or unrepresented family leaves remain rejected by the family applicability validator.
      - caseId: MEDIA-REQ-CAP-SIMULATION-AC-03
        relation: CONSUMED_BY
        fieldMapping: NOT_ASSERTED
        p0CaseSource: .product-experience/pdp-0-product-truth/requirements.yaml#requirements/@id=MEDIA-REQ-CAP-SIMULATION/acceptanceCases/@id=MEDIA-REQ-CAP-SIMULATION-AC-03
        requestSchemaSource: .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/records/@id=media.operation.capability.media-simulation-agent/requestSchema
        resultSchemaSource: .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/records/@id=media.operation.capability.media-simulation-agent/resultSchema
        basis: Core agent-based simulation acceptance mapping; the exact leaf and model version remain required and no economic or epidemiological leaf applicability is inferred.
      - caseId: MEDIA-DECL-P0-AC-018
        relation: CONSUMED_BY
        fieldMapping: NOT_ASSERTED
        requestSchemaSource: .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/records/@id=media.operation.capability.media-simulation-scientific-demo/requestSchema
        resultSchemaSource: .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/records/@id=media.operation.capability.media-simulation-scientific-demo/resultSchema
        basis: Case 018 pins model identity before admission; relation is semantic and makes no field-equivalence claim.
      - caseId: MEDIA-DECL-P0-AC-021
        relation: CONSUMED_BY
        fieldMapping: NOT_ASSERTED
        requestSchemaSource: .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/records/@id=media.operation.capability.media-simulation-scientific-demo/requestSchema
        resultSchemaSource: .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/records/@id=media.operation.capability.media-simulation-scientific-demo/resultSchema
        basis: Case 021 requires explicit solver/fidelity selection; this relation does not assert field identity.
    negativeCases: [unknown-property, wrong-numeric-precision-type, empty-digest, unknown-randomness-with-replay-claim, missing-solver-or-model-version, unsupported-family-capability-id, unknown-model-family, admitted-applicability-with-empty-evidence, evidence-bound-to-another-family-or-model-version, unresolved-applicability-evidence-ref, missing-or-unauthorized-authority-source, unknown-family-applicability-execution, qualification-transfer-between-families, replay-claim-without-versioned-prng-implementation]
    invariant: "pinned domain-owned equations and constraints, qualified execution only and no implicit model rewrite"
    randomnessSemanticsRef: .product-experience/pdp-1-domain-data/value-objects.yaml#ownerDescriptorDefinitions/records/@id=media.value.replay-provenance-definition/schema/properties/randomnessSemantics
    randomnessRule: SPECIFIED carries exact versioned PRNG, stream, seed-policy/material and checkpoint-state references; NOT_APPLICABLE requires a versioned non-stochastic declaration; UNKNOWN cannot support a replay claim
    missingRequiredField: DENIED_WITH_SOURCE_RETAINED
    acceptance: DEFINITION_ONLY_NO_NEW_DATA_STORE
  - id: media.declarative.value.active-speaker-cut-proposal.v1
    ownerDomainRef: media.domain.timeline
    structuralType: closed-versioned-object
    runtimeAdmission: NOT_ADMITTED
    requiredFields: [schemaVersion, proposalRef, timelineRef, sourceRevisionRef, proposedCuts, uncertaintyRef, proposalDisposition]
    schemaAuthorities:
      - .product-experience/pdp-1-domain-data/domain-objects.yaml#objects/@id=media.domain.timeline
      - .product-experience/pdp-1-domain-data/operations.yaml#capabilityOperationContracts/records/@id=media.operation.capability.media-compose-multitrack-timeline/resultSchema
      - .product-experience/pdp-0-product-truth/requirements.yaml#requirements/@id=MEDIA-REQ-CAP-COMPOSE/acceptanceCases/@id=MEDIA-REQ-CAP-COMPOSE-AC-03
    schema:
      type: object
      additionalProperties: false
      required: [schemaVersion, proposalRef, timelineRef, sourceRevisionRef, proposedCuts, uncertaintyRef, proposalDisposition]
      properties:
        schemaVersion: {const: media.declarative.value.active-speaker-cut-proposal.v1}
        proposalRef: {$ref: '#/$defs/versionRef'}
        timelineRef: {$ref: '#/$defs/versionRef'}
        sourceRevisionRef: {$ref: '#/$defs/versionRef'}
