      parentIdentityContracts:
        - objectRef: media.domain.quality-assessment
          selector: .product-experience/pdp-1-domain-data/domain-objects.yaml#ownerTypedIdentityContracts/records/@id=media.identity-contract.quality-assessment
          identityTuple:
            - tenantId
            - outputArtifactVersionRef
            - assessmentId
            - methodVersion
      childIdentityContracts:
        - objectRef: media.domain.artifact-version
          selector: .product-experience/pdp-1-domain-data/domain-objects.yaml#ownerTypedIdentityContracts/records/@id=media.identity-contract.artifact-version
          identityTuple: *a6
        - objectRef: media.domain.processing-job
