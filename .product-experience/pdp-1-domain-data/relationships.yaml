        - objectRef: media.domain.media-run
          selector: .product-experience/pdp-1-domain-data/domain-objects.yaml#ownerTypedIdentityContracts/records/@id=media.identity-contract.media-run
          identityTuple: *a7
      sameTenantRequired: true
      cardinalityRule: One assessment may bind one or more explicitly selected typed subjects; one subject may have many assessments across methods, versions, and times. No one-summary-per-job assumption.
      exactVersionRule: Artifact subjects bind exact artifactId/versionId; job and run subjects bind their exact canonical tuples. Assessment identity also binds methodVersion and output subject scope.
      lifecycleRule: Assessments are immutable observations; a new method, subject version, or rerun creates a distinct assessment. Supersession never rewrites historical evidence.
      deletionRule: Assessment records follow subject retention/erasure and legal-hold rules; assessment presence does not make a subject available or authorized.
      lineageRule: No lineage edge is implied by this relationship unless explicitly stated in its exact version rule.
