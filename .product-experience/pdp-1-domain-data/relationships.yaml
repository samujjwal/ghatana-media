          selector: .product-experience/pdp-1-domain-data/domain-objects.yaml#ownerTypedIdentityContracts/records/@id=media.identity-contract.artifact-version
          identityTuple: *a6
      sameTenantRequired: true
      cardinalityRule: A derived version may reference zero or more exact parent versions; parent edges are directed and may not self-reference.
      exactVersionRule: Each endpoint binds exact tenantId, artifactId, and versionId; content digest is integrity evidence, never identity.
      lifecycleRule: Derivation is immutable and records every declared parent; revisions add new nodes/edges rather than mutate prior lineage.
      deletionRule: Erasure/holds apply across lineage according to exact retention policy; source deletion is not inferred from derivative deletion. Lineage must be acyclic.
      lineageRule: No lineage edge is implied by this relationship unless explicitly stated in its exact version rule.
      runtimeParity: NOT_ADMITTED; this logical identity relationship does not assert persistence or transport equivalence
