crossSourceReconciliation:
  status: unresolved; no source projection is selected as canonical
  conflicts:
    - conflictId: state-conflict.retry-pending-vs-retrying
      sourceSpellings: [RETRY_PENDING, RETRYING]
      sourceRefs:
        - .product-experience/pdp-0-product-truth/state-models.yaml#media-job
        - modules/speech/stt-service/src/main/java/com/ghatana/stt/job/AvTranscriptionJob.java#JobStatus
        - modules/speech/stt-service/src/main/java/com/ghatana/stt/job/AvJobLifecycleAdapter.java#mapStatus
        - modules/speech/stt-service/src/main/java/com/ghatana/stt/job/AvJobLifecycleAdapter.java#canonicalMediaState
        - libs/audio-video-types/src/contracts.ts#LegacyMediaJobStateSchema
      observation: PDP-0 job proposal uses RETRY_PENDING; Java exposes RETRY_PENDING and deprecated RETRYING; TypeScript retains RETRYING as legacy and maps it to RETRY_PENDING; adapter projection behavior is not adopted as product meaning
      mappingDisposition: unresolved; preserve both exact spellings and source-specific roles
      reason: source generation and compatibility behavior do not establish semantic equivalence
      owner: media-domain-owner plus Java-and-TypeScript contract owners
    - conflictId: state-conflict.cancel-requested-vs-cancelling
      sourceSpellings: [CANCEL_REQUESTED, CANCELLING]
      sourceRefs:
        - .product-experience/pdp-0-product-truth/state-models.yaml#media-attempt
        - libs/audio-video-types/src/contracts.ts#LegacyMediaJobStateSchema
        - libs/audio-video-types/src/contracts.ts#normalizeLegacyMediaJobState
        - libs/audio-video-ui/src/components/MediaTaskFlow.tsx#LegacyMediaTaskOperationState
      observation: PDP-0 models CANCEL_REQUESTED on the attempt machine; TypeScript and UI retain CANCELLING as a legacy job/presentation spelling and the TypeScript helper maps it to RUNNING
      mappingDisposition: unresolved; no job-to-attempt or presentation mapping accepted
      reason: machine dimension differs and the observed lossy mapping collapses a cancellation-in-progress spelling into RUNNING
      owner: media-domain-owner plus TypeScript-and-UI contract owners
    - conflictId: state-conflict.unknown-reconciling-partial-outcomes
      sourceSpellings: [OUTCOME_UNKNOWN, RECONCILING, PARTIALLY_SUCCEEDED]
      sourceRefs:
        - .product-experience/pdp-0-product-truth/state-models.yaml#media-job
        - .product-experience/pdp-0-product-truth/state-models.yaml#media-delivery
        - libs/audio-video-types/src/contracts.ts#MediaJobStateSchema
        - contracts/openapi/media.yaml#/components/schemas/PlatformOperation
      observation: names recur in different machines and projections with distinct source contexts; TypeScript, Java, simulation, and PDP-0 do not supply one shared finality contract
      mappingDisposition: unresolved per machine and projection; do not collapse unknown, reconciling, or partial outcome into success, failure, or running
      reason: source-specific finality, machine dimension, and external-effect semantics are not uniform or owner-approved
      owner: media-domain-owner plus runtime-and-API-contract owners
