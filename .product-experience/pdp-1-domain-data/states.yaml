          ownerCurrentMeaning: A prior scoped verification was revoked; new work is blocked and in-flight effects require the relevant authority’s reconciliation.
          ownerCurrentMeaningStatus: OWNER_DEFINED_DEFINITION_ONLY; legal/contract authority remains external; independent-review-open; runtime-observation-UNKNOWN

        - id: EXPIRED
          meaning: The verified scope validity elapsed; block new work pending current evidence.
          ownerCurrentMeaning: The declared verification validity elapsed; new rights-dependent work is blocked until current evidence is reviewed.
          ownerCurrentMeaningStatus: OWNER_DEFINED_DEFINITION_ONLY; legal/contract authority remains external; independent-review-open; runtime-observation-UNKNOWN

