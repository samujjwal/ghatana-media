        observedMapping: {CREATED: PENDING, QUEUED: QUEUED, PROCESSING: RUNNING, COMPLETED: COMPLETED, FAILED: FAILED, CANCELLED: CANCELLED, RETRY_PENDING: RETRYING, RETRYING: RETRYING, OUTCOME_UNKNOWN: RUNNING, RECONCILING: RUNNING}
