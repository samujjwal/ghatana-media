schemaVersion: media.pdp-1.state-adjudication.v1
artifactId: media.pdp-1.state-adjudication
productId: media
semanticOwner: media
authority: .product-experience/pdp-0-product-truth/state-models.yaml
status: bounded-canonical-policy-owner-approved;
  implementation-and-independent-PDP-1-review-pending
machineDimensions:
  - machineId: media-job
    dimension: logical-job-outcome-and-observation
    proposedMeanings:
      QUEUED: accepted-for-scheduling; does-not-prove-worker-claim-or-dispatch
      RUNNING: execution-observed-in-progress; does-not-prove-current-worker-lease
      RETRY_PENDING: prior-attempt-ended-or-was-abandoned-and-another-attempt-may-be-eligible;
        does-not-mean-retry-dispatched
      OUTCOME_UNKNOWN: effect-or-commit-may-have-occurred-but-authoritative-outcome-is-not-known
      RECONCILING: evidence-gathering-to-resolve-an-unknown-outcome; not-a-terminal-result
      COMPLETED: job-contract-defined-success-finality;
        exact-success-criteria-remain-operation-specific
      PARTIALLY_SUCCEEDED: some-declared-sub-effects-succeeded-and-others-did-not-or-remain-unknown;
        exact-accounting-contract-required
      FAILED: job-contract-defined-failure-finality; does-not-imply-safe-retry
      CANCELLED: cancellation-confirmed-under-job-contract;
        a-request-alone-is-not-confirmation
    spellingConflict:
      RETRYING: legacy attempt-in-progress-or-UI-label;
        not-equivalent-to-job-RETRY_PENDING;
        retain-raw-spelling-and-require-observation-evidence
      ACCEPTED: ingress-request-receipt-only; not-equivalent-to-durable-job-QUEUED
  - machineId: media-attempt
    dimension: one-execution-attempt-and-its-dispatch-evidence
    proposedMeanings:
      CLAIMED: worker or scheduler has claimed an attempt under the execution contract
      DISPATCH_INTENT_RECORDED: durable intent is recorded before external dispatch if
        persistence guarantee is accepted
      DISPATCHED: dispatch was recorded; provider effect may still be unknown
      RUNNING: execution progress has been observed for this attempt
      CANCEL_REQUESTED: cancellation request was issued; provider cancellation is unconfirmed
      CANCEL_CONFIRMED: provider or execution authority confirmed cancellation
      SUCCEEDED: attempt result succeeded; logical job success may still require
        aggregation
      FAILED: attempt failed; logical job finality/retry eligibility remains separate
      OUTCOME_UNKNOWN: attempt effect or completion cannot currently be determined
      SUPERSEDED: a later fenced attempt or authoritative resolution supersedes this
        attempt observation
    spellingConflict:
      CANCELLING: legacy-observer-label-only; no-canonical-job-state;
        attempt-level-CANCEL_REQUESTED-is-distinct-and-unconfirmed
  - machineId: media-upload-and-artifact
    dimension: product-artifact-lifecycle-not-upload-session-transport-state
    sourceRef: .product-experience/pdp-0-product-truth/state-models.yaml#media-upload-and-artifact
    boundedDecisionRef: .product-experience/decision-log.md#PXD-049
    acceptedBoundedMeanings:
      RECEIVING: bounded-upload-session-is-accepting-ordered-parts;
        does-not-establish-an-artifact-or-availability
      VERIFYING: completed-upload-is-being-checked-for-required-integrity-format-security-rights-and-policy-dispositions
      AVAILABLE: all-applicable-verification-checks-currently-positive-for-the-exact-artifact-version-and-current-use-scope
      QUARANTINED: required-evidence-is-missing-stale-unsupported-or-ambiguous;
        use-is-denied-pending-reconciliation
      REJECTED: an-authoritative-format-security-rights-consent-or-policy-check-denied-the-artifact-or-intended-use
    remainingStateIds:
      [
        EXPIRED,
        ERASURE_REQUESTED,
        ACCESS_REVOKED,
        PHYSICAL_ERASURE_PENDING,
        BLOCKED_BY_HOLD,
        ERASURE_CONFIRMED,
        EXTERNAL_ERASURE_UNCONFIRMED
      ]
    remainingStateDisposition: source-proposal-retained;
      only-RECEIVING-VERIFYING-AVAILABLE-QUARANTINED-REJECTED-meaning-guards-accepted-bounded-by-PXD-049
    uploadSessionProjection:
      source: runtime-contracts/src/main/java/com/ghatana/media/runtime/MediaRuntimeContracts.java#UploadStatus
      runtimeStates:
        OPEN: receiving-session; progress-observation-only
        FINALIZING: completion-is-being-reconciled; does-not-prove-artifact-availability
        COMPLETED: session-finalization-and-artifact-identity-observed;
          product-artifact-remains-VERIFYING-until-separate-required-disposition
        ABORTED: upload-session-stopped;
          no-equivalent-artifact-REJECTED-transition-is-inferred
        EXPIRED: upload-session-expired;
          no-artifact-expiry-or-erasure-is-inferred-without-artifact-identity-and-retention-evidence
      explicitNonMappings:
        - UploadSession-COMPLETED-is-not-artifact-AVAILABLE
        - UploadSession-EXPIRED-is-not-physical-erasure
        - UploadSession-ABORTED-is-not-verification-REJECTED
        - metadata-or-opaque-objectReference-is-not-rights-approval-or-byte-access
    verificationGate:
      decisionRef: .product-experience/decision-log.md#PXD-049
      admissionState: definition-only
      runtimeAdmission: NOT_ADMITTED
      availableRequiresAll:
        - exact-tenantId-artifactId-and-stable-opaque-immutable-versionId-match
        - exact-byte-size-and-full-content-digest-match-for-that-version;
          sha256-lowercase-64-hex-digits
        - detected-format-and-required-format-policy-check-record
        - security-scan-and-parser-validation-check-record
        - current-tenant-and-principal-scoped-rights-decision-for-intended-use
        - current-consent-decision-where-required
        - applicable-policy-decision-and-retention-disposition
      checkRecordFields:
        [
          tenantId,
          subjectArtifactId,
          subjectArtifactVersionId,
          byteSize,
          fullContentDigest,
          intendedUseOrNotApplicable,
          evaluatedPrincipalIdOrNotApplicable,
          checkKind,
          authorityRef,
          decision,
          observedAt,
          policyOrMethodVersion,
          evidenceRef,
          expiresAtOrNotApplicable
        ]
      digestFormat: sha256-lowercase-64-hex-digits;
        compared-as-full-digest-not-prefix-or-sampled-content
      policySourceRefs:
        [
          .product-experience/pdp-0-product-truth/policy-authority-model.yaml#productPolicy,
          .product-experience/pdp-0-product-truth/policy-authority-model.yaml#productPolicy.enforcementPoints,
          .product-experience/pdp-0-product-truth/qualification-policy.yaml#securityAndRightsBaseline,
          docs/MEDIA_PRIVACY_AND_RETENTION_POLICY.md#41-mandatory-consent,
          docs/MEDIA_PRIVACY_AND_RETENTION_POLICY.md#5-retention-and-physical-erasure
        ]
      policyCheckSourceRecords:
        formatAndAdmission: .product-experience/pdp-0-product-truth/policy-authority-model.yaml#productPolicy.enforcementPoints[point=upload-and-import-admission]
        securityAndRights: .product-experience/pdp-0-product-truth/qualification-policy.yaml#securityAndRightsBaseline
        currentAccessRightsAndConsent: .product-experience/pdp-0-product-truth/policy-authority-model.yaml#productPolicy.enforcementPoints[point=artifact-fetch-and-cache-reuse]
        consentAuthorityAndScope: docs/MEDIA_PRIVACY_AND_RETENTION_POLICY.md#41-mandatory-consent
        retentionExpiryAuthority: docs/MEDIA_PRIVACY_AND_RETENTION_POLICY.md#5-retention-and-physical-erasure
      dispositionRules:
        AVAILABLE: every-applicable-check-has-current-positive-authority-record-bound-to-exact-tenant-artifact-versionId-size-and-full-digest
        VERIFYING: required-check-is-in-progress-or-authoritative-result-is-not-yet-available
        QUARANTINED: evidence-is-missing-stale-unsupported-ambiguous-or-cannot-be-safely-evaluated;
          deny-use-pending-reconciliation
        REJECTED: authoritative-format-security-rights-consent-or-policy-decision-denies-the-artifact-or-intended-use
      expiryBoundary: EXPIRED-is-a-separate-authoritative-retention-lifecycle-disposition-outside-T02;
        expired-check-evidence-leaves-artifact-QUARANTINED-or-REJECTED-until-the-governed-lifecycle-action-is-recorded
      expiryAndFreshness: every-currentness-check-is-revalidated-at-use;
        expiresAt-is-authority-supplied;
        no-self-issued-or-inferred-verification-authority
      issuerBoundary: use-existing-format-security-rights-consent-retention-and-policy-authorities-referenced-by-pdp0-and-MEDIA_PRIVACY_AND_RETENTION_POLICY;
        no-new-issuer-or-operation-is-defined
    boundedStatus: bounded-upload-admission-verification-availability-and-quarantine-disposition-meanings-under-PXD-049;
      implementation-independent-qualification-and-all-other-lifecycle-state-meanings-remain-open
  - machineId: media-delivery
    dimension: external-delivery-effect-and-recipient-evidence
    proposedMeanings:
      OUTCOME_UNKNOWN: remote submission or effect is not authoritatively known
      RECONCILING: destination evidence is being gathered
      PARTIALLY_DELIVERED: only declared subset of intended delivery is acknowledged
    separation: same spelling in media-job or media-attempt is not same state
      identity; retain machine id
  - machineId: media-stream-session
    dimension: stream-session-state
    sourceRef: .product-experience/pdp-1-domain-data/states.yaml#stateMachines/@machineId=media-stream-session
    transitionRefs:
      - .product-experience/pdp-1-domain-data/transitions.yaml#transitionRecords/@id=media-stream-session/T01
      - .product-experience/pdp-1-domain-data/transitions.yaml#transitionRecords/@id=media-stream-session/T02
      - .product-experience/pdp-1-domain-data/transitions.yaml#transitionRecords/@id=media-stream-session/T03
      - .product-experience/pdp-1-domain-data/transitions.yaml#transitionRecords/@id=media-stream-session/T04
    proposedMeanings:
      OPEN: authorized tenant-scoped session and protected reconnect-token reference exist; live provider connection and frame acceptance are not implied
      CONNECTED: current provider connection and reconnect lease are observed
      DEGRADED: continuation is limited by the declared degradation policy
      DRAINING: new frames are fenced while active work and provider close are resolved
      CLOSED: no new frame or reconnect is accepted and provider close is recorded
      FAILED: session cannot continue; accepted frames and uncertain remote effects remain auditable
    distinctions:
      request-acceptance-is-not-session-open: true
      close-request-is-not-provider-close: true
    disposition: owner-definition-proposal; independent-review-open; provider-and-runtime-observation-UNKNOWN
  - machineId: media-rights-and-consent
    dimensions:
      - dimension: rights-assertion-disposition
        stateDefinitionRef: .product-experience/pdp-1-domain-data/states.yaml#stateMachines/media-rights-and-consent/stateDefinitionsByDimension/rightsAssertion
        proposedMeanings:
          ASSERTED: claimant assertion only; no rights-dependent effect is authorized
          UNDER_REVIEW: scoped authority evaluates evidence; protected use remains blocked
          VERIFIED_FOR_DECLARED_SCOPE: authoritative verification applies only to its exact scope, evidence, territory, and validity
          RESTRICTED: only the narrower recorded scope may be permitted
          REJECTED: authority rejected the asserted scope; new evidence requires a new review
          REVOKED: prior scoped verification was revoked; new work is blocked and in-flight effects require reconciliation
          EXPIRED: verification validity elapsed; current evidence is required before new rights-dependent work
        disposition: owner-definition-proposal; external legal/licensor authority; independent-review-open
      - dimension: consent-authority-disposition
        stateDefinitionRef: .product-experience/pdp-1-domain-data/states.yaml#stateMachines/media-rights-and-consent/stateDefinitionsByDimension/consent
        proposedMeanings:
          PENDING_VERIFICATION: recorded request only; consent-dependent processing is blocked
          ACTIVE: trusted authority verified exact tenant, principal, purpose, region, and validity; recheck at each effect
          REVOKED: trusted authority recorded revocation; new work is blocked and in-flight effects require separate reconciliation
          EXPIRED: consent validity elapsed; current authority decision is required
          SUPERSEDED: newer authoritative record replaces this one; old record cannot authorize new work
        disposition: owner-definition-proposal; external consent authority; independent-review-open
    transitionRefs:
      - .product-experience/pdp-1-domain-data/transitions.yaml#transitionRecords/@id=media-rights-and-consent/rights/T01
      - .product-experience/pdp-1-domain-data/transitions.yaml#transitionRecords/@id=media-rights-and-consent/rights/T02
      - .product-experience/pdp-1-domain-data/transitions.yaml#transitionRecords/@id=media-rights-and-consent/consent/T01
      - .product-experience/pdp-1-domain-data/transitions.yaml#transitionRecords/@id=media-rights-and-consent/consent/T02
    identityRule: state-identity-includes-machine-and-dimension; equal state spellings across dimensions do not imply equivalence
  - machineId: media-review
    dimension: review-disposition
    sourceRef: .product-experience/pdp-1-domain-data/states.yaml#stateMachines/@machineId=media-review
    stateIds: [DRAFT, REQUESTED, IN_REVIEW, CHANGES_REQUESTED, APPROVED, REJECTED, WITHDRAWN, SUPERSEDED, EXPIRED]
    versionBinding: every decision is bound to exact immutable version and purpose; a changed version requires a new review request
    authorityBoundary: APPROVED applies only within current reviewer delegation and does not satisfy independent policy gates
    transitionRefPrefix: .product-experience/pdp-1-domain-data/transitions.yaml#transitionRecords/@id=media-review/
    disposition: owner-definition-proposal; independent-review-open; runtime-observation-UNKNOWN
  - machineId: media-quality-disposition
    dimension: quality-disposition
    sourceRef: .product-experience/pdp-1-domain-data/states.yaml#stateMachines/@machineId=media-quality-disposition
    stateIds: [NOT_ASSESSED, ASSESSING, PASS, FAIL, ABSTAINED, REVIEW_REQUIRED, SUPERSEDED]
    versionBinding: assessment is tied to exact output version, applicable metric, and declared protocol
    outcomeBoundary: PASS is protocol-scoped; ABSTAINED is not PASS; quality result alone does not authorize protected use
    transitionRefPrefix: .product-experience/pdp-1-domain-data/transitions.yaml#transitionRecords/@id=media-quality-disposition/
    disposition: owner-definition-proposal; independent-review-open; runtime-observation-UNKNOWN
  - machineId: media-project
    dimension: project-container-lifecycle
    sourceRef: .product-experience/pdp-1-domain-data/states.yaml#stateMachines/@machineId=media-project
    stateIds: [ACTIVE, ARCHIVED]
    proposedMeanings:
      ACTIVE: current-authority reads and versioned changes are permitted subject to current membership and policy checks
      ARCHIVED: retained project excluded from ordinary active work; revision history remains
    authorityBoundary: project state does not grant membership or action authority
    transitionRefPrefix: .product-experience/pdp-1-domain-data/transitions.yaml#transitionRecords/@id=media-project/
    disposition: bounded-owner-definition-proposal; archive/restore guards and independent review open
  - machineId: media-project-version
    dimension: project-revision-lifecycle
    sourceRef: .product-experience/pdp-1-domain-data/states.yaml#stateMachines/@machineId=media-project-version
    stateIds: [DRAFT, COMMITTED, SUPERSEDED, CONFLICTED, ABANDONED]
    proposedMeanings:
      DRAFT: mutable candidate bound to an exact parent head; not canonical until guarded compare-and-set commit
      COMMITTED: immutable revision atomically accepted as project head after expected-head comparison and validation
      SUPERSEDED: immutable revision no longer current head; retained for authorized history and restore
      CONFLICTED: immutable commit attempt rejected because expected head was stale or a declared merge constraint failed
      ABANDONED: uncommitted draft explicitly abandoned or expired without changing project head
    identityRule: revisions are immutable identities; stale expected head cannot commit or overwrite a newer head
    transitionRefPrefix: .product-experience/pdp-1-domain-data/transitions.yaml#transitionRecords/@id=media-project-version/
    disposition: bounded-owner-definition-proposal; draft/branch/restore guards and independent review open
  - machineId: media-project-membership
    dimension: project-membership-lifecycle
    sourceRef: .product-experience/pdp-1-domain-data/states.yaml#stateMachines/@machineId=media-project-membership
    stateIds: [INVITED, ACTIVE, SUSPENDED, REVOKED, EXPIRED]
    proposedMeanings:
      INVITED: pending invitation; confers no project access
      ACTIVE: accepted membership relationship; each action still requires current grant and project-policy checks
      SUSPENDED: relationship retained while project actions are blocked pending authorized reactivation or revocation
      REVOKED: membership ended; prior actions remain auditable and access is re-evaluated at each boundary
      EXPIRED: invitation expired without becoming active
    authorityBoundary: membership status is distinct from role grants and does not bypass per-action authorization
    transitionRefPrefix: .product-experience/pdp-1-domain-data/transitions.yaml#transitionRecords/@id=media-project-membership/
    disposition: owner-definition-proposal; independent-review-open; runtime-observation-UNKNOWN
crossProjectionDispositions:
  - source: runtime-contracts/src/main/java/com/ghatana/media/runtime/MediaRuntimeContracts.java#JobStatus
    observation: Media runtime emits ACCEPTED, RUNNING, OUTCOME_UNKNOWN, COMPLETED,
      FAILED, CANCELLED; it has no RETRY_PENDING, RECONCILING, or
      PARTIALLY_SUCCEEDED value
    disposition: current-runtime-enum-observed; per-state canonical and wire mapping
      unresolved; ACCEPTED is not evidence of durable job queueing
  - source: Java AvJobLifecycleAdapter.mapStatus
    observation: AvTranscriptionJob.JobStatus has CREATED, QUEUED, PROCESSING,
      COMPLETED, FAILED, CANCELLED, RETRYING; it has no OUTCOME_UNKNOWN or
      RECONCILING values for this adapter to map
    disposition: external-runtime-contract-is-too-narrow-to-represent-these-canonical-states;
      no mapping or runtime support inferred; Ghatana media owner decision
      required
  - source: ../ghatana/services/data-cloud/delivery/api/src/main/java/com/ghatana/datacloud/memory/media/MediaJobLifecycleAdapter.java#mapStatus
    observation: MediaProcessingJob.RETRYING maps to canonical RUNNING; BLOCKED and
      REQUIRES_REVIEW map to canonical FAILED
    disposition: lossy-external-projection; semantic mappings are not adopted;
      Ghatana Data Cloud owner must preserve raw source state or emit an
      explicit unmapped/unknown disposition
  - source: libs/audio-video-types/src/contracts.ts#normalizeLegacyMediaJobState
    observation: observeMediaJobState preserves raw CANCELLING/RETRYING with
      media-job machine identity and null canonicalState; the scalar
      compatibility wrapper returns the original raw value
    disposition: safe-local-observation; legacy state mapping remains unresolved and
      must not authorize cancel/retry
  - source: contracts/openapi/media.yaml#/components/schemas/PlatformOperation/properties/state
    observation: ACCEPTED, QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED
    disposition: narrower-transport-enum; each mapping unresolved
  - source: inspected active Media protobuf service declarations
    observation: no matching shared job-lifecycle enum found; engine and health
      enums represent other dimensions
    disposition: inventory-absence-only; not a support or exclusion decision
externalOwnerDependencies:
  - taskRefs: [ P1-02, X-06 ]
    ownerRepository: ghatana
    ownerArea: Data Cloud delivery API
    target: ../ghatana/services/data-cloud/delivery/api/src/main/java/com/ghatana/datacloud/memory/media/MediaJobLifecycleAdapter.java#mapStatus
    observedProblem: RETRYING is coerced to RUNNING and BLOCKED/REQUIRES_REVIEW are
      coerced to FAILED, erasing the source state dimension.
    requestedChange: Preserve the exact source status plus a loss/disposition
      record, or add an owner-admitted canonical mapping that retains
      retry-pending, blocked, and review-required distinctions. Do not map these
      values to execution-in-progress or terminal failure by convenience.
    requiredOwnerEvidence: Data Cloud contract-owner decision, consumer
      compatibility assessment, and negative tests showing unknown/raw values
      cannot authorize retry, finality, or execution claims.
    admissionStatus: external-owner-change-required; no cross-repository acceptance claimed
invariantsProposed:
  - state-identity-is-machine-plus-state-id; identical
    spelling-across-machines-does-not-imply-equivalence
  - request-acceptance-queueing-dispatch-running-and-effect-finality-are-distinct-observations
  - cancellation-request-and-confirmation-are-distinct
  - unknown-outcome-and-reconciliation-are-not-success-failure-or-running
  - partial-success-requires-explicit-sub-effect-accounting
  - state-alone-does-not-authorize-retry-cancel-delivery-or-other-action
  - observations-need-source-version-and-observed-at-to-support-freshness
negativeCases:
  status: canonical-policy-tests; does-not-verify-runtime-or-provider-behavior
  cases:
    - id: state-identity.same-spelling-different-machine
      given:
        [
          { machineId: media-job, stateId: RUNNING },
          { machineId: media-attempt, stateId: RUNNING }
        ]
      mustNot: infer-state-equivalence
    - id: ingress.ACCEPTED-is-not-job.QUEUED
      given: request-acceptance-receipt
      mustNot: assert-durable-queue-eligibility
    - id: retry.RETRY_PENDING-is-not-attempt-execution
      given: job-state-RETRY_PENDING
      mustNot: assert-new-attempt-claimed-or-dispatched
    - id: cancellation.CANCEL_REQUESTED-is-not-CANCELLED
      given: attempt-state-CANCEL_REQUESTED
      mustNot: assert-job-cancellation-finality
    - id: finality.OUTCOME_UNKNOWN-is-not-RUNNING
      given: authoritative-outcome-unavailable
      mustNot: normalize-to-RUNNING-or-authorize-replay
    - id: finality.PARTIALLY_SUCCEEDED-requires-closed-sub-effects
      given: undeclared-or-unresolved-sub-effect
      mustNot: assert-terminal-partial-success
    - id: delivery.COMPLETED-is-not-ACKNOWLEDGED
      given: valid-persisted-job-result
      mustNot: assert-recipient-delivery-acknowledgment
ownerAcceptedPolicyDecisions:
  authorityRef: .product-experience/reviews/2026-10-07-owner-decision-and-resolution.md#3-pdp-1-canonical-behavior-and-state-decisions
  decisionScope: canonical-product-semantics-only; no-provider-or-runtime-proof
  requestReceiptIsQueuedJob: false
  legacyRetryingIsCanonicalJobState: false
  legacyCancellingIsCanonicalJobState: false
  machineScopedStateIdentity: true
  partialSuccessRule: terminal-only-if-declared-sub-effects-have-explicit-closed-dispositions-and-no-consequential-unknown-effect
  completedRule: exact-output-set-integrity-authority-and-durable-result-commit-required;
    not-delivery-acknowledgement
  cancelledRule: authoritative-no-dispatch-or-confirmed-fenced-effects-finality;
    request-and-observer-detach-insufficient
  durableAttemptRule: append-only-attempt-history-with-unique-id-monotonic-fencing-and-restart-reconciliation
  unknownOutcomeRule: never-conflate-with-running-failure-or-safe-retry
  policyDispositionRefs:
    - .product-experience/acceptance.yaml#MEDIA-OWNER-20261007-04
    - .product-experience/acceptance.yaml#MEDIA-OWNER-20261007-05
    - .product-experience/acceptance.yaml#MEDIA-OWNER-20261007-06
    - .product-experience/acceptance.yaml#MEDIA-OWNER-20261007-07
  policyStatus: ACCEPTED
unresolvedOwnerDecisions: []
remainingImplementationAndIndependentProof:
  - observed-legacy-wire-and-client-projections-must-be-updated-with-loss-reporting-and-tested
  - storage-and-runtime-durable-command-attempt-history-fencing-and-recovery-must-be-proven
  - cancellation-and-finality-provider-observer-oracles-must-be-reconciled
  - full-PDP-1-semantic-and-independent-acceptance-remains-open
ownerDefinedProductDefinitionDomainRules:
  id: media.pdp1.product-definition-domain-rules.v1
  authorityRef: .product-experience/pdp-1-domain-data/state-adjudication.yaml#ownerAcceptedPolicyDecisions
  decisionRef: .product-experience/decision-log.md#PXD-035
  status: SIX_BOUNDED_ACCEPTED_RULES; projection-only;
    runtime-and-independent-P0-010-review-pending
  ruleAuthority: PDP-1 ownerAcceptedPolicyDecisions remains semantic authority;
    this collection supplies the exact PDP-0 ProductDefinition projection fields
    and adds no state, transition, runtime, transport, provider, or phase
    acceptance.
  records:
    - id: MEDIA-DOMAIN-RULE-001
      sourceDecisionRef: .product-experience/pdp-1-domain-data/state-adjudication.yaml#ownerAcceptedPolicyDecisions/machineScopedStateIdentity
      expectedDecisionValue: true
      statement: A state identifier is meaningful only together with its machine;
        equal spellings across job, attempt, upload, stream, or delivery
        machines do not establish equivalent state or behavior.
      violation: Reject a state mapping or action decision that omits machine identity
        or relies on spelling alone.
      trustScope: Every tenant and principal context; apply at state interpretation
        and effect authorization boundaries.
      trustContextRef: .product-experience/pdp-1-domain-data/authority.yaml#ownerDefinedPdp10AuthorityScopes/identityScope
      accountableOwner: media
      ownerRef: .product-experience/pdp-1-domain-data/authority.yaml#ownership/mediaProductSemantics
      failClosedResponse: Preserve the source observation and return
        blocked-or-review-required; do not normalize or execute an inferred
        action.
      projectionTargetRef: .product-experience/pdp-0-product-truth/constitution.yaml#domainRules/records/@id=MEDIA-DOMAIN-RULE-001
    - id: MEDIA-DOMAIN-RULE-002
      sourceDecisionRef: .product-experience/pdp-1-domain-data/state-adjudication.yaml#ownerAcceptedPolicyDecisions/requestReceiptIsQueuedJob
      expectedDecisionValue: false
      statement: A request receipt or ACCEPTED response proves receipt only; it does
        not prove durable queueing, worker claim, dispatch, or execution.
      violation: Reject a queue, claim, dispatch, or execution assertion that is
        supported only by request acknowledgment.
      trustScope: Every submission boundary, tenant and principal context.
      trustContextRef: .product-experience/pdp-1-domain-data/authority.yaml#ownerDefinedPdp10AuthorityScopes/identityScope
      accountableOwner: media
      ownerRef: .product-experience/pdp-1-domain-data/authority.yaml#ownership/mediaProductSemantics
      failClosedResponse: Report receipt-only or unknown outcome; do not expose a
        durable-queued claim or enable execution-dependent actions.
