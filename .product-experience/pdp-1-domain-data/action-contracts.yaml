schemaVersion: media.pdp-1.action-contracts.v1
artifactId: media.pdp-1.action-contracts
productId: media
semanticOwner: media
authority: .product-experience/pdp-1-domain-data/operations.yaml
status: host-neutral-outcome-contract-proposal; transport-adapters-unresolved
sourceRefs:
  - .product-experience/pdp-1-domain-data/operations.yaml
  - .product-experience/pdp-1-domain-data/states.yaml
  - .product-experience/pdp-1-domain-data/transitions.yaml
outcomeEnvelope:
  requiredFields: [contractVersion, outcome, operationRef, correlationRef, observedAt]
  optionalFields: [requestRef, resourceRef, sourceVersion, retryAfter, problemRef, effectEvidenceRef, freshness, partialResult]
  rules:
    - outcome-is-a-request-or-observation-result-not-a-domain-state
    - resourceRef-and-sourceVersion-are-present-only-when-established-by-adapter
    - absent-effect-evidence-does-not-mean-no-effect
    - all-retry-and-cancel-affordances-are-authoritative-host-decisions
outcomes:
  - id: REQUEST_STARTED
    meaning: local-adapter-has-begun-submitting-the-request
    proves: local-dispatch-attempt-began
    doesNotProve: server-receipt-or-domain-acceptance
  - id: REQUEST_ACKNOWLEDGED
    meaning: authoritative-boundary-acknowledged-request-according-to-its-transport-contract
    proves: request-receipt-only-unless-contract-defines-stronger-commit
    doesNotProve: processing-completion-or-external-effect-finality
  - id: PROCESSING
    meaning: latest-authoritative-observation-reports-in-progress
    proves: processing-observation-at-observedAt
    doesNotProve: currentness-after-observedAt-or-worker-lease-validity
  - id: COMPLETED
    meaning: operation-specific-completion-evidence-satisfies-defined-success-finality
    proves: only-effect-scope-and-result-defined-by-bound-operation-contract
    doesNotProve: rights-approval-quality-approval-or-delivery-unless-explicitly-in-contract
  - id: DENIED
    meaning: authority-boundary-rejected-request-or-effect
    proves: denial-for-reported-scope-at-observation-time
    doesNotProve: that-no-prior-effect-exists
  - id: CONFLICT
    meaning: conditional-update-or-version-precondition-did-not-match
    proves: submitted-change-not-accepted-under-reported-precondition
    doesNotProve: conflict-winner-or-safe-replay
  - id: FAILED
    meaning: operation-contract-reports-failure-finality-for-the-reported-scope
    proves: failure-only-as-defined-by-bound-operation
    doesNotProve: absence-of-partial-or-external-effects-or-safe-retry
  - id: UNAVAILABLE
    meaning: adapter-could-not-obtain-a-usable-authority-or-transport-response
    proves: no-current-authoritative-result-was-obtained
    doesNotProve: remote-service-failure-or-request-nonreceipt
  - id: UNKNOWN_OUTCOME
    meaning: request-or-effect-may-have-been-accepted-or-applied-but-result-is-not-authoritatively-known
    proves: outcome-is-unresolved
    doesNotProve: failure-success-or-safe-resubmission
  - id: CANCELLED_OBSERVATION
    meaning: an-authoritative-observation-confirms-cancellation-for-reported-scope
    proves: only-cancellation-scope-confirmed-by-bound-operation
    doesNotProve: cancellation-request-alone-stopped-work-or-reversed-prior-effects
operationFamilyBindings:
  media.operation.artifact-ingest: request-started-acknowledged-processing-completed-denied-conflict-failed-unavailable-unknown-outcome
  media.operation.job-lifecycle: request-started-acknowledged-processing-completed-denied-conflict-failed-unavailable-unknown-outcome-cancelled-observation
  media.operation.transcription: request-started-acknowledged-processing-completed-denied-conflict-failed-unavailable-unknown-outcome
  media.operation.synthesis: request-started-acknowledged-processing-completed-denied-conflict-failed-unavailable-unknown-outcome
  media.operation.vision-analysis: request-started-acknowledged-processing-completed-denied-conflict-failed-unavailable-unknown-outcome
  media.operation.multimodal-analysis: request-started-acknowledged-processing-completed-denied-conflict-failed-unavailable-unknown-outcome
  media.operation.stream-session: request-started-acknowledged-processing-completed-denied-conflict-failed-unavailable-unknown-outcome-cancelled-observation
  media.operation.consent: request-started-acknowledged-completed-denied-conflict-failed-unavailable-unknown-outcome
  media.operation.health-capability: processing-completed-unavailable-unknown-outcome
operationSliceBindings:
  media.operation-slice.begin-upload:
    actionIntentRefs: [media.action.begin-artifact-upload]
    disposition: exact-bounded-command-intent; not-cross-interface-or-runtime-admission
  media.operation-slice.append-upload-chunk:
    actionIntentRefs: [media.action.begin-artifact-upload, media.action.resume-artifact-upload]
    disposition: guarded-resume-phase-after-inspecting-the-same-upload-rechecking-current-authority-source-and-state-and-explicit-user-confirmation; append-only-remaining-contiguous-parts; unknown-result-requires-inspection-before-any-command
  media.operation-slice.complete-upload:
    actionIntentRefs: [media.action.begin-artifact-upload, media.action.resume-artifact-upload]
    disposition: guarded-resume-phase-after-inspection-current-authority-source-state-and-explicit-user-confirmation; finalize-only-an-unexpired-complete-session-with-verified-size-and-digest; enters-VERIFYING-only; no-availability-rights-or-project-attachment-claim
  media.operation-slice.inspect-upload:
    actionIntentRefs: [media.action.resume-artifact-upload]
    disposition: first-read-and-reconcile-step-in-ordered-resume-workflow; not-the-resume-mutation
  media.operation-slice.inspect-artifact:
    actionIntentRefs: [media.action.inspect-artifact]
    disposition: exact-bounded-read-intent; no-bytes-rights-or-project-attachment
  media.operation-slice.create-project:
    actionIntentRefs: [media.action.create-project]
    disposition: create-only-empty-project-and-atomic-initial-immutable-revision; exact-request-replay-is-not-a-second-effect; unknown-outcome-requires-same-requestId-reconciliation; runtime-NOT_ADMITTED
  media.operation-slice.list-projects:
    actionIntentRefs: []
    disposition: tenant-workspace-principal-scoped-authorized-summary-observation; empty-result-is-not-global-absence; runtime-NOT_ADMITTED
  media.operation-slice.inspect-project:
    actionIntentRefs: [media.action.open-project, media.action.inspect-project-creation]
    disposition: exact-project-and-current-head-revision-read-or-create-request-reconciliation; read-only-time-scoped; no-artifact-bytes-or-rights-claim; runtime-NOT_ADMITTED
  media.operation.caption-version-write:
    actionIntentRefs: [media.action.save-caption-version]
    disposition: append-one-exact-source-and-parent-bound-immutable-caption-version-with-idempotent-registration-receipt; registration-is-not-review-approval-delivery-or-publication; runtime-NOT_ADMITTED
  media.operation.caption-version-read:
    actionIntentRefs: [media.action.compare-caption-versions]
    reconciliationActionRefs: [media.action.save-caption-version]
    disposition: read-only-exact-pair-comparison-or-same-scope-original-registration-receipt-observation; preserve-source-and-clock-identities; no-mutation-merge-winner-or-review-approval; runtime-NOT_ADMITTED
  media.operation.transcript-version-read:
    actionIntentRefs: [media.action.review-transcript]
    disposition: read-one-exact-canonical-transcriptVersionId-in-current-trusted-scope; preserve-only-supplied-text-segments-language-uncertainty-evidence-and-explicit-timing-availability; no-clock-inference-mutation-correction-approval-or-publication; runtime-NOT_ADMITTED
  media.operation.caption-draft-write:
    actionIntentRefs: [media.action.correct-caption, media.action.align-caption-timing]
    disposition: atomic-session-local-draft-revision-from-exact-source-and-typed-parent; compare-and-swap-on-expectedDraftRevision; text-and-source-tick-edits-are-exclusive; timing-alignment-requires-authoritative-exact-source-clock-rate-and-duration; no-source-mutation-registration-review-approval-delivery-or-publication; runtime-NOT_ADMITTED
bindingRules:
  - above-family-lists-are-allowed-result-shapes-not-guaranteed-result-support
  - each-HTTP-gRPC-SDK-CLI-Agent-tool-and-event-adapter-must-declare-its-actual-supported-subset
  - events-report-observations-and-do-not-act-as-command-acknowledgements-without-an-explicit-contract
  - source-specific-transport-errors-and-enums-remain-preserved-in-transport-details
  - no-global-retryability-or-idempotency-is-implied
unresolved:
  - exact-transport-status-to-outcome-mappings
  - authentication-and-authorization-denial-shapes
  - operation-specific-completion-and-partial-success-evidence
  - cancellation-confirmation-source-and-scope
  - event-correlation-and-ordering-contract
