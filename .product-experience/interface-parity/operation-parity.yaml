  requiredPerIdentity: [exact-source-identity, source-owner-or-external-owner, implementation-observation-or-explicit-not-implemented, candidate-or-non-operation-disposition, exact-canonical-reference-or-explained-unresolved-gap, runtime-and-independent-acceptance-state]
  nonEquivalence: [matching-name-is-not-semantic-equivalence, implementation-observation-is-not-owner-acceptance, transport-only-is-not-domain-operation, owner-adapter-required-is-not-wire-parity, unresolved-is-explicit-not-implied-success]
  currentUiActionIdentityResolution:
    sourceCollections:
      - .product-experience/pdp-3-product-experience/action-registry.yaml#/actions
      - .product-experience/pdp-3-product-experience/action-registry.yaml#/ownerDefinedActions
    currentIdentityCount: 147
    exactSemanticFields:
      definition: actionDefinitionSemantics/typedDefinition
      role: domainOperationDisposition
      operations: exactOperationRefs
      effect: effect
      applicability: applicabilityGuards
      finality: finality
      recovery: failureRecovery
      authorityAndAdmission: [ownerDefinitionDecisionRef, runtimeAdmission]
    exactDispositionClasses:
      operationIntent: [EXACT_OPERATION_REFERENCE, EXACT_ORDERED_WORKFLOW, OWNER_DEFINED_EXACT_OPERATION_REFERENCE]
      localOrSessionOnly: [NO_DOMAIN_OPERATION_LOCAL_SELECTION_OR_SESSION_DRAFT]
      sharedIdentityBoundary:
        - "EXTERNAL_SHARED_IDENTITY_HANDOFF; NO_MEDIA_DOMAIN_MUTATION"
        - "EXTERNAL_SHARED_IDENTITY_HANDOFF_OR_OBSERVATION; NO_MEDIA_DOMAIN_MUTATION"
    operationResolution: >-
      Every operationIntent row must resolve each exactOperationRefs entry to one
      unique operation, individual-operation, owner-defined-operation, or
      capability-operation source record. This is an owner action-intent link;
      it does not claim that any UI action is wired to a transport or that the
      linked operation is executable or admitted.
    nonOperationResolution: >-
      A localOrSessionOnly row must have no operation refs and must retain its
      exact effect, applicability, finality, and failureRecovery semantics. A
      sharedIdentityBoundary row must have no Media operation refs and must
      retain its explicit upstream handoff/observation boundary. Do not replace
      either class with a guessed Media operation based on the action label.
    dispositionCounts: {operationIntent: 96, localOrSessionOnly: 49, sharedIdentityBoundary: 2}
    excludedClaims: [transport-equivalence, runtime-reachability, execution-admission, independent-acceptance]
    sourceStatus: CURRENT_MEDIA_ACTION_IDENTITIES_EXACTLY_DISPOSED; cross-interface bindings remain separately reviewed
  status: OWNER_DEFINED_SOURCE_INVENTORY_AND_DISPOSITION; no cross-interface binding, runtime parity, or independent acceptance is implied.
