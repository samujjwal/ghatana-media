          errorsAndFinality: source returns a validated TTSResult or ServiceResponse error; callback/notification does not prove output registration or publication.
          admission: NOT_ADMITTED
        - methodId: media.sdk.getOperationResult
          methodRef: libs/audio-video-client/src/operations.ts#MediaOperationClient.getOperationResult
          requestTypeRef: libs/audio-video-client/src/operations.ts#MediaOperationClient.getOperationResult.operationId
          resultTypeRef: libs/audio-video-client/src/operations.ts#RuntimeParser<T>
          observedRoute: GET /api/v1/media/operations/{operationId}/result
          disposition: LEGACY_UNVALIDATED_RESULT_READ
          exactGap: The caller supplies a generic RuntimeParser<T>; the method does not select the accepted job's target operation/version/schema digest and cannot establish that arbitrary JSON is a canonical result.
          canonicalConsumerAdapterRef: scripts/lib/pdp-job-result-observation.mjs#validateJobResultObservation
          canonicalRule: preserve raw legacy payload only as untrusted UNKNOWN; a typed result requires the trusted accepted-submit snapshot to resolve the exact target output schema and a successful closed-schema validation. Schema-valid output alone does not establish finality or output registration.
          errorsAndFinality: HTTP/read/parse failure rejects the Promise; cancellation of local read does not cancel the job. Result retrieval is not completion evidence.
