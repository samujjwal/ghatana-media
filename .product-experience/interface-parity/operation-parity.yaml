        - methodId: media.sdk.legacy.AudioVideoClient.synthesize
          methodRef: libs/audio-video-client/src/index.ts#AudioVideoClient.synthesize
          requestTypeRef: libs/audio-video-types/src/index.ts#TTSRequest
          resultTypeRef: libs/audio-video-types/src/index.ts#TTSResult
