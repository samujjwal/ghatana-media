      canonicalOperationRef: .product-experience/pdp-1-domain-data/operations.yaml#operations.media.operation.transcription-submission
      canonicalWireSchemaRef: .product-experience/pdp-1-domain-data/operations.yaml#operations.media.operation.transcription-submission.ownerWireSchema
      sourceImplementationRefs:
        - modules/speech/stt-service/src/main/java/com/ghatana/stt/grpc/SttGrpcService.java#transcribe
        - modules/speech/stt-service/src/main/java/com/ghatana/stt/grpc/PersistentSttGrpcService.java#transcribe
      disposition: CANDIDATE_ONLY_ADAPTER_NOT_DEFINED; current-implementations-do-not-satisfy-canonical-submission-contract
      observedInputBehavior:
        directService:
          audio_data: consumed-as-inline-bytes; requires-nonempty-and-at-most-100-MiB
          sample_rate: zero-or-negative-is-replaced-with-16000; range-checked-after-default
          language: optional; lowercases-and-reduces-to-primary-subtag-for-support-check
          options: ignored; SttEngine.transcribe-receives-TranscriptionOptions.defaults
          profile_id: not-read-by-transcribe-implementation
          tenant_id: not-read-by-transcribe-implementation
          artifact_id: not-read-by-transcribe-implementation
          job_id: not-read-by-transcribe-implementation
          correlation_id: not-read-by-transcribe-implementation
          consent_status: not-read-by-transcribe-implementation
          retention_policy: not-read-by-transcribe-implementation
        persistentService:
          audio_data: consumed-as-inline-bytes; requires-nonempty
          sample_rate: zero-or-negative-is-replaced-with-16000
          language: passed-to-persistent-service-without-canonical-language-intent-envelope
          tenant_id: ignored-as-caller-field; tenant-is-read-from-authenticated-server-context
          profile_id: not-read-by-transcribe-implementation
          options: not-read-by-transcribe-implementation
          artifact_id: not-read-by-transcribe-implementation
          job_id: not-read-by-transcribe-implementation
          correlation_id: not-read-by-transcribe-implementation
          consent_status: not-read-by-transcribe-implementation
          retention_policy: not-read-by-transcribe-implementation
      canonicalSubmissionRequirementsNotProvidedByTheseMethods:
        - exact immutable sourceArtifactId plus sourceArtifactVersionId and authoritative content digest
        - requestMode, requestId, and same-key canonical payload fingerprint for replay or reconciliation
        - explicit profile version and configuration digest
        - typed purpose, current consent reference, rights evidence reference, retention policy reference, and processing location
        - host-attested tenant and principal context; caller-supplied tenant_id is never trusted identity
        - success/rejection/unknown-outcome receipt with stable job reference and provenance rather than transcription text as submission result
        - current authority recheck and no-effect reconciliation branch
      nonEquivalenceRules:
        - field-name similarity does not bind proto fields to canonical request fields
        - a server-side tenant from authenticated context does not supply omitted request, source-version, rights, consent, profile, or finality semantics
        - the transcription result payload is not a canonical accepted-job receipt
        - provider execution success is not evidence of qualified profile or admitted runtime
      runtimeAdmission: NOT_ADMITTED
      independentAcceptance: OPEN
