          returnedResultTypeRef: libs/audio-video-types/src/contracts.ts#MediaArtifactSchema
          observedRoute: POST /api/v1/media/voice-conversions
          canonicalOwnerOperationRef: .product-experience/pdp-1-domain-data/operations.yaml#ownerDefinedOperationContracts/records/@id=media.operation.voice-model.convert.v1
          disposition: LEGACY_REQUEST_RESULT_NOT_EQUIVALENT
          exactGap: Legacy request selects sourceArtifactId and voiceModelArtifactId without immutable versions and omits targetProfileRef, purposeRef, and rightsEvidenceRefs. The owner contract requires exact sourceModelVersionRef, targetProfileRef, purposeRef, consentRef, and rightsEvidenceRefs and returns an explicit tri-state versioned-model result rather than MediaArtifact.
          recoveryAndFinality: legacy accepted job receipt is not a converted model registration receipt; unknown submission requires same-key reconciliation before another request.
          admission: NOT_ADMITTED
        - methodId: media.sdk.processAIVoice
          methodRef: libs/audio-video-client/src/index.ts#AudioVideoClient.processAIVoice
          requestTypeRef: libs/audio-video-types/src/index.ts#AIVoiceRequest
          resultTypeRef: libs/audio-video-types/src/index.ts#AIVoiceResult
          observedRoute: POST /api/ai-voice/process
          responseWrapper: ServiceResponse.success-data-or-error
          disposition: LEGACY_TEXT_PROCESSING_CONTRACT; NO_CANONICAL_OPERATION_BINDING
          sourceSemantics: request text plus task enum enhance|translate|summarize|style and optional text-processing options; result carries processedText, originalText, task, processingTimeMs, and confidence.
          exactGap: No current canonical owner operation with this exact text-processing request/result and task scope is selected. Voice-model train/convert operations are not aliases for this text-processing endpoint.
          errorsAndFinality: thrown service errors become a failure ServiceResponse and error callback; start/complete/error notifications are in-process only. A success wrapper is a service response, not immutable artifact registration, publication, or a qualified text result.
          admission: NOT_ADMITTED
        - methodId: media.sdk.processVision
          methodRef: libs/audio-video-client/src/index.ts#AudioVideoClient.processVision
          requestTypeRef: libs/audio-video-types/src/index.ts#VisionRequest
          resultTypeRef: libs/audio-video-types/src/index.ts#DetectionResultSchema
          observedRoute: POST /api/vision/analyze
          responseWrapper: ServiceResponse.success-data-or-error
          disposition: LEGACY_VISION_REQUEST_RESULT; CANONICAL_LEAF_FIELD_CROSSWALK_NOT_ESTABLISHED
          sourceSemantics: one ImageData plus task detect|classify|segment|analyze and optional threshold/count/class/segmentation controls; result is a DetectionResult with object detections, confidence, processing time, and image size.
          exactGap: Image bytes, dimensions, task optionals, result provenance, estimation status, and exact output artifact/version are not crosswalked to a selected Media capability leaf. Matching the vision family name is insufficient.
          errorsAndFinality: source parser validates DetectionResult; failure is a ServiceResponse error callback. Success is an observation/result DTO, not source-linked immutable output registration or scientific/ground-truth acceptance.
          admission: NOT_ADMITTED
        - methodId: media.sdk.processMultimodal
          methodRef: libs/audio-video-client/src/index.ts#AudioVideoClient.processMultimodal
          requestTypeRef: libs/audio-video-types/src/index.ts#MultimodalRequest
          resultTypeRef: libs/audio-video-types/src/index.ts#MultimodalResultSchema
          observedRoute: POST /api/multimodal/process
          responseWrapper: ServiceResponse.success-data-or-error
          disposition: LEGACY_MULTIMODAL_REQUEST_RESULT; CANONICAL_LEAF_FIELD_CROSSWALK_NOT_ESTABLISHED
          sourceSemantics: optional audio/video/image/text inputs plus task enum transcribe|synthesize|analyze|translate|summarize and optional modality/output controls; the result contains an unknown-valued result field, confidence, duration, modality names, and optional insights.
          exactGap: The optional input combination, output discriminator, result payload, source-version linkage, and epistemic role are not bound to one exact canonical leaf schema. The generic unknown result payload cannot establish a typed Media result.
          errorsAndFinality: source parser validates only the legacy result shape; failures are ServiceResponse errors. Success is not canonical result registration or finality evidence.
          admission: NOT_ADMITTED
        - methodId: media.sdk.legacy.AudioVideoClient.transcribe
          methodRef: libs/audio-video-client/src/index.ts#AudioVideoClient.transcribe
          requestTypeRef: libs/audio-video-types/src/index.ts#STTRequest
          resultTypeRef: libs/audio-video-types/src/index.ts#STTResult
          observedRoute: POST /api/stt/transcribe
          responseWrapper: ServiceResponse.success-data-or-error
          disposition: LEGACY_STT_METHOD; CANONICAL_TRANSCRIPT_VERSION_READ_OR_SUBMISSION_EQUIVALENCE_NOT_ESTABLISHED
