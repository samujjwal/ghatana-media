    - {surfaceCollectionRef: "#/surfaces", surfaceKeyField: surface, surfaceKey: UI action registry, identitySource: .product-experience/pdp-3-product-experience/action-registry.yaml, ownerSource: .product-experience/pdp-1-domain-data/operations.yaml, dispositionField: bindingStatus}
