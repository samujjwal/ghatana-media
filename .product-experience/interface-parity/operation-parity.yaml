          requestTypeRef: libs/audio-video-types/src/contracts.ts#VoiceTrainingRequestSchema
          acceptedResultTypeRef: libs/audio-video-types/src/contracts.ts#OperationAcceptedSchema
          returnedResultTypeRef: libs/audio-video-types/src/contracts.ts#MediaArtifactSchema
          observedRoute: POST /api/v1/media/voice-models:train
          canonicalOwnerOperationRef: .product-experience/pdp-1-domain-data/operations.yaml#ownerDefinedOperationContracts/records/@id=media.operation.voice-model.train.v1
          disposition: LEGACY_REQUEST_RESULT_NOT_EQUIVALENT
          exactGap: Legacy request contains sampleArtifactIds, rightsAttestation, languageTags, qualityThreshold, and consentReference; owner request requires exact immutable sourceVersionRefs, trainingProfileRef, purposeRef, consentRef, and rightsEvidenceRefs. Legacy accepted/result schemas return OperationAccepted and MediaArtifact, not the owner operation's tri-state versioned-model result. No field or identity conversion is inferred.
          recoveryAndFinality: the handle observes a job and parser-selected result; neither is the owner operation's registered model-version receipt. Ambiguous submission must reconcile the same idempotency key; no blind new training request.
