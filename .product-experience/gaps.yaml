- id: GAP-11
  status: open
  scope: actual-Tools-Explorer-runtime-support-for-Media-targets
  owner: Tools-Explorer-owner
  evidence: A Media-owned Vite browser client renders three synthetic J-01 first-use routes, three J-02 artifact-intake
    views, activity, and verification-job views, plus a shared job-detail view for J-20 transcription jobs. It provides
    J-02 upload inspection/resume and job inspection/reconciliation commands, J-20 transcription-job inspection/cancellation/reconciliation,
    and the selected transcript/caption lane in Product, Explore, Specification, and Verify modes. J-01, J-02, J-03,
    and J-20 use synthetic fixtures. Specification mode indexes 146 records and renders read-only previews for all
    41 baseline screen contracts and six selected-lane specializations. The inspected Tools Explorer remains headless
    and declares standalonePro false;
    the local client is not a generic Tools host and has no published isolated package binding.
  remaining: implement-and-owner-bind-a-Tools-browser-host-for-Media-package-contracts
  impact: blocks-P3-001-Explorer-package-acceptance
- id: GAP-12
  status: open
  scope: built-Explorer-browser-visual-accessibility-and-human-review-evidence
  owner: independent-experience-reviewer
  evidence: The local browser client builds. Browser automation recorded the selected caption editor at CSS viewports
    1536x960, 1280x800, 1024x768, 768x1024, 390x844, and 320x640 with no visible product-descendant horizontal overflow.
    The verification-job and transcription-job product previews were additionally inspected at 320px and 390px configured
    widths without visible horizontal overflow. The new Specification-mode contract preview was rendered for all 47
    screen contracts; at 390x844 and 320x640 it stacked into one column and matched the available page width after a
    mobile grid minimum-size correction. These observations are limited to the Media-owned Vite client; independent
    visual review, keyboard/screen-reader/zoom/forced-colors coverage, and all-view/channel variant evidence are
    not recorded.
  remaining: complete-the-required-responsive-accessibility-and-independent-human-review-matrix
  impact: blocks-Phase-3-acceptance
