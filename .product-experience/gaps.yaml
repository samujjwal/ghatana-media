- id: GAP-05
  status: open
  scope: exact-route-DTO-protobuf-and-client-parity
  owner: Media-and-consumer-contract-owners
  evidence: >-
    PDP1-002 now records 14 proposals: nine logical-operation families with
    the plan's 22 required fields, plus five source-specific records. Source
    identities remain separate from proposed mappings.
    The 146 UI actions partition as 14 exact proposed
    operation refs and 132 unresolved; none is ambiguous. The
    stale review-rights-and-consent reference is explicitly identified as not
    present in the action registry. PDP3-002 found all 27 HTTP operation IDs
    match OpenAPI/runtime route inventories, but all 27 logical-operation
    links remain unresolved, all 15 API/action experience mappings are
    unresolved, and no per-operation HTTP contract records exist. All 43 gRPC
    entries match four active proto files; PDP1 proposes 17 family links and
    leaves 26 unresolved, while PDP3 experience bindings remain pending
    and per-operation gRPC contract records are absent. SDK inventory retains 32 rows: 29 source/class/method-qualified public
    identities and three excluded parser artifacts (`for`, `if`, `clearTimeout`).
    PXD-031 classifies four exact legacy methods as transport/client-only; the new
    scene-text adapter is a candidate provider adapter with its canonical operation
    unresolved. Fourteen family associations remain proposals and eleven public
    identities remain unresolved.
    No complete cross-interface binding is owner-accepted. The 11 synthetic fixture CLI commands differ from the
    12-entry broader proposal registry, which adds media.cli.job.retry. Four
    Agent Tool handlers and 15 event names are inventoried without complete
    canonical bindings. These are source-scoped definition/registry
    observations, not support or runtime reachability claims.
  remaining: >-
    Resolve the 132 unmatched UI action links; bind the 27 HTTP IDs and 26
    gRPC identities still unresolved to owner-approved operations, and review
    the 17 proposed gRPC family links without treating
    them as canonical. Preserve the 28 public SDK identities and three excluded parser artifacts;
    resolve remaining exact method semantics; preserve the 11 fixture versus 12 proposal
    CLI distinction; define per-tool formal input/result schemas,
    authority/delegation, idempotency, timeout, cancellation, unknown outcome,
    evidence, and safe-failure contracts; and bind event names to operations
    only after PDP1 event/state authority and platform delivery guarantees are
    reviewed. Obtain consumer/wire owner decisions and behavioral evidence
    without inventing production reachability or treating local proposals as
    admitted interfaces.
  impact: blocks-breaking-relocation-and-SDK-publication
