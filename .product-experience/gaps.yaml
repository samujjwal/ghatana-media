- id: GAP-MEDIA-NODE-YAML-PARSER
  status: open
  scope: repeatable-Node-native-YAML-parse-regression-for-product-definition-authorities
  owner: media-build-and-test-owners
  evidence: >-
    The narrow lockfile-only command 'pnpm --filter . add --save-dev --save-exact yaml@2.9.1 --lockfile-only --ignore-scripts'
    failed with ERR_PNPM_FETCH_404 while resolving the libs/audio-video-ui importer dependency @ghatana/tokens from
    https://registry.npmjs.org/; no authorization header was set. package.json and pnpm-lock.yaml were not changed by
    the failed command. The parser-backed test was removed; the remaining Node regression is explicitly text-level and
    does not claim YAML parsing.
  localEvidence: Python 3 with PyYAML 6.0.3 parsed the corrected capability, requirement, crosswalk, and OCR YAML locally; this is environment-only evidence and is not a repeatable CI parser test.
  remaining: Resolve authenticated/public availability of private @ghatana/tokens or provide a supported root-only pnpm lockfile resolution path; then add a pinned Node-native yaml dependency and restore parser-backed regression coverage without editing lock data by hand.
  impact: blocks-portable-parser-backed-YAML-regression-and-CI-parse-proof; does-not-reverse-the-local-YAML-correction
