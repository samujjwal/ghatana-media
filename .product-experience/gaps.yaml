- id: GAP-MEDIA-PHASE2-COVERAGE
  status: open
  scope: complete-view-journey-action-state-and-channel-contracts-for-the-pdp-3-baseline
  owner: ghatana-media-product-design-and-experience-owners
  evidence: 47 canonical screens each have a v2 PDP-3 proposal contract; the separate artifact-verification-job-family specialization remains outside the 47-screen denominator. Three template IDs resolve in the PDP-2 catalog, 44 remain null, no canonical layout IDs are registered, and the Web surface/component/pattern/action-consequence refs remain candidates. Token/domain-object/operation/state/entry/exit bindings are unresolved; one screen carries source fixture refs; inline anatomy/template/layout proposals have not been centralized. All 30 journeys now have 130 structured ordered steps with the plan-required per-step fields; J-29/J-30 each preserve their four source step IDs. A candidate crosswalk normalized 148 step surface refs. Seven source-crosswalk PDP-1 logical-operation refs remain proposals and 123 canonical operation refs are null. Journey-level success/failure/recovery/context remain proposal-only and are not consistently allocated to individual steps; degraded behavior, postconditions, object/state/authority/decision/transition/handoff/requirements, scenarios, and step verification remain incomplete.
  localProgress: The focused product-definition regression passes for 47 v2 screen structures and all 30 journey contracts/130 structured steps, including route-ID nonpromotion and J-29/J-30 ordering. Duplicate-key-safe YAML checks passed for the expanded journey contracts and protocol registries. The generic local checker still reports 0 required screen shapes because its VER-001 validation rule has not yet been upgraded; its 43 view and 16 action-reference counts remain local structural evidence only. No behavior, owner acceptance, qualification, native currentness, or release evidence is claimed.
  remaining: bind-all-screen-and-step-semantics-to-accepted-PDP-1-and-PDP-2-authorities; resolve-123-null-canonical-operation-bindings-and-step-object-state-authority-decision-transition-handoff-requirement-contracts; allocate-success-failure-degraded-recovery-and-postconditions-per-step; centralize-inline-screen-design-proposals-into-accepted-layouts-and-templates; add-owner-reviewed-scenarios-and-behavior/accessibility/localization-evidence; upgrade-local-checker-under-VER-001; define-and-accept-full-Web-CLI-API-embedded-and-wire-behavior
