- id: GAP-MEDIA-PHASE2-COVERAGE
  status: open
  scope: complete-view-journey-action-state-and-channel-contracts-for-the-phase-2-baseline
  owner: ghatana-media-product-design-and-experience-owners
  evidence: 41 baseline screens each have a Phase 2 proposal contract; six selected-lane view specializations remain indexed.
    All 47 screen contracts now open as source-derived Product routes, with actions explicitly disabled until bound.
    All 28 required journeys now have proposal files. The 24 new files carry Phase 0 outcomes, actors, preconditions, critical
    exceptions, recovery/context intent, proposed channels, and ordered legacy views mapped to intent-based screens. J-01/J-02/J-03/J-20
    retain scoped proposals. Action/state transitions, per-channel behavior, scenarios, wire contracts, capability bindings, and owner
    review remain pending; no journey proposal is owner-accepted as complete.
  localProgress: The repeatable local invariant check now proves all 47 indexed screen contracts and all 28 required journey proposal
    files expose their required shape; 43 journey view references and 16 journey action references resolve. This closes only local
    source integrity and does not close owner-reviewed behavior, channel, scenario, capability, accessibility, or runtime bindings.
  remaining: complete-action-state-scenario-copy-capability-and-owner-bindings-for-all-28-required-journeys; close-action-state-copy-scenario-and-capability-bindings-for-all-41-views;
    define-full-Web-CLI-API-embedded-and-wire-behavior; complete-independent-accessibility-localization-and-owner-review
