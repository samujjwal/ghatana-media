- id: GAP-MEDIA-CLEAN-5-STALE-DOCKER-GRADLE-PATHS
  taskRef: CLEAN-5
  status: gated
  scope: migrate-service-Dockerfile-Gradle-project-coordinates-and-build-contexts-after-source-cutover
  owner: media-build-and-release-owners
  observedFiles:
  - docker/Dockerfile.stt-service
  - docker/Dockerfile.tts-service
  - docker/Dockerfile.vision-service
  - docker/Dockerfile.multimodal-service
  moduleLocalPaths: not-separately-found-in-the-reviewed-inventory
  evidence: Each of the four observed Dockerfiles still references the old :products:audio-video Gradle project coordinates.
  rootCause: The current Media source layout is migration-only and the downstream target paths have not been cut over; the old project coordinates remain until that migration boundary changes.
  gate: Do-not-edit-these-Dockerfiles-before-the-migration-and-cutover-precondition-in-IMP-04-is-satisfied.
  dependencies:
  - IMP-04
  requiredFix: After authorized migration/cutover, update each observed Dockerfile to the canonical post-cutover module path and build context; reconcile any additional module-local Dockerfiles only if a later inventory finds them.
  acceptanceCriteria:
  - Every referenced post-cutover Gradle project path resolves in the migrated standalone repository.
  - Isolated Gradle build checks pass for each affected service from the intended build context.
  - Isolated image build checks pass for all four Dockerfiles without sibling-workspace or legacy-project-path assumptions.
  remaining: Await IMP-04 migration/cutover authorization and completion; do not modify Dockerfiles or Gradle settings/catalog before that gate.
  impact: blocks-CLEAN-5-closure-and-post-cutover-isolated-service-image-build-acceptance
