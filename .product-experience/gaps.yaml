- id: GAP-02
  status: open
  scope: public-versions-publication-and-isolated-consumption-for-selected-Ghatana-dependencies
  owner: ecosystem-architect-and-platform-package-owners
  evidence: >-
    The active Media UI and AI Voice manifests now request Shared packages at
    0.1.0-SNAPSHOT, matching the Shared source package versions; the
    development-version policy check passes. Packed public-consumer checks pass
    in ghatana-shared for @ghatana/tokens, @ghatana/theme, and
    @ghatana/design-system. The Media UI was then compiled and packed against
    nine locally packed Shared 0.1.0-SNAPSHOT artifacts, and a second isolated
    consumer passed TypeScript and Vite runtime-export checks. The Media pnpm
    workspace now includes the Shared TypeScript packages and Tools Product
    Development dependency closure as local sources; Media install and the
    Explorer dependency-closure build/typecheck pass. The lockfile records local
    workspace links for the exact 0.1.0-SNAPSHOT dependencies. Public registry
    resolution and immutable release binding remain unverified. Lifecycle-owned
    closure/evidence packages are included as a separate sibling source
    workspace and Gradle composite, not as part of Tools. Their package/root
    version is 0.1.0-rc.1. The Evidence Generator package and Gradle artifact
    use that RC1 coordinate; tool-product.json and the checked-in resource
    template carry 0.1.0-SNAPSHOT metadata, while processResources rewrites the
    generated JAR identity to the Gradle project version (0.1.0-rc.1). Media
    currently declares no direct
    Lifecycle package dependency, so inclusion provides development source
    availability without asserting a Media product dependency. The former
    0.1.2 mismatch is corrected and is historical context, not the current
    blocker. The composite Media Vite build passes but still reports browser
    warnings for externalized fs/promises and node:path imports from Shared's
    AccessibilityAuditorEngine.js, ignored use-client directives in the
    lucide-react dependency tree, Zod annotations, and a chunk above 500 KB.
  remaining: >-
    Keep the source-composite install/build and isolated packed-consumer proofs
    current as Shared and Tools packages change; investigate and qualify the
    Shared browser-build warnings. Release binding remains a separate
    immutable-artifact qualification and design review remains open.
  impact: blocks-artifact-only-standalone-build-bindings
