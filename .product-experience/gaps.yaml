- id: GAP-11
  status: open
  scope: actual-Tools-Explorer-runtime-support-for-Media-targets
  owner: Tools-Explorer-owner
  evidence: The native Tools Explorer selects ghatana.product/media and loads media-conformance-package with a synthetic
    default renderer and no diagnostics; it returns no product renderResult or inspection projection. The shared Tools graph
    resolves 147 nodes and 141 relations, including 132 Media nodes, six shared-framework-contract nodes, and two
    product-dev-explorer nodes. A Media-owned Vite browser client renders three synthetic J-01 first-use routes, three J-02 artifact-intake
    views, activity, and verification-job views, plus a shared job-status view for J-20 transcription jobs. It provides
    J-02 upload inspection/resume and job-status/outcome-check commands, J-20 transcription-job status viewing/cancellation/outcome checking,
    and the selected transcript/caption lane in Product, Explore, Specification, and Verify modes. J-01, J-02, J-03,
    and J-20 use synthetic fixtures. Specification mode indexes 147 records and renders read-only previews for all
    41 baseline screen contracts and six selected-lane specializations. All 47 screen contracts also open as
    route-addressable Product projections of their declared purpose, structure, states, and disabled actions; these
    are not executable view implementations. A five-viewport DOM geometry sweep of all 47 Product routes found no
    horizontal overflow, missing context cards, duplicate titles, or enabled proposal actions. The inspected Tools Explorer remains headless and declares
    standalonePro false;
    the local client is not a generic Tools host and has no published isolated package binding.
  remaining: implement-and-owner-bind-a-Tools-browser-host-for-Media-package-contracts
  impact: blocks-P3-001-Explorer-package-acceptance
- id: GAP-12
  status: open
  scope: built-Explorer-browser-visual-accessibility-and-human-review-evidence
  owner: independent-experience-reviewer
  evidence: The local browser client builds. Browser automation recorded the caption-editor Product route at CSS viewports
    1280x800, 768x1024, and 320x640 with no visible clipping. A production-build DOM geometry sweep covered all 47 Product
    proposal routes at 1280x800, 1024x768, 768x1024, 390x844, and 320x640; every route had four context cards, a unique
    title, disabled proposal actions, and no page-level horizontal overflow. The verification-job route was also
    visually inspected at all five widths in an earlier review. The embedded CLI ran both transcription and artifact-
    verification outcome checks and was inspected at 320px and 390px without page, response, or terminal overflow; its
    390px desktop preview was centered in the available canvas. These observations are limited to the Media-owned Vite
    client; independent
    visual review, keyboard/screen-reader/zoom/forced-colors coverage, and all-view/channel variant evidence are
    not recorded.
  localProgress: Source-linked Specification trace metadata, phase coverage controls, focused phase-radio keyboard evidence, and a
    Playwright browser audit now cover all 29 scenarios, 147 source artifacts, 47 valid Product proposal routes, Verify, accessible
    control names, six viewports, and horizontal-overflow/console-error checks. This does not close independent visual,
    screen-reader, zoom, forced-colors, locale, pixel-reference, or human review.
  remaining: complete-the-required-responsive-accessibility-and-independent-human-review-matrix
  impact: blocks-Phase-3-acceptance
