# Product-owned Media Gradle version catalog.
# This subset preserves the exact aliases and pinned values used by the
# migrated Media Gradle build; update this file as Media build metadata.

[versions]
java = "21"
activej = "6.0-rc2"
assertj = "3.27.7"
aws-sdk = "2.54.1"
caffeine = "3.2.4"
flyway = "13.3.0"
