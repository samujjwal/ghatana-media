# No workload or image is admitted by default; enable only with actual digest and authority.
global:
  imageRegistry: ghcr.io/ghatana/audio-video
  imagePullPolicy: IfNotPresent
  namespace: audio-video
  existingSecret: audio-video-secrets

serviceAccount:
  create: false
  name: audio-video-sa

networkPolicy:
  enabled: false
  monitoringNamespace: monitoring

# ── STT Service ────────────────────────────────────────────────────────────
stt:
  enabled: false
  replicaCount: 2
  image:
    repository: ghcr.io/ghatana/audio-video/stt-service
    digest: ""
  ports:
    grpc: 50051
    health: 8090
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"
  env:
    AV_RATE_LIMIT_TPS: "50"
    AV_RATE_LIMIT_BURST: "100"
    AV_RATE_LIMIT_MAX_CONCURRENT: "20"
    AV_CB_FAILURE_THRESHOLD: "5"
    AV_CB_RESET_TIMEOUT_MS: "30000"
    AV_MAX_REQUEST_BYTES: "104857600"
  modelsClaimName: stt-models-pvc
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilization: 70

# ── TTS Service ────────────────────────────────────────────────────────────
tts:
  enabled: false
  replicaCount: 2
  image:
    repository: ghcr.io/ghatana/audio-video/tts-service
    digest: ""
  ports:
    grpc: 50052
    health: 8091
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"
  env:
    AV_RATE_LIMIT_TPS: "50"
    AV_RATE_LIMIT_BURST: "100"
    AV_RATE_LIMIT_MAX_CONCURRENT: "20"
    AV_CB_FAILURE_THRESHOLD: "5"
    AV_CB_RESET_TIMEOUT_MS: "30000"
    AV_MAX_REQUEST_BYTES: "52428800"
  modelsClaimName: tts-models-pvc
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilization: 70

# ── Vision Service ─────────────────────────────────────────────────────────
vision:
  enabled: false
  replicaCount: 2
  image:
    repository: ghcr.io/ghatana/audio-video/vision-service
    digest: ""
  ports:
    grpc: 50054
    health: 8092
  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  env:
    AV_RATE_LIMIT_TPS: "20"
    AV_RATE_LIMIT_BURST: "40"
    AV_RATE_LIMIT_MAX_CONCURRENT: "10"
    AV_CB_FAILURE_THRESHOLD: "5"
    AV_CB_RESET_TIMEOUT_MS: "30000"
    AV_MAX_REQUEST_BYTES: "52428800"
  modelsClaimName: vision-models-pvc
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilization: 70

# ── Multimodal Service ─────────────────────────────────────────────────────
multimodal:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/ghatana/audio-video/multimodal-service
    digest: ""
  ports:
    grpc: 50055
    health: 8093
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  env:
    STT_SERVICE_HOST: "{{ .Release.Name }}-stt"
    STT_SERVICE_PORT: "50051"
    VISION_SERVICE_HOST: "{{ .Release.Name }}-vision"
    VISION_SERVICE_PORT: "50054"

# ── Platform Shared Services ───────────────────────────────────────────────
platformServices:
  aiRegistryUrl: ""
  featureStoreUrl: ""
  authGatewayUrl: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
