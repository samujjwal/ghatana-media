              value: {{ printf "%s-stt" .Release.Name | quote }}
            - name: STT_SERVICE_PORT
              value: {{ .Values.stt.ports.grpc | quote }}
            - name: VISION_SERVICE_HOST
              value: {{ printf "%s-vision" .Release.Name | quote }}
            - name: VISION_SERVICE_PORT
              value: {{ .Values.vision.ports.grpc | quote }}
            - name: AV_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: jwt-secret
