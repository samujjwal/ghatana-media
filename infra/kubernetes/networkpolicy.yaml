apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audio-video-default-ingress
  namespace: media-candidate-not-admitted
  labels:
    app.kubernetes.io/part-of: media-candidate-not-admitted
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media-candidate-not-admitted
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring