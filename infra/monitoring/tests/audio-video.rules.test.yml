rule_files:
- ../alerts/audio-video.yml
evaluation_interval: 30s
tests:
- name: observed-zero-readiness-fires-after-one-minute
  interval: 30s
  input_series:
  - series: av_service_readiness{service="stt"}
    values: '0x3'
  - series: av_service_readiness{service="tts"}
    values: '0x3'
  - series: av_service_readiness{service="vision"}
    values: '0x3'
  - series: av_service_readiness{service="multimodal"}
    values: '0x3'
  alert_rule_test:
  - eval_time: 1m
    alertname: SttProviderNotReady
    exp_alerts:
    - exp_labels:
        severity: critical
        product: audio-video
        component: stt
        service: stt
      exp_annotations:
        summary: STT service provider readiness is down
        description: The observed STT readiness gauge is zero. Check public readiness
          and lifecycle, then inspect only redacted STT diagnostics and provider configuration.
          Keep traffic closed until readiness recovers; missing or unknown series
          do not trigger this alert.
        runbook: docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook
  - eval_time: 1m
    alertname: TtsProviderNotReady
    exp_alerts:
    - exp_labels:
        severity: critical
        product: audio-video
        component: tts
        service: tts
      exp_annotations:
        summary: TTS service provider readiness is down
        description: The observed TTS readiness gauge is zero. Check public readiness
          and lifecycle, then inspect only redacted TTS diagnostics and provider configuration.
          Keep traffic closed until readiness recovers; missing or unknown series
          do not trigger this alert.
        runbook: docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook
  - eval_time: 1m
    alertname: VisionProviderNotReady
    exp_alerts:
    - exp_labels:
        severity: critical
        product: audio-video
        component: vision
        service: vision
      exp_annotations:
        summary: Vision service provider readiness is down
        description: The observed Vision readiness gauge is zero. Check public readiness
          and lifecycle, then inspect only redacted Vision diagnostics and provider
          configuration. Keep traffic closed until readiness recovers; missing or
          unknown series do not trigger this alert.
        runbook: docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook
  - eval_time: 1m
    alertname: MultimodalProviderNotReady
    exp_alerts:
    - exp_labels:
        severity: critical
        product: audio-video
        component: multimodal
        service: multimodal
      exp_annotations:
        summary: Multimodal service provider readiness is down
        description: The observed Multimodal readiness gauge is zero. Check public
          readiness and lifecycle, then inspect only redacted Multimodal diagnostics
          and provider configuration. Keep traffic closed until readiness recovers;
          missing or unknown series do not trigger this alert.
        runbook: docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook
- name: readiness-one-does-not-fire
  interval: 30s
  input_series:
  - series: av_service_readiness{service="stt"}
    values: 1x3
  - series: av_service_readiness{service="tts"}
    values: 1x3
  - series: av_service_readiness{service="vision"}
    values: 1x3
  - series: av_service_readiness{service="multimodal"}
    values: 1x3
  alert_rule_test:
  - eval_time: 1m
    alertname: SttProviderNotReady
    exp_alerts: []
  - eval_time: 1m
    alertname: TtsProviderNotReady
    exp_alerts: []
  - eval_time: 1m
    alertname: VisionProviderNotReady
    exp_alerts: []
  - eval_time: 1m
    alertname: MultimodalProviderNotReady
    exp_alerts: []
- name: missing-readiness-is-no-data-not-zero
  interval: 30s
  alert_rule_test:
  - eval_time: 1m
    alertname: SttProviderNotReady
    exp_alerts: []
  - eval_time: 1m
    alertname: TtsProviderNotReady
