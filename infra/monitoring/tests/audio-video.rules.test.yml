    alertname: MediaJobLeaseStuck
    exp_alerts: []
  - eval_time: 20m
    alertname: MediaWorkflowAggregateStoreMetricsUnavailable
    exp_alerts:
    - exp_labels:
        severity: warning
        product: audio-video
        component: workflow
        service: stt
        contract_version: v1
      exp_annotations:
        summary: Media job store cannot supply aggregate workflow metrics
        description: The configured Media job store on stt reports unsupported or
          failed aggregate queries backing lease/backlog/queue-depth gauges. Initial
          NaN/unknown state does not trigger this alert; a known unsupported or failed
          refresh does.
