    exp_alerts: []
- name: reachable-target-missing-readiness-is-unknown
  interval: 30s
  input_series:
  - series: up{job="stt-service",instance="stt-1"}
    values: 1x5
  - series: up{job="tts-service",instance="tts-1"}
    values: 1x5
  - series: up{job="vision-service",instance="vision-1"}
    values: 1x5
  - series: up{job="multimodal-service",instance="multimodal-1"}
    values: 1x5
  alert_rule_test:
  - eval_time: 2m
    alertname: SttReadinessTelemetryMissing
    exp_alerts:
    - exp_labels:
        severity: warning
        product: audio-video
        component: stt
        job: stt-service
        instance: stt-1
        service: stt
      exp_annotations:
        summary: STT readiness telemetry is missing
        description: The STT scrape target is reachable, but its readiness status has been absent for 2 minutes. Treat provider state as unknown; verify metrics instrumentation and scrape configuration before changing traffic.
        runbook: docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook
  - eval_time: 2m
    alertname: TtsReadinessTelemetryMissing
    exp_alerts:
    - exp_labels:
        severity: warning
        product: audio-video
        component: tts
        job: tts-service
        instance: tts-1
        service: tts
      exp_annotations:
        summary: TTS readiness telemetry is missing
        description: The TTS scrape target is reachable, but its readiness status has been absent for 2 minutes. Treat provider state as unknown; verify metrics instrumentation and scrape configuration before changing traffic.
        runbook: docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook
  - eval_time: 2m
    alertname: VisionReadinessTelemetryMissing
    exp_alerts:
    - exp_labels:
        severity: warning
        product: audio-video
        component: vision
        job: vision-service
        instance: vision-1
        service: vision
      exp_annotations:
        summary: Vision readiness telemetry is missing
        description: The Vision scrape target is reachable, but its readiness status has been absent for 2 minutes. Treat provider state as unknown; verify metrics instrumentation and scrape configuration before changing traffic.
        runbook: docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook
  - eval_time: 2m
    alertname: MultimodalReadinessTelemetryMissing
    exp_alerts:
    - exp_labels:
        severity: warning
        product: audio-video
        component: multimodal
        job: multimodal-service
        instance: multimodal-1
        service: multimodal
      exp_annotations:
        summary: Multimodal readiness telemetry is missing
        description: The Multimodal scrape target is reachable, but its readiness status has been absent for 2 minutes. Treat provider state as unknown; verify metrics instrumentation and scrape configuration before changing traffic.
        runbook: docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook
  - eval_time: 2m
    alertname: SttReadinessTelemetryInvalid
    exp_alerts: []
  - eval_time: 2m
    alertname: TtsReadinessTelemetryInvalid
    exp_alerts: []
  - eval_time: 2m
    alertname: VisionReadinessTelemetryInvalid
    exp_alerts: []
  - eval_time: 2m
    alertname: MultimodalReadinessTelemetryInvalid
    exp_alerts: []
