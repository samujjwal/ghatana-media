- name: nan-readiness-is-no-data-not-zero
  interval: 30s
  input_series:
  - series: av_service_readiness{service="stt"}
    values: NaN NaN NaN
  - series: av_service_readiness{service="tts"}
    values: NaN NaN NaN
  - series: av_service_readiness{service="vision"}
    values: NaN NaN NaN
  - series: av_service_readiness{service="multimodal"}
    values: NaN NaN NaN
  alert_rule_test:
  - eval_time: 1m
    alertname: SttProviderNotReady
