groups:
  - name: audio_video.alert_delivery_fixture
    interval: 1s
    rules:
      - alert: MediaProviderProfileUnavailableFixture
        expr: max by (service, modality) (media_provider_profile_readiness{provider_id="alert-delivery-fixture",provider_version="fixture-v1",model_profile="fixture-model",model_revision="fixture-r1",contract_version="v1"} == -1)
        for: 2s
        labels:
          severity: warning
          product: audio-video
          component: provider-profile-fixture
          source: fixture
        annotations:
          summary: "Fixture Media provider profile unavailable"
          description: "A deterministic test profile from MediaWorkflowMetrics exercises local exporter delivery only; no provider health or model quality is asserted."
