groups:
  # -------------------------------------------------------------------------
  # 1. Service Availability — existing Media service candidates
  # -------------------------------------------------------------------------
  - name: audio_video.availability
    rules:
      - alert: SttServiceDown
        expr: up{job="stt-service"} == 0
        for: 1m
        labels:
          severity: critical
          product: audio-video
          component: stt
        annotations:
          summary: "STT gRPC service is down"
          description: "{{ $labels.instance }} has been unreachable for more than 1 minute. Speech-to-text transcription will fail."
          runbook: "https://wiki.ghatana.io/runbooks/audio-video/stt-down"

      - alert: TtsServiceDown
        expr: up{job="tts-service"} == 0
        for: 1m
        labels:
          severity: critical
          product: audio-video
          component: tts
        annotations:
          summary: "TTS gRPC service is down"
          description: "{{ $labels.instance }} has been unreachable for more than 1 minute. Text-to-speech synthesis will fail."
          runbook: "https://wiki.ghatana.io/runbooks/audio-video/tts-down"

      - alert: VisionServiceDown
        expr: up{job="vision-service"} == 0
        for: 1m
        labels:
          severity: critical
          product: audio-video
          component: vision
        annotations:
          summary: "Vision gRPC service is down"
          description: "{{ $labels.instance }} has been unreachable for more than 1 minute. Video/image analysis will fail."
          runbook: "https://wiki.ghatana.io/runbooks/audio-video/vision-down"

      - alert: MultimodalServiceDown
        expr: up{job="multimodal-service"} == 0
        for: 1m
        labels:
          severity: critical
          product: audio-video
          component: multimodal
        annotations:
          summary: "Multimodal gRPC service is down"
          description: "{{ $labels.instance }} has been unreachable for more than 1 minute."

      - alert: SttProviderNotReady
        expr: av_service_readiness{service="stt"} == 0
        for: 1m
        labels:
          severity: critical
          product: audio-video
          component: stt
        annotations:
          summary: "STT service provider readiness is down"
          description: "The observed STT readiness gauge is zero. Check public readiness and lifecycle, then inspect only redacted STT diagnostics and provider configuration. Keep traffic closed until readiness recovers; missing or unknown series do not trigger this alert."
          runbook: "docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook"

      - alert: TtsProviderNotReady
        expr: av_service_readiness{service="tts"} == 0
        for: 1m
        labels:
          severity: critical
          product: audio-video
          component: tts
        annotations:
          summary: "TTS service provider readiness is down"
          description: "The observed TTS readiness gauge is zero. Check public readiness and lifecycle, then inspect only redacted TTS diagnostics and provider configuration. Keep traffic closed until readiness recovers; missing or unknown series do not trigger this alert."
          runbook: "docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook"

      - alert: VisionProviderNotReady
        expr: av_service_readiness{service="vision"} == 0
        for: 1m
        labels:
          severity: critical
          product: audio-video
          component: vision
        annotations:
          summary: "Vision service provider readiness is down"
          description: "The observed Vision readiness gauge is zero. Check public readiness and lifecycle, then inspect only redacted Vision diagnostics and provider configuration. Keep traffic closed until readiness recovers; missing or unknown series do not trigger this alert."
          runbook: "docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook"

      - alert: MultimodalProviderNotReady
        expr: av_service_readiness{service="multimodal"} == 0
        for: 1m
        labels:
          severity: critical
          product: audio-video
          component: multimodal
        annotations:
          summary: "Multimodal service provider readiness is down"
          description: "The observed Multimodal readiness gauge is zero. Check public readiness and lifecycle, then inspect only redacted Multimodal diagnostics and provider configuration. Keep traffic closed until readiness recovers; missing or unknown series do not trigger this alert."
          runbook: "docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook"

      # A reachable scrape target with no modality readiness series indicates
      # stale/missing status instrumentation, not a failed or unadmitted provider.
      - alert: SttReadinessTelemetryMissing
        expr: label_replace(up{job="stt-service"}, "service", "stt", "job", ".*") == 1 unless on (job, instance, service) av_service_readiness{service="stt"}
        for: 2m
        labels:
          severity: warning
          product: audio-video
          component: stt
        annotations:
          summary: "STT readiness telemetry is missing"
          description: "The STT scrape target is reachable, but its readiness status has been absent for 2 minutes. Treat provider state as unknown; verify metrics instrumentation and scrape configuration before changing traffic."
          runbook: "docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook"

      - alert: TtsReadinessTelemetryMissing
        expr: label_replace(up{job="tts-service"}, "service", "tts", "job", ".*") == 1 unless on (job, instance, service) av_service_readiness{service="tts"}
        for: 2m
        labels:
          severity: warning
          product: audio-video
          component: tts
        annotations:
          summary: "TTS readiness telemetry is missing"
          description: "The TTS scrape target is reachable, but its readiness status has been absent for 2 minutes. Treat provider state as unknown; verify metrics instrumentation and scrape configuration before changing traffic."
          runbook: "docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook"

      - alert: VisionReadinessTelemetryMissing
        expr: label_replace(up{job="vision-service"}, "service", "vision", "job", ".*") == 1 unless on (job, instance, service) av_service_readiness{service="vision"}
        for: 2m
        labels:
          severity: warning
          product: audio-video
          component: vision
        annotations:
          summary: "Vision readiness telemetry is missing"
          description: "The Vision scrape target is reachable, but its readiness status has been absent for 2 minutes. Treat provider state as unknown; verify metrics instrumentation and scrape configuration before changing traffic."
          runbook: "docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook"

      - alert: MultimodalReadinessTelemetryMissing
        expr: label_replace(up{job="multimodal-service"}, "service", "multimodal", "job", ".*") == 1 unless on (job, instance, service) av_service_readiness{service="multimodal"}
        for: 2m
        labels:
          severity: warning
          product: audio-video
          component: multimodal
        annotations:
          summary: "Multimodal readiness telemetry is missing"
          description: "The Multimodal scrape target is reachable, but its readiness status has been absent for 2 minutes. Treat provider state as unknown; verify metrics instrumentation and scrape configuration before changing traffic."
          runbook: "docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook"

      # A present NaN gauge is invalid status telemetry, distinct from absence.
      - alert: SttReadinessTelemetryInvalid
        expr: (label_replace(up{job="stt-service"}, "service", "stt", "job", ".*") == 1) and on (job, instance, service) (av_service_readiness{service="stt"} != av_service_readiness{service="stt"})
        for: 2m
        labels:
          severity: warning
          product: audio-video
          component: stt
        annotations:
          summary: "STT readiness telemetry is invalid"
          description: "The STT scrape target is reachable, but its readiness gauge is NaN for 2 minutes. Treat provider state as unknown; repair metrics instrumentation before changing traffic."
          runbook: "docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook"

      - alert: TtsReadinessTelemetryInvalid
        expr: (label_replace(up{job="tts-service"}, "service", "tts", "job", ".*") == 1) and on (job, instance, service) (av_service_readiness{service="tts"} != av_service_readiness{service="tts"})
        for: 2m
        labels:
          severity: warning
          product: audio-video
          component: tts
        annotations:
          summary: "TTS readiness telemetry is invalid"
          description: "The TTS scrape target is reachable, but its readiness gauge is NaN for 2 minutes. Treat provider state as unknown; repair metrics instrumentation before changing traffic."
          runbook: "docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook"

      - alert: VisionReadinessTelemetryInvalid
        expr: (label_replace(up{job="vision-service"}, "service", "vision", "job", ".*") == 1) and on (job, instance, service) (av_service_readiness{service="vision"} != av_service_readiness{service="vision"})
        for: 2m
        labels:
          severity: warning
          product: audio-video
          component: vision
        annotations:
          summary: "Vision readiness telemetry is invalid"
          description: "The Vision scrape target is reachable, but its readiness gauge is NaN for 2 minutes. Treat provider state as unknown; repair metrics instrumentation before changing traffic."
          runbook: "docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook"

      - alert: MultimodalReadinessTelemetryInvalid
        expr: (label_replace(up{job="multimodal-service"}, "service", "multimodal", "job", ".*") == 1) and on (job, instance, service) (av_service_readiness{service="multimodal"} != av_service_readiness{service="multimodal"})
        for: 2m
        labels:
          severity: warning
          product: audio-video
          component: multimodal
        annotations:
          summary: "Multimodal readiness telemetry is invalid"
          description: "The Multimodal scrape target is reachable, but its readiness gauge is NaN for 2 minutes. Treat provider state as unknown; repair metrics instrumentation before changing traffic."
          runbook: "docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook"

      # These two rules deliberately consume fixture-only signals. They exercise
      # alert routing and redaction without asserting a live provider/model metric.
      - alert: MediaModelQualityRegressionFixture
        expr: max by (service) (av_model_quality_regression{source="fixture"} == 1)
        for: 1m
        labels:
          severity: warning
          product: audio-video
          component: model-quality-fixture
        annotations:
          summary: "Synthetic Media quality regression fixture observed"
          description: "A fixture-only quality regression signal was observed for {{ $labels.service }}. This validates alert evaluation only; do not infer provider quality or change production traffic."
          runbook: "docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook"

      - alert: MediaProviderSourceStaleFixture
        expr: max by (service) (time() - av_provider_source_timestamp_seconds{source="fixture"} > 300)
        for: 1m
        labels:
          severity: warning
          product: audio-video
          component: source-freshness-fixture
        annotations:
          summary: "Synthetic Media source freshness fixture is stale"
          description: "A fixture-only source timestamp for {{ $labels.service }} is more than 5 minutes old. This validates stale-source alert evaluation only; verify real source freshness through its owning system."
          runbook: "docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook"

  - name: audio_video.provider_profiles
    rules:
      - alert: MediaProviderProfileDegraded
        expr: count by (service, modality) (media_provider_profile_readiness{contract_version="v1"} == 0) > 0
        for: 2m
        labels:
          severity: warning
          product: audio-video
          component: provider-profile
        annotations:
          summary: "A Media provider profile is degraded"
          description: "A source-reported provider profile for {{ $labels.service }} ({{ $labels.modality }}) is degraded. Check the provider health source and keep any unqualified capability unavailable."
          runbook: "docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook"

      - alert: MediaProviderProfileUnavailable
        expr: count by (service, modality) (media_provider_profile_readiness{contract_version="v1"} == -1) > 0
        for: 1m
        labels:
          severity: critical
          product: audio-video
          component: provider-profile
        annotations:
          summary: "A Media provider profile is unavailable"
          description: "A source-reported provider profile for {{ $labels.service }} ({{ $labels.modality }}) is unavailable. Keep the dependent capability closed until its owning provider reports recovery."
          runbook: "docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook"

      - alert: MediaProviderProfileStale
        expr: count by (service, modality) (time() - media_provider_profile_checked_at_seconds{contract_version="v1"} > 300) > 0
        for: 1m
        labels:
          severity: warning
          product: audio-video
          component: provider-profile
        annotations:
          summary: "A Media provider profile health check is stale"
          description: "The latest provider health check for {{ $labels.service }} ({{ $labels.modality }}) is over five minutes old. Keep dependent capabilities closed until the owning profile reports a fresh check."
          runbook: "docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook"

  # -------------------------------------------------------------------------
  # Real source-derived model-quality rules. They consume only the bounded
  # media_provider_quality_* series exported from a verified, source-linked
  # evaluation report; absent or revoked evidence stays NaN and never fires a
  # phantom pass or failure. Threshold literals implement the owner-registered
  # R10 provisional reference limits (MEDIA-WAVE2-R10-OWNER-BLOCKER-RESOLUTION.json
  # approvedReferenceQualificationProfiles.stt: eng 0.30 / hin 0.45 / npi 0.55 on
  # upper-95% speaker-cluster WER). They gate alerting only, never admission.
  # -------------------------------------------------------------------------
  - name: audio_video.provider_quality
    rules:
      - alert: MediaProviderQualifiedQualityRegression
        expr: |
          media_provider_quality_measured_value{contract_version="v1", scope="independent_qualified", metric="wer_ci95_upper", locale="eng"} > 0.30
          or media_provider_quality_measured_value{contract_version="v1", scope="independent_qualified", metric="wer_ci95_upper", locale="hin"} > 0.45
          or media_provider_quality_measured_value{contract_version="v1", scope="independent_qualified", metric="wer_ci95_upper", locale="npi"} > 0.55
        for: 5m
        labels:
          severity: critical
          product: audio-video
          component: model-quality
        annotations:
          summary: "Qualified Media model quality regressed past the registered threshold"
          description: "The independently measured upper-95% WER for {{ $labels.model_revision }} (locale {{ $labels.locale }}) is {{ $value }}, above its registered reference threshold. Investigate the exact report provenance and keep the affected profile unadmitted until a healthy independent measurement clears this."
          runbook: "docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook"

      # A reference-only result is a development measurement, not a production
      # SLA breach; it still signals that a selected candidate is below bar.
      - alert: MediaProviderReferenceQualityBelowThreshold
        expr: |
          media_provider_quality_measured_value{contract_version="v1", scope="reference_only", metric="wer", locale="eng"} > 0.30
          or media_provider_quality_measured_value{contract_version="v1", scope="reference_only", metric="wer", locale="hin"} > 0.45
          or media_provider_quality_measured_value{contract_version="v1", scope="reference_only", metric="wer", locale="npi"} > 0.55
        for: 5m
        labels:
          severity: warning
          product: audio-video
          component: model-quality
        annotations:
          summary: "Reference-only Media model measurement is below the registered threshold"
          description: "A REFERENCE_ONLY measured WER for {{ $labels.model_revision }} (locale {{ $labels.locale }}) is {{ $value }}, above its registered provisional threshold. This is evaluation telemetry, not a production-user SLA alert; do not infer admission or reroute traffic from it."
          runbook: "docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook"

      # An observed provider profile with no valid measured quality is an
      # explicitly unknown capability state: absent, revoked, stale or mismatched
      # evidence must never read as a pass.
      - alert: MediaProviderQualityEvidenceMissing
        expr: |
          (media_provider_profile_readiness{contract_version="v1"} == media_provider_profile_readiness{contract_version="v1"})
          and on (service, modality, provider_id, provider_version, model_profile, model_revision, contract_version)
          (media_provider_quality_observation_timestamp_seconds{contract_version="v1"} != media_provider_quality_observation_timestamp_seconds{contract_version="v1"})
        for: 15m
        labels:
          severity: warning
          product: audio-video
          component: model-quality
        annotations:
          summary: "Media provider profile has no measured quality evidence"
          description: "Provider profile {{ $labels.provider_id }}/{{ $labels.model_revision }} ({{ $labels.modality }}) is observed, but its measured-quality timestamp is NaN for 15 minutes — the source evidence is absent, revoked, stale or mismatched. Treat the capability quality as unknown, not failed and not passed."
          runbook: "docs/OPERATIONS.md#degradation-recovery-and-actionable-runbook"

  # -------------------------------------------------------------------------
  # 2. STT (Speech-to-Text) Performance
  # -------------------------------------------------------------------------
  - name: audio_video.stt
    rules:
      - alert: SttGrpcHighErrorRate
        expr: |
          (
            rate(grpc_server_handled_total{job="stt-service", grpc_code!="OK"}[5m])
            /
            rate(grpc_server_handled_total{job="stt-service"}[5m])
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          product: audio-video
          component: stt
        annotations:
          summary: "STT service gRPC error rate above 5%"
          description: "STT gRPC error rate on {{ $labels.instance }} is {{ $value | humanizePercentage }}."

      - alert: SttTranscriptionLatencyHigh
        expr: |
          histogram_quantile(0.95,
            rate(grpc_server_handling_seconds_bucket{job="stt-service", grpc_method="Transcribe"}[5m])
          ) > 5
        for: 5m
        labels:
          severity: warning
          product: audio-video
          component: stt
        annotations:
          summary: "STT Transcribe p95 latency above 5s"
          description: "STT p95 transcription latency is {{ $value | humanizeDuration }} on {{ $labels.instance }}."

      - alert: SttTranscriptionLatencyCritical
        expr: |
          histogram_quantile(0.95,
            rate(grpc_server_handling_seconds_bucket{job="stt-service", grpc_method="Transcribe"}[5m])
          ) > 15
        for: 3m
        labels:
          severity: critical
          product: audio-video
          component: stt
        annotations:
          summary: "STT Transcribe p95 latency above 15s (critical)"
          description: "STT transcription severely degraded: p95={{ $value | humanizeDuration }} on {{ $labels.instance }}."

  # -------------------------------------------------------------------------
  # 3. TTS (Text-to-Speech) Performance
  # -------------------------------------------------------------------------
  - name: audio_video.tts
    rules:
      - alert: TtsGrpcHighErrorRate
        expr: |
          (
            rate(grpc_server_handled_total{job="tts-service", grpc_code!="OK"}[5m])
            /
            rate(grpc_server_handled_total{job="tts-service"}[5m])
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          product: audio-video
          component: tts
        annotations:
          summary: "TTS service gRPC error rate above 5%"
          description: "TTS gRPC error rate on {{ $labels.instance }} is {{ $value | humanizePercentage }}."

      - alert: TtsSynthesisLatencyHigh
        expr: |
          histogram_quantile(0.95,
            rate(grpc_server_handling_seconds_bucket{job="tts-service", grpc_method="Synthesize"}[5m])
          ) > 3
        for: 5m
        labels:
          severity: warning
          product: audio-video
          component: tts
        annotations:
          summary: "TTS Synthesize p95 latency above 3s"
          description: "TTS p95 synthesis latency is {{ $value | humanizeDuration }} on {{ $labels.instance }}."

  # -------------------------------------------------------------------------
  # 4. Vision Service Performance
  # -------------------------------------------------------------------------
  - name: audio_video.vision
    rules:
      - alert: VisionHighErrorRate
        expr: |
          (
            rate(grpc_server_handled_total{job="vision-service", grpc_code!="OK"}[5m])
            /
            rate(grpc_server_handled_total{job="vision-service"}[5m])
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          product: audio-video
          component: vision
        annotations:
          summary: "Vision service gRPC error rate above 5%"
          description: "Vision error rate on {{ $labels.instance }} is {{ $value | humanizePercentage }}."

      - alert: VisionInferenceLatencyHigh
        expr: |
          histogram_quantile(0.95,
            rate(grpc_server_handling_seconds_bucket{job="vision-service"}[5m])
          ) > 2
        for: 5m
        labels:
          severity: warning
          product: audio-video
          component: vision
        annotations:
          summary: "Vision service p95 inference latency above 2s"
          description: "Vision inference p95={{ $value | humanizeDuration }} on {{ $labels.instance }}."

  # -------------------------------------------------------------------------
  # 5. JVM Health (STT + TTS + Vision + Multimodal — all Java gRPC services)
  # -------------------------------------------------------------------------
  - name: audio_video.jvm
    rules:
      - alert: AudioVideoHighHeapMemory
        expr: |
          (
            jvm_memory_used_bytes{job=~"stt-service|tts-service|vision-service|multimodal-service", area="heap"}
            /
            jvm_memory_max_bytes{job=~"stt-service|tts-service|vision-service|multimodal-service", area="heap"}
          ) > 0.85
        for: 5m
        labels:
          severity: warning
          product: audio-video
        annotations:
          summary: "Audio-Video JVM heap usage above 85%"
          description: "{{ $labels.job }} heap on {{ $labels.instance }} at {{ $value | humanizePercentage }}."

      - alert: AudioVideoHighHeapMemoryCritical
        expr: |
          (
            jvm_memory_used_bytes{job=~"stt-service|tts-service|vision-service|multimodal-service", area="heap"}
            /
            jvm_memory_max_bytes{job=~"stt-service|tts-service|vision-service|multimodal-service", area="heap"}
          ) > 0.95
        for: 3m
        labels:
          severity: critical
          product: audio-video
        annotations:
          summary: "Audio-Video JVM heap critically full (>95%)"
          description: "OOM imminent: {{ $labels.job }} on {{ $labels.instance }} at {{ $value | humanizePercentage }}."

      - alert: AudioVideoFrequentGcPauses
        expr: |
          rate(jvm_gc_pause_seconds_sum{job=~"stt-service|tts-service|vision-service|multimodal-service"}[5m])
          /
          rate(jvm_gc_pause_seconds_count{job=~"stt-service|tts-service|vision-service|multimodal-service"}[5m])
          > 0.5
        for: 10m
        labels:
          severity: warning
          product: audio-video
        annotations:
          summary: "Audio-Video JVM GC pauses averaging above 500ms"
          description: "{{ $labels.job }} on {{ $labels.instance }} averaging {{ $value | humanizeDuration }} GC pauses."

      - alert: AudioVideoThreadPoolExhaustion
        expr: |
          jvm_threads_states_threads{job=~"stt-service|tts-service|vision-service|multimodal-service", state="blocked"} > 30
        for: 5m
        labels:
          severity: warning
          product: audio-video
        annotations:
          summary: "Audio-Video JVM has >30 blocked threads"
          description: "{{ $labels.job }} on {{ $labels.instance }} has {{ $value }} blocked threads — possible deadlock."

  # -------------------------------------------------------------------------
  # 6. Infrastructure
  # -------------------------------------------------------------------------
  - name: audio_video.infrastructure
    rules:
      - alert: AudioVideoNodeHighCpu
        expr: |
          100 - (avg by(instance) (rate(node_cpu_seconds_total{job="node", mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
          product: audio-video
        annotations:
          summary: "Audio-Video node CPU above 85%"
          description: "Node {{ $labels.instance }} sustained CPU at {{ $value | humanize }}% for 10 minutes."

      - alert: AudioVideoNodeDiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{job="node", mountpoint="/"} / node_filesystem_size_bytes{job="node", mountpoint="/"}) < 0.10
        for: 5m
        labels:
          severity: warning
          product: audio-video
        annotations:
          summary: "Audio-Video node disk space below 10%"
          description: "{{ $labels.instance }} has {{ $value | humanizePercentage }} disk remaining on /."

      - alert: AudioVideoNodeHighMemory
        expr: |
          (1 - (node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"})) > 0.90
        for: 5m
        labels:
          severity: critical
          product: audio-video
        annotations:
          summary: "Audio-Video node memory above 90%"
          description: "Node {{ $labels.instance }} at {{ $value | humanizePercentage }} memory usage."

  # -------------------------------------------------------------------------
  # 7. Media Durable Workflow (launcher job processing + lifecycle publication)
  #    Metrics emitted by MediaWorkflowMetrics — bounded cardinality only:
  #    service, stage, event, contract_version. No tenant/request/job/attempt
  #    identity is ever exported as a label.
#
# Provider-quality alert rules are defined in audio_video.provider_quality.
# They report source-linked measurements only; they do not admit providers.
# Provider readiness uses the shared gRPC server lifecycle's low-cardinality gauge.
  # -------------------------------------------------------------------------
  - name: media.workflow
    rules:
      - alert: MediaJobLeaseStuck
        expr: |
          max by (service) (
            media_workflow_lease_overdue{contract_version="v1"}
            and on (service, contract_version)
            (media_workflow_aggregate_store_queries_supported{contract_version="v1"} == 1)
          ) > 0
        for: 10m
        labels:
          severity: critical
          product: audio-video
          component: workflow
        annotations:
          summary: "Media job leases overdue without recovery"
          description: "{{ $value }} durable Media job lease(s) on {{ $labels.service }} have stayed expired for over 10 minutes — a worker may have crashed or job-store recovery may be stalled. Inspect worker health and rerun the restart-reconciliation procedure in docs/OPERATIONS.md."

      - alert: MediaOutboxClaimLeaseStuck
        expr: |
          max by (service) (
            media_workflow_outbox_lease_overdue{contract_version="v1"}
            and on (service, contract_version)
            (media_workflow_outbox_aggregate_store_queries_supported{contract_version="v1"} == 1)
          ) > 0
        for: 10m
        labels:
          severity: critical
          product: audio-video
          component: workflow
        annotations:
          summary: "Media lifecycle outbox claim leases remain expired"
          description: "{{ $value }} durable Media outbox claim lease(s) on {{ $labels.service }} have remained expired for 10 minutes. Inspect the publisher and reconcile broker acknowledgement before replaying any event; do not infer publication from a local claim."

      - alert: MediaUnknownFinalityBacklog
        expr: |
          max by (service) (
            media_workflow_unknown_backlog{contract_version="v1"}
            and on (service, contract_version)
            (media_workflow_aggregate_store_queries_supported{contract_version="v1"} == 1)
          ) > 25
        for: 15m
        labels:
          severity: warning
          product: audio-video
          component: workflow
        annotations:
          summary: "Media jobs with unknown finality are accumulating"
          description: "{{ $value }} Media job(s) on {{ $labels.service }} are in OUTCOME_UNKNOWN for over 15 minutes. Provider outcome reconciliation is falling behind — check provider connectivity and the reconciliation pass before resubmitting anything; unknown outcomes must never be blindly retried."

      - alert: MediaPublicationAmbiguityIncreasing
        expr: |
          sum by (service) (rate(media_workflow_events_total{contract_version="v1", event="publication_ambiguous"}[15m])) > 0
        for: 5m
        labels:
          severity: critical
          product: audio-video
          component: workflow
        annotations:
          summary: "Media lifecycle publication outcomes are ambiguous"
          description: "The lifecycle outbox on {{ $labels.service }} is recording ambiguous broker-acknowledgement outcomes. Events may be safely claimed and fenced but publication finality is unconfirmed — verify the event-plane broker and follow the outbox replay/DLQ procedure in docs/OPERATIONS.md."

      - alert: MediaPolicyDenialRateHigh
        expr: |
          (
            sum by (service) (rate(media_workflow_events_total{contract_version="v1", event="denied"}[10m]))
            /
            sum by (service) (rate(media_workflow_requests_total{contract_version="v1"}[10m]))
          ) > 0.20
        for: 10m
        labels:
          severity: warning
          product: audio-video
          component: workflow
        annotations:
          summary: "Media policy/governance denial rate above 20%"
          description: "Over 20% of Media workflow requests on {{ $labels.service }} are being denied by security, consent, or governance checks for 10 minutes. Confirm consent authorities are reachable and that upstream clients are sending authorized requests."

      - alert: MediaQueueCapacityHigh
        expr: |
          max by (service) (
            media_workflow_queue_depth{contract_version="v1"}
            and on (service, contract_version)
            (media_workflow_aggregate_store_queries_supported{contract_version="v1"} == 1)
          ) > 500
        for: 10m
        labels:
          severity: warning
          product: audio-video
          component: workflow
        annotations:
          summary: "Media work queue depth above 500"
          description: "The Media job dispatch queue on {{ $labels.service }} has held more than 500 pending items for 10 minutes. Check global and per-tenant concurrency limits, provider latency, and worker availability before increasing capacity."

      - alert: MediaWorkflowAggregateStoreMetricsUnavailable
        expr: |
          media_workflow_aggregate_store_queries_supported{contract_version="v1"} == 0
        for: 15m
        labels:
          severity: warning
          product: audio-video
          component: workflow
        annotations:
          summary: "Media job store cannot supply aggregate workflow metrics"
          description: "The configured Media job store on {{ $labels.service }} reports unsupported or failed aggregate queries backing lease/backlog/queue-depth gauges. Initial NaN/unknown state does not trigger this alert; a known unsupported or failed refresh does."

      - alert: MediaWorkflowOutboxMetricsUnavailable
        expr: |
          media_workflow_outbox_aggregate_store_queries_supported{contract_version="v1"} == 0
        for: 15m
        labels:
          severity: warning
          product: audio-video
          component: workflow
        annotations:
          summary: "Media outbox cannot supply aggregate lease metrics"
          description: "The configured Media outbox on {{ $labels.service }} reports unsupported or failed expired-claim queries. Initial NaN/unknown state does not trigger this alert; a known unsupported or failed refresh does."
