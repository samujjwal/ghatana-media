schemaVersion: increment6.manifest.v1
state: CANDIDATE
required: true
protocolAuthority:
  schemaVersion: document-intelligence.increment6-protocol-authority.v1
  status: CANDIDATE
  protocolVersion: document-intelligence.v1
  endpoints:
    - GET /v1/providers
    - POST /v1/parse
    - POST /v1/extract
    - POST /v1/embed
    - DELETE /v1/operations/{operationId}
  coreSchemas:
    - embed.request.schema.json
    - embed.response.schema.json
    - error.schema.json
    - extract.request.schema.json
    - extract.response.schema.json
    - operations-delete.schema.json
    - parse.request.schema.json
    - parse.response.schema.json
    - providers.response.schema.json
    - request-metadata.schema.json
  mappings:
    - taskId: I6-03
      authority: PROTOCOL_FREEZE
      executableCheck: protocolFreeze
    - taskId: I6-04
      authority: BACKWARD_COMPATIBILITY
      executableCheck: backwardCompatibility
    - taskId: I6-05
      authority: ADDITIVE_VERSIONED_EXTENSIONS
      executableCheck: additiveVersionedExtensions
    - taskId: I6-06
      authority: NEGOTIATION
      executableCheck: negotiation
  protocolDocument: contracts/protocol-v1.md
  extensionPolicy: contracts/protocol-extensions.v1.md
  schemaDirectory: contracts/schemas/v1
  canonicalCompatibilityFixtures: contracts/fixtures/i3-canonical
  focusedTests:
    backwardCompatibility: tests/contract/test_i3_canonical_requests.py
    wireGrammar: tests/contract/test_protocol_v1.py
    negotiation: clients/typescript/tests/providers-catalog.test.ts
  supportedWorkerCapabilityVersions:
    - document-intelligence-worker.v1
  legacyWorkerCapabilityVersion: document-intelligence.v1-legacy
  negotiationEndpoint: GET /v1/providers
groundTruth:
  reviewed: true
  reviewVersion: increment6-r1
  supersededMaterialAllowed: false
authorities:
  qualification: qualification.yaml
  acceptance: acceptance.yaml
  environment: environment.yaml
  modelManifest: models/increment4a/model-manifest.yaml
  languageRegistry: models/increment4a/language-registry.yaml
  corpus: corpus
  routing:
  - routing/scanned-pdf.v1.yaml
  - routing/fallback-contract.v1.yaml
  profile: profiles/increment6.yaml
  performanceEvidenceSchema: schemas/performance-evidence.v1.schema.json
lanes:
- id: scanned-pdf
  corpusDir: corpus/scanned-pdf
  fixturesManifest: corpus/scanned-pdf/fixtures.yaml
  purpose: scanned-PDF page classification with hybrid provenance (I6-06..I6-08)
  qualificationInput: PAGE_FACTS_CONTRACT
  fixtureBinaryDependent: false
  ownerCapabilityIds:
  - parser.pdf.scanned.classify.en
  - parser.pdf.scanned.classify.ne
  - parser.pdf.scanned.classify.hi
  - parser.pdf.scanned.classify.mr
