  - parser.pdf.hybrid.provenance.ne
  - parser.pdf.hybrid.provenance.hi
  - parser.pdf.hybrid.provenance.mr
- id: hybrid-provenance
  corpusDir: corpus/hybrid-provenance
  fixturesManifest: corpus/hybrid-provenance/fixtures.yaml
