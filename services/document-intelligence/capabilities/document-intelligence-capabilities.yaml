# document-intelligence.capabilities.v1
#
# Canonical capability-state authority (P0-05, P0-06). Every known capability
# records its development state, consumer-admission disposition, owning
# increment, profiles, and — for anything not qualified — the future owner
# that must qualify it.
#
# developmentState:
#   QUALIFIED       frozen qualification evidence exists and is current
#   NOT_QUALIFIED   evaluated or implemented but below acceptance authority
#   UNSUPPORTED     deliberately not supported by design
#   NOT_APPLICABLE  out of domain for this program
#
# consumerAdmission:
#   ALLOWED         may be advertised/admitted to product consumers
#   DENIED          never advertised/admitted regardless of developmentState
#
# futureOwner (required unless developmentState == QUALIFIED):
#   DEFERRED_TO_INCREMENT_5 | DEFERRED_TO_INCREMENT_6 |
#   DEFERRED_TO_RELEASE_READINESS | DEFERRED_TO_EXTERNAL_CERTIFICATION |
#   UNSUPPORTED_BY_DESIGN | NONE
schemaVersion: document-intelligence.capabilities.v1

profiles:
  default:      # frozen Increment-3 canonical profile
    description: Canonical Increment-3 runtime; unchanged by 4A/5/6 work.
  increment4a:  # frozen Increment-4A extended profile
    description: Cumulative I3 base + accepted I4A extensions.
  increment5:   # learning pipeline (no runtime admission)
    description: Governed learning; produces candidates only.
  increment6:   # experimental production-breadth profile (I6-02)
    description: Candidate/experimental; not consumer-admissible until qualified.

