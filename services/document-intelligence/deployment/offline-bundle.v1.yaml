  - ref: ghatana.tesseractocr/tesseract-5@local-traineddata:executable
    sha256: 9f831cab7525c3dab04af41bda35182af7ea1df9dceeaaa2f3bf207ac45c06a5
    source: models/increment4a/model-manifest.yaml
    path: .models/tesseract-runtime/usr/bin/tesseract
    kind: executable
  - ref: ghatana.tesseractocr/tesseract-5@local-traineddata:traineddata.eng
    sha256: 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2
    source: models/increment4a/model-manifest.yaml
    path: .models/tesseract-runtime/usr/share/tesseract-ocr/5/tessdata/eng.traineddata
    kind: traineddata
  - ref: ghatana.tesseractocr/tesseract-5@local-traineddata:traineddata.nep
    sha256: 280ba9450b4f21afbf5985e0de87857b75a972577c50ef0603c141ddde4f1cb8
    source: models/increment4a/model-manifest.yaml
    path: .models/tesseract-runtime/usr/share/tesseract-ocr/5/tessdata/nep.traineddata
    kind: traineddata
  - ref: ghatana.tesseractocr/tesseract-5@local-traineddata:traineddata.hin
    sha256: 4c73ffc59d497c186b19d1e90f5d721d678ea6b2e277b719bee4e2af12271825
    source: models/increment4a/model-manifest.yaml
    path: .models/tesseract-runtime/usr/share/tesseract-ocr/5/tessdata/hin.traineddata
    kind: traineddata
  - ref: ghatana.tesseractocr/tesseract-5@local-traineddata:traineddata.mar
    sha256: 0ba3f2d116972e72fe9e176bc84c38e81dfb6670f4ed1f7f6c8e16a27da7cb61
    source: models/increment4a/model-manifest.yaml
    path: .models/tesseract-runtime/usr/share/tesseract-ocr/5/tessdata/mar.traineddata
    kind: traineddata

# Python runtime identity. uvLockSha256 is verified against the real uv.lock
# bytes; version must equal the interpreter running the build.
pythonRuntime:
  version: "3.12.3"
  uvLockSha256: fd4ef3f9291f5b281cf7372cbdc771f1882396d55993ea59e2ea1b9230993960

# Application source trees bundled with the worker. Each path is digested as
# sorted (root-relative path, content sha256) pairs and recorded in the
# emitted manifest.
applicationSources:
  - src/document_intelligence/
  - clients/
  - contracts/
  - routing/
  - profiles/
  - scripts/

# Policies governing deployment of this bundle.
policyRefs:
  - deployment/deployment-gates.v1.yaml
  - deployment/vulnerability-policy.v1.yaml
  - deployment/activation.v1.yaml
  - deployment/operational-envelope.v1.yaml
  - capabilities/document-intelligence-capabilities.yaml
