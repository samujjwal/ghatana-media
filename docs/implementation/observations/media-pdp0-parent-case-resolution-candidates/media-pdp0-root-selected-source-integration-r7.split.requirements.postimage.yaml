  - id: MEDIA-REQ-CAP-PROFILE
    scopeStatus: TARGET
    statement: Every operation in media.profile retains the intended semantic outcome in the full product definition and is invocable only through an explicit, authorized, compatible binding whose current implementation, license admission, qualification, and runtime availability are separately established.
