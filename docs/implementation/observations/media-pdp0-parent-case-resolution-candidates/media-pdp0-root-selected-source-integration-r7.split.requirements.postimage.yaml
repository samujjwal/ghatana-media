        then: The typed result, effective parameters, provenance, terminal/finality state, and measured dimensions are returned; only the declared effect occurs.
      - id: MEDIA-REQ-CAP-SPEECH-SYNTHESIS-AC-02
        given: The requested language, format, right, profile, license, capability, or qualification is absent or unknown.
        when: Admission is evaluated.
        then: The operation is blocked or returns an explicit qualified fallback only when policy permits; unknown is never reported as available.
      - id: MEDIA-REQ-CAP-SPEECH-SYNTHESIS-AC-03
        given: A creator requests conversational text composition, rewriting, or a response to a user-provided utterance or context for a declared voice/personality profile.
        when: the system prepares proposed response text for speech synthesis.
        then: treat the response as system-authored content distinct from speaker-conditioned audio; preserve its declared request/context provenance and the identity boundary; distinguish supplied, quoted, and generated content; label factual claims as unverified unless supported by an explicitly linked source and its applicable review.
        rejection: reject implying that voice conditioning authored, verified, or authorized response text or its claims; reject presenting generated text as a user statement, verified fact, or approved communication.
      - id: MEDIA-REQ-CAP-SPEECH-SYNTHESIS-AC-04
        given: A creator requests singing-voice synthesis conditioned on an identifiable voice, source recording, or voice model.
        when: the product produces a permitted synthesis result.
        then: retain the declared voice, source, and model provenance with the resulting media.
        rejection: reject omitting the provenance needed to distinguish the source and model used for the derived voice result.
      - id: MEDIA-REQ-CAP-SPEECH-SYNTHESIS-AC-05
        given: A user explicitly starts a full-duplex voice conversation and authorizes a live speech-input session; the streaming transcription and streaming synthesis leaves are separately admitted for the requested scope.
        when: Media concurrently receives live speech input and prepares or returns a generated spoken response for the current conversational turn.
        then: provide a response attributable to the current user-initiated turn, distinguish observed or transcribed input from generated response text and synthesized audio, expose whether the turn is still streaming or complete, and preserve interruption and cancellation as explicit outcomes; do not modify a project or publish a response as a separate effect.
        rejection: reject hidden or background microphone capture, continuing capture after the user ends the session, representing partial or uncertain recognition as confirmed input, or reporting a complete response when the outcome is unknown or unavailable.
      - id: MEDIA-REQ-CAP-SPEECH-SYNTHESIS-AC-06
        given: A creator supplies an authorized narration or text source with ordered chapter and paragraph boundaries and requests an audiobook output in a declared M4B profile.
        when: Media prepares the requested speech artifact and audiobook package.
        then: Preserve the supplied chapter and paragraph order and boundaries in the audiobook candidate, bind the requested voice and source provenance to that candidate, and expose the requested M4B package and metadata only as candidate properties. If authorization, source/audio/voice/package rights or license, M4B format support, profile admission, or qualification is denied, absent, or unknown, apply MEDIA-REQ-CAP-SPEECH-SYNTHESIS-AC-02; never report the requested format as available on unknown evidence or imply completed delivery.
        rejection: Reject flattening or reordering supplied boundaries, inventing chapter metadata, silently substituting a format or voice, or representing candidate metadata as proof of qualified format support, completed audio, or delivery.
      - id: MEDIA-REQ-CAP-SPEECH-SYNTHESIS-AC-07
        given: A creator supplies an authorized, rights-cleared source, ordered text segments, and an authorized, rights-cleared, admitted voice/personality profile with the exact shared context intended to govern their synthesis.
        when: Media prepares speech for those segments as one continuous work.
        then: Represent the declared segment order and shared context/profile as requested candidate properties; report continuity as established only for segments where the admitted operation establishes it, and expose other segments as denied, unsupported, or unknown. Apply MEDIA-REQ-CAP-SPEECH-SYNTHESIS-AC-02 if source, voice, profile, authorization, rights, or license admission is denied, absent, or unknown; a candidate property does not guarantee audible continuity.
        rejection: Reject claiming cross-segment continuity from unrelated or missing context, silently changing the declared profile, or treating an unavailable or unknown continuity result as established or guaranteeing audible identity/continuity.
      - id: MEDIA-REQ-CAP-SPEECH-SYNTHESIS-AC-08
        given: An authorized creator supplies an ordered story or speech plan with explicit segment boundaries and an authorized speaker assignment for each segment.
        when: The product prepares or generates speech for the ordered segments.
        then: Preserve segment order and boundaries, bind each segment to its exact authorized speaker and applicable rights evidence, and return per-segment voice, source, and generated-audio provenance with any unavailable assignment marked explicitly.
        rejection: Reject using a speaker without current authorization for the segment and purpose, silently substituting a voice or reordering segments, or claiming a generated artifact is committed when it is only a candidate.
      - id: MEDIA-REQ-CAP-SPEECH-SYNTHESIS-AC-09
        given: An authorized synthesis request pins the exact requested speaker or voice, model/checkpoint, profile, worker, and source version for the declared purpose.
        when: Media returns a generated-audio candidate or execution observation.
        then: Report requested and observed speaker/voice, model/checkpoint, profile, worker, and source identities separately for the exact output; preserve mismatch or unobserved identity as UNKNOWN and retain the output as synthetic media.
        rejection: Reject silently substituting a speaker, voice, model, checkpoint, profile, or worker; inferring the effective identity from the request alone; or treating a configured identity as proof of the output's authorship, rights, or authenticity.
