        given: An authorized creator supplies an exact versioned data source, schema, selected fields or values, transformation, and intended visual encoding for a chart or animated visualization.
        when: Media prepares a data-bearing recipe candidate.
        then: Bind each plotted series and value to its source fields, transformation, and source version, distinguishing data-bearing marks from decorative imagery.
        rejection: Reject presenting generated or decorative values as sourced data; missing schema, field, transformation support, or validation remains UNKNOWN or UNSUPPORTED.
      - id: MEDIA-REQ-CAP-RECIPE-TEMPLATE-AC-11
        given: An authorized lesson author supplies versioned content and schema for a quiz or reflection interaction.
        when: Media prepares the learner interaction candidate.
        then: Keep prompts and responses within the declared lesson and session scope and return a reviewable candidate.
        rejection: Reject privileged product or learner-record mutation, grading or identity assertions, or state writes without a separately defined authorized owner operation.
      - id: MEDIA-REQ-CAP-RECIPE-TEMPLATE-AC-12
        given: An authorized creator selects a reusable style skill or branded scene recipe and supplies exact versioned brand assets and typed parameters.
        when: Media prepares a scene candidate from the selected recipe.
        then: Bind the editable candidate to the recipe version, each declared style parameter, the exact brand asset versions, and unresolved constraints.
        rejection: Reject inferring brand identity or permissions from appearance, silently substituting assets or parameters, or presenting an unreviewed candidate as a committed project change.
      - id: MEDIA-REQ-CAP-RECIPE-TEMPLATE-AC-13
        given: An authorized creator supplies an exact versioned production specification and source schema, an exact requested target schema, and an explicitly declared supported versioned transformation as a complete migration input set.
        when: Media prepares a schema-migration candidate under the named compiler-contract and transformation versions.
        then: Return a reviewable candidate and semantic diff bound to the exact source specification, source schema, target schema, and transformation identities and versions; preserve the original source; repeating the same exact inputs and versions yields an equivalent candidate and stable semantic fingerprint.
        rejection: Reject or return UNKNOWN/UNSUPPORTED for missing, stale, or ambiguous source/target versions; do not apply a migration or create a project, job, publication, or external effect.
      - id: MEDIA-REQ-CAP-RECIPE-TEMPLATE-AC-14
        given: A requested schema transformation is unsupported, lossy, ambiguous, absent from the declared supported transformations, or has unknown compatibility.
        when: Media is asked to prepare a migration candidate.
        then: Return an explicit UNKNOWN/UNSUPPORTED outcome with the unresolved transformation or compatibility fact; preserve the source and return no migration candidate.
        rejection: Reject inferring a conversion, silently substituting a transformation, mutating the source/project, submitting a job, publishing content, or claiming a completed migration.
      - id: MEDIA-REQ-CAP-RECIPE-TEMPLATE-AC-15
        given: An authorized creator supplies an exact supported production specification and schema with no schema-migration target or transformation input.
        when: Media performs ordinary specification compilation under the named compiler-contract version.
        then: Return the existing normalized semantic graph and reviewable project-plan candidate; do not require or emit a migration candidate or semantic diff.
        rejection: Do not infer migration intent from absent or partial migration inputs, change ordinary compilation output, apply a migration, or cause a project, job, publication, or external effect.
      - id: MEDIA-REQ-CAP-RECIPE-TEMPLATE-AC-16
        given: An authorized creator supplies the exact versioned source production specification and schema, requested target schema, explicitly declared supported transformation identity/version, and exact compiler-contract version.
        when: Media prepares a schema-migration candidate under the exact migration intent.
        then: Return the existing normalized graph/project-plan candidate plus the required reviewable version-bound migration candidate and semantic diff; bind source, target, transformation, and compiler-contract identities/versions and preserve the original.
        rejection: Do not apply the migration, mutate a project, submit a job, publish content, cause an external effect, or claim that the candidate is migrated media or lossless preservation.
      - id: MEDIA-REQ-CAP-RECIPE-TEMPLATE-AC-17
        given: A migration intent omits or has a stale, unsupported, lossy, ambiguous, or unknown source schema, target schema, transformation, or compiler-contract version.
        when: Media evaluates the migration request.
        then: Return an explicit UNKNOWN/UNSUPPORTED or rejected result and no migration candidate; preserve source identities and do not change ordinary compile output.
        rejection: Do not infer a target, substitute a transformation, emit a success-shaped migration candidate, apply any migration, or cause a project, job, publication, or external effect.
      - id: MEDIA-REQ-P0-C03-AUD-SOCIAL-011
        given: Exact versioned source values/claims, chart intent and declared animation parameters.
        when: Request animated chart/metric candidate.
        then: Return versioned candidate with every displayed value linked to exact source field and transform. Invalid/missing values UNKNOWN; no invented labels/trends/claims; no render/publication. PDP-0 truthful output; data/animation identities PDP-1; rendering BUILD.
