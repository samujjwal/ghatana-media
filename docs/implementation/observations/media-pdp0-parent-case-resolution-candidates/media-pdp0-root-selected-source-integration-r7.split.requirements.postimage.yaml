      rejection: reject promotion to scientific validation from a render score, resolution, polygon/detail level, or visual similarity; reject conflating visual level of detail, visual quality, model fidelity, and validation tier or inventing a Media interpretation of TutorPutor F0–F4.
      scope: DEFINITION_REQUIREMENT_NOT_RUNTIME_PROOF
