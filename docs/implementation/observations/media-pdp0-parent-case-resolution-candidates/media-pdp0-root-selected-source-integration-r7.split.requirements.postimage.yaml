        when: Admission evaluates the same operation with an unsupported, denied, stale, or unknown required condition.
        then: Return UNKNOWN, UNAVAILABLE, or REJECTED as applicable; do not substitute burned-in overlay composition or claim a delivered package.
      - id: MEDIA-REQ-P0-C03-AUD-TRUST-006
        given: Exact immutable bytes/version, manifest, signer/key/trust refs and requested creation or verification action.
