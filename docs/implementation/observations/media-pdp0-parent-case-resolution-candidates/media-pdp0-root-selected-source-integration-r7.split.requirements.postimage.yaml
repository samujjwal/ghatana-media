      - The caller identity, tenant/workspace context, and delegated authority are verified by the owning platform contracts.
      - Inputs, rights, consent, privacy, egress, retention, budget, and policy are admitted for this specific operation.
      - A capability binding and profile are declared; qualification and runtime availability are checked for the requested dimensions.
    expectedBehavior: The system performs only the requested Multitrack timelines; scene/storyboard assembly; video/audio/caption/overlay tracks; transitions; titles/credits/lower thirds; exact typography/logos/brand assets; safe areas; reusable compositions and render manifests operation using typed inputs and outputs; reports actual effective parameters and provenance; preserves source versions; and does not substitute an unsupported engine, model, format, language, or delivery profile silently.
    importantStates:
      - not-admitted
      - admitted
      - running-or-observing
      - completed
      - failed
      - cancel-requested-or-finality-unknown
      - blocked-by-policy-or-capability
    stateModelBindingState: bound-to-proposed-project-version-models; P0-005 semantic-owner-review-pending
    consequences:
      - Any change to source bytes, version, rights, meaning, fidelity, destination, or externally visible effect is explicit and traceable.
      - A completed definition record never implies runtime readiness or qualification.
    failureDegradationRecovery:
      - Return typed validation, authority, rights/license, unsupported-capability, capacity, timeout, cancellation, provider-ambiguity, and internal-failure outcomes as applicable.
      - Expose safe remediation, retry/cancel/reconcile eligibility, and finality; do not silently downgrade preservation, quality, spatial/scientific fidelity, or delivery constraints.
      - Preserve accepted source and completed outputs; require policy-permitted explicit fallback or stop for review.
    nonfunctionalRequirements:
      - tenant isolation and least privilege
      - privacy/data minimization and governed egress
      - durable audit/effect intent for consequential effects
      - bounded time/memory/storage/compute/cost
      - accessible semantic representation and keyboard operation where interactive
      - localization and explicit unsupported language/format bounds
      - provenance, reproducibility class, and recovery truth
    acceptanceCases:
      - id: MEDIA-REQ-CAP-COMPOSE-AC-01
        given: A declared leaf, authorized input, and a binding that satisfies the requested profile and policy.
        when: The caller requests the operation.
        then: The typed result, effective parameters, provenance, terminal/finality state, and measured dimensions are returned; only the declared effect occurs.
      - id: MEDIA-REQ-CAP-COMPOSE-AC-02
        given: The requested language, format, right, profile, license, capability, or qualification is absent or unknown.
        when: Admission is evaluated.
        then: The operation is blocked or returns an explicit qualified fallback only when policy permits; unknown is never reported as available.
      - id: MEDIA-REQ-CAP-COMPOSE-AC-03
        given: An actor requests an active-speaker-aware multicamera cut proposal from admitted speaker-turn and camera-source observations.
        when: The product prepares the proposal.
        then: Return a reviewable local candidate that links each proposed cut to its speaker-turn and camera-source evidence and makes uncertainty explicit.
        rejection: Reject inferring missing speaker/camera evidence or committing the proposal to the project without an explicit separate approval.
      - id: MEDIA-REQ-CAP-COMPOSE-AC-04
        given: An authorized editor selects exact audio-track versions and declares gain, pan, and time-varying automation points with a timebase and project revision.
        when: The product prepares the multitrack edit.
        then: Return a local reviewable candidate that preserves track and source-version identities, records the requested automation points and any validation uncertainty, and leaves project state unchanged until explicit confirmation.
        rejection: Reject collapsing automation to an undocumented static value, mutating the project or source audio before confirmation, or implying a rendered output from the candidate.
      - id: MEDIA-REQ-CAP-COMPOSE-AC-05
        given: An authorized editor selects an exact speech source version and specifies a sample-time region edit, including intended boundaries and any crossfade parameters.
        when: The product prepares the speech edit against the declared sample rate and timebase.
        then: Return a reviewable local candidate with exact source-version and sample-boundary references, disclose boundary quantization or crossfade validation uncertainty, and preserve the source and project revision.
        rejection: Reject silently shifting boundaries, inventing crossfade values, modifying the source, or claiming the candidate has been rendered or committed.
      - id: MEDIA-REQ-CAP-COMPOSE-AC-06
        given: An authorized editor requests overlay placement in apparent free space for an exact source version and time interval.
        when: The product evaluates detected free-space evidence and prepares a placement suggestion.
        then: Return an uncertain local placement candidate tied to the exact source version, time range, declared overlay, and detection context, preserving the evidence and allowing review before any composition change.
        rejection: Reject presenting detected free space as guaranteed safe or unobstructed, omitting uncertainty or source-time context, or applying or rendering the placement without explicit authorization.
      - id: MEDIA-REQ-CAP-COMPOSE-AC-07
        given: An authorized creator selects a branded motion template and supplies typed editable parameters bound to identified brand assets and a project revision.
        when: The product instantiates the template as a composition proposal.
        then: Return an editable local candidate that identifies the template version, each typed parameter and its binding, exact source and brand-asset versions, and unresolved parameter constraints; leave the project unchanged pending review and confirmation.
        rejection: Reject silently substituting brand assets or parameter values, claiming preview or render parity without evidence, or committing the proposal before confirmation.
      - id: MEDIA-REQ-CAP-COMPOSE-AC-08
        given: An authorized editor has a take intent classified as captured ADR, generated narration, or captured or generated room tone, with exact source or session provenance and a declared timeline location.
        when: The product prepares placement in the multitrack composition.
        then: Return a reviewable local placement candidate that preserves the content-origin distinction, exact source or generation provenance, intended time range, and any alignment uncertainty without mutating the project.
        rejection: Reject relabeling generated narration as captured ADR, treating a recording intent as captured content, conflating captured and generated room tone, or committing or rendering the edit without explicit authorization.
      - id: MEDIA-REQ-CAP-COMPOSE-AC-09
        given: An authorized editor declares protected text or logo regions on an exact source version, or detection evidence for those regions is uncertain.
        when: Media prepares an overlay or reframe candidate.
        then: Preserve declared protected regions or mark the candidate unresolved for review, retaining source-version and time-range evidence.
        rejection: Reject claiming protected content is preserved when region evidence is absent or uncertain, changing the source, or committing the candidate without confirmation.
      - id: MEDIA-REQ-CAP-COMPOSE-AC-10
        given: An authorized editor declares a target aspect ratio, exact source version, time range, and eligible subject evidence for automatic framing.
        when: Media prepares a subject-aware framing candidate.
        then: Bind the candidate to the declared target and source-time evidence and disclose uncertainty and any crop or excluded source region.
        rejection: Reject claiming all subjects or content remain in frame when evidence is uncertain, silently changing aspect ratio, or modifying or rendering the source without confirmation.
      - id: MEDIA-REQ-CAP-COMPOSE-AC-11
        given: An authorized editor selects exact track versions and declares track-to-bus assignments, send routing, pre/post-fader position, and any bus or track effect-chain version for one project revision.
        when: Media prepares the multitrack routing candidate.
        then: Return a local, reviewable routing graph that preserves the declared assignments, routing, gain/pan/automation, effect-chain identities, and source versions and exposes unresolved compatibility; leave the project and audio unchanged pending explicit confirmation.
        rejection: Reject inferred routing or effect values, cycles or unsupported graphs, silent track/bus substitution, source mutation, project commit, rendering, export, or qualified loudness/true-peak claims.
      - id: MEDIA-P0-COHORT01-AUD-DELIV-001-POS
        given: Versioned source references, rational-time selections, and any declared dependencies are supplied.
        when: The caller authors a render manifest.
        then: Return a manifest candidate preserving exact source references, selected time ranges, and explicitly declared dependencies.
      - id: MEDIA-P0-COHORT01-AUD-DELIV-001-NEG
        given: Versioned source references, rational-time selections, and any declared dependencies are supplied.
        when: Admission evaluates the same request with an unsupported, denied, stale, or unknown required condition.
        then: A manifest is not an executed graph or rendered result; unresolved dependencies block completion claims and no render is inferred.
      - id: MEDIA-P0-COHORT01-AUD-DELIV-002-POS
        given: A valid manifest and explicit PREVIEW or FINAL request intent are supplied.
        when: The caller authors the render manifest.
        then: Return the manifest and preserve request intent without asserting a produced preview/final output.
      - id: MEDIA-P0-COHORT01-AUD-DELIV-002-NEG
        given: A valid manifest and explicit PREVIEW or FINAL request intent are supplied.
        when: Admission evaluates the same request with an unsupported, denied, stale, or unknown required condition.
        then: If render execution is unavailable or unbound, report not-produced/UNKNOWN; a request label is not an output artifact.
      - id: MEDIA-P0-COHORT01-AUD-COLOR-010-OVERLAY-POS
        given: A versioned project with selected source artifacts and a composition intent identifying the requested caption-overlay operation are supplied.
        when: The caller requests video/audio/caption/overlay composition.
        then: Return only a versioned composition and render manifest for the requested composition; do not assert color treatment, skin-tone preservation, or delivery completion.
      - id: MEDIA-P0-COHORT01-AUD-COLOR-010-OVERLAY-NEG
        given: The project, selected artifacts, composition intent, required authority, or supported composition profile is missing, stale, denied, or unsupported.
        when: Admission evaluates the same operation with an unsupported, denied, stale, or unknown required condition.
        then: Return UNKNOWN, UNAVAILABLE, or REJECTED as applicable; do not create a composition or imply color-quality or delivery outcomes.
      - id: MEDIA-P0-COHORT01-AUD-DELIV-013-COMPOSE-POS
        given: A versioned project with selected source artifacts and a composition intent identifying the requested caption-overlay operation are supplied.
        when: The caller requests video/audio/caption/overlay composition.
        then: Return only a versioned composition and render manifest for the requested composition; do not assert color treatment, skin-tone preservation, or delivery completion.
