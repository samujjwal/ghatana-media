ownerDefinedIdentifierRules:
  - id: media.requirement-identity.separation-from-execution-task-prefixes.v1
    sourceAuthority: Media product definition
    scope: stable-requirement-and-capability-identities
    rule: Product requirements use stable MEDIA-REQ-* identities and capability records use their canonical media.* identities. Historical execution/task labels such as GOV, MIG, P0, P1, P2, P3, HAND, IMP, and OPS identify program work only; they are not requirement, capability, operation, domain, or authorization identities and must not be converted into semantic identifiers. Preserve historical task references as provenance when useful, while resolving their product meaning only through the current owning PDP record.
    sourceRefs:
      - docs/migration/expert-reviewed-master-plan.md#section-18.3
      - .product-experience/pdp-0-product-truth/requirements.yaml#/productDefinitionContract/coreFieldMapping
    identityFormats:
      requirement: MEDIA-REQ-<stable-semantic-suffix>
      capability: media.<canonical-capability-id>
      prohibitedSemanticReuse:
        - GOV
        - MIG
        - P0
        - P1
        - P2
        - P3
        - HAND
        - IMP
        - OPS
    executionAdmission: NOT_ADMITTED
    independentAcceptance: P0-010-review-open
ownerDefinedInputInspectionRules:
  - id: media.requirement.source-inspection-is-purpose-bound-and-estimated.v1
    sourceAuthority: Media product definition
    scope: source-analysis-before-planning-or-execution
    rule: Source inspection may read only the exact artifact version authorized for the requested purpose. Declared metadata, deterministic format probes, and inferential observations remain distinguishable; inferred frame rate, dimensions/color, language, speech segments, defects, or compatibility are labeled ESTIMATED with method, profile/version, uncertainty, and source-version provenance. Unknown or conflicting inspection results remain UNKNOWN and cannot be converted into rights, consent, authorization, capability qualification, or permission to execute. Inspection itself must not dispatch processing or publish derived output.
    sourceRefs:
      - .product-experience/pdp-0-product-truth/capabilities.yaml#capabilities
      - .product-experience/pdp-0-product-truth/policy-authority-model.yaml#productPolicy
    requiredFacts:
      - exactArtifactVersion
      - capabilityIntentId
      - purpose
      - p0InputMeaning
      - inspectionMethodAndVersion
      - observedOrEstimated
      - uncertainty
      - sourceProvenance
    unknownDisposition: DENY_DOWNSTREAM_ASSUMPTION; preserve UNKNOWN and require explicit resolution
    downstreamHandoff: PDP-1 binds the stable capability intent to a concrete inspection operation and wire contract; operation identity is not a PDP-0 prerequisite.
    executionAdmission: NOT_ADMITTED
    independentAcceptance: P0-010-review-open
ownerDefinedSimulationScopeRules:
  - id: media.requirement.simulation-family-and-domain-owner-boundary.v1
    sourceAuthority: Media product definition with qualified external domain owners
    rule: Simulation capability families are distinct by modeled domain and output semantics. A rigid-body solver is not a fluid solver; a volume representation is not a simulation implementation; no engine is presumed to implement all listed regimes. Media owns the capability intent, semantic input/output shapes, and media representation, while domain equations, educational/scientific claims, clinical meaning, empirical calibration, validity ranges, and domain-specific acceptance remain with the qualified domain owner. Visual plausibility is not scientific or physical correctness. Each simulation capability intent/profile declares its exact modeled family, semantic inputs and outputs, units, bounds, applicable domain owner, and required validation meaning. A concrete solver identity/version and qualification evidence are downstream implementation bindings; a missing or unqualified family stays unavailable rather than being silently substituted.
    requiredFacts:
      - capabilityIntentId
      - exactSimulationFamily
      - semanticInputsAndOutputs
      - unitsAndBounds
      - qualifiedDomainOwner
      - validationMeaning
    downstreamHandoff: PDP-1 binds the P0 simulation family and semantic shapes to exact solver operations and typed wire contracts; PDP-0 does not require those operation bindings.
    unknownDisposition: BLOCK_OR_REVIEW; no cross-family substitution and no scientific claim
    executionAdmission: NOT_ADMITTED
    independentAcceptance: P0-010-and-domain-owner-review-open
ownerDefinedLeafTrustReconstructionPolicy:
  id: media.requirement.leaf-trust-reconstruction-policy.v1
  sourceAuthority: Media product definition
  appliesTo: Every exact capability leaf in the current capability register, joined by stable capability intent ID to its P0 semantic input/output shapes and owner-adjudicated disposition.
  rule: "Each capability declares an explicit trust/reconstruction disposition against its P0 semantic inputs and outputs. A source-derived transformation or generated/reconstructed output is bound to the exact source/request version and declared semantic output branch; the source is never overwritten. A derivative may change meaning or fidelity and is not a claim of lossless preservation. Record the transformation or generation method and effective profile/version, provenance, evidence, uncertainty, and material limits; never present generated detail as recovered fact. An estimator, classifier, measurement, quality assessor, or other inference returns an observation with method/model and version, source/version, applicable scope, evidence, uncertainty, and limitations, and must not label an estimate as ground truth. A state/reference-only or non-transforming operation explicitly records that it neither reconstructs content nor establishes inferred facts; it cannot claim a content effect or evidence it did not produce. Owner-state observations, caller plans, policy decision references, versioned definitions, and recorded project changes have distinct epistemic roles: a plan is not an observation or applied effect, a policy reference is not a grant, and readiness is not admission. A returned state is current only when its exact owner, operation, tenant/version scope, and observation-time authority are valid. If the exact output semantics do not establish which branch applies, preserve UNKNOWN and block the affected claim rather than infer from a capability name. This policy does not grant rights, consent, execution, provider admission, scientific validity, or independent acceptance."
  requiredLeafBindings:
    - exact stable capability intent identity
    - exact owner capability adjudication identity
    - P0 semantic input and output shapes
    - explicit owner-selected disposition and material rationale
  downstreamHandoff: PDP-1 supplies concrete operation contracts and wire schemas, each back-bound to the stable P0 capability intent; those bindings do not gate P0 definition completeness.
  dispositions:
    - SOURCE_DERIVED_TRANSFORMATION
    - ESTIMATED_OR_RECONSTRUCTED
    - ESTIMATED_OR_INFERRED_OBSERVATION
    - NO_RECONSTRUCTION_OR_INFERENCE
    - UNRESOLVED_EXACT_OUTPUT_SEMANTICS
  unknownDisposition: Preserve UNKNOWN; do not infer a branch from the leaf name or family.
  runtimeAdmission: NOT_ADMITTED
  qualification: NOT_EVALUATED
  acceptanceEffect: none
ownerDefinedExternalWorkerBoundaryRules:
  - id: media.requirement.document-intelligence-worker-boundary.v1
    sourceAuthority: Media product definition, with target-service ownership retained
    scope: historical-worker-preservation-and-platform-owner-handoff
    sourceRefs:
      - docs/migration/expert-reviewed-master-plan.md#REV-06
      - .product-experience/pdp-0-product-truth/policy-authority-model.yaml#externalOwnerTransfers
    observedInventory:
      worker: ghatana/services/media/modules/intelligence/document-intelligence-worker
      targetOwner: ghatana/services/document-intelligence
      consumers: Office/PDF/OCR paths and their identified consumers
      contractBoundary: frozen Shared document-extraction contracts
    rule: Preserve the distinct document-intelligence worker and its Office/PDF/OCR consumer inventory as an explicit owner-boundary record while media work is reorganized; do not orphan or silently absorb those consumers into audio/video processing. The document-intelligence target service owns its cancellation and admission behavior. A proposed move or a source path is not proof that rehome, consumer parity, frozen-contract compatibility, cancellation parity, or admission has completed. Keep the exact consumer-to-target mapping and those parity checks unresolved until source-grounded evidence is recorded; Media may consume only the frozen Shared document-extraction contract at its defined boundary. OCR and document extraction expose source-bounded observations only; they do not decide clinical eligibility, clinical disposition, KYC identity, or financial eligibility. Those decisions and their authority remain with the owning clinical, identity, or financial domain. A recognized term, extracted field, or confidence score cannot be promoted to a decision.
    requiredFacts:
      - exact worker identity
      - exact target owner identity
      - Office/PDF/OCR consumer inventory and mapping
      - frozen Shared document-extraction contract identity
      - target-owned cancellation and admission semantics
      - separate evidence for rehome and consumer parity
      - no clinical, KYC, identity, or financial decision inference from extracted observations
    unknownDisposition: Keep consumer mapping and rehome parity unresolved; do not claim completed transfer.
    implementationState: UNKNOWN
    runtimeAdmission: NOT_ADMITTED
    acceptanceEffect: none
ownerDefinedCrossProductBoundaryRules:
  - id: media.requirement.marketing-authority-boundary.v1
    owner: Media product semantics; campaign and brand decisions remain with Digital Marketing
    inputs:
      - approved-creative-brief-ref
      - approved-brand-claim-ref
      - campaign-scope-ref
      - delivery-intent
    rule: Media may compose or transform assets only from the exact approved brief, brand/claim references, and campaign scope supplied by the owning Marketing authority. Media does not author or approve campaign, offer, brand, claim, or publication decisions. Missing, expired, conflicting, or unresolvable owner approval leaves the dependent operation blocked or UNKNOWN; a rendered asset or user-provided claim text is not Marketing approval.
    negativeCases:
      - A caller-supplied brand claim without a current owner-approved reference is not authorized.
      - Media output cannot be treated as campaign publication approval.
      - An unrelated Marketing approval cannot be substituted for the exact campaign scope.
    scopeStatus: DEFINITION_ONLY; owner decision evidence and runtime verification remain separate
  - id: media.requirement.yappc-published-app-authoring-boundary.v1
    owner: Media product semantics; YAPPC owns app-authoring product experience and implementation
    rule: Media may integrate with YAPPC only through an exact published app-authoring capability whose public request, result, authority, version, and compatibility contract is identified and tested. Media does not embed YAPPC product internals as its editor framework or treat source-code presence as a published capability. If no applicable published contract exists, the integration remains an explicit dependency gap; Media-owned editing remains defined independently.
    negativeCases:
      - A private YAPPC module or source path is not a public integration contract.
      - Similar editor behavior or matching names do not establish API compatibility.
      - An absent published capability remains a dependency gap, not implicit support.
    scopeStatus: DEFINITION_ONLY; publication, consumer compatibility, and runtime remain unverified
ownerNormativeRuleRecords:
  - id: media.requirement.marketing-authority-boundary.v1
    ruleRef: .product-experience/pdp-0-product-truth/requirements.yaml#ownerDefinedCrossProductBoundaryRules/@id=media.requirement.marketing-authority-boundary.v1
    sourceRole: stable selector index; normative rule body remains in ownerDefinedCrossProductBoundaryRules
  - id: media.requirement.yappc-published-app-authoring-boundary.v1
    ruleRef: .product-experience/pdp-0-product-truth/requirements.yaml#ownerDefinedCrossProductBoundaryRules/@id=media.requirement.yappc-published-app-authoring-boundary.v1
    sourceRole: stable selector index; normative rule body remains in ownerDefinedCrossProductBoundaryRules
ownerDefinedDeploymentAvailabilityRules:
  - id: media.requirement.policy-and-admitted-deployment-availability.v1
    sourceAuthority: Media product definition
    scope: per-capability-operation-and-deployment-profile
    rule: A capability is available for a request only when its exact operation, requested profile, current policy decision, and admitted deployment jointly permit the required processing locality and dependencies. A local-only request cannot fall back to a remote or cloud execution path. Capability registration, provider readiness, package presence, or a deployment label alone does not admit execution. Missing or unknown policy, locality, dependency, or deployment evidence yields unavailable or review-required; do not silently select another location or provider.
    requiredInputs:
      - exact capability and canonical operation identity/version
      - requested profile identity/version and processing-locality requirement
      - current policy and authority decision for tenant, purpose, rights, and egress
      - admitted deployment identity and capability-scoped dependency readiness
    unknownDisposition: BLOCKED_OR_REVIEW_REQUIRED; no implicit remote/cloud fallback.
    implementationState: UNKNOWN
    runtimeAdmission: NOT_ADMITTED
    qualification: NOT_EVALUATED
    acceptanceEffect: none
ownerDefinedImportAdapterConversionRule:
  id: media.requirement.import-adapter-conversion-evidence.v1
  sourceAuthority: Media product definition; external wire and artifact owners retain their own formats
  rule: An import adapter may claim a tested conversion only for an exact source format/schema and version to an exact Media target schema/profile version. Declare the source and target fields, identity and version bindings, units, clock/coordinate/color conventions, defaults, precision, and every lossy, unsupported, or inferred field. Exercise positive and adversarial fixtures against the actual conversion, including exact round-trip properties where the conversion is reversible. Lossy conversion must report its loss and cannot be described as round-trip preserving; unsupported or unknown source meaning is rejected or preserved as UNKNOWN rather than guessed. A declared conversion rule or fixture inventory does not prove a production adapter, complete format coverage, or runtime admission.
  requiredEvidence:
    - exact source schema/format and immutable version
    - exact target Media schema/profile and version
    - field-level mapping for identity, units, clocks, coordinates, color, and defaults as applicable
    - positive, boundary, malformed, unknown-field, and loss fixtures
    - measured round-trip oracle for every claimed reversible mapping
    - explicit unsupported/loss disposition for non-reversible fields
  negativeCases:
    - accept a conversion based only on matching field names or nominal formats
    - silently infer absent units, clocks, coordinate origins, color spaces, or versions
    - claim round-trip preservation after a lossy conversion
    - treat test fixtures as proof that a production adapter is deployed or admitted
  scopeStatus: OWNER_DEFINED_CONVERSION_TEST_REQUIREMENT; adapter execution, complete format coverage, and runtime admission remain unestablished
