        given: Exact subject/persona version, current scoped consent, authorized decision source and lifecycle contract are present.
        when: "Enrollment decision is made. Parent relation: MEDIA-REQ-CAP-RIGHTS includes capability media.speech.synthesis.speaker.enroll-persona-authorized."
