      - id: MEDIA-REQ-CAP-PROVENANCE-AC-03
        given: A factual narration claim has one or more associated source citations.
        when: the product presents the claim and its provenance.
        then: associate each citation with the claim it supports and preserve unsupported or unresolved links as unknown.
        rejection: reject a generic artifact link as proof that it supports every claim or filling an unknown claim-source relation with an invented citation.
      - id: MEDIA-REQ-CAP-PROVENANCE-AC-04
        given: An authorized synthesis request declares a supported watermark mode and an exact output version.
        when: The product reports watermark status for the output.
        then: Disclose whether the watermark or machine-readable content credential was requested, supported, applied, absent, or unknown and bind any application claim to the exact output version and mechanism/version evidence; watermark or credential status does not establish authorship, rights, or authenticity.
        rejection: Reject claiming an embedded watermark or content credential from a configured request alone or treating presence, absence, or observed robustness as proof of authorship, rights, or authenticity.
      - id: MEDIA-REQ-CAP-PROVENANCE-AC-05
        given: An authorized synthesis request pins a remote worker version, model or checkpoint version, profile, and exact input asset versions.
        when: The product reports its execution lineage.
        then: Bind requested and observed worker, model, profile, and input/output versions separately; report any mismatch or unobserved identity as UNKNOWN and preserve the source and output relationship.
        rejection: Reject claiming the pinned execution succeeded when an identity is absent or differs, silently substituting another worker or model, or treating this record as remote security certification.
      - id: MEDIA-REQ-CAP-PROVENANCE-AC-06
        given: An authorized annotation or QA claim concerns an exact business activity and names its authoritative owning system.
        when: Media presents or evaluates the claim.
        then: Bind an asserted business state only to current owner-provided readback with exact owner reference, revision, and observation time; report Media quality measurements and execution lineage separately.
        rejection: Reject using playback, generated content, a media score, job acknowledgment, or generic execution logs as proof of business state; missing or stale owner readback remains UNKNOWN.
      - id: MEDIA-REQ-P0-C03-AUD-TRUST-005
        given: Exact subject/artifact/version, purpose, authority, retention/hold scope and any owner-issued request/effect/readback evidence.
        when: Request or inspect revocation, retention, hold or erasure.
        then: Expose requested/authorized/observed/readback results separately only when exact authority evidence exists; else pending/UNKNOWN. Access restriction is not erasure; request is not effect; internal record is not external deletion; no legal outcome inferred. PDP-0 user-visible distinction; lifecycle states PDP-1; legal/effect evidence actual authority.
      - id: MEDIA-REQ-P0-C03-AUD-TRUST-010
        given: Exact model/checkpoint/license, cache artifact/version/digest, signer/key/trust evidence and execution lineage.
        when: Request secure provenance or signed-cache verification.
        then: Return distinct hash-integrity, signature/trust, license and lineage observations, each with exact evidence or UNKNOWN. Hash is not signature/license proof; path/name/export manifest is not verification. PDP-0 assurance outcomes; lineage identities PDP-1; security proof separately evidenced.
      - id: MEDIA-REQ-P0-C03-AUD-TRUST-018
