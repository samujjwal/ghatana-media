    acceptanceCases:
      - id: MEDIA-REQ-CAP-QUALITY-AC-01
        given: A declared leaf, authorized input, and a binding that satisfies the requested profile and policy.
        when: The caller requests the operation.
        then: The typed result, effective parameters, provenance, terminal/finality state, and measured dimensions are returned; only the declared effect occurs.
      - id: MEDIA-REQ-CAP-QUALITY-AC-02
        given: The requested language, format, right, profile, license, capability, or qualification is absent or unknown.
        when: Admission is evaluated.
        then: The operation is blocked or returns an explicit qualified fallback only when policy permits; unknown is never reported as available.
      - id: MEDIA-REQ-CAP-QUALITY-AC-03
        given: A submitted asset is within the declared quality-inspection scope and has a suspicious-input disposition.
        when: the asset is evaluated for use in a project.
        then: keep it unavailable to downstream use while its disposition is pending review; report the unresolved disposition without treating inspection as clearance.
        rejection: reject making a pending or suspicious asset available based only on a read-only quality score.
      - id: MEDIA-REQ-CAP-QUALITY-AC-04
        given: An editor compares eligible voice candidates for one declared speech task.
        when: the editor requests a comparison across quality, cost, and latency.
        then: return each dimension when available and preserve unavailable or unknown dimensions as such; do not imply one dimension proves another.
        rejection: reject silently substituting a missing metric or ranking unknown values as measured results.
      - id: MEDIA-REQ-CAP-QUALITY-AC-05
        given: A reviewer requests a similarity observation for a declared source and candidate output.
        when: the system performs a bounded similarity review.
        then: label the result as an observation for the declared comparison only, with its scope and unknowns.
        rejection: reject presenting similarity as copyright clearance, legal judgment, or permission to use.
      - id: MEDIA-REQ-CAP-QUALITY-AC-06
        given: A reviewer evaluates speech that may contain a synthetic watermark and declares any transformation under which its detectability or robustness is observed.
        when: the system checks for the declared watermark signal under that declared transformation.
        then: report detection, non-detection, or inconclusive robustness observation only within the declared check and transformation scope; preserve an inconclusive result as unknown.
        rejection: reject treating watermark presence, absence, or observed robustness as proof of authorship, rights, or authenticity; no watermark stripping or removal capability is implied.
      - id: MEDIA-REQ-CAP-QUALITY-AC-07
        given: A creator requests a preflight estimate for a declared production configuration.
        when: the product forecasts expected render time or cost from the declared inputs.
        then: present each result as an estimate with its assumptions, scope, and unknowns; keep it distinct from measured usage, quality assessment, or admission.
        rejection: reject presenting an estimate as measured cost, a quality result, or authorization to run.
      - id: MEDIA-REQ-CAP-QUALITY-AC-08
        given: A reviewer compares performance observations supplied or admitted by the user with exact source attribution, variant identity, and observation time.
        when: the reviewer requests a variant comparison and possible feedback action.
        then: compare only the attributed observations and prepare a feedback proposal for explicit user approval without inferring causal effect.
        rejection: reject implying access to external platform APIs or data, silently importing observations, or claiming a variant caused an outcome.
      - id: MEDIA-REQ-CAP-QUALITY-AC-09
        given: A creator declares quality priorities, a hard resource budget, and the low/high or other pipeline choices for a source version.
        when: The creator requests a budget-aware quality tradeoff and selects a proposed choice.
        then: Present every declared choice with its quality dimensions, resource estimates, assumptions, and feasible, infeasible, denied, unavailable, or unknown status; preserve the user's explicit selection in a version-bound candidate plan. If the selected choice violates the budget or required quality constraints, mark that selection infeasible and request a new explicit selection even when another choice is feasible. Never auto-switch choices, execute the plan, exceed the budget, silently downgrade quality, or substitute another pipeline.
        rejection: Reject representing estimates as measured quality or resource use, changing the selected tradeoff without an explicit request, or presenting a candidate plan as authorization, qualification, or completed processing.
      - id: MEDIA-REQ-CAP-QUALITY-AC-10
        given: An authorized editor requests highlight candidates from an exact source version and declares the selection objective, eligible source-time interval, and any ranking dimensions and weights.
        when: The product evaluates source-grounded evidence and ranks candidate spans.
        then: Return each highlight as an exact source-time candidate with evidence, uncertainty, and the declared objective and ranking inputs; abstain or report unknown when evidence is insufficient and do not assign a default memorable or engagement score.
        rejection: Reject claiming a highlight is objectively memorable, ranking with an undeclared objective or hidden weights, or omitting the exact source version and time span.
      - id: MEDIA-REQ-CAP-QUALITY-AC-11
        given: An authorized creator requests variants for declared audiences and channels from an exact source candidate and supplies the comparison objective and any ranking dimensions and weights.
        when: The product prepares or compares the audience- and channel-specific variants.
        then: Bind each variant to the exact source candidate, audience, channel, and applicable profile; expose declared ranking inputs and uncertainty, and return no ranking when the objective or required evidence is absent.
        rejection: Reject silently changing the source candidate or target audience/channel, inferring a universal preference score, or presenting a ranking produced by undeclared criteria.
      - id: MEDIA-REQ-CAP-QUALITY-AC-12
        given: An authorized editor declares a project revision, B-roll purpose, exact eligible source versions, and selection objective.
        when: Media recommends B-roll candidates for the project.
        then: Return reviewable candidates with exact source version and source-time span, supporting evidence, uncertainty, and rights decision reference; do not attach a candidate to the project.
        rejection: Reject treating a recommendation as source acceptance or project mutation; missing or unknown rights or source-time evidence makes the candidate ineligible or unresolved.
      - id: MEDIA-REQ-CAP-QUALITY-AC-13
        given: An authorized reviewer evaluates a QA claim that includes a product or business-state assertion.
        when: Media reports the QA result.
        then: Separate media-quality observations from authoritative owner-system readback and bind any state assertion to the exact owner reference, revision, and observation time.
        rejection: Reject substituting a media score, decoded output, execution log, or job acknowledgment for owner readback; absent or stale readback remains UNKNOWN and blocks the business-state claim.
      - id: MEDIA-REQ-CAP-QUALITY-AC-14
        given: An authorized reviewer submits exact versioned audio source and candidate references for an admitted, bounded content-similarity observation with a declared method and comparison scope.
        when: Media performs the requested audio fingerprint or similarity observation.
        then: Return the observation status, method/version, comparison scope, exact input identities, provenance, uncertainty, and any candidate match as non-authoritative review data; retain a separate rights-policy decision for every proposed use and exact checkpoint/license admission for generated music, including commercial-use incompatibility.
        rejection: Reject inferring ownership, infringement, license, permission, legal clearance, or definitive identity from similarity; missing or unknown inputs, method, transformation scope, or authority cannot become a positive finding.
      - id: MEDIA-P0-COHORT01-AUD-COLLAB-003-COMPARE-POS
        given: One or more admitted candidate artifacts or an execution observation and a quality question with bounds are supplied.
        when: The caller requests candidate quality comparison.
        then: Return only a source-versioned quality observation or bounded repair plan; do not change project review state, create annotations, or assert quality signoff.
      - id: MEDIA-P0-COHORT01-AUD-COLLAB-003-COMPARE-NEG
        given: A required artifact, quality question, bound, method, or authority is missing, stale, denied, or unsupported.
