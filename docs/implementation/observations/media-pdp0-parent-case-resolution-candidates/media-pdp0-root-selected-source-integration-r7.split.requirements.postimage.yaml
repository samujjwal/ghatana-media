        given: An authorized creator declares a recording-take intent such as ADR or room tone, identifies its session, source context, and intended placement, and starts a governed capture session.
        when: The product observes the recording session or its terminal capture state.
        then: Return a typed take-intent and capture-observation record with session, timing, and provenance, distinguishing captured, unavailable, interrupted, and finality-unknown outcomes; this observation alone does not commit a media artifact or project edit.
        rejection: Reject describing an intent or partial observation as a completed take, silently attaching or registering captured media, or conflating captured ADR with generated narration or generated room tone.
      - id: MEDIA-REQ-CAP-STREAM-AC-05
        given: An authorized capture request includes a verified, source-time-bound click or typed-action observation and an eligible framing intent.
        when: The product proposes an action-linked zoom or focus change.
        then: Return a local framing candidate tied to the exact action evidence, source version, time interval, and uncertainty; the proposal does not change or render the source.
        rejection: Reject describing inferred focus as verified, proposing action-linked framing without action evidence, or applying the proposal without separate confirmation.
      - id: MEDIA-REQ-CAP-STREAM-AC-06
        given: An authorized capture request declares privacy masking for keyboard or pointer overlays and the applicable policy marks an event sensitive or its classification unknown.
        when: The product captures or prepares the corresponding event observation.
        then: Omit or mask sensitive payload and retain only policy-permitted event and timing data; when the masking policy or detector state is unknown, block raw overlay capture or mask the full affected interval.
        rejection: Reject retaining or displaying unmasked sensitive input by default, inferring that an event is non-sensitive from missing classification, or treating policy absence as consent.
      - id: MEDIA-REQ-CAP-STREAM-AC-07
        given: An authorized actor requests a consequential product action and identifies the authoritative system and readback channel for its claimed effect.
        when: Media observes an action acknowledgment and evaluates the effect readback.
        then: Report acknowledgment separately from authoritative readback, binding readback to its exact source, version, observation time, and state; absent, conflicting, stale, or unknown readback remains UNKNOWN or UNAVAILABLE.
        rejection: Reject reporting the product effect as successful from a click, command, local acknowledgment, or Media execution record alone.
      - id: MEDIA-REQ-P0-R7-AUD-CAP-028-01
        given: Exact owner binding, effect identity, current revision, typed evidence, observation time and finality are available.
        when: "Caller requests product-effect observation. Parent relation: MEDIA-REQ-CAP-STREAM includes capability media.stream.session.product-effect.readback.observe."
        then: Return source-bound observation with all exact fields.
        polarity: POSITIVE
        sourceCapabilityId: media.stream.session.product-effect.readback.observe
        sourceAuditId: AUD-CAP-028
        sourceCapabilityCaseId: R7-AUD-CAP-028-01
      - id: MEDIA-REQ-P0-R7-AUD-CAP-028-02
        given: Owner binding or evidence is missing, unavailable or unverified.
        when: "Caller requests observation or resume. Parent relation: MEDIA-REQ-CAP-STREAM includes capability media.stream.session.product-effect.readback.observe."
        then: Return UNKNOWN/UNAVAILABLE; grant no resume or replay.
        polarity: NEGATIVE
        sourceCapabilityId: media.stream.session.product-effect.readback.observe
        sourceAuditId: AUD-CAP-028
        sourceCapabilityCaseId: R7-AUD-CAP-028-02
      - id: MEDIA-REQ-P0-R7-AUD-CAP-028-03
        given: External effect outcome is ambiguous or final.
        when: "Caller retries the effect instead of reading it. Parent relation: MEDIA-REQ-CAP-STREAM includes capability media.stream.session.product-effect.readback.observe."
        then: Do not replay; require reconciliation.
        polarity: NEGATIVE
