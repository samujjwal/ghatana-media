    statement: Every operation in media.compose retains the intended semantic outcome in the full product definition and is invocable only through an explicit, authorized, compatible binding whose current implementation, license admission, qualification, and runtime availability are separately established.
    rationale: Master-plan §6 requires finite full-scope capability preservation and explicitly separates definition from implementation and admission; a catalog entry is not evidence of support.
    source:
      masterPlanSection: §6.8
      sourcePhrase: Multitrack timelines; scene/storyboard assembly; video/audio/caption/overlay tracks; transitions; titles/credits/lower thirds; exact typography/logos/brand assets; safe areas; reusable compositions and render manifests
    capabilityIds:
