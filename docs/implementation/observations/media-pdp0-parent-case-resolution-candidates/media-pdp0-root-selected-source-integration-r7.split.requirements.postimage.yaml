        then: Return ordered chunks tied to input-text boundaries; output-time/alignment/crossfade disposition stated separately; partial/unaligned remains explicit. Text span is not media-time span; no hidden truncation/loss; no alignment claim without timing evidence. PDP-0 output intent; text/timeline identities PDP-1; synthesis/render BUILD.
