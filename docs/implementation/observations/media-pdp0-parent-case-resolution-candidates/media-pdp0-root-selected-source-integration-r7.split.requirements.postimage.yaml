        given: A creator prepares script or narration content using declared source facts.
        when: the recipe produces factual narration and connective language.
        then: distinguish source-supported factual claims from authored connective language and retain the source basis for supported claims.
        rejection: reject fabricated factual claims or presenting unsupported connective language as source fact.
      - id: MEDIA-REQ-CAP-RECIPE-TEMPLATE-AC-06
        given: An authorized production supplies facts for audience-specific content personalization.
        when: the recipe personalizes the content.
        then: transform only the supplied facts that are authorized for the declared purpose and preserve their source attribution.
        rejection: reject inventing a person identity, personal attribute, or factual claim not present in the admitted inputs.
