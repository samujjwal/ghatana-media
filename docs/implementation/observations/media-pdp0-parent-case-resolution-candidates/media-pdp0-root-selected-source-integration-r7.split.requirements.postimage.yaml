        given: The requested language, format, right, profile, license, capability, or qualification is absent or unknown.
        when: Admission is evaluated.
        then: The operation is blocked or returns an explicit qualified fallback only when policy permits; unknown is never reported as available.
      - id: MEDIA-REQ-CAP-SPEECH-TRANSCRIPTION-AC-03
        given: A user explicitly initiates dictation and selects a target that is authorized by the operating system.
        when: the product inserts the resulting dictated text into that selected target.
        then: limit capture and insertion to the user-initiated session and selected OS-authorized target; report unavailable when permission or the required adapter is missing.
        rejection: reject background or global capture/insertion, choosing an unselected target, or bypassing denied or unavailable permission.
      - id: MEDIA-REQ-CAP-SPEECH-TRANSCRIPTION-AC-04
        given: An authorized source version and an admitted, versioned custom glossary are supplied for transcription.
        when: Glossary-guided recognition or correction is requested.
        then: Return any produced transcript as an unverified, source-version/timebase-linked draft and identify the glossary version used; keep this operation distinct from punctuation and capitalization.
        rejection: Reject silently applying an ambiguous, unsupported, or unavailable glossary entry, or claiming that glossary guidance verifies transcript correctness.
      - id: MEDIA-REQ-CAP-SPEECH-TRANSCRIPTION-AC-05
        given: An authorized source version is admitted for speech transcription and filler/retake analysis.
        when: The actor requests ASR-assisted filler-word or retake detection.
        then: Return only uncertain candidate observations anchored to the exact source version and time range, distinct from silence observations.
        rejection: Reject classifying silence alone as a filler or retake, or automatically deleting, trimming, or cutting source content from a candidate observation.
      - id: MEDIA-REQ-CAP-SPEECH-TRANSCRIPTION-AC-06
        given: A user requests translation of a source speech or transcript version to a declared target locale and supplies any translation-memory or brand-glossary references and approved term entries available for that request.
        when: The translation operation is evaluated and, if admitted, prepares a translated draft.
        then: Apply only admitted, versioned, approved, unambiguous, applicable source/target term pairs or do-not-translate entries; preserve the memory and glossary versions and identify which protected terms were retained. Present translated content as a draft, not as approved or verified text. For an otherwise admitted translation request with a missing or unavailable memory or glossary, explicitly report that it was not applied; do not silently substitute another entry, glossary, or translation behavior. If a supplied memory or glossary is denied, stale, ambiguous, conflicting, or unknown, report that state; if source authorization or rights are denied or unknown, block the operation under the family admission behavior in MEDIA-REQ-CAP-SPEECH-TRANSCRIPTION-AC-02 with no fallback. For any dubbed result, preserve every supplied per-segment speaker, locale, source-timing, and translation-provenance field. If a field is not supplied or cannot be established, identify it as absent or unknown rather than silently omitting or fabricating it; mark a field not applicable only with an explicit reason. This case does not establish audio/video export synchronization, which remains a separate requirement.
        rejection: Reject changing a term marked do-not-translate, silently omitting an unresolved protected term, applying an unversioned, unapproved, or inapplicable entry, resolving conflicting entries by silent preference, or describing a translated draft as owner-approved or verified.
      - id: MEDIA-REQ-CAP-SPEECH-TRANSCRIPTION-AC-07
        given: An authorized microphone recording session and an admitted transcription request refer to the same exact captured source version.
        when: The product prepares a transcript draft or paired archive candidate.
        then: Link the transcript to the source version, capture session, and timebase while retaining the recording as an independently identifiable immutable artifact.
        rejection: Reject implying archive registration, changing either artifact without separate authorization, or claiming a resolved pair when source identity or alignment is unknown.
      - id: MEDIA-P0-COHORT01-AUD-ASR-003-POS
        given: An authorized audio artifact or declared live stream is supplied with its source clock and any provided language hint.
        when: The caller requests voice-activity detection.
        then: Return source-clock voice-active intervals with uncertainty and exact source-version provenance; do not classify silence or emit transcript words.
      - id: MEDIA-P0-COHORT01-AUD-ASR-003-NEG
        given: An authorized audio artifact or declared live stream is supplied with its source clock and any provided language hint.
        when: Admission evaluates the same request with an unsupported, denied, stale, or unknown required condition.
        then: Unknown source clock, unsupported channel, or missing rights yields UNKNOWN/UNAVAILABLE; do not infer silence segmentation, transcript, speaker identity, or model support.
      - id: MEDIA-P0-COHORT01-AUD-DELIV-013-GENERATE-POS
        given: An exact transcript or recognition-result version, source audio or video version, and requested output language and profile are supplied.
        when: The caller requests subtitle generation.
        then: Return a distinct subtitle draft version, segment timing/alignment disposition, and source/operation provenance; do not register the draft as approved or delivered output.
      - id: MEDIA-P0-COHORT01-AUD-DELIV-013-GENERATE-NEG
        given: A transcript, source version, language/profile, required authority, or supported generation condition is missing, stale, denied, or unsupported.
        when: Admission evaluates the same operation with an unsupported, denied, stale, or unknown required condition.
        then: Return UNKNOWN, UNAVAILABLE, or REJECTED as applicable; do not generate an approved subtitle, overlay composition, or delivery package.
      - id: MEDIA-REQ-P0-C03-AUD-QA-006
        given: Exact diarization result/audio version, authorized comparison reference, reference labels and declared DER method/denominator.
        when: Request diarization metric and voice similarity review.
        then: Return DER only with method/reference/denominator; return speaker similarity as separate scoped value/unit or abstention. Diarization alone is not DER; similarity is not identity or human review; absent labels/method UNKNOWN. PDP-0 observation intent; PDP-1 annotation/method identities; no measurement/signoff claim.
