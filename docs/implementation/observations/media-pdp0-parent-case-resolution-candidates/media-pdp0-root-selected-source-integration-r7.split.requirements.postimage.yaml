        when: "Enrollment is requested. Parent relation: MEDIA-REQ-CAP-RIGHTS includes capability media.speech.synthesis.speaker.enroll-persona-authorized."
        then: Reject.
        polarity: NEGATIVE
        sourceCapabilityId: media.speech.synthesis.speaker.enroll-persona-authorized
        sourceAuditId: AUD-CLONE-017
        sourceCapabilityCaseId: R7-AUD-CLONE-017-02
      - id: MEDIA-REQ-P0-R7-AUD-CLONE-017-03
        given: Consent is expired/revoked or authority unavailable.
        when: "Enrollment is requested. Parent relation: MEDIA-REQ-CAP-RIGHTS includes capability media.speech.synthesis.speaker.enroll-persona-authorized."
        then: Reject expired/revoked consent; unavailable authority remains UNKNOWN.
        polarity: NEGATIVE
        sourceCapabilityId: media.speech.synthesis.speaker.enroll-persona-authorized
        sourceAuditId: AUD-CLONE-017
        sourceCapabilityCaseId: R7-AUD-CLONE-017-03
      - id: MEDIA-REQ-P0-R7-AUD-CLONE-017-04
        given: Consent reference resolves without actual enrollment authority/outcome.
        when: "Caller treats resolution as enrollment. Parent relation: MEDIA-REQ-CAP-RIGHTS includes capability media.speech.synthesis.speaker.enroll-persona-authorized."
        then: Do not report enrollment; return UNKNOWN/UNAVAILABLE.
        polarity: NEGATIVE
        sourceCapabilityId: media.speech.synthesis.speaker.enroll-persona-authorized
        sourceAuditId: AUD-CLONE-017
        sourceCapabilityCaseId: R7-AUD-CLONE-017-04
