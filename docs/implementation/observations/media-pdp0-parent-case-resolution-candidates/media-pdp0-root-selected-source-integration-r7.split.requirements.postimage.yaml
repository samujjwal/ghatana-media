  traceState: The Media owner defines the exact 38 historical family requirement-to-capability mappings and 462 stable machine capabilityIntentIds with leaf-local outcome semantics in capabilities.yaml. The separately sourced AUD-SPEC-020 rules capability is a coordinator-authored proposal with applicability pending owner review. intentRefs and outcomeRefs remain secondary business-intent trace context and do not claim independently reviewed per-leaf business-intent fit. Exact-leaf channel applicability is owner-defined in capability-leaf-review.yaml for those 462 records; exact screen/action bindings remain pending P0-009, while requirement-level actor/state proposals remain pending their owning P0 tasks. P0-010 independent semantic acceptance remains pending; this source statement records development definition, not acceptance.
ownerDefinedProjectionAuthorityRules:
  - id: media.requirement.generated-projection-single-authority.v1
    authority: delegated-Media-product-definition-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
    sourceAuthority: Media source records remain the only editable Media-specific semantic authorities; a projection is downstream data and cannot become a competing ledger.
    generatorBinding: Every generated contract or view resolves its fields to exact stable source record identities and declared mappings. Missing, ambiguous, or stale source bindings fail generation; a generator must not fill unknown semantics from labels, filenames, or implementation observations.
    productDefinitionProjection: ProductDefinition capabilities and requirements are read-only projections of the exact Media capability and requirement records through the declared structural schema mapping. The generic schema cannot absorb Media-specific semantics or replace those records.
    phaseViews: Phase-local gap, coverage, and acceptance views are generated filtered views of root source obligations; they are not independently editable inventories or alternate acceptance authorities.
    requirementRetention: Implementation order only sequences execution. It never deletes, weakens, or reclassifies a requirement to match incomplete implementation. Definition completeness, implementation state, qualification, runtime availability, and acceptance remain distinct; an unimplemented or unqualified requirement stays visible with its unresolved status.
    constitutionProjection: The readable PRODUCT-CONSTITUTION.md is generated from or unambiguously references this one structured requirement register. It is a reader-facing projection, not a second editable authority.
    runtimeReuseProjection: A runtime reuse-decision projection may be generated only from the exact Media-owned reuse decision records after the required explicit admission decision. It is not a second editable decision register and a candidate, source import, or generated projection does not itself admit a dependency.
    generatedArtifactRule: Generated files are never the primary edit target. Regeneration must preserve exact source identities and must not promote definition, implementation, qualification, runtime, or acceptance status.
    negativeCases:
      - A phase coverage file is edited as an independent source of obligations.
      - A generator infers a semantic field from a capability label or implementation name when the source binding is absent.
      - A runtime reuse projection admits a candidate without the exact source decision and its admission state.
      - A generated ProductDefinition value is edited and treated as canonical Media meaning.
    status: DEFINITION_ONLY; generator binding, independent review, and generated projection acceptance remain separate.
ownerDefinedDeploymentPartitionRules:
  - id: media.requirement.resource-isolation-deployment-partition.v1
    authority: delegated-Media-product-definition-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
    partitionBasis: Choose process and service boundaries from concrete resource isolation, privilege, failure containment, data locality, deployment constraints, and operational ownership requirements. Related capability operations may share a process when their authority, resource profile, and lifecycle boundaries fit.
    granularity: Do not create one microservice per capability merely because capability records are separately named. A capability boundary is semantic and does not by itself require a process, service, container, or deployment unit.
    isolationControls: Each selected execution boundary declares its resource ceilings and isolates untrusted decoders, plugins, native engines, and model or script execution according to the current threat policy.
    nonClaims:
      - no-runtime-deployment
      - no-engine-admission
      - no-license-exemption
      - no-performance-qualification
    status: DEFINITION_ONLY; deployment implementation and qualification remain unestablished.
ownerDefinedCapabilityNamingRules:
  - id: media.requirement.capability-identities-name-media-semantics.v1
    authority: delegated-Media-product-definition-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
    semanticIdentity: A Media capability ID and label describe a stable product operation or outcome. They do not name, identify, or imply a vendor, provider, model, engine, package, or deployment.
    separation: Provider/model/engine identity and version belong in explicit implementation, dependency, profile, and provenance bindings. A vendor change does not change Media semantic identity; a semantic change requires a new or versioned Media owner contract and cannot be smuggled in by renaming a provider.
    aliasing: An alias is an explicit reference to one canonical Media semantic definition. It does not create an independent capability, implementation, qualification, lifecycle, or runtime admission.
    status: DEFINITION_ONLY; no provider, model, or engine is thereby admitted or qualified.
ownerDefinedRecipeTemplateBindingRules:
  - id: media.requirement.recipe-template-versioned-schema-binding.v1
    authority: delegated-Media-product-definition-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
    representation: A reusable template is a versioned MediaRecipe identity plus exact versioned content and schema bindings. The bound content and parameter schemas are explicit inputs to that recipe version, not hidden application code or mutable defaults.
    executionBoundary: A template describes reusable intent and structure. It is not a separately hard-coded application, provider implementation, dispatch authority, or proof that the recipe can execute.
    changeSemantics: Changing the recipe, content binding, parameter schema, or compatibility rules creates a separately identified version and retains the prior binding for lineage and review.
    invalidation: Missing, stale, incompatible, or unauthorized content/schema bindings make the template instance invalid or unresolved; never silently substitute content or schema.
    status: DEFINITION_ONLY; recipe execution, content admission, and compatibility qualification remain separate.
ownerDefinedCrossMediaMechanicsRules:
  - id: media.requirement.shared-cross-media-mechanics.v1
    authority: delegated-Media-product-definition-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
    sharedConcerns: Rendering, synchronization, quality assessment, and provenance are cross-cutting Media concerns for generated, captured, edited, animated, and simulated media.
    typedBoundary: Shared mechanics preserve the exact modality, source/output version, clock or media signal, operation, profile, and evidence context. Image, video, audio, animation, and simulation semantics remain separately typed; common mechanics do not make their units, timing, quality metrics, or provenance interchangeable.
    compositionality: A workflow may combine these mechanics only through explicit versioned operation and artifact bindings with declared ordering, conversion, and loss. It cannot infer a common effect or qualification from shared labels.
    status: DEFINITION_ONLY; no cross-modal runtime parity or quality qualification is implied.
ownerDefinedOperationRequestBoundsRules:
  - id: media.requirement.operation-request-bounds.v1
    authority: delegated-Media-product-definition-owner-under-EXECUTE-MEDIA-PDP-0-3-38-TASKS
    application: Each requirement is a family-level obligation. Its capabilityIds identify the exact leaves whose individual operation/request contracts in capabilities.yaml refine the obligation; a family statement, label, shared operation name, or generated PDP-1 operation does not replace an exact leaf contract. Each invocation is bound to one exact leaf and the requested profile/version, inputs, parameters, intended effect, and policy context before admission.
    requestContract: The exact leaf ownerDefinition is authoritative for typed input slots and parameter schema, including required/optional fields, accepted value meaning, outputs/effects, and explicit unsupported combinations. Any required default, omission behavior, or profile-specific eligibility must be stated in the Media owner definition and its source; absent defaults are not inferred from implementation, package, provider, UI, or PDP-1 behavior. Concrete PDP-1 operation and wire-schema contracts are downstream handoff and must bind back to the exact capability leaf.
    boundsAndUnits: A bound is stated only when an applicable product policy or source establishes it. Each applicable resource dimension requires a finite bound, explicit unit, accountable authority, source, and pre-dispatch/ongoing enforcement boundary under profile-semantics.yaml#boundedInvocationAdmission. Use that rule's dimension-specific units; other domain quantities use the unit and time/coordinate/color convention declared by the exact leaf contract. No absent product limit is filled with a guessed numeric ceiling or an unlimited interpretation.
    unknownDisposition: UNKNOWN applicability, or a missing/NOT_EVALUATED bound, unit, authority, source, enforcement boundary, required input meaning, or requested-profile binding means NOT_ADMITTED and blocks invocation before dispatch with an explicit blocked/denied outcome. NOT_EVALUATED preserves an unresolved fact; it is not zero, unlimited, inapplicable, qualified, or available. Inapplicability requires a reason and evidence. Measured limits and qualification remain NOT_EVALUATED until supported by evidence; a product-level bounded-admission strategy is definable without asserting a numeric limit.
    nonDefaultPolicy: No operation, provider, model, format, language, profile, parameter, resource budget, or fallback is a default merely because it is named, present in code, or accepted by an adapter. A default or fallback is permitted only when explicitly defined by the applicable Media owner policy, visible in effective parameters, and independently checked for requested-profile eligibility, rights, bounds, and qualification. Otherwise omission or unsupported values are rejected or resolved as explicitly unknown according to the leaf contract; silent substitution is prohibited.
    supportStateSeparation: Intended scope and semantic definition are independent of implementation, license admission, qualification, and current runtime availability. For each leaf/profile, only the matching evidence can advance its support dimension; definition or a complete request shape never means implemented, licensed, qualified, or available. UNKNOWN is not AVAILABLE and NOT_EVALUATED is not success.
    sourceAuthority: requirements.yaml owns requirement-family intent and obligation; capabilities.yaml owns exact leaf operation/request semantics; profile-semantics.yaml owns bounded-invocation admission and resource units; qualification-policy.yaml owns qualification evidence semantics. Source phrases in the migration plan establish provenance, not unstated request defaults or numeric bounds. This rule neither modifies PDP-1 ownership nor accepts generated projections.
    status: DEFINITION_ONLY; numeric limits, runtime enforcement, qualification, implementation, license admission, availability, and independent P0-010 acceptance remain separate and are not asserted.
requirements:
  - id: MEDIA-REQ-CAP-PROJECT
    scopeStatus: TARGET
    recorderStudioSpecialization:
      sourceRef: .product-experience/pdp-0-product-truth/requirements.yaml#recorderStudioProfile
      scope: Recorder-Studio-source-defined-successor-not-runtime-admission
      acceptanceCaseRefs:
        - MEDIA-REC-P0-AC-017
        - MEDIA-REC-P0-AC-018
        - MEDIA-REC-P0-AC-019
        - MEDIA-REC-P0-AC-020
        - MEDIA-REC-P0-AC-021
        - MEDIA-REC-P0-AC-075
        - MEDIA-REC-P0-AC-076
        - MEDIA-REC-P0-AC-077
        - MEDIA-REC-P0-AC-078
    statement: Every operation in media.project retains the intended semantic outcome in the full product definition and is invocable only through an explicit, authorized, compatible binding whose current implementation, license admission, qualification, and runtime availability are separately established.
    rationale: Master-plan §6 requires finite full-scope capability preservation and explicitly separates definition from implementation and admission; a catalog entry is not evidence of support.
    source:
      masterPlanSection: §6.2
      sourcePhrase: Create, inspect, update, search, organize, archive, version, duplicate/branch, collaborate/review and restore projects; source/derived assets, composition and project settings
    capabilityIds:
      - media.project.create
      - media.project.inspect
      - media.project.update
      - media.project.search
      - media.project.organize
      - media.project.archive
      - media.project.version
      - media.project.duplicate
      - media.project.branch
      - media.project.collaborate
      - media.project.review
      - media.project.restore
      - media.project.source-asset.attach
      - media.project.derived-asset.attach
      - media.project.composition.update
      - media.project.settings.update
      - media.project.scene.patch-merge
      - media.agent.edit.preview-scope-guard
    kind: functional
    priority: must
    traceToIntentIds:
      - media.intent.create
      - media.intent.edit
      - media.intent.review-exact-version
      - media.intent.restore-project
    intentTraceState: media-owner-reviewed-fit-to-canonical-P0-002-intents; independent-P0-010-acceptance-pending
    actorRoles:
      - creator
      - editor
      - reviewer
    actorBindingState: resolved-to-P0-002-canonical-actors-and-responsibility-roles
    preconditions:
      - The caller identity, tenant/workspace context, and delegated authority are verified by the owning platform contracts.
      - Inputs, rights, consent, privacy, egress, retention, budget, and policy are admitted for this specific operation.
      - A capability binding and profile are declared; qualification and runtime availability are checked for the requested dimensions.
    expectedBehavior: The system performs only the requested Create, inspect, update, search, organize, archive, version, duplicate/branch, collaborate/review and restore projects; source/derived assets, composition and project settings operation using typed inputs and outputs; reports actual effective parameters and provenance; preserves source versions; and does not substitute an unsupported engine, model, format, language, or delivery profile silently.
    importantStates:
      - not-admitted
      - admitted
      - running-or-observing
      - completed
      - failed
      - cancel-requested-or-finality-unknown
      - blocked-by-policy-or-capability
    stateModelBindingState: bound-to-proposed-project-lifecycle-version-and-membership-models; P0-005 semantic-owner-review-pending
    consequences:
      - Any change to source bytes, version, rights, meaning, fidelity, destination, or externally visible effect is explicit and traceable.
      - A completed definition record never implies runtime readiness or qualification.
    failureDegradationRecovery:
      - Return typed validation, authority, rights/license, unsupported-capability, capacity, timeout, cancellation, provider-ambiguity, and internal-failure outcomes as applicable.
      - Expose safe remediation, retry/cancel/reconcile eligibility, and finality; do not silently downgrade preservation, quality, spatial/scientific fidelity, or delivery constraints.
      - Preserve accepted source and completed outputs; require policy-permitted explicit fallback or stop for review.
    nonfunctionalRequirements:
      - tenant isolation and least privilege
      - privacy/data minimization and governed egress
      - durable audit/effect intent for consequential effects
      - bounded time/memory/storage/compute/cost
      - accessible semantic representation and keyboard operation where interactive
      - localization and explicit unsupported language/format bounds
      - provenance, reproducibility class, and recovery truth
    acceptanceCases:
      - id: MEDIA-REQ-CAP-PROJECT-AC-01
        given: A declared leaf, authorized input, and a binding that satisfies the requested profile and policy.
        when: The caller requests the operation.
        then: The typed result, effective parameters, provenance, terminal/finality state, and measured dimensions are returned; only the declared effect occurs.
      - id: MEDIA-REQ-CAP-PROJECT-AC-02
        given: The requested language, format, right, profile, license, capability, or qualification is absent or unknown.
        when: Admission is evaluated.
        then: The operation is blocked or returns an explicit qualified fallback only when policy permits; unknown is never reported as available.
      - id: MEDIA-REQ-CAP-PROJECT-AC-03
        given: A user requests a consequential composition update through natural language.
        when: the request is interpreted against a versioned project revision.
        then: produce a reviewable edit proposal before the consequential project state changes.
        rejection: reject silently committing an ambiguous or unreviewed proposal as an applied edit.
      - id: MEDIA-REQ-CAP-PROJECT-AC-04
        given: A project has a confirmed revision and automatic checkpointing is in scope.
        when: the product checkpoints and later recovers project state after interruption.
        then: preserve the last confirmed revision and state which unsaved changes may be absent or lost before recovery is accepted.
        rejection: reject silently overwriting the confirmed revision or implying a durability or recovery-point guarantee not defined for the product.
      - id: MEDIA-REQ-CAP-PROJECT-AC-05
        given: An authorized creator organizes a project containing immutable source-asset versions and requests library bins or nested collections.
        when: The creator proposes a hierarchy and assigns exact asset-version references to its bins.
        then: Return a reviewable, version-bound organization proposal that preserves each source identity and version and makes no project or asset mutation until explicitly confirmed.
        rejection: Reject replacing source assets, changing their versions, or applying ambiguous membership or hierarchy changes without confirmation.
      - id: MEDIA-REQ-CAP-PROJECT-AC-06
        given: An authorized creator defines a smart bin using an explicit predicate over project assets and chooses live or snapshot membership.
        when: Membership is evaluated against the declared project revision and predicate.
        then: Return exact member-version references and label whether membership is live or a snapshot; distinguish observed attributes, inferred matches with uncertainty, unknown or unindexed attributes, and a known empty result.
        rejection: Reject treating unknown or unindexed attributes as non-matches, silently changing snapshot membership, or implying that a smart bin mutates its source assets.
      - id: MEDIA-REQ-CAP-PROJECT-AC-07
        given: An authorized editor submits a scene patch against an exact project and scene revision, and a later revision contains overlapping changes.
        when: The product evaluates whether the patch can be reconciled with the current revision.
        then: Return a local merge proposal bound to the base, left, and right revisions, identifying each overlapping conflict and preserving both source revisions; create a new revision only after explicit review and confirmation.
        rejection: Reject silently applying a patch to a changed scene, choosing a conflict winner without authorization, or claiming a committed revision while the result is pending, unknown, or unavailable.
      - id: MEDIA-REQ-CAP-PROJECT-AC-08
        given: An authorized project owner requests a portable backup of one exact project revision.
        when: The product prepares its backup manifest and restore proposal.
        then: Identify the exact project revision, included immutable asset versions, external references, and omitted, unavailable, or rights-restricted content; call the backup complete only when every required item and integrity check is accounted for, and restore as a new revision that preserves the originals.
        rejection: Reject implying completeness when inclusion or integrity is unknown, silently replacing an external reference, or restoring over the source revision.
      - id: MEDIA-P0-COHORT01-AUD-COLLAB-002-POS
        given: An authorized reviewer action targets an exact project version.
        when: The reviewer records a project review action.
        then: Record actor, scope, action, target version, and resulting review state only.
      - id: MEDIA-P0-COHORT01-AUD-COLLAB-002-NEG
        given: An authorized reviewer action targets an exact project version.
        when: Admission evaluates the same request with an unsupported, denied, stale, or unknown required condition.
        then: No checklist pass, evidence validity decision, or quality signoff is implied without explicit criteria and authorized signoff evidence.
      - id: MEDIA-P0-COHORT01-AUD-COLLAB-008-POS
        given: An authorized reviewer selects an exact project version and review action.
        when: The reviewer submits the action.
        then: Record the review action and resulting state against that version.
      - id: MEDIA-P0-COHORT01-AUD-COLLAB-008-NEG
        given: An authorized reviewer selects an exact project version and review action.
        when: Admission evaluates the same request with an unsupported, denied, stale, or unknown required condition.
        then: Review does not create, accept, merge, or persist a proposal payload; unsupported proposal semantics remain unavailable.
      - id: MEDIA-P0-COHORT01-AUD-COLLAB-011-POS
        given: A project and authorized editor are supplied with a user-scoped hierarchy change.
        when: Project organization is requested.
        then: Return the proposed or updated user-scoped hierarchy and its versioned state.
      - id: MEDIA-P0-COHORT01-AUD-COLLAB-011-NEG
        given: A project and authorized editor are supplied with a user-scoped hierarchy change.
        when: Admission evaluates the same request with an unsupported, denied, stale, or unknown required condition.
        then: Do not infer team library membership, cross-tenant visibility, reusable brand/voice/style rights, or shared ownership.
      - id: MEDIA-P0-COHORT01-AUD-COLLAB-003-REVIEW-POS
        given: A user review intent and an immutable versioned project are supplied with current assigned review authority for the exact scope and purpose.
        when: The caller records one declared project review action.
        then: Record only the actor, declared action, purpose, scope, immutable project version, assigned authority, and linked evidence; leave the reviewed project version unchanged.
      - id: MEDIA-P0-COHORT01-AUD-COLLAB-003-REVIEW-NEG
        given: The intent, project version, declared action, assigned authority, or scoped evidence is missing, stale, denied, or unsupported.
        when: Admission evaluates the same operation with an unsupported, denied, stale, or unknown required condition.
        then: Return UNKNOWN, BLOCKED, or REJECTED as applicable; do not change the project, create annotations, assert comparison evidence, or issue quality signoff.
      - id: MEDIA-REQ-P0-C03-AUD-SPEC-005
        given: Exact source asset/version, recipe/spec version, model/provider/checkpoint/tokenizer/license pins, purpose and rights evidence.
        when: Request reproducible specification and rights snapshot.
        then: Return candidate pin snapshot with evidence independently listed; stale/missing pin or rights UNKNOWN and no qualified-use claim. Snapshot is not admission, qualification, runtime availability or asset consumption; no defaults. PDP-0 evidence outcome; identities PDP-1; admission/execution separate.
      - id: MEDIA-REQ-P0-C03-AUD-TRUST-015
        given: Exact tenant IDs, source version, derivative/cache candidate, purpose and rights/retention evidence.
        when: Request derivative reuse within/across tenant scope.
        then: Allow reuse candidate only if exact tenant/purpose/source/rights match; else deny/no-reuse or UNKNOWN. Attachment is not cache authorization; no cross-tenant disclosure/reuse or hash-only equivalence. PDP-0 reuse result; tenant/cache state PDP-1; isolation enforcement implementation evidence.
      - id: AUD-DIRECT-010-B_SPLIT_DIRECT-MEDIA-REQ-CAP-PROJECT-POS
        given: 'A current exact revision, typed operations, declared scope, and valid source-bound authority are supplied: [{"slotId":"baseRevision","sourceType":"exact-versioned-project-or-artifact-revision","cardinality":"EXACTLY_ONE","required":true},{"slotId":"typedOperations","sourceType":"ordered-typed-operation-preview","cardinality":"ONE_OR_MORE","required":true},{"slotId":"scope","sourceType":"declared-project-artifact-and-field-scope","cardinality":"EXACTLY_ONE","required":true}].'
        when: Invoke media.agent.edit.preview-scope-guard.agent.edit.preview-scope-guard in the declared mode.
        then: Return the exact preview, approval, revision, and effect result [{"artifactType":"read-only-semantic-diff-plan","requiredOnSuccess":true,"fields":["baseRevision","normalizedOperations","exactDiff","scope","requiredAuthority","expiresAt"],"neverApplies":true}]; dry-run never commits.
        polarity: POSITIVE
        sourceAuditId: AUD-DIRECT-010
        sourceCapabilityId: media.agent.edit.preview-scope-guard
      - id: AUD-DIRECT-010-B_SPLIT_DIRECT-MEDIA-REQ-CAP-PROJECT-NEG
        given: The base is stale, scope is denied, approval is absent, or effect finality is unknown; typed inputs are [{"slotId":"baseRevision","sourceType":"exact-versioned-project-or-artifact-revision","cardinality":"EXACTLY_ONE","required":true},{"slotId":"typedOperations","sourceType":"ordered-typed-operation-preview","cardinality":"ONE_OR_MORE","required":true},{"slotId":"scope","sourceType":"declared-project-artifact-and-field-scope","cardinality":"EXACTLY_ONE","required":true}], and unsupported conditions are ["Base revision is stale or unknown.","Operation is outside the exact declared scope.","Approval is caller-supplied, missing, stale, or not source-bound.","External effect is UNKNOWN_OUTCOME; never replay blindly."].
        when: Invoke media.agent.edit.preview-scope-guard.agent.edit.preview-scope-guard in the declared mode.
        then: Return bounded rejection or UNKNOWN_OUTCOME {"REJECTED":["Invalid, stale, denied, or out-of-scope preview."],"UNKNOWN_OUTCOME":["Preview source state is not current; do not present a stale plan."]} with errors ["INVALID_REQUEST","ACCESS_DENIED","STALE_REVISION","SCOPE_DENIED","UNKNOWN_OUTCOME"] and authority ["identity-and-tenant-context","operation-specific-policy-and-rights","artifact-read-or-write-permission-as-applicable"]; do not apply or blindly replay.
        polarity: NEGATIVE
        sourceAuditId: AUD-DIRECT-010
        sourceCapabilityId: media.agent.edit.preview-scope-guard
    relatedExternalContract: Record the owning public contract in dependency-contracts.yaml when P0-007 maps this family; do not invent a new external endpoint or duplicate owner schema.
    downstreamMappings:
      journeys: pending-P0-009
      viewsAndChannels: exact-leaf-channel-applicability-bound-in-capability-leaf-review.yaml; exact-screen/action-bindings-pending-P0-009
