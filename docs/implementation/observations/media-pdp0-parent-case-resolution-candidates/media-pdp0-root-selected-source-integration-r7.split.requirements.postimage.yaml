      - The caller identity, tenant/workspace context, and delegated authority are verified by the owning platform contracts.
      - Inputs, rights, consent, privacy, egress, retention, budget, and policy are admitted for this specific operation.
      - A capability binding and profile are declared; qualification and runtime availability are checked for the requested dimensions.
    expectedBehavior: The system performs only the requested Ingest, upload, resume, import, inspect, search/list, download, derive, register outputs, share/revoke, delete, retain, export provenance and resolve source references operation using typed inputs and outputs; reports actual effective parameters and provenance; preserves source versions; and does not substitute an unsupported engine, model, format, language, or delivery profile silently.
    importantStates:
      - not-admitted
      - admitted
      - running-or-observing
      - completed
      - failed
      - cancel-requested-or-finality-unknown
      - blocked-by-policy-or-capability
    stateModelBindingState: authored-P0-005-proposal-reference; pending-P0-010-independent-acceptance
    consequences:
      - Any change to source bytes, version, rights, meaning, fidelity, destination, or externally visible effect is explicit and traceable.
      - A completed definition record never implies runtime readiness or qualification.
    failureDegradationRecovery:
      - Return typed validation, authority, rights/license, unsupported-capability, capacity, timeout, cancellation, provider-ambiguity, and internal-failure outcomes as applicable.
      - Expose safe remediation, retry/cancel/reconcile eligibility, and finality; do not silently downgrade preservation, quality, spatial/scientific fidelity, or delivery constraints.
      - Preserve accepted source and completed outputs; require policy-permitted explicit fallback or stop for review.
    nonfunctionalRequirements:
      - tenant isolation and least privilege
      - privacy/data minimization and governed egress
      - durable audit/effect intent for consequential effects
      - bounded time/memory/storage/compute/cost
      - accessible semantic representation and keyboard operation where interactive
      - localization and explicit unsupported language/format bounds
      - provenance, reproducibility class, and recovery truth
    acceptanceCases:
      - id: MEDIA-REQ-CAP-ARTIFACT-AC-01
        given: A declared leaf, authorized input, and a binding that satisfies the requested profile and policy.
        when: The caller requests the operation.
        then: The typed result, effective parameters, provenance, terminal/finality state, and measured dimensions are returned; only the declared effect occurs.
      - id: MEDIA-REQ-CAP-ARTIFACT-AC-02
        given: The requested language, format, right, profile, license, capability, or qualification is absent or unknown.
        when: Admission is evaluated.
        then: The operation is blocked or returns an explicit qualified fallback only when policy permits; unknown is never reported as available.
      - id: MEDIA-REQ-CAP-ARTIFACT-AC-03
        given: An actor is authorized to search transcript content for an exact source-media or project version.
        when: The actor requests a semantic transcript search.
        then: Return bounded candidate matches anchored to the exact source version and transcript time range; distinguish unavailable transcript content, denied scope, unknown matching, and an empty candidate page.
        rejection: Reject presenting candidates as complete when matching or continuation is unknown, or returning transcript content outside the admitted rights-and-retention scope.
      - id: MEDIA-REQ-CAP-ARTIFACT-AC-04
        given: An actor is authorized to inspect possible duplicate or near-duplicate artifacts.
        when: the actor requests duplicate detection.
        then: Return bounded candidate groups that retain every source artifact identity and state the matching uncertainty.
        rejection: Reject merging, replacing, or deleting any source artifact as a consequence of candidate detection.
      - id: MEDIA-REQ-CAP-ARTIFACT-AC-05
        given: An authorized Studio creator searches the governed Media asset store for candidates for an explicitly declared intended-use scope.
        when: The product evaluates each immutable asset version for the requested license/use-scope filter.
        then: Return a candidate as eligible only when current authoritative per-version rights and license evidence explicitly permits the declared scope; preserve the exact asset version and evidence identity. Missing, unknown, denied, expired, revoked, restricted, or incompatible evidence never makes a candidate eligible, and unresolved evidence is reported as UNKNOWN or review-required rather than as an empty eligible result.
        rejection: Reject inferring permission from searchable metadata, treating this filter as legal clearance, silently substituting a different asset or license, or claiming external-catalog search, ranking, or complete results.
      - id: MEDIA-REQ-CAP-ARTIFACT-AC-06
        given: An authorized editor searches an admitted project for timeline, person, scene, or speaker facets with an explicit time range and exact project or source-version scope.
        when: The product evaluates the requested facet filters against indexed observations.
        then: Return bounded matches with exact immutable source-version references, matching time ranges, and observed or inferred provenance; report unknown or unindexed fields and partial matching separately from a known empty result.
        rejection: Reject presenting an unindexed or uncertain facet as absent, claiming complete matches while continuation or indexing is unknown, or widening the search beyond authorized rights and retention scope.
      - id: MEDIA-REQ-CAP-ARTIFACT-AC-07
        given: An authorized creator submits a visual or descriptive metadata query for assets within an explicit project and version scope.
        when: The product searches available visual observations and metadata.
        then: Return bounded candidate matches with exact source-version provenance, relevant time ranges where available, and match uncertainty; distinguish unavailable or unindexed evidence and unknown matching from a known empty result.
        rejection: Reject representing similarity as a verified fact, dropping source-version provenance, claiming completeness when indexing or continuation is unknown, or exposing content outside admitted rights and retention scope.
      - id: MEDIA-REQ-CAP-ARTIFACT-AC-08
        given: An authorized editor imports a sidecar or embedded caption track for an exact immutable media version and the format and rights are admitted.
        when: The product parses and validates the caption source and its timebase mapping.
        then: Return a reviewable caption-import result preserving source-file provenance, source version, language and format when known, caption timing, and any conversion or alignment uncertainty; do not alter the source media.
        rejection: Reject silently shifting or dropping caption timing, claiming unknown language or alignment as verified, or registering or replacing a canonical artifact without the separately authorized action.
      - id: MEDIA-REQ-CAP-ARTIFACT-AC-09
        given: An authorized editor requests a clip derived from an exact immutable source version with an explicit source-time range, output profile, purpose, and applicable rights.
        when: The product validates the range against the source timebase and prepares the derivation.
        then: Bind the candidate derivation to the exact source version and requested start and end times, disclose boundary quantization or uncertainty, and return job or candidate state without changing the source.
        rejection: Reject substituting another source version, silently rounding or extending the requested range, implying a completed or registered artifact before that state is confirmed, or bypassing rights and profile admission.
      - id: MEDIA-REQ-CAP-ARTIFACT-AC-10
        given: An authorized user searches the governed Media asset store by declared metadata and an intended-use rights scope.
        when: The product evaluates exact asset versions against available metadata and authoritative per-version rights evidence.
        then: Return bounded candidates with exact version and rights-evidence references; distinguish unknown or incomplete indexing from a known empty result. External catalogs are available only when a specific catalog and use are separately admitted.
        rejection: Reject inferring permission from searchable metadata, calling search legal clearance, or claiming external-catalog, complete, or ranked results when those scopes are not admitted.
      - id: MEDIA-REQ-CAP-ARTIFACT-AC-11
        given: An authorized editor supplies a source timecode with its exact source version, declared frame rate or timebase, and drop-frame or non-drop-frame mode.
        when: The product interprets or converts that timecode.
        then: Preserve the original label and mode and return an exact source-time mapping only when the declared rate, mode, and mapping are valid.
        rejection: Reject ambiguous or invalid labels, mismatched rates, unknown mappings, silent drop-frame/non-drop-frame reinterpretation, or rounding across frame boundaries.
      - id: MEDIA-P0-COHORT01-AUD-ASSET-015-POS
        given: An authorized search query and explicitly admitted indexed source set with immutable version/time scope are supplied.
        when: The caller requests artifact search.
        then: Return bounded matching artifact references with source/version/time provenance and disclose index coverage.
      - id: MEDIA-P0-COHORT01-AUD-ASSET-015-NEG
        given: An authorized search query and explicitly admitted indexed source set with immutable version/time scope are supplied.
        when: Admission evaluates the same request with an unsupported, denied, stale, or unknown required condition.
        then: Unknown/unindexed coverage is distinct from no matches; search does not enroll a reference voice, create a durable catalog, or establish likeness/reuse authority.
      - id: MEDIA-P0-COHORT01-AUD-ASSET-016-POS
        given: An immutable source version, declared derivative profile, purpose, and valid rights context are supplied.
        when: The caller requests a derivative.
        then: Return or track a derivative candidate linked to those inputs and disclose its result state.
      - id: MEDIA-P0-COHORT01-AUD-ASSET-016-NEG
        given: An immutable source version, declared derivative profile, purpose, and valid rights context are supplied.
        when: Admission evaluates the same request with an unsupported, denied, stale, or unknown required condition.
        then: Unknown profile/rights blocks or marks the result UNKNOWN; no cache hit, freshness, eviction, or reuse guarantee is a product outcome.
      - id: MEDIA-P0-COHORT01-AUD-COLLAB-007-POS
        given: An authorized resource, recipient scope, expiry, and applicable sharing authority are supplied.
        when: The caller creates a share grant.
        then: Return a grant reference with resource/recipient scope, expiry, and revocation state.
      - id: MEDIA-P0-COHORT01-AUD-COLLAB-007-NEG
        given: An authorized resource, recipient scope, expiry, and applicable sharing authority are supplied.
        when: Admission evaluates the same request with an unsupported, denied, stale, or unknown required condition.
        then: Unspecified scope blocks grant creation; expiry/revocation does not delete or create a review package or prove export.
      - id: MEDIA-REQ-P0-C03-AUD-OPS-017
        given: Exact input versions, transform/profile digest, output/bounds, tenant, purpose and current rights.
        when: Request a derivative when same-scope reuse may exist.
        then: Return derivative candidate or no-reuse outcome with lineage; reuse eligibility only for identical source/profile/output/tenant/purpose/rights bindings. Hash alone is not rights equivalence; no stale/cross-tenant reuse or cache implementation claim without evidence. PDP-0 reuse intent if owner confirms visible value; cache keys/freshness/persistence PDP-1/BUILD.
