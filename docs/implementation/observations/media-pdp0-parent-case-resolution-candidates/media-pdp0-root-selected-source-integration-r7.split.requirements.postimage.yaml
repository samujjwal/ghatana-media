      - id: MEDIA-REQ-CAP-RECIPE-TEMPLATE-AC-08
        given: An authorized creator binds a valid typed production specification to an exact existing MediaProject revision and its referenced assets.
        when: Media prepares the specification's interpretation as a project plan.
        then: Return a reviewable plan candidate bound to that exact revision, schema, and asset versions without applying it to the project.
        rejection: Reject missing or ambiguous references, stale project revisions, unsupported nodes, or unknown types as an applied or complete plan; compilation alone does not create a project, job, or external effect.
      - id: MEDIA-REQ-CAP-RECIPE-TEMPLATE-AC-09
        given: An authorized creator supplies a valid specification declaring steps intended to be deterministic or generative.
        when: Media validates and normalizes the step graph.
        then: Preserve each declared step kind and its dependency; mark an indistinguishable or unsupported kind UNKNOWN, and keep classification separate from execution.
        rejection: Reject executing an invalid or unknown step, claiming deterministic output for a generative step, or substituting a step kind implicitly.
