      - Inputs, rights, consent, privacy, egress, retention, budget, and policy are admitted for this specific operation.
      - A capability binding and profile are declared; qualification and runtime availability are checked for the requested dimensions.
    expectedBehavior: The system performs only the requested Encoding/transcoding, mastering, packaging, streaming, downloading, exporting and governed publishing; multiple aspect ratios/resolutions; adaptive-bitrate renditions; Web/social/broadcast/cinematic/archival/interactive or explicit named profiles; subtitles/transcripts; thumbnails/posters; interactive scene bundles and provenance manifests; codec/container/player compatibility and fallback per profile operation using typed inputs and outputs; reports actual effective parameters and provenance; preserves source versions; and does not substitute an unsupported engine, model, format, language, or delivery profile silently.
    importantStates:
      - not-admitted
      - admitted
      - running-or-observing
      - completed
      - failed
      - cancel-requested-or-finality-unknown
      - blocked-by-policy-or-capability
    stateModelBindingState: authored-P0-005-proposal-reference; pending-P0-010-independent-acceptance
    consequences:
      - Any change to source bytes, version, rights, meaning, fidelity, destination, or externally visible effect is explicit and traceable.
      - A completed definition record never implies runtime readiness or qualification.
    failureDegradationRecovery:
      - Return typed validation, authority, rights/license, unsupported-capability, capacity, timeout, cancellation, provider-ambiguity, and internal-failure outcomes as applicable.
      - Expose safe remediation, retry/cancel/reconcile eligibility, and finality; do not silently downgrade preservation, quality, spatial/scientific fidelity, or delivery constraints.
      - Preserve accepted source and completed outputs; require policy-permitted explicit fallback or stop for review.
    nonfunctionalRequirements:
      - tenant isolation and least privilege
      - privacy/data minimization and governed egress
      - durable audit/effect intent for consequential effects
      - bounded time/memory/storage/compute/cost
      - accessible semantic representation and keyboard operation where interactive
      - localization and explicit unsupported language/format bounds
      - provenance, reproducibility class, and recovery truth
    acceptanceCases:
      - id: MEDIA-REQ-CAP-DELIVER-AC-01
        given: A declared leaf, authorized input, and a binding that satisfies the requested profile and policy.
        when: The caller requests the operation.
        then: The typed result, effective parameters, provenance, terminal/finality state, and measured dimensions are returned; only the declared effect occurs.
      - id: MEDIA-REQ-CAP-DELIVER-AC-02
        given: The requested language, format, right, profile, license, capability, or qualification is absent or unknown.
        when: Admission is evaluated.
        then: The operation is blocked or returns an explicit qualified fallback only when policy permits; unknown is never reported as available.
      - id: MEDIA-REQ-CAP-DELIVER-AC-03
        given: A creator declares a source version, audience/locale/device dimensions or explicit variant rules, and applicable delivery constraints that bound the intended target set.
        when: The creator requests preparation of output variants from those declarations.
        then: Deterministically expand only the declared dimensions or rules into a bounded variant set, preserving each declared target and its source provenance and effective parameters in candidate outputs or plans. Report each unsupported, infeasible, denied, unavailable, or unknown target explicitly and apply MEDIA-REQ-CAP-DELIVER-AC-02 as applicable; do not generate undeclared combinations or extras, silently replace a target, downgrade a declared constraint, publish, or imply qualified delivery.
        rejection: Reject inferring consent to additional audience/device/locale variants, merging variant identities, or representing a candidate or plan as an exported, published, or runtime-qualified result.
      - id: MEDIA-REQ-CAP-DELIVER-AC-04
        given: An authorized publisher selects an exact caption track and declares sidecar or embedded export, target media version, format, language, timebase, destination, and applicable rights.
        when: The product validates and prepares the subtitle delivery candidate.
        then: Preserve caption timing and track provenance, report any required conversion or alignment uncertainty, and expose destination submission, acceptance, and finality as separate states.
        rejection: Reject silently shifting or dropping captions, changing the target media version or format, claiming destination acceptance before it is observed, or embedding or exporting without authorization.
      - id: MEDIA-REQ-CAP-DELIVER-AC-05
        given: An authorized publisher selects an exact source version, profile, destination, and publication scope.
        when: Media submits a governed publication request and observes any remote result.
        then: Distinguish Media request acceptance, destination acknowledgment, confirmed delivery, and audience access, binding each observed state to its source and reference.
        rejection: Reject reporting a local request acknowledgment or unknown remote state as destination completion or audience access.
      - id: MEDIA-P0-COHORT01-AUD-DELIV-013-DELIVER-POS
        given: An accepted media artifact or composition and a requested delivery profile and destination are supplied.
        when: The caller requests subtitle delivery using an explicitly supported sidecar or embedded packaging form.
        then: Return only a source-derived delivery package or explicit delivery outcome; do not generate subtitle text, perform burned-in composition, or imply delivery success beyond the returned outcome.
      - id: MEDIA-P0-COHORT01-AUD-DELIV-013-DELIVER-NEG
