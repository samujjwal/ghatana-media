    acceptanceCases:
      - id: MEDIA-REQ-CAP-SIMULATION-AC-01
        given: A declared leaf, authorized input, and a binding that satisfies the requested profile and policy.
        when: The caller requests the operation.
        then: The typed result is specific to the exact declared model family; its effective parameters, per-family qualification state, provenance, terminal/finality state, and measured dimensions are returned. Any visual fallback is explicitly illustrative, distinct from model-backed output, and not a quantitative claim.
      - id: MEDIA-REQ-CAP-SIMULATION-AC-02
        given: The requested language, format, right, profile, license, capability, or qualification is absent or unknown.
        when: Admission is evaluated.
        then: The operation is blocked or returns only an explicitly policy-permitted illustrative visual fallback, labeled non-quantitative and distinct from a model result; unknown is never reported as available.
      - id: MEDIA-REQ-CAP-SIMULATION-AC-03
        given: A user supplies a versioned agent-based, economic, or epidemiological state model with declared assumptions, PRNG algorithm and version, seed, distribution, and sampling plan, and a qualified domain owner has admitted the exact model-family scope; without that admission, applicability remains UNKNOWN.
        when: Media executes or presents the supplied model output.
        then: retain the model identity and declared assumptions, report the PRNG algorithm and version, seed, distribution, sampling conditions, estimates and confidence bounds when available, and label results UNQUALIFIED unless applicable independent scientific validation is present; report the result as NON_REPLAYABLE when the declared execution profile cannot support replay.
        rejection: reject execution when exact model-family applicability is absent or unknown; reject deterministic or replayability claims without the declared PRNG implementation/version and matching execution profile; reject presenting output as causal inference, validated science, or real-world truth based only on execution or visualization.
      - id: MEDIA-REQ-CAP-SIMULATION-AC-04
        given: An authorized domain owner supplies a versioned ODE, finite-state, graph, or algorithm-trace model with declared units or state semantics, assumptions, initial conditions, boundaries, and exact model-family scope.
        when: Media prepares or evaluates the requested simulation candidate.
        then: Preserve the exact model family, version, solver or execution profile, declared validity domain, and evidence provenance; qualify a result only for the explicitly admitted family and requested dimensions.
        rejection: Reject treating a discrete-event or rigid-body example as support for another model family, inferring physical validity from a rendered trace, or presenting an unqualified or unknown solver result as validated science.
      - id: MEDIA-REQ-CAP-SIMULATION-AC-05
        given: An authorized domain owner proposes a scientific or educational result for reporting on an F0–F4 fidelity axis.
        when: Media evaluates whether that result can be presented as scientifically validated.
        then: Preserve the domain owner's exact F0–F4 meaning, keep visual detail, visual quality, model fidelity, and validation tier separate, and bind any validation claim to a named qualified scientific authority and exact evidence scope.
        rejection: Reject promoting a result when authority, evidence, validity domain, or model provenance is absent or unknown; execution, a visual score, or a self-assigned tier is not independent scientific acceptance.
