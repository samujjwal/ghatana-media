        given: An authorized creator supplies one exact versioned YAML or JSON production specification, its declared schema, and exact content/source references.
        when: Media normalizes the specification under a named compiler-contract version.
        then: Return a typed semantic graph with exact specification, schema, and compiler-contract provenance; the same admitted inputs and contract version yield an equivalent normalized graph and stable semantic fingerprint.
