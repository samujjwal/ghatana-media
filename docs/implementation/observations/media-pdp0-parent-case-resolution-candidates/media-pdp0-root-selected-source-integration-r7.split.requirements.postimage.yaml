        given: A creator uses a reusable agent or director package to prepare a production recipe.
        when: the package is selected for reuse.
        then: identify the package version and make its declared dependencies reviewable before they guide a production outcome.
        rejection: reject silently changing package dependencies or treating reuse as approval of those dependencies.
      - id: MEDIA-REQ-CAP-RECIPE-TEMPLATE-AC-04
        given: A creator supplies multiple production references and constraints with an explicit relative priority.
        when: a recipe is prepared from those inputs.
        then: use the supplied references and priority to guide the intended outcome while retaining their source identity.
        rejection: reject silently dropping a reference or inventing a priority when the supplied ordering is absent or ambiguous.
