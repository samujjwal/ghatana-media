      - id: MEDIA-REQ-CAP-RIGHTS-AC-02
        given: The requested language, format, right, profile, license, capability, or qualification is absent or unknown.
        when: Admission is evaluated.
        then: The operation is blocked or returns an explicit qualified fallback only when policy permits; unknown is never reported as available.
      - id: MEDIA-REQ-CAP-RIGHTS-AC-03
        given: A requested transformation derives content from an identified source recording.
        when: the system evaluates whether the requested use is admitted.
        then: preserve the source identity and block the derivative use when the applicable permitted-use decision is absent, unknown, denied, restricted, revoked, or expired.
        rejection: reject treating a similarity observation or source possession as a permitted-use decision.
      - id: MEDIA-REQ-CAP-RIGHTS-AC-04
        given: A requested synthetic or altered presenter involves an identifiable person, voice, or model.
        when: the product evaluates eligibility for the requested use.
        then: block use while applicable rights, consent, or license is missing, unknown, denied, restricted, revoked, or expired; disclosure remains separate from authorization.
        rejection: reject treating generated disclosure, an asserted right, or possession of a source as sufficient authorization.
      - id: MEDIA-REQ-CAP-RIGHTS-AC-05
        given: A creator requests singing-voice synthesis conditioned on an identifiable voice, source recording, or voice model.
        when: the product evaluates whether synthesis is permitted for the declared purpose.
        then: preserve voice, source, and model provenance and block use when applicable rights, consent, or license is missing, unknown, denied, restricted, revoked, or expired.
        rejection: reject inferring clearance from voice similarity, source possession, or the act of synthesis.
      - id: MEDIA-REQ-CAP-RIGHTS-AC-06
        given: An authorized reviewer declares a face or personally identifying information analysis purpose, exact source version, and the applicable owner policy.
        when: A face or PII observation is requested as evidence for a dependent use decision.
        then: Return only the declared detection or analysis observation with source version, time or region, and uncertainty, and keep its policy consequence tied to the named owner decision.
        rejection: Reject inferring identity, consent, or use clearance from detection; missing or unknown purpose, authority, or policy leaves the dependent use blocked and unresolved.
      - id: MEDIA-REQ-CAP-RIGHTS-AC-07
        given: An authorized actor declares exact input versions, model or checkpoint, destination, purpose, and the applicable external-egress permission.
        when: A requested operation would transmit media or derived data outside the governed local scope.
        then: Identify the egress target and data class and require the applicable explicit permission before dispatch.
        rejection: Reject implicit provider, model, or cloud fallback; missing, unknown, or denied egress permission blocks transmission.
      - id: MEDIA-REQ-CAP-RIGHTS-AC-08
        given: An authorized caller proposes use of each exact asset, voice, model or checkpoint, and font version and declares its purpose and scope.
        when: The product evaluates those components for project use or generation.
        then: Bind each component to its own rights-evidence reference, issuer or authority, scope, version, and decision state.
        rejection: Reject inferring per-source permission from possession, package presence, a project-wide license, or similarity; absent, stale, revoked, incompatible, or unknown evidence blocks use.
      - id: MEDIA-REQ-CAP-RIGHTS-AC-09
        given: An authorized caller supplies captions, transcripts, prompts, or asset metadata from an external or user-supplied source marked as untrusted content.
        when: The product parses, summarizes, or passes that content to an agent or tool.
        then: Treat the content only as data; any proposed action remains attributed to an authorized actor and bound to the exact project revision.
        rejection: Reject embedded content as authority to invoke privileged operations, change rights or egress, or mutate project state; an ambiguous instruction/data boundary blocks consequential action.
      - id: MEDIA-REQ-CAP-RIGHTS-AC-10
        given: An authorized editor requests a plugin, shader, or editor action with consequential access or effects and identifies the exact component version, permissions, and target state.
        when: The product evaluates that action for invocation.
        then: Require explicit, scoped, revocable authorization and disclose the requested permissions before invocation.
        rejection: Reject inferring authority from installation, asset presence, or editor context; missing or unknown permission blocks invocation. Arbitrary user-authored shader execution remains unsupported by this product baseline.
      - id: MEDIA-REQ-CAP-RIGHTS-AC-11
        given: An authorized reviewer evaluates a voice request involving an identifiable person when required consent, impersonation, age-eligibility, or policy state is missing, unknown, disputed, or denied.
        when: The product evaluates admission for the requested voice use.
        then: Block the use and expose the unresolved policy reason for authorized review; the product defines no age threshold or legal eligibility test in this case.
        rejection: Reject inferring consent or eligibility from similarity, public availability, source possession, or model capability.
      - id: MEDIA-REQ-CAP-RIGHTS-AC-12
        given: An authorized requester proposes a voice result that could target an identifiable person, but the applicable protected-person or consent-sensitive policy and review result are absent, unknown, disputed, or denied.
        when: The product evaluates admission for the requested voice use.
        then: Block or hold the request for an authorized owner-policy review without asserting a public-figure list or legal test.
        rejection: Reject inferring eligibility from published recordings, requester assertion, public-figure status, or voice similarity.
      - id: MEDIA-REQ-CAP-RIGHTS-AC-13
        given: An authorized publisher declares viewer-analytics purpose, collected fields, retention and deletion scope, and a valid consent state for the exact viewer or session.
        when: The product collects or discloses viewer analytics.
        then: Collect only consented, purpose-bounded fields, redact identity or secrets under the declared policy, and preserve consent and purpose provenance.
        rejection: Reject collection or disclosure when consent is absent, revoked, unknown, or out of scope; viewing or interaction alone is not consent, and no retention duration is inferred.
      - id: MEDIA-P0-COHORT01-AUD-CLONE-005-POS
        given: A consent reference and exact subject/purpose context are supplied.
        when: The caller requests consent-reference resolution.
        then: Return the reference resolution state and declared scope only.
      - id: MEDIA-P0-COHORT01-AUD-CLONE-005-NEG
        given: A consent reference and exact subject/purpose context are supplied.
        when: Admission evaluates the same request with an unsupported, denied, stale, or unknown required condition.
        then: Missing, expired, revoked, or mismatched consent blocks dependent use; resolution does not create a speaker profile, embedding, clone target, or encryption guarantee.
