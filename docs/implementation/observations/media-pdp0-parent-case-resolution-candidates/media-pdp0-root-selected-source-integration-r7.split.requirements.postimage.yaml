        given: The project, selected artifacts, composition intent, required authority, or supported composition profile is missing, stale, denied, or unsupported.
        when: Admission evaluates the same operation with an unsupported, denied, stale, or unknown required condition.
        then: Return UNKNOWN, UNAVAILABLE, or REJECTED as applicable; do not create a composition or imply color-quality or delivery outcomes.
      - id: MEDIA-REQ-P0-C03-AUD-QA-011
        given: Exact caption/timing/source version, requested safe-area placement and declared contrast/readability measurement method/context.
        when: Assess placement and readability/contrast.
        then: Report placement separately from measured contrast/readability with method, scope, evidence and abstention; no pass/fail absent owner threshold. Placement is not readability; absent method/threshold UNKNOWN; no face-safe claim absent evidence. PDP-0 separate intents; metric schema/threshold owner definition; no quality acceptance.
