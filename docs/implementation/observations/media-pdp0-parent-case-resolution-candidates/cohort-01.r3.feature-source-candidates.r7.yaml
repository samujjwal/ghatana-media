features:
  - featureId: media.stream.session.product-effect.readback.observe
    auditId: AUD-CAP-028
    selectedChoice: A
    operation: product-effect.observe
    productIntent: Observe exact owner-controlled effect state; never infer replay permission.
    typedInputs:
      - "ownerEffectSource: owner-controlled effect-source reference"
      - "effectIdentity: stable effect identifier"
      - "observedRevision: owner source revision"
      - "evidenceRef: typed current evidence"
      - "observedAt: timestamp"
      - "finality: PENDING | FINAL | REVERSED | UNKNOWN"
    requiredAuthority:
      - actual owner endpoint binding
      - effect-read authority
      - typed current evidence
    successOutput:
      - product-effect observation with owner, source, effect, revision, evidence, observation time and finality
    unknownAndUnsupportedBehavior:
      - Reconnect-session state is separate from product-effect state.
      - Missing, unavailable or unverified owner/evidence binding yields UNKNOWN/UNAVAILABLE.
      - Never infer safe resume, scene ownership, completion or permission to replay.
    mandatoryConditions:
      - Define authoritative effect-observation input as exact owner-controlled effect source reference, effect identity, observed version/revision, typed evidence ref, observation time and finality value.
      - Separate reconnect-session state from product-effect state. Missing/unavailable/unverified owner binding or evidence returns UNKNOWN/UNAVAILABLE; never infer safe resume, scene ownership, completed effects or permission to replay.
      - Required genuine owner endpoint binding remains an explicit execution prerequisite; this source direction supplies no endpoint or runtime grant.
    sourceRefs:
      - docs/implementation/references/MEDIA-UNIFIED-PRODUCTION-ATTACHED-COMBINED-AUDIT-V3-2026-10-17.json#originalAudit.inventory/@audit_id=AUD-CAP-028
