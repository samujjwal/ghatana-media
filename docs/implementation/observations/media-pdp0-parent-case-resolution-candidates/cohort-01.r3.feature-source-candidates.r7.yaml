  - featureId: media.deliver.readiness.observe
    auditId: AUD-DELIV-007
    selectedChoice: A
    operation: deliver.readiness.observe
    productIntent: Observe readiness from separate declared technical/hardware and legal/rights criteria with current evidence.
    typedInputs:
      - "targetProfileHardware: requested target/profile/hardware references"
      - "technicalCriteria: owned technical/hardware criteria and evidence"
      - "legalCriteria: owned legal/rights criteria and evidence"
    requiredAuthority:
      - technical/hardware criteria owner
      - legal/rights decision owner
    successOutput:
      - readiness observation with separate technical and legal results plus evidence
    unknownAndUnsupportedBehavior:
      - Unknown criteria/evidence remain UNKNOWN.
      - Technical observation cannot substitute for legal approval.
      - No professional judgment, equipment qualification, deployment or release approval is issued.
    mandatoryConditions:
      - Define product readiness observation with separately typed technical/hardware and legal/rights criterion results, exact requested target/profile/hardware, criterion owner/source and current evidence refs.
      - Actual legal clearance requires genuine authorized legal decision evidence; unknown legal criteria/evidence stays UNKNOWN and prevents a clearance claim. A technical observation cannot substitute for legal approval.
      - Hardware capability/admission evidence and legal decision evidence remain distinct. No professional judgment, equipment qualification, deployment or release approval is issued by this direction.
    sourceRefs:
      - docs/implementation/references/MEDIA-UNIFIED-PRODUCTION-ATTACHED-COMBINED-AUDIT-V3-2026-10-17.json#originalAudit.inventory/@audit_id=AUD-DELIV-007
