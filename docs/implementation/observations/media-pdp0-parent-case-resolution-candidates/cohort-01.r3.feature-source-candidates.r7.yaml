  - featureId: media.color.saturation
    auditId: AUD-COLOR-001
    selectedChoice: SAT-A
    operation: color.saturation.adjust
    productIntent: Add explicit finite multiplicative saturation intent as a new parameter with requested/effective values recorded separately.
    typedInputs:
      - "sourceArtifact: immutable color artifact and version"
      - "profileBasis: supported versioned color profile"
      - "saturationFactor: finite number, unit multiplicative-saturation-factor, inclusive [0,2], precision 2 places, step 0.01, default 1, neutral 1"
    requiredAuthority:
      - source artifact read
      - profile admission
      - color adjustment policy
    successOutput:
      - local adjusted color candidate with source version, requested factor, effective factor and profile version
    unknownAndUnsupportedBehavior:
      - Numeric semantics are a new delegated product-source choice, not inferred from code or a standard.
      - Unsupported profile, wrong precision, non-finite/out-of-range values reject without clamp or substitution.
      - No gamut/fidelity/quality qualification; algorithm and colorimetric contracts remain at their owning PDP phases.
    mandatoryConditions:
      - This is a new delegated product-source choice, not a claim that existing code or standards already specify these numbers.
      - Preserve immutable source artifact/version and declared color/profile basis; output is a local adjusted candidate with requested/effective parameter provenance.
      - Unsupported profile/space or factor, non-finite/wrong-precision input and missing source version reject without silent clamp/substitution. Neutral value preserves saturation intent; actual algorithm/colorimetric and fidelity contracts are authored at their owning PDP phases.
      - Do not claim implementation, gamut/fidelity/quality qualification or canonical project commit. Add exact boundary/default/neutral/negative source acceptance cases.
    parameterContract:
      parameterId: saturationFactor
      type: finite-number
      unit: multiplicative-saturation-factor
      minimum: 0
      maximum: 2
      inclusive: true
      precisionDecimalPlaces: 2
      step: 0.01
      default: 1
      neutralValue: 1
      requestedAndEffectiveValuesRecordedSeparately: true
