  - featureId: media.speech.synthesis.speaker.design-synthetic-persona
    auditId: AUD-CLONE-006
    selectedChoice: A
    operation: speaker.persona.design-synthetic
    productIntent: Create a source-free synthetic voice persona with explicit non-identity provenance.
    typedInputs:
      - "designAttributes: non-identity design attributes"
      - "voiceDesignProfile: admitted versioned profile"
      - "tenantActor: tenant and actor context"
      - "rightsIdentityPolicy: applicable policy references"
    requiredAuthority:
      - voice-design profile admission
      - tenant/actor policy
      - rights/identity policy
    successOutput:
      - synthetic voice-persona candidate with version, design provenance and synthetic disclosure
    unknownAndUnsupportedBehavior:
      - Does not claim to represent or be endorsed by a real person.
      - Imitation, misrepresentation or identifiable-person enrollment is unavailable in this branch.
      - Identifiable-person use requires separate genuine identity, rights and consent authority.
    mandatoryConditions:
      - Define a source-free synthetic voice-persona design intent distinct from authorized cloning. Inputs include non-identity design attributes, admitted voice-design profile, tenant/actor and applicable rights/identity policy refs.
      - Output is a clearly synthetic local voice-persona candidate/version with design provenance; no assertion that it represents or is endorsed by a real person.
      - A request to imitate, misrepresent or enroll an identifiable person requires separately genuine identity/rights/consent authority and is unavailable under this source-free branch.
    sourceRefs:
      - docs/implementation/references/MEDIA-UNIFIED-PRODUCTION-ATTACHED-COMBINED-AUDIT-V3-2026-10-17.json#originalAudit.inventory/@audit_id=AUD-CLONE-006
