  - featureId: media.speech.synthesis.speaker.enroll-persona-authorized
    auditId: AUD-CLONE-017
    selectedChoice: A
    operation: speaker.persona.enroll-authorized
    productIntent: Perform a distinct governed enrollment for an exact subject/persona under current purpose-scoped consent and authority.
    typedInputs:
      - "subjectIdentity: exact subject identity reference"
      - "persona: persona and version reference"
      - "purpose: declared enrollment purpose"
      - "rightsConsent: versioned purpose-scoped rights/consent"
      - "decisionAuthority: actual authorized decision source"
      - "lifecycle: revocation/deletion lifecycle contract"
    requiredAuthority:
      - identity verification
      - rights consent
      - enrollment decision authority
      - lifecycle policy
    successOutput:
      - auditable enrollment outcome bound to subject, persona version, purpose, consent, authority and lifecycle
    unknownAndUnsupportedBehavior:
      - Consent-reference resolution alone is not enrollment.
      - Expired/revoked/mismatched scope rejects; unavailable actual authority or ambiguous outcome stays UNKNOWN.
      - No identity verification, consent, likeness right, credential or specialist approval is asserted.
    mandatoryConditions:
      - Define avatar/persona enrollment as its own governed operation with exact subject identity ref, avatar/persona/version, purpose, consent/rights scope and version, actual authorized decision source, revocation/deletion/lifecycle contract and auditable outcome ref.
      - Resolving a consent reference is not enrollment. Missing, expired, revoked or mismatched scope rejects; unavailable actual authority or ambiguous external effect remains UNKNOWN and cannot be replayed automatically.
      - No actual identity verification, consent, likeness right, credential, enrollment state or specialist approval is supplied by this direction.
    sourceRefs:
