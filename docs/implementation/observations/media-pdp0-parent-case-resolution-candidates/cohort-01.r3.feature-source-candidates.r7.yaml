  - featureId: media.color.profile.compatibility.observe
    auditId: AUD-COLOR-007
    selectedChoice: A
    operation: color.profile.compatibility.observe
    productIntent: Observe compatibility against one named versioned profile and target; disclose supported, unsupported and unknown dimensions.
    typedInputs:
      - "requestedProfile: named versioned color profile"
      - "target: explicit processing/render target"
      - "applicabilityDimensions: declared dimension set"
      - "evidence: current evidence references"
    requiredAuthority:
      - profile/target source
      - compatibility evidence source
    successOutput:
      - profile compatibility observation with requested/effective profile versions, target, supported/unsupported/unknown dimensions and evidence
    unknownAndUnsupportedBehavior:
      - Compatibility is not standards conformance or certification.
      - Conformance requires standard/version, authorized decision source, method, target and authentic evidence.
      - Missing conformance inputs remain UNKNOWN.
    mandatoryConditions:
      - Define exact profile/target compatibility observation with versioned requested and effective profile, declared applicability dimensions, supported/unsupported/unknown results and current evidence provenance.
      - "Retain standards-conformance as a separate required branch when requested by the original criterion: real standard/version, authorized conformance decision source, test method/target and authentic evidence are mandatory, and missing inputs yield UNKNOWN/UNAVAILABLE."
      - A compatibility result alone never satisfies certification or standards-conformance acceptance.
    sourceRefs:
      - docs/implementation/references/MEDIA-UNIFIED-PRODUCTION-ATTACHED-COMBINED-AUDIT-V3-2026-10-17.json#originalAudit.inventory/@audit_id=AUD-COLOR-007
