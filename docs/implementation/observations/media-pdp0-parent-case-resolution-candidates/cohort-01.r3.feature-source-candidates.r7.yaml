  - featureId: media.speech.synthesis.speaker.tune-authorized
    auditId: AUD-CLONE-004
    selectedChoice: A
    operation: speaker.tune-authorized
    productIntent: Capture separately selectable, rights-authorized custom voice tuning that yields a versioned local candidate.
    typedInputs:
      - "sourceVoice: immutable voice artifact and version"
      - "tuningProfile: admitted versioned profile and dimensions"
      - "purpose: declared purpose"
      - "rightsConsent: current purpose-scoped rights/consent reference"
      - "authorizedActor: actor reference"
      - "retentionPolicy: retention/deletion policy reference"
    requiredAuthority:
      - voice source read
      - rights and consent
      - tuning purpose
      - retention policy
      - authorized actor
    successOutput:
      - local voice candidate with source/profile version, requested dimensions, rights, purpose, retention and actor lineage
    unknownAndUnsupportedBehavior:
      - Does not silently enroll, train, adapt or replace a canonical model.
      - Unsupported profile/dimension or absent/revoked rights, purpose or retention authority rejects.
      - Training, adaptation and activation are separate governed operations.
    mandatoryConditions:
      - Define separately selectable authorized custom-voice tuning intent with immutable source voice/version, requested versioned tuning-profile/dimensions, permitted purpose, rights/consent ref, authorized actor, retention/deletion policy ref, and candidate output/version lineage.
      - Tuning must not silently enroll, train, adapt or replace a canonical model. Any training/adaptation or activation is a separate explicit governed operation.
      - Unsupported tuning profiles/dimensions, missing rights/purpose/retention authority or revoked consent reject; unknown outcome remains unknown and requires reconciliation.
    sourceRefs:
      - docs/implementation/references/MEDIA-UNIFIED-PRODUCTION-ATTACHED-COMBINED-AUDIT-V3-2026-10-17.json#originalAudit.inventory/@audit_id=AUD-CLONE-004
      - .product-experience/pdp-0-product-truth/capabilities.yaml#capabilities/@id=media.speech.synthesis.speaker.clone-authorized
