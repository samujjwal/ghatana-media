    requirementDefinition:
      id: MEDIA-REQ-AUD-OPS-021-MODEL-PACKAGE-MANAGE
      scopeStatus: COORDINATOR_AUTHORED_PDP0_PROPOSAL; owner acceptance pending
      statement: Model-package install, upgrade, migrate, and remove intents are bound to one exact immutable package
        identity, version, digest, and source, with an explicit purpose and operator or administrator authority.
        Before an action can be eligible, required rights, license, integrity, security, locality, compatibility, and
        exact machine/checkpoint qualification evidence must be current and known. Missing or failed models remain
        UNAVAILABLE or UNKNOWN without synthetic success or unauthorized cloud/provider fallback. Package operations
        do not mutate existing media, projects, or derived artifacts, silently switch the active profile, or report
        unresolved removal as success; acquisition and execution remain NOT_ADMITTED by current policy.
      rationale: AUD-OPS-021 identifies safe model-package installation, upgrade, migration, and removal. This proposal
        defines exact product meaning while leaving package data/version contracts, journeys, implementation, and
        qualification to their owning phases.
      source:
        auditFeature: Safe install/upgrade/migration and model removal
        sourceRef: docs/implementation/references/MEDIA-UNIFIED-PRODUCTION-ATTACHED-COMBINED-AUDIT-V3-2026-10-17.json#originalAudit.inventory/@audit_id=AUD-OPS-021
        sourceTextRef: docs/implementation/references/MEDIA-UNIFIED-PRODUCTION-ATTACHED-COMBINED-AUDIT-V3-2026-10-17.json#originalAudit.inventory/@audit_id=AUD-OPS-021
      capabilityIds: [media.capability.model-package.manage]
      kind: functional
      priority: pending-owner-disposition
      priorityDisposition: The source audit does not establish product priority; owner decision remains pending.
      traceToIntentIds: [media.intent.audit-ops-021-model-package-manage]
      relatedOutcomeRefs: [media.goal.resolve-safely]
      intentTraceState: coordinator-authored-exact-PDP0-proposal; owner acceptance pending
      actorRoles: [operator, administrator]
      actorBindingState: references-proposed-canonical-actor-and-responsibility-role-IDs; owner acceptance pending
      preconditions:
        - The caller is authorized as an operator or administrator for the declared purpose and exact package action.
        - Each action names exact immutable package identity, version, digest, source, and target; migration names exact
          source and destination package references.
        - All action-required rights, license, integrity, security, locality, compatibility, and exact
          machine/checkpoint qualification evidence is current and known; otherwise the action is blocked or explicitly
          unresolved.
      expectedBehavior: Install, upgrade, migrate, or remove only the package explicitly identified by the caller.
        Upgrade and migration preserve existing media, projects, and derived artifacts and do not silently switch an
        active profile. Removal preserves user media, projects, and derived artifacts; active dependencies or
        unresolved removal return BLOCKED, PARTIAL, or UNKNOWN, not success. P0 provides no rollback or runtime
        guarantee.
      importantStates: [not-admitted, completed, blocked, partial, outcome-unknown]
      stateModelBindingState: explicit-result-states-only; persistent package lifecycle remains a PDP-1 handoff
      consequences:
        - No automatic package download, default model/provider, or substitution is implied.
        - Missing or unknown action evidence does not authorize an effect.
        - Existing media, projects, and derived artifacts remain outside package mutation scope.
        - Package-operation completion does not silently activate a profile.
        - An unresolved or dependency-blocked removal is never reported as successful.
      failureDegradationRecovery:
        - Report denied, unavailable, blocked, partial, and unknown evidence or outcomes explicitly.
        - Preserve UNKNOWN when package identity, source, rights, integrity, locality, compatibility, dependency, or
          finality evidence is incomplete.
        - Do not imply rollback, retry, or recovery behavior; those contracts remain downstream work.
      nonfunctionalRequirements:
        - least-privilege operator or administrator authority bound to declared purpose
        - rights, license, security, integrity, locality, and compatibility checks before an effect
        - preservation of user media, projects, derived artifacts, and active profile selection
        - explicit blocked, partial, unavailable, and unknown outcomes
        - auditable exact package identity, version, digest, source, action, and authority
      acceptanceCases:
        - id: MEDIA-REQ-AUD-OPS-021-MODEL-PACKAGE-MANAGE-AC-01
          given: An authorized operator or administrator requests install, upgrade, or migration for exact package
            references and a declared purpose with all required evidence known.
          when: A separately admitted implementation evaluates the request.
          then: The action is limited to the exact requested package, does not mutate media, projects, or derived
            artifacts, and does not select a default package/provider or silently switch the active profile.
          rejection: Reject unspecified or substituted package identity, version, digest, source, purpose, or authority.
        - id: MEDIA-REQ-AUD-OPS-021-MODEL-PACKAGE-MANAGE-AC-02
          given: Removal is requested for an exact package with an active dependency or unresolved outcome.
          when: The removal is evaluated.
          then: Return BLOCKED, PARTIAL, or UNKNOWN and preserve user media, projects, and derived artifacts.
          rejection: Reject reporting unresolved or dependency-blocked removal as success or deleting a different
            package.
        - id: MEDIA-REQ-AUD-OPS-021-MODEL-PACKAGE-MANAGE-AC-03
          given: Any action-required authority, rights, license, integrity, security, locality, compatibility, or exact
            machine/checkpoint qualification evidence is missing, denied, unavailable, stale, or unknown.
          when: The action is evaluated.
          then: Block or explicitly report the non-success state with no fallback or substitution.
          rejection: Reject treating absent or unknown evidence as permission or a successful action.
        - id: MEDIA-REQ-AUD-OPS-021-MODEL-PACKAGE-MANAGE-AC-04
          given: A model is missing, failed, unqualified for the exact machine/checkpoint, or has unknown status, and
            no separately authorized exact fallback is available.
          when: Readiness is evaluated for an operation that depends on that model.
          then: Return UNAVAILABLE or UNKNOWN without synthetic success or unauthorized cloud/provider fallback.
          rejection: Reject converting a missing or failed model into successful output or an implicit provider change.
      adoptionModeProposal: REUSE_GHATANA_RUNTIME_PROVIDER_GOVERNANCE
      adoptionDecision:
        state: OWNER_DECISION_PENDING
        currentPolicyBoundaryRef: .product-experience/pdp-0-product-truth/reuse-decisions.yaml#notAdmittedByThisRecord
        selectedProvider: NONE
        selectedModelOrPackage: NONE
        runtimeAdmission: NOT_ADMITTED
        effect: The imported adoption mode remains a proposal; no package acquisition, execution, or provider is admitted.
      relatedExternalContract: Exact package identity, version, digest, source, migration, dependency, and result data
        contracts are PDP-1 handoffs and are not defined by this PDP-0 proposal.
      downstreamMappings:
        journeys: pending-PDP-3-user-journey-definition-for-the-proposed-CLI-surface
        viewsAndChannels: .product-experience/pdp-0-product-truth/campaign-extensions.yaml#records/@id=AUD-OPS-021/channelApplicability;
          proposal only; owner review pending
        states: explicit action-result distinctions only; persistent package lifecycle remains a PDP-1 handoff
        implementation: not-authorized-by-definition; execution and qualification belong to Build/Deliver
        pdp1DataVersionContract: pending; exact package identity/version/digest/source and migration contracts are not authored here
        pdp3UserJourney: pending; CLI journeys and interaction details are not authored here
      ownerAcceptance: NOT_CLAIMED
