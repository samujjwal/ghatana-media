    requirementDefinition:
      id: MEDIA-REQ-AUD-CLONE-006-SOURCE-FREE-VOICE-STYLE-PROFILE-DESIGN
      scopeStatus: COORDINATOR_AUTHORED_PDP0_PROPOSAL; owner acceptance pending
      statement: A source-free synthetic voice-design request produces a distinct voice-style/profile design without
        requiring or consuming a human reference or recording. Before any separately defined inference, every
        applicable voice grant, exact model/checkpoint license, source-use right, purpose, and destination must be
        current and authorized; a missing, denied, unavailable, unknown, expired, or revoked required grant blocks
        before inference. Every resulting profile, sample, or other output carries its exact rights and provenance;
        incomplete bindings produce no output. Piper and synthetic/test placeholders never prove a clone, identity,
        successful inference, or rights clearance. This definition admits no model or inference. Identifiable-person,
        voice, or likeness requests remain outside this source-free proposal and require their own rights-governed definition.
      rationale: AUD-CLONE-006 identifies synthetic voice design without a human reference. This proposal separates
        authored style/profile design from human-source cloning, identity matching, likeness, and audio generation.
      source:
        auditFeature: Synthetic voice design without human reference
        sourceRef: docs/implementation/references/MEDIA-UNIFIED-PRODUCTION-ATTACHED-COMBINED-AUDIT-V3-2026-10-17.json#originalAudit.inventory/@audit_id=AUD-CLONE-006
        sourceTextRef: docs/implementation/references/MEDIA-UNIFIED-PRODUCTION-ATTACHED-COMBINED-AUDIT-V3-2026-10-17.json#originalAudit.inventory/@audit_id=AUD-CLONE-006
      capabilityIds: [media.speech.synthesis.voice-style-profile.design-source-free]
      kind: functional
      priority: pending-owner-disposition
      priorityDisposition: The source audit does not establish product priority; owner decision remains pending.
      traceToIntentIds: [media.intent.audit-clone-006-source-free-voice-design]
      relatedOutcomeRefs: [media.goal.finished-asset]
      intentTraceState: coordinator-authored-exact-PDP0-proposal; owner acceptance pending
      actorRoles: [creator, editor]
      actorBindingState: references-proposed-canonical-actor-and-responsibility-role-IDs; owner acceptance pending
      preconditions:
        - The caller declares a creative purpose and supplies a source-free style brief; no human reference or recording
          is needed for this path.
        - Before any future inference, all applicable rights grants and exact model/checkpoint/source-use license,
          purpose, and destination evidence must be current and known; missing, denied, unavailable, unknown, expired,
          or revoked required evidence blocks before inference.
        - An identifiable-person, voice, or likeness target requires exact rights and consent for the subject, requested
          use, and purpose; absent, unknown, expired, or revoked evidence blocks the target request, and valid evidence
          still leaves it outside this source-free proposal.
      expectedBehavior: Define a distinct source-free synthetic voice-style/profile design. Any future inference is
        blocked before it starts when an applicable grant or model/checkpoint/source-use right is missing, denied,
        unavailable, unknown, expired, or revoked. Attach applicable rights and exact provenance to every resulting
        profile, sample, or other output; if binding fails, emit no output. Piper and synthetic/test placeholders are
        fixtures only and do not prove a clone or successful inference. Do not create speaker identity or claim a real
        person, clone, identity match, voice likeness, reuse/consent clearance, or provider support. Identifiable-target
        requests require exact rights but remain outside this source-free proposal.
      importantStates: [source-free-design-defined, rights-review-required, blocked, unsupported, outcome-unknown]
      stateModelBindingState: explicit-result-states-only; profile data and version lifecycle remain a PDP-1 handoff
      consequences:
        - No human reference or recording is required or consumed for source-free style/profile design.
        - Provenance describes a source-free authored synthetic design, not a human-source or cloned voice.
        - A profile design does not create speaker identity or establish rights or reuse clearance.
        - Identifiable-person, voice, or likeness targeting is gated by exact rights and consent and remains outside
          this source-free proposal even when rights evidence is valid.
      failureDegradationRecovery:
        - Report missing, denied, expired, revoked, unavailable, or unknown rights evidence explicitly.
        - Preserve BLOCKED or UNKNOWN for an identifiable target when exact rights or consent cannot be established.
        - Do not convert an unsupported, identity-targeted, or unresolved request into source-free success.
      nonfunctionalRequirements:
        - source-free provenance without fabricated human lineage
        - pre-inference exact rights, voice grant, model/checkpoint license, purpose, and destination checks
        - applicable rights/provenance binding on every profile, sample, and other output
        - no inference before current applicable rights are established
        - Piper and synthetic/test placeholders cannot evidence a clone, identity, or successful inference
        - no speaker identity or human-source claim from profile design
        - explicit blocked, unsupported, unavailable, and unknown outcomes
        - separation from speech generation, cloning, and provider qualification
      acceptanceCases:
        - id: MEDIA-REQ-AUD-CLONE-006-SOURCE-FREE-VOICE-STYLE-PROFILE-DESIGN-AC-01
          given: A creator or editor requests a profile design from a non-identifying style brief and declared purpose
            without a human recording or reference.
          when: The design is evaluated.
          then: Return a distinct source-free authored synthetic style/profile design with truthful provenance and no
            speaker identity, clone, likeness, or reuse-clearance claim.
          rejection: Reject fabricating a human source, claiming identity or likeness, or representing the design as
            generated audio.
        - id: MEDIA-REQ-AUD-CLONE-006-SOURCE-FREE-VOICE-STYLE-PROFILE-DESIGN-AC-02
          given: The request targets an identifiable person, voice, or likeness, whether exact rights and consent are
            missing, unknown, expired, revoked, or valid.
          when: The request is evaluated.
          then: Require exact rights and consent for the subject, requested use, and purpose; block or preserve UNKNOWN
            if evidence is absent, unknown, expired, or revoked, and do not emit a source-free result for the target.
          rejection: Reject treating any evidence as clearance for this source-free path or producing a target result.
        - id: MEDIA-REQ-AUD-CLONE-006-SOURCE-FREE-VOICE-STYLE-PROFILE-DESIGN-AC-03
          given: A request includes a human reference, recording, identity match, cloning, or voice conversion.
          when: It is submitted to the source-free design capability.
          then: Keep that request outside the source-free design meaning and do not claim identity, clone, likeness, or
            successful source-free output.
          rejection: Reject a human-reference or identity-targeted request represented as source-free.
        - id: MEDIA-REQ-AUD-CLONE-006-SOURCE-FREE-VOICE-STYLE-PROFILE-DESIGN-AC-04
          given: A future inference requires a voice grant or model/checkpoint/source-use right that is missing, denied,
            unavailable, unknown, expired, revoked, or out of scope for the requested purpose or destination.
          when: The pre-inference rights gate is evaluated.
          then: Block before inference begins and preserve BLOCKED or UNKNOWN; do not call a provider or create output.
          rejection: Reject inference with absent, stale, revoked, expired, or unresolved required rights.
        - id: MEDIA-REQ-AUD-CLONE-006-SOURCE-FREE-VOICE-STYLE-PROFILE-DESIGN-AC-05
          given: A Piper or other synthetic/test placeholder is presented as voice evidence or output.
          when: It is reviewed or attached to a voice-design result.
          then: Treat it only as a labeled fixture and do not infer a human source, clone, identity, successful inference,
            or rights clearance.
          rejection: Reject a placeholder as proof of cloning, identity, authorized inference, or success.
        - id: MEDIA-REQ-AUD-CLONE-006-SOURCE-FREE-VOICE-STYLE-PROFILE-DESIGN-AC-06
          given: A future separately admitted inference creates a profile, sample, or other output.
          when: The output is produced or registered.
          then: Bind the exact model/checkpoint, source-free/source-derived status, applicable license/grant, purpose,
            and use scope to that output; if rights or provenance cannot be bound, emit no output and preserve
            BLOCKED or UNKNOWN.
          rejection: Reject any output missing exact applicable rights or provenance.
      relatedExternalContract: Voice profile design identity, version, provenance, and rights evidence contracts are
        PDP-1 handoffs and are not defined by this PDP-0 proposal.
      downstreamMappings:
        journeys: pending-PDP-3-user-journey-definition-for-the-proposed-production-studio-surface
