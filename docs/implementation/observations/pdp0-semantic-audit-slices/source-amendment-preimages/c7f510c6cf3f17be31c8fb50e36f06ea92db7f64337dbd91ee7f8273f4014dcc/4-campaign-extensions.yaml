          - UNAVAILABLE
          - UNKNOWN_OUTCOME
        idempotency: Candidate version creation is bound to its explicit request identity; conflicting edits must
          remain distinguishable and prior versions remain unchanged.
        recovery: Revalidate the exact rule-set version and inputs after an unknown result; never infer execution or
          retry eligibility for an affected operation.
        availability:
          implementationState: UNKNOWN
          licenseAdmissionState: UNKNOWN
          qualificationState: NOT_EVALUATED
          runtimeAvailability: UNKNOWN
          executionAdmission: NOT_ADMITTED
    requirementDefinition:
      id: MEDIA-REQ-CAP-RULES
      scopeStatus: COORDINATOR_AUTHORED_PDP0_PROPOSAL; owner acceptance pending
      statement: The product definition distinguishes user-authored, scoped action/quality rule-set candidates and
        their exact versions from validation observations, candidate operation plans, approval, and execution.
        Every affected media operation remains separately requested and admitted.
      rationale: AUD-SPEC-020 identifies reusable user-configurable action/quality rules. This requirement gives
        those rules a distinct semantic owner and does not broaden delivery-profile validation.
      source:
        auditFeature: Reusable user-configurable action/quality rules
        sourceRef: docs/implementation/references/MEDIA-UNIFIED-PRODUCTION-ATTACHED-COMBINED-AUDIT-V3-2026-10-17.json#originalAudit.inventory/@audit_id=AUD-SPEC-020
        sourceTextRef: docs/implementation/references/MEDIA-UNIFIED-PRODUCTION-ATTACHED-COMBINED-AUDIT-V3-2026-10-17.json#originalAudit.inventory/@audit_id=AUD-SPEC-020
      capabilityIds:
        - media.rules.manage
      kind: functional
      priority: must
      traceToIntentIds:
        - media.intent.manage-reusable-rules
      relatedOutcomeRefs:
        - media.goal.integrate-repeatably
      intentTraceState: coordinator-authored-exact-PDP0-proposal; owner acceptance pending
      actorRoles:
        - creator
        - editor
        - developer-integrator
        - operator
      actorBindingState: references-canonical-actor-and-responsibility-role-IDs; owner acceptance pending
      preconditions:
        - The caller identifies the rule-set scope and is authorized for the requested authoring or inspection
          action.
        - Validation or reuse names the exact rule-set version and target media operation.
        - Admission of each affected operation is separate from rule-set validation or reuse planning.
      expectedBehavior: Authoring returns a stable, version-bound rule-set candidate without replacing its prior
        version. Explicit validation returns a version-bound observation; explicit reuse may return only a
        provenance-bearing candidate operation plan. Neither validation nor reuse executes the rules, approves
        them, or establishes runtime qualification.
      importantStates:
        - candidate
        - validated
        - invalid
        - denied
        - unsupported
        - unavailable
        - unknown
      stateModelBindingState: explicit-operation-result-states; no persistent lifecycle model is claimed
      consequences:
        - Invalid, unauthorized, stale, or incomplete rule sets are never partially applied.
        - The prior rule-set version remains unchanged when a new candidate is authored.
        - A candidate plan cannot silently trigger any affected media operation.
      failureDegradationRecovery:
        - Report invalid, denied, unsupported, unavailable, stale, and unknown rule or input states explicitly.
        - Preserve UNKNOWN when version, target operation, authority, or validation evidence is incomplete.
        - Require a new explicit request and separate admission for every affected operation.
      nonfunctionalRequirements:
        - tenant isolation and least privilege
        - privacy/data minimization and governed egress
        - durable audit/effect intent for consequential effects
        - bounded time/memory/storage/compute/cost
        - accessible semantic representation and keyboard operation where interactive
        - provenance, reproducibility class, and recovery truth
      acceptanceCases:
        - id: MEDIA-REQ-CAP-RULES-AC-01
          given: A user authors a scoped action/quality rule set with explicit inputs and constraints, then requests a
            stable new version, exact-version validation, or reuse against a declared media operation.
          when: Media evaluates the explicit rule-management request.
          then: Return a versioned candidate, version-bound validation observation, or provenance-bearing candidate
            operation plan for the requested variant; preserve the prior version and require separate
            admission of each affected operation; do not approve or execute the rules.
          rejection: Reject a changed or stale version, silent fallback, partial application, hidden execution, or a
            candidate/result represented as human-approved or runtime-qualified.
        - id: MEDIA-REQ-CAP-RULES-AC-02
          given: A rule set, required input, target operation, or authority is invalid, unsupported, denied,
            unavailable, stale, incomplete, or unknown.
          when: Authoring, validation, or reuse is evaluated.
          then: Return the applicable explicit failure or UNKNOWN state, apply no partial rules, preserve the prior
            version, and perform no affected operation.
          rejection: Reject treating missing or unknown evidence as available, using a different rule-set version, or
            reporting an affected operation as executed.
        - id: AUD-SPEC-020-REQ-AC-RIGHTS-LICENSE-01
          given: The requested rule-set scope or any affected media operation has rights, consent, privacy, egress,
            security, or applicable license evidence that is denied, unavailable, or unknown.
          when: The caller requests authoring, validation, or reuse of the rule set.
          then: Return the applicable DENIED, UNAVAILABLE, or UNKNOWN state; apply no rule, preserve the prior rule-set
            version, and perform no affected media operation.
          rejection: Reject treating missing, denied, unavailable, or unknown rights/license evidence as permission or
            as successful validation.
      relatedExternalContract: The owning public contract remains a PDP-1 handoff; do not invent an endpoint or operation schema here.
      downstreamMappings:
        journeys: pending-PDP-3-experience-definition
        viewsAndChannels: .product-experience/pdp-0-product-truth/campaign-extensions.yaml#records/@id=AUD-SPEC-020/channelApplicability;
          owner review pending
        states: explicit-result-states-only; persistent rule-set lifecycle remains a PDP-1 handoff
        implementation: not-authorized-by-definition
      ownerAcceptance: NOT_CLAIMED
