      id: media.speech.synthesis.voice-style-profile.design-source-free
      scopeStatus: PROPOSAL_ONLY; owner disposition pending
      familyId: media.speech.synthesis
      operation: voice-style-profile.design-source-free
      label: Design a source-free synthetic voice style profile
      definitionState: COORDINATOR_AUTHORED_PDP0_PROPOSAL; owner acceptance pending
      outcome: Produce a distinct source-free authored synthetic voice-style/profile design result from an explicit
        style brief without requiring or consuming a human reference. If a separately defined and admitted inference
        path later realizes a profile or sample, it must pass the applicable rights gate before inference and attach
        truthful rights/provenance to every output. This definition admits no inference or runtime; it does not create
        a human speaker identity, clone, identity match, or real-person voice-likeness claim.
      sourceScope:
        sourceAuditId: AUD-CLONE-006
        sourcePhrase: Synthetic voice design without human reference
        ownerSurfaceProposal: media.surface.production-studio
        ownerScopeApproval: NOT_CLAIMED
      actorRoles: [creator, editor]
      actorBindingState: proposed-canonical-actor-refs; owner acceptance pending
      inputArtifactTypes:
        - source-free-voice-style-design-brief
        - declared-purpose
        - optional-non-identifying-style-constraints
        - exact-rights-and-consent-evidence-if-an-identifiable-person-voice-or-likeness-is-requested
      outputArtifactTypes:
        - source-free-authored-synthetic-voice-style-profile-design
        - source-free-design-and-model-rights-provenance
        - optional-synthetic-voice-output-only-under-a-separately-defined-and-admitted-inference-path
      preconditions:
        - The caller supplies a declared creative purpose and a source-free style brief; no human reference or recording
          is required for this path.
        - This source-free design path accepts only non-identifying style briefs. A request that targets an identifiable
          person, voice, or likeness requires exact rights and consent for the subject, requested use, and purpose and
          remains outside this source-free path even when that evidence is valid.
        - If exact rights or consent is absent, unknown, expired, or revoked for an identifiable target, block the
          request; do not return a successful source-free design for that target.
        - Before any future inference under this feature, evaluate every applicable voice grant, model/checkpoint
          license, source-use right, purpose, and destination against the exact requested use. A missing, denied,
          expired, revoked, unavailable, or unknown required grant stops inference before it starts.
        - If no human voice source is in scope, record that no human reference or voice grant was used; this does not
          waive model/checkpoint license, provider, privacy, locality, or output-use controls.
      supportedParameters: P0 defines a source-free style brief, declared purpose, conditional pre-inference rights gate,
        and output provenance meaning only. Profile identity, version, parameter, rights-evidence, and provenance data
        contracts are PDP-1 handoffs; no provider/model is selected and no inference or audio generation is admitted.
      designSemantics:
        referenceRequirement: No human reference or recording is required or consumed by the source-free path.
        resultKind: Distinct authored synthetic voice-style/profile design; not generated audio or a speaker identity.
        outputProvenance: source-free-authored-synthetic-design
        inferenceRightsGate: Before any separately admitted inference, required voice grants and exact
          model/checkpoint/source rights must be current, active, and purpose/use/destination-scoped; missing, denied,
          expired, revoked, unavailable, or unknown evidence blocks before inference.
        rightsOnEveryOutput: Every profile, sample, or other generated output carries its exact source-free status,
          model/checkpoint identity, applicable licenses/grants, purpose, and use scope. If the applicable rights or
          provenance cannot be attached and resolved, do not emit the output.
        placeholderSemantics: Piper or other synthetic/test placeholders are fixtures only; they do not prove a real
          inference, successful output, human source, clone, identity match, or rights clearance.
        adoptionModeProposal: ADOPT_QUALIFIED_MODEL_OR_OWN_RIGHTS
        adoptionDecisionState: OWNER_DECISION_PENDING; no model, provider, license, or runtime is selected
        forbiddenClaims:
          - a real person's identity
          - a cloned or identity-matched speaker
          - a real-person voice likeness
          - rights, consent, or reuse clearance
        identifiableTargetRequest: Requires exact rights and consent for the identified subject, voice or likeness,
          requested use, and purpose; absent, unknown, expired, or revoked evidence blocks. Even with valid evidence,
          the target request remains outside this source-free design and requires its own rights-governed definition.
        speakerIdentityCreated: false
      constraints:
        - A source-free design does not require or consume a human voice recording or reference.
        - Label provenance as source-free authored synthetic design; do not claim a real person, clone, identity match,
          voice likeness, or reuse/consent clearance.
        - The source-free design result never creates or assigns a speaker identity.
        - If the request identifies or targets a person, voice, or likeness, require exact rights and consent for the
          subject, purpose, and requested use; absent, unknown, expired, or revoked evidence returns BLOCKED or UNKNOWN.
        - A valid rights check does not make an identifiable-target request eligible for this source-free design or
          establish a clone, likeness, or cleared reusable voice; any other path requires its own definition and admission.
        - Any applicable voice grant must be active and exact before future inference; missing, denied, expired,
          revoked, unavailable, or unknown grant means no inference and an explicit BLOCKED or UNKNOWN result.
        - Rights and provenance remain attached to every future profile, sample, or generated output; inability to
          establish or attach them blocks output creation.
        - Piper and other synthetic/test placeholders cannot be reported as a cloned speaker, source-backed result,
          successful inference, or rights-cleared output.
        - P0 does not select a model/provider or claim speech generation, support, availability, audio quality, or execution.
      actionStateReferences:
        action: design-source-free-synthetic-voice-style-profile
        stateCoverage: [not-admitted, design-defined, rights-review-required, blocked, outcome-unknown]
        stateModelBindingState: no-persistent-speaker-identity-or-profile-lifecycle-is-asserted-by-this-proposal
        stateModelRefs: []
      requiredAuthority:
        - identity-and-tenant-context
        - declared-purpose-and-voice-profile-design-permission
        - exact-model-checkpoint-license-and-source-use-rights-before-any-inference
        - current-active-purpose-and-use-scoped-voice-grant-before-inference-when-a-human-voice-right-is-applicable
        - exact-rights-and-consent-for-identifiable-person-voice-or-likeness-use-when-requested
      rightsPrivacyImplications:
        - A source-free design does not establish that a real person's identity, voice, or likeness may be used.
        - Exact rights and consent are required when an identifiable person, voice, or likeness is requested; missing,
          unknown, expired, or revoked evidence blocks that request.
        - The profile design does not itself grant recording, training, inference, reuse, publication, or identity rights.
        - Each future output carries its applicable rights and source/model provenance; no output is eligible when
          required provenance or rights cannot be attached or resolved.
      qualityFidelityContract: A profile design records authored style intent only; it is not a measured voice, speaker
        match, generated-audio result, pronunciation guarantee, or provider-quality claim.
      cancellationRetryReconciliation: P0 admits no generation, inference, retry, or finality behavior. A future
        rights-gated inference must preserve BLOCKED or UNKNOWN before starting when required rights are absent or
        unresolved; an unknown outcome is never represented as successful output.
      executionResourceRequirements: No inference or other execution is admitted. A later inference definition must
        identify the exact qualified model/checkpoint, rights, resource and machine constraints before use.
      provenance:
        - Every design result identifies its origin as source-free authored synthetic design.
        - Do not fabricate a human source, source lineage, speaker identity, likeness, or rights/consent clearance.
        - Every output from any future admitted inference binds the exact model/checkpoint, source-use rights, license,
          active grant where applicable, declared purpose, and permitted use; provenance absence blocks output.
        - Piper or synthetic/test placeholders are labeled as fixtures and cannot be used as proof of cloning, voice
          identity, successful inference, or rights clearance.
      ghatanaReuseDisposition: The imported adoption proposal is ADOPT_QUALIFIED_MODEL_OR_OWN_RIGHTS. Owner disposition
        is pending; this proposal selects no voice model/provider or generation dependency and admits no execution.
      externalDependencies: []
      requirementIds: [MEDIA-REQ-AUD-CLONE-006-SOURCE-FREE-VOICE-STYLE-PROFILE-DESIGN]
      acceptanceCases:
        - given: A creator or editor provides a source-free style brief and declared purpose without an identifiable
            person, voice, likeness, or human recording.
          when: The design request is evaluated under a separately admitted implementation.
          then: Define a distinct synthetic voice-style/profile design with source-free-authored-synthetic-design
            provenance, without creating a speaker identity or claiming generated speech, a clone, likeness, or
            rights/consent clearance.
          id: AUD-CLONE-006-CAP-AC-01
        - given: A request uses a human recording or requires a human reference to match or identify a speaker.
          when: The source-free design path is selected.
          then: Do not accept the request as source-free and do not emit a clone, identity-match, or likeness claim.
          id: AUD-CLONE-006-CAP-AC-02
        - given: A request targets an identifiable person, voice, or likeness and exact rights or consent for the
            subject, requested use, and purpose is absent, unknown, expired, or revoked.
          when: The request is evaluated.
          then: Return BLOCKED or UNKNOWN and no successful source-free result for that target.
          id: AUD-CLONE-006-CAP-AC-03
        - given: Rights evidence is valid for an identifiable target.
          when: The source-free design request is evaluated.
          then: Keep the target request outside this source-free capability and require a separate rights-governed
            definition; do not emit a source-free result or claim cloning, speaker identity, voice likeness, reuse
            clearance, audio generation, or runtime support.
          id: AUD-CLONE-006-CAP-AC-04
        - given: A future inference request has a required voice grant that is missing, denied, unavailable, unknown,
            expired, or revoked, or whose scope excludes the subject, purpose, use, or destination.
          when: The inference gate is evaluated.
          then: Return BLOCKED or UNKNOWN before inference begins; do not call a provider or create an output.
          id: AUD-CLONE-006-CAP-AC-05
        - given: A Piper or other synthetic/test placeholder is available without a verified authorized inference result.
          when: The result is reviewed or attached to a voice-design output.
          then: Label it only as a fixture; do not claim a clone, human identity, successful inference, source, or rights clearance.
          id: AUD-CLONE-006-CAP-AC-06
        - given: A future authorized inference creates a profile, sample, or other output.
          when: The output is produced or registered.
          then: Attach exact model/checkpoint, source-free or source-derived status, applicable license/grant, purpose,
            and use-scope provenance to that output; if binding fails, emit no output and preserve BLOCKED or UNKNOWN.
          id: AUD-CLONE-006-CAP-AC-07
