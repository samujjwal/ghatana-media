  - id: AUD-OPS-021
    stableFeatureId: media.capability.model-package.manage
    campaignId: media.pdp0.501-campaign
    sourceRef: docs/implementation/references/MEDIA-UNIFIED-PRODUCTION-ATTACHED-COMBINED-AUDIT-V3-2026-10-17.json#originalAudit.inventory/@audit_id=AUD-OPS-021
    sourceText: Safe install/upgrade/migration and model removal
    sourceAcceptanceText: Every provider/capability is qualified per machine, checkpoint and license; a failed or missing model does not become synthetic success or unauthorized cloud fallback.
    coordinatorScopeDecision:
      disposition: INCLUDED_IN_PDP0_CAMPAIGN
      authority: user's direct delegation for PDP-0 definition coordination
      effect: Coordinator-authored feature-definition proposal only. This record does not add a canonical owner-adjudicated
        capability leaf, change the historical 462/469/7 population, claim owner scope approval, or assert implementation,
        qualification, runtime availability, execution admission, release, or closure.
      proposedScopeSurfaceRefs: [media.surface.recorder-orchestrator]
      ownerApproval: NOT_CLAIMED
      independentAcceptance: NOT_CLAIMED
      implementationState: UNKNOWN
      qualificationState: NOT_EVALUATED
      runtimeAvailability: UNKNOWN
      executionAdmission: NOT_ADMITTED
    capabilityFamily:
      familyId: media.capability
      sourceAuditId: AUD-OPS-021
      requirementId: MEDIA-REQ-AUD-OPS-021-MODEL-PACKAGE-MANAGE
    capabilityDefinition:
      id: media.capability.model-package.manage
      scopeStatus: PROPOSAL_ONLY; owner disposition pending
      familyId: media.capability
      operation: model-package.manage
      label: Manage an exact model package
      definitionState: COORDINATOR_AUTHORED_PDP0_PROPOSAL; owner acceptance pending
      outcome: >-
        Define an explicit install, upgrade, migrate, or remove intent for one exact immutable model-package identity,
        version, digest, and source. This is a product-definition target only: no package acquisition, installation,
        model execution, provider selection, or production activation is currently admitted. Any later separately
        admitted operation is limited to that exact package target and declared purpose; unknown required evidence
        remains a non-success outcome.
      sourceScope:
        sourceAuditId: AUD-OPS-021
        sourcePhrase: Safe install/upgrade/migration and model removal
        ownerSurfaceProposal: media.surface.recorder-orchestrator
        ownerScopeApproval: NOT_CLAIMED
      actorRoles: [operator, administrator]
      actorBindingState: proposed-canonical-actor-refs; owner acceptance pending
      inputArtifactTypes:
        - exact-model-package-identity
        - exact-package-version-and-digest
        - exact-package-source-reference
        - requested-action-install-upgrade-migrate-or-remove
        - declared-purpose
        - caller-identity-and-operator-or-administrator-authority
        - exact-installed-package-reference-when-upgrading-migrating-or-removing
        - exact-source-and-target-package-references-when-migrating
      outputArtifactTypes:
        - exact-model-package-action-outcome
        - package-action-blocker-or-uncertainty
      preconditions:
        - Every request names the exact immutable package identity, version, digest, and source; upgrade, migration, and
          removal also name the exact installed package version being changed.
        - The caller has explicit operator or administrator authority for the declared purpose and requested action.
        - Rights, license, integrity, security, locality, compatibility, and exact machine/checkpoint qualification
          evidence required for the exact action is current and known before that action is eligible to proceed.
        - Migration identifies both exact package endpoints; no migration mapping or compatibility is inferred.
      supportedParameters: P0 defines the action meaning and required exact references only. Package identity, version,
        digest, source, migration, and result schemas are a PDP-1 data-contract handoff. No package, provider, model,
        machine/checkpoint qualification, or active profile is selected or admitted by this definition.
      actionSemantics:
        install: The definition describes only an explicit request for the named package version and digest from the
          declared source. Package acquisition remains NOT_ADMITTED until an exact package source, rights/license,
          security, locality, machine/checkpoint qualification, and owner admission record exists. No automatic
          download, substitute source, default model, or default provider is implied.
        upgrade: An explicit upgrade targets the exact installed package and exact replacement version, digest, and
          source. It does not mutate existing media, projects, or derived artifacts, and it does not silently switch
          the active profile.
        migrate: An explicit migration names the exact installed source package/version and exact destination
          package/version/digest/source. It requires a known compatible migration path, does not mutate existing media,
          projects, or derived artifacts, and does not silently switch the active profile.
        remove: An explicit removal targets only the exact named package/version/digest/source and preserves user media,
          projects, and derived artifacts. Active dependencies block removal; an unresolved removal is reported as
          BLOCKED, PARTIAL, or UNKNOWN, never as success.
      constraints:
        - An omitted, mutable, ambiguous, mismatched, or unknown package identity, version, digest, or source does not
          authorize substituting another package or provider.
        - Unknown or denied rights, license, integrity, security, locality, compatibility, or machine/checkpoint
          qualification evidence blocks the requested action; missing evidence is not permission.
        - Upgrade and migration do not alter existing media, projects, or derived artifacts and never silently change
          the active profile.
        - Removal cannot delete any package other than the exact requested package and cannot delete user media,
          projects, or derived artifacts.
        - Active dependencies or unresolved removal cannot be represented as completed or successful.
        - A missing or failed model is UNAVAILABLE or UNKNOWN; it cannot become synthetic success or an unauthorized
          cloud/provider fallback.
        - P0 defines no rollback, recovery guarantee, package availability, or runtime behavior.
        - This definition does not override reuse-decisions.yaml#notAdmittedByThisRecord; package acquisition and
          execution remain NOT_ADMITTED until that policy is changed by a separately authorized, source-current decision.
      actionStateReferences:
        action: install-upgrade-migrate-remove-exact-model-package
        stateCoverage: [not-admitted, completed, blocked, partial, outcome-unknown]
        stateModelBindingState: no-persistent-package-lifecycle-model-is-asserted-by-this-proposal
        stateModelRefs: []
      requiredAuthority:
        - identity-and-tenant-context
        - explicit-operator-or-administrator-authority-for-declared-purpose
        - exact-package-scope-and-action-permission
        - package-source-rights-and-license-evidence
