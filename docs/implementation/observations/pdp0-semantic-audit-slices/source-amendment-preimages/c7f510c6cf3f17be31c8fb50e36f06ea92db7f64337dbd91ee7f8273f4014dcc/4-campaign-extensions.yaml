        successOutputs:
          - artifactType: versioned-action-quality-rule-set-candidate
            requiredOnSuccess: true
          - artifactType: rule-set-validation-observation
            requiredOnSuccess: false
          - artifactType: candidate-operation-plan
            requiredOnSuccess: false
        nonSuccessOutputs:
          REJECTED: []
          UNKNOWN_OUTCOME: []
        semanticOutcomeContract:
          result: Return a versioned action/quality rule-set candidate, exact-version validation observation, or
            candidate operation plan only for the explicitly requested variant. None approves or executes the
            rules.
          outputDistinctions:
            - Candidate version identity is distinct from an approved or applied rule set.
            - Validation is distinct from runtime admission and rule execution.
            - A candidate operation plan is distinct from a produced media result.
          unknownDisposition: If version, scope, target operation, authority, or validation evidence is incomplete,
            report UNKNOWN or the applicable denied/unavailable state; do not reuse a different version or
            partially apply rules.
          sourceRefs:
            - .product-experience/pdp-0-product-truth/campaign-extensions.yaml#records/@id=AUD-SPEC-020/requirementDefinition
            - .product-experience/pdp-0-product-truth/campaign-extensions.yaml#records/@id=AUD-SPEC-020/intentDefinition
            - docs/implementation/references/MEDIA-UNIFIED-PRODUCTION-ATTACHED-COMBINED-AUDIT-V3-2026-10-17.json#originalAudit.inventory/@audit_id=AUD-SPEC-020
        effect:
          semanticOutcome: Return a candidate or validation observation for the explicit rule management request; no
            affected media operation is executed.
          sourcePreservationRequired: true
          noSilentFallback: true
          effectIntentScope: RULE_SET_CANDIDATE_OR_READ_ONLY_VALIDATION
        guards:
          preconditions:
            - Caller authority is scoped to the rule set and requested action.
            - Reuse or validation names the exact rule-set version and target operation.
            - Affected operations require separate admission before execution.
          authorityRefs:
            - identity-and-tenant-context
            - rule-set-scope-read-or-write-permission-as-applicable
            - operation-specific-policy-and-rights-for-each-affected-operation
          stateModelRefs: []
        errors:
