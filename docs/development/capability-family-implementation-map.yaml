externalOwnedDependencies:
  document-intelligence-v1-public-client: Ghatana Document Intelligence owns generic OCR execution and the public OCR gateway (MDI-001/PDP0-003-D4); Media consumes the v1 public client for scene/time/ROI-authorized results only.
  shared-identity-and-authorization: Ghatana Shared owns reusable identity/authorization primitives; Media capabilities still own their rights checks and effect admission.
  tools-action-plane: Ghatana Tools owns delegated agent execution surfaces that call Media APIs; Media owns invocation fencing and per-replay authorization.
  data-cloud-optional-downstream: Ghatana Data Cloud may index/project derived Media metadata as an optional downstream consumer (media.dev.optional-data-cloud-adapter); it is never a Media processing path or ledger.
