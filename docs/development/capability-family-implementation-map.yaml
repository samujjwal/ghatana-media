schemaVersion: media.capability-family-implementation-map.v1
productId: media
status: owner-directed-development-review; per-leaf implementation evidence is
  derived mechanically by the generator, never self-promoted to runtime support
purpose: >-
  Reviewed mapping from each PDP-0 capability family to the remaining-work task
  units that must complete it, the owning source paths that carry partial
  implementation evidence, and platform-owned dependencies the capability
  consumes without executing. Classification semantics:
  IMPLEMENTED only where the linked register task is VERIFIED; DELEGATED only
  where the capability intent executes wholly outside Media by owner decision;
  OPTIONAL_DEFERRED only where the leaf itself is scope-deferred; otherwise
  NOT_IMPLEMENTED with exact blocking task references.
sharedBlockingTaskRefs:
  - media.dev.domain-contract-parity
  - media.dev.rights-and-policy
  - media.dev.cross-surface-integration-harness
