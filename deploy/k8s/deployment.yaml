# NON-DEPLOYABLE compatibility record. The canonical executable runtime remains
# ghatana/services/media; this repo has no production cutover approval.
# replicas=0, runtime disabled and registry.invalid ensure fail-closed defaults.
# Construct a separate pinned-digest manifest only after release admission.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: media
  namespace: media-candidate-not-admitted
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: media-config
  namespace: media-candidate-not-admitted
data:
  MEDIA_RUNTIME_ENABLED: "false"
  MEDIA_RUNTIME_ENVIRONMENT: "internal"
  MEDIA_HTTP_PORT: "8095"
  MEDIA_LOCAL_STORES_ENABLED: "false"
  MEDIA_LOCAL_PROVIDER_ENABLED: "false"
  MEDIA_ARTIFACT_STORE_ID: "s3-postgresql"
  MEDIA_JOB_STORE_ID: "postgresql"
  MEDIA_STREAM_STORE_ID: "postgresql"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media
  namespace: media-candidate-not-admitted
  labels:
    app.kubernetes.io/name: media
    app.kubernetes.io/version: "not-admitted"
    app.kubernetes.io/part-of: ghatana
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: media
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media
        ghatana.io/runtime: "false"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8095"
    spec:
      serviceAccountName: media
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1007
        runAsGroup: 1007
        fsGroup: 1007
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: media
          image: registry.invalid/ghatana-media/runtime:not-admitted
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8095
          envFrom:
            - configMapRef:
                name: media-config
            - secretRef:
                name: media-runtime-secret
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: media
  namespace: media-candidate-not-admitted
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: media
  ports:
    - name: http
      port: 8095
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: media
  namespace: media-candidate-not-admitted
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: media
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: media-runtime-default-deny
  namespace: media-candidate-not-admitted
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: media
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              ghatana.io/runtime: "false"
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8095
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              ghatana.io/runtime: "false"
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
