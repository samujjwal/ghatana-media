components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    apiKeyAuth: { type: apiKey, in: header, name: X-API-Key }
  parameters:
    TenantHeader:
      {
        name: X-Tenant-Id,
        in: header,
        required: true,
        schema: { type: string, minLength: 1, maxLength: 255 },
      }
    PrincipalHeader:
      {
        name: X-Principal-Id,
        in: header,
        required: true,
        schema: { type: string, minLength: 1, maxLength: 255 },
      }
    CorrelationHeader:
      {
        name: X-Correlation-Id,
        in: header,
        required: true,
        schema: { type: string, minLength: 1, maxLength: 255 },
      }
    StreamTokenHeader:
      {
        name: X-Stream-Token,
        in: header,
        required: true,
        schema: { type: string, minLength: 32 },
        description: One-time-issued opaque stream connection token,
      }
    ConsentId:
      {
        name: consentId,
        in: path,
        required: true,
        schema: { type: string, minLength: 1, maxLength: 255 },
      }
    UploadId:
      {
        name: uploadId,
        in: path,
        required: true,
        schema: { type: string, minLength: 1 },
      }
    JobId:
      {
        name: jobId,
        in: path,
        required: true,
        schema: { type: string, minLength: 1 },
      }
    SessionId:
      {
        name: sessionId,
        in: path,
        required: true,
        schema: { type: string, minLength: 1 },
      }
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Tenant- and principal-scoped key. Reuse with a different payload is rejected.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IfMatchHeader:
      name: If-Match
      in: header
      required: true
      description: Expected current resource version or strong entity tag.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  schemas:
    MediaProviderResponse:
      type: object
      additionalProperties: false
      required:
        - processingProviders
        - streamingProviders
        - capabilityProfiles
        - artifactStoreId
        - jobStoreId
        - streamStoreId
        - consentAdministrationId
        - genericModelIntegration
        - metadataIntegration
      properties:
        processingProviders: { type: array, items: { type: string } }
        streamingProviders: { type: array, items: { type: string } }
        capabilityProfiles:
          type: array
          items: { $ref: "#/components/schemas/MediaCapabilityProfile" }
        artifactStoreId: { type: string }
        jobStoreId: { type: string }
        streamStoreId: { type: string }
        consentAdministrationId: { type: string }
        genericModelIntegration: { type: string }
        metadataIntegration: { type: string }
    MediaCapabilityProfile:
      type: object
      additionalProperties: false
      required:
        - providerId
        - providerVersion
        - modality
        - codecs
        - containers
        - sampleRatesHz
        - maximumWidth
        - maximumHeight
        - modelVersions
        - regions
        - processingBoundary
        - timingAvailable
        - confidenceAvailable
        - biometricDerivativesAvailable
      properties:
        providerId: { type: string }
        providerVersion: { type: string }
        modality:
          {
            type: string,
            enum:
              [TRANSCODE, SPEECH_TO_TEXT, TEXT_TO_SPEECH, VISION, MULTIMODAL],
          }
        codecs: { type: array, items: { type: string } }
        containers: { type: array, items: { type: string } }
        sampleRatesHz:
          { type: array, items: { type: integer, minimum: 1, maximum: 768000 } }
        maximumWidth: { type: integer, minimum: 0, maximum: 65536 }
        maximumHeight: { type: integer, minimum: 0, maximum: 65536 }
        modelVersions: { type: array, minItems: 1, items: { type: string } }
        regions: { type: array, items: { type: string } }
        processingBoundary: { type: string, enum: [LOCAL, EXTERNAL] }
        timingAvailable: { type: boolean }
        confidenceAvailable: { type: boolean }
        biometricDerivativesAvailable: { type: boolean }
    ConsentGrantRequest:
      type: object
      required:
        [
          purposes,
          allowedRegions,
          externalProcessingAllowed,
          biometricProcessingAllowed,
        ]
      additionalProperties: false
      properties:
        purposes:
          {
            type: array,
            minItems: 1,
            uniqueItems: true,
            items: { type: string, minLength: 1, maxLength: 255 },
          }
        allowedRegions:
          {
            type: array,
            uniqueItems: true,
            items: { type: string, minLength: 1, maxLength: 255 },
          }
        externalProcessingAllowed: { type: boolean }
        biometricProcessingAllowed: { type: boolean }
        expiresAt: { type: [string, "null"], format: date-time }
    ConsentRecord:
      type: object
      required:
        [
          tenantId,
          consentId,
          principalId,
          purposes,
          allowedRegions,
          externalProcessingAllowed,
          biometricProcessingAllowed,
          grantedAt,
          version,
        ]
      properties:
        tenantId: { type: string }
        consentId: { type: string }
        principalId: { type: string }
        purposes: { type: array, items: { type: string } }
        allowedRegions: { type: array, items: { type: string } }
        externalProcessingAllowed: { type: boolean }
        biometricProcessingAllowed: { type: boolean }
        grantedAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
        version: { type: integer, format: int64, minimum: 1 }
    UploadRequest:
      type: object
      required:
        [
          tenantId,
          fileName,
          contentType,
          expectedSizeBytes,
          expectedSha256,
          classification,
          retention,
          metadata,
        ]
      properties:
        tenantId: { type: string }
        fileName: { type: string }
        contentType: { type: string }
        expectedSizeBytes:
          {
            type: integer,
            minimum: 1,
            maximum: 1073741824,
            description: Maximum 1 GiB upload.,
          }
        expectedSha256: { type: string, pattern: "^[0-9a-fA-F]{64}$" }
        classification: { type: string }
        retention: { type: string, format: duration }
        metadata:
          { type: object, additionalProperties: true, maxProperties: 64 }
    UploadSession: { type: object, additionalProperties: true }
    MediaArtifact: { type: object, additionalProperties: true }
    MediaGovernanceContext:
      type: object
      required:
        [
          purpose,
          residency,
          allowedRegions,
          externalProcessingAllowed,
          biometricProcessingAllowed,
        ]
      properties:
        consentId: { type: string }
        purpose: { type: string }
        residency: { type: string }
        allowedRegions: { type: array, items: { type: string } }
        externalProcessingAllowed: { type: boolean }
        biometricProcessingAllowed: { type: boolean }
    ProcessingJobRequest:
      type: object
      required:
        [
          requestId,
          tenantId,
          principalId,
          correlationId,
          artifactId,
          jobType,
          parameters,
        ]
      properties:
        requestId: { type: string }
        tenantId: { type: string }
        principalId: { type: string }
        correlationId: { type: string }
        artifactId: { type: string }
        jobType:
          {
            type: string,
            enum:
              [TRANSCODE, SPEECH_TO_TEXT, TEXT_TO_SPEECH, VISION, MULTIMODAL],
          }
        providerHint: { type: [string, "null"] }
        parameters:
          type: object
          additionalProperties: true
          maxProperties: 64
          properties:
            promotionTier:
              {
                type: string,
                enum: [DEIDENTIFIED],
                description: Requests semantic de-identification; fails closed unless a semantic redaction provider authorizes promotion,
              }
        governanceContext:
          { $ref: "#/components/schemas/MediaGovernanceContext" }
    ProcessingJob: { type: object, additionalProperties: true }
    StreamSessionRequest:
      type: object
      required:
        [
          tenantId,
          principalId,
          correlationId,
          streamKind,
          maximumBufferedBytes,
          leaseDuration,
          metadata,
        ]
      properties:
        tenantId: { type: string }
        principalId: { type: string }
        correlationId: { type: string }
        streamKind: { type: string, enum: [AUDIO, VIDEO, MULTIMODAL] }
        providerHint: { type: [string, "null"] }
        maximumBufferedBytes:
          { type: integer, format: int64, minimum: 1, maximum: 1073741824 }
        leaseDuration: { type: string, format: duration }
        metadata:
          { type: object, additionalProperties: true, maxProperties: 64 }
        governanceContext:
          { $ref: "#/components/schemas/MediaGovernanceContext" }
    StreamSession: { type: object, additionalProperties: true }
    StreamSessionRegistration:
      type: object
      required: [session, connectionToken]
      properties:
        session: { $ref: "#/components/schemas/StreamSession" }
        connectionToken: { type: string, minLength: 32, writeOnly: true }
    StreamAck:
      type: object
      required: [acceptedSequence, bufferedBytes, backpressured]
      properties:
        acceptedSequence: { type: integer, format: int64, minimum: 0 }
        bufferedBytes: { type: integer, format: int64, minimum: 0 }
        backpressured: { type: boolean }
    ErrorEnvelope:
      $ref: "#/components/schemas/PlatformErrorEnvelope"
    PlatformError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Z][A-Z0-9_]*$
        message:
          type: string
          minLength: 1
          maxLength: 2048
          description: Caller-safe detail selected from the stable error taxonomy; never raw provider exception text.
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
        evidenceRefs:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 512
        actionRefs:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 512
    PlatformResponseMeta:
      type: object
      additionalProperties: false
      required:
        - requestId
        - correlationId
        - timestamp
        - apiVersion
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 255
        correlationId:
          type: string
          minLength: 1
          maxLength: 255
        causationId:
          type: string
          minLength: 1
          maxLength: 255
        parentRunId:
          type: string
          minLength: 1
          maxLength: 255
        timestamp:
          type: string
          format: date-time
        apiVersion:
          type: string
          minLength: 1
          maxLength: 64
    PlatformErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error
        - meta
      properties:
        error:
          $ref: "#/components/schemas/PlatformError"
        meta:
          $ref: "#/components/schemas/PlatformResponseMeta"
    PlatformOperation:
      type: object
      additionalProperties: false
      required:
        - operationId
        - state
        - statusUrl
        - cancellable
        - retryable
        - createdAt
      properties:
        operationId:
          type: string
          minLength: 1
          maxLength: 255
        state:
          type: string
          enum:
            - ACCEPTED
            - QUEUED
            - RUNNING
            - SUCCEEDED
            - FAILED
            - CANCELLED
        statusUrl:
          type: string
          format: uri-reference
        cancelUrl:
          type: string
          format: uri-reference
        retryUrl:
          type: string
          format: uri-reference
        cancellable:
          type: boolean
        retryable:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        resultRef:
          type: string
          format: uri-reference
        error:
          $ref: "#/components/schemas/PlatformError"
  responses:
    Health:
      {
        description: Operational health snapshot,
        content:
          {
            application/json:
              { schema: { type: object, additionalProperties: true } },
          },
      }
    Error:
      {
        description: Fail-closed error envelope,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ErrorEnvelope" } },
          },
      }
x-ghatana-contract-versions:
  api: 1.0.0
  event: 1.0.0
  semantic: 1.0.0
  compatibilityPolicy: backward-compatible-within-major
x-ghatana-propagated-identity-headers:
  - X-Request-ID
  - X-Correlation-ID
  - X-Causation-ID
  - X-Parent-Run-ID
  - X-Tenant-ID
  - X-Ghatana-Delegation
