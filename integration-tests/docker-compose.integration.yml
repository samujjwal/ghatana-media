# Docker Compose configuration for audio-video integration tests.
#
# Used by AudioVideoContainerBase via bounded `docker compose run` probes.
# Both services expose:
#   - a gRPC port for the core API
#   - an HTTP port for liveness/readiness when a service is admitted
#
# Real images must be built from Java 27 candidate distributions (GH-90000).
# Until providers are admitted, the startup probes expect each process to exit
# with a typed NOT_ADMITTED reason before binding or publishing service ports.
# Override image names via AUDIO_VIDEO_STT_IMAGE / AUDIO_VIDEO_TTS_IMAGE
# environment variables when running locally against custom builds.

networks:
  audio-video-test:
    driver: bridge

services:

  stt-service:
    image: ${AUDIO_VIDEO_STT_IMAGE:-ghatana/stt-service:latest}
    networks:
      - audio-video-test
    ports:
      - "50051"
      - "8090"
    environment:
      AV_HEALTH_PORT: "8090"
      STT_PROVIDER_MODE: "NOP"
      STT_DEFAULT_MODEL: "whisper-tiny"
      LOG_LEVEL: "info"


  tts-service:
    image: ${AUDIO_VIDEO_TTS_IMAGE:-ghatana/tts-service:latest}
    networks:
      - audio-video-test
    ports:
      - "50052"
      - "8091"
    environment:
      TTS_GRPC_PORT: "50052"
      AV_HEALTH_PORT: "8091"
      TTS_PROVIDER_MODE: "LOCAL_ONNX"
      TTS_DEFAULT_VOICE: "en-US-default"
      LOG_LEVEL: "info"

